<script>
/* ===== js/20_world.js ===== */
/* ============================================================
   20_world.js — 타일맵 · 물리 · 엔티티 베이스 · 플레이어
   ============================================================ */
'use strict';

/* 타일 문자
   ' ' 빈칸   '#' 단단한 땅   '=' 발판(아래서 통과)   '^' 가시
   '~' 물     'm' 진흙        'H' 사다리              '.' 배경벽
   'X' 즉사   'B' 부서지는 발판                        'I' 얼음        */
const SOLID_CH = '#';
// 진흙은 밟고 설 수 있다. 다만 느리고, 서 있을수록 가라앉는다.
function isSolidCh(c){ return c==='#' || c==='m'; }
function isPlatCh(c){ return c==='='||c==='B'; }

class World {
  constructor(rows, theme, backKind){
    this.rows = rows.map(r=>r.split(''));
    this.h = this.rows.length;
    this.w = Math.max(...this.rows.map(r=>r.length));
    for(const r of this.rows) while(r.length<this.w) r.push(' ');
    this.pxw = this.w*TS; this.pxh = this.h*TS;
    this.theme = theme;
    this.tiles = getTiles(theme);
    this.back = getBack(theme, backKind);
    this.variant = [];
    RND = mulberry32(this.w*31+this.h*17);
    /* 타일 변형. 0번에만 창문이 들어가므로 균등하게 뽑으면 벽의 1/4 이 창이 되어
       격자 벽지처럼 보인다(실측). 0번을 드물게 뽑는다. */
    for(let y=0;y<this.h;y++){
      const row=[];
      for(let x=0;x<this.w;x++) row.push(rnd()<0.12? 0 : rndi(1,3));
      this.variant.push(row);
    }
    RND = mulberry32(20260825);
    this.broken = {};                 // 부서진 발판
    this.waterAnim = 0;
  }
  at(tx,ty){
    if(tx<0||ty<0||tx>=this.w||ty>=this.h) return (ty>=this.h)?' ':'#';
    return this.rows[ty][tx];
  }
  set(tx,ty,c){ if(tx>=0&&ty>=0&&tx<this.w&&ty<this.h) this.rows[ty][tx]=c; }
  solidAt(px_,py){ return isSolidCh(this.at(Math.floor(px_/TS), Math.floor(py/TS))); }
  chAtPx(px_,py){ return this.at(Math.floor(px_/TS), Math.floor(py/TS)); }

  // 사각형이 단단한 타일과 겹치는가
  hitsSolid(x,y,w,h){
    const x0=Math.floor(x/TS), x1=Math.floor((x+w-1)/TS);
    const y0=Math.floor(y/TS), y1=Math.floor((y+h-1)/TS);
    for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
      if(isSolidCh(this.at(tx,ty))) return true;
    }
    return false;
  }
  // 발밑 발판(한 방향)
  platformUnder(x,y,w,vy){
    if(vy<0) return null;
    const ty = Math.floor((y+ (arguments[4]||0) )/TS);
    const x0=Math.floor(x/TS), x1=Math.floor((x+w-1)/TS);
    for(let tx=x0;tx<=x1;tx++){
      const c=this.at(tx,ty);
      if(isPlatCh(c) && !this.broken[tx+','+ty]) return {tx,ty,c};
    }
    return null;
  }
  anyCh(x,y,w,h,chars){
    const x0=Math.floor(x/TS), x1=Math.floor((x+w-1)/TS);
    const y0=Math.floor(y/TS), y1=Math.floor((y+h-1)/TS);
    for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
      if(chars.indexOf(this.at(tx,ty))>=0) return {tx,ty,c:this.at(tx,ty)};
    }
    return null;
  }

  draw(x, cam){
    // 배경 레이어
    for(const L of this.back){
      if(L.fixed){ x.drawImage(L.c,0,0); continue; }
      let ox = -(cam.ox*L.speed) % L.c.width;
      if(ox>0) ox-=L.c.width;
      const oy = -cam.oy*L.speed*0.3;
      for(let i=0;i<3;i++) x.drawImage(L.c, Math.round(ox+i*L.c.width), Math.round(oy));
    }
    // 타일
    const T=this.tiles;
    const x0=Math.max(0,Math.floor(cam.ox/TS)-1), x1=Math.min(this.w-1, Math.floor((cam.ox+VW)/TS)+1);
    const y0=Math.max(0,Math.floor(cam.oy/TS)-1), y1=Math.min(this.h-1, Math.floor((cam.oy+VH)/TS)+1);
    this.waterAnim++;
    for(let ty=y0;ty<=y1;ty++){
      for(let tx=x0;tx<=x1;tx++){
        const c=this.rows[ty][tx];
        if(c===' ') continue;
        const dx=tx*TS-cam.ox, dy=ty*TS-cam.oy, v=this.variant[ty][tx];
        switch(c){
          case '#': {
            const above=this.at(tx,ty-1);
            x.drawImage(isSolidCh(above)? T.solid[v] : T.top[v], dx, dy);
            break;
          }
          case '.': x.drawImage(T.back[v], dx, dy); break;
          case '=': x.drawImage(T.plat[v%2], dx, dy); break;
          case 'B': if(!this.broken[tx+','+ty]){
                      x.globalAlpha = 0.85; x.drawImage(T.plat[v%2], dx, dy+(Math.sin(this.waterAnim*0.3+tx)*0.5|0)); x.globalAlpha=1;
                    } break;
          case '^': x.drawImage(T.hazard, dx, dy); break;
          case 'm': x.drawImage(this.at(tx,ty-1)==='m'? T.mudDeep : T.mud, dx, dy); break;
          case 'H': x.drawImage(T.ladder, dx, dy); break;
          case '~': {
            const above=this.at(tx,ty-1);
            if(above==='~') x.drawImage(T.waterDeep, dx, dy);
            else x.drawImage(T.water, dx, dy + (Math.sin((this.waterAnim*0.06)+tx*0.6)*1.4|0));
            break;
          }
          case 'X': break;
        }
      }
    }
  }
}

/* ---------------- 엔티티 베이스 ---------------- */
let ENT_ID = 1;
class Entity {
  constructor(x,y,w,h){
    this.id=ENT_ID++;
    this.x=x; this.y=y; this.w=w; this.h=h;
    this.vx=0; this.vy=0; this.onGround=false; this.facing=1;
    this.dead=false; this.hp=1; this.maxhp=1; this.frame=0; this.t=0;
    this.hurtT=0; this.grav=GRAV; this.solid=true;
  }
  get cx(){ return this.x+this.w/2; }
  get cy(){ return this.y+this.h/2; }
  get box(){ return {x:this.x,y:this.y,w:this.w,h:this.h}; }

  moveX(world, dx){
    if(dx===0) return false;
    const st = Math.sign(dx); let rem=Math.abs(dx), hit=false;
    while(rem>0){
      const s=Math.min(rem, 1); rem-=s;
      const nx = this.x + st*s;
      if(this.solid && world.hitsSolid(nx, this.y, this.w, this.h)){ hit=true; this.vx=0; break; }
      this.x = nx;
    }
    return hit;
  }
  moveY(world, dy, dropThrough){
    if(dy===0) return false;
    const st=Math.sign(dy); let rem=Math.abs(dy), hit=false;
    while(rem>0){
      const s=Math.min(rem,1); rem-=s;
      const ny=this.y + st*s;
      if(this.solid && world.hitsSolid(this.x, ny, this.w, this.h)){ hit=true; break; }
      // 한 방향 발판
      if(st>0 && !dropThrough){
        const footNow = this.y+this.h, footNext = ny+this.h;
        const ty = Math.floor(footNext/TS);
        if(Math.floor((footNow-0.01)/TS) < ty || (footNow % TS === 0 && footNext % TS !== 0)){
          const x0=Math.floor(this.x/TS), x1=Math.floor((this.x+this.w-1)/TS);
          let found=false;
          for(let tx=x0;tx<=x1;tx++){
            const c=world.at(tx,ty);
            if(isPlatCh(c) && !world.broken[tx+','+ty] && footNow <= ty*TS+2){ found=true; this._platTile=tx+','+ty; this._platC=c; break; }
          }
          if(found){ this.y = ty*TS - this.h; hit=true; break; }
        }
      }
      this.y=ny;
    }
    if(hit){ if(st>0) this.onGround=true; this.vy=0; }
    return hit;
  }
  physics(world, dropThrough){
    this.vy = Math.min(this.vy + this.grav, MAXFALL);
    this.onGround=false;
    this.moveX(world, this.vx);
    this.moveY(world, this.vy, dropThrough);
  }
  drawSprite(x, cam, sheet, sw, sh){
    const img = this.facing<0 ? sheet.l : sheet.r;
    const dx = Math.round(this.cx - img.width/2 - cam.ox);
    const dy = Math.round(this.y + this.h - img.height - cam.oy) + (this.yOff||0);
    if(this.hurtT>0 && (this.hurtT>>1)%2===0){
      x.globalAlpha=0.9;
      x.drawImage(tintCanvas(img,'#ffffff',1), dx, dy);
      x.globalAlpha=1;
    } else x.drawImage(img, dx, dy);
  }
}

/* ---------------- 플레이어 ---------------- */
const PSTATE = {IDLE:0, RUN:1, JUMP:2, FALL:3, ATTACK:4, HURT:5, DEAD:6, CLIMB:7, LOCK:8, PRAY:9, SWIM:10};

class Player extends Entity {
  constructor(x,y){
    super(x,y,12,24);
    this.state=PSTATE.IDLE;
    this.level=1; this.exp=0; this.expNext=24;
    this.maxhp=20; this.hp=20;
    this.maxfaith=20; this.faith=20;
    this.atk=4; this.def=0;
    this.coins=0;
    this.burden=true;              // ★ 게임의 핵심 상태
    this.hasSword=false; this.hasShield=false; this.canDouble=false; this.canDash=false;
    this.armor={helm:false, plate:false, belt:false, boots:false, shield:false, sword:false};
    this.items={roll:false, key:false, torch:false};
    this.faithfulness=0;
    this.coyote=0; this.jumpBuf=0; this.jumps=0;
    this.atkT=0; this.atkStep=0; this.atkCool=0; this.comboT=0;
    this.dashT=0; this.dashCool=0;
    this.invT=0; this.hurtT=0;
    this.animT=0; this.animF=0;
    this.blocking=false; this.blockT=0;
    this.prayT=0;
    this.sinking=0;                // 늪/강 침몰
    this.stamina=100; this.maxStamina=100;
    this.sleep=0;                  // 마법에 걸린 땅
    this.doubt=0;                  // 어둠의 골짜기
    this.lockT=0;
    this.deathT=0;
    this.hitList=[];
    this.footT=0;
    this.spawnX=x; this.spawnY=y;
    this.weak=false;               // 의심의 성에서 굶주림
  }
  get sheet(){
    if(this.armor.plate) return this.hasShield? ART.chars.pcArmor : ART.chars.pcArmorNS;
    if(this.hasSword) return ART.chars.pcSword;
    if(!this.burden) return ART.chars.pcFree;
    return ART.chars.pcBurden;
  }
  get speedMax(){
    let s = this.burden? 1.20 : 1.62;
    if(this.armor.boots) s += 0.24;
    if(this.weak) s *= 0.72;
    if(this.inMud) s *= 0.45;
    return s;
  }
  get jumpPow(){
    let j = this.burden? 5.80 : 6.55;
    if(this.armor.boots) j += 0.35;
    if(this.weak) j *= 0.85;
    if(this.inMud) j *= (1 - clamp(this.sinking/26,0,1)*0.42);   // 깊이 빠질수록 못 뛴다
    return j;
  }

  gainExp(n){
    this.exp += n;
    Audio2.sfx('exp');
    while(this.exp >= this.expNext){
      this.exp -= this.expNext; this.level++;
      this.expNext = Math.floor(this.expNext*1.42)+8;
      this.maxhp += 4; this.hp = this.maxhp;
      this.maxfaith += 3; this.faith = this.maxfaith;
      this.atk += 1;
      Audio2.sfx('levelup');
      G.particles.burst(this.cx, this.cy, 26, {color:'#ffe08a', spd:2.2, life:40, glow:true, grav:-0.02, size:2});
      G.toast(`레벨 ${this.level}!  최대 HP·믿음 상승`, '#ffe08a');
    }
  }
  heal(n){ this.hp=Math.min(this.maxhp,this.hp+n); Audio2.sfx('heal');
    G.particles.burst(this.cx,this.cy,12,{color:'#7ce88a',spd:1.2,life:30,grav:-0.04,size:2,glow:true}); }
  restoreFaith(n){ this.faith=Math.min(this.maxfaith,this.faith+n);
    G.particles.burst(this.cx,this.cy,10,{color:'#5ec8f0',spd:1.1,life:28,grav:-0.05,size:2,glow:true}); }

  hurt(n, fromX, opts){
    if(this.invT>0 || this.state===PSTATE.DEAD) return false;
    opts=opts||{};
    if(this.blocking && !opts.unblockable){
      Audio2.sfx('shield');
      G.particles.burst(this.cx+this.facing*8, this.cy, 10, {color:'#cfe8ff', spd:2, life:20, glow:true, size:2});
      this.vx = -sign(fromX-this.cx)*1.6;
      this.faith = Math.max(0, this.faith-2);
      G.cam.addShake(2);
      return false;
    }
    let dmg = Math.max(1, n - this.def);
    this.hp -= dmg;
    this.invT = 66; this.hurtT = 22;
    this.state = PSTATE.HURT; this.lockT = 12;
    this.vx = -sign(fromX-this.cx)*2.4 || -2.4;
    this.vy = -2.6;
    Audio2.sfx('hurt');
    G.cam.addShake(4.5);
    G.particles.burst(this.cx, this.cy, 12, {color:'#e04a4a', spd:2, life:26, size:2});
    G.dmgNum(this.cx, this.y, dmg, '#ff6a6a');
    if(this.hp<=0){ this.hp=0; this.die(); }
    return true;
  }
  die(){
    this.state=PSTATE.DEAD; this.deathT=0; this.vx=0; this.vy=-3.2;
    Audio2.sfx('die'); Audio2.stop(); G.cam.addShake(7);
  }

  startAttack(){
    if(!this.hasSword) return;
    if(this.atkCool>0) return;
    this.atkStep = (this.comboT>0)? (this.atkStep+1)%3 : 0;
    this.comboT = 26; this.atkT = 13; this.atkCool = 12;
    this.state = PSTATE.ATTACK;
    this.hitList = [];
    Audio2.sfx('swing');
    if(this.onGround) this.vx += this.facing*0.9;
  }
  attackBox(){
    if(this.atkT<=0) return null;
    const reach = this.atkStep===2? 30:24;
    const hh = this.atkStep===2? 26:18;
    return {x: this.facing>0? this.x+this.w-2 : this.x-reach+2, y:this.y-2, w:reach, h:hh};
  }
  attackDmg(){
    let d = this.atk + (this.atkStep===2? 3:0);
    if(this.armor.sword) d += 4;
    if(this.weak) d = Math.max(1, Math.floor(d*0.6));
    return d;
  }

  castPromise(){
    const cost=10;
    if(this.faith < cost || !this.hasSword) { Audio2.sfx('deny'); return; }
    this.faith -= cost;
    G.projectiles.push(new LightBolt(this.cx + this.facing*8, this.cy-2, this.facing*3.4, 0, this.atk+6));
    Audio2.sfx('item');
    G.particles.burst(this.cx+this.facing*10, this.cy, 10, {color:'#ffe9a0', spd:1.4, life:20, glow:true, size:2});
  }

  update(world, ctl){
    this.t++;
    if(this.invT>0) this.invT--;
    if(this.hurtT>0) this.hurtT--;
    if(this.atkCool>0) this.atkCool--;
    if(this.comboT>0) this.comboT--;
    if(this.dashCool>0) this.dashCool--;
    if(this.lockT>0) this.lockT--;
    if(this.blockT>0) this.blockT--;

    if(this.state===PSTATE.DEAD){
      this.deathT++;
      this.vy=Math.min(this.vy+GRAV, MAXFALL); this.y+=this.vy;
      return;
    }
    const ctlOn = ctl!==false && this.lockT<=0;

    // 환경
    this.inMud = !!world.anyCh(this.x+2, this.y+this.h, this.w-4, 3, 'm') && this.onGround;
    const inWater = !!world.anyCh(this.x, this.y+4, this.w, this.h-4, '~');
    const onLadder = !!world.anyCh(this.x+2, this.y, this.w-4, this.h, 'H');
    const spike = world.anyCh(this.x+2, this.y+2, this.w-4, this.h-4, '^X');

    if(spike && this.invT<=0){
      if(spike.c==='X'){
        // 즉사 대신 큰 피해 + 마지막 안전한 자리로 되돌린다 (아이들이 반복 실패로 지치지 않게)
        this.hurt(5, this.cx, {unblockable:true});
        if(this.hp>0 && this.safeX!==undefined){
          this.x=this.safeX; this.y=this.safeY; this.vx=0; this.vy=0;
          this.invT=Math.max(this.invT,80);
          G.particles.burst(this.cx,this.cy,14,{color:'#8ad0ff',spd:1.6,life:26,size:2,glow:true});
        }
      }
      else this.hurt(4, this.cx + (this.facing*-1), {unblockable:false});
    }
    // 안전 지점 기록 — 단단한 땅 위에 서 있고, 위험 타일 근처가 아닐 때
    if(this.onGround && Math.abs(this.vy)<0.1 && !this.inMud){
      if(!world.anyCh(this.x-8, this.y, this.w+16, this.h+6, '^X~m')){
        this.safeX=this.x; this.safeY=this.y;
      }
    }

    // 사다리
    if(onLadder && ctlOn && (Input.down('up')||Input.down('down')||this.state===PSTATE.CLIMB)){
      this.state=PSTATE.CLIMB; this.vy=0; this.grav=0;
      const s = this.weak?0.8:1.15;
      if(Input.down('up')) this.vy=-s; else if(Input.down('down')) this.vy=s; else this.vy=0;
      if(Input.down('left')) this.vx=-0.5; else if(Input.down('right')) this.vx=0.5; else this.vx=0;
      if(Input.pressed('jump')){ this.state=PSTATE.FALL; this.grav=GRAV; this.vy=-this.jumpPow*0.8; this.jumps=1; Audio2.sfx('jump'); }
      this.moveX(world,this.vx); this.moveY(world,this.vy,false);
      this.animT++; if(this.animT%9===0) this.animF++;
      return;
    } else if(this.state===PSTATE.CLIMB){ this.state=PSTATE.FALL; this.grav=GRAV; }

    // ---- 좌우 이동 ----
    let ax=0;
    if(ctlOn && this.state!==PSTATE.PRAY){
      if(Input.down('left')) ax=-1;
      if(Input.down('right')) ax=1;
    }
    const accel = this.onGround? 0.42 : 0.26;
    const fric  = this.onGround? (this.inMud?0.72:0.80) : 0.94;
    if(ax!==0){
      this.vx += ax*accel;
      this.vx = clamp(this.vx, -this.speedMax, this.speedMax);
      if(this.dashT<=0) this.facing = ax;
    } else if(this.dashT<=0){
      this.vx *= fric;
      if(Math.abs(this.vx)<0.05) this.vx=0;
    }

    // ---- 대시 (십자가 이후) ----
    if(this.dashT>0){
      this.dashT--;
      this.vx = this.facing*4.3;
      this.vy = 0; this.grav = 0;
      if(this.t%2===0) G.particles.spawn({x:this.cx,y:this.cy+4,vx:-this.facing*0.4,vy:0,life:16,max:16,size:3,color:'#cfe8ff',grav:0,glow:true,shrink:true});
      if(this.dashT===0){ this.grav=GRAV; this.vx=this.facing*1.6; }
    } else if(ctlOn && this.canDash && Input.pressed('dash') && this.dashCool<=0 && this.faith>=4){
      this.dashT=10; this.dashCool=34; this.faith-=4; this.invT=Math.max(this.invT,12);
      Audio2.sfx('djump');
    }

    // ---- 점프 ----
    if(this.onGround){ this.coyote=7; this.jumps = this.canDouble?2:1; }
    else if(this.coyote>0) this.coyote--;
    if(ctlOn && Input.pressed('jump')) this.jumpBuf=7; else if(this.jumpBuf>0) this.jumpBuf--;

    const dropThrough = ctlOn && Input.down('down') && Input.pressed('jump');
    if(this.jumpBuf>0 && this.state!==PSTATE.ATTACK){
      if(this.coyote>0 || this.onGround){
        this.vy = -this.jumpPow; this.jumpBuf=0; this.coyote=0; this.onGround=false;
        this.jumps = (this.canDouble?2:1)-1;
        Audio2.sfx('jump');
        G.particles.burst(this.cx, this.y+this.h, 6, {color:'#d8d0c0', spd:0.9, life:16, size:2, grav:0.02});
      } else if(this.jumps>0 && this.canDouble){
        this.vy = -this.jumpPow*0.92; this.jumps--; this.jumpBuf=0;
        Audio2.sfx('djump');
        for(let i=0;i<10;i++){
          const a=(i/10)*Math.PI*2;
          G.particles.spawn({x:this.cx+Math.cos(a)*7,y:this.cy+6+Math.sin(a)*4,vx:Math.cos(a)*0.7,vy:Math.sin(a)*0.4,life:20,max:20,size:2,color:'#cfe8ff',grav:0.01,glow:true,shrink:true});
        }
      }
    }
    // 가변 점프 높이
    if(this.vy<0 && !Input.down('jump') && this.dashT<=0) this.vy *= 0.86;

    // ---- 공격 · 방어 · 기도 ----
    if(ctlOn && Input.pressed('attack')) this.startAttack();
    if(ctlOn && Input.pressed('skill')) this.castPromise();
    this.blocking = ctlOn && this.hasShield && this.armor.shield && Input.down('down') && this.onGround && Math.abs(this.vx)<0.3;
    if(ctlOn && Input.down('pray') && this.onGround && Math.abs(this.vx)<0.2){
      this.state=PSTATE.PRAY; this.prayT++;
      if(this.prayT%16===0){ this.restoreFaith(1); }
      if(this.prayT%8===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*10,y:this.y,vx:0,vy:-0.5,life:34,max:34,size:2,color:'#ffe9a0',grav:-0.01,glow:true,shrink:true});
      this.vx=0;
    } else { if(this.state===PSTATE.PRAY) this.state=PSTATE.IDLE; this.prayT=0; }

    if(this.atkT>0) this.atkT--;

    // ---- 물 ----
    if(inWater){
      this.vy = Math.min(this.vy, 1.1);
      if(ctlOn && Input.down('jump')) this.vy = -1.3;
      this.vx *= 0.9;
      if(this.t%14===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*8,y:this.y+4,vx:0,vy:-0.4,life:24,max:24,size:1,color:'#a8d8f0',grav:-0.01});
    }
    // ---- 진흙: 발이 빨려 들어간다 ----
    if(this.inMud){
      this.sinking = Math.min(this.sinking+0.13, 26);
      if(this.t%9===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*10,y:this.y+this.h-2,vx:(rnd()-0.5)*0.3,vy:-0.35,
        life:26,max:26,size:2,color:'#5a5240',grav:0.03,shrink:true});
      if(this.sinking>=26 && this.t%36===0){ this.hurt(2, this.cx, {unblockable:true}); this.sinking=17; }
    } else this.sinking = Math.max(0, this.sinking-0.9);
    this.yOff = this.inMud? Math.round(this.sinking*0.22) : 0;   // 가라앉아 보이게

    // ---- 물리 ----
    const wasAir = !this.onGround;
    this.physics(world, dropThrough);
    if(this.onGround && wasAir && this.vyPrev>3){ Audio2.sfx('land'); G.particles.burst(this.cx,this.y+this.h,6,{color:'#c8c0b0',spd:1.1,life:14,size:2,grav:0.04}); }
    this.vyPrev = this.vy;

    // 발소리
    if(this.onGround && Math.abs(this.vx)>0.4){
      this.footT++;
      if(this.footT> (this.burden?15:11)){ this.footT=0; Audio2.sfx('step');
        G.particles.spawn({x:this.cx-this.facing*4,y:this.y+this.h-1,vx:-this.facing*0.3,vy:-0.2,life:12,max:12,size:1,color:'#b8b0a0',grav:0.02}); }
    }

    // ---- 상태/애니 ----
    if(this.state!==PSTATE.PRAY){
      if(this.atkT>0) this.state=PSTATE.ATTACK;
      else if(this.hurtT>14) this.state=PSTATE.HURT;
      else if(!this.onGround) this.state = this.vy<0? PSTATE.JUMP : PSTATE.FALL;
      else if(Math.abs(this.vx)>0.25) this.state=PSTATE.RUN;
      else this.state=PSTATE.IDLE;
    }
    this.animT++;
    const rate = this.state===PSTATE.RUN? (this.burden?9:6) : 22;
    if(this.animT % rate === 0) this.animF++;

    // 믿음 서서히 회복
    if(this.t%40===0 && this.faith<this.maxfaith && this.state!==PSTATE.PRAY) this.faith=Math.min(this.maxfaith,this.faith+ (this.armor.helm?1:0));

    // 낙사
    if(this.y > world.pxh + 40){ this.hp=0; this.die(); }
  }

  currentFrame(){
    const S=this.sheet;
    switch(this.state){
      case PSTATE.RUN:    return S.walk[this.animF%4];
      case PSTATE.JUMP:   return S.jump;
      case PSTATE.FALL:   return S.fall;
      case PSTATE.ATTACK: return S.atk[this.atkStep];
      case PSTATE.HURT:   return S.hurt;
      case PSTATE.DEAD:   return S.dead;
      case PSTATE.CLIMB:  return S.climb[this.animF%2];
      case PSTATE.PRAY:   return S.pray;
      default:            return this.blocking? S.push : S.idleA[this.animF%4];
    }
  }
  draw(x, cam){
    // 방패 방어 이펙트
    if(this.blocking){
      x.globalAlpha=0.35; x.fillStyle='#cfe8ff';
      x.fillRect(Math.round(this.x-4-cam.ox), Math.round(this.y-4-cam.oy), this.w+8, this.h+6);
      x.globalAlpha=1;
    }
    if(this.invT>0 && (this.invT>>2)%2===0 && this.hurtT<=0) return;   // 무적 깜빡임
    this.drawSprite(x, cam, this.currentFrame());
    // 검 궤적
    if(this.atkT>6 && this.hasSword){
      const b=this.attackBox();
      if(b){
        x.globalAlpha=0.5; x.globalCompositeOperation='lighter';
        x.fillStyle='#e8f0ff';
        const p=(13-this.atkT)/7;
        x.fillRect(Math.round(b.x-cam.ox), Math.round(b.y+b.h*p*0.5-cam.oy), b.w, Math.max(2,6-p*4));
        x.globalCompositeOperation='source-over'; x.globalAlpha=1;
      }
    }
  }
}

/* ---------------- 발사체 ---------------- */
class Projectile extends Entity {
  constructor(x,y,vx,vy,dmg,friendly){
    super(x-4,y-4,8,8);
    this.vx=vx; this.vy=vy; this.dmg=dmg; this.friendly=!!friendly;
    this.grav=0; this.life=170; this.solid=false;
  }
  update(world){
    this.t++; this.life--;
    this.x+=this.vx; this.y+=this.vy;
    if(this.life<=0) this.dead=true;
    if(world.hitsSolid(this.x,this.y,this.w,this.h)){ this.onHitWall(); }
  }
  onHitWall(){ this.dead=true; G.particles.burst(this.cx,this.cy,6,{color:'#ffd08a',spd:1.2,life:14,size:2,glow:true}); }
  draw(x,cam){ x.fillStyle='#fff'; x.fillRect(Math.round(this.x-cam.ox),Math.round(this.y-cam.oy),this.w,this.h); }
}
class LightBolt extends Projectile {
  constructor(x,y,vx,vy,dmg){ super(x,y,vx,vy,dmg,true); this.w=12;this.h=8; this.life=90; }
  update(world){
    super.update(world);
    if(this.t%2===0) G.particles.spawn({x:this.cx,y:this.cy,vx:-this.vx*0.1,vy:(rnd()-0.5)*0.3,life:16,max:16,size:2,color:'#ffe9a0',grav:0,glow:true,shrink:true});
  }
  draw(x,cam){
    x.globalCompositeOperation='lighter';
    x.fillStyle='#fff6c0'; x.fillRect(Math.round(this.x-cam.ox),Math.round(this.y+2-cam.oy),12,4);
    x.fillStyle='rgba(255,220,120,0.6)'; x.fillRect(Math.round(this.x-2-cam.ox),Math.round(this.y-cam.oy),16,8);
    x.globalCompositeOperation='source-over';
  }
}
class FieryDart extends Projectile {
  constructor(x,y,vx,vy,dmg){ super(x,y,vx,vy,dmg,false); this.w=12;this.h=6; }
  draw(x,cam){
    const f=ART.creature.dart[this.t%8];
    const img = this.vx<0? f.l : f.r;
    x.drawImage(img, Math.round(this.cx-7-cam.ox), Math.round(this.cy-4-cam.oy));
  }
  update(world){
    super.update(world);
    if(this.t%3===0) G.particles.spawn({x:this.cx,y:this.cy,vx:0,vy:0,life:14,max:14,size:2,color:'#ff9a3a',grav:-0.02,glow:true,shrink:true});
  }
}

</script>
<script>
/* ===== js/30_actors.js ===== */
/* ============================================================
   30_actors.js — 적 · 보스 · NPC · 상호작용 오브젝트
   ============================================================ */
'use strict';

class Enemy extends Entity {
  constructor(x,y,w,h,opt){
    super(x,y,w,h);
    opt=opt||{};
    this.maxhp=opt.hp||10; this.hp=this.maxhp;
    this.touch=opt.touch||3;
    this.exp=opt.exp||6;
    this.name=opt.name||'적';
    this.kind=opt.kind||'wisp';
    this.speed=opt.speed||0.5;
    this.homeX=x; this.homeY=y;
    this.range=opt.range||110;
    this.patrolW=opt.patrol||48;
    this.knock=0; this.flash=0;
    this.aggro=false;
    this.coin=opt.coin||1;
    this.yOff=0;
  }
  takeHit(dmg, fromX, crit){
    this.hp -= dmg; this.flash=8; this.knock = sign(this.cx-fromX)*2.2;
    this.aggro=true;
    Audio2.sfx(crit?'crit':'hit');
    G.cam.addShake(crit?4:2);
    G.dmgNum(this.cx, this.y-2, dmg, crit?'#ffd75e':'#ffffff', crit);
    G.particles.burst(this.cx, this.cy, crit?12:7, {color:'#ffd8a0', spd:1.8, life:20, size:2, glow:true});
    if(this.hp<=0) this.kill();
  }
  kill(){
    if(this.dead) return;
    this.dead=true;
    G.particles.burst(this.cx, this.cy, 18, {color:'#8a8ac0', spd:2.1, life:30, size:3, shrink:true});
    G.particles.burst(this.cx, this.cy, 8, {color:'#ffffff', spd:1.2, life:18, size:2, glow:true});
    Audio2.sfx('hit');
    G.player.gainExp(this.exp);
    for(let i=0;i<this.coin;i++) G.pickups.push(new Pickup(this.cx+(rnd()-0.5)*10, this.cy, 'coin'));
    if(rnd()<0.20) G.pickups.push(new Pickup(this.cx, this.cy, rnd()<0.5?'heart':'faith'));
    // 싸워서 만난 상대도 도감에 남는다 (벨세불의 궁수처럼 말 없는 인물)
    if(this.codexKey) codexMeet('char', this.codexKey);
    G.onEnemyKilled && G.onEnemyKilled(this);
  }
  seePlayer(){ return dist2(this.cx,this.cy,G.player.cx,G.player.cy) < this.range*this.range; }
  common(world){
    this.t++;
    if(this.flash>0) this.flash--;
    if(this.knock!==0){ this.x += this.knock; this.knock*=0.8; if(Math.abs(this.knock)<0.1) this.knock=0; }
    if(this.t%7===0) this.frame++;
    // 접촉 피해
    if(!G.player.dead && G.player.state!==PSTATE.DEAD && aabb(this.box, G.player.box)){
      G.player.hurt(this.touch, this.cx);
    }
  }
  update(world){ this.common(world); }
  draw(x,cam){
    const set = ART.creature[this.kind];
    if(!set) return;
    const f = set[this.frame % set.length];
    const img = this.facing<0? f.l : f.r;
    const dx=Math.round(this.cx-img.width/2-cam.ox), dy=Math.round(this.y+this.h-img.height-cam.oy)+this.yOff;
    if(this.flash>0){ x.drawImage(tintCanvas(img,'#ffffff',1), dx, dy); }
    else x.drawImage(img,dx,dy);
    if(this.hp<this.maxhp && !this.dead){
      const w=this.w+6, bx=Math.round(this.cx-w/2-cam.ox), by=Math.round(this.y-6-cam.oy)+this.yOff;
      x.fillStyle='rgba(0,0,0,0.6)'; x.fillRect(bx,by,w,3);
      x.fillStyle='#e04a4a'; x.fillRect(bx+1,by+1,Math.max(0,(w-2)*this.hp/this.maxhp),1);
    }
  }
}

/* ---------------- 보스: 아볼루온 ---------------- */
class Apollyon extends Entity {
  constructor(x,y){
    super(x,y,78,104);          // 플레이어(24px)의 4배 넘는 키 — 마주 서면 압도된다
    this.maxhp=210; this.hp=this.maxhp;
    this.lastPhase=0; this.smokeT=0;
    this.phase=0; this.name='아볼루온';
    this.state='idle'; this.stateT=0; this.cool=90;
    this.facing=-1; this.flash=0; this.grav=GRAV;
    this.isBoss=true; this.introT=0;
    this.hitCd=0;
  }
  get phaseIdx(){ return this.hp > this.maxhp*0.66 ? 0 : (this.hp > this.maxhp*0.3 ? 1 : 2); }
  takeHit(dmg, fromX, crit){
    if(this.state==='intro') return;
    // 겸손의 골짜기: 갑주가 없으면 피해가 거의 안 들어간다
    const armored = G.player.armor.sword;
    const real = armored? dmg : Math.max(1, Math.floor(dmg*0.25));
    const before=this.phaseIdx;
    this.hp -= real; this.flash=7;
    Audio2.sfx(crit?'crit':'hit'); G.cam.addShake(crit?5:3);
    if(crit) G.hitStop(5);
    if(this.phaseIdx>before){        // 페이즈 전환 — 더 뜨거워진다
      G.hitStop(18); G.cam.addShake(10); Audio2.sfx('roar');
      G.player.faith=Math.max(0,G.player.faith-4);
      G.particles.burst(this.cx,this.cy,34,{color:'#ff7a20',spd:3,life:50,size:4,glow:true,shrink:true});
      G.toast(LANG==='ko'? '아볼루온이 더 사나워졌다':'Apollyon grows fiercer', '#ff8a6a');
    }
    G.dmgNum(this.cx, this.y+10, real, armored? (crit?'#ffd75e':'#ffffff') : '#8a8a9a');
    if(!armored && this.t%30===0) G.toast('성령의 검이 없이는 이 자를 이길 수 없다', '#c8a0a0');
    G.particles.burst(fromX + sign(this.cx-fromX)*10, G.player.cy, 8, {color:'#ffd8a0',spd:1.6,life:18,size:2,glow:true});
    if(this.hp<=0){ this.hp=0; this.defeat(); }
  }
  defeat(){
    this.state='dying'; this.stateT=0;
    Audio2.stop(); Audio2.sfx('roar');
  }
  update(world){
    this.t++;
    if(this.flash>0) this.flash--;
    if(this.hitCd>0) this.hitCd--;
    const p=G.player;
    if(this.t%6===0) this.frame++;
    // 몸에서 연기가 샌다
    if(this.t%5===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*40, y:this.y+18+rnd()*30, vx:(rnd()-0.5)*0.2, vy:-0.5-rnd()*0.4,
      life:56,max:56,size:rndi(2,4), color: this.phaseIdx>=2? '#4a1810':'#1c1420', grav:-0.006, shrink:true});

    if(this.state==='dying'){
      this.stateT++;
      if(this.stateT%6===0){
        G.particles.burst(this.cx+(rnd()-0.5)*50, this.cy+(rnd()-0.5)*56, 10, {color:'#ff8040',spd:2,life:30,size:3,glow:true});
        Audio2.sfx('hit'); G.cam.addShake(4);
      }
      if(this.stateT>90){ this.dead=true; G.onBossDefeat && G.onBossDefeat(this); }
      return;
    }
    if(this.state==='intro'){ this.stateT++; if(this.stateT>60){ this.state='idle'; this.cool=50; } return; }

    this.facing = sign(p.cx-this.cx)||this.facing;
    const ph=this.phaseIdx;

    if(this.state==='idle'){
      this.stateT++;
      this.vx = lerp(this.vx, sign(p.cx-this.cx)*(0.4+ph*0.22), 0.05);
      this.cool--;
      if(this.cool<=0){
        const opts = ph===0? ['darts','charge'] : ph===1? ['darts','charge','slam'] : ['darts','charge','slam','rain'];
        this.state = opts[rndi(0,opts.length-1)];
        this.stateT=0;
        this.cool = Math.max(38, 92 - ph*22);
      }
    }
    else if(this.state==='darts'){
      this.stateT++;
      this.vx*=0.85;
      if(this.stateT===18 || this.stateT===30 || (ph>=1 && this.stateT===42)){
        Audio2.sfx('dart');
        const n = 3+ph;
        for(let i=0;i<n;i++){
          const a = Math.atan2(p.cy-this.cy, p.cx-this.cx) + (i-(n-1)/2)*0.24;
          G.projectiles.push(new FieryDart(this.cx+this.facing*18, this.cy-6, Math.cos(a)*2.6, Math.sin(a)*2.6, 5));
        }
      }
      if(this.stateT>58){ this.state='idle'; }
    }
    else if(this.state==='charge'){
      this.stateT++;
      if(this.stateT<26){ this.vx*=0.8;
        if(this.stateT===2) Audio2.sfx('boss');
        if(this.stateT===25) Audio2.sfx('roar');
        if(this.t%3===0) G.particles.spawn({x:this.cx+this.facing*20,y:this.cy+10,vx:this.facing*0.8,vy:0,life:16,max:16,size:3,color:'#ff5a20',grav:0,glow:true,shrink:true});
      }
      else if(this.stateT<70){ this.vx = this.facing*(2.6+ph*0.5);
        if(this.t%2===0) G.particles.spawn({x:this.cx,y:this.y+this.h-4,vx:-this.facing*1.2,vy:-0.4,life:22,max:22,size:4,color:'#c8703a',grav:0.02,glow:true,shrink:true});
      }
      else { this.vx*=0.86; if(this.stateT>92) this.state='idle'; }
    }
    else if(this.state==='slam'){
      this.stateT++;
      if(this.stateT<20){ this.vx*=0.8; this.vy=-5; }
      else if(this.stateT<40){ this.vy=Math.min(this.vy+0.9, 9); }
      if(this.onGround && this.stateT>24){
        G.cam.addShake(8); Audio2.sfx('boss');
        for(let i=0;i<3;i++){
          G.projectiles.push(new FieryDart(this.cx, this.y+this.h-6, (i-1)*1.8-1.2, -2.2, 5));
          G.projectiles.push(new FieryDart(this.cx, this.y+this.h-6, (i-1)*1.8+1.2, -2.2, 5));
        }
        G.particles.burst(this.cx, this.y+this.h, 24, {color:'#c8a878',spd:3,life:30,size:3});
        this.state='idle'; this.stateT=0;
      }
      if(this.stateT>110) this.state='idle';
    }
    else if(this.state==='rain'){
      this.stateT++;
      this.vx*=0.9;
      if(this.stateT%9===0 && this.stateT<70){
        const rx = G.cam.ox + rnd()*VW;
        G.projectiles.push(new FieryDart(rx, G.cam.oy-10, 0, 2.6, 5));
        Audio2.sfx('dart');
      }
      if(this.stateT>96) this.state='idle';
    }

    this.vy=Math.min(this.vy+this.grav, MAXFALL);
    this.onGround=false;
    this.moveX(world,this.vx);
    this.moveY(world,this.vy,false);
    if(this.x<16){this.x=16;this.vx=0;} if(this.x+this.w>world.pxw-16){this.x=world.pxw-16-this.w;this.vx=0;}

    if(this.hitCd<=0 && aabb(this.box, p.box)){
      if(p.hurt(6+this.phaseIdx*2, this.cx)) this.hitCd=24;
    }
  }
  draw(x,cam){
    const set=ART.boss.apollyon[this.phaseIdx];
    const f=set[this.frame%set.length];
    let img=this.facing<0? f.l : f.r;
    const S=1.35;                                    // 스프라이트도 같이 키운다
    const w=Math.round(img.width*S), h=Math.round(img.height*S);
    const dx=Math.round(this.cx-w/2-cam.ox), dy=Math.round(this.y+this.h-h-cam.oy);
    if(this.state==='charge' && this.stateT<26 && (this.stateT>>1)%2===0) img=tintCanvas(img,'#ff4020',1);
    else if(this.flash>0) img=tintCanvas(img,'#ffffff',1);
    x.drawImage(img, dx, dy, w, h);
  }
}

/* ---------------- 보스: 절망 거인 ---------------- */
class GiantDespair extends Entity {

    }

  update(world){

      return;

        const hb={x:bx,y:this.y+20,w:40,h:50};
        if(aabb(hb,p.box)) p.hurt(9, this.cx);
        G.particles.burst(bx+20, this.y+64, 16, {color:'#6a6058',spd:2.4,life:24,size:3});
      }
      if(this.stateT>52) this.state='idle';
    }
    else if(this.state==='stomp'){
      this.stateT++;
      if(this.stateT<16){ this.vx*=0.8; this.vy=-4.4; }
      if(this.onGround && this.stateT>20){
        G.cam.addShake(9); Audio2.sfx('boss');
        // 낙석
        for(let i=0;i<5;i++){
          const rx=G.cam.ox+30+rnd()*(VW-60);
          G.projectiles.push(new Rock(rx, G.cam.oy-14));
        }
        this.state='idle'; this.stateT=0;
      }
      if(this.stateT>100) this.state='idle';
    }
    else if(this.state==='grasp'){
      this.stateT++;
      if(this.stateT<24){ this.vx*=0.85; }
      else if(this.stateT<64){ this.vx=this.facing*2.2; }
      else { this.vx*=0.85; if(this.stateT>84) this.state='idle'; }
    }
    this.vy=Math.min(this.vy+this.grav,MAXFALL); this.onGround=false;
    this.moveX(world,this.vx); this.moveY(world,this.vy,false);
    if(this.x<16){this.x=16;} if(this.x+this.w>world.pxw-16){this.x=world.pxw-16-this.w;}
    if(this.hitCd<=0 && aabb(this.box,p.box)){ if(p.hurt(7+ph*2,this.cx)) this.hitCd=26; }
  }
  draw(x,cam){
    const set=ART.boss.despair[this.phaseIdx];
    const f=set[this.frame%set.length];
    let img=this.facing<0?f.l:f.r;
    const S=1.30;
    const w=Math.round(img.width*S), h=Math.round(img.height*S);
    const dx=Math.round(this.cx-w/2-cam.ox), dy=Math.round(this.y+this.h-h-cam.oy);
    if(this.flash>0) img=tintCanvas(img,'#ffffff',1);
    x.drawImage(img, dx, dy, w, h);
  }
}
class Rock extends Projectile {
  constructor(x,y){ super(x,y,0,1.4,6,false); this.grav=0.14; this.w=12;this.h=12; this.life=260; }
  update(world){
    this.t++; this.life--;
    this.vy=Math.min(this.vy+this.grav,6); this.y+=this.vy; this.x+=this.vx;
    if(world.hitsSolid(this.x,this.y+this.h,this.w,2)){
      this.dead=true; G.particles.burst(this.cx,this.cy,8,{color:'#6a6058',spd:1.6,life:20,size:2}); Audio2.sfx('land');
    }
    if(this.life<=0) this.dead=true;
  }
  draw(x,cam){
    x.fillStyle='#5a5248'; x.fillRect(Math.round(this.x-cam.ox),Math.round(this.y-cam.oy),12,12);
    x.fillStyle='#6e665a'; x.fillRect(Math.round(this.x-cam.ox),Math.round(this.y-cam.oy),12,3);
    x.fillStyle='#3a352e'; x.fillRect(Math.round(this.x+8-cam.ox),Math.round(this.y+4-cam.oy),4,8);
  }
}

/* ---------------- NPC ---------------- */
class NPC extends Entity {
  constructor(x,y,charKey,opt){
    super(x,y,14,26);
    opt=opt||{};
    this.charKey=charKey;
    this.name=opt.name||'';
    this.dialog=opt.dialog||null;      // 대화 스크립트 id
    this.face=opt.face||-1;
    this.facing=this.face;
    this.grav = opt.float? 0 : GRAV;
    this.pose=opt.pose||null;
    this.bobT=rndi(0,60);
    this.hidden=!!opt.hidden;
    this.onTalk=opt.onTalk||null;
    this.tag=opt.tag||null;
    this.once=opt.once||false;
    this.done=false;
    this.hint=opt.hint||'대화';
    this.walk=opt.walk||0;
    this.solidBody=false;
  }
  update(world){
    this.t++; this.bobT++;
    if(this.t%14===0) this.frame++;
    if(this.walk){
      this.vx = Math.sin(this.t*0.012)*this.walk;
      this.facing = this.vx<0?-1:1;
      this.moveX(world,this.vx);
    }
    if(this.grav){ this.vy=Math.min(this.vy+this.grav,MAXFALL); this.onGround=false; this.moveY(world,this.vy,false); }
    else { this.yOff = Math.sin(this.bobT*0.04)*2|0; }
  }
  canTalk(){ return !this.hidden && !(this.once&&this.done) && this.dialog && Math.abs(G.player.cx-this.cx)<26 && Math.abs(G.player.cy-this.cy)<32; }
  align(){ return (ART.chars[this.charKey] && ART.chars[this.charKey].align) || 'neutral'; }
  drawAura(x,cam){
    const al=this.align();
    if(al==='neutral') return;
    const cx=Math.round(this.cx-cam.ox), cy=Math.round(this.y+this.h/2-cam.oy)+(this.yOff||0);
    /* ⚠ 예전엔 alpha 0.20 짜리 옅은 빛이라 밝은 배경에선 아예 안 보였다.
       "빌런은 빌런답게, 선한 건 선하게" 가 화면에서 읽혀야 한다 — 세게 준다. */
    if(al==='good'){
      x.globalCompositeOperation='lighter';
      const r = 30+Math.sin(this.t*0.05)*4;
      const g=x.createRadialGradient(cx,cy,2,cx,cy,r);
      g.addColorStop(0,'rgba(255,244,200,0.55)');
      g.addColorStop(0.45,'rgba(255,230,150,0.22)');
      g.addColorStop(1,'rgba(255,225,140,0)');
      x.fillStyle=g; x.fillRect(cx-36,cy-40,72,80);
      // 발밑 빛 웅덩이 — 서 있는 자리가 밝다
      const g2=x.createRadialGradient(cx,cy+this.h/2-2,1,cx,cy+this.h/2-2,20);
      g2.addColorStop(0,'rgba(255,238,180,0.30)'); g2.addColorStop(1,'rgba(255,238,180,0)');
      x.fillStyle=g2; x.fillRect(cx-22,cy+this.h/2-10,44,20);
      x.globalCompositeOperation='source-over';
      if(this.t%7===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*20,y:this.y+this.h-4,vx:(rnd()-0.5)*0.14,vy:-0.36,
        life:60,max:60,size:2,color:'#fff3c0',grav:-0.005,glow:true,shrink:true});
    } else if(al==='evil'){
      // 발밑에서 피어오르는 그을음 + 붉은 기운
      x.globalCompositeOperation='multiply';
      const gd=x.createRadialGradient(cx,cy,2,cx,cy,30);
      gd.addColorStop(0,'rgba(70,30,50,0.85)'); gd.addColorStop(1,'rgba(120,90,110,1)');
      x.fillStyle=gd; x.fillRect(cx-34,cy-38,68,76);
      x.globalCompositeOperation='source-over';
      x.globalAlpha=0.75; x.fillStyle='#180b1e';
      for(let i=0;i<9;i++){
        const px_=cx-15+((i*7+((this.t>>2)%20))%32), py=cy+12-((this.t*0.5+i*9)%38);
        x.fillRect(px_, Math.round(py), 3, 3);
      }
      x.globalAlpha=1;
      // 붉은 눈빛 반사
      x.globalCompositeOperation='lighter';
      const ge=x.createRadialGradient(cx,cy-4,1,cx,cy-4,13);
      ge.addColorStop(0,'rgba(224,60,60,0.28)'); ge.addColorStop(1,'rgba(224,60,60,0)');
      x.fillStyle=ge; x.fillRect(cx-14,cy-18,28,28);
      x.globalCompositeOperation='source-over';
      if(this.t%9===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*18,y:this.y+this.h-2,vx:(rnd()-0.5)*0.22,vy:-0.32,
        life:70,max:70,size:3,color:'#2c1038',grav:-0.006,shrink:true});
    } else if(al==='weak'){
      if(this.t%40===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*10,y:this.y,vx:0,vy:-0.2,
        life:40,max:40,size:2,color:'#7a7a92',grav:0,shrink:true});
    }
  }
  draw(x,cam){
    if(this.hidden) return;
    this.drawAura(x,cam);
    const S=ART.chars[this.charKey] || ART.chars.townsman;
    let f;
    if(this.pose && S[this.pose]) f=S[this.pose];
    else if(this.walk) f=S.walk[this.frame%4];
    else f=S.idleA[this.frame%4];
    const img=this.facing<0?f.l:f.r;
    x.drawImage(img, Math.round(this.cx-img.width/2-cam.ox), Math.round(this.y+this.h-img.height-cam.oy)+(this.yOff||0));
    if(this.canTalk()){
      const by=Math.round(this.y-14-cam.oy+Math.sin(this.t*0.09)*1.5);
      x.fillStyle='#ffe08a'; x.fillRect(Math.round(this.cx-2-cam.ox), by, 4, 8);
      x.fillStyle='#fff6d0'; x.fillRect(Math.round(this.cx-1-cam.ox), by+1, 2, 4);
    }
  }
}

/* ---------------- 픽업 ---------------- */
class Pickup extends Entity {
  constructor(x,y,kind){
    super(x-5,y-5,10,10);
    this.kind=kind; this.grav=0.22;
    this.vy=-1.8-rnd(); this.vx=(rnd()-0.5)*1.4;
    this.life=600; this.magnet=false;
  }
  update(world){
    this.t++; this.life--;
    if(this.life<=0){ this.dead=true; return; }
    const p=G.player;
    const d=Math.hypot(p.cx-this.cx,p.cy-this.cy);
    if(d<34) this.magnet=true;
    if(this.magnet){
      this.vx=lerp(this.vx,(p.cx-this.cx)*0.16,0.35);
      this.vy=lerp(this.vy,(p.cy-this.cy)*0.16,0.35);
      this.x+=this.vx; this.y+=this.vy;
    } else {
      this.vy=Math.min(this.vy+this.grav,4);
      this.moveX(world,this.vx); this.moveY(world,this.vy,false);
      if(this.onGround){ this.vx*=0.85; }
    }
    if(d<11){ this.collect(); }
  }
  collect(){
    this.dead=true;
    const p=G.player;
    if(this.kind==='coin'){ p.coins++; Audio2.sfx('coin'); }
    else if(this.kind==='heart'){ p.heal(5); }
    else if(this.kind==='faith'){ p.restoreFaith(7); }
  }
  draw(x,cam){
    const ic = this.kind==='coin'? ART.icons.coin : this.kind==='heart'? ART.icons.heart : ART.icons.faith;
    const bob=Math.sin(this.t*0.14)*1.5|0;
    const a = this.life<90? (Math.floor(this.life/5)%2?0.3:1):1;
    x.globalAlpha=a;
    x.drawImage(ic, Math.round(this.cx-ic.width/2-cam.ox), Math.round(this.cy-ic.height/2-cam.oy)+bob);
    x.globalAlpha=1;
  }
}

/* ---------------- 상호작용 오브젝트 ---------------- */
class Prop extends Entity {
  constructor(x,y,imgKey,opt){
    opt=opt||{};
    const img = typeof imgKey==='string'? ART.obj[imgKey] : imgKey;
    super(x, y, opt.w||(img?img.width:16), opt.h||(img?img.height:16));
    this.img=img; this.imgKey=imgKey;
    this.opt=opt;
    this.interact=opt.interact||null;
    this.hint=opt.hint||'조사';
    this.once=opt.once||false; this.done=false;
    this.glow=opt.glow||false;
    this.back=opt.back||false;
    this.tag=opt.tag||null;
    this.hidden=!!opt.hidden;
  }
  update(){ this.t++; }
  canTalk(){ return !this.hidden && !!this.interact && !(this.once&&this.done) && aabb({x:this.x-8,y:this.y-8,w:this.w+16,h:this.h+16}, G.player.box); }
  draw(x,cam){
    if(this.hidden) return;
    let img=this.img;
    if(this.imgKey==='lion') img=ART.obj.lion[(this.t>>4)%4];
    if(this.done && this.imgKey==='chest') img=ART.obj.chestOpen;
    if(!img) return;
    if(this.glow){
      const gx=Math.round(this.cx-cam.ox), gy=Math.round(this.cy-cam.oy);
      const rad=Math.max(this.w,this.h)*0.85 + 16 + Math.sin(this.t*0.05)*4;
      const col=this.opt.glowColor||'#ffe9a0';
      const a=0.32+Math.sin(this.t*0.05)*0.10;
      x.globalCompositeOperation='lighter';
      const g=x.createRadialGradient(gx,gy,2,gx,gy,rad);
      g.addColorStop(0, hexA(col, a));
      g.addColorStop(0.45, hexA(col, a*0.42));
      g.addColorStop(1, hexA(col, 0));
      x.fillStyle=g;
      x.fillRect(gx-rad, gy-rad, rad*2, rad*2);
      x.globalCompositeOperation='source-over';
    }
    x.drawImage(img, Math.round(this.x-cam.ox), Math.round(this.y-cam.oy));
    if(this.canTalk()){
      const by=Math.round(this.y-12-cam.oy+Math.sin(this.t*0.09)*1.5);
      x.fillStyle='#ffe08a'; x.fillRect(Math.round(this.cx-2-cam.ox), by, 4, 8);
      x.fillStyle='#fff6d0'; x.fillRect(Math.round(this.cx-1-cam.ox), by+1, 2, 4);
    }
  }
}
/* 영역 트리거 */
class Trigger extends Entity {
  constructor(x,y,w,h,fn,opt){
    super(x,y,w,h); opt=opt||{};
    this.fn=fn; this.once=opt.once!==false; this.done=false; this.solid=false;
    this.needPress=opt.needPress||false; this.hint=opt.hint||'';
    this.tag=opt.tag||null;
  }
  update(){
    this.t++;
    if(this.done) return;
    if(aabb(this.box, G.player.box)){
      if(this.needPress){ if(Input.pressed('interact')){ this.done=this.once; this.fn(this); } }
      else { this.done=this.once; this.fn(this); }
    }
  }
  draw(x,cam){
    if(this.needPress && !this.done && aabb(this.box,G.player.box) && this.hint){
      // 힌트는 UI 레이어에서
      G.hintText = this.hint;
    }
  }
}

</script>
<script>
/* ===== js/40_ui.js ===== */
/* ============================================================
   40_ui.js — 대화 · HUD · 메뉴 · 여정 지도
   픽셀 프레임은 게임 캔버스에, 한글 텍스트는 고해상도 UI 캔버스에.
   ============================================================ */
'use strict';

/* ---------- 초상화 ---------- */
const PORTRAITS = {};
function heroKey(){
  const p=G.player;
  if(!p) return 'christian';
  if(p.armor && p.armor.plate) return 'pcArmorNS';
  if(p.hasSword) return 'pcSword';
  if(!p.burden) return 'pcFree';
  return 'christian';
}
function makePortrait(key){
  if(key==='christian') key = heroKey();          // 주인공은 지금 모습 그대로
  if(PORTRAITS[key]) return PORTRAITS[key];
  const S = ART.chars[key];
  const src = S? S.idle.r : ART.chars.townsman.idle.r;
  // 머리 + 어깨 흉상 (소품·모자까지 들어오게 넉넉히)
  const sx=5, sy=0, cw=24, ch=24, sc=2;
  const c = makeCanvas(cw*sc, ch*sc), x=ctxOf(c);
  const al = (key.indexOf('pc')===0 || key==='christian') ? 'hero' : ((S && S.align) || 'neutral');
  // 성향별 배경 — 선은 따뜻하게, 악은 차갑고 어둡게
  const bg = al==='good' ? ['#2e2a1c','#4a3f22'] : al==='evil' ? ['#1c1420','#2e1424']
           : al==='weak' ? ['#232030','#2e2a3c'] : al==='hero' ? ['#1e2436','#2f3a52']
           : ['#241f30','#332c42'];
  const g=x.createLinearGradient(0,0,0,ch*sc);
  g.addColorStop(0,bg[1]); g.addColorStop(1,bg[0]);
  x.fillStyle=g; x.fillRect(0,0,cw*sc,ch*sc);
  if(al==='good'){
    x.globalCompositeOperation='lighter';
    const r=x.createRadialGradient(cw,ch*0.7,2,cw,ch*0.7,cw*1.4);
    r.addColorStop(0,'rgba(255,230,150,0.30)'); r.addColorStop(1,'rgba(255,220,120,0)');
    x.fillStyle=r; x.fillRect(0,0,cw*sc,ch*sc);
    x.globalCompositeOperation='source-over';
  } else if(al==='evil'){
    x.fillStyle='rgba(12,6,14,0.5)';
    for(let i=0;i<6;i++) x.fillRect((i*9)%(cw*sc), (i*13)%(ch*sc), 6, 6);
  }
  x.imageSmoothingEnabled=false;
  x.drawImage(src, sx, sy, cw, ch, 0, 0, cw*sc, ch*sc);
  PORTRAITS[key]=c;
  return c;
}

/* ---------- 픽셀 프레임 ---------- */
function panel(x, px_, py, w, h, opt){
  opt=opt||{};
  const bg = opt.bg||'rgba(16,14,24,0.92)';
  const b1 = opt.b1||'#e8dcae';
  const b2 = opt.b2||'#6a5a3a';
  x.fillStyle=bg; x.fillRect(px_+2, py+2, w-4, h-4);
  x.fillStyle=b2; x.fillRect(px_+1, py, w-2, 1); x.fillRect(px_+1, py+h-1, w-2, 1);
  x.fillRect(px_, py+1, 1, h-2); x.fillRect(px_+w-1, py+1, 1, h-2);
  x.fillStyle=b1;
  x.fillRect(px_+2, py+1, w-4, 1); x.fillRect(px_+2, py+h-2, w-4, 1);
  x.fillRect(px_+1, py+2, 1, h-4); x.fillRect(px_+w-2, py+2, 1, h-4);
  x.fillStyle=b2;
  x.fillRect(px_+1,py+1,1,1); x.fillRect(px_+w-2,py+1,1,1);
  x.fillRect(px_+1,py+h-2,1,1); x.fillRect(px_+w-2,py+h-2,1,1);
}
function bar(x, px_, py, w, h, ratio, cFill, cBack, cEdge){
  x.fillStyle=cEdge||'#100e18'; x.fillRect(px_-1,py-1,w+2,h+2);
  x.fillStyle=cBack||'#3a3444'; x.fillRect(px_,py,w,h);
  const fw = Math.max(0, Math.round(w*clamp(ratio,0,1)));
  x.fillStyle=cFill; x.fillRect(px_,py,fw,h);
  x.fillStyle='rgba(255,255,255,0.35)'; x.fillRect(px_,py,fw,1);
}

/* ---------- 대화 ---------- */
class Dialogue {
  constructor(){
    this.active=false; this.script=null; this.i=0;
    this.text=''; this.shown=0; this.speed=1.2;
    this.who=null; this.name=''; this.mood='neutral';
    this.choices=null; this.sel=0;
    this.onEnd=null; this.lines=[]; this.holdT=0;
    this.boxY=VH-74; this.narration=false;
  }
  start(script, onEnd){
    this.active=true; this.paused=false; this.script=script.slice(); this.i=-1;
    this.onEnd=onEnd||null; this.choices=null;
    G.dialogueResult = null;
    this.next();
  }
  next(){
    this.i++;
    if(this.i>=this.script.length){ this.finish(); return; }
    const n=this.script[this.i];
    if(n.cine){                       // 컷신 — 재생이 끝나면 대사를 이어간다
      this.paused=true;
      Cinema.play(n.cine, ()=>{ this.paused=false; this.next(); });
      return;
    }
    if(n.act){ n.act(G); }
    if(n.jump!==undefined){ this.i = n.jump-1; this.next(); return; }
    if(n.choice){
      this.choices=n.choice; this.sel=0;
      this.who=n.who||this.who; this.name=n.name||this.name;
      this.text=n.text||''; this.shown=this.text.length;
      this.narration = !n.who;
      this.relayout();
      return;
    }
    if(n.text===undefined){ this.next(); return; }
    this.who=n.who!==undefined? n.who : this.who;
    this.name=n.name!==undefined? n.name : this.name;
    if(n.mood) this.mood=n.mood;              // 지정 없으면 직전 표정 유지
    this.text=n.text; this.shown=0; this.choices=null;
    this.narration = !this.who;
    this.holdT=0;
    this.relayout();
  }
  relayout(){
    const u = R.u;
    const maxw = this.narration? VW-64 : VW-92;
    this.lines = wrapText(u, this.text, 13, maxw);
  }
  finish(){
    this.active=false;
    const cb=this.onEnd; this.onEnd=null;
    if(cb) cb(G.dialogueResult);
  }
  update(){
    if(!this.active || this.paused) return;
    if(this.choices){
      if(Input.pressed('up')){ this.sel=(this.sel+this.choices.length-1)%this.choices.length; Audio2.sfx('select'); }
      if(Input.pressed('down')){ this.sel=(this.sel+1)%this.choices.length; Audio2.sfx('select'); }
      if(Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')){
        const ch=this.choices[this.sel];
        Audio2.sfx('confirm');
        G.dialogueResult = ch.val!==undefined? ch.val : this.sel;
        if(ch.f) G.player.faithfulness += ch.f;
        if(ch.act) ch.act(G);
        this.choices=null;
        if(ch.go!==undefined){ this.i=ch.go-1; this.next(); }
        else this.next();
      }
      return;
    }
    if(this.shown < this.text.length){
      // 한 번 탭하면 전문이 바로 뜬다 (누르고 있어야만 빨라지던 것을 고침)
      if(Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')){
        this.shown = this.text.length; this.holdT = 0; return;
      }
      const sp = (Input.down('interact')||Input.down('jump'))? 4 : this.speed;
      const before=Math.floor(this.shown);
      this.shown = Math.min(this.text.length, this.shown+sp);
      if(Math.floor(this.shown)>before && Math.floor(this.shown)%3===0) Audio2.sfx('talk');
    } else {
      this.holdT++;
      if((Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')) && this.holdT>3) this.next();
    }
  }
  draw(x,u){
    if(!this.active || this.paused) return;
    const bh = this.narration? 56 : 72;
    const by = VH-bh-8;
    // 픽셀 프레임
    panel(x, 8, by, VW-16, bh, this.narration? {bg:'rgba(8,8,14,0.88)', b1:'#a8a0c0', b2:'#4a4460'} : {});
    if(!this.narration){
      panel(x, 14, by+8, 46, 46, {bg:'#241f30'});
      /* 실물 일러스트가 있으면 그걸 쓴다 (주인공은 지금 모습 × 지금 감정).
         없으면 지금까지처럼 픽셀 흉상. 파일이 늘수록 화면이 저절로 좋아진다. */
      const art = BigPortrait.get(this.who, 40, this.mood);
      if(art && art.naturalWidth){
        const sw=art.naturalWidth, sh=art.naturalHeight;
        const side=Math.min(sw, sh*0.9);                    // 얼굴 쪽 정사각으로 잘라 담는다
        x.save(); x.beginPath(); x.rect(17, by+11, 40, 40); x.clip();
        x.imageSmoothingEnabled = true;
        x.drawImage(art, (sw-side)/2, 0, side, side, 17, by+11, 40, 40);
        x.restore();
      } else {
        x.drawImage(makePortrait(this.who), 17, by+11, 40, 40);
      }
    }
    // 텍스트 (고해상도)
    const tx = this.narration? 26 : 70;
    let ty = by + (this.narration? 14 : 12);
    if(!this.narration && this.name){
      drawText(u, this.name, 13, tx, ty, '#ffe08a');
      ty += 17;
    }
    const full = this.lines;
    let acc=0;
    for(let li=0; li<full.length; li++){
      const line=full[li];
      const start=acc; acc+=line.length;
      if(start >= this.shown) break;
      const vis = line.slice(0, clamp(Math.floor(this.shown)-start, 0, line.length));
      drawText(u, vis, 13, tx, ty + li*16, this.narration? '#d8d2e8' : '#f4f0e4');
    }
    // 선택지
    if(this.choices){
      const cw=Math.max(...this.choices.map(c=>textWidth(u,c.t,13)))+38;
      const chh=this.choices.length*19+12;
      const cx0=VW-cw-14, cy0=by-chh-6;
      panel(x, cx0, cy0, cw, chh, {bg:'rgba(16,14,28,0.95)'});
      this.choices.forEach((c,i)=>{
        const yy=cy0+7+i*19;
        if(i===this.sel){
          x.fillStyle='rgba(255,224,138,0.16)'; x.fillRect(cx0+3,yy-1,cw-6,17);
          x.fillStyle='#ffe08a'; x.fillRect(cx0+8, yy+5, 5, 5);
        }
        drawText(u, c.t, 13, cx0+20, yy, i===this.sel? '#ffe08a':'#b8b2c8');
      });
    } else if(this.shown>=this.text.length){
      const bl = Math.sin(this.holdT*0.16)>0;
      if(bl){ x.fillStyle='#ffe08a'; x.fillRect(VW-26, VH-22, 6, 6); x.fillRect(VW-25, VH-16, 4, 2); }
    }
  }
}

/* ---------- HUD ---------- */
function drawHUD(x,u){
  const p=G.player;
  if(!p) return;
  // 좌상단 패널
  panel(x, 6, 6, 150, 46, {bg:'rgba(14,12,20,0.78)'});
  drawText(u, `Lv.${p.level}`, 12, 13, 10, '#ffe08a');
  drawText(u, L('heroName'), 11, 48, 11, '#c8c2d8');
  // HP
  x.drawImage(ART.icons.heart, 13, 24);
  bar(x, 26, 25, 74, 6, p.hp/p.maxhp, '#e04a4a', '#4a2430');
  drawText(u, `${Math.ceil(p.hp)}/${p.maxhp}`, 10, 104, 23, '#f0c8c8');
  // 믿음
  x.drawImage(ART.icons.faith, 13, 34);
  bar(x, 26, 35, 74, 6, p.faith/p.maxfaith, '#5ec8f0', '#1e3a4a');
  drawText(u, `${Math.ceil(p.faith)}`, 10, 104, 33, '#b8e4f4');
  // EXP
  bar(x, 8, 46, 146, 3, p.exp/p.expNext, '#8ae05a', '#25361c');

  // 아이템 줄
  let ix=162;
  const slot=(icon, on, label)=>{
    panel(x, ix, 6, 22, 22, {bg: on?'rgba(40,34,20,0.9)':'rgba(14,12,20,0.6)', b1:on?'#ffe08a':'#4a4460', b2:'#2a2436'});
    if(on) x.drawImage(icon, ix+7, 11);
    else { x.globalAlpha=0.22; x.drawImage(icon, ix+7, 11); x.globalAlpha=1; }
    ix+=25;
  };
  if(p.burden){ slot(ART.icons.burden, true); }
  if(p.items.roll) slot(ART.icons.scroll, true);
  if(p.items.key)  slot(ART.icons.key, true);
  if(p.armor.sword) slot(ART.icons.sword, true);
  if(p.armor.shield) slot(ART.icons.shield, true);
  if(p.armor.helm) slot(ART.icons.helmet, true);
  if(p.armor.plate) slot(ART.icons.breastplate, true);
  if(p.armor.belt) slot(ART.icons.belt, true);
  if(p.armor.boots) slot(ART.icons.boots, true);

  // 동전
  x.drawImage(ART.icons.coin, VW-40, 9);
  drawText(u, String(p.coins), 12, VW-26, 8, '#ffe08a');
  // 음소거 표시
  if(!Audio2.enabled){
    x.fillStyle='rgba(14,12,20,0.8)'; x.fillRect(VW-62,8,16,12);
    x.fillStyle='#8a84a0'; x.fillRect(VW-59,12,3,4); x.fillRect(VW-56,10,3,8);
    x.fillStyle='#e06a6a'; x.fillRect(VW-53,11,7,1); x.fillRect(VW-53,16,7,1);
  }

  // 현재 목표 — 아이들이 "뭘 해야 하지?" 로 멈추지 않게 항상 보여준다
  if(G.objective!==undefined && G.objective!==null && !G.dlg.active){
    const ot=L('obj'+G.objective);
    const ow=Math.max(textWidth(u,ot,10), textWidth(u,L('objTitle'),9))+16;
    panel(x, VW-ow-6, 26, ow, 30, {bg:'rgba(14,12,20,0.7)', b1:'#8a7a4a', b2:'#3a3226'});
    drawText(u, L('objTitle'), 9, VW-ow, 30, '#c9a227');
    drawText(u, ot, 10, VW-ow, 41, '#e8dcc0');
  }
  // 상태 게이지
  if(G.showStamina){
    bar(x, VW/2-50, VH-14, 100, 5, p.stamina/p.maxStamina, '#e8c84a', '#3a3220');
    drawText(u, L('stamina'), 10, VW/2-74, VH-16, '#e8c84a');
  }
  if(p.sleep>0){
    bar(x, VW/2-50, VH-30, 100, 5, p.sleep/100, '#b088c8', '#2e2438');
    drawText(u, L('sleepy'), 10, VW/2, VH-43, '#c8a0e0', 'center');
  }
  if(p.doubt>0){
    bar(x, VW/2-50, VH-22, 100, 5, p.doubt/100, '#a8547a', '#2e2434');
    drawText(u, L('doubtG'), 10, VW/2, VH-35, '#e0a0bc', 'center');
  }
  if(p.sinking>2){
    bar(x, VW/2-44, 70, 88, 5, p.sinking/26, p.sinking>20?'#d06a3a':'#8a7a3a', '#332e1c');
    drawText(u, L('sinking'), 10, VW/2, 57, p.sinking>20?'#ffb08a':'#e8d08a', 'center');
  }
  // 짐 표시
  if(p.burden){
    drawText(u, L('carrying'), 10, 10, 54, 'rgba(226,196,152,0.78)');
  }
  // 보스 체력
  if(G.boss && !G.boss.dead){
    const b=G.boss;
    panel(x, VW/2-112, VH-34, 224, 24, {bg:'rgba(20,8,12,0.88)', b1:'#e0a0a0', b2:'#5a2a2a'});
    drawText(u, b.name, 12, VW/2, VH-33, '#ff9a8a', 'center');
    bar(x, VW/2-102, VH-17, 204, 6, b.hp/b.maxhp, '#d03a3a', '#3a1420');
    // 페이즈 구분선 — 어디까지 깎았는지 눈으로 보인다
    x.fillStyle='rgba(0,0,0,0.75)';
    x.fillRect(VW/2-102+Math.round(204*0.30), VH-17, 1, 6);
    x.fillRect(VW/2-102+Math.round(204*0.66), VH-17, 1, 6);
    for(let i=0;i<3;i++){
      const on = (2-b.phaseIdx)>i;
      x.fillStyle = on? '#ff6a5a':'#4a2028';
      x.fillRect(VW/2+92-i*7, VH-32, 5, 5);
    }
  }
  // 힌트
  if(G.hintText){
    const w=textWidth(u,G.hintText,12)+30;
    panel(x, VW/2-w/2, VH-58, w, 20, {bg:'rgba(14,12,20,0.85)'});
    drawText(u, `[E] ${G.hintText}`, 12, VW/2, VH-56, '#ffe08a', 'center');
    G.hintText=null;
  }
  /* 토스트.
     ⚠ 예전엔 그리는 도중에 splice 해서, 사라진 토스트 뒤의 것들이 같은 프레임에
     겹쳐 그려졌다. 이제 수명은 먼저 깎고 죽은 것을 걸러낸 뒤 자리 번호를 매긴다.
     또 각 토스트가 자기 자리로 부드럽게 내려오게 해 순간이동처럼 튀지 않게 한다. */
  for(const t of G.toasts) t.life--;
  for(let i=G.toasts.length-1;i>=0;i--) if(G.toasts[i].life<=0) G.toasts.splice(i,1);
  G.toasts.forEach((t,i)=>{
    const a = t.life<24? t.life/24 : (t.life>t.max-10? (t.max-t.life)/10 : 1);
    const want = 56+i*24;
    t.slotY = (t.slotY===undefined)? want : t.slotY + (want-t.slotY)*0.25;
    const yy = Math.round(t.slotY);
    u.globalAlpha=a; x.globalAlpha=a;
    const w=textWidth(u,t.msg,13)+26;
    panel(x, VW/2-w/2, yy, w, 20, {bg:'rgba(14,12,20,0.9)'});
    drawText(u, t.msg, 13, VW/2, yy+2, t.color||'#ffe08a', 'center');
    u.globalAlpha=1; x.globalAlpha=1;
  });
  // 데미지 숫자
  for(let i=G.dmgNums.length-1;i>=0;i--){
    const d=G.dmgNums[i];
    d.life--; d.y+=d.vy; d.vy+=0.055;
    if(d.life<=0){ G.dmgNums.splice(i,1); continue; }
    u.globalAlpha=clamp(d.life/16,0,1);
    drawText(u, String(d.n), d.crit?15:12, d.x-G.cam.ox, d.y-G.cam.oy, d.color, 'center');
    u.globalAlpha=1;
  }
}

/* ---------- 챕터 타이틀 카드 ---------- */
const ChapterCard = {

    x.fillRect(0, VH/2-46, VW, 92); x.globalAlpha=1;
    x.globalAlpha=a; x.fillStyle='#c9a227';
    x.fillRect(VW/2-70, VH/2-30, 140, 1); x.fillRect(VW/2-70, VH/2+30, 140, 1);
    x.globalAlpha=1;
    u.globalAlpha=a;
    drawText(u, this.num, 13, VW/2, VH/2-26, '#c9a227', 'center');
    drawText(u, this.title, 24, VW/2, VH/2-10, '#f4ecd8', 'center');

/* ---------- 여정 지도 (오리건 트레일 방식) ----------
   지나온 길 · 지금 여기 · 앞에 남은 장을 한 화면에 펼친다.
   "어디까지 왔고 얼마나 남았는지"가 한눈에 보여야 한다. */
const JourneyMap = {
  active:false, t:0, scroll:0, onDone:null, target:0, from:0, animT:0, walkX:0,

  open(from, to, onDone){
    this.active=true; this.t=0; this.from=from; this.target=to;
    this.animT=0; this.onDone=onDone; this.walkX=0;
    Audio2.play('journey');
  },
  update(){
    if(!this.active) return;
    this.t++;
    if(this.t>34) this.animT = Math.min(1, this.animT + 0.014);
    const pos = lerp(this.from, this.target, this.animT);
    this.scroll = lerp(this.scroll, pos*86 - VW*0.42, 0.10);
    /* ⚠ 예전엔 170프레임(2.8초)이면 저절로 닫혔다. 걷는 연출에 1.2초가 들어가니
       읽을 시간은 1.6초뿐 — "어디까지 왔고 몇 장이 남았나"를 보라고 만든 화면인데
       화면에 [E] 계속 이라고 써 놓고 안 눌러도 넘어가 버렸다.
       이제는 눌러야 넘어간다. 아주 오래 방치될 때만 스스로 넘긴다. */
    if(this.animT>=1 && (Input.pressed('interact')||Input.pressed('jump')||this.t>1200)){
      this.active=false; const cb=this.onDone; this.onDone=null; if(cb) cb();
    }
  },
  draw(x,u){
    if(!this.active) return;
    /* 양피지 지도 바탕 */
    const g=x.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#e6dcc0'); g.addColorStop(0.55,'#dbcfae'); g.addColorStop(1,'#c9bb96');
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    RND=mulberry32(4242);
    for(let i=0;i<340;i++){ x.fillStyle=`rgba(120,96,58,${0.05+rnd()*0.10})`;
      x.fillRect(rndi(0,VW),rndi(0,VH),rndi(1,3),rndi(1,3)); }
    // 가장자리 그을림
    const vg=x.createRadialGradient(VW/2,VH/2,VH*0.34,VW/2,VH/2,VH*0.95);
    vg.addColorStop(0,'rgba(90,66,34,0)'); vg.addColorStop(1,'rgba(74,52,24,0.55)');
    x.fillStyle=vg; x.fillRect(0,0,VW,VH);
    RND=mulberry32(20260825);

    drawText(u, L('journeyTitle'), 14, VW/2, 12, '#5a4426', 'center', false);

    const baseY = VH*0.52;
    const cur = Math.round(lerp(this.from,this.target,this.animT));

    /* 길 — 지나온 곳은 굵은 실선, 앞은 점선 */
    for(let i=0;i<CHAPTERS.length-1;i++){
      const ax = 46 + i*86 - this.scroll, ay = baseY + Math.sin(i*1.1)*24;
      const bx = 46 + (i+1)*86 - this.scroll, by = baseY + Math.sin((i+1)*1.1)*24;
      if(bx < -60 || ax > VW+60) continue;
      const walked = i < cur;
      const steps = 16;
      for(let s2=0;s2<steps;s2++){
        const t2=s2/steps;
        if(!walked && s2%2) continue;              // 앞길은 점선
        x.fillStyle = walked? '#6b5228' : 'rgba(107,82,40,0.34)';
        x.fillRect(Math.round(lerp(ax,bx,t2)), Math.round(lerp(ay,by,t2)), walked?3:2, walked?3:2);
      }
    }

    /* 장 표지 */
    for(let i=0;i<CHAPTERS.length;i++){
      const px_ = 46 + i*86 - this.scroll;
      const py = baseY + Math.sin(i*1.1)*24;
      if(px_ < -50 || px_ > VW+50) continue;
      const done = i < cur, here = i === cur;

      // 말뚝 그림자
      x.fillStyle='rgba(80,58,28,0.18)';
      x.beginPath(); x.ellipse(px_, py+11, 13, 4, 0, 0, 7); x.fill();

      if(done){                                   // 지나온 곳 — 채운 표지
        x.fillStyle='#6b5228'; x.fillRect(px_-6, py-7, 12, 14);
        x.fillStyle='#8a6a34'; x.fillRect(px_-5, py-6, 10, 12);
        x.fillStyle='#e6dcc0'; x.fillRect(px_-2, py-3, 4, 6);
      } else if(here){                            // 지금 여기 — 깃발
        x.fillStyle='#5a4426'; x.fillRect(px_-1, py-18, 2, 25);
        const w2 = 12 + Math.sin(this.t*0.10)*1.5;
        x.fillStyle='#a8341f';
        x.beginPath(); x.moveTo(px_+1, py-18); x.lineTo(px_+1+w2, py-14); x.lineTo(px_+1, py-9); x.fill();
      } else {                                    // 남은 곳 — 빈 표지
        x.strokeStyle='rgba(107,82,40,0.55)'; x.lineWidth=1.4;
        x.strokeRect(px_-5.5, py-6.5, 11, 13);
      }

      // 장 번호·이름
      drawText(u, String(i+1), 9, px_, py+13, done? '#5a4426':'rgba(90,68,38,0.55)', 'center', false);
      if(done || here){
        drawText(u, chShort(i), 10, px_, py-30, here? '#8a2a18':'#6b5228', 'center', false);
      }
    }

    /* 걸어가는 순례자 */
    const wx = 46 + lerp(this.from,this.target,this.animT)*86 - this.scroll;
    const wy = baseY + Math.sin(lerp(this.from,this.target,this.animT)*1.1)*24;
    const moving = this.animT>0 && this.animT<1;
    const S = G.player && !G.player.burden ? (G.player.armor && G.player.armor.plate? ART.chars.pcArmorNS : ART.chars.pcFree)
                                           : ART.chars.pcBurden;
    const f = moving? S.walk[(this.t>>3)%4] : S.idleA[(this.t>>4)%4];
    x.drawImage(f.r, Math.round(wx-f.r.width/2), Math.round(wy-f.r.height+4));

    /* 하단 카드 — 지금 장 / 남은 장 */
    const bh = 46, by = VH-bh-8;
    x.fillStyle='rgba(58,42,20,0.14)'; x.fillRect(14, by, VW-28, bh);
    x.fillStyle='#f0e7cd'; x.fillRect(16, by, VW-32, bh-3);
    x.fillStyle='#8a6a34'; x.fillRect(16, by, VW-32, 1); x.fillRect(16, by+bh-4, VW-32, 1);

    drawText(u, chNum(cur), 10, 28, by+7, '#8a6a34', 'left', false);
    drawText(u, chTitle(cur), 15, 28, by+19, '#2e2210', 'left', false);
    const left = CHAPTERS.length-1-cur;
    drawText(u, left>0 ? (LANG==='ko'? `남은 장 ${left}` : `${left} chapters left`)
                       : (LANG==='ko'? '마지막 장' : 'Final chapter'),
             11, VW-28, by+8, '#6b5228', 'right', false);
    if(this.animT>=1) drawText(u, L('contKey'), 10, VW-28, by+26, '#8a6a34', 'right', false);

    /* 진행 막대 */
    const pw = VW-56, pxx = 28, pyy = by-9;
    x.fillStyle='rgba(90,68,38,0.28)'; x.fillRect(pxx, pyy, pw, 3);
    x.fillStyle='#8a2a18'; x.fillRect(pxx, pyy, Math.round(pw*(cur/(CHAPTERS.length-1))), 3);
  }
};

/* ---------- 일시정지 / 인벤토리 ---------- */
const PauseMenu = {
  active:false, sel:0, tab:0,
  /* 타이틀에서 열면 게임이 아직 없다 — 가방·도감·저장을 내보내면 안 된다.
     (실측: 타이틀 → 조작법 → 닫기 → 가방 에서 G.player 가 null 이라 매 프레임 크래시) */
  get fromTitle(){ return G.state===ST.TITLE || !G.player; },
  get items(){
    if(this.fromTitle) return [L('close'), L('howToPlay'), L('language')];
    const it=[L('resume'), L('bag'), L('codexMenu')];
    if(this.minis().length) it.push(L('mgReplay'));
    return it.concat([L('saveNow'), L('howToPlay'), L('language'), L('saveQuit')]);
  },
  minis(){
    const f=(G.flags)||{}, out=[];
    if(f.mini_seed) out.push(['seed', L('mgSeedTitle')]);
    if(f.mini_run)  out.push(['run',  L('mgRunTitle')]);
    return out;
  },
  open(){ this.active=true; this.sel=0; this.tab=0; Audio2.sfx('select'); },
  close(){ this.active=false; },
  update(){
    if(!this.active) return;
    if(this.tab===3){
      const ms=this.minis();
      if(Input.pressed('up'))   { this.msel=(this.msel+ms.length-1)%ms.length; Audio2.sfx('select'); }
      if(Input.pressed('down')) { this.msel=(this.msel+1)%ms.length; Audio2.sfx('select'); }
      if(Input.pressed('menu')||Input.pressed('attack')){ this.tab=0; Audio2.sfx('select'); return; }
      if(Input.pressed('interact')||Input.pressed('jump')){
        this.active=false; this.tab=0;
        G.startMini(ms[this.msel][0], {});
      }
      return;
    }
    if(this.tab!==0){
      if(Input.pressed('menu')||Input.pressed('attack')){ this.tab=0; Audio2.sfx('select'); }
      // 인벤토리에서 열쇠 사용
      if(this.tab===1 && G.player.items.key && (Input.pressed('interact')||Input.pressed('jump'))){
        if(G.onUseKey){ this.active=false; this.tab=0; G.onUseKey(); }
        else { Audio2.sfx('deny'); G.toast('지금은 쓸 곳이 없다', '#a8a0b8'); }
      }
      return;
    }
    if(Input.pressed('up')){ this.sel=(this.sel+this.items.length-1)%this.items.length; Audio2.sfx('select'); }
    if(Input.pressed('down')){ this.sel=(this.sel+1)%this.items.length; Audio2.sfx('select'); }
    if(Input.pressed('menu')){ this.close(); }
    if(Input.pressed('interact')||Input.pressed('jump')){
      Audio2.sfx('confirm');
      const pick=this.items[this.sel];
      if(pick===L('resume')||pick===L('close')) this.close();
      else if(pick===L('bag')) this.tab=1;
      else if(pick===L('codexMenu')){ this.close(); Codex.open(); }
      else if(pick===L('mgReplay')){ this.tab=3; this.msel=0; }
      else if(pick===L('saveNow')){ G.autoSave('manual'); this.close(); }
      else if(pick===L('howToPlay')) this.tab=2;
      else if(pick===L('language')){ setLang(LANG==='ko'?'en':'ko'); if(typeof updateHintBar==='function') updateHintBar(); }
      else if(pick===L('saveQuit')){ G.saveGame(); GCBridge.quit(); this.close(); G.gotoTitle(); }
    }
  },
  draw(x,u){
    if(!this.active) return;
    x.fillStyle='rgba(6,5,12,0.82)'; x.fillRect(0,0,VW,VH);
    // UI 레이어는 게임 캔버스 위에 있으므로 여기서도 덮어야 한다
    u.fillStyle='rgba(6,5,12,0.55)'; u.fillRect(-2,-2,VW+4,VH+4);
    if(this.tab===0){
      const its=this.items, rowH = its.length>7? 20 : 23;
      const ph = 44 + its.length*rowH + 12, pt = Math.round(VH/2 - ph/2);
      panel(x, VW/2-96, pt, 192, ph);
      drawText(u, L('paused'), 18, VW/2, pt+8, '#e8dcae', 'center');
      its.forEach((it,i)=>{
        const yy=pt+38+i*rowH;
        if(i===this.sel){ x.fillStyle='rgba(255,224,138,0.14)'; x.fillRect(VW/2-80, yy-3, 160, rowH-2);
          x.fillStyle='#ffe08a'; x.fillRect(VW/2-74, yy+5, 5,5); }
        drawText(u, it, 13, VW/2-62, yy, i===this.sel?'#ffe08a':'#b8b2c8');
      });
    } else if(this.tab===1){
      panel(x, 30, 24, VW-60, VH-52);
      drawText(u, L('items'), 16, VW/2, 32, '#e8dcae', 'center');
      const p=G.player;
      if(!p){ drawText(u, L('close'), 12, VW/2, VH/2, '#8a84a0', 'center'); return; }
      const NY=L('notYet'), DS=L('dash_');
      const rows=[
        [ART.icons.burden, L('it_burden'), p.burden? L('it_burden_on'):L('it_burden_off'), true],
        [ART.icons.scroll, L('it_roll'),   p.items.roll? L('it_roll_on'):NY, p.items.roll],
        [ART.icons.key,    L('it_key'),    p.items.key?  L('it_key_on'):NY,  p.items.key],
        [ART.icons.sword,  L('it_sword'),  p.armor.sword? L('it_sword_on'):DS, p.armor.sword],
        [ART.icons.shield, L('it_shield'), p.armor.shield? L('it_shield_on'):DS, p.armor.shield],
        [ART.icons.helmet, L('it_helm'),   p.armor.helm?  L('it_helm_on'):DS,  p.armor.helm],
        [ART.icons.breastplate,L('it_plate'), p.armor.plate? L('it_plate_on'):DS, p.armor.plate],
        [ART.icons.belt,   L('it_belt'),   p.armor.belt?  L('it_belt_on'):DS,  p.armor.belt],
        [ART.icons.boots,  L('it_boots'),  p.armor.boots? L('it_boots_on'):DS, p.armor.boots]
      ];
      rows.forEach((r,i)=>{
        const yy=48+i*20;
        x.globalAlpha=r[3]?1:0.3;
        x.drawImage(r[0], 46, yy+2);
        x.globalAlpha=1;
        drawText(u, r[1], 12, 64, yy, r[3]?'#f4ecd8':'#6a6480');
        drawText(u, r[2], 11, 150, yy+1, r[3]?'#a8a0c0':'#5a5470');
      });
      drawText(u, p.items.key? L('useKey') : L('close'), 11, VW/2, VH-38, '#8a84a0', 'center');
    } else if(this.tab===3){
      const ms=this.minis();
      panel(x, VW/2-104, VH/2-56, 208, 112);
      drawText(u, L('mgPick'), 15, VW/2, VH/2-48, '#e8dcae', 'center');
      ms.forEach(([k,nm],i)=>{
        const yy=VH/2-18+i*24;
        if(i===this.msel){ x.fillStyle='rgba(255,224,138,0.14)'; x.fillRect(VW/2-88, yy-3, 176, 22);
          x.fillStyle='#ffe08a'; x.fillRect(VW/2-82, yy+5, 5,5); }
        drawText(u, nm, 13, VW/2-70, yy, i===this.msel?'#ffe08a':'#b8b2c8');
        const r=(G.miniResults||{})[k];
        if(r) drawText(u, (r.win?'★ ':'')+(L('mgScore')+' '+(r.score||0)), 10, VW/2+86, yy+2, '#8a84a0','right');
      });
      drawText(u, L('close'), 10, VW/2, VH/2+40, '#8a84a0', 'center');
    } else {
      panel(x, 40, 30, VW-80, VH-64);
      drawText(u, L('controls'), 16, VW/2, 38, '#e8dcae', 'center');
      const keys=[
        ['← →  /  A D', L('k_move')], ['Space / Z', L('k_jump')],
        ['X', L('k_atk')], ['V', L('k_skill')],
        ['Shift', L('k_dash')], ['↓', L('k_block')],
        ['Q', L('k_pray')], ['E / Enter', L('k_talk')],
        ['I / Esc', L('k_menu')], ['M', L('k_music')]
      ];
      /* 10항목이 패널 밖으로 넘쳐 마지막 줄('M 음악')이 테두리·닫기 안내와 겹쳤다.
         두 칸으로 접어 넣는다. */
      const half=Math.ceil(keys.length/2);
      keys.forEach((k,i)=>{
        const col=i<half?0:1, r=i%half;
        const kx = 52 + col*(VW/2-46), yy = 60 + r*20;
        drawText(u, k[0], 11, kx, yy, '#ffe08a');
        drawText(u, k[1], 11, kx+72, yy, '#c8c2d8');
      });
      drawText(u, L('close'), 11, VW/2, VH-46, '#8a84a0','center');
    }
  }
};

</script>
<script>
/* ===== js/44_journey.js ===== */
/* ============================================================
   44_journey.js — 여정 지도 (오리건 트레일 방식) + 도감
   지도: 지나온 길 · 지금 위치 · 앞에 남은 장을 한 화면에 펼친다
   도감: 만난 인물·장소는 빛나고, 못 만난 것은 잠긴 실루엣으로 남는다
   ============================================================ */
'use strict';

/* ---------- 도감 데이터 ---------- */
/* 원작 전체를 싣는다. 게임에서 만나면 unlock 된다. */
const CODEX_CHARS = [
  // key,          한글,     English,           장  선/악

  ['help',         '도움',    'Help',             2, 'good'],
  ['worldly',      '세속 현자','Mr. Worldly Wise', 3, 'evil'],
  ['goodwill',     '선의',    'Goodwill',         4, 'good'],
  ['archer',       '벨세불의 궁수','Beelzebub’s Archer',4,'evil'],
  ['interpreter',  '해석자',  'Interpreter',      4, 'good'],
  ['shining',      '빛나는 이','Shining One',     5, 'good'],
  ['simple',       '단순',    'Simple',           6, 'weak'],
  ['sloth',        '나태',    'Sloth',            6, 'weak'],
  ['presumption',  '추정',    'Presumption',      6, 'weak'],
  ['formalist',    '형식주의자','Formalist',       6, 'evil'],
  ['hypocrisy',    '위선자',  'Hypocrisy',        6, 'evil'],
  ['timorous',     '소심',    'Timorous',         6, 'weak'],
  ['mistrust',     '불신',    'Mistrust',         6, 'weak'],
  ['watchful',     '경계(문지기)','Watchful',      7, 'good'],
  ['discretion',   '조심',    'Discretion',       7, 'good'],
  ['prudence',     '신중',    'Prudence',         7, 'good'],
  ['piety',        '경건',    'Piety',            7, 'good'],
  ['charity',      '자비',    'Charity',          7, 'good'],
  ['apollyon',     '아볼루온','Apollyon',         8, 'boss'],
  ['faithful',     '신실',    'Faithful',        10, 'good'],
  ['talkative',    '수다쟁이','Talkative',       10, 'evil'],
  ['judge',        '재판장 증오','Judge Hate-good',10,'evil'],
  ['envy',         '시기',    'Envy',            10, 'evil'],
  ['superstition', '미신',    'Superstition',    10, 'evil'],
  ['pickthank',    '아첨',    'Pickthank',       10, 'evil'],
  ['hopeful',      '소망',    'Hopeful',         10, 'good'],
  ['byends',       '실리',    'By-ends',         11, 'evil'],
  ['demas',        '데마',    'Demas',           11, 'evil'],
  ['despair',      '절망 거인','Giant Despair',   11, 'boss'],
  ['diffidence',   '불신(거인의 아내)','Diffidence',11,'evil'],
  ['shepherd',     '목자',    'Shepherds',       12, 'good'],
  ['ignorance',    '무지',    'Ignorance',       12, 'weak'],
  ['flatterer',    '아첨꾼',  'Flatterer',       12, 'evil'],
  ['atheist',      '무신론자','Atheist',         12, 'evil']
];

const CODEX_PLACES = [
  ['city-of-destruction','멸망의 도시','City of Doom',1],
  ['slough-of-despond',  '낙담의 늪',  'Slough of Despond',2],
  ['village-of-morality','도덕 마을',  'Village of Morality',3],
  ['mount-sinai',        '시내산',     'Mount Sinai',3],
  ['wicket-gate',        '좁은 문',    'The Small Gate',4],
  ['interpreters-house', '해석자의 집','Interpreter’s House',4],
  ['the-cross',          '십자가 언덕','The Cross',5],
  ['hill-difficulty',    '곤고산',     'Hill Difficulty',6],
  ['arbor',              '정자',       'The Arbor',6],
  ['palace-beautiful',   '아름다운 궁전','Palace Beautiful',7],
  ['valley-humiliation', '겸손의 골짜기','Valley of Humbling',8],
  ['valley-shadow',      '죽음의 그늘','Valley of the Shadow',9],
  ['vanity-fair',        '허영의 시장','Vanity Fair',10],
  ['hill-lucre',         '은광 언덕',  'Hill Lucre',11],
  ['bypath-meadow',      '곁길 초원',  'By-Path Meadow',11],
  ['doubting-castle',    '의심의 성',  'Doubting Castle',11],
  ['delectable-mountains','기쁨의 산', 'Delight Hills',12],
  ['enchanted-ground',   '마법에 걸린 땅','Enchanted Ground',12],
  ['beulah',             '뷸라 땅',    'Beulah',12],
  ['celestial-city',     '천성',       'The Golden City',12]
];

/* ---------- 해금 ---------- */
function codexMeet(kind, key){
  if(!G.codex) G.codex = {chars:{}, places:{}};
  const bag = kind==='place'? G.codex.places : G.codex.chars;
  if(bag[key]) return;
  bag[key] = 1;
  const list = kind==='place'? CODEX_PLACES : CODEX_CHARS;
  const row = list.find(r=>r[0]===key);
  if(row) G.toast((LANG==='ko'? '도감 기록: ':'Codex: ') + (LANG==='ko'? row[1]:row[2]), '#cfe8ff');
}
function codexCount(kind){
  const list = kind==='place'? CODEX_PLACES : CODEX_CHARS;
  const bag = (G.codex && (kind==='place'? G.codex.places : G.codex.chars)) || {};
  /* 도감 목록에 있는 것만 센다. 그냥 bag 을 세면 목록 밖 인물(상인·마을 사람 등)까지
     들어가 "40 / 39" 같은 숫자가 나온다 — 화면에서는 고장으로 읽힌다. */
  let got=0;
  for(const r of list) if(bag[r[0]]) got++;
  return [got, list.length];
}

/* ---------- 도감 화면 ---------- */
const Codex = {
  active:false, tab:0, sel:0, scroll:0,
  open(){ this.active=true; this.tab=0; this.sel=0; this.scroll=0; Audio2.sfx('select'); },
  close(){ this.active=false; },
  list(){ return this.tab===0? CODEX_CHARS : CODEX_PLACES; },
  unlocked(key){
    const bag = this.tab===0? (G.codex&&G.codex.chars) : (G.codex&&G.codex.places);
    return !!(bag && bag[key]);
  },
  update(){
    if(!this.active) return;
    const L2 = this.list();
    if(Input.pressed('left')||Input.pressed('right')){ this.tab=1-this.tab; this.sel=0; this.scroll=0; Audio2.sfx('select'); }
    if(Input.pressed('up')){ this.sel=(this.sel+L2.length-1)%L2.length; Audio2.sfx('select'); }
    if(Input.pressed('down')){ this.sel=(this.sel+1)%L2.length; Audio2.sfx('select'); }
    if(Input.pressed('menu')||Input.pressed('attack')){ this.close(); }
    const rows = 9;
    if(this.sel < this.scroll) this.scroll = this.sel;
    if(this.sel >= this.scroll+rows) this.scroll = this.sel-rows+1;
  },
  draw(x,u){
    if(!this.active) return;
    x.fillStyle='#0b0912'; x.fillRect(0,0,VW,VH);
    u.fillStyle='rgba(11,9,18,0.9)'; u.fillRect(-2,-2,VW+4,VH+4);

    const L2 = this.list(), rows = 9;
    // 탭
    [[L('codexChars'),0],[L('codexPlaces'),1]].forEach(([t,i])=>{
      const tx = 16 + i*104;
      const on = this.tab===i;
      x.fillStyle = on? '#c9a227' : '#2a2436';
      x.fillRect(tx, 12, 96, 20);
      drawText(u, t, 12, tx+48, 15, on? '#1a1408':'#8a84a0', 'center');
    });
    const [got,total] = codexCount(this.tab===0? 'char':'place');
    drawText(u, `${got} / ${total}`, 11, VW-16, 16, '#8a84a0', 'right');

    // 목록
    for(let i=0;i<rows;i++){
      const idx = this.scroll+i;
      if(idx >= L2.length) break;
      const row = L2[idx], key=row[0], nm = LANG==='ko'? row[1]:row[2], ch = row[3];
      const open = this.unlocked(key);
      const yy = 42 + i*20;
      if(idx===this.sel){ x.fillStyle='rgba(201,162,39,0.16)'; x.fillRect(10, yy-2, 210, 19); }
      /* 만난 인물은 '빛나게' — CK 요청. 회색 네모로는 만남이 안 읽힌다.
         성향에 따라 빛 색을 달리해 선악이 목록에서 바로 보이게 한다. */
      if(open){
        const al = (this.tab===0)? (row[4]||'neutral') : 'place';
        const col = al==='hero'? '#ffe9a0' : al==='good'? '#ffd86a'
                  : al==='evil'? '#e0603c' : al==='boss'? '#c04a9a'
                  : al==='weak'? '#8aa0c8' : '#7fd3c0';
        const pulse = 0.55 + 0.45*Math.sin((G.tick||0)*0.06 + idx);
        x.save(); x.globalCompositeOperation='lighter';
        const g=x.createRadialGradient(17, yy+7, 0, 17, yy+7, 11);
        g.addColorStop(0, hexA(col, 0.55*pulse)); g.addColorStop(1, hexA(col, 0));
        x.fillStyle=g; x.fillRect(6, yy-4, 22, 22);
        x.restore();
        x.fillStyle = col; x.fillRect(14, yy+4, 7, 7);
        x.fillStyle = hexA('#ffffff', 0.5); x.fillRect(15, yy+5, 2, 2);
      } else {
        x.fillStyle='#2e2840'; x.fillRect(14, yy+4, 7, 7);
        x.fillStyle='#3a3448'; x.fillRect(15, yy+5, 5, 5);
      }
      drawText(u, open? nm : '— — — —', 12, 28, yy, open? '#f2ecdc':'#4e4860');
      drawText(u, ch? `${ch}장` : L('codexPrologue'), 10, 214, yy+2, open? '#8a84a0':'#3a3448', 'right');
    }
    // 스크롤 표시
    if(L2.length > rows){
      const h = Math.max(14, VH*0.5*rows/L2.length);
      const t = 42 + (VH*0.5-h) * (this.scroll/(L2.length-rows));
      x.fillStyle='#2a2436'; x.fillRect(224, 42, 3, VH*0.5);
      x.fillStyle='#c9a227'; x.fillRect(224, t, 3, h);
    }

    // 오른쪽 상세
    const row = L2[this.sel];
    const key=row[0], nm = LANG==='ko'? row[1]:row[2];
    const open = this.unlocked(key);
    const px = 240, pw = VW-px-14;
    x.fillStyle='#16121f'; x.fillRect(px, 12, pw, VH-26);
    x.fillStyle='#2e2742'; x.fillRect(px, 12, pw, 1); x.fillRect(px, VH-15, pw, 1);
    x.fillRect(px, 12, 1, VH-27); x.fillRect(px+pw-1, 12, 1, VH-27);

    if(open){
      // 초상 (실물 일러스트가 있으면 그것)
      if(this.tab===0){
        /* 도감 카드.
           ⚠ codex-frame-* 는 투명한 창이 있는 '테두리'가 아니라 **100% 불투명한
           카드 배경**이다(384×512). 예전엔 초상 위에 덮어 그려서 액자 안이
           통째로 비어 보였다(실측). 배경으로 먼저 깔고 그 위에 인물을 얹는다.
           인물은 새로 받은 일러스트 초상을 쓰고, 없으면 픽셀 스프라이트로 돌아간다. */
        const al = row[4]||'neutral';
        const fw=116, fh=155, fx=px+pw/2-fw/2, fy=22;
        const cardArt = (typeof CodexArt!=='undefined') &&
          CodexArt.get((al==='evil'||al==='boss')? 'codex-frame-iron' : 'codex-frame-gold');
        if(cardArt){
          x.save(); x.imageSmoothingEnabled=true;
          x.drawImage(cardArt, fx, fy, fw, fh);
          x.restore();
        } else {
          const tint = al==='evil'? '#3a1e28' : al==='boss'? '#361a30'
                     : (al==='good'||al==='hero')? '#2a2a3e' : '#241f33';
          const g2=x.createLinearGradient(fx,fy,fx,fy+fh);
          g2.addColorStop(0, tint); g2.addColorStop(1,'#100d1a');
          x.fillStyle=g2; x.fillRect(fx,fy,fw,fh);
          x.fillStyle='#3e3654'; x.fillRect(fx,fy,fw,1); x.fillRect(fx,fy+fh-1,fw,1);
          x.fillRect(fx,fy,1,fh); x.fillRect(fx+fw-1,fy,1,fh);
        }
        // 카드 안쪽 여백 — 액자 테두리를 침범하지 않게
        const ix=fx+13, iy=fy+13, iw=fw-26, ih=fh-30;
        const illo = (typeof BigPortrait!=='undefined') && BigPortrait.get(key, ih);
        if(illo && illo.naturalWidth){
          const side=Math.min(illo.naturalWidth, illo.naturalHeight);
          x.save(); x.beginPath(); x.rect(ix,iy,iw,ih); x.clip();
          x.imageSmoothingEnabled=true;
          x.drawImage(illo, (illo.naturalWidth-side)/2, 0, side, side, ix, iy, iw, iw);
          x.restore();
        } else {
          const sp = ART.chars[key] && ART.chars[key].idle && ART.chars[key].idle.r;
          if(sp){
            const sc=Math.max(2, Math.min(3, Math.floor((ih-18)/sp.height)));
            const dw=sp.width*sc, dh=sp.height*sc;
            x.fillStyle='rgba(0,0,0,0.35)';
            x.beginPath(); x.ellipse(fx+fw/2, iy+ih-8, 20, 5, 0, 0, Math.PI*2); x.fill();
            x.save(); x.imageSmoothingEnabled=false;
            x.drawImage(sp, Math.round(fx+fw/2-dw/2), Math.round(iy+ih-6-dh), dw, dh);
            x.restore();
          } else drawText(u, '?', 40, px+pw/2, fy+50, '#3a3448', 'center');
        }
