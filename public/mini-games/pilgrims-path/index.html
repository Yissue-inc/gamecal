<script>
/* ===== js/46_storycard.js ===== */
/* ============================================================
   46_storycard.js — 장면 일러스트 카드 (각 장의 도입·중반·결말)
   ★ assets/scene/ch<장>-<막>.webp  (막 = open | mid | close)
     파일이 있으면 그 장면에서 큰 그림 한 장을 띄운다. 없으면 조용히 건너뛴다.
     ⛔ 없는 파일을 두 번 요청하지 않는다(404 폭주 방지).
   ============================================================ */
'use strict';

/* 장면 일러스트.
   실제 배달 규격: assets/chapter/ch01-c.webp ~ ch12-c.webp
     · 폴더는 chapter/ (scene/ 아님)
     · 장 번호는 **두 자리 0 패딩**
     · 막은 한 글자 — **a(도입) · b(중반) · c(결말)**
   지금은 결말(c) 12장이 와 있고 a/b 24장은 제작 중이다.
   없는 파일은 조용히 건너뛴다(빈 액자를 띄우지 않는다). */
const SceneArt = {
  img:{}, tried:{}, missing:{},
  ACT: {open:'a', mid:'b', close:'c'},
  key(ch, act){ return `ch${String(ch+1).padStart(2,'0')}-${this.ACT[act]||act}`; },
  load(k){
    if(this.tried[k]) return;
    this.tried[k]=true;
    const im=new Image();
    im.onload  = ()=>{ this.img[k]=im; };
    im.onerror = ()=>{ this.missing[k]=true; };
    im.src = assetUrl(`assets/chapter/${k}.webp`);
  },
  get(ch, act){ const k=this.key(ch,act); this.load(k); return this.img[k]||null; },
  /* 그 장에 들어갈 때 세 막을 미리 받아 둔다 (없는 것은 404 한 번으로 끝) */
  prefetch(ch){ ['open','mid','close'].forEach(a=> this.load(this.key(ch,a))); }
};


/* 도감 액자 — assets/codex/ 아래.
     codex-frame-gold : 만난 인물·장소
     codex-frame-iron : 아직 못 만난 것
     codex-locked     : 잠금 자리표시 */
const CodexArt = {
  img:{}, tried:{},
  get(name){
    if(!this.tried[name]){
      this.tried[name]=true;
      const im=new Image();
      im.onload=()=>{ this.img[name]=im; };
      im.onerror=()=>{};
      im.src=assetUrl(`assets/codex/${name}.webp`);
    }
    const im=this.img[name];
    return (im && im.naturalWidth)? im : null;
  }
};

/* 장소 카드 — 도감 오른쪽에 쓴다 */
const PlaceArt = {
  img:{}, tried:{},
  get(key){
    if(!this.tried[key]){
      this.tried[key]=true;
      const im=new Image();
      im.onload=()=>{ this.img[key]=im; };
      im.onerror=()=>{};
      im.src = assetUrl(`assets/place/${key}.webp`);
    }
    return this.img[key]||null;
  }
};

/* 한 장짜리 이야기 카드.
   그림이 없으면 아예 뜨지 않는다 — "빈 액자"를 보여 주느니 건너뛴다. */
const StoryCard = {
  active:false, img:null, cap:'', t:0, onEnd:null, holdT:0,

  show(ch, act, cap, cb){
    const im = SceneArt.get(ch, act);
    if(!im){
      /* 아직 안 받아졌다면 잠깐 기다렸다 다시 본다.
         404 로 확정된 것(=아직 안 만든 막)은 기다리지 않고 바로 통과한다. */
      const k = SceneArt.key(ch, act);
      if(!SceneArt.missing[k]){
        let waited = 0;
        const poll = ()=>{
          waited += 60;
          const im2 = SceneArt.get(ch, act);
          if(im2){ this.begin(im2, cap, cb); return; }
          if(waited >= 900 || SceneArt.missing[k]){ if(cb) cb(); return; }
          setTimeout(poll, 60);
        };
        setTimeout(poll, 60);
        return true;                              // 곧 뜬다 — 호출자는 기다린다
      }
      if(cb) cb(); return false;
    }
    this.begin(im, cap, cb);
    return true;
  },
  begin(im, cap, cb){
    this.active=true; this.img=im; this.cap=cap||''; this.t=0; this.holdT=0;
    this.onEnd=cb||null;
    Audio2.sfx('item');
  },
  close(){
    this.active=false;
    const cb=this.onEnd; this.onEnd=null;
    if(cb) cb();
  },
  update(){
    if(!this.active) return;
    this.t++;
    if(this.t>18) this.holdT++;
    if(this.holdT>6 && (Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')||Input.pressed('menu'))) this.close();
  },
  draw(x,u){
    if(!this.active) return;
    const a = Math.min(1, this.t/16);

    // 게임 캔버스 — 그림
    x.fillStyle='#07060c'; x.fillRect(0,0,VW,VH);
    const im=this.img;
    const zoom = 1 + Math.min(0.05, this.t*0.00016);          // 아주 느린 켄번즈
    const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height;
    const scale = Math.max(VW/iw, (VH-40)/ih) * zoom;
    const dw=iw*scale, dh=ih*scale;
    x.save(); x.globalAlpha=a; x.imageSmoothingEnabled=true;
    x.drawImage(im, Math.round(VW/2-dw/2), Math.round((VH-34)/2-dh/2), Math.round(dw), Math.round(dh));
    x.restore();

    // UI 캔버스 — 레터박스와 자막
    u.save();
    u.globalAlpha=a;
    u.fillStyle='#07060c'; u.fillRect(-2,-2,VW+4,16); u.fillRect(-2,VH-34,VW+4,36);
    const lines = wrapText(u, this.cap, 12, VW-52);
    lines.slice(0,2).forEach((l,i)=> drawText(u, l, 12, 26, VH-30+i*15, '#f2ecdc','left',false));
    if(this.holdT>6 && Math.sin(this.holdT*0.1)>-0.2)
      drawText(u, L('cardNext'), 10, VW-22, VH-16, '#8a8270', 'right', false);
    u.restore();
  }
};

</script>
<script>
/* ===== js/50_minigames.js ===== */
/* ============================================================
   50_minigames.js — 곁들이 미니게임 2종
     A) 씨앗의 정원 (SeedGarden) — 같은 열매끼리 합쳐 생명나무 열매까지 (수박게임 방식)
        해석자의 집(4장)에서 "겨자씨 비유" 방으로 들어간다
     B) 좁은 길 달리기 (NarrowRun) — 위·아래 갈림에서 골라 순례자 무리를 지켜 끝까지
        사망의 음침한 골짜기(9장)에서 어둠을 가로지른다
   두 게임 모두 G.state 를 건드리지 않고 Codex 처럼 위에 덮어 그린다.
   끝나면 onDone(result) 로 본편에 보상을 돌려준다.
   ============================================================ */
'use strict';

/* ── 미니게임 그림 ────────────────────────────────────────────
   assets/minigame/ 아래 파일이 있으면 그것을 쓰고, 없으면 지금까지처럼
   코드로 그린다. ⛔ 없는 파일은 두 번 요청하지 않는다(404 폭주 방지).
     mg-seed-0 ~ mg-seed-6  512×512  일곱 열매 (투명)
     mg-seed-jar            512×512  항아리
     mg-run-bg              1920×270 골짜기 배경 (가로 타일링)
     mg-run-wall            40×68    길을 막은 어둠의 무리
     mg-run-lamp            512×512  길가 등불
   ============================================================ */
const MGArt = {
  img:{}, tried:{}, fit:{},
  get(name){
    if(!this.tried[name]){
      this.tried[name]=true;
      const im=new Image();
      im.onload=()=>{ this.img[name]=im; if(name.startsWith('mg-seed-')) this.measure(name, im); };
      im.onerror=()=>{};
      im.src=assetUrl(`assets/minigame/${name}.webp`);
    }
    const im=this.img[name];
    return (im && im.naturalWidth)? im : null;
  },

  /* 그림마다 투명 여백이 다르다.
     ⚠ 같은 배율로 그리면 여백이 적은 그림(무화과)은 크게, 많은 그림(보리알)은
     작게 보여 물리 반지름과 어긋난다 — 실측: 무화과가 옆 보리알을 파고들었다.
     그래서 불투명 영역을 한 번 재서, '내용물이 물리 지름에 맞도록' 배율을 잡는다. */
  measure(name, im){
    try{
      const N=64;
      const c=makeCanvas(N,N), g=ctxOf(c);
      g.drawImage(im, 0, 0, N, N);
      const d=g.getImageData(0,0,N,N).data;
      let x0=N, y0=N, x1=-1, y1=-1;
      for(let y=0;y<N;y++) for(let x=0;x<N;x++){
        if(d[(y*N+x)*4+3] > 24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
      }
      if(x1<0){ this.fit[name]={s:1, cx:0.5, cy:0.5}; return; }
      const wFrac=(x1-x0+1)/N, hFrac=(y1-y0+1)/N;
      this.fit[name]={
        s: 1/Math.max(wFrac, hFrac),          // 내용물을 꽉 채우도록 키우는 배율
        cx: ((x0+x1+1)/2)/N,                  // 내용물의 중심 (여백이 한쪽에 쏠린 경우 보정)
        cy: ((y0+y1+1)/2)/N
      };
    }catch(e){ this.fit[name]={s:1, cx:0.5, cy:0.5}; }
  },
  prefetch(){ ['mg-seed-jar','mg-run-bg','mg-run-wall','mg-run-lamp']
    .concat(SEEDS.map((_,i)=>'mg-seed-'+i)).forEach(n=>this.get(n)); }
};

/* ---------- 공통 껍데기 ---------- */
const MiniGame = {
  active:false, kind:null, impl:null, onDone:null, outro:0, result:null,
  open(kind, onDone){
    this.kind=kind; this.onDone=onDone||null; this.outro=0; this.result=null;
    this.impl = (kind==='seed')? SeedGarden : NarrowRun;
    MGArt.prefetch();
    this.impl.start();
    this.active=true;
    Audio2.sfx('confirm');
  },
  finish(res){
    if(this.outro>0) return;
    this.result=res; this.outro=1;
    Audio2.sfx(res.win? 'glory':'deny');
  },
  update(){
    if(!this.active) return;
    if(this.outro>0){
      this.outro++;
      if(this.outro>150 || Input.pressed('interact') || Input.pressed('jump')){
        this.active=false;
        const cb=this.onDone, r=this.result;
        this.onDone=null;
        if(cb) cb(r);
      }
      return;
    }
    this.impl.update();
  },
  draw(x,u){
    if(!this.active) return;
    this.impl.draw(x,u);
    // 결과 패널 — UI 캔버스에만 그린다(게임 캔버스가 위를 가리지 못한다)
    if(this.outro>0){
      const a=Math.min(1,this.outro/16);
      u.fillStyle=`rgba(8,7,14,${0.76*a})`; u.fillRect(-2,-2,VW+4,VH+4);
      const r=this.result, bw=250, bx=VW/2-bw/2, by=72, bh=118;
      u.fillStyle='#d8d2c2'; u.fillRect(bx-3,by-3,bw+6,bh+6);
      u.fillStyle='#f4f0e6'; u.fillRect(bx,by,bw,bh);
      u.fillStyle='#bdb49c'; u.fillRect(bx+8,by+30,bw-16,1);
      drawText(u, r.win? L('mgWin'):L('mgLose'), 17, VW/2, by+9, r.win?'#8a6a1e':'#7a3030','center',false);
      const lines=wrapText(u, r.msg, 12, bw-24);
      lines.slice(0,3).forEach((ln,i)=> drawText(u, ln, 12, VW/2, by+40+i*17, '#2a2418','center',false));
      drawText(u, L('mgGo'), 10, VW/2, by+bh-16, '#8a8270','center',false);
    }
  }
};

/* ============================================================
   A) 씨앗의 정원 — 같은 씨앗 둘이 만나면 한 단계 자란다
   ============================================================ */
const SEEDS = [
  // r,  한글,        English,        색,        테두리
  [ 8, '겨자씨',  'Mustard Seed', '#b89a63', '#7d6338'],
  [12, '보리알',  'Barley',       '#d9c07a', '#9d8546'],
  [17, '무화과',  'Fig',          '#8e6a8c', '#5c4058'],
  [23, '석류',    'Pomegranate',  '#c04a45', '#7c2b28'],
  [30, '포도',    'Grapes',       '#7a5aa8', '#4b356b'],
  [38, '감람',    'Olive',        '#6f8f52', '#445b31'],
  [47, '생명나무 열매','Tree of Life','#f2e3a6','#c9a227']
];

const SeedGarden = {
  L:0, R:0, T:0, B:0,
  balls:[], nextT:0, dropX:0, cool:0, score:0, over:0, best:0, seed:0, spawned:0,
  start(){
    this.L=140; this.R=340; this.T=52; this.B=VH-34;
    this.balls=[]; this.score=0; this.over=0; this.cool=0; this.best=0; this.spawned=0; this.warn=false;
    this.seed=1337; this.dropX=(this.L+this.R)/2;
    this.nextT=this.roll();
  },
  rnd(){ this.seed=(this.seed*1664525+1013904223)>>>0; return this.seed/4294967296; },
  roll(){ const r=this.rnd(); return r<0.46?0 : r<0.80?1 : 2; },
  update(){
    if(this.cool>0) this.cool--;
    const spd = 2.4;
    if(Input.down('left'))  this.dropX-=spd;
    if(Input.down('right')) this.dropX+=spd;
    const rr = SEEDS[this.nextT][0];
    this.dropX = clamp(this.dropX, this.L+rr+1, this.R-rr-1);
    if(this.cool<=0 && (Input.pressed('jump')||Input.pressed('attack')||Input.pressed('interact'))){
      this.balls.push({x:this.dropX, y:this.T+8, vx:0, vy:0, t:this.nextT, r:rr, born:0, pop:0});
      this.spawned++;
      this.nextT=this.roll(); this.cool=16;
      Audio2.sfx('coin');
    }
    if(Input.pressed('menu')) MiniGame.finish({win:false, msg:L('mgSeedQuit'), score:this.score});

    this.physics();
    this.merge();

    /* 넘침 판정.
       ⚠ 처음엔 "멈춰 있고(vy<0.9) 선을 넘은 씨앗"만 셌다. 그런데 항아리가 꽉 차면
       씨앗들이 서로 밀며 계속 떨리기 때문에 vy 가 절대 가라앉지 않는다 —
       실측: 572개가 쌓이도록 판정이 한 번도 안 걸렸다(소크 테스트가 잡음).
       그래서 속도는 보지 않고, '떨어뜨린 지 오래된 씨앗이 선 위에 있는 상태'가
       얼마나 지속되는지만 센다. 갓 떨어뜨린 것(born<40)은 지나가는 중이라 뺀다. */
    /* 경고선(T)과 실제 판정선(T-18)을 나눈다 — 선에 닿자마자 지는 게 아니라
       "선을 넘은 채로 버티면" 진다. 아이가 회복할 여지를 준다. */
    let spill=false, warn=false;
    for(const b of this.balls){
      if(b.born<=40) continue;
      if(b.y-b.r < this.T-18){ spill=true; }
      else if(b.y-b.r < this.T+2){ warn=true; }
    }
    this.warn = spill || warn;
    if(this.balls.length > 90) spill=true;          // 어떤 경우에도 무한히 쌓이지 않게
    if(spill){ this.over++; if(this.over>90) MiniGame.finish({win:false, msg:L('mgSeedOver',this.score), score:this.score}); }
    else this.over=Math.max(0,this.over-3);
  },
  physics(){
    const bs=this.balls;
    for(const b of bs){
      b.born++; if(b.pop>0) b.pop--;
      b.vy += 0.34; b.vx *= 0.992;
      b.x += b.vx; b.y += b.vy;
      if(b.x-b.r < this.L){ b.x=this.L+b.r; b.vx=Math.abs(b.vx)*0.32; }
      if(b.x+b.r > this.R){ b.x=this.R-b.r; b.vx=-Math.abs(b.vx)*0.32; }
      if(b.y+b.r > this.B){ b.y=this.B-b.r; b.vy=-Math.abs(b.vy)*0.16; b.vx*=0.88; if(Math.abs(b.vy)<0.4) b.vy=0; }
    }
    // 위치 보정 — 여러 번 돌려야 쌓임이 안정된다
    for(let it=0; it<6; it++){
      for(let i=0;i<bs.length;i++) for(let j=i+1;j<bs.length;j++){
        const a=bs[i], c=bs[j];
        let dx=c.x-a.x, dy=c.y-a.y;
        let d=Math.hypot(dx,dy), min=a.r+c.r;
        if(d<0.0001){ dx=(i%2?1:-1)*0.5; dy=-0.5; d=0.7071; }
        if(d>=min) continue;
        const ov=(min-d)/d*0.5;
        const px=dx*ov, py=dy*ov;
        a.x-=px; a.y-=py; c.x+=px; c.y+=py;
        // 반발은 아주 약하게 — 굴러 자리 잡는 느낌
        const nx=dx/d, ny=dy/d;
        const rel=(c.vx-a.vx)*nx + (c.vy-a.vy)*ny;
        if(rel<0){ const k=rel*0.42; a.vx+=nx*k; a.vy+=ny*k; c.vx-=nx*k; c.vy-=ny*k; }
      }
      for(const b of bs){
        if(b.x-b.r<this.L) b.x=this.L+b.r;
        if(b.x+b.r>this.R) b.x=this.R-b.r;
        if(b.y+b.r>this.B) b.y=this.B-b.r;
      }
    }
  },
  merge(){
    const bs=this.balls;
    for(let i=0;i<bs.length;i++){
      for(let j=i+1;j<bs.length;j++){
        const a=bs[i], c=bs[j];
        if(a.t!==c.t || a.dead || c.dead) continue;
        if(Math.hypot(c.x-a.x, c.y-a.y) > a.r+c.r-1.5) continue;
        const nt=a.t+1;
        a.dead=true; c.dead=true;
        const mx=(a.x+c.x)/2, my=(a.y+c.y)/2;
        this.score += (a.t+1)*(a.t+1)*5;
        this.best = Math.max(this.best, nt);
        const col=SEEDS[Math.min(nt,SEEDS.length-1)][3];
        G.particles.burst(mx,my, 9, {color:col, spd:1.5, life:20, size:2, glow:true});
        if(nt >= SEEDS.length-1){
          // 생명나무 열매 — 목표 달성
          G.particles.burst(mx,my, 26, {color:'#f2e3a6', spd:2.4, life:34, size:3, glow:true});
          this.balls = bs.filter(b=>!b.dead);
          MiniGame.finish({win:true, msg:L('mgSeedWin',this.score), score:this.score, top:nt});
          return;
        }
        bs.push({x:mx, y:my, vx:(this.rnd()-0.5)*0.6, vy:-1.1, t:nt, r:SEEDS[nt][0], born:40, pop:10});
        Audio2.sfx(nt>=5?'levelup':'exp');
        break;
      }
    }
    this.balls = this.balls.filter(b=>!b.dead);
  },
  /* 열매 하나하나를 다르게 그린다.
     단색 원 + 흰 점은 '시스템 도형'으로 읽힌다 — 입체 음영·질감·꼭지·이파리를 준다. */
  drawSeed(x, b){
    const s=SEEDS[b.t];
    const r=b.r*(b.pop>0? 1+b.pop*0.022 : 1);
    const bx=b.x, by=b.y;
    const t2=(b.born||0);

    // 바닥 그림자
    x.save(); x.globalAlpha=0.28; x.fillStyle='#000';
    x.beginPath(); x.ellipse(bx, by+r*0.86, r*0.82, r*0.22, 0, 0, Math.PI*2); x.fill(); x.restore();

    // 실물 그림이 있으면 그것으로 갈음한다
    const artKey='mg-seed-'+b.t;
    const art = MGArt.get(artKey);
    if(art){
      const f = MGArt.fit[artKey] || {s:1, cx:0.5, cy:0.5};
      const d = r*2.06*f.s;                            // 내용물이 물리 지름과 맞도록
      x.save(); x.imageSmoothingEnabled=true;
      x.drawImage(art, bx-d*f.cx, by-d*f.cy, d, d);    // 내용물 중심을 공 중심에
      x.restore();
      if(b.t===SEEDS.length-1){                        // 생명나무 열매만 빛살을 덧입힌다
        x.save(); x.globalCompositeOperation='lighter';
        const halo=x.createRadialGradient(bx,by,r*0.5,bx,by,r*1.7);
        halo.addColorStop(0,'rgba(255,240,180,0.26)'); halo.addColorStop(1,'rgba(255,230,150,0)');
        x.fillStyle=halo; x.fillRect(bx-r*1.8, by-r*1.8, r*3.6, r*3.6);
        for(let k=0;k<10;k++){ const a2=k*Math.PI/5 + t2*0.008, rr=r+5+Math.sin(t2*0.06+k)*3;
          x.fillStyle='rgba(255,244,190,0.5)';
          x.fillRect(bx+Math.cos(a2)*rr-1.5, by+Math.sin(a2)*rr-1.5, 3, 3); }
        x.restore();
      }
      return;
    }

    // 몸통 — 위에서 빛을 받는 구체
    const g=x.createRadialGradient(bx-r*0.34, by-r*0.40, r*0.08, bx, by, r*1.06);
    g.addColorStop(0, this.lighten(s[3], 46));
    g.addColorStop(0.42, s[3]);
    g.addColorStop(1, s[4]);
    x.beginPath(); x.arc(bx, by, r, 0, Math.PI*2); x.fillStyle=g; x.fill();
    // 아래쪽 반사광 — 구체가 바닥에서 떠 보이지 않게
    x.save(); x.globalCompositeOperation='lighter'; x.globalAlpha=0.16;
    const g2=x.createRadialGradient(bx+r*0.25, by+r*0.55, 0, bx, by+r*0.3, r);
    g2.addColorStop(0, this.lighten(s[3], 60)); g2.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle=g2; x.beginPath(); x.arc(bx,by,r,0,Math.PI*2); x.fill(); x.restore();
    x.lineWidth=1.4; x.strokeStyle=s[4]; x.stroke();

    // 열매별 표식
    x.save(); x.beginPath(); x.arc(bx,by,r-0.5,0,Math.PI*2); x.clip();
    if(b.t===0){                                            // 겨자씨 — 작은 홈
      x.fillStyle=hexA(s[4],0.6); x.fillRect(bx-1, by-r*0.15, 2, r*0.5);
    } else if(b.t===1){                                     // 보리알 — 세로 결
      x.fillStyle=hexA(s[4],0.45);
      for(let k=-1;k<=1;k++) x.fillRect(bx+k*r*0.34-0.5, by-r*0.6, 1, r*1.2);
    } else if(b.t===2){                                     // 무화과 — 세로 골
      x.strokeStyle=hexA(s[4],0.55); x.lineWidth=1;
      for(let k=-2;k<=2;k++){ x.beginPath();
        x.moveTo(bx+k*r*0.3, by-r); x.quadraticCurveTo(bx+k*r*0.42, by, bx+k*r*0.3, by+r); x.stroke(); }
    } else if(b.t===3){                                     // 석류 — 알갱이
      x.fillStyle=hexA(this.lighten(s[3],30),0.5);
      for(let k=0;k<7;k++){ const a2=k*0.9+1.1, rr=r*0.5;
        x.beginPath(); x.arc(bx+Math.cos(a2)*rr, by+Math.sin(a2)*rr*0.9, r*0.15, 0, Math.PI*2); x.fill(); }
    } else if(b.t===4){                                     // 포도 — 송이
      const pts=[[0,-0.42],[-0.4,-0.1],[0.4,-0.1],[-0.22,0.3],[0.22,0.3],[0,0.62]];
      for(const [dx2,dy2] of pts){
        const px2=bx+dx2*r, py2=by+dy2*r, pr=r*0.29;
        const gg=x.createRadialGradient(px2-pr*0.3,py2-pr*0.35,0,px2,py2,pr);
        gg.addColorStop(0,this.lighten(s[3],44)); gg.addColorStop(1,s[4]);
        x.beginPath(); x.arc(px2,py2,pr,0,Math.PI*2); x.fillStyle=gg; x.fill();
      }
    } else if(b.t===5){                                     // 감람 — 세로 하이라이트
      x.fillStyle=hexA(this.lighten(s[3],44),0.45);
      x.beginPath(); x.ellipse(bx-r*0.2, by, r*0.2, r*0.62, 0.2, 0, Math.PI*2); x.fill();
    }
    x.restore();

    // 꼭지 · 이파리
    if(b.t>=2 && b.t<=5){
      x.fillStyle='#5c4326'; x.fillRect(bx-1, by-r-4, 2, 5);
      x.fillStyle= b.t===5? '#7fa055' : '#6f8f52';
      x.beginPath(); x.ellipse(bx+5, by-r-3, 5, 2.4, -0.5, 0, Math.PI*2); x.fill();
    }

    // 정반사 — 유약처럼
    x.beginPath(); x.ellipse(bx-r*0.34, by-r*0.40, r*0.26, r*0.17, -0.6, 0, Math.PI*2);
    x.fillStyle=hexA('#ffffff',0.42); x.fill();

    // 생명나무 열매 — 빛살과 왕관
    if(b.t===SEEDS.length-1){
      x.save(); x.globalCompositeOperation='lighter';
      const halo=x.createRadialGradient(bx,by,r*0.5,bx,by,r*1.7);
      halo.addColorStop(0,'rgba(255,240,180,0.30)'); halo.addColorStop(1,'rgba(255,230,150,0)');
      x.fillStyle=halo; x.fillRect(bx-r*1.8, by-r*1.8, r*3.6, r*3.6);
      for(let k=0;k<10;k++){
        const a2=k*Math.PI/5 + t2*0.008, rr=r+5+Math.sin(t2*0.06+k)*3;
        x.fillStyle='rgba(255,244,190,0.55)';
        x.fillRect(bx+Math.cos(a2)*rr-1.5, by+Math.sin(a2)*rr-1.5, 3, 3);
      }
      x.restore();
      x.fillStyle='#c9a227';
      for(let k=-1;k<=1;k++) x.fillRect(bx+k*5-1.5, by-r-8, 3, 6);
      x.fillRect(bx-7, by-r-4, 14, 3);
    }
  },
  lighten(hex, amt){
    const n=parseInt(hex.slice(1),16);
    const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.min(255, v+amt));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  },

  drawRoom(x){
    const g=x.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#3a2c2a'); g.addColorStop(0.55,'#241b1e'); g.addColorStop(1,'#140f13');
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    // 뒤쪽 석벽 — 벽돌 결
    for(let ry=0; ry<VH; ry+=13){
      for(let rx=((ry/13)%2)*16; rx<VW; rx+=32){
        x.fillStyle = ((rx+ry)%64<32)? 'rgba(255,225,190,0.028)' : 'rgba(0,0,0,0.05)';
        x.fillRect(rx, ry, 30, 11);
      }
    }
    // 좌우 석조 아치
    [40, VW-40].forEach((ax,i)=>{
      x.save();
      x.fillStyle='#2e2422';
      x.fillRect(ax-16, 30, 32, VH-30);
      x.fillStyle='#1a1416';
      x.beginPath(); x.moveTo(ax-11, VH); x.lineTo(ax-11, 62);
      x.quadraticCurveTo(ax, 34, ax+11, 62); x.lineTo(ax+11, VH); x.closePath(); x.fill();
      x.fillStyle='rgba(255,200,120,0.05)';
      x.beginPath(); x.moveTo(ax-11, VH); x.lineTo(ax-11, 62);
      x.quadraticCurveTo(ax, 34, ax+11, 62); x.lineTo(ax+11, VH); x.closePath(); x.fill();
      x.restore();
    });
    // 촛불 — 씨앗의 정원은 실내다
    const T2 = this.t||0;
    [[24,120],[VW-24,108],[62,88],[VW-62,94]].forEach(([cx2,cy2],i)=>{
      const fl = 1 + Math.sin(T2*0.11 + i*2)*0.22;
      x.fillStyle='#6a5238'; x.fillRect(cx2-2, cy2, 4, 13);       // 초
      x.save(); x.globalCompositeOperation='lighter';
      const gg=x.createRadialGradient(cx2,cy2-3,0,cx2,cy2-3,26*fl);
      gg.addColorStop(0,'rgba(255,214,140,0.42)'); gg.addColorStop(1,'rgba(255,180,90,0)');
      x.fillStyle=gg; x.fillRect(cx2-30,cy2-32,60,60);
      x.restore();
      x.fillStyle='#ffd88a'; x.fillRect(cx2-1, cy2-5, 2, 5);
      x.fillStyle='#fff4d0'; x.fillRect(cx2-1, cy2-4, 1, 2);
    });
    // 바닥 판석
    x.fillStyle='#1b1418'; x.fillRect(0, this.B+8, VW, VH-this.B-8);
    for(let fx2=0; fx2<VW; fx2+=26){
      x.fillStyle='rgba(255,230,200,0.035)'; x.fillRect(fx2+1, this.B+9, 23, 3);
    }
  },

  /* 흙 항아리 — 손잡이·굽·유약 하이라이트까지. 네모 두 개로는 그릇으로 안 읽힌다. */
  drawJar(x){
    const L=this.L, R=this.R, T2=this.T, B=this.B;
    const w=R-L, oh=B-T2;
    /* ⛔ mg-seed-jar 는 아직 플레이 용기로 쓸 수 없다.
       1차: 씨앗이 이미 그려진 장식 유리병 → 게임 오브젝트와 구분 불가
       2차: 흙 항아리는 맞지만 **위에서 본 정물화**다. 입구로 흙이 보이고
            씨앗·도구가 항아리 바깥에 그려져 있어, 떨어뜨린 씨앗이 몸통 위에
            얹힌다(실측). 이 게임에 필요한 건 **정면 단면형 열린 용기** —
            안쪽이 비어 있고 그 안에 원이 쌓이는 게 보여야 한다.
       규격은 docs/ASSET_SPEC.md 에 그림으로 적어 뒀다. 오면 여기서 켠다. */

    // 손잡이
    x.strokeStyle='#7a4d33'; x.lineWidth=7; x.lineJoin='round';
    [[L-6,-1],[R+6,1]].forEach(([hx,d])=>{
      x.beginPath(); x.moveTo(hx, T2+26);
      x.quadraticCurveTo(hx+d*16, T2+52, hx, T2+80); x.stroke();
    });
    x.lineWidth=1;
    // 몸통
    const body=x.createLinearGradient(L-12,0,R+12,0);
    body.addColorStop(0,'#5e3a27'); body.addColorStop(0.22,'#96603d');
    body.addColorStop(0.5,'#ac714a'); body.addColorStop(0.8,'#7d4b31'); body.addColorStop(1,'#4e3020');
    x.fillStyle=body; x.fillRect(L-11, T2-4, w+22, oh+16);
    // 안쪽 (어둡고 깊게)
    const inner=x.createLinearGradient(0,T2,0,B);
    inner.addColorStop(0,'#150d0c'); inner.addColorStop(1,'#2a1a14');
    x.fillStyle=inner; x.fillRect(L-4, T2+2, w+8, oh+4);
    // 유약 하이라이트 · 그림자
    x.fillStyle='rgba(255,222,180,0.16)'; x.fillRect(L-8, T2-2, 4, oh+12);
    x.fillStyle='rgba(0,0,0,0.30)';       x.fillRect(R+4, T2-2, 5, oh+12);
    // 테두리 띠(구연부)
    x.fillStyle='#b8794f'; x.fillRect(L-13, T2-10, w+26, 9);
    x.fillStyle='#d29a68'; x.fillRect(L-13, T2-10, w+26, 2);
    x.fillStyle='#6b4229'; x.fillRect(L-13, T2-2,  w+26, 2);
    // 굽
    x.fillStyle='#5a3823'; x.fillRect(L-17, B+10, w+34, 9);
    x.fillStyle='#7d4f30'; x.fillRect(L-17, B+10, w+34, 2);
    x.fillStyle='rgba(0,0,0,0.4)';
    x.beginPath(); x.ellipse((L+R)/2, B+22, w*0.62, 5, 0, 0, Math.PI*2); x.fill();
  },

  draw(x,u){
    this.t=(this.t||0)+1;
    this.drawRoom(x);
    this.drawJar(x);
    // 경고선 · 판정선
    x.fillStyle = this.over>0? hexA('#e05a4a', 0.5+0.4*Math.sin(this.over*0.25))
                : this.warn? hexA('#e0a040',0.55) : hexA('#c9a227',0.20);
    x.fillRect(this.L-6, this.T, this.R-this.L+12, 1);
    if(this.over>0){
      x.fillStyle=hexA('#e05a4a',0.4); x.fillRect(this.L-6, this.T-18, this.R-this.L+12, 1);
    }

    for(const b of this.balls) this.drawSeed(x,b);

    // 낙하 위치 표시선 — 점선으로 (실선은 항아리 안을 가른다)
    const nr=SEEDS[this.nextT][0];
    for(let dy=this.T+8; dy<this.B-2; dy+=7){
      x.fillStyle=hexA('#ffe9b0', 0.16+0.10*Math.sin((this.t-dy)*0.09));
      x.fillRect(Math.round(this.dropX), dy, 1, 3);
    }
    // 손에 든 다음 씨앗
    this.drawSeed(x, {x:this.dropX, y:this.T-26, r:nr, t:this.nextT, pop:0, born:this.t});

    /* ---- UI 레이어 ----
       ⚠ 안내문이 항아리 바닥·씨앗과 겹쳐 안 읽혔다. 좌상단 양피지 명패로 모은다. */
    const pw2=150, ph2=44;
    u.fillStyle='rgba(28,20,16,0.72)'; u.fillRect(10, 8, pw2, ph2);
    u.fillStyle='#8a6a3a'; u.fillRect(10, 8, pw2, 1); u.fillRect(10, 8+ph2-1, pw2, 1);
    u.fillRect(10, 8, 1, ph2); u.fillRect(10+pw2-1, 8, 1, ph2);
    drawText(u, L('mgSeedTitle'), 15, 20, 13, '#f2e3a6');
    drawText(u, L('mgScore'), 10, 20, 34, '#9a8f78');
    drawText(u, ''+this.score, 14, 10+pw2-12, 31, '#ffe9b0', 'right');
    drawText(u, L('mgSeedHow'), 10, VW/2, VH-13, '#8f8699', 'center');

    /* 성장 사다리 — 양피지 카드. 크기 차이로 '자란다'가 보이게 한다. */
    const lx=VW-118, ly=8, lw=110, lh=SEEDS.length*23+22;
    u.fillStyle='rgba(28,20,16,0.72)'; u.fillRect(lx, ly, lw, lh);
    u.fillStyle='#8a6a3a'; u.fillRect(lx, ly, lw, 1); u.fillRect(lx, ly+lh-1, lw, 1);
    u.fillRect(lx, ly, 1, lh); u.fillRect(lx+lw-1, ly, 1, lh);
    drawText(u, L('mgLadder'), 10, lx+lw/2, ly+5, '#9a8f78', 'center');
    for(let i=0;i<SEEDS.length;i++){
      const on = i<=this.best, yy = ly+22+i*23;
      const rr = 3.5 + i*1.35;                       // 단계마다 확실히 커진다
      if(on){
        x.save(); x.globalCompositeOperation='lighter';
        const g3=x.createRadialGradient(lx+18, yy+7, 0, lx+18, yy+7, rr+7);
        g3.addColorStop(0, hexA(SEEDS[i][3], 0.45)); g3.addColorStop(1, hexA(SEEDS[i][3], 0));
        x.fillStyle=g3; x.fillRect(lx+18-rr-9, yy-3, (rr+9)*2, (rr+9)*2);
        x.restore();
      }
      x.beginPath(); x.arc(lx+18, yy+7, rr, 0, Math.PI*2);
      x.fillStyle = on? SEEDS[i][3] : '#2b2536'; x.fill();
      x.lineWidth=1; x.strokeStyle = on? SEEDS[i][4] : '#221d2c'; x.stroke();
      if(on){ x.beginPath(); x.arc(lx+18-rr*0.3, yy+7-rr*0.3, Math.max(1,rr*0.26), 0, Math.PI*2);
              x.fillStyle=hexA('#ffffff',0.35); x.fill(); }
      drawText(u, LANG==='ko'? SEEDS[i][1]:SEEDS[i][2], 10, lx+34, yy+2, on? '#f2ecdc':'#4e4860');
    }
  }
};

/* ============================================================
   B) 좁은 길 달리기 — 갈림마다 골라 무리를 지킨다
   ============================================================ */
const NarrowRun = {
  dist:0, goal:6800, lane:0, laneY:[100,190], y:100, crowd:8, over:0,
  gates:[], walls:[], lamps:[], seed:0, shake:0, best:8, msgT:0, msg:'',
  start(){
    this.dist=0; this.lane=0; this.y=this.laneY[0]; this.crowd=8; this.over=0;
    this.gates=[]; this.walls=[]; this.lamps=[];
    this.seed = (NarrowRun.fixedSeed!=null? NarrowRun.fixedSeed : ((Date.now()>>>3)^0x5f2a1)>>>0) || 90210;
    this.shake=0;
    this.best=8; this.msgT=0; this.msg='';
    let d=340;
    while(d < this.goal-160){
      if(this.rnd()<0.62){
        // 갈림 — 위/아래 각각 값이 붙는다. 하나는 좋고 하나는 나쁘다.
        const good=this.rnd()<0.5?0:1;
        const prog=d/this.goal;
        const gv=this.gv(true,prog), bv=this.gv(false,prog);
        this.gates.push({d, v:[good===0?gv:bv, good===1?gv:bv], hit:false});
        d += 210 + Math.floor(this.rnd()*90);
      } else {
        // 벽 — 부딪히면 무리가 깎인다. 한 쪽 차선만 막는다.
        this.walls.push({d, lane:this.rnd()<0.5?0:1, cost:2+Math.floor(this.rnd()*4)+Math.floor((d/this.goal)*5), hit:false});
        d += 170 + Math.floor(this.rnd()*80);
      }
    }
    for(let i=0;i<Math.ceil(this.goal/130)+2;i++) this.lamps.push({d:i*130+60, l:this.rnd()<0.5?0:1});
  },
  rnd(){ this.seed=(this.seed*1103515245+12345)>>>0; return this.seed/4294967296; },
  gv(good, prog){
    const r=this.rnd(), k=1+Math.floor((prog||0)*4);      // 뒤로 갈수록 폭이 커진다
    if(good) return r<0.45? {op:'+', n:(3+Math.floor(r*8))*k} : {op:'x', n:2};
    return r<0.5? {op:'-', n:(2+Math.floor(r*7))*k} : {op:'/', n:2};
  },
  apply(v){
    const before=this.crowd;
    if(v.op==='+') this.crowd += v.n;
    else if(v.op==='x') this.crowd *= v.n;
    else if(v.op==='-') this.crowd -= v.n;
    else this.crowd = Math.floor(this.crowd/v.n);
    this.crowd = clamp(this.crowd, 0, 99);
    const up = this.crowd>before;
    this.msg = (up? '+':'') + (this.crowd-before); this.msgT=44;
    Audio2.sfx(up? 'heal':'hurt');
    if(!up){ this.shake=10; }
    this.best=Math.max(this.best,this.crowd);
    if(this.crowd<=0) MiniGame.finish({win:false, msg:L('mgRunLose'), score:0});
  },
  update(){
    const speed = 3.0 + Math.min(2.2, this.dist/1400);
    this.dist += speed;
    if(this.msgT>0) this.msgT--;
    if(this.shake>0) this.shake--;
    if(Input.pressed('up'))   { if(this.lane!==0){ this.lane=0; Audio2.sfx('step'); } }
    if(Input.pressed('down')) { if(this.lane!==1){ this.lane=1; Audio2.sfx('step'); } }
    if(Input.pressed('menu')) MiniGame.finish({win:false, msg:L('mgRunQuit'), score:0});
    this.y += (this.laneY[this.lane]-this.y)*0.22;

    const px = 96;                          // 화면상 순례자 위치
    const world = this.dist + px;           // 지금 순례자가 지난 거리
    for(const g of this.gates){
      if(!g.hit && world >= g.d){ g.hit=true; this.apply(g.v[this.lane]); }
    }
    for(const w of this.walls){
      if(!w.hit && world >= w.d){
        w.hit=true;
        if(w.lane===this.lane){ this.crowd = Math.max(0, this.crowd - w.cost); this.msg='-'+w.cost; this.msgT=44; this.shake=12;
          Audio2.sfx('hurt');
          if(this.crowd<=0){ this.crowd=0; MiniGame.finish({win:false, msg:L('mgRunLose'), score:0}); return; } }
      }
    }
    if(this.dist >= this.goal){
      MiniGame.finish({win:true, msg:L('mgRunWin', this.crowd), score:this.crowd, crowd:this.crowd});
    }
  },
  /* 선두는 본편의 크리스천 스프라이트를 그대로 쓴다 — 같은 사람이 뛰는 것으로 읽혀야 한다.
     뒤따르는 무리는 실루엣으로 겹쳐 그려 수가 많다는 것만 전한다. */
  drawPilgrim(x, px, py, lead, alpha, frame){
    const set = ART.chars && (ART.chars.christianArmor || ART.chars.christian);
    const img = set ? (set.walk[frame%4].r) : null;
    x.globalAlpha=alpha;
    if(img){
      const s = lead? 1.35 : 1.0;
      const w = img.width*s, h = img.height*s;
      if(lead){ x.drawImage(img, Math.round(px-w/2), Math.round(py-h), Math.round(w), Math.round(h)); }
      else {
        // 뒤따르는 이들은 어둡게 찍어낸 실루엣
        x.save();
        x.drawImage(img, Math.round(px-w/2), Math.round(py-h), Math.round(w), Math.round(h));
        x.globalCompositeOperation='source-atop';
        x.fillStyle='#2c3350';
        x.fillRect(Math.round(px-w/2), Math.round(py-h), Math.round(w), Math.round(h));
        x.restore();
      }
    } else {
      x.fillStyle='#5c76ad'; x.fillRect(px-3, py-14, 7, 14);
    }
    x.globalAlpha=1;
  },
  draw(x,u){
    this.t=(this.t||0)+1;
    const sh = this.shake>0? (this.shake%2?1:-1)*2 : 0;
    // 골짜기 — 어두운 협곡
    const g=x.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#0a0a14'); g.addColorStop(0.5,'#161327'); g.addColorStop(1,'#080711');
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    // 실물 협곡 배경이 있으면 가로로 이어 붙인다 (1920×270 · 가로 타일링)
    const bg = MGArt.get('mg-run-bg');
    if(bg){
      x.save(); x.imageSmoothingEnabled=true;
      const bw = bg.naturalWidth * (VH/bg.naturalHeight);
      let ox = -((this.dist*0.45) % bw);
      for(; ox < VW; ox += bw) x.drawImage(bg, ox, 0, bw, VH);
      x.restore();
    } else
    // 양쪽 절벽 실루엣 (시차 스크롤)
    for(let k=0;k<2;k++){
      const sp = k? 0.45 : 0.22, base = k? 0 : 8;
      x.fillStyle = k? '#0e0c18' : '#151228';
      for(let i=-1;i<10;i++){
        const bx = ((i*70) - (this.dist*sp)%70);
        const hh = 26 + ((i*37)%23) + base;
        x.fillRect(bx, 0, 70, hh);
        x.fillRect(bx, VH-hh-4, 70, hh+4);
      }
    }
    // 길 — 두 갈래. 고른 쪽을 확실히 밝게 해서 어디 있는지 헷갈리지 않게 한다.
    for(let i=0;i<2;i++){
      const on = i===this.lane, ly = this.laneY[i]+6+sh;
      x.fillStyle = on? '#3b3357' : '#231e36';
      x.fillRect(0, ly, VW, 26);
      x.fillStyle = on? hexA('#c9a227',0.55) : hexA('#4a4266',0.45);
      x.fillRect(0, ly, VW, 1); x.fillRect(0, ly+25, VW, 1);
      // 바닥 눈금 (속도감)
      for(let k=0;k<16;k++){
        const bx = ((k*36) - this.dist%36);
        x.fillStyle=hexA(on? '#9a8fc4':'#5a5080', on?0.3:0.16);
        x.fillRect(bx, ly+19, 18, 1);
      }
    }
    // 등불
    for(const lp of this.lamps){
      const sx = lp.d - this.dist;
      if(sx<-20||sx>VW+20) continue;
      const ly = this.laneY[lp.l]-4+sh;
      x.save(); x.globalCompositeOperation='lighter';
      x.fillStyle=hexA('#c9a227',0.16);
      x.beginPath(); x.arc(sx, ly, 15, 0, Math.PI*2); x.fill();
      x.restore();
      const lamp = MGArt.get('mg-run-lamp');
      if(lamp){ x.save(); x.imageSmoothingEnabled=true; x.drawImage(lamp, sx-13, ly-16, 26, 32); x.restore(); }
      else x.fillStyle='#c9a227', x.fillRect(sx-1, ly-2, 3, 4);
    }
    /* 갈림 — 길가에 박힌 나무 이정표. 네모 상자는 '시스템 UI' 로 읽힌다. */
    for(const gt of this.gates){
      const sx = gt.d - this.dist;
      if(sx<-46||sx>VW+34) continue;
      for(let i=0;i<2;i++){
        const v=gt.v[i], good=(v.op==='+'||v.op==='x'), gy=this.laneY[i]+sh;
        const dim = gt.hit;
        // 기둥
        x.fillStyle = dim? '#2a2436' : '#5a4230';
        x.fillRect(sx-2, gy-6, 4, 30);
        // 판
        const base = dim? '#2a2436' : (good? '#33603f' : '#6a2e30');
        const edge = dim? '#3a3448' : (good? '#7fd39a' : '#e08a8a');
        x.save();
        if(!dim){ x.globalCompositeOperation='lighter';
          const gg=x.createRadialGradient(sx+2,gy-6,2,sx+2,gy-6,26);
          gg.addColorStop(0, hexA(good?'#7fd39a':'#e07a6a', 0.22)); gg.addColorStop(1,'rgba(0,0,0,0)');
          x.fillStyle=gg; x.fillRect(sx-26,gy-32,56,52); x.globalCompositeOperation='source-over'; }
        x.restore();
        x.fillStyle='rgba(0,0,0,0.45)'; x.fillRect(sx-15, gy-24, 34, 22);   // 그림자
        x.fillStyle=base;              x.fillRect(sx-17, gy-26, 34, 22);
        x.fillStyle=edge;              x.fillRect(sx-17, gy-26, 34, 2); x.fillRect(sx-17, gy-6, 34, 2);
        x.fillStyle=hexA('#000',0.25); x.fillRect(sx-17, gy-26, 2, 22); x.fillRect(sx+15, gy-26, 2, 22);
        // 못 4개
        x.fillStyle=dim? '#3a3448':'#c9b98a';
        [[-13,-22],[11,-22],[-13,-8],[11,-8]].forEach(([ox,oy])=> x.fillRect(sx+ox, gy+oy, 2, 2));
        drawText(u, (v.op==='x'?'×':v.op==='/'?'÷':v.op)+v.n, 15, sx, gy-21,
                 dim? '#4e4860' : (good?'#eaffe8':'#ffe0e0'), 'center');
      }
    }
    /* 벽 — 길을 막은 어둠의 무리. 웅크린 실루엣 여럿으로 그린다. */
    for(const w of this.walls){
      const sx = w.d - this.dist;
      if(sx<-34||sx>VW+34) continue;
      const wy = this.laneY[w.lane]+sh;
      x.save();
      if(w.hit) x.globalAlpha=0.22;
      else { x.globalCompositeOperation='lighter';
        const gg=x.createRadialGradient(sx+1,wy+4,2,sx+1,wy+4,26);
        gg.addColorStop(0,'rgba(224,60,60,0.18)'); gg.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=gg; x.fillRect(sx-26,wy-22,54,52); x.globalCompositeOperation='source-over'; }
      const T3=this.t||0;
      const wallArt = MGArt.get('mg-run-wall');
      if(wallArt){
        const bob=Math.sin(T3*0.14)*1.5;
        x.save(); x.imageSmoothingEnabled=true;
        x.drawImage(wallArt, sx-20, wy-34+bob, 40, 68);
        x.restore();
        x.restore();
        if(!w.hit) drawText(u, '-'+w.cost, 12, sx+1, wy+16, '#ffb0b0','center');
        continue;
      }
      [[-7,0,10,26],[4,-2,11,28],[-1,3,9,22]].forEach(([ox,oy,ww,hh],k)=>{
        const bob=Math.sin(T3*0.14+k*1.7)*1.2;
        x.fillStyle = k===1? '#2a0f18' : '#1c0a12';
        x.fillRect(sx+ox, wy+oy-hh+14+bob, ww, hh);                 // 몸
        x.beginPath(); x.arc(sx+ox+ww/2, wy+oy-hh+14+bob, ww*0.52, Math.PI, 0); x.fill();  // 어깨
        if(k!==2){ x.fillStyle='#e05a5a';
          x.fillRect(sx+ox+2, wy+oy-hh+18+bob, 2, 2);
          x.fillRect(sx+ox+ww-4, wy+oy-hh+18+bob, 2, 2); }
      });
      x.restore();
      if(!w.hit) drawText(u, '-'+w.cost, 12, sx+1, wy+16, '#ffb0b0','center');
    }
    // 순례자 무리
    const px=104, py=this.y+31+sh, fr=(this.dist>>2);
    const n=Math.min(6, Math.max(1, Math.round(this.crowd/5)));
    for(let i=n-1;i>=0;i--){
      this.drawPilgrim(x, px-i*13, py+((i%2)?1:0), i===0, i===0?1:Math.max(0.3,0.62-i*0.07), fr+i);
    }
    // 결승선
    const fx = this.goal - this.dist;
    if(fx<VW+20){
      for(let i=0;i<10;i++){ x.fillStyle=(i%2)?'#f4ecd8':'#2a2436'; x.fillRect(fx, 60+i*16, 8, 16); }
      x.fillStyle='#c9a227'; x.fillRect(fx-2, 56, 2, 168);
    }

    // ---- UI ----
    drawText(u, L('mgRunTitle'), 15, 14, 10, '#cfe8ff');
    drawText(u, L('mgRunHow'), 10, 14, VH-14, '#9a92ad');
    // 진행 막대
    const pw=VW-28, pr=clamp(this.dist/this.goal,0,1);
    u.fillStyle='rgba(20,17,34,0.85)'; u.fillRect(14, VH-24, pw, 8);
    u.fillStyle='#c9a227'; u.fillRect(14, VH-24, pw*pr, 8);
    u.fillStyle='#f4ecd8'; u.fillRect(14+pw*pr-1, VH-27, 2, 14);
    u.fillStyle='rgba(12,10,22,0.7)'; u.fillRect(VW-104, 8, 92, 26);
    u.strokeStyle=hexA(this.crowd>4?'#7fd39a':'#e08a8a',0.6); u.lineWidth=1; u.strokeRect(VW-104.5, 8.5, 92, 26);
    drawText(u, L('mgCrowd'), 10, VW-96, 12, '#9a92ad');
    drawText(u, ''+this.crowd, 16, VW-18, 12, this.crowd>4? '#7fd39a':'#e08a8a', 'right');
    if(this.msgT>0){
      const a=this.msgT/44;
      drawText(u, this.msg, 16, px+18, py-34-(1-a)*10, hexA(this.msg[0]==='-'? '#e08a8a':'#7fd39a', a), 'center');
    }
  }
};

  d('christian','크리스천','Christian','저는 주인이 낸 길로 왔어요. 담을 넘은 건 그분이 부른 게 아니잖아요.',
    'I came the way the Lord laid out. Climbing the wall is not being invited.','resolve'),
  d('formalist','형식주의자','Formalist','고집 세네. 우린 편한 길로 갈게요.',
    'Stubborn. We will take the easy way.'),
  nr('둘은 곧 갈림길에서 각각 다른 샛길로 사라졌다. 하나는 위험이라는 곳으로, 하나는 멸망이라는 곳으로.',
     'At the fork they each took a bypath — one called Danger, one called Destruction.'),
  cho([
    ['문으로 온 길 그대로 오른다','Keep to the road I came by','narrow', +2],
    ['둘이 간 샛길을 흘깃 본다','Glance down their shortcuts','wide', -2]
  ])
],
ch6_pair:[
  nr('언덕 위에서 두 사람이 얼굴이 하얘진 채 뛰어 내려왔다.',
     'Two men came running down the hill, white in the face.'),
  d('timorous','소심','Timorous','사자예요! 길 한복판에 사자가 있어요!',
    'Lions! There are lions right in the road!'),
  d('mistrust','불신','Mistrust','우린 돌아가요. 죽으려고 가는 건 믿음이 아니에요.',
    'We are going back. Walking into death is not faith.'),
  d('christian','크리스천','Christian','뒤에는 멸망밖에 없어요. 앞이 무서워도 앞이 맞아요.',
    'Behind us there is only destruction. Forward is frightening, but forward is right.')
],
ch7_watchful:[
  d('watchful','경계','Watchful','거기 누구요! …아, 순례자군요. 밤에 이 길을 걷는 사람은 드물어요.',
    'Who goes there! …Ah, a pilgrim. Few walk this road at night.'),
  d('watchful','경계','Watchful','사자가 길에 있는 건 맞아요. 그런데 사슬에 묶여 있어요.',
    'Yes, there are lions on the road. But they are chained.'),
  d('watchful','경계','Watchful','길 한가운데로 오세요. 옆으로 새면 닿아요. 가운데면 안 닿아요.',
    'Walk straight up the middle. Stray and they reach you. Keep centre and they cannot.'),
  ac((G)=>{ G.flags.lionHint=true; G.toast(LANG==='ko'?'길 한가운데로 걸어라':'Walk down the middle', '#c9a227'); })
],
ch10_talkative:[
  d('talkative','수다쟁이','Talkative','아! 순례자시군요! 저도 그 얘기 정말 좋아합니다. 은혜, 회개, 중생, 아주 잘 알죠.',
    'Ah, a pilgrim! I love that subject. Grace, repentance, new birth — I know it all.'),
  d('faithful','신실','Faithful','좋네요. 그럼 그게 형제님 삶에서는 어떻게 보이나요?',
    'Good. So what does it look like in your life?'),
  d('talkative','수다쟁이','Talkative','…삶이요? 아니, 그건 좀 사적인 질문 아닙니까?',
    '…My life? That is rather a personal question.'),
  d('faithful','신실','Faithful','말은 잎이고 삶은 열매예요. 잎만 있는 나무는 멀리서만 나무예요.',
    'Talk is leaves; living is fruit. A tree with only leaves is a tree only from far away.'),
  nr('수다쟁이는 화를 내며 사람들 속으로 사라졌다.',
     'Talkative went off angry, into the crowd.'),
  ac((G)=>{ G.player.faith=Math.min(G.player.maxfaith,G.player.faith+12);
            G.toast(LANG==='ko'?'말과 삶을 가려 듣게 됐다 (+12)':'You learned to tell talk from life (+12)', '#5ec8f0'); })
],
ch10_witnesses:[
  nr('재판이 열렸다. 증인 셋이 차례로 올라섰다.',
     'The trial began. Three witnesses took the stand in turn.'),
  d('envy','시기','Envy','저 자는 우리 관습을 업신여깁니다. 자기가 옳다고 생각해요.',
    'This man despises our customs. He thinks himself right.'),
  d('superstition','미신','Superstition','우리 예배가 헛되다고 했습니다. 신성모독입니다.',
    'He said our worship is empty. That is blasphemy.'),
  d('pickthank','아첨','Pickthank','재판장님을 욕했습니다. 귀족들도 욕했습니다. 제가 다 들었습니다.',
    'He slandered your Honour. And the nobles too. I heard it all.'),
  d('faithful','신실','Faithful','저는 아무 말도 지어내지 않았습니다. 다만 진실을 말했을 뿐입니다.',
    'I invented nothing. I only told the truth.'),
  d('judge','재판장 증오','Judge Hate-good','충분하다. 이 도시에서 진실은 죄다.',
    'Enough. In this city, truth is the crime.')
],
ch11_diffidence:[
  d('diffidence','불신','Diffidence','여보, 저것들 아직 살아 있어요. 왜 아직 살려 둬요?',
    'Husband, they are still alive. Why are they still alive?'),
  d('despair','절망 거인','Giant Despair','오늘은 팼다. 내일은 굶긴다.',
    'Today I beat them. Tomorrow I starve them.'),
  d('diffidence','불신','Diffidence','아니요. 스스로 끝내게 하세요. 그게 훨씬 확실해요.',
    'No. Let them end it themselves. That is far surer.'),
  nr('부부는 웃으며 문을 닫았다. 어둠 속에서 크리스천은 처음으로 자기 손을 내려다보았다.',
     'They laughed and shut the door. In the dark, Christian looked down at his own hands for the first time.')
],
ch12_flatterer:[
  nr('길이 두 갈래로 갈리는 곳에서, 흰옷을 입은 사람이 웃으며 기다리고 있었다.',
     'Where the road forked, a man in shining white stood waiting, smiling.'),
  d('flatterer','아첨꾼','Flatterer','천성으로 가시죠? 제가 안내하겠습니다. 두 분 같은 분들은 드물어요.',
    'Bound for the City? Let me guide you. Men like you are rare.'),
  d('hopeful','소망','Hopeful','좋은 분 같은데요. 우리를 알아봐 주잖아요.',
    'He seems kind. He can see what we are.'),
  d('christian','크리스천','Christian','…목자들이 준 지도를 아직 안 펴 봤어요.',
    '…We never opened the map the Shepherds gave us.','strain'),
  cho([
    ['지도를 먼저 펴 본다','Open the map first','map', +2],
    ['안내를 따라간다','Follow the guide','net', -3]
  ])
],
ch12_atheist:[
  nr('반대편에서 한 사람이 크게 웃으며 걸어왔다. 순례자들과는 정반대 방향이었다.',
     'A man came the other way, laughing loudly. He was walking away from the City.'),
  d('atheist','무신론자','Atheist','천성? 하하! 이십 년을 찾아다녔소. 그런 도시는 없소.',
    'The Celestial City? Ha! I searched twenty years. There is no such place.'),
  d('christian','크리스천','Christian','우린 산 위에서 그 문을 봤어요. 두 눈으로요.',
    'We saw its gate from the mountain. With our own eyes.','brave'),
  d('atheist','무신론자','Atheist','헛것을 본 거요. 나처럼 돌아서시오. 그게 어른의 일이오.',
    'You saw nothing. Turn back like me. That is what grown men do.'),
  d('hopeful','소망','Hopeful','…아저씨는 지도를 잃어버린 거예요. 우린 아직 갖고 있어요.',
    '…You lost your map, sir. We still have ours.'),
  ac((G)=>{ G.player.faith=Math.min(G.player.maxfaith,G.player.faith+10);
            G.toast(LANG==='ko'?'본 것을 붙잡았다 (+10)':'You held to what you saw (+10)', '#5ec8f0'); })
],
ch6_formalist_wide:[
  nr('샛길은 처음 몇 걸음만 편했다. 돌아왔을 땐 다리가 훨씬 무거웠다.',
     'The bypath was easy for a few steps. Coming back, your legs were much heavier.'),
  d('christian','크리스천','Christian','…보기만 했는데도 마음이 흔들렸어.',
    '…I only looked, and it already pulled at me.')
],
ch12_flatterer_net:[
  nr('길이 좁아지더니, 발밑에서 그물이 확 올라와 둘을 통째로 감쌌다. 흰옷은 벗겨지고 검은 몸이 드러났다.',
     'The path narrowed, and a net snapped up around them both. The white robe fell away; underneath was black.'),
  d('hopeful','소망','Hopeful','목자들이 준 지도… 안 봤어요. 우리 둘 다요.',
    'The Shepherds\u2019 map… we never looked. Neither of us.'),
  nr('빛나는 이가 채찍을 들고 와 그물을 끊었다. 아프게, 그러나 살려서.',
     'A Shining One came with a whip and cut the net. It hurt — and it saved them.')
],
ch12_flatterer_map:[
  nr('지도를 펴자, 그 갈림길 옆에 한 줄이 적혀 있었다 — "아첨하는 자를 조심하라."',
     'You opened the map. Beside that very fork, one line: \u201cBeware the Flatterer.\u201d'),
  d('flatterer','아첨꾼','Flatterer','…어, 그게, 저는 그냥…',
    '\u2026Ah. Well. I only meant\u2026'),
  nr('그가 돌아서자 흰옷 아래로 그물이 끌려 나왔다.',
     'As he turned, a net dragged out from under the shining robe.')
],
ch11_byends:[
  d('byends','부에인','Mr. By-ends','저도 천성으로 갑니다! 아주 좋은 집안 출신이죠. 외가 쪽이 아첨 씨 댁이고요.',
    'I am for the City too! Very good family. My mother\u2019s side is the Flatterer line.'),
  d('christian','크리스천','Christian','…같이 가려면 두 가지를 해야 해요. 사람들이 싫어할 때도 가고, 사슬을 차게 돼도 가고요.',
    '\u2026To come with us you must do two things. Go when people hate it, and go even in chains.'),
  d('byends','부에인','Mr. By-ends','아니 그건 좀. 저는 종교가 은빛 신을 신고 걸을 때만 함께 걷는 주의라서요.',
    'Now, now. I only walk with religion when it goes in silver slippers.'),
  d('christian','크리스천','Christian','그럼 우리랑은 못 가요. 그건 형편 좋을 때만 가는 길이잖아요.',
    'Then you cannot come. That is a road you only walk when it suits you.'),
  nr('부에인은 웃으며 뒤에 처졌다. 곧 비슷한 차림의 세 사람이 그와 나란히 걸었다.',
     'By-ends fell back, smiling. Soon three men dressed like him walked beside him.'),
  ac((G)=>{ G.player.faith=Math.min(G.player.maxfaith,G.player.faith+10);
            G.toast(LANG==='ko'?'조건 없이 가기로 했다 (+10)':'You chose to go without terms (+10)', '#5ec8f0'); })
],
ch4_seedroom:[
  nr('맨 끝 방은 흙냄새가 났다. 항아리 하나와, 손톱보다 작은 씨앗 한 줌.',
     'The last room smelled of earth. One clay jar, and a handful of seeds smaller than a fingernail.'),
  d('interpreter','해석자','Interpreter','이 씨앗은 겨자씨야. 모든 씨앗 중에 제일 작지.',
    'This is a mustard seed. The smallest of all seeds.'),
  d('interpreter','해석자','Interpreter','같은 것끼리 만나면 자란다. 조급하게 쏟아부으면 자라기 전에 넘쳐. 떨어뜨려 봐.',
    'Like meets like, and it grows. Pour them in too fast and the jar overflows before anything grows. Try it.')
],
ch4_seedroom_end:[
  d('interpreter','해석자','Interpreter','기억해. 네 믿음도 저 씨앗만 하다. 작다고 없는 게 아니야.',
    'Remember. Your faith is that size too. Small is not the same as nothing.')
],
ch9_run:[
  nr('앞이 하나도 안 보인다. 그런데 뒤에서 발소리가 들렸다 — 골짜기에 갇힌 순례자들이었다.',
     'You cannot see a thing. But there are footsteps behind you — pilgrims trapped in the valley.'),
  d('timorous','겁먹은 순례자','Frightened Pilgrim','길이 둘로 갈려. 어느 쪽이 맞는지 아무도 몰라.',
    'The path splits in two. Nobody knows which side is right.'),
  d('christian','크리스천','Christian','같이 가요. 내가 앞장설게요.',
    'Come with me. I will go first.','resolve')
],
ch9_run_end:[
  nr('골짜기 끝. 어둠은 그대로였지만, 지나온 길은 이제 뒤에 있었다.',
     'The end of the valley. The dark had not changed — but the road through it was behind you now.')
],
ch4_room1:[
  nr('먼지투성이 방. 누가 빗자루로 쓸자 먼지가 확 일어나 숨이 막혔다. 그때 한 사람이 물을 뿌리니 먼지가 가라앉았다.',
     'A dusty room. Someone swept, and the dust flew up so thick nobody could breathe. Then someone sprinkled water, and the dust settled.'),
  d('interpreter','해석자','Interpreter','방은 네 마음이야. 빗자루는 규칙이고 — 먼지를 일으키기만 하지 씻지는 못해. 물이 진짜 도움이야.',
    'The room is your heart. The broom is the rules — it stirs up dust but never washes it. The water is the real help.'),
  ac((G)=>{ G.player.maxfaith+=4; G.player.faith=G.player.maxfaith; G.toast(L('t_maxFaith',4), '#5ec8f0'); })
],
ch4_room2:[
  nr('벽에 붙은 불에 한 사람이 계속 물을 끼얹었다. 그런데 불은 오히려 더 커졌다.',
     'A fire burned on the wall. Someone kept throwing water on it. But the fire only grew.'),
  d('interpreter','해석자','Interpreter','벽 뒤로 와 봐.','Come around behind the wall.'),
  nr('벽 뒤에서 다른 사람이 몰래 기름을 붓고 있었다.',
     'Behind the wall, someone else was quietly pouring oil in.'),
  d('interpreter','해석자','Interpreter','물 뿌리는 쪽이 너를 꺼뜨리려는 자야. 기름 붓는 분이 왕이시고. 네 마음이 안 꺼지는 이유가 이거야.',
    'The one throwing water wants to put you out. The one pouring oil is the King. That’s why your heart hasn’t gone out.'),
  ac((G)=>{ G.player.maxhp+=6; G.player.hp=G.player.maxhp; G.toast(L('t_maxHp',6), '#e04a4a'); })
],
ch4_room3:[
  nr('쇠창살 안에 한 사람이 앉아 있었다. 땅만 보고, 가슴을 움켜쥐고 있었다.',
     'A man sat inside an iron cage. He stared at the floor and clutched his chest.'),
  d('interpreter','해석자','Interpreter','너는 누구니?','Who are you?'),
  nr('"나도 한때는 너 같았어. 그런데 재미있는 것만 쫓다가… 이제는 돌아가고 싶어도 못 가."',
     '"I was like you once. Then I chased only fun things... Now I want to go back and I can’t."'),
  d('christian','크리스천','Christian','…정말 방법이 없어요?','...Is there really no way?'),
  nr('"문을 닫은 건 나야."','"I’m the one who shut the door."'),
  d('interpreter','해석자','Interpreter','이 사람을 기억해. 그리고 깨어 있어.',
    'Remember this man. And stay awake.'),
  ac((G)=>{ G.toast(L('t_warned'), '#c8a0a0'); })
],
ch4_room4:[
  nr('멋진 궁전이 있고, 문 앞을 무장한 자들이 막고 있었다. 사람들은 들어가고 싶어 하면서도 다가가지 못했다.',
     'A shining palace stood there, but armed guards blocked the door. People wanted in, but nobody dared step up.'),
  nr('한 사람이 투구를 쓰고 칼을 뽑아 뚫고 들어갔다. 안에서 노랫소리가 들렸다 — "들어와! 들어와!"',
     'Then one person put on a helmet, drew a sword, and pushed straight through. Voices sang inside: "Come in! Come in!"'),
  d('interpreter','해석자','Interpreter','가라, 크리스천. 너도 저 사람처럼 해.',
    'Go, Christian. Do what that person did.'),
  ac((G)=>{ G.player.atk+=2; G.toast(L('t_courage'), '#ffe08a'); })
],

/* ───────── 5장 · 십자가 ───────── */
ch5_open:[
  nr('길 양옆에 담이 있었다. 그 담의 이름은 "구원"이었다.',
     'Walls ran along both sides of the road. The name of the walls was "Rescue."'),
  nr('짐을 진 채 크리스천은 그 오르막을 올랐다. 지금까지 중에 제일 힘들었다.',
     'Christian climbed the slope with the load still on his back. It was the hardest climb yet.')
],
ch5_cross:[
  nr('언덕 위에 십자가가 하나 서 있었다. 그 아래엔 빈 무덤이 있었다.',
     'On top of the hill stood a cross. Below it was an empty tomb.'),
  nr('크리스천이 십자가 앞에 섰을 때 —','The moment Christian stood before it —'),
  ac((G)=>{ G.burdenFalls(); })
],
ch5_after:[
  ci('cross'),
  nr('등에 있던 짐이 툭 풀려서, 데굴데굴 굴러 무덤 안으로 떨어졌다. 그리고 다시는 보이지 않았다.',
     'The load came loose with a snap. It rolled down, down, into the tomb — and was never seen again.'),
  d('christian','크리스천','Christian','…가볍다.','...I’m light.'),
  d('christian','크리스천','Christian','그가 대신 무거워지셔서, 내가 가벼워졌구나.',
    'He got heavy for me. That’s why I’m light.'),
  nr('크리스천은 세 번 껑충 뛰었다. 웃으면서 울었다.',
     'Christian jumped three times. He laughed and cried at the same time.'),
  ci('shining'),
  nr('그때 빛나는 이 셋이 다가왔다.','Then three Shining Ones came to him.'),
  ac((G)=>{ G.actors.filter(a=>a.tag && a.tag.indexOf('shining')===0).forEach(a=>a.hidden=false);
            G.particles.burst(G.player.cx+30, G.player.cy, 24, {color:'#fff6c0',spd:1.8,life:44,size:2,glow:true,shrink:true});
            Audio2.sfx('item'); }),
  d('shining','빛나는 이','Shining One','평안하렴. 네 잘못은 지워졌어.',
    'Peace to you. Your wrongs are wiped away.'),
  d('shining','빛나는 이','Shining One','이 옷을 입어. 그리고 이마에 이 표를 받아.',
    'Put on these clothes. And take this mark on your forehead.'),
  d('shining','빛나는 이','Shining One','이 두루마리를 가져. 힘들 때 읽고, 마지막 문 앞에서 보여 주면 돼.',
    'Take this scroll. Read it when it’s hard. Show it at the last gate.'),
  ac((G)=>{ G.grantAfterCross(); }),
  nr('※ 짐이 사라졌다! 이제 빠르게 달리고, 두 번 뛰고, 돌진할 수 있다. 그리고 검을 잡았다.',
     '※ The load is gone! Now you run fast, jump twice, and dash. And you have a sword.'),
  nr('※ Shift 돌진 · 공중에서 한 번 더 점프 · X 공격 · V 빛의 화살',
     '※ Shift to dash · jump again in the air · X to attack · V for the Light Arrow')
],

/* ───────── 6장 · 곤고산 ───────── */
ch6_open:[
  nr('길이 셋으로 갈라졌다. 하나는 산을 곧장 오르고, 둘은 산을 돌아간다 — "위험"과 "파멸".',
     'The road split three ways. One went straight up. The other two went around — "Danger" and "Ruin."'),
  d('christian','크리스천','Christian','나는 올라간다. 곧은 길이 진짜 길이야.',
    'I’m climbing. The straight road is the real road.'),
  ac((G)=>{ G.showStamina=true; G.toast(L('t_restHint'), '#e8c84a'); })
],
ch6_arbor:[
  nr('산 중턱에 왕이 만들어 둔 쉼터가 있었다. 크리스천은 앉아서 두루마리를 읽었다.',
     'Halfway up was a shelter the King had built. Christian sat down and read his scroll.'),
  d('christian','크리스천','Christian','잠깐만… 눈만 좀 붙이자.','Just a minute... I’ll close my eyes.'),
  nr('그는 잠이 들었다. 그리고 두루마리가 손에서 스르르 미끄러졌다.',
     'He fell asleep. And the scroll slipped out of his hand.'),
  ac((G)=>{ G.dropRoll(); })
],
ch6_lostroll:[
  nr('꼭대기 가까이에서 크리스천은 품을 더듬었다. 두루마리가 없었다.',
     'Near the top, Christian reached inside his coat. The scroll was gone.'),
  d('christian','크리스천','Christian','아, 내가 잠들었구나. 그거 마지막 문에서 보여 줘야 하는데!',
    'Oh no — I fell asleep. I need that at the last gate!'),
  d('christian','크리스천','Christian','내려가야 해. 다시 내려가야 해.',
    'I have to go back down. All the way back down.'),
  ac((G)=>{ G.toast(L('t_findRoll'), '#e8c84a'); })
],
ch6_foundroll:[
  nr('쉼터 의자 밑에 두루마리가 떨어져 있었다. 크리스천은 그것을 꼭 안고 울었다.',
     'The scroll lay under the bench in the shelter. Christian hugged it and cried.'),
  d('christian','크리스천','Christian','같은 길을 세 번이나 걷게 됐네. 그래도 잃어버리진 않았어.',
    'I had to walk that same path three times. But I didn’t lose it.'),
  ac((G)=>{ G.recoverRoll(); })
],
ch6_lions:[
  nr('궁전 문 앞에 사자 두 마리가 있었다.','Two lions sat in front of the gate.'),
  d('christian','크리스천','Christian','…돌아가야 하나.','...Should I turn around?'),
  d('goodwill','문지기','Gatekeeper','겁내지 마! 사자는 사슬에 묶여 있어. 길 한가운데로만 와. 거기까진 안 닿아.',
    'Don’t be scared! The lions are chained. Walk straight down the middle. They can’t reach that far.'),
  nr('가운데로 걸으니 사자는 으르렁댔지만 닿지 못했다.',
     'He walked down the middle. The lions roared — but they could not reach him.'),
  ac((G)=>{ G.toast(L('t_stayMid'), '#ffe08a'); })
],

/* ───────── 7장 · 아름다운 궁전 ───────── */
ch7_open:[
  d('discretion','조심','Discretion','어디서 왔고 어디로 가니?','Where did you come from, and where are you going?'),
  d('christian','크리스천','Christian','멸망의 도시에서 왔고, 천성으로 가요.',
    'From the City of Doom. I’m going to the Golden City.'),
  d('discretion','조심','Discretion','들어와. 이 집은 순례자들을 위해 이 산 주인이 지은 집이야.',
    'Come in. The owner of this hill built this house for travelers like you.')
],
ch7_piety:[
  d('piety','경건','Piety','왜 길을 떠났어?','Why did you set out?'),
  d('christian','크리스천','Christian','무서운 소리를 들었거든요. 여기 있으면 다 타 버린다고요.',
    'I heard something scary. If I stayed, I’d burn up with the city.'),
  d('piety','경건','Piety','그런데도 이 길로 오게 된 건?','But what got you onto this road?'),
  d('christian','크리스천','Christian','저는 어디로 도망칠지도 몰랐어요. 누가 알려 준 거예요.',
    'I didn’t even know where to run. Someone showed me.')
],
ch7_prudence:[
  d('prudence','신중','Prudence','옛날 동네가 그리울 때 있어?','Do you ever miss your old town?'),
  d('christian','크리스천','Christian','있어요. 부끄럽지만 있어요.','Yes. I’m embarrassed, but yes.'),
  d('prudence','신중','Prudence','그럴 땐 뭘로 이겨?','What do you do when that happens?'),
  d('christian','크리스천','Christian','십자가에서 본 걸 떠올려요. 그리고 두루마리를 읽어요.',
    'I remember what I saw at the Cross. And I read my scroll.'),
  ac((G)=>{ G.player.maxfaith+=6; G.player.faith=G.player.maxfaith; G.toast(L('t_maxFaith',6), '#5ec8f0'); })
],
ch7_charity:[
  d('charity','자비','Charity','가족은 없어?','Do you have family?'),
  d('christian','크리스천','Christian','있어요. 엄마랑 동생들이요.','Yes. My mother and my little brothers and sisters.'),
  d('charity','자비','Charity','왜 안 데려왔어?','Why didn’t you bring them?'),
  d('christian','크리스천','Christian','울면서 같이 가자고 했어요. 근데 저보고 이상하대요.',
    'I begged them, crying. They said I’d gone weird.'),
  d('charity','자비','Charity','그래도 울면서 말한 건 헛되지 않아. 계속 가.',
    'Asking them with tears was not wasted. Keep going.'),
  ac((G)=>{ G.player.maxhp+=8; G.player.hp=G.player.maxhp; G.toast(L('t_maxHp',8), '#e04a4a'); })
],
ch7_armory:[
  d('discretion','조심','Discretion','내일 아침이면 겸손의 골짜기로 내려가. 그 전에 무기고를 열어.',
    'Tomorrow morning you go down into the Valley. Open the armory before you do.'),
  nr('무기고에는 순례자들을 위해 준비해 둔 전신갑옷이 있었다.',
     'Inside the armory was a full set of armor, kept ready for travelers.'),
  ac((G)=>{ G.grantArmor(); }),
  nr('진리의 허리띠 · 의의 갑옷 · 평화의 신발 · 믿음의 방패 · 구원의 투구 · 성령의 검.',
     'Belt of Truth · Breastplate of Right · Shoes of Peace · Shield of Faith · Helmet of Salvation · Sword of the Spirit.'),
  nr('※ ↓ 를 누르면 방패로 불화살을 막는다. 아래 골짜기에서 꼭 필요하다.',
     '※ Press ↓ to block fire arrows with the shield. You will need it down there.'),
  d('prudence','신중','Prudence','하나만 기억해. 이 갑옷에는 등을 가리는 게 없어. 절대 등을 보이지 마.',
    'Remember one thing. This armor has nothing to cover your back. Never turn your back.')
],
ch7_roof:[
  nr('궁전 지붕에서 남쪽을 보니, 멀리 나무와 샘이 있는 산들이 보였다.',
     'From the roof they looked south. Far away were hills with trees and springs.'),
  d('prudence','신중','Prudence','기쁨의 산이야. 저기까지 가면 천성 문이 보여.',
    'Those are the Delight Hills. From there you can see the gate of the Golden City.'),
  d('christian','크리스천','Christian','…보인다. 진짜 보여.','...I see it. I really see it.')
],

/* ───────── 8장 · 겸손의 골짜기 · 아볼루온 ───────── */
ch8_open:[
  nr('내려가는 길은 미끄러웠다. 크리스천은 몇 번이나 발을 헛디뎠다.',
     'The way down was slippery. Christian lost his footing again and again.'),
  nr('골짜기 한가운데에서, 들판 저편으로 무언가 무시무시한 것이 걸어왔다.',
     'In the middle of the valley, something terrible came walking across the field.'),
  ac((G)=>{ G.toast(L('t_needSword'), '#ff8a6a'); })
],
ch8_apollyon:[
  d('christian','크리스천','Christian','…너는 뭐야.','...What are you?','awe'),
  nr('몸은 비늘로 덮이고, 발은 곰의 발이고, 배에서 연기가 나고, 입은 사자의 입이었다.',
     'Scales covered it. Its feet were bear’s feet. Smoke came from its belly. Its mouth was a lion’s mouth.'),
  nr('아볼루온 — "부수는 자"라고 불리는 것.','Apollyon — the one they call "the Destroyer."'),
  nr('"어디서 왔고 어디로 가느냐?"','"Where did you come from, and where are you going?"'),
  d('christian','크리스천','Christian','멸망의 도시에서 왔고 천성으로 간다.',
    'I came from the City of Doom, and I’m going to the Golden City.','brave'),
  nr('"멸망의 도시는 내 땅이다. 내가 거기 왕이야. 왜 내 부하가 도망치지? 돌아와라. 두 배로 주마."',
     '"The City of Doom is mine. I am its king. Why is one of mine running away? Come back. I’ll pay you double."'),
  d('christian','크리스천','Christian','나는 다른 왕이랑 약속했어. 그분을 버릴 수 없어.',
    'I made a promise to another King. I’m not walking away from him.'),
  nr('"너 그를 따르면서도 여러 번 넘어졌잖아. 늪에서, 언덕에서, 쉼터에서 잠들어 두루마리도 잃었지."',
     '"But you tripped so many times. In the swamp. On the hill. You even slept and lost your scroll."'),
  d('christian','크리스천','Christian','다 맞아. 그것보다 더한 것도 있어.',
    'All true. There’s worse, too.'),
  d('christian','크리스천','Christian','근데 내 왕은 용서하는 분이야. 나는 그분 편이고, 그분 길로 간다.',
    'But my King forgives. I’m his, and I’m going his way.'),
  ci('apollyon'),
  nr('"나는 그 왕도, 그 법도, 그 백성도 다 싫다. 여기서 끝내 주마."',
     '"I hate that King, his rules, and his people. This is where you end."'),
  ac((G)=>{ G.startBoss('apollyon'); })
],
ch8_win:[
  nr('크리스천은 검을 두 손으로 붙잡고 외쳤다.','Christian gripped the sword with both hands and shouted.'),
  d('christian','크리스천','Christian','내가 넘어져도 다시 일어난다! 좋아하지 마!',
    'Even if I fall, I get back up! Don’t celebrate yet!'),
  nr('아볼루온은 날개를 펴고 달아났다. 그 뒤로 다시는 나타나지 않았다.',
     'Apollyon spread its wings and fled. It never came back.'),
  nr('그때 어디선가 손이 나타나 나뭇잎 하나를 내밀었다. 상처에 대니 곧 나았다.',
     'A hand appeared and held out a leaf. He pressed it to his wounds, and they closed.'),
  ac((G)=>{ G.player.heal(999); G.player.restoreFaith(999); G.player.gainExp(60); })
],

/* ───────── 9장 · 죽음의 그늘 골짜기 ───────── */
ch9_open:[
  nr('골짜기 하나를 지나자 또 다른 골짜기가 나왔다. 죽음의 그늘 골짜기.',
     'One valley ended and another began. The Valley of the Shadow of Death.'),
  nr('두 사람이 급히 되돌아 나오고 있었다.','Two people were hurrying back out.'),
  d('timorous','소심','Timorous','돌아가! 저 안은 깜깜하고, 구덩이랑 괴물이 가득해!',
    'Go back! It’s pitch black in there — pits and monsters everywhere!'),
  d('christian','크리스천','Christian','…근데 저 길이 천성으로 가는 유일한 길이야.',
    '...But that’s the only road to the Golden City.'),
  ci('valley'),
  nr('오른쪽은 깊은 구덩이, 왼쪽은 바닥 없는 늪. 길은 아주 좁았다.',
     'On the right, a deep pit. On the left, a bottomless bog. The path between was very narrow.'),
  nr('※ 등불 밖은 보이지 않는다. Q 를 누르면 기도하고, 빛이 넓어진다.',
     '※ You cannot see past your lamp. Press Q to pray — your light grows.'),
  ac((G)=>{ G.toast(L('t_dontLeave'), '#c8a0c8'); })
],
ch9_whisper:[
  nr('무언가가 크리스천 뒤에 바짝 붙어서 귀에 대고 속삭였다.',
     'Something crept up right behind Christian and whispered in his ear.'),
  nr('말이 너무 지독해서, 크리스천은 그게 자기 생각인 줄 알고 더 괴로워했다.',
     'The words were so awful that Christian thought they were his own thoughts. That hurt worse.'),
  d('christian','크리스천','Christian','…이게 내 생각이라고? 아니야. 나는 이런 거 바라지 않아.',
    '...Is that me? No. That’s not what I want.'),
  nr('※ 화면에 뜨는 속삭임은 네 것이 아니다. 흔들리지 말고 걸어라.',
     '※ The whispers on screen are not yours. Keep walking.')
],
ch9_dawn:[
  nr('한참을 걷자 앞쪽에서 아침이 밝아 왔다.','After a long walk, morning came up ahead.'),
  d('christian','크리스천','Christian','밤이 아침으로 바뀌었어.','The night turned into morning.'),
  nr('돌아보니 자기가 지나온 길이 얼마나 좁았는지 그제야 보였다. 그리고 자기 힘으로만 걸은 게 아니라는 것도.',
     'Looking back, he finally saw how narrow the path had been. And that his own feet had not done it alone.')
],

/* ───────── 10장 · 허영의 시장 ───────── */
ch10_faithful:[
  d('faithful','신실','Faithful','크리스천! 너도 살아 있었구나!','Christian! You made it too!'),
  d('christian','크리스천','Christian','신실! 너는 늪에 안 빠졌어?','Faithful! Did you miss the swamp?'),
  d('faithful','신실','Faithful','늪은 피했어. 대신 나는 다른 데서 죽을 뻔했지. 너는 사자 만났다며?',
    'I got around the swamp. But something else nearly finished me. You met the lions, right?'),
  d('christian','크리스천','Christian','사자는 묶여 있었어. 진짜 무서웠던 건 아볼루온이야.',
    'The lions were chained. The scary one was Apollyon.'),
  d('faithful','신실','Faithful','우리 둘 다 여기까지 왔네. 같이 가자.',
    'We both made it this far. Let’s go together.'),
  ac((G)=>{ G.joinCompanion('faithful'); })
],
ch10_fair:[
  nr('두 사람 앞에 큰 시장이 있었다. 일 년 내내 열리는 시장, 이름은 허영의 시장.',
     'A huge market stood in front of them. It runs all year. Its name is Vanity Fair.'),
  nr('여기서는 집도, 인기도, 재미도, 이름도 팔았다. 심지어 마음까지 팔았다.',
     'They sold houses, fame, fun, and famous names here. They even sold hearts.'),
  nr('이 길을 지나지 않으면 천성에 갈 수 없다. 왕도 여기를 지나가셨지만 아무것도 사지 않으셨다.',
     'You cannot reach the Golden City without passing through. The King walked through too — and bought nothing.'),
  d('christian','크리스천','Christian','아무것도 사지 말자. 쳐다보지도 말자.',
    'Let’s buy nothing. Let’s not even look.'),
  nr('※ 좌판에 닿으면 신실함이 깎인다. 좌판을 피해 시장을 통과하자.',
     '※ Touching a stall costs you Faithfulness. Get through without touching them.'),
  ac((G)=>{ G.toast(L('t_noBuy'), '#ffb0a0'); })
],
ch10_arrest:[
  nr('"너희는 뭘 살 거냐?"','"So what will you buy?"'),
  d('faithful','신실','Faithful','우리는 진실을 삽니다.','We buy the truth.'),
  nr('그 말에 시장이 뒤집혔다. 두 사람은 맞고, 쇠우리에 갇혔다.',
     'The whole market went wild. They were beaten and locked in an iron cage.'),
  nr('그리고 재판이 열렸다. 재판장의 이름은 "증오"였고, 증인은 시기와 아첨이었다.',
     'Then came a trial. The judge’s name was Hate-Good. The witnesses were Envy and Flattery.'),
  d('judge','재판장 증오','Judge Hate-Good','이 아이들은 우리 장사를 망치고 우리 신을 무시했다.',
    'These boys ruined our business and insulted our gods.'),
  d('faithful','신실','Faithful','제가 무시한 건 사람이 만든 규칙이에요. 제 왕의 법은 달라요.',
    'What I ignored were rules people made up. My King’s law is different.'),
  nr('배심원들은 모두 유죄라고 했다.','Every juror said guilty.')
],
ch10_martyr:[
  nr('그들은 신실을 끌어내 때리고, 돌을 던지고, 마침내 불태웠다.',
     'They dragged Faithful out, beat him, threw stones, and at last burned him.'),
  d('christian','크리스천','Christian','신실…!','Faithful...!'),
  ci('chariot'),
  nr('그런데 크리스천은 다른 것도 보았다. 군중 뒤로 불수레가 내려와 신실을 태우고 하늘로 곧장 올라갔다.',
     'But Christian saw something else. Behind the crowd, a chariot of fire came down, picked Faithful up, and went straight up into the sky.'),
  nr('신실이 먼저 도착한 것이다.','Faithful had arrived first.'),
  ac((G)=>{ G.faithfulDies(); })
],
ch10_hopeful:[
  nr('그 광경을 본 사람 중 하나가 크리스천에게 다가왔다.',
     'One person who saw it walked over to Christian.'),
  d('hopeful','소망','Hopeful','나는 소망이야. 신실이 죽는 걸 보고 나도 가기로 했어.',
    'I’m Hopeful. I watched Faithful die, and I decided to go too.'),
  d('christian','크리스천','Christian','…걔가 죽어서 네가 생긴 거네.',
    '...So he died, and you started.'),
  d('hopeful','소망','Hopeful','한 명이 쓰러지면 두 명이 일어나. 이 시장은 그걸 몰라.',
    'When one falls, two stand up. This market doesn’t know that.'),
  ac((G)=>{ G.joinCompanion('hopeful'); })
],

/* ───────── 11장 · 의심의 성 ───────── */
ch11_bypath:[
  nr('길이 돌투성이가 되어 발이 아팠다. 울타리 너머로 평평한 풀밭이 보였다 — "옆길 초원".',
     'The road turned to sharp stones. Over the fence lay a smooth green meadow — "By-Path Meadow."'),
  d('christian','크리스천','Christian','저기로 가면 편하겠다. 어차피 길이랑 나란히 가잖아.',
    'That would be so much easier. And it runs right next to the road anyway.'),
  d('hopeful','소망','Hopeful','…그거 길에서 벗어나는 거 아냐?',
    '...Isn’t that leaving the road?'),
  d('christian','크리스천','Christian','나란히 간다니까.','It runs right beside it.'),
  cho([
    ['울타리를 넘는다 (편한 길)', 'Climb the fence (the easy way)', 'over', -1],
    ['아파도 돌길로 계속 간다', 'Stay on the stony road', 'stay', +2]
  ])

/* 언어에 맞춰 STORY 를 만든다 */
let STORY = {};
let WHISPERS = [];
function rebuildStory(){
  const k = (LANG==='ko');
  STORY = {};
  for(const id in RAW){
    STORY[id] = RAW[id].map(n=>{
      if(n._n) return {who:null, text: k? n.ko : n.en};
      if(n._d) return {who:n.who, name: k? n.nKo : n.nEn, text: k? n.ko : n.en, mood:n.mood};
      if(n._c) return {choice: n.list.map(c=>({t: k? c[0]:c[1], val:c[2], f:c[3], act:c[4]}))};
      if(n.cine) return {cine:n.cine};
      return n;
    });
  }
  WHISPERS = WHISPERS_RAW.map(w=> k? w[0] : w[1]);
}

/* ============================================================
   70_levels.js — 레벨 빌더 + 제1~6장

'use strict';

class LB {
  constructor(w,h){
    this.w=w; this.h=h;
    this.g=[]; for(let y=0;y<h;y++) this.g.push(new Array(w).fill(' '));
  }
  set(x,y,c){ if(x>=0&&y>=0&&x<this.w&&y<this.h) this.g[y][x]=c; }
  get(x,y){ return (x<0||y<0||x>=this.w||y>=this.h)?' ':this.g[y][x]; }
  rect(x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) this.set(x+i,y+j,c); }
  ground(x1,x2,topY){ for(let x=x1;x<=x2;x++){ for(let y=topY;y<this.h;y++) this.set(x,y,'#'); } }
  /* 두께가 정해진 바닥 — 아래층을 메우지 않는다 */
  floor(x1,x2,topY,th){ this.rect(x1, topY, x2-x1+1, th||3, '#'); }
  terrain(x1,x2,baseY,amp,seed){
    RND=mulberry32(seed||x1*7+baseY);
    let y=baseY;
    for(let x=x1;x<=x2;x++){
      if(rnd()<0.14) y += rndi(-1,1)*(amp?1:0);
      y=clamp(y, baseY-(amp||0), baseY+(amp||0));
      for(let j=y;j<this.h;j++) this.set(x,j,'#');
    }
    RND=mulberry32(20260825);
  }
  plat(x,y,len,c){ for(let i=0;i<len;i++) this.set(x+i,y,c||'='); }
  /* 건널 수 있는 구덩이.
     ⚠ terrain(...,amp) 은 칸마다 높이를 ±1 흔든다. 그 위에 구덩이를 파면
     도움닫기 높이와 착지 높이가 자리마다 달라져, 점프 성공 구간이 운에 좌우된다.
     실측: 1장 x44 는 성공 구간이 **0.5타일**뿐이었다(42.0~43.2 에서 뛰면 전부 사망).
     그래서 구덩이는 반드시 양쪽을 같은 높이로 평탄화한 뒤에 판다. */
  pit(x, width, y, pad){
    pad = pad===undefined? 3 : pad;
    for(let i=x-pad; i<x+width+pad; i++){
      if(i<0 || i>=this.w) continue;
      for(let j=0;j<this.h;j++) if(j>=y) this.set(i,j,'#'); else if(this.at&&false) {}
    }
    // 위쪽을 비워 머리 공간을 확보
    for(let i=x-pad; i<x+width+pad; i++){
      if(i<0 || i>=this.w) continue;
      for(let j=y-4;j<y;j++) this.set(i,j,' ');
    }
    for(let i=0;i<width;i++) for(let j=y;j<this.h;j++) this.set(x+i,j,' ');
  }
  spikes(x,y,len){ for(let i=0;i<len;i++) this.set(x+i,y,'^'); }
  mud(x1,x2,topY){ for(let x=x1;x<=x2;x++) for(let y=topY;y<this.h;y++) this.set(x,y,'m'); }
  water(x1,x2,topY){ for(let x=x1;x<=x2;x++) for(let y=topY;y<this.h;y++) this.set(x,y,'~'); }
  ladder(x,y1,y2){ for(let y=y1;y<=y2;y++) this.set(x,y,'H'); }
  back(x,y,w,h){ for(let j=0;j<h;j++) for(let i=0;i<w;i++){ if(this.get(x+i,y+j)===' ') this.set(x+i,y+j,'.'); } }
  building(x,topY,w,h){ this.back(x,topY,w,h); }
  rows(){ return this.g.map(r=>r.join('')); }
}

  A.push(new Prop(T(194), T(5)-80, 'riverGate', {glow:true, tag:'celgate'}));
  A.push(new Trigger(T(6),0,T(6),T(17), ()=>G.say('ch12_beulah'), {once:true}));
  A.push(new Trigger(T(100),T(6),T(6),T(11), ()=>G.say('ch12_sinking'), {once:true}));
  A.push(new Trigger(T(163),0,T(5),T(17), ()=>G.say('ch12_gate'), {once:true}));
  A.push(new Trigger(T(193),0,T(7),T(17), ()=>G.endGame(), {once:true}));
  return {world, spawn:{x:T(4), y:T(11)}, actors:A, music:'celestial', river:{x1:T(81), x2:T(161)}};
}

/* ═══════════════ 챕터 목록 ═══════════════ */
const CHAPTERS = [

  {num:'제 4 장', title:'좁은 문과 해석자의 집', short:'좁은문', sub:'두드리라, 열릴 것이다',          theme:'gate',     music:'journey',     scenes:[buildCh4]},
