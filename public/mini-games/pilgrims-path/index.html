    x.fillStyle='rgba(206,168,86,0.62)'; x.fillRect(0, CH*0.66, CW, CH*0.12);
    // 열린 문
    const gw=CW*0.14, gh=CH*0.30, gx=CW*0.5, gy=CH*0.78;
    x.fillStyle='rgba(184,142,64,0.75)'; x.fillRect(gx-gw/2-12, gy-gh-12, gw+24, gh+12);
    x.save(); x.globalCompositeOperation='lighter';
    x.fillStyle = rgrad(x, gx, gy-gh*0.5, 6, 420, [[0,'rgba(255,255,250,1)'],[0.3,'rgba(255,250,220,0.55)'],[1,'rgba(255,240,190,0)']]);
    x.fillRect(gx-460, gy-gh-260, 920, gh+460);
    x.restore();
    x.fillStyle='rgba(255,255,252,0.98)'; x.fillRect(gx-gw/2, gy-gh, gw, gh);
    // 길
    x.fillStyle='rgba(226,192,112,0.5)';
    x.beginPath(); x.moveTo(CW*0.30,CH); x.lineTo(gx-gw/2,gy); x.lineTo(gx+gw/2,gy); x.lineTo(CW*0.70,CH); x.closePath(); x.fill();
    // 문으로 들어가는 두 사람
    figure(x, CW*0.465, CH*0.965, 175, {color:'rgba(150,110,50,0.80)'});
    figure(x, CW*0.545, CH*0.975, 168, {color:'rgba(150,110,50,0.80)'});
    motes(x, 190, 111, 'rgba(255,255,235,0.85)', 4.6, null);
    // 아래쪽만 살짝 어둡게 — 시선을 문으로
    x.fillStyle = grad(x,0,CH*0.72,0,CH,[[0,'rgba(180,140,70,0)'],[1,'rgba(140,100,50,0.34)']]);
    x.fillRect(0,CH*0.72,CW,CH*0.28);
    grain(x, 0.035, 103);
  }
}
};

/* ============================================================
   재생기 — 컷신은 "보는 것"이 아니라 "하는 것"이다.
   각 장면은 끝에서 특정 입력을 기다린다(act). 엉뚱한 걸 누르면 대답한다.
   ★ 20초가 지나면 무조건 통과시킨다 — 아이를 컷신에 가두지 않는다.
   ============================================================ */

/* 화면에 보여줄 키 이름. 터치 기기에서는 가상 패드 버튼 이름으로 바꾼다. */
const KEYCAP = {
  pray:     ['Q', '기도', 'Pray'],
  interact: ['E', '확인', 'Talk'],
  jump:     ['Space', '점프', 'Jump'],
  attack:   ['X', '공격', 'Attack'],
  up:       ['↑', '▲', '▲'],
  down:     ['↓', '▼', '▼'],
  left:     ['←', '◀', '◀'],
  right:    ['→', '▶', '▶'],
  menu:     ['I', '메뉴', 'Menu'],
  skill:    ['V', '약속', 'Arrow']
};
function keycap(action){
  const k = KEYCAP[action] || [action, action, action];
  if(Input.touch) return LANG==='ko'? k[1] : k[2];
  return k[0];
}

const Cinema = {
  active:false, id:null, t:0, dur:0, phase:'in', onDone:null,
  cache:{}, img:{}, shownChars:0, lines:[], skipHint:0,
  act:null, actStep:0, actT:0, actDone:false, rejectIdx:0, rejectMsg:null, rejectT:0,
  flash:0, capOverride:null,

  /* 실제 일러스트가 있으면 그걸 쓴다 */
  preload(){
    for(const id in SCENES){
      const src = assetUrl(`assets/cinematic/${id}.webp`);
      const im = new Image();
      im.onload = ()=>{ this.img[id]=im; };
      im.onerror = ()=>{};
      im.src = src;
    }
  },
  render(id){
    if(this.cache[id]) return this.cache[id];
    const c = makeCanvas(CW, CH), x = c.getContext('2d');
    x.imageSmoothingEnabled = true;
    this.cache[id] = {c, x, drawn:-1};
    return this.cache[id];
  },
  setCaption(text){
    this.lines = text.split('\n');
    this.totalChars = text.replace(/\n/g,'').length;
    this.shownChars = 0;
  },

  play(id, onDone){
    if(!SCENES[id]){ if(onDone) onDone(); return; }
    this.active=true; this.id=id; this.t=0; this.phase='in';
    this.onDone = onDone || null;
    this.skipHint = 0; this.fade = undefined; this.flash = 0;
    const sc = SCENES[id];
    this.setCaption((LANG==='ko')? sc.cap[0] : sc.cap[1]);
    this.dur = 150 + this.totalChars*1.6 + (sc.hold? sc.hold*60 : 0);
    // 액션 게이트
    this.act = sc.act || null;
    this.actStep = 0; this.actT = 0; this.actDone = !sc.act;
    this.rejectIdx = 0; this.rejectMsg = null; this.rejectT = 0;
    Audio2.sfx('door');
  },
  finish(){
    this.active=false;
    const sc = SCENES[this.id];
    const cb=this.onDone; this.onDone=null;
    if(sc && sc.after){ try{ sc.after(G); }catch(e){} }
    if(cb) cb();
  },

  /* 요구한 입력을 기다린다 */
  updateAct(){
    const a = this.act;
    this.actT++;
    if(this.rejectT>0) this.rejectT--;

    // 요구한 입력
    if(Input.pressed(a.key)){
      this.actStep++;
      this.flash = a.fx==='burden'? 1.0 : 0.55;
      const steps = a.steps || 1;
      if(a.stepCap && this.actStep < steps){
        const cap = a.stepCap[Math.min(this.actStep-1, a.stepCap.length-1)];
        this.setCaption(LANG==='ko'? cap[0] : cap[1]);
        this.shownChars = this.totalChars;   // 단계 캡션은 바로 보여준다
      }
      if(a.onStep){ try{ a.onStep(this.actStep, G); }catch(e){} }
      Audio2.sfx(a.fx==='burden'? 'burden' : a.fx==='light'? 'item' : a.fx==='knock'? 'door' : 'confirm');
      if(this.actStep >= steps){
        this.actDone = true;
        this.actT = 0;
        if(a.doneCap){
          const c = a.doneCap;
          this.setCaption(LANG==='ko'? c[0] : c[1]);
        }
      }
      return;
    }
    // 엉뚱한 입력 — 대답해 준다
    const rk = a.rejectKeys || ['interact','jump','attack'];
    if(a.reject && rk.some(k=> k!==a.key && Input.pressed(k))){
      const line = a.reject[Math.min(this.rejectIdx, a.reject.length-1)];
      this.rejectMsg = LANG==='ko'? line[0] : line[1];
      this.rejectT = 220;      // 아이가 읽을 시간 (약 3.7초)
      this.rejectIdx++;
      Audio2.sfx('deny');
      return;
    }
    // 20초가 지나면 통과 — 아무도 갇히지 않는다
    if(this.actT > 1200){ this.actDone = true; this.actT = 0; }
  },

  update(){
    if(!this.active) return;
    this.t++;
    this.skipHint++;
    if(this.flash>0) this.flash = Math.max(0, this.flash-0.045);

    if(this.phase==='out'){
      this.fade = (this.fade===undefined? 0 : this.fade) + 0.055;
      if(this.fade>=1){ this.fade=undefined; this.finish(); }
      return;
    }

    // 캡션 타이핑
    if(this.shownChars < this.totalChars){
      this.shownChars += (Input.down('interact')||Input.down('jump'))? 3.2 : 0.85;
      return;
    }

    // 액션 게이트 — 여기서는 스킵이 통하지 않는다
    if(!this.actDone){ this.updateAct(); return; }

    // 액션이 끝난 뒤 잠깐 여운
    if(this.act && this.actT < 46){ this.actT++; return; }

    const skip = Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack');
    if((skip && this.t>26) || this.t > this.dur) this.phase='out';
  },

  draw(x,u){
    if(!this.active) return;
    const sc = SCENES[this.id];
    const t = this.t;

    // 프레임 갱신 — 3프레임에 한 번
    const slot = this.render(this.id);
    if(slot.drawn < 0 || (t - slot.drawn) >= 3){
      slot.x.setTransform(1,0,0,1,0,0);
      slot.x.clearRect(0,0,CW,CH);
      try{ sc.draw(slot.x, t); }
      catch(err){
        slot.x.fillStyle='#0d0a14'; slot.x.fillRect(0,0,CW,CH);
        if(!this.warned){ this.warned=true; console.error('cinema draw failed:', this.id, err); }
      }
      slot.drawn = t;
    }
    const source = this.img[this.id] || slot.c;

    // 켄번즈
    const p = clamp(this.t / Math.max(60, this.dur*0.9), 0, 1);
    const e = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    const k0 = sc.ken? sc.ken[0] : [0.5,0.5,1.06];
    const k1 = sc.ken? sc.ken[1] : [0.5,0.5,1.0];
    const cx = lerp(k0[0],k1[0],e), cy = lerp(k0[1],k1[1],e), z = lerp(k0[2],k1[2],e);

    const barH = 26;
    const viewH = VH - barH*2;
    const srcW = CW/z, srcH = srcW * (viewH/VW);
    const sx = clamp(cx*CW - srcW/2, 0, Math.max(0,CW-srcW));
    const sy = clamp(cy*CH - srcH/2, 0, Math.max(0,CH-srcH));

    x.save();
    x.imageSmoothingEnabled = true;
    x.drawImage(source, sx, sy, srcW, srcH, 0, barH, VW, viewH);
    x.restore();

    // 성공 섬광
    if(this.flash>0){
      x.globalCompositeOperation='lighter';
      x.globalAlpha = this.flash*0.7;
      x.fillStyle='#fff6d8'; x.fillRect(0, barH, VW, viewH);
      x.globalAlpha=1; x.globalCompositeOperation='source-over';
    }

    // 레터박스
    x.fillStyle='#000'; x.fillRect(0,0,VW,barH); x.fillRect(0,VH-barH,VW,barH);

    // 등장/퇴장 페이드
    let a = 0;
    if(t<26) a = 1 - t/26;
    if(this.phase==='out') a = Math.max(a, this.fade||0);
    if(a>0){ x.globalAlpha=a; x.fillStyle='#000'; x.fillRect(0,0,VW,VH); x.globalAlpha=1; }

    // 캡션
    if(t>20){
      const boxH = this.lines.length*17 + 16;
      const by = VH - barH - boxH - 8;
      x.fillStyle='rgba(6,5,12,0.72)'; x.fillRect(12, by, VW-24, boxH);
      x.fillStyle='rgba(201,162,39,0.85)'; x.fillRect(12, by, 3, boxH);
      let acc=0;
      u.globalAlpha = clamp((t-20)/18,0,1) * (1-(this.phase==='out'? (this.fade||0):0));
      this.lines.forEach((line,i)=>{
        const start=acc; acc+=line.length;
        if(start >= this.shownChars) return;
        const vis = line.slice(0, clamp(Math.floor(this.shownChars)-start, 0, line.length));
        drawText(u, vis, 13, 24, by+9+i*17, '#f2ecdc');
      });
      u.globalAlpha=1;

      // ── 액션 프롬프트 ──
      if(this.act && !this.actDone && this.shownChars>=this.totalChars){
        const cap = keycap(this.act.key);
        const label = LANG==='ko'? this.act.prompt[0] : this.act.prompt[1];
        const text = `[${cap}] ${label}`;
        const steps = this.act.steps || 1;
        const w = textWidth(u, text, 13) + 34 + (steps>1? steps*11 : 0);
        const px_ = VW/2 - w/2, py = by - 30;
        const pulse = 0.62 + Math.sin(this.actT*0.09)*0.28;
        // 시간이 지나면 더 또렷해진다
        const urgency = clamp((this.actT-260)/300, 0, 1);
        x.fillStyle=`rgba(20,16,10,${0.82+urgency*0.15})`; x.fillRect(px_, py, w, 24);
        x.fillStyle=`rgba(201,162,39,${pulse+urgency*0.3})`;
        x.fillRect(px_, py, w, 1); x.fillRect(px_, py+23, w, 1);
        x.fillRect(px_, py, 1, 24); x.fillRect(px_+w-1, py, 1, 24);
        u.globalAlpha = 0.8 + pulse*0.2;
        drawText(u, text, 13, px_+16, py+4, '#ffe9a8');
        u.globalAlpha = 1;
        // 여러 번 눌러야 하면 남은 횟수를 점으로
        if(steps>1){
          for(let i=0;i<steps;i++){
            x.fillStyle = i<this.actStep? '#ffe08a' : 'rgba(255,224,138,0.25)';
            x.fillRect(px_+w-14-(steps-1-i)*11, py+9, 6, 6);
          }
        }
      }
      // ── 엉뚱한 입력에 대한 대답 ──
      if(this.rejectT>0){
        const msg = this.rejectMsg;
        const w = textWidth(u, msg, 12) + 26;
        const px_ = VW/2 - w/2, py = by - 58;
        u.globalAlpha = clamp(this.rejectT/50, 0, 1);
        x.globalAlpha = u.globalAlpha;
        x.fillStyle='rgba(30,14,18,0.88)'; x.fillRect(px_, py, w, 20);
        drawText(u, msg, 12, VW/2, py+3, '#e8a8a0', 'center');
        u.globalAlpha=1; x.globalAlpha=1;
      }
    }
    // 건너뛰기 안내 — 액션 대기 중에는 숨긴다
    if(this.skipHint>110 && this.actDone){
      u.globalAlpha = 0.45 + Math.sin(this.skipHint*0.06)*0.2;
      drawText(u, LANG==='ko'? '[Enter] 넘기기' : '[Enter] Skip', 10, VW-16, VH-barH-16, '#c9c2d8', 'right');
      u.globalAlpha=1;
    }
  }
};

</script>
<script>
/* ===== js/95_bridge.js ===== */
/* ============================================================
   95_bridge.js — GamerClock 미니게임 브리지
   핸드오프 문서 §7 계약을 따른다.
   GamerClock 밖(단독 실행)에서는 아무 일도 하지 않는다.
   ============================================================ */
'use strict';

const GCBridge = {
  on:false, ctx:null, startedAt:0, sentStarted:false, lastChapterSent:-1,

  get api(){ return window.GamerClockMiniGame; },

  init(){
    this.on = !!(this.api && window.parent !== window);
    if(!this.on) return;
    this.api.ready();
    this.api.onContext((ctx)=>{
      this.ctx = ctx || {};
      // GamerClock 이 언어를 알려주면 따른다
      const loc = String(this.ctx.locale||'').toLowerCase();
      let stored=null;
      try{ stored = localStorage.getItem(LANG_KEY); }catch(e){}
      if(loc && !stored){
        setLang(loc.startsWith('ko')? 'ko':'en');
        if(typeof updateHintBar==='function') updateHintBar();
        if(typeof rebuildStory==='function') rebuildStory();
      }
    });
  },

  started(){
    if(!this.on || this.sentStarted) return;
    this.sentStarted = true;
    this.startedAt = Date.now();
    this.api.started({
      miniGameSlug: (this.ctx&&this.ctx.miniGameSlug) || 'pilgrims-path',
      eventId: this.ctx && this.ctx.eventId,
      source: this.ctx && this.ctx.source
    });
  },

  /* 장을 하나 넘길 때마다 — 매 프레임이 아니라 의미 있는 순간에만 */
  chapter(index){
    if(!this.on) return;
    if(index <= this.lastChapterSent) return;
    this.lastChapterSent = index;
    this.api.scoreChanged({ score: index, chapter: index });
  },

  completed(){
    if(!this.on) return;
    const p = G.player;
    this.api.completed({
      score: CHAPTERS.length,
      durationMs: this.startedAt? (Date.now()-this.startedAt) : Math.round(G.playTime/60*1000),
      result: 'complete',
      rankLabel: G.rank,
      stats: {
        chapters: CHAPTERS.length,
        faithfulness: p? p.faithfulness : 0,
        level: p? p.level : 1,
        deaths: G.deaths,
        seconds: Math.round(G.playTime/60),
        lang: LANG
      }
    });
  },

  /* 도중에 그만두어도 어디까지 갔는지는 남긴다 */
  quit(){
    if(!this.on || !this.sentStarted) return;
    const p = G.player;
    this.api.completed({
      score: G.chapter,
      durationMs: this.startedAt? (Date.now()-this.startedAt) : 0,
      result: 'complete',
      rankLabel: null,
      stats: {
        chapters: G.chapter,
        faithfulness: p? p.faithfulness : 0,
        level: p? p.level : 1,
        deaths: G.deaths,
        partial: true,
        lang: LANG
      }
    });
  },

  cta(name, target){
    if(!this.on) return;
    this.api.ctaClicked({ cta:name, target: target||null });
  },
  fail(message){
    if(!this.on) return;
    this.api.error({ message: String(message||'unknown') });
  }
};

</script>
<script>
/* ===== js/99_main.js ===== */
/* ============================================================
   99_main.js — 부트스트랩 · 스케일링 · 게임 루프
   ============================================================ */
'use strict';

const R = { g:null, u:null, scale:3, gc:null, uc:null };

function fitCanvas(){
  const wrap=document.getElementById('wrap');
  const touch = ('ontouchstart' in window);
  // 모바일 세로에서는 가상 패드 자리를 남긴다
  const padReserve = (touch && wrap.clientHeight > wrap.clientWidth) ? 210 : 0;
  const availW = wrap.clientWidth - 8;
  const availH = wrap.clientHeight - padReserve - 8;
  let s = Math.min(availW/VW, availH/VH);
  // 화면보다 크면 절대 안 된다 — 1 미만도 허용해야 375px 에서 넘치지 않는다
  s = s >= 1 ? Math.floor(s*2)/2 : Math.max(0.28, Math.floor(s*20)/20);
  R.scale = s;
  const dw = Math.round(VW*s), dh = Math.round(VH*s);
  R.gc.style.width = dw+'px';  R.gc.style.height = dh+'px';
  R.uc.style.width = dw+'px';  R.uc.style.height = dh+'px';
  const dpr = Math.min(2, window.devicePixelRatio||1);
  R.uc.width = Math.round(dw*dpr); R.uc.height = Math.round(dh*dpr);
  R.u = R.uc.getContext('2d');
  R.u.setTransform(s*dpr,0,0,s*dpr,0,0);
  R.u.imageSmoothingEnabled = true;
}

function boot(){
  R.gc = document.getElementById('game');
  R.uc = document.getElementById('ui');
  R.gc.width=VW; R.gc.height=VH;
  R.g = R.gc.getContext('2d');
  R.g.imageSmoothingEnabled=false;

  const load=document.getElementById('loading');
  if(load) load.textContent='어셋 생성 중…';

  loadLang();
  rebuildStory();
  setTimeout(()=>{
    buildArt();
    Cinema.preload();
    Audio2.init();
    Input.init();
    fitCanvas();
    addEventListener('resize', fitCanvas);
    addEventListener('keydown', e=>{
      if(e.code==='KeyM'){ const on=Audio2.toggle(); G.toast(on? L('t_musicOn'):L('t_musicOff'),'#a8a0c0'); }
      if(e.code==='KeyF'){ const w=document.getElementById('wrap');
        if(!document.fullscreenElement){ (w.requestFullscreen&&w.requestFullscreen()); } else document.exitFullscreen(); }
    });
    if(load) load.remove();
    updateHintBar();
    setupStartGate();
    GCBridge.init();
    G.gotoTitle();
    requestAnimationFrame(loop);
    startWatchdog();
  }, 30);
}

let lastT=0, acc=0, lastBeat=0;
const STEP = 1000/60;

function frame(now){
  if(!lastT) lastT=now;
  let dt = now-lastT; lastT=now;
  if(dt>250) dt=250;              // 탭 복귀 시 한 번에 몰아 돌지 않게
  acc += dt;
  let guard=0;
  while(acc >= STEP && guard<10){        // 밀린 시간을 따라잡을 여지를 준다
    acc -= STEP; guard++;
    G.update();
    Input.latch();
  }
  if(acc > STEP*10) acc = STEP*2;        // 너무 밀리면 버린다(따라잡기 폭주 방지)
  R.g.setTransform(1,0,0,1,0,0);
  R.g.clearRect(0,0,VW,VH);
  R.u.clearRect(0,0,VW+4,VH+4);
  G.draw(R.g, R.u);
}

function loop(ts){
  requestAnimationFrame(loop);
  lastBeat = (window.performance? performance.now() : Date.now());
  frame(lastBeat);
}

/* rAF 가 멈추는 환경(백그라운드 탭·일부 임베드 뷰)에서도 게임이 얼지 않도록 하는 워치독.
   rAF 가 정상 동작하면 아무 일도 하지 않는다. 탭이 실제로 숨겨지면 멈춘 채로 둔다. */
const ALWAYS_RUN = /[?&]run=1/.test(location.search);   // 개발·검증용 강제 구동 플래그

/* 마지막 사용자 입력 시각 — "입력이 오는 동안은 화면이 보이는 것이다" 라는 규칙의 근거.
   일부 임베드 뷰(아티팩트·아이프레임)는 눈에 보이는데도 document.hidden 을 참으로 보고한다.
   그 상태에서 멈춰 버리면 사용자에겐 그냥 먹통이다. */
let lastInputAt = (typeof performance!=='undefined'? performance.now() : Date.now());
function markInput(){ lastInputAt = (window.performance? performance.now() : Date.now()); }
['keydown','pointerdown','touchstart','wheel'].forEach(ev=>
  addEventListener(ev, markInput, {passive:true}));

function startWatchdog(){
  setInterval(()=>{
    const now = (window.performance? performance.now() : Date.now());
    /* ⚠ 예전엔 "5초 안에 조작했으면 보고 있는 것"으로 판정했다. 그런데 컷신·대사를
       읽는 동안은 조작을 안 한다 — 임베드(아이프레임)가 document.hidden 을 참으로
       보고하는 환경에서 5초 만에 화면이 통째로 얼어붙었다(실측).
       이제는 오래 방치된 탭만 재운다. 그동안 도는 비용은 CPU 뿐이고, 소리는 어차피 죽는다. */
    const recentlyPlayed = (now - lastInputAt) < 90000;   // 90초
    if(document.hidden && !ALWAYS_RUN && !recentlyPlayed){ lastT=now; return; }
    /* ⚠ 예전엔 200ms 마다 한 번만 frame() 을 불렀다. frame() 이 한 번에 최대 5스텝만
       돌기 때문에 실효 25fps 가 됐고, rAF 가 안 도는 환경(아이프레임 임베드·hidden 으로
       보고되는 탭)에서 게임 전체가 2.4배 느려졌다. 실측: 짐 진 이동이 4.5→1.84 타일/초.
       이제는 rAF 가 놓친 만큼 매 인터벌마다 따라잡는다. */
    if(now - lastBeat > 24){ lastBeat = now; frame(now); }
  }, 8);
}

// 탭 복귀 시 델타 폭주 방지
document.addEventListener('visibilitychange', ()=>{ lastT=0; acc=0; });

if(document.readyState==='loading') addEventListener('DOMContentLoaded', boot);
else boot();

function updateHintBar(){
  const el=document.getElementById('hint');
  if(!el) return;
  el.textContent = (LANG==='ko')
    ? '← → 이동 · Space 점프 · X 공격 · V 빛의화살 · Shift 돌진 · ↓ 방패 · Q 기도 · E 말걸기 · I 가방 · M 음악 · F 전체화면'
    : '← → move · Space jump · X attack · V light arrow · Shift dash · ↓ block · Q pray · E talk · I bag · M music · F fullscreen';
  el.style.fontFamily = UI_FONT;
}

/* 임베드(아티팩트·iframe)에서 키보드 포커스와 오디오를 확실히 살린다 */
function setupStartGate(){
  const gate=document.getElementById('startgate');
  if(!gate) return;
  const t1=document.getElementById('sg1'), t2=document.getElementById('sg2');
  const paint=()=>{
    if(!t1) return;
    if(LANG==='ko'){ t1.textContent='클릭해서 시작';
      t2.innerHTML='화살표 이동 · <span class="key">Space</span> 점프 · <span class="key">X</span> 공격 · <span class="key">E</span> 대화'; }
    else { t1.textContent='Click to Start';
      t2.innerHTML='Arrows to move · <span class="key">Space</span> jump · <span class="key">X</span> attack · <span class="key">E</span> talk'; }
    gate.style.fontFamily = UI_FONT;
  };
  paint();
  onLangChange(paint);        // GamerClock 이 언어를 알려주면 다시 그린다
  const go=()=>{
    try{ window.focus(); }catch(e){}
    Audio2.unlock();
    gate.remove();
  };
  gate.addEventListener('click', go);
  gate.addEventListener('touchstart', (e)=>{ e.preventDefault(); go(); }, {passive:false});
  // 키를 먼저 누르면 그것으로도 시작
  addEventListener('keydown', function once(){ if(document.getElementById('startgate')) go(); removeEventListener('keydown', once); });
  // 창을 클릭할 때마다 포커스를 되찾는다
  addEventListener('pointerdown', ()=>{ try{ window.focus(); }catch(e){} Audio2.unlock(); });
}
