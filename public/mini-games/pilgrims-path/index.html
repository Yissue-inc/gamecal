</script>
<script>
/* ===== js/80_game.js ===== */
/* ============================================================
   80_game.js — 게임 상태 기계 · 스토리 기믹 · 특수 연출
   ============================================================ */
'use strict';

const ST = {BOOT:0, TITLE:1, MAP:2, PLAY:3, ENDING:4};

/* 동행자 — 신실 / 소망 */
class Companion extends Entity {
  constructor(x,y,key,name){
    super(x,y,12,24);
    this.key=key; this.name=name; this.trail=[]; this.grav=GRAV;
    this.animT=0; this.animF=0; this.mode='follow';
    this.actT=0; this.atkT=0;
  }
  /* 신실은 함께 싸우고, 소망은 붙들어 준다 — 성격이 기믹으로 드러난다 */
  companionAct(){
    this.actT++;
    const p=G.player;
    if(this.key==='faithful'){
      if(this.atkT>0){ this.atkT--; return; }
      if(this.actT%26!==0) return;
      for(const a of G.actors){
        if((a instanceof Enemy) && !a.dead && a.kind!=='cart' &&
            Math.abs(a.cx-this.cx)<34 && Math.abs(a.cy-this.cy)<26){
          this.facing = sign(a.cx-this.cx)||this.facing;
          this.atkT=14;
          a.takeHit(4 + Math.floor(p.level*0.5), this.cx, false);
          Audio2.sfx('swing');
          G.particles.burst(a.cx, a.cy, 6, {color:'#ffd8a0', spd:1.4, life:16, size:2, glow:true});
          break;
        }
      }
    } else if(this.key==='hopeful'){
      // 곁에 있으면 마음이 버틴다
      if(Math.abs(p.cx-this.cx)<52){
        if(this.actT%70===0 && p.faith<p.maxfaith) p.faith=Math.min(p.maxfaith,p.faith+1);
        if(this.actT%50===0 && p.sleep>0) p.sleep=Math.max(0,p.sleep-6);
        if(this.actT%40===0 && p.doubt>0) p.doubt=Math.max(0,p.doubt-3);
        if(this.actT%22===0) G.particles.spawn({x:this.cx+(rnd()-0.5)*10,y:this.y+6,vx:(p.cx-this.cx)*0.006,vy:-0.24,
          life:44,max:44,size:2,color:'#8ae0c8',grav:0,glow:true,shrink:true});
      }
    }
  }
  update(world){
    this.t++;
    const p=G.player;
    this.trail.push({x:p.x, y:p.y, f:p.facing});
    if(this.trail.length>26) this.trail.shift();
    const tgt = this.trail[0];
    if(this.mode==='follow' && tgt){
      const dx = tgt.x - this.x;
      if(Math.abs(dx)>3){ this.vx = clamp(dx*0.12, -1.9, 1.9); this.facing = sign(this.vx)||this.facing; }
      else this.vx *= 0.7;
      // 앞이 막히면 뛴다
      if(this.onGround && world.hitsSolid(this.x+sign(this.vx)*8, this.y+10, this.w, 8)) this.vy=-5.4;
      if(this.onGround && tgt.y < this.y-18) this.vy=-6.2;
    }
    this.physics(world);
    if(this.y>world.pxh+30){ this.x=p.x; this.y=p.y-20; this.vy=0; }
    // 너무 뒤처지면 따라붙는다
    if(Math.abs(p.cx-this.cx)>200){ this.x=p.x-24; this.y=p.y; this.vy=0; this.trail=[]; }
    this.companionAct();
    this.animT++; if(this.animT%(Math.abs(this.vx)>0.3?7:22)===0) this.animF++;
  }
  draw(x,cam){
    const S=ART.chars[this.key];
    // 선한 동행자의 온기
    x.globalCompositeOperation='lighter';
    const g=x.createRadialGradient(this.cx-cam.ox,this.cy-cam.oy,3,this.cx-cam.ox,this.cy-cam.oy,22);
    g.addColorStop(0,'rgba(255,240,190,0.16)'); g.addColorStop(1,'rgba(255,235,170,0)');
    x.fillStyle=g; x.fillRect(this.cx-cam.ox-26,this.cy-cam.oy-28,52,56);
    x.globalCompositeOperation='source-over';
    const f = this.atkT>0? S.atk1 : (Math.abs(this.vx)>0.3? S.walk[this.animF%4] : (!this.onGround? S.jump : S.idleA[this.animF%4]));
    const img=this.facing<0?f.l:f.r;
    x.drawImage(img, Math.round(this.cx-img.width/2-cam.ox), Math.round(this.y+this.h-img.height-cam.oy));
  }
}

/* 불의 벽 — 멸망의 도시 추격 */
class FireWall extends Entity {
  constructor(x, world){ super(x, 0, 40, world.pxh); this.solid=false; this.speed=1.02; }
  update(world){
    this.t++;
    this.x += this.speed;
    if(this.t%3===0){
      G.particles.spawn({x:this.x+this.w-6+rnd()*10, y:G.cam.oy+rnd()*VH, vx:0.5+rnd(), vy:-1-rnd()*1.5,
        life:40, max:40, size:rndi(2,4), color: pick(['#ff8c2a','#e04a20','#ffd24a']), grav:-0.02, glow:true, shrink:true});
    }
    if(aabb({x:this.x,y:this.y,w:this.w+8,h:this.h}, G.player.box)){
      if(G.player.state!==PSTATE.DEAD){ G.player.hp=0; G.player.die(); G.toast(L('t_burned'),'#ff8a6a'); }
    }
  }
  draw(x,cam){
    const dx = Math.round(this.x-cam.ox);
    if(dx > VW+40 || dx < -80) return;
    const g=x.createLinearGradient(dx-70,0,dx+this.w,0);
    g.addColorStop(0,'rgba(255,140,40,0)'); g.addColorStop(0.55,'rgba(224,74,32,0.55)'); g.addColorStop(1,'rgba(255,210,74,0.95)');
    x.fillStyle=g; x.fillRect(dx-70, 0, this.w+70, VH);
    for(let i=0;i<10;i++){
      const fy=(this.t*3+i*29)%VH;
      x.fillStyle='rgba(255,230,150,0.6)';
      x.fillRect(dx+rndi(0,30), fy, 3, 8);
    }
  }
}

/* 게임 안에서 쓰는 시네마틱 연출 — 컷신을 띄우지 않고도 장면을 만든다.
   레터박스 · 느린 화면 · 카메라 이동 · 줌을 한 번에 묶는다. */
const Staging = {
  bars:0, barsT:0, slow:0, focus:null, focusT:0,
  /* opt: {bars, zoom, slow, focusOn, hold} */
  begin(opt){
    opt=opt||{};
    this.barsT = opt.bars===false? 0 : 1;
    if(opt.zoom!==undefined) G.cam.setZoom(opt.zoom);
    this.slow = opt.slow||0;
    this.focus = opt.focusOn||null;
    this.focusT = opt.hold||0;
  },
  end(){ this.barsT=0; this.slow=0; this.focus=null; this.focusT=0; G.cam.setZoom(1); },
  update(){
    this.bars = lerp(this.bars, this.barsT, 0.12);
    if(this.bars<0.01 && this.barsT===0) this.bars=0;
    if(this.slow>0) this.slow--;
    if(this.focusT>0){ this.focusT--; if(this.focusT===0) this.focus=null; }
  },
  get active(){ return this.bars>0.01; },
  draw(x){
    if(this.bars<=0.01) return;
    const h = Math.round(24*this.bars);
    x.fillStyle='#000'; x.fillRect(0,0,VW,h); x.fillRect(0,VH-h,VW,h);
  }
};

/* ============================================================ */
const G = {
  state:ST.BOOT,
  cam:new Camera(),
  particles:new Particles(),
  dlg:new Dialogue(),
  toasts:[], dmgNums:[],
  player:null, world:null, actors:[], projectiles:[], pickups:[], companions:[],
  chapter:0, scene:0, sceneDef:null, boss:null,
  codex:{chars:{}, places:{}},
  hintText:null, showStamina:false, flags:{},
  playTime:0, deaths:0, startedAt:0,
  fireWall:null, lightCanvas:null,
  titleSel:0, endT:0, rank:'',
  freeze:0, cutscene:false,

  /* ---------- 유틸 ---------- */
  toast(msg,color){
    const dup=this.toasts.find(t=>t.msg===msg);
    if(dup){ dup.life=Math.max(dup.life,110); return; }      // 같은 말은 다시 쌓지 않는다
    this.toasts.push({msg, color, life:170, max:170});
    if(this.toasts.length>3) this.toasts.shift();
  },
  dmgNum(x,y,n,color,crit){ this.dmgNums.push({x,y,n,color,crit,life:38,vy:-1.1}); },
  say(id, cb){
    const s=STORY[id];
    if(!s){ if(cb)cb(); return; }
    // 대사에 나온 인물은 도감에 남는다
    s.forEach(n=>{ if(n.who) codexMeet('char', n.who); });
    if(ChapterCard.active && ChapterCard.t<70){      // 장 제목이 뜨는 동안은 기다린다
      setTimeout(()=>this.say(id, cb), 700); return;
    }
    this.cutscene=true;
    this.dlg.start(s, (res)=>{
      this.cutscene=false;
      const post=POST[id];
      if(post) post(res);
      if(cb) cb(res);
    });
  },
  whisper(){
    if(this.dlg.active) return;
    this.toast(pick(WHISPERS), '#c88aa0');
    this.player.doubt = Math.min(100, this.player.doubt+4);
  },


  /* ---------- 미니게임 ---------- */
  startMini(kind, opts){
    opts=opts||{};
    const go=()=>{
      const ch0=CHAPTERS[this.chapter];
      const prevBgm=(this.sceneDef&&this.sceneDef.music)||(ch0&&ch0.music)||'journey';
      Audio2.play(kind==='seed'?'palace':'darkness');
      MiniGame.open(kind, (res)=>{
        if(prevBgm) Audio2.play(prevBgm);
        this.miniResults = this.miniResults||{};
        this.miniResults[kind] = res;
        this.flags['mini_'+kind]=true;
        if(res && res.win && opts.rewardWin) opts.rewardWin(res);
        else if(opts.rewardLose) opts.rewardLose(res);
        if(opts.after) opts.after(res);
      });
    };
    if(opts.intro) this.say(opts.intro, go); else go();
  },

  /* ---------- 씬 로딩 ---------- */
  loadChapter(ci, si, keepStats){
    this.chapter=ci; this.scene=si||0;
    const ch=CHAPTERS[ci];
    const def=ch.scenes[this.scene]();
    this.sceneDef=def;
    this.world=def.world;
    this.actors=def.actors||[];
    this.projectiles=[]; this.pickups=[]; this.particles.clear();
    this.toasts=[]; this.dmgNums=[]; this.boss=null; this.fireWall=null;
    this.showStamina=false; this.hintText=null;

    // 벽에 끼인 액터를 위로 밀어 올린다 (배치 실수가 게임을 망치지 않게)
    for(const a of this.actors){
      if(!a.solid || a instanceof Trigger) continue;
      let tries=0;
      while(tries<20 && this.world.hitsSolid(a.x+2, a.y+2, Math.max(4,a.w-4), Math.max(4,a.h-4))){
        a.y -= 4; tries++;
      }
      if(tries>=20) a.dead=true;
    }

    const prev=this.player;
    this.player=new Player(def.spawn.x, def.spawn.y);
    if(prev && keepStats!==false){
      const keep=['level','exp','expNext','maxhp','hp','maxfaith','faith','atk','def','coins',
                  'burden','hasSword','hasShield','canDouble','canDash','faithfulness','weak'];
      keep.forEach(k=> this.player[k]=prev[k]);
      this.player.armor=Object.assign({},prev.armor);
      this.player.items=Object.assign({},prev.items);
    }
    this.player.spawnX=def.spawn.x; this.player.spawnY=def.spawn.y;
    if(def.prison){ this.player.weak=true; this.player.hp=Math.max(3,Math.floor(this.player.maxhp*0.3)); }
    // 동행자 유지
    this.companions = this.companions.filter(c=>c.alive!==false);
    this.companions.forEach(c=>{ c.x=this.player.x-20; c.y=this.player.y; c.trail=[]; });

    Staging.end(); Staging.bars=0;
    this.cam.setZoom(1, true);
    this.cam.follow(this.player, this.world.pxw, this.world.pxh, true);
    if(this.scene===0){ ChapterCard.show(chNum(ci), chTitle(ci), chSub(ci)); GCBridge.chapter(ci); }
    this.objective = ci;
    // 이 장의 장소를 도감에 기록
    SceneArt.prefetch(ci);                       // 그 장의 3막 그림을 미리 받아 둔다
    CODEX_PLACES.filter(r=>r[3]===ci+1).forEach(r=> codexMeet('place', r[0]));
    codexMeet('char','christian');
    /* ⚠ 여기서 씬의 인물을 전부 해금하면 안 된다.
       한때 그렇게 했더니 1장에 발을 들이자마자 60타일 밖의 전도자·고집·유순까지
       도감이 열렸다 — "만난 것만 빛난다"는 규칙 자체가 무너진다.
       해금은 실제로 만났을 때만: 대화(G.say) · 근접(아래 proximity) · 처치(Enemy.die). */
    this.idleT=0;
    Audio2.play(def.music || ch.music || 'journey');
    this.state=ST.PLAY;
    this.freeze=0; this.cutscene=false;
  },
  nextScene(){
    const ch=CHAPTERS[this.chapter];
    if(this.scene+1 < ch.scenes.length){
      this.autoSave('scene');
      Fade.out(()=>{ this.loadChapter(this.chapter, this.scene+1); Fade.in(); });
    } else if(this.chapter+1 < CHAPTERS.length){
      const from=this.chapter, to=this.chapter+1;
      this.autoSave('chapter');
      /* ⚠ 다음 장의 그림을 **지금** 받기 시작한다.
         예전엔 loadChapter(to) 직후에 도입 카드를 띄우려 했는데, 그 시점엔
         아직 디코드가 안 끝나 show() 가 false 를 돌려주고 조용히 건너뛰었다.
         실측: ch3-close 는 떴는데 ch4-open 은 파일이 있는데도 한 번도 안 떴다.
         여정 지도가 떠 있는 몇 초가 받아 두기에 충분하다. */
      SceneArt.prefetch(to);
      /* 장을 마칠 때 결말 그림 → 여정 지도 → 다음 장 도입 그림.
         그림이 없으면 각 단계가 스스로 건너뛴다(빈 액자를 띄우지 않는다). */
      const goMap = ()=> Fade.out(()=>{
        this.state=ST.MAP;
        JourneyMap.open(from, to, ()=>{
          Fade.out(()=>{
            this.loadChapter(to,0);
            StoryCard.show(to, 'open', chSub(to));
            Fade.in();
          });
        });
        Fade.in();
      });
      if(!StoryCard.show(from, 'close', chSub(from), goMap)) goMap();
    } else this.endGame();
  },
  /* 하트를 다 잃으면 그 자리에서 다시 일어난다 (장을 처음부터 하지 않는다) */
  reviveInPlace(){
    this.deaths++;
    const p=this.player;
    p.hp = Math.max(1, Math.ceil(p.maxhp * 0.5));
    p.faith = Math.max(0, Math.floor(p.maxfaith * 0.4));
    p.state = PSTATE.IDLE; p.deathT = 0; p.vx = 0; p.vy = 0;
    p.invT = 150;                       // 일어난 직후엔 잠시 무적
    p.sinking = 0; p.sleep = 0; p.doubt = Math.min(p.doubt, 40);
    // 안전한 자리로 — 없으면 이번 씬 시작점
    if(p.safeX !== undefined && !this.world.hitsSolid(p.safeX, p.safeY, p.w, p.h)){
      p.x = p.safeX; p.y = p.safeY;
    } else { p.x = p.spawnX; p.y = p.spawnY; }
    // 보스전이면 보스도 숨을 고른다
    if(this.boss && !this.boss.dead){ this.boss.state='idle'; this.boss.cool = 90; }
    this.riverDepth = 0; this.fireWall = null;
    this.cam.follow(p, this.world.pxw, this.world.pxh, true);
    this.particles.burst(p.cx, p.cy, 26, {color:'#ffe9a8', spd:1.8, life:44, size:2, glow:true, grav:-0.02});
    Audio2.sfx('heal');
    this.toast(L('t_revive'), '#ffe08a');
  },
  respawn(){
    this.deaths++;
    Fade.out(()=>{
      const p=this.player;
      const st={level:p.level,exp:p.exp,expNext:p.expNext,maxhp:p.maxhp,maxfaith:p.maxfaith,
                atk:p.atk,def:p.def,coins:p.coins,burden:p.burden,hasSword:p.hasSword,hasShield:p.hasShield,
                canDouble:p.canDouble,canDash:p.canDash,faithfulness:p.faithfulness,weak:p.weak,
                armor:Object.assign({},p.armor), items:Object.assign({},p.items)};
      this.loadChapter(this.chapter, this.scene, false);
      Object.assign(this.player, st);
      this.player.armor=st.armor; this.player.items=st.items;
      this.player.hp=this.player.maxhp; this.player.faith=this.player.maxfaith;
      ChapterCard.active=false;
      Fade.in();
    });
  },

  /* 서장 — 크리스천이 누구인지부터 보여준다 */
  playPrologue(){
    rebuildPrologue();
    Fade.out(()=>{
      Fade.a = 1; Fade.target = 0;
      Drama.start(PROLOGUE, (choice)=>{
        this.pendingTrait = choice;
        Fade.out(()=>{ this.loadChapter(0,0,false); this.applyTrait(); Fade.in(); });
      });
      Fade.in();
    });
  },
  applyTrait(){
    const t = this.pendingTrait;
    if(!t || !PROLOGUE_TRAIT[t] || !this.player) return;
    const tr = PROLOGUE_TRAIT[t];
    tr.apply(this.player);
    this.toast((LANG==='ko'? tr.ko : tr.en) + ' — ' + (LANG==='ko'? tr.note.ko : tr.note.en), '#cfe8ff');
    this.pendingTrait = null;
  },

  /* ---------- 스토리 기믹 ---------- */
  startChase(){
    this.fireWall = new FireWall(this.cam.ox - 120, this.world);
    this.toast(L('t_fire'), '#ff8a6a');
    Audio2.play('destruction');
  },
  revealStones(){
    const w=this.world;
    if(!w.hiddenStones) return;
    w.hiddenStones.forEach(([x,y])=>{ for(let i=0;i<3;i++){ w.set(x+i,y,'='); this.particles.burst(T(x+i)+8, T(y)+8, 6, {color:'#8ad0ff',spd:1.2,life:30,size:2,glow:true}); } });
    Audio2.sfx('unlock');
  },
  sinaiCollapse(){
    this.toast(L('t_sinai'), '#ff8a6a');
    this.cam.addShake(9); Audio2.sfx('boss');
    this.flags.sinai=true; this.sinaiT=0;
  },
  burdenFalls(){
    this.cutscene=true;
    Staging.begin({bars:true, zoom:1.35, slow:110});   // 가까이 · 느리게
    Audio2.stop(); Audio2.sfx('burden');
    this.burdenAnim={t:0, x:this.player.cx, y:this.player.y+4, vx:1.4, vy:-1.2};
    this.cam.addShake(3);
    setTimeout(()=>{
      this.player.burden=false;
      this.freeze=0;
      Staging.end();
      Audio2.play('cross');
      this.say('ch5_after');
    }, 2200);
  },
  grantAfterCross(){
    const p=this.player;
    p.burden=false; p.hasSword=true; p.canDouble=true; p.canDash=true;
    p.items.roll=true; p.items.key=true;              // ★ 약속의 열쇠 — 11장까지 아무도 모른다
    p.maxhp+=10; p.hp=p.maxhp; p.maxfaith+=10; p.faith=p.maxfaith;
    p.atk+=3;
    this.actors.filter(a=>a.tag && a.tag.indexOf('shining')===0).forEach(a=>a.hidden=false);
    this.particles.burst(p.cx, p.cy, 40, {color:'#fff6c0', spd:2.6, life:60, size:3, glow:true, grav:-0.02, shrink:true});
    Audio2.sfx('glory');
    this.toast(L('t_burdenGone'), '#ffe08a');
  },
  dropRoll(){
    const p=this.player;
    p.items.roll=false;
    this.flags.rollLost=true;
    const roll=this.actors.find(a=>a.tag==='roll');
    if(roll) roll.hidden=false;
    Audio2.sfx('deny');
    this.toast(L('t_dropped'), '#c8a0a0');
  },
  checkRoll(){
    if(this.flags.rollLost && !this.flags.rollNoticed && !this.player.items.roll){
      this.flags.rollNoticed=true;
      this.say('ch6_lostroll');
    }
  },
  recoverRoll(){
    this.player.items.roll=true;
    this.flags.rollLost=false;
    Audio2.sfx('item');
    this.player.heal(999); this.player.restoreFaith(999);
    this.toast(L('t_gotRoll'), '#ffe08a');
  },
  grantArmor(){
    const p=this.player;
    p.armor={helm:true, plate:true, belt:true, boots:true, shield:true, sword:true};
    p.hasShield=true; p.def+=2; p.maxfaith+=10; p.faith=p.maxfaith;
    Audio2.sfx('glory');
    this.particles.burst(p.cx,p.cy,30,{color:'#cfe8ff',spd:2.2,life:44,size:3,glow:true,grav:-0.02});
    this.toast(L('t_armor'), '#cfe8ff');
  },
  tryLeavePalace(){
    if(!this.player.armor.sword){
      this.hintText=null;
      this.toast(L('t_armorFirst'), '#c8a0a0');
      this.player.x -= 20;
      return;
    }
    this.nextScene();
  },
  startBoss(kind){
    this.cutscene=false;
    const arena=this.sceneDef.bossArena;
    // 플레이어 앞쪽, 화면 안에서 등장한다 — 화면 밖에서 두들겨 맞는 일이 없게
    const bx = clamp(this.player.x + 150, arena? arena.x+40 : 0, arena? arena.x+arena.w-110 : this.world.pxw-110);
    // 지면을 찾아 그 위에 세운다
    let gy = this.player.y;
    for(let ty=Math.floor(this.player.y/TS); ty<this.world.h; ty++){
      if(isSolidCh(this.world.at(Math.floor((bx+30)/TS), ty))){ gy = ty*TS; break; }
    }
    this.boss = kind==='apollyon'? new Apollyon(bx, 0) : new GiantDespair(bx, 0);
    this.boss.y = gy - this.boss.h;
    this.boss.state='intro'; this.boss.stateT=0;
    codexMeet('char', kind==='apollyon'? 'apollyon' : 'despair');   // 보스 대사는 전부 나레이션이라 따로 남긴다
    this.actors.push(this.boss);
    Audio2.play('boss'); Audio2.sfx('roar');
    this.cam.addShake(10);
    this.hitStop(14);
    this.bossIntro = 130;                     // 등장 동안 카메라가 보스를 비춘다
    this.cam.setZoom(0.62);                   // 뒤로 물러나 전신을 보여준다 — 크기가 실감난다
    Staging.begin({bars:true, slow:40});
    // 위압 — 마주 선 것만으로 믿음이 깎인다
    this.player.faith = Math.max(0, this.player.faith - 6);
    this.particles.burst(this.boss.cx, this.boss.cy, 26, {color:'#2a1020', spd:2.6, life:44, size:4, shrink:true});
    this.flags.arenaLock = arena;
  },
  hitStop(n){ this.freeze = Math.max(this.freeze||0, n); },
  onBossDefeat(b){
    this.boss=null; this.flags.arenaLock=null;
    this.cam.setZoom(1);
    this.hitStop(26); this.cam.addShake(9);
    Staging.begin({bars:true, slow:90, zoom:0.9});
    setTimeout(()=>Staging.end(), 2600);
    this.particles.burst(b.cx, b.cy, 60, {color:'#fff2c0', spd:3.4, life:70, size:3, glow:true, grav:-0.02, shrink:true});
    Audio2.sfx('glory');
    if(b instanceof Apollyon){ this.say('ch8_win', ()=>{ this.nextScene(); }); }
    else { this.say('ch11_win', ()=>{ this.nextScene(); }); }
  },
  joinCompanion(key){
    const names={faithful:['신실','Faithful'], hopeful:['소망','Hopeful']};
    const nm = names[key][LANG==='ko'?0:1];
    const c=new Companion(this.player.x-20, this.player.y, key, nm);
    this.companions.push(c);
    this.actors.filter(a=>a.tag===key).forEach(a=>a.hidden=true);
    Audio2.sfx('item');
    this.toast(L('t_joined', nm), '#8ae05a');
  },
  faithfulDies(){
    const c=this.companions.find(x=>x.key==='faithful');
    if(c){ this.companions.splice(this.companions.indexOf(c),1); }
    this.particles.burst(this.player.cx+40, this.player.cy, 30, {color:'#ffd75e',spd:2,life:70,size:3,glow:true,grav:-0.05});
    Audio2.sfx('glory');
    this.player.faithfulness += 2;
  },
  vanityTempt(what){
    const p=this.player;
    p.faithfulness -= 1;
    p.hurt(3, p.cx+10, {unblockable:true});
    Audio2.sfx('deny');
    this.toast(L('t_tempt', what), '#e08a8a');
  },
  vanityTrial(){
    this.say('ch10_arrest', ()=>{
      this.say('ch10_martyr', ()=>{
        this.say('ch10_hopeful');
      });
    });
  },
  despairPrison(){
    this.flags.inPrison=true;
    this.toast(L('t_caught'), '#c8a0a0');
    setTimeout(()=>{ if(this.flags.inPrison && !this.flags.keyHinted) this.say('ch11_key'); }, 9000);
  },
  tryCellDoor(){
    if(!this.flags.inPrison){ return; }
    if(this.flags.cellOpen) return;
    if(!this.flags.keyHinted){
      this.flags.keyHinted=true;
      this.say('ch11_key');
      return;
    }
    Audio2.sfx('deny');
    this.toast(L('t_locked'), '#c8a0a0');
  },
  onUseKey(){
    if(!this.flags.inPrison || this.flags.cellOpen){ Audio2.sfx('deny'); this.toast(L('t_noUse'),'#a8a0b8'); return; }
    this.flags.cellOpen=true; this.flags.inPrison=false;
    this.player.weak=false;
    const w=this.world;
    for(let y=3;y<17;y++){ w.set(28,y,' '); w.set(29,y,' '); }
    for(let y=3;y<17;y++){ w.set(108,y,' '); w.set(109,y,' '); }
    Audio2.sfx('unlock');
    this.particles.burst(T(29), T(10), 30, {color:'#ffd75e',spd:2,life:50,size:3,glow:true});
    this.player.heal(999); this.player.restoreFaith(999);
    this.toast(L('t_unlocked'), '#ffd75e');
  },
  endGame(){
    this.state=ST.ENDING; this.endT=0;
    Audio2.play('celestial');
    const f=this.player.faithfulness;
    this.rank = f>=8? L('rank1') : f>=4? L('rank2') : f>=0? L('rank3') : L('rank4');
    this.saveGame();
    GCBridge.completed();
    this.say('ch12_end');
  },

  /* ---------- 저장 ---------- */
  saveGame(){
    if(!this.player) return;
    const p=this.player;
    Save.write({chapter:this.chapter, scene:this.scene, playTime:this.playTime, deaths:this.deaths,
      // 중간 저장 — 서 있던 자리와 진행 상태까지 그대로 되살린다
      pos:{x:Math.round(p.x), y:Math.round(p.y)},
      hp:Math.round(p.hp), faith:Math.round(p.faith),
      flags:this.flags, codex:this.codex, trait:p.trait||null,
      p:{level:p.level,exp:p.exp,expNext:p.expNext,maxhp:p.maxhp,maxfaith:p.maxfaith,atk:p.atk,def:p.def,
         coins:p.coins,burden:p.burden,hasSword:p.hasSword,hasShield:p.hasShield,canDouble:p.canDouble,
         canDash:p.canDash,faithfulness:p.faithfulness,armor:p.armor,items:p.items},
      comp:this.companions.map(c=>c.key)});
    this.lastSaveAt = this.tick;
  },
  loadGame(){
    const s=Save.read();
    if(!s) return false;
    this.playTime=s.playTime||0; this.deaths=s.deaths||0;
    this.companions=[];
    this.flags = s.flags || {};
    this.codex = s.codex || {chars:{}, places:{}};
    this.loadChapter(s.chapter||0, s.scene||0, false);
    this.flags = s.flags || {};          // loadChapter 가 초기화하므로 다시 얹는다
    Object.assign(this.player, s.p);
    this.player.armor=s.p.armor; this.player.items=s.p.items;
    this.player.trait = s.trait || null;
    // 저장된 자리로 되돌린다 (벽에 끼면 스폰으로)
    if(s.pos && !this.world.hitsSolid(s.pos.x, s.pos.y, 12, 24)){
      this.player.x = s.pos.x; this.player.y = s.pos.y;
      this.cam.follow(this.player, this.world.pxw, this.world.pxh, true);
    }
    this.player.hp = clamp(s.hp || this.player.maxhp, 1, this.player.maxhp);
    this.player.faith = clamp(s.faith===undefined? this.player.maxfaith : s.faith, 0, this.player.maxfaith);
    (s.comp||[]).forEach(k=> this.joinCompanion(k));
    return true;
  },
  /* 자동 저장 — 장 전환·상점·큰 사건 뒤에 조용히 부른다 */
  autoSave(reason){
    this.saveGame();
    this.toast(L('t_saved'), '#8ae05a');
  },
  gotoTitle(){
    this.state=ST.TITLE; this.titleSel=0;
    Audio2.play('title');
  },

  /* ---------- 갱신 ---------- */
  update(){
    this.tick=(this.tick||0)+1;
    /* ⚠ 페이드는 무엇보다 먼저 돈다.
       예전엔 Fade.update() 가 아래 조기 return 들 밑에 있어서, 페이드가 걸린 채
       컷신·프롤로그·도감·미니게임에 들어가면 화면이 검은 채로 영영 안 열렸다.
       (실측: 타이틀 → "처음부터" → 프롤로그가 통째로 암전. 게임을 못 시작한다) */
    Fade.update();
    if(StoryCard.active){ StoryCard.update(); return; }
    if(Cinema.active){ Cinema.update(); this.particles.update(); return; }
    if(Drama.active){ Drama.update(); return; }
    if(MiniGame.active){ MiniGame.update(); this.particles.update(); return; }
    if(Codex.active){ Codex.update(); return; }
    Staging.update();
    // 느린 화면 — 결정적인 순간을 늘려 준다
    if(Staging.slow>0 && (this.tick % 3)!==0){ this.cam.update(); return; }
    ChapterCard.update();
    this.cam.update();

    if(this.state===ST.TITLE){ if(Drama.active){ Drama.update(); return; } this.updateTitle(); return; }
    if(this.state===ST.MAP){ JourneyMap.update(); return; }
    if(this.state===ST.ENDING){ this.endT++; this.dlg.update(); this.particles.update(); return; }
    if(this.state!==ST.PLAY) return;

    if(PauseMenu.active){ PauseMenu.update(); return; }
    if(Input.pressed('menu') && !this.dlg.active && !this.cutscene){ PauseMenu.open(); return; }

    this.playTime++;
    this.dlg.update();
    if(this.freeze>0 && !this.burdenAnim){ this.freeze--; this.particles.update(); this.cam.update(); return; }
    const locked = this.dlg.active || this.cutscene || Cinema.active || Drama.active || Codex.active || MiniGame.active || StoryCard.active || this.bossIntro>0 || (ChapterCard.active&&ChapterCard.t<40);

    const p=this.player;

    // 짐 낙하 연출
    if(this.burdenAnim){
      const b=this.burdenAnim; b.t++;
      b.x+=b.vx; b.vy+=0.14; b.y+=b.vy;
      if(b.y> p.y+40){ b.vy*=-0.42; b.y=p.y+40; b.vx*=0.8; }
      if(b.t%4===0) this.particles.spawn({x:b.x,y:b.y,vx:0,vy:0,life:20,max:20,size:3,color:'#8a6a4a',grav:0.05,shrink:true});
      if(b.t>130) this.burdenAnim=null;
    }

    // 플레이어
    p.update(this.world, !locked);

    /* 안전망 1 — 체력이 0인데 죽음 상태가 아니면 죽인다.
       hurt() 를 안 거치고 hp 만 0이 되는 경로가 있으면 플레이어가 '죽지도 살지도 않은'
       상태로 굳는다(실측: 벽에 낀 채 hp 0, 1초를 기다려도 아무 일도 안 일어남). */
    if(p.hp<=0 && p.state!==PSTATE.DEAD){ p.hp=0; p.die(); }

    /* 안전망 2 — 어떤 이유로든 지형에 낀 플레이어를 위로 밀어 올린다.
       씬 로딩 때 액터에는 이미 하던 처리인데 정작 플레이어에는 없었다. */
    if(p.state!==PSTATE.DEAD && this.world.hitsSolid(p.x+2, p.y+2, p.w-4, p.h-4)){
      let tries=0;
      while(tries<24 && this.world.hitsSolid(p.x+2, p.y+2, p.w-4, p.h-4)){ p.y-=4; tries++; }
      if(tries>=24){ p.x=p.spawnX; p.y=p.spawnY; }   // 그래도 안 되면 시작점으로
      p.vy=0;
    }

    if(p.state===PSTATE.DEAD && p.deathT>70){ this.reviveInPlace(); return; }

    // 보스 아레나 잠금
    if(this.flags.arenaLock && this.boss && !this.boss.dead){
      const a=this.flags.arenaLock;
      if(p.x < a.x+4){ p.x=a.x+4; p.vx=Math.max(0,p.vx); }
    }

    // 동행자
    this.companions.forEach(c=>c.update(this.world));

    // 액터
    for(let i=this.actors.length-1;i>=0;i--){
      const a=this.actors[i];
      if(a.dead){ this.actors.splice(i,1); continue; }
      if(!locked || a.isBoss || a instanceof Trigger || a instanceof NPC || a instanceof Prop) a.update(this.world);
    }
    // 발사체
    for(let i=this.projectiles.length-1;i>=0;i--){
      const pr=this.projectiles[i];
      if(!locked) pr.update(this.world);
      if(pr.dead){ this.projectiles.splice(i,1); continue; }
      if(pr.friendly){
        for(const a of this.actors){
          if((a instanceof Enemy || a.isBoss) && !a.dead && aabb(pr.box, a.box)){
            a.takeHit(pr.dmg, pr.cx, true); pr.dead=true; break;
          }
        }
      } else {
        if(aabb(pr.box, p.box)){
          if(p.blocking && sign(pr.vx)!==p.facing){ Audio2.sfx('shield'); this.particles.burst(pr.cx,pr.cy,8,{color:'#cfe8ff',spd:1.6,life:18,glow:true,size:2}); }
          else p.hurt(pr.dmg, pr.cx);
          pr.dead=true;
        }
      }
    }
    // 픽업
    for(let i=this.pickups.length-1;i>=0;i--){
      const pk=this.pickups[i]; pk.update(this.world);
      if(pk.dead) this.pickups.splice(i,1);
    }
    // 공격 판정
    const hb = p.attackBox();
    if(hb){
      for(const a of this.actors){
        if((a instanceof Enemy || a.isBoss) && !a.dead && aabb(hb, a.box) && p.hitList.indexOf(a.id)<0){
          p.hitList.push(a.id);
          a.takeHit(p.attackDmg(), p.cx, p.atkStep===2);
        }
      }
    }
    // 상호작용
    this.hintText=null;
    if(!locked){
      let target=null;
      for(const a of this.actors){
        if((a instanceof NPC || a instanceof Prop) && a.canTalk && a.canTalk()){ target=a; break; }
      }
      if(target){
        this.hintText = target.hint || '대화';
        if(Input.pressed('interact')){
          target.done=true;
          if(target.opt && target.opt.run) target.opt.run(target);
          else if(target.dialog) this.say(target.dialog);
          else if(target.interact) this.say(target.interact);
        }
      }
    }

    // 인물의 성향이 몸으로 느껴지게 — 선인 곁에선 믿음이 차고, 악인 곁에선 깎인다
    if(this.playTime%24===0){
      for(const a of this.actors){
        if(!(a instanceof NPC) || a.hidden) continue;
        // 바로 앞까지 갔으면 만난 것이다 (말을 안 걸어도)
        if(a.charKey && Math.abs(a.cx-p.cx)<30 && Math.abs(a.cy-p.cy)<32) codexMeet('char', a.charKey);
        const d=Math.abs(a.cx-p.cx);
        if(d>46 || Math.abs(a.cy-p.cy)>40) continue;
        const al=a.align();
        if(al==='good' && p.faith<p.maxfaith){ p.faith=Math.min(p.maxfaith,p.faith+1);
          this.particles.spawn({x:p.cx+(rnd()-0.5)*12,y:p.y,vx:0,vy:-0.3,life:32,max:32,size:2,color:'#ffeaa8',grav:0,glow:true,shrink:true}); }
        else if(al==='evil' && p.faith>0){ p.faith=Math.max(0,p.faith-1);
          this.particles.spawn({x:p.cx+(rnd()-0.5)*12,y:p.y+p.h,vx:0,vy:-0.25,life:32,max:32,size:2,color:'#3a2440',grav:0,shrink:true}); }
      }
    }

    // 불의 벽
    if(this.fireWall) this.fireWall.update(this.world);

    // 시내산 붕괴
    if(this.flags.sinai){
      this.sinaiT++;
      if(this.sinaiT<420 && this.sinaiT%16===0){
        const rx = this.cam.ox + rnd()*VW;
        this.projectiles.push(new Rock(rx, this.cam.oy-16));
        this.cam.addShake(2.5);
      }
      if(this.sinaiT===420){ this.flags.sinai=false; }
    }

    // 기력 (곤고산)
    if(this.showStamina){
      if(p.vy<-0.5 || (!p.onGround && p.vy<2)) p.stamina=Math.max(0,p.stamina-0.32);
      else if(p.onGround && Math.abs(p.vx)<0.2) p.stamina=Math.min(p.maxStamina, p.stamina+0.9);
      else p.stamina=Math.max(0,p.stamina-0.06);
      if(p.stamina<=0 && p.vy<0) p.vy*=0.4;
    }
    // 어둠의 골짜기 — 의심
    if(this.sceneDef.dark){
      if(p.state===PSTATE.PRAY) p.doubt=Math.max(0,p.doubt-1.2);
      else p.doubt=Math.min(100, p.doubt+0.045);
      if(p.doubt>=100){ p.doubt=70; p.hurt(4, p.cx+10, {unblockable:true}); this.toast(L('t_doubtful'),'#c88aa0'); }
      if(this.playTime%260===0) this.whisper();
    }
    // 마법에 걸린 땅 — 졸음
    if(this.sceneDef.enchanted){
      if(Math.abs(p.vx)>0.4 || !p.onGround) p.sleep=Math.max(0,p.sleep-0.5);
      else p.sleep=Math.min(100,p.sleep+0.42);
      if(p.sleep>=100){ p.hp=0; p.die(); this.toast(L('t_asleep'),'#c8a0e0'); }
    }
    // 절망 거인의 오라 — 곁에 있으면 마음이 무너진다
    if(this.boss && this.boss instanceof GiantDespair && !this.boss.dead && this.boss.state!=='intro'){
      const d=Math.abs(this.boss.cx-p.cx);
      if(d<120){
        this.despairAura = clamp(1-(d/120), 0, 1);
        if(this.playTime%18===0){ p.faith=Math.max(0,p.faith-1); }
        if(this.playTime%9===0) this.particles.spawn({x:p.cx+(rnd()-0.5)*20,y:p.y+p.h,vx:0,vy:-0.4,
          life:34,max:34,size:2,color:'#3a2a44',grav:-0.01,shrink:true});
      } else this.despairAura=0;
    } else this.despairAura=0;

    // 죽음의 강
    if(this.sceneDef.river) this.updateRiver();

    // 오래 멈춰 있으면 갈 방향을 살짝 알려준다
    if(Math.abs(p.vx)<0.2 && p.onGround && !this.dlg.active) this.idleT++;
    else this.idleT=0;

    // 물리 소멸
    this.particles.update();

    // 카메라
    if(this.bossIntro>0 && this.boss){
      this.bossIntro--;
      const mid={x:(p.x+this.boss.cx)/2-20, y:this.boss.y, w:40, h:40};
      this.cam.follow(mid, this.world.pxw, this.world.pxh);
      if(this.bossIntro===0){ this.cam.setZoom(0.82); Staging.barsT=0; }   // 싸울 만큼만 당긴다. 여전히 크다.
    } else if(Staging.focus){
      this.cam.follow(Staging.focus, this.world.pxw, this.world.pxh);
    } else if(this.dlg.active){
      // 대화창이 주인공을 가리지 않도록 시야를 위로 (빠르게 붙는다)
      const t={x:p.x, y:p.y-46, w:p.w, h:p.h};
      const oy=this.cam.y;
      this.cam.follow(t, this.world.pxw, this.world.pxh);
      this.cam.y = lerp(oy, this.cam.ty, 0.22);
    } else {
      this.cam.follow(p, this.world.pxw, this.world.pxh);
    }
  },

  updateRiver(){
    const p=this.player, r=this.sceneDef.river;
    if(p.cx < r.x1-6 || p.cx > r.x2+6){ this.riverDepth=0; this.riverIn=false; return; }
    if(!this.riverIn){ this.riverIn=true; Audio2.sfx('splash'); }
    p.grav=0; p.vy=0;
    const surface = T(10);
    if(this.riverDepth===undefined) this.riverDepth=0;

    const forward = Input.down('right') && !this.dlg.active;
    const back    = Input.down('left')  && !this.dlg.active;
    if(forward){ this.riverDepth = Math.max(0, this.riverDepth-0.85); p.vx = Math.max(p.vx, 1.05); p.facing=1; }
    else if(back){ this.riverDepth = Math.min(62, this.riverDepth+1.0); p.vx = Math.min(p.vx, -0.5); }
    else { this.riverDepth = Math.min(62, this.riverDepth+0.42); p.vx *= 0.9; }

    p.y = surface + this.riverDepth - 12;

    // 깊이 들어갈수록 마음이 흔들린다
    if(this.riverDepth>30 && this.playTime%30===0) p.faith=Math.max(0,p.faith-1);
    if(this.riverDepth>=62){
      if(!this.riverHurtT || this.playTime-this.riverHurtT>110){
        this.riverHurtT=this.playTime;
        p.hurt(3, p.cx, {unblockable:true});
        this.toast(L('t_hopeCall'), '#8ad0ff');
      }
      this.riverDepth=42;
    }
    // 물살
    if(this.playTime%7===0)
      this.particles.spawn({x:p.cx+(rnd()-0.5)*16, y:surface+2, vx:-0.3-rnd()*0.3, vy:0,
        life:30,max:30,size:2,color:'#dff0fb',grav:0,shrink:true});
    // 소망은 곁에서 함께 떠 있다
    for(const c of this.companions){
      c.grav=0; c.vy=0;
      const tx = p.x - 26;
      c.x = lerp(c.x, tx, 0.10);
      c.y = lerp(c.y, p.y + 4, 0.10);
      c.facing = 1;
      if(this.playTime%40===0 && this.riverDepth>34) this.riverDepth = Math.max(0, this.riverDepth-3);  // 붙들어 준다
    }
  },

  titleItems(){
    const has=!!Save.read();
    const it=[];
    if(has) it.push({k:'continue', t:L('continueGame')});
    it.push({k:'new', t:L('newGame')});
    it.push({k:'how', t:L('howToPlay')});
    it.push({k:'lang', t:L('language')});
    return it;
  },
  updateTitle(){
    if(PauseMenu.active){ PauseMenu.update(); return; }
    const items=this.titleItems();
    if(this.titleSel>=items.length) this.titleSel=0;
    if(Input.pressed('up')){ this.titleSel=(this.titleSel+items.length-1)%items.length; Audio2.sfx('select'); }
    if(Input.pressed('down')){ this.titleSel=(this.titleSel+1)%items.length; Audio2.sfx('select'); }
    if(Input.pressed('left')||Input.pressed('right')){
      if(items[this.titleSel].k==='lang'){ setLang(LANG==='ko'?'en':'ko'); updateHintBar(); Audio2.sfx('confirm'); }
    }
    if(Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')){
      Audio2.sfx('confirm');
      const k=items[this.titleSel].k;
      if(k==='continue'){ GCBridge.started(); Fade.out(()=>{ if(!this.loadGame()) this.loadChapter(0,0,false); Fade.in(); }); }
      else if(k==='new'){
        Save.clear(); this.companions=[]; this.flags={}; this.playTime=0; this.deaths=0;
        this.codex = {chars:{}, places:{}};
        GCBridge.started();
        this.playPrologue();
      }
      else if(k==='how'){ PauseMenu.active=true; PauseMenu.tab=2; }
      else if(k==='lang'){ setLang(LANG==='ko'?'en':'ko'); updateHintBar(); }
    }
  },

  /* ---------- 그리기 ---------- */
  draw(x,u){
    if(this.state===ST.TITLE){ this.drawTitle(x,u); if(Drama.active) Drama.draw(x,u); Fade.draw(x,u); return; }
    if(this.state===ST.MAP){ JourneyMap.draw(x,u); Fade.draw(x,u); return; }
    if(this.state===ST.ENDING){ this.drawEnding(x,u); Cinema.draw(x,u); Fade.draw(x,u); return; }
    if(!this.world) return;

    // 줌 — 1 미만이면 화면이 넓어져 상대가 압도적으로 커 보인다
    const Z = this.cam.zoom;
    const zoomed = Math.abs(Z-1) > 0.001;
    if(zoomed){
      x.save();
      x.translate(VW/2, VH/2); x.scale(Z, Z); x.translate(-VW/2, -VH/2);
      // 줌 아웃하면 화면 밖이 비므로 배경색으로 채운다
      const th=THEMES[this.world.theme];
      x.fillStyle = th? th.sky[0] : '#000';
      const pad = (1/Z - 1) * VW / 2 + 8;
      x.fillRect(-pad, -pad, VW+pad*2, VH+pad*2);
    }

    this.world.draw(x, this.cam);

    // 뒤쪽 오브젝트
    for(const a of this.actors) if(a instanceof Prop && a.back) a.draw(x,this.cam);
    // 픽업
    for(const pk of this.pickups) pk.draw(x,this.cam);
    // 앞쪽 오브젝트 · NPC
    for(const a of this.actors){
      if(a instanceof Prop && !a.back) a.draw(x,this.cam);
      else if(a instanceof NPC) a.draw(x,this.cam);
      else if(a instanceof Trigger) a.draw(x,this.cam);
    }
    // 동행자
    for(const c of this.companions) c.draw(x,this.cam);
    // 적 · 보스
    for(const a of this.actors) if(a instanceof Enemy || a.isBoss) a.draw(x,this.cam);
    // 플레이어
    this.player.draw(x, this.cam);
    // 짐 낙하 연출
    if(this.burdenAnim){
      const b=this.burdenAnim;
      x.drawImage(ART.icons.burden, Math.round(b.x-this.cam.ox-5), Math.round(b.y-this.cam.oy-5), 14, 14);
    }
    // 발사체
    for(const pr of this.projectiles) pr.draw(x,this.cam);
    // 불의 벽
    if(this.fireWall) this.fireWall.draw(x,this.cam);
    // 파티클
    this.particles.draw(x,this.cam);

    if(zoomed) x.restore();     // 여기서부터는 화면 좌표 (HUD·연출)

    Staging.draw(x);            // 레터박스

    // 진행 방향 안내 (오래 멈춰 있을 때만)
    if(this.idleT>200 && !this.boss){
      const dir = this.sceneDef.vertical? 0 : 1;
      const ax = Math.round(this.player.cx - this.cam.ox) + (dir? 26:0);
      const ay = Math.round(this.player.y - 16 - this.cam.oy) - (dir? 0:10);
      const bob = Math.sin(this.tick*0.12)*2;
      x.globalAlpha=0.55+Math.sin(this.tick*0.12)*0.2;
      x.fillStyle='#ffe08a';
      if(dir){ for(let i=0;i<5;i++) x.fillRect(ax+bob+i, ay-i, 2, 1+i*2); }
      else { for(let i=0;i<5;i++) x.fillRect(ax-i, ay+bob+i, 1+i*2, 2); }
      x.globalAlpha=1;
    }

    // 환경 색조
    const th=THEMES[this.world.theme];
    if(th && th.ambA){ x.globalAlpha=th.ambA; x.fillStyle=th.amb; x.fillRect(0,0,VW,VH); x.globalAlpha=1; }

    // 감옥 — 좁고 답답하게
    if(this.flags.inPrison){
      x.globalAlpha=0.55;
      const g=x.createRadialGradient(VW/2,VH/2,VH*0.20,VW/2,VH/2,VH*0.78);
      g.addColorStop(0,'rgba(6,4,10,0)'); g.addColorStop(1,'rgba(6,4,10,1)');
      x.fillStyle=g; x.fillRect(0,0,VW,VH); x.globalAlpha=1;
    }
    // 절망의 오라
    if(this.despairAura>0){
      x.globalAlpha=this.despairAura*0.45;
      const g=x.createRadialGradient(VW/2,VH/2,VH*0.25,VW/2,VH/2,VH*0.85);
      g.addColorStop(0,'rgba(20,12,28,0)'); g.addColorStop(1,'rgba(20,12,28,1)');
      x.fillStyle=g; x.fillRect(0,0,VW,VH);
      x.globalAlpha=1;
    }
    // 어둠 — 등불 반경
    if(this.sceneDef.dark) this.drawDarkness(x);

    // 마법의 땅 — 졸음 비네트
    if(this.sceneDef.enchanted && this.player.sleep>20){
      const a=(this.player.sleep-20)/80*0.75;
      x.globalAlpha=a; x.fillStyle='#2a1838'; x.fillRect(0,0,VW,VH); x.globalAlpha=1;
    }
    // 강 — 수면 위 광채 + 물속 깊이감
    if(this.sceneDef.river){
      const surfY = T(10) - this.cam.oy;
      if(surfY < VH){
        const g=x.createLinearGradient(0, surfY, 0, VH);
        g.addColorStop(0,'rgba(20,50,90,0)'); g.addColorStop(1,'rgba(8,22,48,0.72)');
        x.fillStyle=g; x.fillRect(0, surfY, VW, VH-surfY);
        // 수면 반짝임
        x.globalCompositeOperation='lighter';
        for(let i=0;i<10;i++){
          const sx=((i*57 + this.tick*0.5) % VW);
          x.fillStyle='rgba(255,250,220,0.28)';
          x.fillRect(sx, surfY+1, 8, 1);
        }
        x.globalCompositeOperation='source-over';
      }
      x.globalCompositeOperation='lighter'; x.globalAlpha=0.10;
      x.fillStyle='#ffeaa8'; x.fillRect(0,0,VW,VH*0.55);
      x.globalAlpha=1; x.globalCompositeOperation='source-over';
      // 깊이 경고
      if(this.riverDepth>34){
        const a=clamp((this.riverDepth-34)/28,0,1)*0.5;
        x.globalAlpha=a; x.fillStyle='#0a1830'; x.fillRect(0,0,VW,VH); x.globalAlpha=1;
      }
    }

    if(StoryCard.active){ StoryCard.draw(x,u); Fade.draw(x,u); return; }
    if(MiniGame.active){ MiniGame.draw(x,u); this.particles.draw(x,{ox:0,oy:0}); Fade.draw(x,u); return; }
    if(Cinema.active){ Cinema.draw(x,u); return; }
    if(Drama.active){ Drama.draw(x,u); Fade.draw(x,u); return; }
    if(Codex.active){ Codex.draw(x,u); return; }
    if(PauseMenu.active){ PauseMenu.draw(x,u); Fade.draw(x,u); return; }
    drawHUD(x,u);
    this.dlg.draw(x,u);
    ChapterCard.draw(x,u);
    Fade.draw(x,u);
  },

  drawDarkness(x){
    if(!this.lightCanvas) this.lightCanvas=makeCanvas(VW,VH);
    const lc=this.lightCanvas, lx=ctxOf(lc);
    lx.clearRect(0,0,VW,VH);
    lx.fillStyle='rgba(2,2,6,0.94)'; lx.fillRect(0,0,VW,VH);
    lx.globalCompositeOperation='destination-out';
    const p=this.player;
    // 길의 윤곽만 아주 흐리게 — 어디를 딛는지는 보이되 분위기는 유지
    lx.fillStyle='rgba(0,0,0,0.26)';
    const w=this.world;
    const tx0=Math.max(0,Math.floor((this.cam.ox-16)/TS)), tx1=Math.min(w.w-1,Math.floor((this.cam.ox+VW+16)/TS));
    const ty0=Math.max(0,Math.floor(this.cam.oy/TS)), ty1=Math.min(w.h-1,Math.floor((this.cam.oy+VH)/TS));
    for(let ty=ty0;ty<=ty1;ty++) for(let tx=tx0;tx<=tx1;tx++){
      const c=w.at(tx,ty);
      if((c==='#'||c==='=') && w.at(tx,ty-1)!=='#'){
        lx.fillRect(tx*TS-this.cam.ox, ty*TS-this.cam.oy, TS, 3);
      }
    }
    const px_=p.cx-this.cam.ox, py=p.cy-this.cam.oy;
    let rad = 62 + (p.state===PSTATE.PRAY? 46 : 0) + Math.sin(this.playTime*0.08)*3;
    rad *= (1 - p.doubt/260);
    const g=lx.createRadialGradient(px_,py,4,px_,py,rad);
    g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(0.55,'rgba(0,0,0,0.9)'); g.addColorStop(1,'rgba(0,0,0,0)');
    lx.fillStyle=g; lx.beginPath(); lx.arc(px_,py,rad,0,7); lx.fill();
    // 빛의 화살도 주변을 밝힌다
    for(const pr of this.projectiles){
      if(!pr.friendly) continue;
      const g2=lx.createRadialGradient(pr.cx-this.cam.ox,pr.cy-this.cam.oy,2,pr.cx-this.cam.ox,pr.cy-this.cam.oy,34);
      g2.addColorStop(0,'rgba(0,0,0,0.9)'); g2.addColorStop(1,'rgba(0,0,0,0)');
      lx.fillStyle=g2; lx.beginPath(); lx.arc(pr.cx-this.cam.ox,pr.cy-this.cam.oy,34,0,7); lx.fill();
    }
    lx.globalCompositeOperation='source-over';
    x.drawImage(lc,0,0);
  },

  drawTitle(x,u){
    const g=x.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#0e0a18'); g.addColorStop(0.6,'#2a1830'); g.addColorStop(1,'#5a3a48');
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    RND=mulberry32(9);
    for(let i=0;i<90;i++){ x.fillStyle=`rgba(255,240,200,${0.15+rnd()*0.5})`; x.fillRect(rndi(0,VW),rndi(0,VH*0.6),1,1); }
    RND=mulberry32(20260825);
    // 원경 도시 + 십자가 — 중세 읍성 실루엣 (네모 고층 빌딩이 아니다)
    x.fillStyle='#1a1020';
    for(let i=0;i<22;i++){
      const bx=i*24+((i*7)%11), bw=17, bh=16+((i*13)%26);
      x.fillRect(bx, VH-40-bh, bw, bh+40);
      x.beginPath(); x.moveTo(bx-3, VH-40-bh);
      x.lineTo(bx+bw/2, VH-40-bh-(6+((i*5)%9))); x.lineTo(bx+bw+3, VH-40-bh); x.closePath(); x.fill();
    }
    [58, 196, 330].forEach((tx,i)=>{                   // 종탑
      const th=44+i*7;
      x.fillRect(tx, VH-40-th, 13, th+40);
      x.beginPath(); x.moveTo(tx-4, VH-40-th); x.lineTo(tx+6.5, VH-40-th-16); x.lineTo(tx+17, VH-40-th); x.closePath(); x.fill();
    });
    x.fillRect(0, VH-30, VW, 30);                      // 성벽
    for(let cx2=0; cx2<VW; cx2+=11) x.fillRect(cx2, VH-35, 6, 6);
    const t=this.tick||0;
    // 십자가 광원 (부드러운 원형)
    x.globalCompositeOperation='lighter';
    const gg=x.createRadialGradient(VW/2, 66, 6, VW/2, 66, 78);
    const pulse=0.30+Math.sin(t*0.03)*0.07;
    gg.addColorStop(0, `rgba(255,220,150,${pulse})`);
    gg.addColorStop(0.45, `rgba(255,190,110,${pulse*0.42})`);
    gg.addColorStop(1, 'rgba(255,180,90,0)');
    x.fillStyle=gg; x.fillRect(VW/2-90, -14, 180, 160);
    x.globalCompositeOperation='source-over';
    x.drawImage(ART.obj.cross, VW/2-20, 34);
    // 순례자 실루엣 — 짐을 지고 십자가를 향해 걷는다
    const S=ART.chars.pcBurden;
    const wx = 30 + ((t*0.35)%(VW+60));
    x.globalAlpha=0.9;
    x.drawImage(S.walk[Math.floor(t/9)%4].r, Math.round(wx), VH-64);
    x.globalAlpha=1;
    if(PauseMenu.active){ PauseMenu.draw(x,u); return; }     // 메뉴가 열리면 타이틀 글자는 그리지 않는다
    if(Drama.active) return;                                 // 서장 중에도 마찬가지
    drawText(u, L('gameTitle'), LANG==='ko'?34:28, VW/2, 108, '#f4ecd8','center');
    drawText(u, L('gameSub'), 13, VW/2, 148, '#c9a227','center');
    x.fillStyle='rgba(201,162,39,0.5)'; x.fillRect(VW/2-56, 166, 112, 1);
    const items=this.titleItems();
    items.forEach((it,i)=>{
      const yy=176+i*20;
      if(i===this.titleSel){ x.fillStyle='rgba(255,224,138,0.16)'; x.fillRect(VW/2-80,yy-3,160,19);
        x.fillStyle='#ffe08a'; x.fillRect(VW/2-72,yy+5,5,5); x.fillRect(VW/2+67,yy+5,5,5); }
      drawText(u, it.t, 13, VW/2, yy, i===this.titleSel?'#ffe08a':'#a8a0b8','center');
    });
    drawText(u, L('titleCredit'), 10, VW/2, VH-14, '#6a6480','center');
    PauseMenu.draw(x,u);
  },

  drawEnding(x,u){
    const t=this.endT;
    const g=x.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,'#ffd06a'); g.addColorStop(0.5,'#ffeaa8'); g.addColorStop(1,'#fffbe8');
    x.fillStyle=g; x.fillRect(0,0,VW,VH);
    x.globalCompositeOperation='lighter';
    for(let i=0;i<20;i++){
      x.save(); x.translate(VW*0.5, -40); x.rotate((i/20)*Math.PI*2 + t*0.0016);
      x.globalAlpha=0.10; x.fillStyle='#ffffff'; x.fillRect(-7,0,14,VH*2); x.restore();
    }
    x.globalCompositeOperation='source-over'; x.globalAlpha=1;
    x.drawImage(ART.obj.riverGate, VW/2-32, 40);
    if(t%9===0) this.particles.spawn({x:rnd()*VW+this.cam.ox, y:VH+this.cam.oy, vx:(rnd()-0.5)*0.4, vy:-0.5-rnd()*0.6,
      life:150,max:150,size:2,color:'#ffffff',grav:0,glow:true,shrink:true});
    this.particles.draw(x, {ox:this.cam.ox, oy:this.cam.oy});
    if(!this.dlg.active){
      panel(x, 40, 130, VW-80, 118, {bg:'rgba(40,30,10,0.82)', b1:'#ffe9a0', b2:'#8a7030'});
      drawText(u, L('endTitle'), LANG==='ko'?20:16, VW/2, 140, '#fff6d0','center');
      const mm=Math.floor(this.playTime/3600), ss=Math.floor(this.playTime/60)%60;
      const rows=[
        [L('e_rank'), this.rank],
        [L('e_faith'), String(this.player.faithfulness)],
        [L('e_level'), `Lv.${this.player.level}`],
        [L('e_time'), L('timeFmt', mm, ss)],
        [L('e_deaths'), L('timesFmt', this.deaths)]
      ];
      rows.forEach((r,i)=>{
        drawText(u, r[0], 12, 70, 170+i*15, '#d8c890');
        drawText(u, r[1], 12, VW-70, 170+i*15, '#fff6d0','right');
      });
      if(t>120 && Math.sin(t*0.08)>0) drawText(u, L('e_again'), 11, VW/2, VH-16, '#8a7030','center');
      if(t>120 && (Input.pressed('interact')||Input.pressed('jump'))){ Fade.out(()=>{ this.gotoTitle(); Fade.in(); }); }
    }
    this.dlg.draw(x,u);
  }
};

/* 대화 종료 후 분기 처리 */
const POST = {
  ch1_evangelist:()=>{ G.actors.filter(a=>a.tag==='evang').forEach(a=>a.hidden=true); },
  ch1_neighbors:()=>{ G.actors.filter(a=>a.tag==='pliable').forEach(a=>{a.hidden=false; a.walk=0.6;}); },
  ch2_pliable:()=>{ G.actors.filter(a=>a.tag==='pliable').forEach(a=>a.hidden=true); },
  ch2_help:()=>{ G.player.heal(999); },
  ch3_worldly:(res)=>{
    if(res==='easy'){
      G.say('ch3_easy', ()=>{ G.player.x=T(40); G.player.y=T(8); G.player.vy=0; G.cam.follow(G.player,G.world.pxw,G.world.pxh,true); });
    } else {
      G.say('ch3_hard');
    }
  },
  ch3_rebuke:()=>{ G.actors.filter(a=>a.tag==='evang2').forEach(a=>a.hidden=true); },
  /* 원작 보강 인물의 뒤처리 — 선택은 실제로 난이도를 바꾼다 */
  ch6_formalist:(res)=>{
    if(res==='wide'){
      G.flags.tookGlance=true;
      G.player.doubt=Math.min(100,G.player.doubt+10);
      G.say('ch6_formalist_wide');
    } else {
      G.flags.keptRoad=true;
      G.player.faith=Math.min(G.player.maxfaith,G.player.faith+14);
      G.toast(LANG==='ko'?'길을 지켰다 (+14)':'You kept the road (+14)', '#5ec8f0');
    }
    G.actors.filter(a=>a.tag==='wallpair').forEach(a=>a.hidden=true);
  },
  ch12_flatterer:(res)=>{
    if(res==='net'){
      // 그물에 걸린다 — 진짜로 갇히고, 빠져나오려면 값을 치른다
      G.flags.netted=true;
      G.say('ch12_flatterer_net', ()=>{
        G.player.hurt(2, G.player.cx+20);
        G.player.doubt=Math.min(100,G.player.doubt+16);
      });
    } else {
      G.player.faith=Math.min(G.player.maxfaith,G.player.faith+16);
      G.say('ch12_flatterer_map');
    }
    G.actors.filter(a=>a.tag==='flatterer').forEach(a=>a.hidden=true);
  },
  ch4_goodwill:()=>{ G.toast(L('t_toInterp'), '#ffe08a'); },
  ch4_interp:()=>{ G.toast(L('t_interpHint'), '#ffe08a'); },
  ch5_cross:()=>{},
  ch6_arbor:()=>{},
  ch8_apollyon:()=>{},
  ch9_open:()=>{ G.toast(L('t_prayHint'), '#ffe08a'); },
  ch10_faithful:()=>{},
  ch11_bypath:(res)=>{
    if(res==='over'){
      G.say('ch11_over', ()=>{ Fade.out(()=>{ G.loadChapter(10,1); Fade.in(); }); });
    } else {
      G.say('ch11_stay', ()=>{ Fade.out(()=>{ G.loadChapter(10,1); Fade.in(); }); });
    }
  },
  demas:(res)=>{ G.say(res==='dig'? 'demas_dig':'demas_pass'); },
  ch12_river:()=>{ G.toast(L('t_keepRight'), '#8ad0ff'); },
  ch12_end:()=>{}
};

</script>
<script>
/* ===== js/85_drama.js ===== */
/* ============================================================
   85_drama.js — 대형 초상 대화 (JRPG 이벤트 씬) + 인물별 목소리
   양옆에 인물 반신을 크게 세우고 가운데 양피지 대화창을 띄운다.
   ★ assets/portrait/<key>.webp 가 있으면 그 그림을 쓰고,
     없으면 기존 픽셀 스프라이트를 크게 확대해 쓴다 (교체 준비 완료)
   ============================================================ */
'use strict';

/* ── 대형 초상 로더 ──────────────────────────────────────────
   주인공은 "지금 어떤 모습인가(form) × 지금 어떤 감정인가(mood)" 로 그림이 갈린다.
     form : burden(짐을 진) → robe(십자가 뒤 흰옷) → armor(궁전 뒤 전신갑주)
     mood : neutral 을 기본으로, 장면마다 지정
   파일 규칙  assets/portrait/christian-<form>-<mood>.webp
   그 밖의 인물  assets/portrait/<key>.webp
   폴백 순서  요청한 표정 → 같은 form 의 neutral → 평면 <key>.webp → 픽셀 스프라이트
   ⚠ 파일이 없어도 게임은 그대로 돌아간다. 없는 파일은 두 번 요청하지 않는다. */
const HERO_MOODS = {
  burden: ['neutral','strain','fear','shame','despair','cry','resolve'],
  robe:   ['joy','relief'],
  armor:  ['neutral','brave','awe','grief','hurt']
};

/* 배달된 파일명이 게임 키와 다른 인물들.
   ⚠ 파일을 다시 만들어 달라고 하지 않는다 — 이름 쪽이 더 서술적이고,
   맞추는 건 이쪽이 한 줄이다. (지난번 표정 초상 14장이 이 불일치 하나로
   한 장도 안 떴다. 그 교훈으로 별칭 표를 둔다.) */
const PORTRAIT_ALIAS = {
  judge:    'judge-hategood',
  shepherd: 'shepherd-knowledge',
  shining:  'shining-one',
  worldly:  'worldly-wiseman'
};

const BigPortrait = {
  cache: {}, img: {}, tried: {}, missing: {},

  /* 주인공이 지금 어떤 모습인지 */
  heroForm(){
    const p = G.player;
    if(!p) return 'burden';
    if(p.armor && (p.armor.plate || p.armor.sword)) return 'armor';
    if(!p.burden) return 'robe';
    return 'burden';
  },
  /* 요청한 감정을 그 form 이 실제로 가진 표정으로 맞춘다 */
  heroFile(mood){
    const form = this.heroForm();
    const have = HERO_MOODS[form] || ['neutral'];
    const want = (mood||'neutral').toLowerCase();
    const use  = have.includes(want)? want : have[0];
    return `christian-${form}-${use}`;
  },

  load(file){
    if(this.tried[file]) return;
    this.tried[file] = true;
    const im = new Image();
    im.onload  = ()=>{ this.img[file] = im; };
    im.onerror = ()=>{ this.missing[file] = true; };
    im.src = assetUrl(`assets/portrait/${file}.webp`);
  },

  make(charKey, h){
    const id = charKey + '@' + h;
    if(this.cache[id]) return this.cache[id];
    const S = ART.chars[charKey] || ART.chars.townsman;
    const src = S.idle.r;
    const cw = 26, ch = 26, sx = 4, sy = 0;      // 머리~허리
    const scale = h / ch;
    const c = makeCanvas(Math.round(cw*scale), Math.round(ch*scale));
    const x = ctxOf(c);
    x.imageSmoothingEnabled = false;
    x.drawImage(src, sx, sy, cw, ch, 0, 0, c.width, c.height);
    const g = x.createLinearGradient(0, c.height*0.62, 0, c.height);
    g.addColorStop(0, 'rgba(7,6,12,0)'); g.addColorStop(1, 'rgba(7,6,12,0.92)');
    x.fillStyle = g; x.fillRect(0, c.height*0.62, c.width, c.height*0.38);
    this.cache[id] = c;
    return c;
  },

  get(charKey, h, mood){
    const isHero = (charKey==='christian' || charKey==='christianRobe' || charKey==='christianArmor');
    const files = isHero
      ? [this.heroFile(mood), `christian-${this.heroForm()}-neutral`, charKey]
      : [PORTRAIT_ALIAS[charKey], charKey].filter(Boolean);
    for(const f of files){
      this.load(f);
      if(this.img[f]) return this.img[f];
    }
    return this.make(charKey, h);
  }
};

const Drama = {
  active:false, script:null, i:-1, onEnd:null,
  text:'', shown:0, lines:[], name:'', holdT:0,
  mood:'neutral', leftMood:'neutral', rightMood:'neutral',
  left:null, leftName:'', right:null, rightName:'', speaker:'',
  choices:null, sel:0, fadeIn:0, bg:null, totalChars:0,

  start(script, onEnd, opt){
    this.active=true; this.script=script.slice(); this.i=-1;
    this.onEnd=onEnd||null; this.choices=null; this.fadeIn=0;
    this.left=null; this.right=null; this.leftName=''; this.rightName='';
    this.mood='neutral'; this.leftMood='neutral'; this.rightMood='neutral';
    this.bg = (opt && opt.bg) || null;
    G.dialogueResult = null;
    this.next();
  },
  next(){
    this.i++;
    if(this.i >= this.script.length){ this.finish(); return; }
    const n = this.script[this.i];
    if(n.act){ try{ n.act(G); }catch(e){} }
    if(n.enter){
      if(n.enter.side==='left'){ this.left=n.enter.who; this.leftName=n.enter.name||''; }
      else { this.right=n.enter.who; this.rightName=n.enter.name||''; }
      this.next(); return;
    }
    if(n.exit){ if(n.exit==='left') this.left=null; else this.right=null; this.next(); return; }
    if(n.bg!==undefined){ this.bg = n.bg; this.next(); return; }
    if(n.choice){
      this.choices=n.choice; this.sel=0;
      this.text=n.text||''; this.shown=this.text.length; this.relayout(); return;
    }
    if(n.text===undefined){ this.next(); return; }
    this.speaker = n.who || '';
    this.name = n.name || '';
    if(n.mood){                                   // 지정이 없으면 직전 표정을 유지한다
      this.mood = n.mood;
      if(this.speaker===this.left)  this.leftMood  = n.mood;
      if(this.speaker===this.right) this.rightMood = n.mood;
    }
    this.text = n.text; this.shown = 0; this.holdT = 0;
    this.relayout();
  },
  relayout(){ this.lines = wrapText(R.u, this.text, 13, VW-190); },
  finish(){
    this.active=false;
    const cb=this.onEnd; this.onEnd=null;
    if(cb) cb(G.dialogueResult);
  },

  update(){
    if(!this.active) return;
    if(this.fadeIn < 1) this.fadeIn = Math.min(1, this.fadeIn + 0.06);
    if(this.choices){
      if(Input.pressed('up')){ this.sel=(this.sel+this.choices.length-1)%this.choices.length; Audio2.sfx('select'); }
      if(Input.pressed('down')){ this.sel=(this.sel+1)%this.choices.length; Audio2.sfx('select'); }
      if(Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')){
        const ch=this.choices[this.sel];
        Audio2.sfx('confirm');
        G.dialogueResult = ch.val!==undefined? ch.val : this.sel;
        if(ch.f) G.player.faithfulness += ch.f;
        if(ch.act) ch.act(G);
        this.choices=null; this.next();
      }
      return;
    }
    if(this.shown < this.text.length){
      /* 한 번 탭하면 전문이 바로 뜬다. 예전엔 키를 '누르고 있어야만' 빨라져서
         한 번 눌러도 아무 반응이 없었다 — 아이들이 가장 답답해하는 지점이다. */
      if(Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')){
        this.shown = this.text.length; this.holdT = 0; return;
      }
      const fast = Input.down('interact')||Input.down('jump');
      const before = Math.floor(this.shown);
      this.shown = Math.min(this.text.length, this.shown + (fast? 4:0.9));
      if(Math.floor(this.shown) > before && Math.floor(this.shown)%2===0) Voice.blip(this.speaker);
    } else {
      this.holdT++;
      if((Input.pressed('interact')||Input.pressed('jump')||Input.pressed('attack')) && this.holdT>3) this.next();
    }
  },


  /* 선택지 패널 — 본문이 있든 없든 같은 자리에 같은 모양으로 뜬다 */
  drawChoices(u, a, boxTop){
    if(!this.choices) return;
    u.globalAlpha = a;
    const cw = Math.max(...this.choices.map(c=>textWidth(u,c.t,13)))+44;
    const chh = this.choices.length*20+30;
    const cx0 = Math.round(VW/2-cw/2), cy0 = Math.round(boxTop-chh-6);
    u.fillStyle='rgba(0,0,0,0.5)'; u.fillRect(cx0+3, cy0+3, cw, chh);
    u.fillStyle='#d8d2c2'; u.fillRect(cx0, cy0, cw, chh);
    u.fillStyle='#f4f0e6'; u.fillRect(cx0+2, cy0+2, cw-4, chh-4);
    u.fillStyle='#bdb49c'; u.fillRect(cx0+7, cy0+22, cw-14, 1);
    drawText(u, L('choosePrompt'), 11, cx0+cw/2, cy0+7, '#7a5f2e', 'center', false);
    this.choices.forEach((c,i)=>{
      const yy = cy0+28+i*20;
      if(i===this.sel){
        u.fillStyle='rgba(150,116,44,0.20)'; u.fillRect(cx0+5, yy-2, cw-10, 18);
        u.fillStyle='#8a6a2a'; u.fillRect(cx0+11, yy+5, 5,5);
      }
      drawText(u, c.t, 13, cx0+24, yy, i===this.sel? '#1e1810':'#6a6152', 'left', false);
    });
    u.globalAlpha = 1;
  },

  draw(x,u){
    if(!this.active) return;
    const a = this.fadeIn;

    /* 게임 캔버스 — 배경 장면만 */
    if(this.bg && typeof SCENES!=='undefined' && SCENES[this.bg]){
      const slot = Cinema.render(this.bg);
      if(slot.drawn < 0 || (G.tick - slot.drawn) >= 4){
        slot.x.setTransform(1,0,0,1,0,0); slot.x.clearRect(0,0,CW,CH);
        try{ SCENES[this.bg].draw(slot.x, G.tick); }catch(e){}
        slot.drawn = G.tick;
      }
      const src = Cinema.img[this.bg] || slot.c;
      x.save(); x.imageSmoothingEnabled = true;
      x.drawImage(src, 0, CH*0.06, CW, CH*0.72, 0, 0, VW, VH);
      x.restore();
    } else {
      x.fillStyle='#0d0a16'; x.fillRect(0,0,VW,VH);
    }

    /* 이 아래는 전부 UI 캔버스에 그린다.
       UI 캔버스가 게임 캔버스 위에 있으므로, 아래에 이미 그려진 글자(타이틀·HUD)를
       여기서 한 번 덮고 그 위에 패널을 올려야 한다. */
    u.save();
    u.globalAlpha = 0.52*a; u.fillStyle='#0a0812'; u.fillRect(-2,-2,VW+4,VH+4); u.globalAlpha=1;
    u.imageSmoothingEnabled = false;                 // 픽셀 초상은 또렷하게

    const H = 168, baseY = VH - 2;
    if(this.left){
      const p = BigPortrait.get(this.left, H, this.speaker===this.left? this.mood : this.leftMood);
      const w = Math.round(p.width * (H/p.height));
      u.globalAlpha = a * (this.speaker===this.left? 1 : 0.55);
      u.drawImage(p, -Math.round(w*0.22), baseY-H, w, H);
      u.globalAlpha = 1;
    }
    if(this.right){
      const p = BigPortrait.get(this.right, H, this.speaker===this.right? this.mood : this.rightMood);
      const w = Math.round(p.width * (H/p.height));
      u.save();
      u.globalAlpha = a * (this.speaker===this.right? 1 : 0.55);
      u.translate(VW + Math.round(w*0.22), baseY-H);
      u.scale(-1,1);
      u.drawImage(p, 0, 0, w, H);
      u.restore();
      u.globalAlpha = 1;
    }
    u.imageSmoothingEnabled = true;

    /* 양피지 대화창.
       ⚠ 선택지 노드에 본문이 없으면 예전엔 '텅 빈 큰 상자'가 화면 아래를 차지했다.
       무엇에 대한 선택인지 알 수 없어 보였다 — 본문이 없으면 상자 자체를 안 그린다. */
    const hasBody = (this.text||'').trim().length>0;
    const bx = 76, bw = VW-152;
    const bh = hasBody? Math.max(64, this.lines.length*17 + (this.name? 40:24)) : 0;
    const by = VH - bh - 12;
    if(!hasBody){ this.drawChoices(u, a, by); u.restore(); return; }
    u.globalAlpha = a;
    u.fillStyle='rgba(0,0,0,0.5)';  u.fillRect(bx+3, by+3, bw, bh);
    u.fillStyle='#d8d2c2';          u.fillRect(bx, by, bw, bh);
    u.fillStyle='#f4f0e6';          u.fillRect(bx+2, by+2, bw-4, bh-4);
    u.fillStyle='#bdb49c';
    u.fillRect(bx+7, by+7, bw-14, 1); u.fillRect(bx+7, by+bh-8, bw-14, 1);
    u.fillRect(bx+7, by+7, 1, bh-15); u.fillRect(bx+bw-8, by+7, 1, bh-15);
    u.globalAlpha = 1;

    /* 이름 · 본문 */
    u.globalAlpha = a;
    let ty = by + 12;
    if(this.name){ drawText(u, this.name, 12, bx+22, ty, '#7a5f2e', 'left', false); ty += 19; }
    let acc=0;
    this.lines.forEach((line,i)=>{
      const start=acc; acc+=line.length;
      if(start >= this.shown) return;
      const vis = line.slice(0, clamp(Math.floor(this.shown)-start, 0, line.length));
      drawText(u, vis, 13, bx+22, ty + i*17, '#1e1810', 'left', false);
    });
    u.globalAlpha = 1;

    /* 선택지 */
    if(this.choices) this.drawChoices(u, a, by);
    u.restore();
  }
};

/* ---------- 인물별 목소리 (합성) ----------
   실제 성우 녹음은 나중에 얹는다. 지금은 인물마다 음색을 달리해
   "누가 말하는지"를 귀로 구분하게 한다. (Undertale·동물의 숲 방식) */
const Voice = {
  profile: {
    christian:  {base:420, type:'square',   spread:60, dur:0.045, vol:0.055},
    evangelist: {base:210, type:'triangle', spread:26, dur:0.075, vol:0.060},
    help:       {base:240, type:'square',   spread:30, dur:0.060, vol:0.055},
    goodwill:   {base:260, type:'triangle', spread:30, dur:0.065, vol:0.055},
    interpreter:{base:195, type:'sine',     spread:22, dur:0.085, vol:0.060},
    shining:    {base:620, type:'sine',     spread:90, dur:0.090, vol:0.050},
    faithful:   {base:380, type:'square',   spread:55, dur:0.048, vol:0.058},
    hopeful:    {base:460, type:'triangle', spread:70, dur:0.048, vol:0.055},
    wife:       {base:500, type:'triangle', spread:55, dur:0.050, vol:0.050},
    child:      {base:660, type:'square',   spread:90, dur:0.038, vol:0.048},
    worldly:    {base:170, type:'sawtooth', spread:20, dur:0.070, vol:0.055},
    obstinate:  {base:185, type:'sawtooth', spread:24, dur:0.055, vol:0.058},
    pliable:    {base:520, type:'square',   spread:80, dur:0.040, vol:0.050},
    judge:      {base:140, type:'sawtooth', spread:16, dur:0.095, vol:0.062},
    demas:      {base:300, type:'sawtooth', spread:40, dur:0.050, vol:0.055},
    hawker:     {base:350, type:'sawtooth', spread:60, dur:0.042, vol:0.052},
    timorous:   {base:480, type:'triangle', spread:90, dur:0.038, vol:0.046},
    ignorance:  {base:400, type:'square',   spread:30, dur:0.055, vol:0.050},
    shepherd:   {base:230, type:'triangle', spread:26, dur:0.070, vol:0.055},
    discretion: {base:490, type:'triangle', spread:45, dur:0.052, vol:0.052},
    prudence:   {base:450, type:'sine',     spread:40, dur:0.058, vol:0.052},
    piety:      {base:530, type:'sine',     spread:48, dur:0.060, vol:0.050},
    charity:    {base:430, type:'triangle', spread:50, dur:0.055, vol:0.054},
    talkative:  {base:330, type:'square',   spread:110,dur:0.034, vol:0.052},
    flatterer:  {base:290, type:'sine',     spread:18, dur:0.080, vol:0.052},
    atheist:    {base:200, type:'sawtooth', spread:36, dur:0.060, vol:0.055},
    _default:   {base:340, type:'square',   spread:45, dur:0.050, vol:0.050}
  },
  blip(who){
    if(!Audio2.enabled || !Audio2.ctx) return;
    const p = this.profile[who] || this.profile._default;
    Audio2.tone({ freq: p.base + (Math.random()-0.5)*p.spread*2,
                  type: p.type, dur: p.dur, vol: p.vol, atk: 0.004 });
  }
};

</script>
<script>
/* ===== js/90_cinema.js ===== */
/* ============================================================
   90_cinema.js — 컷신 (JRPG 이벤트 CG)
   아트 디렉션: 역광 실루엣 일러스트.
   모든 장면이 "빛을 향해 선 사람"의 구도다 — 천로역정의 주제 그대로.
   1280×720 고해상도로 그린 뒤 켄번즈 팬/줌으로 재생한다.
   ★ assets/cinematic/<id>.webp 파일이 있으면 그걸 대신 쓴다 (교체 준비 완료)
   ============================================================ */
'use strict';

const CW = 1280, CH = 720;          // 컷신 해상도 (픽셀 캔버스와 무관)

/* ---------- 페인터리 헬퍼 ---------- */
function grad(x, x0,y0,x1,y1, stops){
  const g = x.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  return g;
}
function rgrad(x, cx,cy,r0,r1, stops){
  const g = x.createRadialGradient(cx,cy,r0,cx,cy,r1);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  return g;
}
/* 손으로 그린 듯한 능선 — 같은 시드면 항상 같은 모양 */
function ridge(x, y0, amp, seed, color, detail){
  const R = mulberry32(seed);
  x.fillStyle = color;
  x.beginPath(); x.moveTo(-40, CH+40);
  let y = y0;
  const step = detail || 26;
  for(let px_=-40; px_<=CW+40; px_+=step){
    y += (R()-0.5)*amp;
    y = clamp(y, y0-amp*2.2, y0+amp*2.2);
    x.lineTo(px_, y);
  }
  x.lineTo(CW+40, CH+40); x.closePath(); x.fill();
}
/* 빛기둥 */
function godRays(x, cx, cy, n, len, color, alpha, spin){
  x.save();
  x.globalCompositeOperation='lighter';
  x.translate(cx, cy);
  x.rotate(spin||0);
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const w = 0.012 + (i%3)*0.008;
    x.globalAlpha = alpha * (0.5 + 0.5*Math.sin(i*2.1));
    x.fillStyle = color;
    x.beginPath();
    x.moveTo(0,0);
    x.arc(0,0,len, a-w, a+w);
    x.closePath(); x.fill();
  }
  x.restore();
}
/* 대기 입자 — 먼지·재·반딧불 */
function motes(x, n, seed, color, sizeMax, area){
  const R = mulberry32(seed);
  x.save(); x.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const px_ = (area? area[0]:0) + R()*((area? area[2]:CW));
    const py  = (area? area[1]:0) + R()*((area? area[3]:CH));
    const s = 1 + R()*sizeMax;
    x.globalAlpha = 0.12 + R()*0.5;
    x.fillStyle = color;
    x.beginPath(); x.arc(px_, py, s, 0, 7); x.fill();
  }
  x.restore();
}
/* 종이 질감 — 일러스트처럼 보이게 하는 마지막 한 겹 */
function grain(x, amount, seed){
  const R = mulberry32(seed||7);
  x.save(); x.globalAlpha = amount;
  for(let i=0;i<2600;i++){
    x.fillStyle = R()>0.5? '#ffffff' : '#000000';
    x.fillRect(R()*CW, R()*CH, 1.6, 1.6);
  }
  x.restore();
}
/* 비네트 */
function vignette(x, strength, color){
  const g = rgrad(x, CW/2, CH*0.48, CH*0.28, CH*1.02, [[0,'rgba(0,0,0,0)'],[1, color||`rgba(0,0,0,${strength})`]]);
  x.fillStyle=g; x.fillRect(0,0,CW,CH);
}

/* 늪의 죽은 나무 — 뒤틀린 가지 */
function swampTree(x, tx, groundY, h, color){
  x.save(); x.translate(tx, groundY); x.fillStyle=color;
  const R = mulberry32(Math.floor(tx*13+h));
  x.beginPath();
  x.moveTo(-h*0.045, 0);
  x.quadraticCurveTo(-h*0.02, -h*0.5, -h*0.012, -h);
  x.lineTo(h*0.012, -h);
  x.quadraticCurveTo(h*0.03, -h*0.5, h*0.05, 0);
  x.closePath(); x.fill();
  // 가지
  for(let i=0;i<5;i++){
    const by = -h*(0.45+i*0.12), dir = (i%2? 1:-1), len = h*(0.16+R()*0.20);
    x.save(); x.translate(0, by); x.rotate(dir*(0.5+R()*0.6));
    x.beginPath(); x.moveTo(0,0); x.lineTo(len, -len*0.30); x.lineTo(len, -len*0.30+h*0.014); x.lineTo(0, h*0.016);
    x.closePath(); x.fill();
    // 잔가지
    x.beginPath(); x.moveTo(len*0.65,-len*0.19); x.lineTo(len*0.95,-len*0.52); x.lineTo(len*0.99,-len*0.49);
    x.lineTo(len*0.70,-len*0.16); x.closePath(); x.fill();
    x.restore();
  }
  // 늘어진 이끼
  for(let i=0;i<4;i++){
    const mx=(R()-0.5)*h*0.36, my=-h*(0.58+R()*0.3);
    x.fillRect(mx, my, 1.6, h*(0.07+R()*0.11));
  }
  x.restore();
}
/* 군중 — 겹쳐 선 뒷모습 */
function crowd(x, y0, rows, seed, color){
  const R = mulberry32(seed);
  for(let r=0;r<rows;r++){
    const sc = 0.62 + r*0.20;
    const yy = y0 + r*26;
    x.fillStyle = color.replace('ALPHA', String(0.55 + r*0.16));
    for(let i=0;i<26;i++){
      const hx = -40 + R()*(CW+80);
      const hh = 62*sc + R()*22*sc;
      x.beginPath(); x.arc(hx, yy-hh, 13*sc, 0, 7); x.fill();
      x.beginPath();
      x.moveTo(hx-19*sc, yy);
      x.quadraticCurveTo(hx-17*sc, yy-hh*0.86, hx, yy-hh*0.92);
      x.quadraticCurveTo(hx+17*sc, yy-hh*0.86, hx+19*sc, yy);
      x.closePath(); x.fill();
    }
  }
}

/* ---------- 인물 실루엣 ----------
   역광이므로 형태만으로 읽힌다. 얼굴을 그리지 않는 것이 이 스타일의 핵심이다. */
function figure(x, cx, groundY, h, opt){
  opt = opt || {};
  const col = opt.color || '#0d0a14';
  const s = h/100;                       // 100 단위 기준
  const lean = opt.lean || 0;
  x.save();
  x.translate(cx, groundY);
  x.scale(opt.flip? -s : s, s);
  x.fillStyle = col;

  // 다리
  const stride = opt.stride||0;
  x.beginPath();
  x.moveTo(-7, 0); x.lineTo(-4-stride, -34); x.lineTo(3-stride, -34); x.lineTo(1, 0); x.closePath(); x.fill();
  x.beginPath();
  x.moveTo(1+stride, 0); x.lineTo(-1+stride, -34); x.lineTo(6+stride, -34); x.lineTo(9+stride, 0); x.closePath(); x.fill();
  // 몸통 (망토/외투)
  x.beginPath();
  x.moveTo(-9+lean, -34);
  x.quadraticCurveTo(-13+lean, -56, -8+lean, -68);
  x.lineTo(8+lean, -68);
  x.quadraticCurveTo(13+lean, -56, 9+lean, -34);
  x.closePath(); x.fill();
  // 어깨·목
  x.beginPath(); x.ellipse(lean, -70, 10, 6, 0, 0, 7); x.fill();
  // 머리
  x.beginPath(); x.arc(lean, -82, 8.5, 0, 7); x.fill();
  if(opt.hood){
    x.beginPath();
    x.moveTo(-11+lean,-74); x.quadraticCurveTo(lean,-98, 11+lean,-74);
    x.quadraticCurveTo(lean,-84, -11+lean,-74); x.fill();
  }
  // 등에 진 짐
  if(opt.burden){
    x.beginPath();
    const bx = opt.flip? 10+lean : -10+lean;
    x.ellipse(bx*(opt.flip?1:1), -58, 13, 15, 0, 0, 7); x.fill();
    x.fillRect(bx-2, -74, 4, 8);
  }
  // 팔
  if(opt.arm==='point'){
    x.beginPath(); x.moveTo(6+lean,-66); x.lineTo(34,-78); x.lineTo(36,-72); x.lineTo(8+lean,-58); x.closePath(); x.fill();
  } else if(opt.arm==='up'){
    x.beginPath(); x.moveTo(-6+lean,-66); x.lineTo(-16,-98); x.lineTo(-10,-100); x.lineTo(0+lean,-62); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(6+lean,-66); x.lineTo(16,-98); x.lineTo(10,-100); x.lineTo(0+lean,-62); x.closePath(); x.fill();
  } else if(opt.arm==='reach'){
    x.beginPath(); x.moveTo(6+lean,-64); x.lineTo(30,-84); x.lineTo(34,-79); x.lineTo(9+lean,-57); x.closePath(); x.fill();
  } else if(opt.arm==='kneel'){
    // 무릎 꿇은 자세는 별도 처리 (아래 kneeling 함수)
  } else {
    x.beginPath(); x.moveTo(-8+lean,-66); x.lineTo(-12,-42); x.lineTo(-6,-42); x.lineTo(-2+lean,-62); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(8+lean,-66); x.lineTo(12,-42); x.lineTo(6,-42); x.lineTo(2+lean,-62); x.closePath(); x.fill();
  }
  if(opt.sword){
    x.beginPath(); x.moveTo(11,-66); x.lineTo(15,-108); x.lineTo(19,-108); x.lineTo(16,-62); x.closePath(); x.fill();
  }
  if(opt.staff){
    x.fillRect(14, -104, 3.5, 104);
  }
  x.restore();
}
/* 무릎 꿇은 실루엣 */
function kneeling(x, cx, groundY, h, color){
  const s=h/100;
  x.save(); x.translate(cx, groundY); x.scale(s,s); x.fillStyle=color||'#0d0a14';
  x.beginPath(); x.moveTo(-16,0); x.lineTo(10,0); x.lineTo(8,-16); x.lineTo(-12,-14); x.closePath(); x.fill();
  x.beginPath();
  x.moveTo(-10,-14);
  x.quadraticCurveTo(-18,-38,-8,-56);
  x.lineTo(4,-56);
  x.quadraticCurveTo(12,-38,10,-14);
  x.closePath(); x.fill();
  x.beginPath(); x.ellipse(-2,-58,9,5.5,0,0,7); x.fill();
  x.beginPath(); x.arc(-2,-70,8,0,7); x.fill();
  x.beginPath(); x.moveTo(4,-54); x.lineTo(18,-34); x.lineTo(13,-30); x.lineTo(0,-48); x.closePath(); x.fill();
  x.restore();
}
