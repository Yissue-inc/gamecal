<script>
/* ===== js/00_core.js ===== */
/* ============================================================
   천로역정 — 순례자의 길 :: 00_core.js
   상수 · 유틸 · 입력 · 저장 · 카메라
   ============================================================ */
'use strict';

/* 어셋 캐시 무효화 토큰.
   ⚠ Codex 가 같은 파일명으로 그림을 교체하면 브라우저는 옛 그림을 계속 쓴다
   (실측: 열매 8종을 새로 받았는데 화면은 그대로였고, 측정값까지 전과 동일했다).
   빌드할 때 stamp.py 가 이 값을 갱신한다. */
const ASSET_VER = '1787799289';
function assetUrl(path){ return `${path}?v=${ASSET_VER}`; }


const VW = 480, VH = 270;      // 내부 해상도
const TS = 16;                 // 타일 크기
const GRAV = 0.42;
const MAXFALL = 7.2;

// ---------- 수학 유틸 ----------
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const sign  = (v)=> v<0?-1:(v>0?1:0);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const aabb  = (a,b)=> a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

// 결정적 난수 — 같은 시드면 같은 지형/텍스처가 나온다
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let RND = mulberry32(20260825);
const rnd  = ()=> RND();
const rndi = (a,b)=> a + Math.floor(RND()*(b-a+1));
const pick = (arr)=> arr[Math.floor(RND()*arr.length)];

// hex → rgba 문자열 (그라디언트에 알파를 주기 위해)
function hexA(hex, a){
  if(hex[0]!=='#') return hex;
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// ---------- 캔버스 헬퍼 ----------
function makeCanvas(w,h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return c;
}
function ctxOf(c){ const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return x; }

// 캔버스 좌우 반전본
function flipH(src){
  const c = makeCanvas(src.width, src.height), x = ctxOf(c);
  x.translate(src.width,0); x.scale(-1,1); x.drawImage(src,0,0);
  return c;
}
// 캔버스 단색 실루엣(피격 플래시·그림자용)
function tintCanvas(src, color, alpha){
  const c = makeCanvas(src.width, src.height), x = ctxOf(c);
  x.drawImage(src,0,0);
  x.globalCompositeOperation = 'source-in';
  x.globalAlpha = alpha===undefined?1:alpha;
  x.fillStyle = color; x.fillRect(0,0,c.width,c.height);
  return c;
}

/* 픽셀맵 문자열 → 캔버스
   rows: ['..RR..','.RRRR.'] / pal: {R:'#c33'}  ('.'과 ' '는 투명) */
function px(rows, pal){
  const h = rows.length, w = rows[0].length;
  const c = makeCanvas(w,h), x = ctxOf(c);
  for(let j=0;j<h;j++){
    const row = rows[j];
    for(let i=0;i<w;i++){
      const ch = row[i];
      if(ch==='.'||ch===' '||ch===undefined) continue;
      const col = pal[ch];
      if(!col) continue;
      x.fillStyle = col; x.fillRect(i,j,1,1);
    }
  }
  return c;
}

// ---------- 입력 ----------
const Input = {
  keys:{}, prev:{}, pressBuf:{}, relBuf:{}, anyPressed:false,
  map:{
    left:['ArrowLeft','KeyA'], right:['ArrowRight','KeyD'],
    up:['ArrowUp','KeyW'], down:['ArrowDown','KeyS'],
    jump:['Space','KeyZ','KeyC'], attack:['KeyX','KeyJ'],
    skill:['KeyV','KeyK'], dash:['ShiftLeft','ShiftRight','KeyL'],
    interact:['KeyE','Enter'], menu:['Escape','KeyI'],
    pray:['KeyQ']
  },
  // e.code 가 비는 환경(일부 자동화·IME·모바일 키보드)이 있어 e.key 로 보정한다
  norm(e){
    if(e.code) return e.code;
    const k=e.key;
    if(!k) return '';
    if(k===' '||k==='Spacebar') return 'Space';
    if(k.length===1 && /[a-zA-Z]/.test(k)) return 'Key'+k.toUpperCase();
    if(k==='Shift') return 'ShiftLeft';
    if(k==='Esc') return 'Escape';
    return k;
  },
  init(){
    addEventListener('keydown', e=>{
      const c=this.norm(e);
      if(!c) return;
      if(!this.keys[c]) this.pressBuf[c]=true;   // 짧은 탭도 유실되지 않게 버퍼링
      this.keys[c]=true; this.anyPressed=true;
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(c)) e.preventDefault();
      Audio2.unlock();
    });
    addEventListener('keyup', e=>{ const c=this.norm(e); if(c){ this.keys[c]=false; this.relBuf[c]=true; } });
    addEventListener('blur', ()=>{ this.keys={}; this.pressBuf={}; });
    // 터치 조작 (모바일)
    this.initTouch();
  },
  // 화면 하단 가상 패드 — 터치 기기에서만 활성
  initTouch(){
    if(!('ontouchstart' in window)) return;
    this.touch=true;
    const pad=document.getElementById('touchpad');
    if(!pad) return;
    pad.style.display='block';
    const bind=(id, act)=>{
      const el=document.getElementById(id); if(!el) return;
      const on=(e)=>{ e.preventDefault(); this.keys[this.map[act][0]]=true; Audio2.unlock(); };
      const off=(e)=>{ e.preventDefault(); this.keys[this.map[act][0]]=false; };
      el.addEventListener('touchstart',on,{passive:false});
      el.addEventListener('touchend',off,{passive:false});
      el.addEventListener('touchcancel',off,{passive:false});
    };
    bind('t-left','left'); bind('t-right','right'); bind('t-up','up'); bind('t-down','down');
    bind('t-jump','jump'); bind('t-atk','attack'); bind('t-skill','skill');
    bind('t-dash','dash'); bind('t-act','interact'); bind('t-menu','menu'); bind('t-pray','pray');
  },
  // 프레임 종료 시 호출 — 엣지 검출용
  latch(){ this.prev = Object.assign({}, this.keys); this.pressBuf={}; this.relBuf={}; this.anyPressed=false; },
  down(a){ return this.map[a].some(k=>this.keys[k] || this.pressBuf[k]); },
  pressed(a){ return this.map[a].some(k=>this.pressBuf[k] || (this.keys[k] && !this.prev[k])); },
  released(a){ return this.map[a].some(k=>this.relBuf[k] || (!this.keys[k] && this.prev[k])); }
};

// ---------- 저장 ----------
const SAVE_KEY = 'pilgrims_path_save_v1';
const Save = {
  write(data){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }catch(e){} },
  read(){ try{ const s = localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  clear(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
};

// ---------- 카메라 ----------
class Camera {
  constructor(){
    this.x=0; this.y=0; this.tx=0; this.ty=0; this.shake=0; this.shakeT=0; this.bounds={w:VW,h:VH};
    this.zoom=1; this.zoomT=1;      // zoomT<1 이면 더 넓게 보인다 = 대상이 작아진다 = 압도된다
  }
  /* 줌을 반영한 실제 시야 크기 */
  get viewW(){ return VW / this.zoom; }
  get viewH(){ return VH / this.zoom; }
  setZoom(z, instant){ this.zoomT = z; if(instant) this.zoom = z; }
  follow(t, lvw, lvh, instant){
    const vw=this.viewW, vh=this.viewH;
    this.tx = clamp(t.x + t.w/2 - vw/2, 0, Math.max(0, lvw - vw));
    this.ty = clamp(t.y + t.h/2 - vh/2 - 12*this.zoom, 0, Math.max(0, lvh - vh));
    if(instant){ this.x=this.tx; this.y=this.ty; }
    else { this.x = lerp(this.x, this.tx, 0.14); this.y = lerp(this.y, this.ty, 0.10); }
  }
  addShake(n){ this.shake = Math.max(this.shake, n); }
  update(){
    if(this.shake>0){ this.shake *= 0.86; if(this.shake<0.15) this.shake=0; }
    this.zoom = lerp(this.zoom, this.zoomT, 0.055);
    if(Math.abs(this.zoom-this.zoomT)<0.002) this.zoom=this.zoomT;
    this.shakeT++;
  }
  get ox(){ return Math.round(this.x + (this.shake? (Math.sin(this.shakeT*2.3)*this.shake):0)); }
  get oy(){ return Math.round(this.y + (this.shake? (Math.cos(this.shakeT*3.1)*this.shake):0)); }
}

// ---------- 텍스트 렌더 ----------
// 한글은 시스템 폰트를 쓰되 픽셀 느낌을 위해 정수 좌표 + 무보간
function drawText(x, str, px_, cx, cy, color, align, shadow){
  x.save();
  x.font = `${px_}px ${UI_FONT}`;
  x.textAlign = align||'left';
  x.textBaseline = 'top';
  if(shadow!==false){ x.fillStyle='rgba(0,0,0,0.75)'; x.fillText(str, Math.round(cx)+1, Math.round(cy)+1); }
  x.fillStyle = color||'#fff';
  x.fillText(str, Math.round(cx), Math.round(cy));
  x.restore();
}
function textWidth(x, str, px_){
  x.save(); x.font = `${px_}px ${UI_FONT}`;
  const w = x.measureText(str).width; x.restore(); return w;
}
// 폭에 맞춰 줄바꿈
/* 줄바꿈. 어절(공백) 단위로 끊는다.
   ⚠ 예전엔 글자 단위로 끊어서 영어 단어가 통째로 쪼개졌다("...but t" / "he water...").
   한국어도 어절이 잘려 나갔다("...라 불렀" / "다."). 한 어절이 한 줄보다 길 때만
   글자 단위로 내려간다(긴 URL·붙여쓴 문장 대비). */
function wrapText(x, str, px_, maxw){
  x.save(); x.font = `${px_}px ${UI_FONT}`;
  const out=[];
  const fits = (t)=> x.measureText(t).width <= maxw;
  const pushWordwise = (word, line)=>{      // 어절 하나가 줄보다 길 때만 쪼갠다
    let cur=line;
    for(const ch of word){
      if(cur && !fits(cur+ch)){ out.push(cur); cur=ch; }
      else cur += ch;
    }
    return cur;
  };
  for(const para of String(str).split('\n')){
    let line='';
    for(const word of para.split(' ')){
      if(!line){ line = fits(word)? word : pushWordwise(word, ''); continue; }
      if(fits(line+' '+word)) line += ' '+word;
      else { out.push(line); line = fits(word)? word : pushWordwise(word, ''); }
    }
    out.push(line);
  }
  x.restore();
  return out;
}

// ---------- 파티클 ----------
class Particles {
  constructor(){ this.list=[]; }
  spawn(o){ this.list.push(Object.assign({x:0,y:0,vx:0,vy:0,life:30,max:30,size:2,color:'#fff',grav:0.06,fade:true,glow:false},o)); }
  burst(x,y,n,opt){
    for(let i=0;i<n;i++){
      const a = rnd()*Math.PI*2, s = (opt.spd||1.5)*(0.35+rnd());
      this.spawn(Object.assign({}, opt, {x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s - (opt.lift||0), life:(opt.life||26)*(0.6+rnd()*0.7)}));
    }
  }
  update(){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.grav; p.vx*=(p.drag||0.99); p.life--;
      if(p.life<=0) this.list.splice(i,1);
    }
  }
  draw(x,cam){
    for(const p of this.list){
      const a = p.fade ? clamp(p.life/p.max,0,1) : 1;
      x.globalAlpha = a;
      if(p.glow){ x.globalCompositeOperation='lighter'; }
      x.fillStyle = p.color;
      const s = Math.max(1, Math.round(p.size*(p.shrink? a:1)));
      x.fillRect(Math.round(p.x-cam.ox-s/2), Math.round(p.y-cam.oy-s/2), s, s);
      x.globalCompositeOperation='source-over';
    }
    x.globalAlpha=1;
  }
  clear(){ this.list.length=0; }
}

// ---------- 화면 전환 ----------
const Fade = {
  a:0, target:0, speed:0.06, cb:null, color:'#000',
  to(v, cb, speed){ this.target=v; this.cb=cb||null; if(speed) this.speed=speed; },
  out(cb){ this.to(1, cb); }, in(cb){ this.to(0, cb); },
  update(){
    if(this.a===this.target){ if(this.cb){ const c=this.cb; this.cb=null; c(); } return; }
    this.a += sign(this.target-this.a)*this.speed;
    if(Math.abs(this.a-this.target)<=this.speed){ this.a=this.target; }
  },
  draw(x,u){
    if(this.a<=0) return;
    x.globalAlpha=this.a; x.fillStyle=this.color; x.fillRect(0,0,VW,VH); x.globalAlpha=1;
    if(u){ u.globalAlpha=this.a; u.fillStyle=this.color; u.fillRect(-2,-2,VW+4,VH+4); u.globalAlpha=1; }
  }
};

</script>
<script>
/* ===== js/02_i18n.js ===== */
/* ============================================================
   02_i18n.js — 한국어 / English 이중 언어
   대상 독자: 10~13세. 짧은 문장 · 쉬운 낱말 · 또렷한 그림.
   ============================================================ */
'use strict';

let LANG = '';   // loadLang() 이 정한다
const LANG_KEY = 'pilgrims_path_lang';

function loadLang(){
  try{ const v=localStorage.getItem(LANG_KEY); if(v==='ko'||v==='en') LANG=v; }catch(e){}
  // 저장된 값이 없으면 브라우저 언어로 추정
  if(!LANG){ LANG = String(navigator.language||'ko').toLowerCase().startsWith('ko')? 'ko':'en'; }
  applyFont();
}
/* 언어가 바뀔 때 다시 그려야 하는 DOM 을 등록한다 */
const LANG_LISTENERS = [];
function onLangChange(fn){ LANG_LISTENERS.push(fn); }
function setLang(l){
  LANG=l;
  try{ localStorage.setItem(LANG_KEY,l); }catch(e){}
  applyFont();
  if(typeof rebuildStory==='function') rebuildStory();
  PORTRAITS_NAMECACHE = {};
  LANG_LISTENERS.forEach(fn=>{ try{ fn(l); }catch(e){} });
}
function applyFont(){
  UI_FONT = (LANG==='ko')
    ? '"Do Hyeon","Nanum Gothic Coding",system-ui,sans-serif'
    : '"Pixelify Sans","Do Hyeon",system-ui,sans-serif';
  document.body && (document.body.style.fontFamily = UI_FONT);

<script>
/* ===== js/05_audio.js ===== */
/* ============================================================
   05_audio.js — Web Audio 절차적 사운드 (외부 파일 0개)
   칩튠 BGM 7곡 + SFX 20종을 전부 합성한다.
   ============================================================ */
'use strict';

const Audio2 = {
  ctx:null, master:null, musicGain:null, sfxGain:null,
  enabled:true, unlocked:false,
  curTrack:null, seqTimer:null, step:0, nextTime:0, playing:false,

  init(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) { this.enabled=false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.34; this.musicGain.connect(this.master);
      this.sfxGain   = this.ctx.createGain(); this.sfxGain.gain.value   = 0.55; this.sfxGain.connect(this.master);
      // 리버브 대용 — 짧은 노이즈 컨볼버
      this.conv = this.ctx.createConvolver();
      this.conv.buffer = this._impulse(1.6, 2.2);
      this.wet = this.ctx.createGain(); this.wet.gain.value = 0.16;
      this.conv.connect(this.wet); this.wet.connect(this.master);
    }catch(e){ this.enabled=false; }
  },
  _impulse(dur, decay){
    const rate=this.ctx.sampleRate, len=Math.floor(rate*dur);
    const buf=this.ctx.createBuffer(2,len,rate);
    for(let c=0;c<2;c++){
      const d=buf.getChannelData(c);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
    }
    return buf;
  },
  unlock(){
    if(!this.enabled||this.unlocked) return;
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    this.unlocked=true;
    if(this.curTrack && !this.playing) this._startSeq();
  },
  toggle(){ this.enabled=!this.enabled; if(this.master) this.master.gain.value = this.enabled?0.7:0; return this.enabled; },

  // ---------- 톤 생성기 ----------
  tone(o){
    if(!this.enabled||!this.ctx) return;
    const t0 = o.at || this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g   = this.ctx.createGain();
    osc.type = o.type||'square';
    osc.frequency.setValueAtTime(o.freq, t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.to), t0+(o.dur||0.2));
    const vol = (o.vol===undefined?0.25:o.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+(o.atk||0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t0+(o.dur||0.2));
    let node = osc;
    if(o.filter){
      const f=this.ctx.createBiquadFilter(); f.type=o.filter; f.frequency.value=o.fq||1200; f.Q.value=o.q||1;
      osc.connect(f); node=f;
    }
    node.connect(g);
    g.connect(o.bus||this.sfxGain);
    if(o.reverb) g.connect(this.conv);
    osc.start(t0); osc.stop(t0+(o.dur||0.2)+0.05);
  },
  noise(o){
    if(!this.enabled||!this.ctx) return;
    const t0=o.at||this.ctx.currentTime, dur=o.dur||0.15;
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, o.decay===undefined?1.5:o.decay);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type=o.filter||'bandpass'; f.frequency.value=o.fq||900; f.Q.value=o.q||1.2;
    const g=this.ctx.createGain(); g.gain.value=o.vol===undefined?0.3:o.vol;
    src.connect(f); f.connect(g); g.connect(o.bus||this.sfxGain);
    if(o.reverb) g.connect(this.conv);
    src.start(t0);
  },

  // ---------- SFX ----------
  sfx(name){
    if(!this.enabled||!this.ctx) return;
    const T=this.ctx.currentTime;
    switch(name){
      case 'jump':    this.tone({freq:300,to:620,dur:0.13,type:'square',vol:0.16}); break;
      case 'djump':   this.tone({freq:440,to:840,dur:0.15,type:'triangle',vol:0.18}); break;
      case 'land':    this.noise({dur:0.07,fq:340,vol:0.13,filter:'lowpass'}); break;
      case 'step':    this.noise({dur:0.04,fq:1150+Math.random()*550,vol:0.05}); break;

      case 'hit':     { const v=500+Math.random()*500;
                        this.noise({dur:0.1,fq:v,vol:0.24,filter:'bandpass',q:0.7});
                        this.tone({freq:150+Math.random()*90,to:70,dur:0.12,type:'square',vol:0.14}); break; }

      case 'die':     [0,0.1,0.2,0.34].forEach((d,i)=>this.tone({freq:380-i*70,to:60,dur:0.3,type:'square',vol:0.2,at:T+d})); break;
      case 'coin':    this.tone({freq:988,dur:0.06,type:'square',vol:0.14}); this.tone({freq:1319,dur:0.11,type:'square',vol:0.13,at:T+0.06}); break;

      case 'levelup': [523,659,784,1047,1319].forEach((f,i)=>this.tone({freq:f,dur:0.34,type:'square',vol:0.17,at:T+i*0.075,reverb:true})); break;

      case 'burden':  // 짐이 굴러 떨어지는 소리 — 게임 전체의 클라이맥스
        this.noise({dur:1.5,fq:180,vol:0.4,filter:'lowpass',decay:0.7,reverb:true});

      case 'boss':    this.tone({freq:110,to:55,dur:1.4,type:'sawtooth',vol:0.28,reverb:true}); this.noise({dur:1.2,fq:200,vol:0.2,filter:'lowpass'}); break;
      case 'roar':    this.tone({freq:150,to:62,dur:0.9,type:'sawtooth',vol:0.3,reverb:true}); this.noise({dur:0.8,fq:400,vol:0.24,decay:0.8}); break;
      case 'dart':    this.tone({freq:1500,to:400,dur:0.16,type:'sawtooth',vol:0.11}); break;
      case 'shield':  this.tone({freq:880,to:1400,dur:0.12,type:'triangle',vol:0.2}); this.noise({dur:0.08,fq:2600,vol:0.14}); break;
      case 'splash':  this.noise({dur:0.4,fq:900,vol:0.2,decay:1.2,filter:'highpass'}); break;
      case 'sink':    this.noise({dur:0.6,fq:220,vol:0.24,filter:'lowpass',decay:0.7}); break;
      case 'unlock':  [392,523,659,880].forEach((f,i)=>this.tone({freq:f,dur:0.4,type:'triangle',vol:0.18,at:T+i*0.09,reverb:true})); break;
      case 'glory':   [523,659,784,1047,1319,1568].forEach((f,i)=>this.tone({freq:f,dur:1.6,type:'triangle',vol:0.13,at:T+i*0.14,reverb:true})); break;
    }
  },

  // ---------- BGM (스텝 시퀀서) ----------
  // 각 트랙: {bpm, lead:[...], bass:[...], drum:'x-x-'}  음표는 MIDI 번호 또는 0(쉼표)
  tracks:{},
  play(name){
    if(this.curTrack===name) return;
    if(!this.enabled||!this.ctx){ this.curTrack=name; return; }
    // 곡이 뚝 끊기지 않게 살짝 겹쳐 넘긴다
    const g=this.musicGain.gain, t=this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.0001, t+0.28);
    setTimeout(()=>{
      this.curTrack=name; this.step=0;
      if(!this.ctx) return;
      this.nextTime=this.ctx.currentTime+0.05;
      const t2=this.ctx.currentTime, g2=this.musicGain.gain;
      g2.cancelScheduledValues(t2);
      g2.setValueAtTime(0.0001, t2);
      g2.linearRampToValueAtTime(0.34, t2+0.5);
      if(!this.playing) this._startSeq();
    }, 300);
  },
  stop(){
    this.curTrack=null;
    if(this.ctx&&this.musicGain){
      const g=this.musicGain.gain,t=this.ctx.currentTime;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
      g.linearRampToValueAtTime(0.0001,t+0.4);
    }
  },
  _startSeq(){
    if(this.playing||!this.ctx) return;
    this.playing = true;
    const tick = ()=>{
      if(!this.ctx){ this.playing=false; return; }
      const tr = this.tracks[this.curTrack];
      if(tr){
        const spb = 60/tr.bpm/2;                 // 8분음표 단위
        while(this.nextTime < this.ctx.currentTime + 0.18){
          this._scheduleStep(tr, this.step, this.nextTime, spb);
          this.nextTime += spb; this.step++;
        }
      } else {
        this.nextTime = this.ctx.currentTime + 0.06;
      }
      this.seqTimer = setTimeout(tick, 55);
    };
    tick();
  },
  _mid(n){ return 440*Math.pow(2,(n-69)/12); },
  _scheduleStep(tr, step, at, spb){
    const L=tr.lead, B=tr.bass, D=tr.drum;
    if(L && L.length){
      const n = L[step % L.length];
      if(n) this.tone({freq:this._mid(n), dur:spb*(tr.leadLen||1.7), type:tr.leadWave||'square',
                       vol:(tr.leadVol||0.13), at, bus:this.musicGain, reverb:!!tr.reverb});
    }
    if(B && B.length){
      const n = B[step % B.length];
      if(n) this.tone({freq:this._mid(n), dur:spb*1.5, type:tr.bassWave||'triangle',
                       vol:(tr.bassVol||0.16), at, bus:this.musicGain});
    }
    if(tr.pad && tr.pad.length && step % 8 === 0){
      const n = tr.pad[Math.floor(step/8) % tr.pad.length];
      if(n) this.tone({freq:this._mid(n), dur:spb*7.5, type:'sine', vol:0.08, at, bus:this.musicGain, reverb:true});
    }
    if(D){
      const c = D[step % D.length];
      if(c==='x') this.noise({dur:0.09,fq:150,vol:0.22,filter:'lowpass',at,bus:this.musicGain});
      else if(c==='o') this.noise({dur:0.13,fq:1500,vol:0.12,at,bus:this.musicGain});
      else if(c==='.') this.noise({dur:0.04,fq:5200,vol:0.045,filter:'highpass',at,bus:this.musicGain});
    }
  }
};

<script>
/* ===== js/10_art.js ===== */
/* ============================================================
   10_art.js — 어셋 전량 코드 생성 (외부 이미지 파일 0개)
   · 파라메트릭 픽셀 휴머노이드 (모든 인간 캐릭터)
   · 크리처/보스 픽셀맵
   · 테마별 타일셋 · 패럴랙스 배경 · 아이템 아이콘
   ============================================================ */
'use strict';

const SPR_W = 28, SPR_H = 32;   // 휴머노이드 스프라이트 규격 (발끝 = row 31)

// 색 보정 유틸
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r+amt),0,255); g=clamp(Math.round(g+amt),0,255); b=clamp(Math.round(b+amt),0,255);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
function mix(a,b,t){
  const na=parseInt(a.slice(1),16), nb=parseInt(b.slice(1),16);
  const r=Math.round(lerp((na>>16)&255,(nb>>16)&255,t));
  const g=Math.round(lerp((na>>8)&255,(nb>>8)&255,t));
  const bl=Math.round(lerp(na&255,nb&255,t));
  return '#'+((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0');
}

/* ---------------- 포즈 정의 ----------------
   각 값은 픽셀 오프셋. armA=뒤팔, armB=앞팔, [dx,dy,length]
   leg=[frontDx, frontDy, backDx, backDy]  bob=상체 상하  lean=상체 좌우 */
const POSES = {
  idle:   {bob:0, lean:0, armA:[0,0], armB:[0,0], leg:[0,0,0,0], headY:0},
  idle2:  {bob:1, lean:0, armA:[0,1], armB:[0,1], leg:[0,0,0,0], headY:1},
  walk0:  {bob:0, lean:1, armA:[-2,0], armB:[2,0], leg:[2,0,-2,0]},
  walk1:  {bob:-1,lean:0, armA:[0,0],  armB:[0,0], leg:[0,-1,0,-1]},
  walk2:  {bob:0, lean:1, armA:[2,0],  armB:[-2,0],leg:[-2,0,2,0]},
  walk3:  {bob:-1,lean:0, armA:[0,0],  armB:[0,0], leg:[0,-1,0,-1]},
  jump:   {bob:-2,lean:0, armA:[-1,-4],armB:[1,-5],leg:[2,-2,-3,1]},
  fall:   {bob:1, lean:0, armA:[-2,-3],armB:[2,-4],leg:[-2,1,2,-1]},
  atk0:   {bob:0, lean:-2,armA:[-2,1], armB:[-4,-4],leg:[-1,0,1,0], wpn:[-6,-8,-45]},
  atk1:   {bob:1, lean:2, armA:[-1,1], armB:[7,-2], leg:[2,0,-1,0], wpn:[10,-2,15]},
  atk2:   {bob:2, lean:1, armA:[0,2],  armB:[6,4],  leg:[3,0,-2,0], wpn:[9,6,70]},
  hurt:   {bob:1, lean:-3,armA:[-3,-2],armB:[3,-3], leg:[-2,0,2,0]},
  dead:   {bob:8, lean:0, armA:[-5,6], armB:[5,6],  leg:[-4,4,4,4], flat:true},
  pray:   {bob:2, lean:0, armA:[3,-2], armB:[-3,-2],leg:[0,0,0,0], headY:1},
  push:   {bob:1, lean:2, armA:[4,-1], armB:[5,-1], leg:[2,0,-2,0]},
  sit:    {bob:6, lean:0, armA:[-3,3], armB:[3,3],  leg:[4,4,-1,5]},
  climb0: {bob:0, lean:0, armA:[0,-7], armB:[0,-2], leg:[1,-2,-1,1]},
  climb1: {bob:0, lean:0, armA:[0,-2], armB:[0,-7], leg:[-1,1,1,-2]},
  cheer:  {bob:-1,lean:0, armA:[-2,-9],armB:[2,-9], leg:[0,0,0,0]}
};

/* ---------------- 휴머노이드 렌더러 ---------------- */
function drawHumanoid(o){
  const c = makeCanvas(SPR_W, SPR_H), x = ctxOf(c);
  const P = POSES[o.pose] || POSES.idle;
  const skin = o.skin || '#e8b088', skinS = shade(skin,-38);
  const hair = o.hair || '#5a3a22', hairS = shade(hair,-30), hairL = shade(hair,26);
  const robe = o.robe || '#5b7bb5', robeS = shade(robe,-34), robeL = shade(robe,24);
  const acc  = o.acc  || shade(robe,-52);
  const boot = o.boot || '#4a3524', bootS = shade(boot,-26);
  const belt = o.belt || '#3c2a18';
  const CX = 14;                              // 몸통 중심
  const bob = P.bob|0, lean = P.lean|0;
  const r = (px_,py,w,h,col)=>{ x.fillStyle=col; x.fillRect(px_,py,w,h); };

  // ---- 망토 (뒤) ----
  if(o.cape){
    const cs = shade(o.cape,-30);
    r(CX-6+lean, 14+bob, 12, 12, o.cape);
    r(CX-7+lean, 16+bob, 1, 9, cs); r(CX+6+lean, 16+bob, 1, 9, cs);
    r(CX-5+lean, 26+bob, 10, 2, cs);
  }
  // ---- 짐 (등에 진 죄의 짐) ----
  if(o.burden){
    const bc='#6b4a2c', bs=shade(bc,-28), bl=shade(bc,20);
    const by = 11+bob+(o.burdenBob||0);
    r(CX-11+lean, by, 11, 13, bc);
    r(CX-11+lean, by, 11, 2, bl);
    r(CX-11+lean, by+11, 11, 2, bs);
    r(CX-12+lean, by+3, 1, 8, bs);
    // 묶은 끈
    r(CX-11+lean, by+5, 11, 1, '#3a2716');
    r(CX-7+lean, by-2, 2, 3, '#3a2716');
    // 어깨끈
    r(CX-4+lean, 15+bob, 2, 8, '#4a3220');
  }
  // ---- 뒤쪽 팔 ----
  const aA = P.armA||[0,0];
  r(CX-8+lean+aA[0], 16+bob+aA[1], 3, 8, shade(robe,-45));
  r(CX-8+lean+aA[0], 23+bob+aA[1], 3, 2, skinS);

  // ---- 다리 ----
  const lg = P.leg||[0,0,0,0];
  if(!P.flat){
    r(CX-5+lg[2], 24+lg[3], 4, 5, acc);          // 뒷다리
    r(CX-5+lg[2], 28+lg[3], 4, 3, bootS);
    r(CX+1+lg[0], 24+lg[1], 4, 5, shade(acc,14)); // 앞다리
    r(CX+1+lg[0], 28+lg[1], 5, 3, boot);
  } else {
    r(CX-8, 27, 7, 4, acc); r(CX+1, 27, 7, 4, shade(acc,14));
  }
  // ---- 몸통 ----
  const ty = 15+bob;
  r(CX-5+lean, ty, 10, 9, robe);
  r(CX-5+lean, ty, 10, 2, robeL);          // 어깨 하이라이트
  r(CX+3+lean, ty+2, 2, 7, robeS);         // 오른쪽 음영
  r(CX-5+lean, ty+7, 10, 2, belt);         // 허리띠
  if(o.armor){                              // 흉배(전신갑주)
    const am=o.armor, as=shade(am,-34), al=shade(am,30);
    r(CX-4+lean, ty+1, 8, 6, am);
    r(CX-4+lean, ty+1, 8, 1, al);
    r(CX-4+lean, ty+6, 8, 1, as);
    r(CX-1+lean, ty+2, 2, 4, al);
  }
  if(o.sash){ r(CX-5+lean, ty+1, 10, 2, o.sash); }

  // ---- 머리 ----
  const hy = 5+bob+(P.headY||0);
  r(CX-5+lean, hy, 10, 10, skin);
  r(CX+3+lean, hy+1, 2, 9, skinS);         // 얼굴 음영
  r(CX-5+lean, hy+9, 10, 1, skinS);        // 턱선
  // 눈
  const ey = hy+5;
  if(o.closedEyes){
    r(CX-3+lean, ey, 2, 1, '#2b1a10'); r(CX+1+lean, ey, 2, 1, '#2b1a10');
  } else {
    r(CX-3+lean, ey, 2, 2, '#ffffff'); r(CX+1+lean, ey, 2, 2, '#ffffff');
    const ed = o.eyeDir||0;
    r(CX-3+lean+(ed>0?1:0), ey, 1, 2, o.eyeColor||'#2b1a10');
    r(CX+1+lean+(ed>0?1:0), ey, 1, 2, o.eyeColor||'#2b1a10');
  }
  if(o.brow){ r(CX-4+lean, ey-2, 3, 1, hairS); r(CX+1+lean, ey-2, 3, 1, hairS); }
  if(o.mouth!==false){ r(CX-1+lean, hy+8, 2, 1, shade(skin,-58)); }
  if(o.beard){
    r(CX-5+lean, hy+7, 10, 4, o.beard);
    r(CX-5+lean, hy+7, 10, 1, shade(o.beard,20));
    r(CX-2+lean, hy+11, 4, 3, o.beard);
    r(CX-1+lean, hy+8, 2, 1, '#40200f');
  }
  // 머리카락
  if(o.hairStyle !== 'bald'){
    r(CX-6+lean, hy-3, 12, 4, hair);
    r(CX-6+lean, hy-3, 12, 1, hairL);
    r(CX-6+lean, hy+1, 2, 4, hair);
    r(CX+4+lean, hy+1, 2, 4, hair);
    if(o.hairStyle==='long'){ r(CX-7+lean, hy+1, 2, 11, hair); r(CX+5+lean, hy+1, 2, 11, hairS); }
    if(o.hairStyle==='fringe'){ r(CX-5+lean, hy+1, 4, 2, hair); }
    if(o.hairStyle==='spiky'){ r(CX-4+lean, hy-5, 2, 3, hair); r(CX+1+lean, hy-5, 2, 3, hair); }
  }
  // 두건/후드
  if(o.hood){
    const hs=shade(o.hood,-30);
    r(CX-7+lean, hy-4, 14, 6, o.hood);
    r(CX-7+lean, hy-4, 14, 1, shade(o.hood,22));
    r(CX-7+lean, hy+2, 2, 8, o.hood); r(CX+5+lean, hy+2, 2, 8, hs);
    r(CX-5+lean, hy+1, 10, 1, hs);
  }
  if(o.hat){
    const hs=shade(o.hat,-32);
    r(CX-8+lean, hy-2, 16, 2, o.hat);
    r(CX-5+lean, hy-7, 10, 5, o.hat);
    r(CX-5+lean, hy-7, 10, 1, shade(o.hat,24));
    r(CX-5+lean, hy-3, 10, 1, hs);
  }
  if(o.crown){
    r(CX-5+lean, hy-6, 10, 3, '#ffd75e');
    r(CX-5+lean, hy-8, 2, 2, '#ffd75e'); r(CX-1+lean, hy-9, 2, 3, '#ffd75e'); r(CX+3+lean, hy-8, 2, 2, '#ffd75e');
    r(CX-1+lean, hy-5, 2, 1, '#e0483c');
  }
  // ---- 앞쪽 팔 ----
  const aB = P.armB||[0,0];
  r(CX+5+lean+aB[0], 16+bob+aB[1], 3, 8, robe);
  r(CX+5+lean+aB[0], 16+bob+aB[1], 3, 1, robeL);
  r(CX+5+lean+aB[0], 23+bob+aB[1], 3, 2, skin);
  if(o.bracer){ r(CX+5+lean+aB[0], 21+bob+aB[1], 3, 2, o.bracer); }

  // ---- 방패 (뒤팔) ----
  if(o.shield){
    const sc=o.shield, ss=shade(sc,-34), sl=shade(sc,26);
    const sx = CX-11+lean+aA[0], sy = 15+bob+aA[1];
    r(sx, sy, 6, 10, sc); r(sx, sy, 6, 1, sl); r(sx, sy+9, 6, 1, ss);
    r(sx+2, sy+3, 2, 4, sl);
  }
  // ---- 무기 (앞팔) ----
  if(o.weapon){
    const W = P.wpn || [8,-2,0];
    x.save();
    x.translate(CX+6+lean+aB[0]+1, 24+bob+aB[1]);
    x.rotate((W[2]||0)*Math.PI/180);
    if(o.weapon==='sword'){
      const bl=o.bladeColor||'#dfe9f5';
      x.fillStyle='#6b4a2c'; x.fillRect(-1,-2,3,5);              // 손잡이
      x.fillStyle='#c9a227'; x.fillRect(-4,-4,9,2);               // 가드
      x.fillStyle=bl;        x.fillRect(-1,-18,3,14);             // 검신
      x.fillStyle=shade(bl,34); x.fillRect(-1,-18,1,14);
      x.fillStyle='#fff';    x.fillRect(0,-19,1,2);
    } else if(o.weapon==='staff'){
      x.fillStyle='#7a5a34'; x.fillRect(-1,-16,2,20);
      x.fillStyle='#ffe08a'; x.fillRect(-2,-19,4,4);
    } else if(o.weapon==='book'){
      x.fillStyle='#8a2a2a'; x.fillRect(-4,-3,9,7);
      x.fillStyle='#f2e6c8'; x.fillRect(-3,-2,7,5);
      x.fillStyle='#8a2a2a'; x.fillRect(0,-2,1,5);
    } else if(o.weapon==='torch'){
      x.fillStyle='#5a3a22'; x.fillRect(-1,-12,2,14);
      x.fillStyle='#ff8c2a'; x.fillRect(-2,-16,4,5);
      x.fillStyle='#ffe066'; x.fillRect(-1,-15,2,3);
    } else if(o.weapon==='spear'){
      x.fillStyle='#6b4a2c'; x.fillRect(-1,-16,2,22);
      x.fillStyle='#cfd8e3'; x.fillRect(-2,-21,4,6);
    }
    x.restore();
  }
  // ---- 후광 ----
  if(o.halo){
    x.globalAlpha=0.85; x.fillStyle=o.halo;
    x.fillRect(CX-6+lean, 5+bob+(P.headY||0)-7, 12, 1);
    x.fillRect(CX-7+lean, 5+bob+(P.headY||0)-6, 1, 1);
    x.fillRect(CX+6+lean, 5+bob+(P.headY||0)-6, 1, 1);
    x.globalAlpha=1;
  }
  return c;
}

/* 캐릭터 애니메이션 세트 생성 */
function buildCharSet(base, extra){
  const o = Object.assign({}, base, extra||{});
  const set = {};
  for(const p in POSES){
    const cv = drawHumanoid(Object.assign({}, o, {pose:p}));
    set[p] = {r:cv, l:flipH(cv)};
  }
  set.walk = [set.walk0, set.walk1, set.walk2, set.walk3];
  set.idleA = [set.idle, set.idle, set.idle2, set.idle2];
  set.atk = [set.atk0, set.atk1, set.atk2];
  set.climb = [set.climb0, set.climb1];
  return set;
}

function drawApollyon(frame, phase){
  const c = makeCanvas(72,80), x = ctxOf(c);
  const r=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h);};
  const wing = frame%4;                    // 날갯짓
  const angry = phase>=2;
  const scale = angry? '#7a2030':'#3f5a3a';
  const scaleL= angry? '#a03040':'#5a7a50';
  const scaleS= angry? '#521420':'#2a3f28';
  const belly = angry? '#c07030':'#b09a48';
  // 날개 (뒤)
  const wy = [0,-3,-6,-3][wing];
  r(2, 16+wy, 16, 26, scaleS);
  r(4, 14+wy, 14, 4, scale);
  r(54, 16+wy, 16, 26, scaleS);
  r(54, 14+wy, 14, 4, scale);
  for(let i=0;i<4;i++){
    r(3+i*4, 20+wy+i*2, 2, 20-i*3, scale);
    r(65-i*4, 20+wy+i*2, 2, 20-i*3, scale);
  }
  // 꼬리
  r(30, 62, 12, 8, scaleS); r(20, 66, 14, 6, scaleS); r(12, 68, 10, 5, scale);
  // 몸통
  r(20, 26, 32, 34, scale);
  r(20, 26, 32, 3, scaleL);
  r(24, 34, 24, 22, belly);
  for(let i=0;i<4;i++) r(24, 36+i*5, 24, 1, shade(belly,-30));
  // 어깨 가시
  r(16, 24, 8, 8, scaleS); r(48, 24, 8, 8, scaleS);
  r(14, 20, 5, 6, scaleL); r(53, 20, 5, 6, scaleL);
  // 곰의 발
  r(16, 56, 12, 12, scaleS); r(44, 56, 12, 12, scaleS);
  r(14, 66, 16, 5, scale);   r(42, 66, 16, 5, scale);
  for(let i=0;i<3;i++){ r(15+i*5, 69, 3, 3, '#e8e0d0'); r(43+i*5, 69, 3, 3, '#e8e0d0'); }
  // 머리 — 사자의 입
  const hb = frame%2;
  r(22, 4+hb, 28, 24, scale);
  r(22, 4+hb, 28, 3, scaleL);
  r(18, 8+hb, 6, 14, scaleS); r(48, 8+hb, 6, 14, scaleS);      // 갈기
  // 뿔
  r(20, -2+hb, 5, 8, '#d8cbb0'); r(47, -2+hb, 5, 8, '#d8cbb0');
  r(18, -5+hb, 4, 5, '#e8dcc0'); r(50, -5+hb, 4, 5, '#e8dcc0');
  // 눈
  r(26, 12+hb, 7, 5, '#ffdd33');
  r(39, 12+hb, 7, 5, '#ffdd33');
  r(28, 12+hb, 3, 5, '#8a0000'); r(41, 12+hb, 3, 5, '#8a0000');
  if(angry){ r(26,10+hb,7,2,'#ff3020'); r(39,10+hb,7,2,'#ff3020'); }
  // 입
  const gape = (frame%8<4)? 6:2;
  r(26, 20+hb, 20, gape, '#2a0808');
  for(let i=0;i<5;i++){ r(27+i*4, 20+hb, 2, 3, '#f0e8d0'); r(29+i*4, 17+hb+gape, 2, 3, '#f0e8d0'); }
  return c;
}
// 절망 거인 — 의심의 성의 주인

  x.restore();
  // 다리
  r(10, 62, 14, 22, bs); r(30, 62, 14, 22, bs);
  r(8, 80, 18, 8, '#332f26'); r(28, 80, 18, 8, '#332f26');
  // 몸통
  r(8, 28+bob, 40, 36, b);
  r(8, 28+bob, 40, 3, bl);
  r(14, 36+bob, 28, 22, skinS);          // 배
  r(6, 56+bob, 44, 8, '#3a3226');        // 허리띠
  r(24, 57+bob, 8, 6, '#8a7a3a');
  // 팔
  r(0, 32+bob, 12, 26, b); r(0, 54+bob, 12, 8, skin);
  r(44, 32+bob, 12, 24, b);
  // 머리
  r(14, 6+bob, 28, 24, skin);
  r(14, 6+bob, 28, 3, shade(skin,18));
  r(36, 10+bob, 6, 18, skinS);
  r(12, 2+bob, 32, 6, '#54483a');        // 헝클어진 머리
  r(10, 6+bob, 4, 10, '#54483a'); r(42, 6+bob, 4, 10, '#3f362a');
  // 얼굴 — 흉포
  r(18, 15+bob, 7, 4, '#e8e0d0'); r(31, 15+bob, 7, 4, '#e8e0d0');
  r(20, 15+bob, 3, 4, '#301a10'); r(33, 15+bob, 3, 4, '#301a10');
  r(17, 12+bob, 9, 2, '#3a2a1a'); r(30, 12+bob, 9, 2, '#3a2a1a');
  r(20, 24+bob, 16, 4, '#2a1208');       // 벌린 입
  for(let i=0;i<4;i++) r(21+i*4, 24+bob, 2, 2, '#e8dcc0');
  r(16, 30+bob, 24, 5, '#54483a');       // 수염
  return c;
}

function makeTileset(themeName){
  const T = THEMES[themeName] || THEMES.hill;
  RND = mulberry32(themeName.length*7919 + 1234);
  const set = {solid:[], top:[], plat:[], back:[], hazard:null, mud:null, water:null, ladder:null, theme:T};

  const speckle=(x,col,n,w,h,ox,oy)=>{ x.fillStyle=col; for(let i=0;i<n;i++){ x.fillRect((ox||0)+rndi(0,w-2),(oy||0)+rndi(0,h-2),rndi(1,2),1); } };

  for(let v=0; v<4; v++){
    // 내부 흙/돌
    const c=makeCanvas(TS,TS), x=ctxOf(c);
    x.fillStyle=T.base; x.fillRect(0,0,TS,TS);
    speckle(x,T.dark,7,TS,TS); speckle(x,T.lit,5,TS,TS);
    x.fillStyle=T.dark; x.fillRect(0,TS-1,TS,1); x.fillRect(TS-1,0,1,TS);
    set.solid.push(c);
    // 표면(윗면)
    const c2=makeCanvas(TS,TS), x2=ctxOf(c2);
    x2.fillStyle=T.base; x2.fillRect(0,0,TS,TS);
    speckle(x2,T.dark,6,TS,TS,0,5);
    x2.fillStyle=T.top; x2.fillRect(0,0,TS,4);
    x2.fillStyle=T.topLit; x2.fillRect(0,0,TS,2);
    for(let i=0;i<TS;i+=2){ if(rnd()<0.55){ x2.fillStyle=T.top; x2.fillRect(i,4,2,rndi(1,3)); } }
    set.top.push(c2);
    // 배경(뒤쪽 벽) — 전경과 확실히 구분되도록 크게 어둡게
    const c3=makeCanvas(TS,TS), x3=ctxOf(c3);
    const bb = shade(T.base,-62);
    x3.fillStyle=bb; x3.fillRect(0,0,TS,TS);
    speckle(x3,shade(T.base,-72),5,TS,TS);
    x3.fillStyle='rgba(0,0,0,0.30)'; x3.fillRect(0,0,TS,TS);
    x3.fillStyle=shade(T.base,-54); x3.fillRect(0,0,TS,1);
    /* 하프팀버 — 가로 들보와 세로 기둥.
       ⚠ 예전엔 모든 변형에 가로 들보를 넣어 벽 전체가 격자 벽지처럼 시끄러웠다.
       변형마다 하나씩만 준다. */
    if(T.windows){
      x3.fillStyle=shade(T.base,-44);
      if(v===1) x3.fillRect(3, 0, 1, TS);
      else if(v===2) x3.fillRect(0, 2, TS, 1);
      else if(v===3) x3.fillRect(TS-4, 0, 1, TS);
    }
    // 창문·횃불 — 넷 중 하나만 (벽지처럼 반복되지 않게)
    if(T.windows && v===0){
      const wc = T.windowColor||'rgba(255,170,60,0.75)';
      if(T.torch){                    // 궁전 — 벽에 걸린 횃불
        x3.fillStyle='#4a3a24'; x3.fillRect(7,8,2,6);
        x3.fillStyle=wc;        x3.fillRect(6,3,4,5);
        x3.fillStyle='rgba(255,240,190,0.85)'; x3.fillRect(7,4,2,3);
      } else {
        /* 중세식 아치창(랜싯) — 네모 격자창은 현대 아파트처럼 읽힌다.
           위를 둥글게 깎고 가운데 문설주만 남긴다. */
        x3.fillStyle=wc;
        x3.fillRect(5, 5, 5, 6);
        x3.fillRect(6, 3, 3, 2);
        x3.fillRect(7, 2, 1, 1);
        x3.fillStyle='rgba(0,0,0,0.55)';
        x3.fillRect(7, 3, 1, 8);            // 문설주
        x3.fillStyle=shade(T.base,-40);     // 돌 인방(引枋)
        x3.fillRect(4, 11, 7, 1);
      }
    }
    set.back.push(c3);
  }
  // 발판 (한 방향 통과)
  for(let v=0;v<2;v++){
    const c=makeCanvas(TS,8), x=ctxOf(c);
    x.fillStyle=shade(T.base,-6); x.fillRect(0,1,TS,7);
    x.fillStyle=T.top;    x.fillRect(0,0,TS,3);
    x.fillStyle=T.topLit; x.fillRect(0,0,TS,1);
    x.fillStyle=shade(T.base,-42); x.fillRect(0,7,TS,1);
    x.fillStyle=shade(T.base,-30);
    for(let i=2;i<TS;i+=5) x.fillRect(i, 4, 2, 3);
    x.fillStyle='rgba(0,0,0,0.35)'; x.fillRect(0,6,TS,1);
    set.plat.push(c);
  }
  // 가시/위험
  {
    const c=makeCanvas(TS,TS), x=ctxOf(c);
    x.fillStyle=shade(T.base,-20); x.fillRect(0,10,TS,6);
    for(let i=0;i<4;i++){
      x.fillStyle='#b8b0a0'; x.beginPath(); x.moveTo(i*4,12); x.lineTo(i*4+2,1); x.lineTo(i*4+4,12); x.fill();
      x.fillStyle='#e8e0d0'; x.fillRect(i*4+1,4,1,7);
    }
    set.hazard=c;
  }
  // 진흙 — 깊고 질척한 늪
  {
    const c=makeCanvas(TS,TS), x=ctxOf(c);       // 속 — 거의 검다
    x.fillStyle='#1d1a0d'; x.fillRect(0,0,TS,TS);
    x.fillStyle='#121006'; for(let i=0;i<12;i++) x.fillRect(rndi(0,14),rndi(0,14),rndi(2,5),rndi(1,3));
    x.fillStyle='#2b2715'; for(let i=0;i<4;i++) x.fillRect(rndi(0,13),rndi(0,13),2,2);
    set.mudDeep=c;
    const c2=makeCanvas(TS,TS), x2=ctxOf(c2);    // 표면 — 번들거리는 검은 진창
    x2.fillStyle='#241f10'; x2.fillRect(0,0,TS,TS);
    x2.fillStyle='#15120a'; for(let i=0;i<9;i++) x2.fillRect(rndi(0,14),rndi(4,14),rndi(2,4),rndi(1,2));
    x2.fillStyle='#3a3318'; x2.fillRect(0,0,TS,3);
    x2.fillStyle='#5d5326'; x2.fillRect(0,0,TS,1);
    x2.fillStyle='rgba(180,190,120,0.30)'; x2.fillRect(1,1,5,1); x2.fillRect(9,0,4,1);
    // 기포
    x2.fillStyle='#4e4622';
    x2.fillRect(3,2,2,2); x2.fillRect(10,3,2,2); x2.fillRect(7,5,1,1);
    x2.fillStyle='rgba(0,0,0,0.45)'; x2.fillRect(0,4,TS,2);
    set.mud=c2;
  }
  // 물 — 수면과 깊은 물을 나눈다 (벽처럼 보이지 않게)
  {
    const c=makeCanvas(TS,TS), x=ctxOf(c);
    x.fillStyle='rgba(74,138,196,0.42)'; x.fillRect(0,0,TS,TS);
    x.fillStyle='rgba(198,232,250,0.85)'; x.fillRect(0,0,TS,2);
    x.fillStyle='rgba(255,255,255,0.55)'; x.fillRect(2,1,5,1); x.fillRect(10,2,4,1);
    x.fillStyle='rgba(140,196,232,0.35)'; x.fillRect(0,6,TS,1);
    set.water=c;
    const c2=makeCanvas(TS,TS), x2=ctxOf(c2);
    x2.fillStyle='rgba(44,96,150,0.55)'; x2.fillRect(0,0,TS,TS);
    x2.fillStyle='rgba(70,130,190,0.30)'; x2.fillRect(0,4,TS,1); x2.fillRect(0,11,TS,1);
    set.waterDeep=c2;
  }
  // 사다리
  {
    const c=makeCanvas(TS,TS), x=ctxOf(c);
    x.fillStyle='#7a5a34'; x.fillRect(2,0,3,TS); x.fillRect(11,0,3,TS);
    x.fillStyle='#96703f'; x.fillRect(2,0,1,TS); x.fillRect(11,0,1,TS);
    x.fillStyle='#8a6a40'; x.fillRect(2,3,12,2); x.fillRect(2,11,12,2);
    set.ladder=c;
  }
  RND = mulberry32(20260825);
  return set;
}

/* ---------------- 패럴랙스 배경 ---------------- */
function makeBackdrop(themeName, kind){
  const T = THEMES[themeName] || THEMES.hill;
  RND = mulberry32(themeName.length*104729 + 55);
  const layers=[];
  const W=VW*2, H=VH;

  // 하늘 (고정)
  const sky=makeCanvas(VW,VH), sx=ctxOf(sky);
  const g=sx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,T.sky[0]); g.addColorStop(0.55,T.sky[1]); g.addColorStop(1,T.sky[2]);
  sx.fillStyle=g; sx.fillRect(0,0,VW,VH);
  if(kind==='stars'||themeName==='dark'||themeName==='valley'||themeName==='castle'){
    for(let i=0;i<70;i++){ sx.fillStyle=`rgba(255,255,255,${0.25+rnd()*0.6})`; sx.fillRect(rndi(0,VW),rndi(0,VH*0.7),1,1); }
  }
  if(kind==='sun'){
    sx.fillStyle='rgba(255,240,180,0.9)'; sx.beginPath(); sx.arc(VW*0.72, VH*0.24, 26,0,7); sx.fill();
    sx.fillStyle='rgba(255,250,220,0.5)'; sx.beginPath(); sx.arc(VW*0.72, VH*0.24, 40,0,7); sx.fill();
  }
  if(kind==='glory'){
    for(let i=0;i<16;i++){
      sx.save(); sx.translate(VW*0.5, -30); sx.rotate((i/16)*Math.PI*2);
      sx.fillStyle='rgba(255,245,200,0.14)'; sx.fillRect(-6,0,12,VH*1.6); sx.restore();
    }
  }
  layers.push({c:sky, speed:0, y:0, fixed:true});

  // 원경 실루엣
  const far=makeCanvas(W,H), fx=ctxOf(far);
  fx.fillStyle=T.bg2;
  let hy = H*0.62;
  fx.beginPath(); fx.moveTo(0,H);
  for(let px_=0; px_<=W; px_+=8){
    hy += (rnd()-0.5)*14; hy = clamp(hy, H*0.42, H*0.78);
    fx.lineTo(px_, hy);
  }
  fx.lineTo(W,H); fx.fill();
  if(kind==='city'){         // 불타는 도시 — 성벽을 두른 중세 읍성
    const gl=H*0.62;
    // 급경사 지붕의 집들 (안쪽)
    for(let i=0;i<30;i++){
      const bx=rndi(0,W-26), bw=rndi(16,28), bh=rndi(16,44);
      fx.fillStyle=shade(T.bg2,-14); fx.fillRect(bx, gl-bh, bw, bh+10);
      fx.fillStyle=shade(T.bg2,-30);                       // 박공지붕
      fx.beginPath(); fx.moveTo(bx-3, gl-bh); fx.lineTo(bx+bw/2, gl-bh-rndi(9,16)); fx.lineTo(bx+bw+3, gl-bh); fx.closePath(); fx.fill();
      fx.fillStyle='rgba(255,170,60,0.55)';                // 창의 불빛
      for(let w2=0;w2<2;w2++) if(rnd()<0.6) fx.fillRect(bx+4+w2*8, gl-bh+7+rndi(0,Math.max(2,bh-16)), 3, 4);
    }
    // 종탑 — 중세 도시의 표지
    for(let i=0;i<4;i++){
      const tx=rndi(40,W-40), th=rndi(58,86), tw=14;
      fx.fillStyle=shade(T.bg2,-26); fx.fillRect(tx, gl-th, tw, th+10);
      fx.beginPath(); fx.moveTo(tx-4, gl-th); fx.lineTo(tx+tw/2, gl-th-26); fx.lineTo(tx+tw+4, gl-th); fx.closePath(); fx.fill();
      fx.fillStyle='rgba(255,190,90,0.5)'; fx.fillRect(tx+tw/2-2, gl-th+10, 4, 7);
    }
    // 성벽 + 총안(크레넬레이션) — 도시를 감싼다
    const wy=gl-26;
    fx.fillStyle=shade(T.bg2,-6); fx.fillRect(0, wy, W, 36);
    fx.fillStyle=shade(T.bg2,-20);
    for(let cx=0; cx<W; cx+=12) fx.fillRect(cx, wy-6, 7, 7);   // 총안
    // 성문과 망루
    for(let i=0;i<3;i++){
      const gx=120+i*300+rndi(-30,30);
      fx.fillStyle=shade(T.bg2,-2); fx.fillRect(gx-16, wy-22, 32, 58);
      fx.fillStyle=shade(T.bg2,-22);
      for(let cx=gx-16; cx<gx+16; cx+=10) fx.fillRect(cx, wy-28, 6, 7);
      fx.fillStyle='#160e0c';                                   // 아치형 문
      fx.beginPath(); fx.moveTo(gx-7, wy+36); fx.lineTo(gx-7, wy+10);
      fx.quadraticCurveTo(gx, wy-1, gx+7, wy+10); fx.lineTo(gx+7, wy+36); fx.closePath(); fx.fill();
    }
  }
  /* 바깥 장면에는 멀리 성채를 세운다 — 세계가 중세로 읽히게 하는 가장 싼 신호 */
  if(kind==='keeps' || kind==='sun' || (kind==='mountains' && themeName==='mountain')){
    for(let i=0;i<5;i++){
      const kx=90+i*190+rndi(-40,40), kh=rndi(34,58), kw=rndi(26,40), gl=H*0.66;
      fx.fillStyle=shade(T.bg2,-16); fx.fillRect(kx, gl-kh, kw, kh+8);
      for(let cx=kx; cx<kx+kw; cx+=9) fx.fillRect(cx, gl-kh-5, 5, 6);        // 총안
      // 모서리 탑 두 개
      [-6, kw].forEach(ox=>{
        fx.fillRect(kx+ox, gl-kh-12, 8, kh+20);
        fx.beginPath(); fx.moveTo(kx+ox-3, gl-kh-12); fx.lineTo(kx+ox+4, gl-kh-24); fx.lineTo(kx+ox+11, gl-kh-12); fx.closePath(); fx.fill();
      });
    }
  }
  if(kind==='mountains'){
    for(let i=0;i<7;i++){
      const mx=i*150+rndi(-30,30), mw=rndi(120,220), mh=rndi(60,120);
      fx.fillStyle=shade(T.bg2,-12);
      fx.beginPath(); fx.moveTo(mx,H*0.7); fx.lineTo(mx+mw/2, H*0.7-mh); fx.lineTo(mx+mw,H*0.7); fx.fill();
      fx.fillStyle='rgba(255,255,255,0.55)';
      fx.beginPath(); fx.moveTo(mx+mw/2-12, H*0.7-mh+18); fx.lineTo(mx+mw/2, H*0.7-mh); fx.lineTo(mx+mw/2+12, H*0.7-mh+18); fx.fill();
    }
  }
  if(kind==='spires'){       // 천성의 첨탑
    for(let i=0;i<9;i++){
      const sx2=40+i*100+rndi(-16,16), sw=rndi(16,28), sh=rndi(70,140);
      fx.fillStyle=shade(T.bg1,10); fx.fillRect(sx2, H*0.66-sh, sw, sh);
      fx.fillStyle=shade(T.bg1,26);
      fx.beginPath(); fx.moveTo(sx2-3,H*0.66-sh); fx.lineTo(sx2+sw/2, H*0.66-sh-24); fx.lineTo(sx2+sw+3,H*0.66-sh); fx.fill();
      fx.fillStyle='#fff0b0'; fx.fillRect(sx2+sw/2-1, H*0.66-sh-30, 2, 6);
    }
  }
  layers.push({c:far, speed:0.22, y:0});

  // 중경
  const mid=makeCanvas(W,H), mx2=ctxOf(mid);
  mx2.fillStyle=T.bg1;
  let my=H*0.78;
  mx2.beginPath(); mx2.moveTo(0,H);
  for(let px_=0;px_<=W;px_+=6){ my += (rnd()-0.5)*10; my=clamp(my,H*0.62,H*0.88); mx2.lineTo(px_,my); }
  mx2.lineTo(W,H); mx2.fill();
  if(kind==='trees'||themeName==='swamp'||themeName==='delect'||themeName==='hill'){
    for(let i=0;i<30;i++){
      const tx=rndi(0,W), ty=H*0.80-rndi(0,16), th=rndi(26,54);
      mx2.fillStyle=shade(T.bg1,-24); mx2.fillRect(tx,ty-th,4,th);
      mx2.fillStyle=shade(T.bg1,-14);
      mx2.beginPath(); mx2.arc(tx+2, ty-th-4, rndi(9,16),0,7); mx2.fill();
    }
  }
  if(kind==='tents'){        // 허영의 시장 — 줄지어 선 좌판
    for(let i=0;i<16;i++){
      const tx=i*64+rndi(-14,14), tw=rndi(40,58), ty=H*0.80;
      const col=['#c04a5a','#c8a03c','#4a8ac0','#7a4a9a','#4aa070'][rndi(0,4)];
      // 기둥
      mx2.fillStyle=shade(col,-58);
      mx2.fillRect(tx+2, ty-24, 3, 26); mx2.fillRect(tx+tw-5, ty-24, 3, 26);
      // 차양 (삼각 지붕)
      mx2.fillStyle=shade(col,-30);
      mx2.beginPath(); mx2.moveTo(tx-4, ty-24); mx2.lineTo(tx+tw/2, ty-40); mx2.lineTo(tx+tw+4, ty-24); mx2.closePath(); mx2.fill();
      // 줄무늬
      for(let s2=0;s2<tw;s2+=8){
        mx2.fillStyle=(s2/8)%2? shade(col,-18):shade(col,-42);
        mx2.fillRect(tx-2+s2, ty-24, 8, 4);
      }
      // 좌판 상판
      mx2.fillStyle=shade(col,-52); mx2.fillRect(tx, ty-10, tw, 4);
      // 깃발
      mx2.fillStyle='#e8d068'; mx2.fillRect(tx+tw/2-1, ty-48, 2, 9);
      mx2.fillRect(tx+tw/2+1, ty-48, 6, 4);
    }
  }
  /* 중세의 손자국 — 초가집·돌담·나무 이정표. 시대를 배경이 말하게 한다. */
  if(kind==='trees' || kind==='sun' || kind==='keeps' || themeName==='hill' || themeName==='gate' || themeName==='beulah'){
    for(let i=0;i<9;i++){
      const hx=i*220+rndi(-60,60), hy=H*0.82-rndi(0,10), hw=rndi(26,38), hh=rndi(14,20);
      mx2.fillStyle=shade(T.bg1,-34); mx2.fillRect(hx, hy-hh, hw, hh);            // 흙벽
      mx2.fillStyle=shade(T.bg1,-46);                                              // 초가지붕
      mx2.beginPath(); mx2.moveTo(hx-5, hy-hh); mx2.lineTo(hx+hw/2, hy-hh-rndi(11,17)); mx2.lineTo(hx+hw+5, hy-hh); mx2.closePath(); mx2.fill();
      mx2.fillStyle='rgba(255,200,120,0.32)'; mx2.fillRect(hx+hw/2-2, hy-hh+5, 4, 5);
    }
    // 낮은 돌담이 언덕을 가로지른다
    let wy2=H*0.86;
    for(let px_=0; px_<W; px_+=7){
      wy2 += (rnd()-0.5)*3; wy2=clamp(wy2, H*0.80, H*0.90);
      mx2.fillStyle=shade(T.bg1,-40); mx2.fillRect(px_, wy2, 7, rndi(3,5));
    }
  }
  layers.push({c:mid, speed:0.48, y:0});

  RND = mulberry32(20260825);
  return layers;
}

/* ---------------- 어셋 캐시 ---------------- */
const ART = { chars:{}, tiles:{}, backs:{}, icons:{}, obj:{}, boss:{}, creature:{} };

function buildArt(){
  // 인물 — 개성 파라미터로 생성
  for(const k in PEOPLE){
    ART.chars[k] = buildPersonSet(PEOPLE[k], {align: ALIGN[k]||'neutral'});
  }
  // 주인공 4단계 (짐 → 옷 → 검 → 갑옷)
  ART.chars.pcBurden = buildPersonSet(PEOPLE.christian, {burden:true});
  ART.chars.pcFree   = buildPersonSet(PEOPLE.christianRobe, {});
  ART.chars.pcSword  = buildPersonSet(PEOPLE.christianRobe, {weapon:'sword'});
  ART.chars.pcArmor  = buildPersonSet(PEOPLE.christianArmor, {weapon:'sword', shield:'#33528f'});
  ART.chars.pcArmorNS= buildPersonSet(PEOPLE.christianArmor, {weapon:'sword'});
  ART.chars.pcTorch  = buildPersonSet(PEOPLE.christianArmor, {weapon:'torch'});
  // 몬스터
  for(const k in CREATURE2){
    const fr=[]; for(let f=0; f<8; f++){ const cv=CREATURE2[k](f); fr.push({r:cv,l:flipH(cv)}); }
    ART.creature[k]=fr;
  }
  // 보스
  ART.boss.apollyon = [];
  for(let ph=0; ph<3; ph++){
    const fr=[]; for(let f=0;f<8;f++){ const cv=drawApollyon2(f,ph); fr.push({r:cv,l:flipH(cv)}); }
    ART.boss.apollyon.push(fr);
  }
  ART.boss.despair = [];
  for(let ph=0; ph<3; ph++){
    const fr=[]; for(let f=0;f<8;f++){ const cv=drawDespair2(f,ph); fr.push({r:cv,l:flipH(cv)}); }
    ART.boss.despair.push(fr);
  }
  // 아이콘 · 오브젝트
  for(const k in ICON) ART.icons[k]=ICON[k]();
  ART.obj.cross=OBJ.cross(); ART.obj.sepulchre=OBJ.sepulchre(); ART.obj.wicketGate=OBJ.wicketGate();
  ART.obj.chest=OBJ.chest(false); ART.obj.chestOpen=OBJ.chest(true);
  ART.obj.sign=OBJ.sign(); ART.obj.arbor=OBJ.arbor(); ART.obj.riverGate=OBJ.riverGate();
  ART.obj.sinai=drawSinai();
  ART.obj.lion=[]; for(let f=0;f<4;f++) ART.obj.lion.push(OBJ.lion(f));
}
function getTiles(theme){ if(!ART.tiles[theme]) ART.tiles[theme]=makeTileset(theme); return ART.tiles[theme]; }
function getBack(theme, kind){
  const key=theme+'|'+(kind||'');
  if(!ART.backs[key]) ART.backs[key]=makeBackdrop(theme,kind);
  return ART.backs[key];
}

<script>
/* ===== js/12_chars.js ===== */
/* ============================================================
   12_chars.js — 캐릭터 개성 시스템 (10_art.js 의 휴머노이드를 교체)
   · 체형 build · 자세 posture · 눈매 eyeType · 소품 prop · 오라 aura
   · 선(善)은 밝고 곧고 빛나게, 악(惡)은 어둡고 뒤틀리고 뾰족하게.
   ============================================================ */
'use strict';

const SPRW = 34, SPRH = 36;      // 발끝 = row 35

/* 체형: [머리폭, 몸통폭, 몸통높이, 다리폭, 어깨돌출, 키보정] */
const BUILDS = {
  child: [8,  8, 7, 3, 0, 4],
  slim:  [9,  8, 9, 3, 0, 1],
  norm:  [10,10, 9, 4, 1, 0],
  stout: [11,14,10, 5, 2, 0],
  huge:  [13,18,13, 6, 3,-4]
};

/* 포즈 (오프셋) */
const POSE2 = {
  idle:   {bob:0, armA:[0,0], armB:[0,0], leg:[0,0,0,0]},
  idle2:  {bob:1, armA:[0,1], armB:[0,1], leg:[0,0,0,0]},
  walk0:  {bob:0, lean:1, armA:[-2,0], armB:[2,0], leg:[2,0,-2,0]},
  walk1:  {bob:-1,armA:[0,0],  armB:[0,0], leg:[0,-1,0,-1]},
  walk2:  {bob:0, lean:1, armA:[2,0],  armB:[-2,0],leg:[-2,0,2,0]},
  walk3:  {bob:-1,armA:[0,0],  armB:[0,0], leg:[0,-1,0,-1]},
  jump:   {bob:-2,armA:[-1,-5],armB:[1,-6],leg:[2,-3,-3,1]},
  fall:   {bob:1, armA:[-2,-3],armB:[2,-4],leg:[-2,1,2,-1]},
  atk0:   {bob:0, lean:-2,armA:[-2,1], armB:[-4,-5],leg:[-1,0,1,0], wpn:[-6,-8,-50]},
  atk1:   {bob:1, lean:2, armA:[-1,1], armB:[8,-2], leg:[3,0,-1,0], wpn:[11,-2,12]},
  atk2:   {bob:2, lean:1, armA:[0,2],  armB:[6,5],  leg:[4,0,-2,0], wpn:[9,7,72]},
  hurt:   {bob:1, lean:-3,armA:[-3,-3],armB:[3,-4], leg:[-2,0,2,0]},
  dead:   {bob:2, armA:[-6,-2], armB:[6,-2],  leg:[-3,0,3,0]},
  pray:   {bob:2, armA:[3,-3], armB:[-3,-3],leg:[0,0,0,0]},
  push:   {bob:1, lean:2, armA:[5,-1], armB:[6,-1], leg:[2,0,-2,0]},
  sit:    {bob:7, armA:[-3,3], armB:[3,3],  leg:[5,5,-1,6]},
  climb0: {bob:0, armA:[0,-8], armB:[0,-2], leg:[1,-2,-1,1]},
  climb1: {bob:0, armA:[0,-2], armB:[0,-8], leg:[-1,1,1,-2]},
  cheer:  {bob:-1,armA:[-2,-10],armB:[2,-10],leg:[0,0,0,0]},
  point:  {bob:0, armA:[-1,0], armB:[9,-6], leg:[0,0,0,0]},
  cross_: {bob:0, armA:[4,-1], armB:[-4,-1],leg:[0,0,0,0]},   // 팔짱 (고집)
  reach:  {bob:0, armA:[2,-2], armB:[10,-3],leg:[1,0,-1,0]},  // 손 내밀기 (도움)
  cower:  {bob:3, lean:-2,armA:[2,-4], armB:[-2,-5],leg:[-1,1,1,1]} // 움츠림 (소심)
};

/* ---------------- 새 휴머노이드 렌더러 ---------------- */
function drawPerson(o){
  const c = makeCanvas(SPRW, SPRH), x = ctxOf(c);
  const P = POSE2[o.pose] || POSE2.idle;
  const B = BUILDS[o.build || 'norm'];
  const [HW, BW, BH, LW, SH, TALL] = B;
  const CX = 17;
  const skin = o.skin || '#e8b088', skinS = shade(skin,-38), skinL = shade(skin,20);
  const hair = o.hair || '#5a3a22', hairS = shade(hair,-30), hairL = shade(hair,26);
  const robe = o.robe || '#5b7bb5', robeS = shade(robe,-34), robeL = shade(robe,24);
  const acc  = o.acc  || shade(robe,-52);
  const boot = o.boot || '#4a3524', bootS = shade(boot,-26);
  const belt = o.belt || '#3c2a18';
  const bob  = (P.bob|0) + TALL;
  let lean = (P.lean|0);
  const post = o.posture||'up';
  if(post==='hunch') lean -= 1;
  if(post==='lean')  lean += 2;
  const headTilt = (P.headDrop||0) + (post==='hunch'? 2 : (post==='puff'? -1 : 0));
  const r=(a,b,w,h,col)=>{ x.fillStyle=col; x.fillRect(Math.round(a),Math.round(b),w,h); };

  const BODY_Y = 16+bob;               // 몸통 상단
  const HEAD_Y = BODY_Y - HW + 1 + headTilt;
  const LEG_Y  = BODY_Y + BH;
  const FOOT   = 35;

  /* ── 오라 (뒤) ── */
  if(o.aura==='holy'){
    x.globalCompositeOperation='lighter';
    const g=x.createRadialGradient(CX, BODY_Y, 3, CX, BODY_Y, 20);
    g.addColorStop(0,'rgba(255,240,180,0.35)'); g.addColorStop(1,'rgba(255,230,150,0)');
    x.fillStyle=g; x.fillRect(0,0,SPRW,SPRH);
    x.globalCompositeOperation='source-over';
  } else if(o.aura==='dark'){
    x.globalAlpha=0.55;
    for(let i=0;i<7;i++){ r(CX-13+i*4, BODY_Y-6+((i*5)%12), 3, 3, '#1a0e1e'); }
    x.globalAlpha=1;
  } else if(o.aura==='greed'){
    x.globalAlpha=0.5;
    for(let i=0;i<4;i++) r(CX-11+i*7, HEAD_Y-6+((i*3)%5), 2, 2, '#e8c84a');
    x.globalAlpha=1;
  }
  /* ── 날개 (빛나는 이) ── */
  if(o.wings){
    const wc = o.wings, ws=shade(wc,-18);
    r(CX-BW/2-9, BODY_Y-3, 8, 4, wc);
    r(CX-BW/2-11, BODY_Y+1, 10, 3, ws);
    r(CX-BW/2-8, BODY_Y+4, 7, 3, wc);
    r(CX+BW/2+1, BODY_Y-3, 8, 4, wc);
    r(CX+BW/2+1, BODY_Y+1, 10, 3, ws);
    r(CX+BW/2+1, BODY_Y+4, 7, 3, wc);
  }
  /* ── 망토 ── */
  if(o.cape){
    const cs=shade(o.cape,-30);
    r(CX-BW/2-1+lean, BODY_Y-1, BW+2, BH+6, o.cape);
    r(CX-BW/2-2+lean, BODY_Y+2, 1, BH+2, cs);
    r(CX+BW/2+1+lean, BODY_Y+2, 1, BH+2, cs);
  }
  /* ── 짐 ── */
  if(o.burden){
    const bc='#63421f', bs=shade(bc,-26), bl=shade(bc,22);
    const bx = CX-BW/2-11+lean, by = BODY_Y-7+(o.burdenBob||0);
    r(bx, by, 14, 18, bc);
    r(bx, by, 14, 2, bl);
    r(bx, by+16, 14, 2, bs);
    r(bx-1, by+3, 1, 12, bs);
    r(bx, by+7, 14, 1, '#33230f');      // 묶은 끈
    r(bx+5, by-3, 3, 4, '#33230f');     // 매듭
    r(bx+2, by+11, 5, 3, shade(bc,-14));
    r(CX-BW/2+1+lean, BODY_Y, 2, 10, '#4a3220');   // 어깨끈
  }
  /* ── 뒤팔 ── */
  const aA=P.armA||[0,0];
  const armW = o.build==='huge'? 4 : 3;
  r(CX-BW/2-armW+lean+aA[0], BODY_Y+1+aA[1], armW, BH-1, shade(robe,-50));
  r(CX-BW/2-1+lean+aA[0], BODY_Y+1+aA[1], 1, BH-1, shade(robe,-64));   // 몸통과의 경계
  r(CX-BW/2-armW+lean+aA[0], BODY_Y+BH-1+aA[1], armW, 2, skinS);
  /* ── 방패 (뒤팔에 든다 — 몸을 가리지 않게 뒤에 그린다) ── */
  if(o.shield){
    const sc=o.shield, ss=shade(sc,-36), sl=shade(sc,30);
    const sx=CX-BW/2-armW-4+lean+aA[0], sy=BODY_Y-1+aA[1];
    r(sx+1, sy, 8, 2, sl);
    r(sx, sy+2, 10, 9, sc);
    r(sx, sy+2, 10, 1, sl);
    r(sx+1, sy+11, 8, 2, ss);
    r(sx+3, sy+12, 4, 2, ss);
    // 십자 문양
    r(sx+4, sy+3, 2, 8, '#f0d060');
    r(sx+2, sy+5, 6, 2, '#f0d060');
  }

  /* ── 다리 ── */
  const lg=P.leg||[0,0,0,0];
  const legH = FOOT-LEG_Y-2;
  r(CX-LW-1+lg[2], LEG_Y+lg[3], LW, legH, acc);
  r(CX-LW-1+lg[2], FOOT-2+lg[3], LW+1, 3, bootS);
  r(CX+1+lg[0], LEG_Y+lg[1], LW, legH, shade(acc,14));
  r(CX+1+lg[0], FOOT-2+lg[1], LW+1, 3, boot);
  /* ── 몸통 ── */
  r(CX-BW/2+lean, BODY_Y, BW, BH, robe);
  r(CX-BW/2+lean, BODY_Y, BW, 2, robeL);
  r(CX+BW/2-2+lean, BODY_Y+2, 2, BH-2, robeS);
  if(SH){ r(CX-BW/2-SH+lean, BODY_Y, SH, 3, robeS); r(CX+BW/2+lean, BODY_Y, SH, 3, robeS); }
  r(CX-BW/2+lean, BODY_Y+BH-3, BW, 2, belt);
  if(o.armor){
    const am=o.armor, as=shade(am,-34), al=shade(am,30);
    r(CX-BW/2+1+lean, BODY_Y+1, BW-2, BH-4, am);
    r(CX-BW/2+1+lean, BODY_Y+1, BW-2, 1, al);
    r(CX-BW/2+1+lean, BODY_Y+BH-4, BW-2, 1, as);
    r(CX-1+lean, BODY_Y+2, 2, BH-6, al);
  }
  if(o.sash){ r(CX-BW/2+lean, BODY_Y+2, BW, 2, o.sash); }
  if(o.apron){ r(CX-BW/2+1+lean, BODY_Y+3, BW-2, BH-3, o.apron); }
  /* ── 머리 ── */
  const HX = CX-HW/2+lean;
  r(HX, HEAD_Y, HW, HW, skin);
  r(HX+HW-2, HEAD_Y+1, 2, HW-1, skinS);
  r(HX, HEAD_Y+HW-1, HW, 1, skinS);
  if(o.cheeks){ r(HX+1, HEAD_Y+HW-4, 2, 2, o.cheeks); r(HX+HW-3, HEAD_Y+HW-4, 2, 2, o.cheeks); }
  // 눈
  const ey = HEAD_Y + Math.floor(HW*0.45);
  const e1 = HX+2, e2 = HX+HW-4;
  const et = o.eyeType||'norm';
  const ecol = o.eyeColor||'#2b1a10';
  if(et==='closed'){ r(e1,ey+1,2,1,'#2b1a10'); r(e2,ey+1,2,1,'#2b1a10'); }
  else if(et==='narrow'){ r(e1,ey,2,1,'#ffffff'); r(e2,ey,2,1,'#ffffff'); r(e1,ey,1,1,ecol); r(e2,ey+0,1,1,ecol); r(e1-1,ey-1,3,1,hairS); r(e2,ey-1,3,1,hairS); }
  else if(et==='glow'){
    x.globalCompositeOperation='lighter';
    r(e1-1,ey-1,4,3,ecol); r(e2-1,ey-1,4,3,ecol);
    x.globalCompositeOperation='source-over';
    r(e1,ey,2,2,shade(ecol,60)); r(e2,ey,2,2,shade(ecol,60));
  }
  else if(et==='dot'){ r(e1,ey,1,2,ecol); r(e2+1,ey,1,2,ecol); }
  else if(et==='wide'){ r(e1-1,ey-1,4,4,'#ffffff'); r(e2-1,ey-1,4,4,'#ffffff'); r(e1,ey,2,3,ecol); r(e2,ey,2,3,ecol); }
  else { r(e1,ey,2,2,'#ffffff'); r(e2,ey,2,2,'#ffffff'); r(e1,ey,1,2,ecol); r(e2,ey,1,2,ecol); }
  if(o.brow==='angry'){ r(e1-1,ey-2,3,1,hairS); r(e2,ey-2,3,1,hairS); r(e1,ey-3,2,1,hairS); }
  if(o.brow==='sad'){ r(e1-1,ey-3,3,1,hairS); r(e2,ey-2,3,1,hairS); }
  if(o.brow==='raise'){ r(e1-1,ey-3,3,1,hairS); r(e2,ey-3,3,1,hairS); }
  // 입
  const my = HEAD_Y+HW-3;
  if(o.mouth==='grin'){ r(HX+2,my,HW-4,1,shade(skin,-58)); r(HX+2,my-1,1,1,shade(skin,-58)); r(HX+HW-3,my-1,1,1,shade(skin,-58)); }
  else if(o.mouth==='teeth'){ r(HX+2,my-1,HW-4,3,'#3a1a12'); for(let i=0;i<3;i++) r(HX+3+i*2,my-1,1,3,'#f0e8d0'); }
  else if(o.mouth==='frown'){ r(HX+2,my+1,HW-4,1,shade(skin,-58)); r(HX+2,my,1,1,shade(skin,-58)); r(HX+HW-3,my,1,1,shade(skin,-58)); }
  else if(o.mouth==='open'){ r(HX+3,my-1,HW-6,3,'#5a2a24'); }
  else if(o.mouth!==false){ r(CX-1+lean,my,2,1,shade(skin,-58)); }
  // 수염
  if(o.beard){
    r(HX, my-2, HW, 4, o.beard);
    r(HX, my-2, HW, 1, shade(o.beard,20));
    r(HX+2, my+2, HW-4, 4, o.beard);
    if(o.mouth!==false) r(CX-1+lean, my, 2, 1, '#40200f');
  }
  if(o.mustache){ r(HX+1, my-1, HW-2, 2, o.mustache); }
  // 머리카락
  const hs=o.hairStyle||'short';
  if(hs!=='bald'){
    r(HX-1, HEAD_Y-3, HW+2, 4, hair);
    r(HX-1, HEAD_Y-3, HW+2, 1, hairL);
    r(HX-1, HEAD_Y+1, 2, 4, hair);
    r(HX+HW-1, HEAD_Y+1, 2, 4, hairS);
    if(hs==='long'){ r(HX-2, HEAD_Y+1, 2, HW+3, hair); r(HX+HW, HEAD_Y+1, 2, HW+3, hairS); }
    if(hs==='wild'){ for(let i=0;i<5;i++) r(HX-2+i*3, HEAD_Y-5-((i%2)*2), 2, 4, hair); }
    if(hs==='spiky'){ r(HX+1, HEAD_Y-6, 2, 4, hair); r(HX+HW-4, HEAD_Y-6, 2, 4, hair); r(HX+HW/2-1, HEAD_Y-7, 2, 5, hair); }
    if(hs==='bun'){ r(HX+HW/2-2, HEAD_Y-7, 5, 4, hair); }
    if(hs==='fringe'){ r(HX, HEAD_Y+1, 4, 2, hair); }
    if(hs==='bald2'){ }
  }
  // 모자
  if(o.hat==='top'){ const h=o.hatColor||'#2a2030', hsd=shade(h,-30);
    r(HX-3, HEAD_Y-3, HW+6, 2, h); r(HX+1, HEAD_Y-11, HW-2, 9, h);
    r(HX+1, HEAD_Y-11, HW-2, 1, shade(h,26)); r(HX+1, HEAD_Y-5, HW-2, 2, o.hatBand||'#7a2a3a'); r(HX-3, HEAD_Y-2, HW+6, 1, hsd); }
  else if(o.hat==='wide'){ const h=o.hatColor||'#6a5230';
    r(HX-5, HEAD_Y-3, HW+10, 3, h); r(HX+1, HEAD_Y-8, HW-2, 6, h);
    r(HX+1, HEAD_Y-8, HW-2, 1, shade(h,24)); }
  else if(o.hat==='cap'){ const h=o.hatColor||'#8a3a3a';
    r(HX-1, HEAD_Y-4, HW+2, 4, h); r(HX+HW-1, HEAD_Y-2, 5, 2, shade(h,-20)); }
  else if(o.hat==='hood'){ const h=o.hatColor||'#3a3244', hsd=shade(h,-30);
    r(HX-2, HEAD_Y-5, HW+4, 6, h); r(HX-2, HEAD_Y-5, HW+4, 1, shade(h,22));
    r(HX-2, HEAD_Y+1, 2, HW-1, h); r(HX+HW, HEAD_Y+1, 2, HW-1, hsd);
    r(HX, HEAD_Y+1, HW, 1, hsd);
    if(o.hoodShadow){ x.globalAlpha=0.62; r(HX, HEAD_Y+1, HW, HW-2, '#0d0812'); x.globalAlpha=1;
      if(et==='glow'){ x.globalCompositeOperation='lighter'; r(e1-1,ey-1,4,3,ecol); r(e2-1,ey-1,4,3,ecol); x.globalCompositeOperation='source-over'; } } }
  else if(o.hat==='wig'){ const h='#e8e4dc';
    r(HX-3, HEAD_Y-4, HW+6, 5, h); r(HX-4, HEAD_Y-1, 3, HW+4, h); r(HX+HW+1, HEAD_Y-1, 3, HW+4, shade(h,-14));
    r(HX-4, HEAD_Y+HW+2, 3, 3, h); r(HX+HW+1, HEAD_Y+HW+2, 3, 3, shade(h,-14)); }
  else if(o.hat==='crown'){
    r(HX, HEAD_Y-6, HW, 3, '#ffd75e');
    r(HX, HEAD_Y-8, 2, 2, '#ffd75e'); r(HX+HW/2-1, HEAD_Y-9, 2, 3, '#ffd75e'); r(HX+HW-2, HEAD_Y-8, 2, 2, '#ffd75e'); }
  else if(o.hat==='horns'){
    const h=o.hatColor||'#3a2a30';
    r(HX-2, HEAD_Y-6, 3, 5, h); r(HX+HW-1, HEAD_Y-6, 3, 5, h);
    r(HX-3, HEAD_Y-9, 3, 4, h); r(HX+HW, HEAD_Y-9, 3, 4, h); }
  /* ── 앞팔 ── */
  const aB=P.armB||[0,0];
  const fx = CX+BW/2+lean+aB[0], fy = BODY_Y+1+aB[1];
  r(fx-1, fy, 1, BH-1, shade(robe,-58));                                // 몸통과의 경계
  r(fx, fy, armW, BH-1, robe);
  r(fx, fy, armW, 1, robeL);
  r(fx, fy+BH-1, armW, 2, skin);
  if(o.bracer){ r(fx, fy+BH-3, armW, 2, o.bracer); }
  /* ── 소품 · 무기 ── */
  const prop = o.weapon || o.prop;
  if(prop){
    const W = P.wpn || [9,-2,0];
    x.save();
    x.translate(fx+armW/2, fy+BH);
    x.rotate((W[2]||0)*Math.PI/180);
    const f=(a,b,w,h,col)=>{ x.fillStyle=col; x.fillRect(a,b,w,h); };
    switch(prop){
      case 'sword': { const bl=o.bladeColor||'#e6eef8';
        f(-1,-1,3,6,'#6b4a2c'); f(-4,-3,9,2,'#c9a227');
        f(-1,-16,3,13,bl); f(-1,-16,1,13,shade(bl,34)); f(0,-17,1,2,'#fff'); break; }
      case 'staff': f(-1,-18,2,22,'#7a5a34'); f(-3,-22,6,5,'#ffe08a'); f(-2,-21,4,3,'#fffbe0'); break;
      case 'lamp':  f(-1,-14,2,16,'#5a4a34'); f(-4,-19,8,6,'#c9a227'); f(-3,-18,6,4,'#fff2a0'); f(-2,-17,4,2,'#ffffff'); break;
      case 'book':  f(-5,-4,10,8,'#7a2a2a'); f(-4,-3,8,6,'#f2e6c8'); f(0,-3,1,6,'#7a2a2a'); break;
      case 'scroll':f(-4,-3,9,5,'#f2e6c8'); f(-5,-4,2,7,'#c9a227'); f(4,-4,2,7,'#c9a227'); break;
      case 'crook': f(-1,-20,2,24,'#8a6a40'); f(-1,-23,6,2,'#8a6a40'); f(4,-23,2,4,'#8a6a40'); break;
      case 'gavel': f(-1,-8,2,10,'#5a3a22'); f(-5,-12,10,5,'#3a2418'); f(-5,-12,10,1,'#6a4a30'); break;
      case 'coin':  f(-3,-3,6,6,'#c9a227'); f(-2,-2,4,4,'#ffe9a0'); f(-1,-1,2,2,'#c9a227'); break;
      case 'rope':  f(-1,-3,3,4,'#a07f42'); f(-4,0,8,2,'#c8a860'); f(-5,2,10,2,'#a07f42'); f(-3,4,6,2,'#c8a860'); break;
      case 'keys':  f(-1,-5,2,7,'#c9a227'); f(-3,-7,6,3,'#ffd75e'); f(-4,1,3,3,'#c9a227'); f(1,1,3,3,'#e8c34a'); break;
      case 'torch': f(-1,-13,2,15,'#5a3a22'); f(-3,-18,6,6,'#ff8c2a'); f(-2,-17,4,4,'#ffe066'); break;
      case 'spear': f(-1,-18,2,24,'#6b4a2c'); f(-2,-23,4,6,'#cfd8e3'); break;
      case 'club':  f(-2,-6,5,10,'#4a3a26'); f(-5,-14,10,9,'#3a2c1c'); f(-5,-14,10,2,'#5a4630');
                    for(let i=0;i<3;i++) f(-6+i*4,-16,3,3,'#8a8070'); break;
      case 'basket':f(-4,-2,9,6,'#8f6c2f'); f(-4,-2,9,1,'#c89c50'); f(-3,-5,7,3,'#e8a0a0'); f(-4,-6,2,5,'#8f6c2f'); f(3,-6,2,5,'#8f6c2f'); break;
      case 'fan':   f(-1,-2,2,5,'#7a5a34'); f(-5,-8,11,6,'#e8b8d0'); f(-5,-8,11,1,'#f8d8e8'); f(-1,-8,1,6,'#c88ab0'); break;
      case 'purse': f(-3,-2,7,6,'#6b4d22'); f(-3,-3,7,2,'#4e3514'); f(-1,0,2,3,'#ffd75e'); break;
      case 'mirror':f(-1,-1,2,5,'#c9a227'); f(-3,-8,7,7,'#c9a227'); f(-2,-7,5,5,'#cfe8ff'); f(-2,-7,2,2,'#ffffff'); break;
    }
    x.restore();
  }
  /* ── 후광 ── */
  if(o.halo){
    x.globalCompositeOperation='lighter';
    x.fillStyle=o.halo;
    const hy2 = HEAD_Y - (o.hat? 12:6);
    x.fillRect(HX-1, hy2, HW+2, 1);
    x.fillRect(HX-2, hy2+1, 1, 1); x.fillRect(HX+HW+1, hy2+1, 1, 1);
    x.globalCompositeOperation='source-over';
  }
  return c;
}

/* 1px 어두운 외곽선 — 어떤 배경 위에서도 인물이 또렷하게 보인다 */
function addOutline(src, color){
  const c = makeCanvas(src.width+2, src.height+2), x = ctxOf(c);
  const sil = tintCanvas(src, color||'#141018', 1);
  [[0,1],[2,1],[1,0],[1,2]].forEach(([dx,dy])=> x.drawImage(sil, dx, dy));
  x.drawImage(src, 1, 1);
  return c;
}

/* 스프라이트를 눕힌다 — 쓰러진 자세 */
function layDown(src){
  const c = makeCanvas(src.height, src.width), x = ctxOf(c);
  x.translate(0, src.width);
  x.rotate(-Math.PI/2);
  x.drawImage(src, 0, 0);
  // 바닥에 닿도록 아래쪽으로 정렬
  const out = makeCanvas(src.height, src.width+2), ox = ctxOf(out);
  ox.drawImage(c, 0, 2);
  return out;
}

/* 애니메이션 세트 */
function buildPersonSet(base, extra){
  const o = Object.assign({}, base, extra||{});
  const set = {};
  for(const p in POSE2){
    let cv = addOutline(drawPerson(Object.assign({}, o, {pose:p})), o.outline);
    if(p==='dead') cv = layDown(cv);      // 쓰러진 모습은 스프라이트를 눕혀서
    set[p] = {r:cv, l:flipH(cv)};
  }
  set.walk  = [set.walk0, set.walk1, set.walk2, set.walk3];
  set.idleA = [set.idle, set.idle, set.idle2, set.idle2];
  set.atk   = [set.atk0, set.atk1, set.atk2];
  set.climb = [set.climb0, set.climb1];
  set.align = o.align || 'neutral';
  return set;
}

<script>

   14_bosses.js — 보스 아트 재설계

'use strict';

/* ───────── 아볼루온 — 파괴자 ─────────
   비늘 · 곰의 발 · 물고기 지느러미 날개 · 사자의 입 · 배에서 나오는 불과 연기
   페이즈가 올라갈수록 몸이 달아오르고 균열에서 불이 샌다. */
function drawApollyon2(frame, phase){
  const W=112, H=104;
  const c = makeCanvas(W,H), x = ctxOf(c);
  const r=(a,b,w,h,col)=>{ x.fillStyle=col; x.fillRect(a,b,w,h); };
  const poly=(pts,col)=>{ x.fillStyle=col; x.beginPath(); x.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i++) x.lineTo(pts[i][0],pts[i][1]); x.closePath(); x.fill(); };

  const P = [
    {body:'#2a2330', bodyL:'#3e3546', bodyS:'#150f1c', vein:'#7a1c20', eye:'#ffb02a', glow:'#c8401a', wing:'#312a3e', wingL:'#4d4260'},
    {body:'#33202a', bodyL:'#4d2c38', bodyS:'#190b12', vein:'#b02418', eye:'#ffd23a', glow:'#e8541a', wing:'#3d2634', wingL:'#5e3d50'},
    {body:'#40161a', bodyL:'#632022', bodyS:'#1f0809', vein:'#ff5a1a', eye:'#fff05a', glow:'#ff7a20', wing:'#5a1c24', wingL:'#8a2c32'}
  ][phase];
  const CX = 56;
  const wingF = frame%4;
  const spread = [0,-5,-10,-5][wingF];
  const hb = frame%2;

  /* ── 날개 (뒤) — 찢어진 박쥐 막 ── */
  const wing=(dir)=>{
    const s=dir, ax=CX+s*16, ay=44;
    poly([[ax,ay],[ax+s*22,20+spread],[ax+s*40,10+spread],[ax+s*44,30+spread],
          [ax+s*34,28+spread],[ax+s*40,48+spread],[ax+s*28,42+spread],
          [ax+s*32,62+spread],[ax+s*18,52+spread],[ax+s*16,64]], P.wing);
    // 뼈대
    x.strokeStyle=P.wingL; x.lineWidth=2;
    for(let i=0;i<4;i++){
      const ex=ax+s*(20+i*8), ey=(16+i*12)+spread;
      x.beginPath(); x.moveTo(ax,ay); x.lineTo(ex,ey); x.stroke();
    }
    x.beginPath(); x.moveTo(ax,ay); x.lineTo(ax+s*40,10+spread); x.stroke();
    // 발톱
    r(ax+s*40-2, 6+spread, 4, 6, '#d8cbb0');
  };
  wing(-1); wing(1);

  /* ── 꼬리 ── */
  poly([[CX+10,84],[CX-14,98],[CX-34,94],[CX-12,92],[CX+8,78]], P.bodyS);
  poly([[CX-34,94],[CX-42,99],[CX-32,88]], P.vein);

  /* ── 다리 · 곰의 발 ── */
  const paw=(px_)=>{
    r(px_, 72, 16, 16, P.body);
    r(px_, 72, 16, 2, P.bodyL);
    r(px_-3, 86, 22, 7, P.bodyS);
    for(let i=0;i<4;i++) poly([[px_-3+i*5, 93],[px_-4+i*5, 100],[px_+1+i*5, 93]], '#e8e0d0');
  };
  paw(CX-30); paw(CX+14);

  /* ── 몸통 ── */
  r(CX-20, 40, 40, 36, P.body);
  r(CX-20, 40, 40, 3, P.bodyL);
  // 배 — 화로
  r(CX-14, 48, 28, 24, P.bodyS);
  x.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){
    const gy=51+i*5, gw=20-Math.abs(i-1.5)*5;
    x.fillStyle= i%2? P.glow : P.vein;
    x.fillRect(CX-gw/2, gy, gw, 3);
  }
  const heat=0.28+Math.sin(frame*0.8)*0.13;
  const gg=x.createRadialGradient(CX,60,2,CX,60,26);
  gg.addColorStop(0,`rgba(255,140,40,${heat})`); gg.addColorStop(1,'rgba(255,90,20,0)');
  x.fillStyle=gg; x.fillRect(CX-30,36,60,48);
  x.globalCompositeOperation='source-over';

  /* ── 팔 · 발톱 ── */
  const armSwing = (frame%8<4)? 0 : 3;
  const arm=(dir)=>{
    const s=dir, ax=CX+s*20;
    poly([[ax,44],[ax+s*12,50+armSwing],[ax+s*14,64+armSwing],[ax+s*6,62],[ax,56]], P.bodyL);
    r(ax+s*8-3, 62+armSwing, 8, 8, P.body);
    for(let i=0;i<3;i++) poly([[ax+s*6+i*s*3, 70+armSwing],[ax+s*5+i*s*3, 78+armSwing],[ax+s*9+i*s*3, 70+armSwing]], '#e8e0d0');
  };
  arm(-1); arm(1);

  /* ── 어깨 · 등 가시 ── */
  poly([[CX-20,40],[CX-32,22],[CX-12,34]], P.bodyL);
  poly([[CX+20,40],[CX+32,22],[CX+12,34]], P.bodyL);
  poly([[CX-24,38],[CX-34,18],[CX-18,32]], P.bodyS);
  poly([[CX+24,38],[CX+34,18],[CX+18,32]], P.bodyS);
  for(let i=0;i<5;i++) poly([[CX-10+i*5,40],[CX-12+i*5,28-i],[CX-6+i*5,40]], P.bodyL);

  /* ── 머리 ── */
  const hy = 8+hb;
  // 갈기 가시
  for(let i=0;i<9;i++){
    const a=(i/8)*Math.PI - Math.PI/2;
    poly([[CX+Math.cos(a)*18, hy+15+Math.sin(a)*16],
          [CX+Math.cos(a)*32, hy+15+Math.sin(a)*30],
          [CX+Math.cos(a-0.24)*18, hy+15+Math.sin(a-0.24)*16]], P.bodyS);
  }
  r(CX-16, hy, 32, 28, P.body);
  r(CX-16, hy, 32, 3, P.bodyL);
  r(CX-16, hy+24, 32, 4, P.bodyS);
  r(CX-11, hy+17, 22, 13, P.bodyS);          // 주둥이
  r(CX-11, hy+17, 22, 1, P.body);
  // 뿔
  poly([[CX-16,hy+5],[CX-32,hy-22],[CX-9,hy+2]], '#cfc2a6');
  poly([[CX+16,hy+5],[CX+32,hy-22],[CX+9,hy+2]], '#cfc2a6');
  poly([[CX-16,hy+5],[CX-26,hy-14],[CX-12,hy+2]], '#9a8f78');
  poly([[CX+16,hy+5],[CX+26,hy-14],[CX+12,hy+2]], '#9a8f78');
  // 눈
  x.globalCompositeOperation='lighter';
  [[CX-9,hy+12],[CX+9,hy+12]].forEach(([ex,ey])=>{
    const eg=x.createRadialGradient(ex,ey,1,ex,ey,11);
    eg.addColorStop(0,P.eye); eg.addColorStop(1,'rgba(255,120,0,0)');
    x.fillStyle=eg; x.fillRect(ex-12,ey-10,24,20);
  });
  x.globalCompositeOperation='source-over';
  poly([[CX-16,hy+8],[CX-3,hy+8],[CX-3,hy+15]], P.eye);
  poly([[CX+16,hy+8],[CX+3,hy+8],[CX+3,hy+15]], P.eye);
  r(CX-10,hy+9,3,5,'#3a0000'); r(CX+7,hy+9,3,5,'#3a0000');
  poly([[CX-17,hy+6],[CX-1,hy+2],[CX-1,hy+8]], P.bodyS);
  poly([[CX+17,hy+6],[CX+1,hy+2],[CX+1,hy+8]], P.bodyS);
  // 입
  const gape=(frame%8<4)? 9:3;
  r(CX-11, hy+24, 22, gape, '#1a0404');
  x.globalCompositeOperation='lighter';
  x.fillStyle=`rgba(255,90,20,${0.28+gape*0.03})`; x.fillRect(CX-11,hy+24,22,gape);

  for(let i=0;i<5;i++){
    poly([[CX-10+i*4,hy+24],[CX-8+i*4,hy+30],[CX-6+i*4,hy+24]], '#f4ecd8');
    poly([[CX-9+i*4,hy+24+gape],[CX-7+i*4,hy+18+gape],[CX-5+i*4,hy+24+gape]], '#f4ecd8');
  }

/* ───────── 절망 거인 — 의심의 성 주인 ─────────
   거대하고 구부정하다. 쇠사슬을 끌고 다니고, 눈은 움푹 꺼져 빛난다. */
function drawDespair2(frame, phase){

  x.globalAlpha=0.35;

  /* 곤봉 — 크고 확실하게 */
  x.save(); x.translate(64, 40+bob); x.rotate((swing?-78:26)*Math.PI/180);

  r(52, 32+bob, 16, 14, P.clothL);
  r(4, 30+bob, 14, 3, P.clothS);
