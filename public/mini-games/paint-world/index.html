      c.fillText('큰 화면 →  '+host+'/?role=stage', VW-32, 72);
    } else {
      c.fillText('주소를 받는 중…  (서버가 꺼져 있으면 혼자 쓰기)', VW-32, 50);
    }
    c.textAlign='left';

    /* 격자 */
    const cols=8, cw=142, chh=118, x0=32, y0=104, per=cols*3;
    const page=this.page % Math.max(1, Math.ceil(list.length/per));
    list.slice(page*per,(page+1)*per).forEach((b,i)=>{
      const x=x0+(i%cols)*cw, y=y0+((i/cols)|0)*chh;
      const gi=page*per+i;
      UI.btn(c,'d:'+gi, x, y, cw-10, chh-10, (g,r)=>{
        if(b.tex) g.drawImage(b.tex, -(cw-30)/2, -(chh-46)/2, cw-30, (cw-30)*TEX_H/TEX_W);
        g.font='600 14px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText(b.name||'-', 0, chh/2-22);
        /* 지우기 표시 */
        g.fillStyle=PAL.red; g.font='700 16px Galmuri11, sans-serif';
        g.fillText('✕', (cw-10)/2-14, -(chh-10)/2+4);
      });
    });
    if(!list.length){
      c.font='600 22px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.dim;
      c.fillText('아직 만들어진 그림이 없어요', VW/2, VH*0.42);
    }

    /* 버튼 */
    const S=86, y=VH-S-22;
    UI.btn(c,'export', 32, y, 220, S, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('내보내기', 0, -8);
      g.font='600 13px Galmuri11, sans-serif'; g.fillStyle=PAL.dim;
      g.fillText('오늘 그림 한 장으로', 0, 14);
    });
    UI.btn(c,'clear', 268, y, 220, S, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.red; g.fillText('전부 비우기', 0, -8);
      g.font='600 13px Galmuri11, sans-serif'; g.fillStyle=PAL.dim;
      g.fillText('되돌릴 수 없어요', 0, 14);
    });
    if(list.length>per) UI.btn(c,'pg', 504, y, 120, S, (g,r)=>{
      g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('다음 장', 0, -4); });
    UI.btn(c,'close', VW-172, y, 140, S, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('닫기', 0, -4); });

    /* 확인 — 지우기는 반드시 두 번 묻는다 */
    if(this.confirm){
      c.fillStyle='rgba(8,14,24,.9)'; c.fillRect(0,0,VW,VH);
      c.font='700 30px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
      c.fillText(this.confirm.text, VW/2, VH*0.38);
      UI.btn(c,'no', VW/2-250, VH*0.52, 220, 96, (g,r)=>{
        g.font='700 26px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('아니요', 0, -6); });
      UI.btn(c,'yes', VW/2+30, VH*0.52, 220, 96, (g,r)=>{
        g.font='700 26px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.red; g.fillText('네, 지울게요', 0, -6); });
    }
    if(this.msgT>0){
      c.globalAlpha=Math.min(1,this.msgT/25);
      c.font='700 24px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.green;
      c.fillText(this.msg, VW/2, VH-140);
      c.globalAlpha=1;
    }
  }
};

</script>
<script>
/* ===== js/85_selftest.js ===== */
/* 자체 점검 — 주소 끝에 ?selftest=1 을 붙이면 돈다.
   ⚠ 왜 있나: 2026-08-28 하루에 잡은 결함 2개가 전부 "눌러보지 않아서"였다.
      · 바다↔정글 버튼이 찾기 버튼 안에 완전히 들어가 영영 안 눌렸다
      · 종 고르기 40칸 중 22칸이 화면 밖이라 절반을 고를 수 없었다
      둘 다 화면은 멀쩡해 보였다. 눈으로는 안 잡힌다 — 좌표로 잡아야 한다.
   운영 전에 1분이면 끝난다. */
const SelfTest = {
  on:false, lines:[], t:0,

  boot(){
    if(!/[?&]selftest=1/.test(location.search)) return;
    this.on=true;
    setTimeout(()=>this.run(), 3500);      // 어셋 로딩을 기다린다
  },

  /* 한 화면을 그려 보고 버튼 배치를 검사한다 */
  probe(label, setup){
    const bad=[];
    try{ setup(); }catch(e){ return [label+' — 진입 실패: '+e.message]; }
    try{ Game.draw(); }catch(e){ return [label+' — 그리기 실패: '+e.message]; }
    const bs=UI.btns.slice();
    if(!bs.length) return [];
    const S=Screen;
    for(let i=0;i<bs.length;i++){
      const a=bs[i];
      if(a.x<-1||a.y<-1||a.x+a.w>VW+1||a.y+a.h>VH+1)
        bad.push(`${label}: '${a.id}' 가 화면 밖 (${Math.round(a.x)},${Math.round(a.y)})`);
      /* ⚠ 게임 좌표로만 보면 못 잡는다 — 화면 맞춤이 cover 였을 때
         좌표상으론 멀쩡한데 실제로는 25% 가 잘려 나갔다.
         실제 화면 픽셀로 환산해서 다시 본다. */
      const ax=S.ox+a.x*S.scale, ay=S.oy+a.y*S.scale;
      const zx=ax+a.w*S.scale,  zy=ay+a.h*S.scale;
      if(ax<-1||ay<-1||zx>S.cssW+1||zy>S.cssH+1)
        bad.push(`${label}: '${a.id}' 가 실제 화면 밖으로 잘린다`);
      if(Math.min(a.w,a.h)*S.scale < 38)
        bad.push(`${label}: '${a.id}' 가 ${Math.round(Math.min(a.w,a.h)*S.scale)}px — 아이 손가락에 작다`);
      /* 가운데를 눌렀을 때 자기가 잡히는가 — 겹침보다 이게 본질이다 */
      const hit=UI.hit({x:a.x+a.w/2, y:a.y+a.h/2});
      if(hit!==a.id) bad.push(`${label}: '${a.id}' 를 눌러도 '${hit}' 가 잡힌다`);
    }
    return bad;
  },

  async run(){
    const L=[]; const keep={state:Game.state, realm:Game.realm, page:Game.pickPage};
    const push=a=>{ for(const x of a) L.push('✗ '+x); };

    for(const realm of ['sea','jungle']){
      push(this.probe(realm+' 수족관', ()=>{ Game.realm=realm; Game.state=ST.TANK; }));
      /* 고르기는 페이지를 끝까지 넘겨 본다 — 마지막 페이지에서 깨지는 일이 많다 */
      for(let p=0;p<6;p++){
        const n=Game._pickPages||1;
        if(p>=n && p>0) break;
        push(this.probe(`${realm} 고르기 ${p+1}쪽`, ()=>{ Game.realm=realm; Game.state=ST.PICK; Game.pickPage=p; }));
      }
    }
    push(this.probe('색칠', ()=>{ Paint.open('clownfish'); Game.state=ST.PAINT; }));
    push(this.probe('도감', ()=>{ Game.state=ST.CODEX; }));

    /* 도안이 실제로 준비됐는가 — 없으면 아이가 고를 수 없다.
       ⚠ 아직 받는 중인 것을 '없다'고 세면 멀쩡한 어셋을 결함으로 보고한다.
         못 채운 게 있으면 조금 더 기다렸다 다시 센다. */
    const seaAll=SPECIES.filter(s=>!SEA_LIKE_JUNGLE[s.id]);
    const junAll=Object.keys(JUNGLE);
    let seaN=0, junN=0;
    for(let tries=0; tries<6; tries++){
      seaN=seaAll.filter(s=>Templates.get(s.id)).length;
      junN=junAll.filter(id=>JTemplate.get(id)).length;
      if(seaN===seaAll.length && junN===junAll.length) break;
      await new Promise(r=>setTimeout(r,700));
    }
    L.push(`· 도안 준비 — 바다 ${seaN}/${seaAll.length} · 정글 ${junN}/${junAll.length}`);
    if(seaN<seaAll.length)
      L.push('✗ 바다 도안 ' + seaAll.filter(s=>!Templates.get(s.id)).map(s=>s.ko).join(' ') + ' 없음');
    if(junN<junAll.length)
      L.push('✗ 정글 도안 ' + junAll.filter(id=>!JTemplate.get(id)).map(id=>JUNGLE[id].ko).join(' ') + ' 없음');

    /* 저장 용량 */
    try{
      const kb=((localStorage[Save.key]||'').length/1024);
      L.push(`· 저장 ${(Save.data.creatures||[]).length}마리 ${kb.toFixed(0)}KB`);
      if(kb>4000) L.push('✗ 저장 용량이 4MB 를 넘었다 — 오래된 것부터 지워질 수 있다');
    }catch(e){}

    /* 서버 */
    try{
      const r=await fetch('api/health'); const j=await r.json();
      L.push(`· 서버 정상 (${j.n}마리 보관)`);
    }catch(e){ L.push('· 서버 없음 — 혼자 쓰는 모드'); }

    Game.state=keep.state; Game.realm=keep.realm; Game.pickPage=keep.page;
    const fails=L.filter(x=>x[0]==='✗').length;
    L.unshift(fails ? `✗ 문제 ${fails}건` : '✓ 이상 없음');
    this.lines=L; this.t=0;
    console.log('[자체 점검]\n'+L.join('\n'));
  },

  draw(c){
    if(!this.on || !this.lines.length) return;
    /* 결과를 읽었으면 아무 데나 눌러 닫는다 — 안 그러면 화면을 계속 가린다 */
    if(this.t>30 && Input.tapped){ this.lines=[]; Input.tapped=null; return; }
    this.t++;
    const H=Math.min(VH-40, 44+this.lines.length*26);
    c.save();
    c.fillStyle='rgba(8,20,34,.92)';
    UI.round(c, 20, 20, VW-40, H, 16); c.fill();
    c.strokeStyle=this.lines[0][0]==='✓' ? '#7ddf7d' : '#ff8a8a';
    c.lineWidth=3; c.stroke();
    c.textAlign='left';
    this.lines.forEach((s,i)=>{
      c.font=(i===0?'700 24px':'600 19px')+' Galmuri11, sans-serif';
      c.fillStyle = s[0]==='✗' ? '#ff9a9a' : (s[0]==='✓' ? '#9de89d' : 'rgba(255,255,255,.82)');
      c.fillText(s, 40, 54+i*26);
    });
    c.restore();
  },
};

</script>
<script>
/* ===== js/99_main.js ===== */
'use strict';
let _last=0;
function frameStep(now){
  let dt=(now-_last)/1000; if(!(dt>0)) dt=0.016; dt=Math.min(0.05,dt); _last=now;
  Game.update(dt); Game.draw();
}
function loop(now){ frameStep(now); requestAnimationFrame(loop); }
addEventListener('DOMContentLoaded',()=>{
  Screen.init(); Input.init(); Save.load();
  if(typeof Net!=='undefined') Net.init();
  Sfx.on = Save.data.sound!==false;
  Game.init(); Icons.prefetch(); BG.prefetch(); Props.prefetch(); FX.prefetch(); JWorld.prefetch(); JTemplate.prefetch();
  const gate=document.getElementById('gate');
  document.getElementById('go').onclick=()=>{
    Sfx.unlock();
    /* ⚠ 앰비언스는 사용자 제스처 뒤에만 시작할 수 있다(브라우저 정책) */
    if(typeof Amb!=='undefined'){ Amb.init(Sfx); Amb.set(Game.realm); }
    gate.remove();
  };
  if(typeof SelfTest!=='undefined') SelfTest.boot();
  _last=performance.now(); requestAnimationFrame(loop);
});

</script>
