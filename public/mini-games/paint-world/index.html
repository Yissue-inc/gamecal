<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>그린바다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Galmuri11:wght@400;700&display=swap">
<style>
 *{margin:0;padding:0;box-sizing:border-box;}
 html,body{width:100%;height:100%;overflow:hidden;background:#0a2036;
   font-family:Galmuri11,"Nanum Gothic Coding",sans-serif;
   -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
 canvas{display:block;touch-action:none;}
 /* ⚠ 첫 화면이 불투명해서 **살아 있는 수족관을 가리고 있었다.**
    캔버스는 이미 물고기가 헤엄치는 채로 돌고 있었는데, 지나가는 아이가 본 것은
    글자가 적힌 검은 사각형이었다. 전시장에서 첫 3초가 전부다 —
    안에 뭐가 있는지 보여 준 다음 부른다. (덮개 자체는 소리 잠금 해제에 필요하다) */
 #gate{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;
   align-items:center;justify-content:flex-end;gap:18px;padding-bottom:26vh;
   /* 아래 버튼 줄 위에 글자를 얹으면, 눌리지도 않는 버튼이 비쳐 헷갈린다.
      물이 트인 가운데-아래에 놓고, 아래쪽은 더 어둡게 눌러 둔다. */
   background:linear-gradient(to bottom,
     rgba(10,32,54,.26) 0%, rgba(10,32,54,.04) 30%,
     rgba(10,32,54,.42) 62%, rgba(10,32,54,.93) 100%);
   color:#eaf4ff;}
 #gate h1{font-size:56px;color:#ffc94a;letter-spacing:4px;
   text-shadow:0 3px 0 rgba(8,24,40,.55), 0 0 26px rgba(10,32,54,.9);}
 #gate p{font-size:17px;color:#dbe9f7;text-shadow:0 2px 8px rgba(8,24,40,.9);}
 /* 이름 입력 — 아이 손가락 기준으로 크게 */
 /* 그림이 위에 크게 뜬다 — 입력칸은 그 아래에 둔다(겹치면 자기 그림이 안 보인다) */
 #namebox{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;
   align-items:center;justify-content:flex-end;gap:18px;padding-bottom:8vh;
   background:rgba(10,32,54,.0);}
 #namebox input{font-family:inherit;font-size:34px;font-weight:700;text-align:center;
   padding:18px 26px;width:min(460px,80vw);border:4px solid #ffc94a;border-radius:16px;
   background:#0d2a42;color:#fff;outline:none;}
 #namebox input::placeholder{color:#6b8ba8;}
 .nb-row{display:flex;gap:16px;}
 #namebox button{font-family:inherit;font-size:24px;font-weight:700;padding:18px 34px;
   border-radius:16px;cursor:pointer;border:3px solid #ffc94a;background:#ffc94a;color:#0a2036;}
 /* ⚠ '#nb-skip' 은 '#namebox button' 보다 우선순위가 낮아 **한 번도 안 먹었다** —
    보조 버튼이 주 버튼과 똑같은 금색으로 나왔다. 둘 중 무엇을 눌러야 하는지
    아이는 알 수 없었다. 선택자를 올려 확실히 이긴다. */
 #namebox #nb-skip{background:transparent;color:#cfe2f2;border:3px solid rgba(255,255,255,.4);
   font-weight:400;}
 /* 시작 버튼은 화면에서 가장 눈에 띄어야 한다 — 아이가 무엇을 누를지 고민하면 안 된다 */
 #go{padding:24px 56px;border:none;border-radius:20px;background:#ffc94a;
   color:#0a2036;font-family:inherit;font-size:28px;font-weight:700;cursor:pointer;
   box-shadow:0 6px 0 #c99a2e, 0 12px 30px rgba(8,24,40,.5);
   animation:gobob 1.9s ease-in-out infinite;}
 #go:active{transform:translateY(4px);box-shadow:0 2px 0 #c99a2e;}
 @keyframes gobob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @media (prefers-reduced-motion: reduce){ #go{animation:none} }
</style></head><body>
<canvas id="game"></canvas>
<div id="gate">
  <h1>그린바다</h1>
  <p>내가 칠한 물고기가 바다에서 헤엄쳐요</p>
  <button id="go">시작하기</button>
</div>
<script>
/* ===== js/00_core.js ===== */
/* ══════════════════════════════════════════════════════════════════
   뼈대 — 화면 · 입력 · 저장

   해상도는 픽셀 게임과 다르다. 만화체라 **고해상도 그대로** 그린다.
   기준 1280x720, 화면에 맞춰 통째로 스케일.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const VW = 1280, VH = 720;

/* 어셋 개정값 — 그림 URL 뒤에 ?v= 로 붙는다.
   ⚠ 왜 필요한가: 어셋팀은 **같은 파일 이름으로** 그림을 교체한다(P24 로봇 49종,
     P25 산호). 캐시 무효화가 없으면 전시장 태블릿은 옛 그림을 계속 쓴다 —
     '배포했는데 화면은 그대로'가 된다. 실측: 고릴라 파일을 지웠는데도
     브라우저가 캐시에서 줘서 검사가 통과했다.
   stamp.py 가 어셋 폴더의 최신 수정 시각으로 갈아 끼운다. */
const AREV = '1788012380';

const PAL = {
  ink:'#12212e',
  paper:'#fdfaf3', paperDark:'#efe7d6',
  deep0:'#0a2036', deep1:'#0e3a5a', deep2:'#14567f', deep3:'#1d7ba6',
  sun:'#ffd75e', coral:'#ff7a6b', kelp:'#2f7d5a', sand:'#e8d4a8', sandDark:'#c9b184',
  white:'#ffffff', dim:'#8fa3b8', gold:'#ffc94a', red:'#ff5a6e', green:'#4ddc8f',
};

/* 아이가 쓰는 12색 — 원색으로 시원하게 */
const CRAYONS = ['#ff4757','#ff8c42','#ffd23f','#8ac926','#2ec4b6','#4aa8ff',
                 '#5f6bff','#b06bff','#ff6bb0','#8b5e34','#ffffff','#2b2b3a'];

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const rnd=()=>Math.random();
const rndi=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

const Screen = {
  cv:null, ctx:null, scale:1, ox:0, oy:0,
  init(){
    this.cv=document.getElementById('game');
    this.ctx=this.cv.getContext('2d');
    addEventListener('resize',()=>this.fit());
    this.fit();
  },
  fit(){
    const dpr=Math.min(devicePixelRatio||1,2);
    const w=innerWidth, h=innerHeight;
    this.cv.width=Math.round(w*dpr); this.cv.height=Math.round(h*dpr);
    this.cv.style.width=w+'px'; this.cv.style.height=h+'px';
    /* ⚠ 예전엔 꽉 채우고(cover) '잘리는 쪽은 배경이라 괜찮다'고 적어 뒀는데
       **버튼이 잘린다.** 실측 잘림 비율:
         아이패드 가로 25% · 아이패드 세로 58% · 아이폰 세로 74%
         (16:9 화면에서만 0% 라 그동안 안 보였다)
       전시장 태블릿은 대개 4:3 이다 — 아이가 그리기 버튼을 못 누른다.
       전체가 보이게 맞추고(contain) 남는 자리는 배경색으로 채운다. */
    this.scale=Math.min(w/VW, h/VH);
    this.ox=(w-VW*this.scale)/2; this.oy=(h-VH*this.scale)/2;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.dpr=dpr; this.cssW=w; this.cssH=h;
  },
  /* 화면 좌표 → 게임 좌표 */
  toGame(x,y){ return { x:(x-this.ox)/this.scale, y:(y-this.oy)/this.scale }; },
  begin(){ const c=this.ctx; c.save(); c.translate(this.ox,this.oy); c.scale(this.scale,this.scale); },
  end(){ this.ctx.restore(); },
};

/* ── 입력 — 아이가 쓰므로 터치 우선 ─────────────────────── */
const Input = {
  down:false, x:0, y:0, px:0, py:0, tapped:null, moved:false, keys:{},
  init(){
    const cv=document.getElementById('game');
    const at=e=>{ const t=e.touches?e.touches[0]:e; return Screen.toGame(t.clientX,t.clientY); };
    const dn=e=>{ const p=at(e); this.down=true; this.moved=false;
      this.x=this.px=p.x; this.y=this.py=p.y; this.tapped={x:p.x,y:p.y}; e.preventDefault(); };
    const mv=e=>{ const p=at(e); this.px=this.x; this.py=this.y; this.x=p.x; this.y=p.y;
      if(this.down && dist(p.x,p.y,this.tapped?this.tapped.x:p.x,this.tapped?this.tapped.y:p.y)>6) this.moved=true;
      e.preventDefault(); };
    const up=e=>{ this.down=false; };
    cv.addEventListener('touchstart',dn,{passive:false});
    cv.addEventListener('touchmove',mv,{passive:false});
    cv.addEventListener('touchend',up,{passive:false});
    cv.addEventListener('mousedown',dn);
    cv.addEventListener('mousemove',mv);
    addEventListener('mouseup',up);
    addEventListener('keydown',e=>{ this.keys[e.code]=true; });
    addEventListener('keyup',e=>{ this.keys[e.code]=false; });
  },
  takeTap(){ const t=this.tapped; this.tapped=null; return t; },
};

/* ── 저장 — 아이들 그림은 하루치 유지 ────────────────────── */
const Save = {
  key:'paintworld_v1',
  /* seen — 어떤 종을 그려 봤나. ⚠ creatures 는 600장 상한에 밀려 사라지므로
     그림이 밀려나도 '그려 봤다'는 기록은 남아야 한다. 도감의 정본이다. */
  data:{ creatures:[], made:0, sound:true, seen:{} },
  load(){ try{ const s=localStorage.getItem(this.key); if(s) Object.assign(this.data, JSON.parse(s)); }catch(_){} },
  /* ⚠ 상한 60장은 근거 없이 잡은 값이었다. 실측: 한 장 5KB,
     localStorage 는 10MB 이상 → 1,994장이 들어간다.
     전시장은 하루 수백 장이라 60장이면 오전에 다 밀린다.
     600장으로 올리되, 넘치면 오래된 것부터 버리고 그래도 안 되면 더 줄인다. */
  MAX:600,
  /* 그림 한 장을 문자열로 — ⚠ PNG 는 한 장 19.9KB 라 600장이면 11.7MB 다.
     아이패드 Safari 의 localStorage 는 보통 5MB 라 오후에 터진다.
     webp 0.8 이면 5.2KB(1/4)이고 투명도도 그대로다(실측 58% 동일).
     webp 를 못 만드는 브라우저는 toDataURL 이 png 를 돌려주므로 저절로 폴백된다. */
  encode(canvas){
    try{
      const d=canvas.toDataURL('image/webp',0.8);
      if(d && d.startsWith('data:image/webp')) return d;
    }catch(_){}
    return canvas.toDataURL('image/png');
  },
  write(){
    let keep=this.data.creatures.slice(-this.MAX);
    for(let tries=0; tries<6; tries++){
      try{
        localStorage.setItem(this.key, JSON.stringify({...this.data, creatures:keep}));
        return true;
      }catch(_){
        /* 용량 초과 — 절반씩 줄여 재시도. 게임은 계속돼야 한다 */
        keep=keep.slice(Math.ceil(keep.length/2));
        if(!keep.length) break;
      }
    }
    return false;
  },
};

</script>
<script>
/* ===== js/05_net.js ===== */
/* ══════════════════════════════════════════════════════════════════
   동기화 — 여러 대 동시 운영.

   역할은 주소로 정한다:
     ?role=paint  색칠 태블릿 — 그리고 보낸다. 수조는 자기 것만 보여도 된다
     ?role=stage  큰 화면    — 안 그리고 받기만 한다. 모두의 그림이 모인다
     (없으면)      혼자 쓰기  — 지금까지처럼 한 대로 다 한다

   ⚠ 서버가 없거나 죽어도 게임은 그대로 돌아가야 한다.
     전시 중에 와이파이가 끊겼다고 아이가 못 그리면 안 된다.
     보내기 실패는 큐에 쌓아 두고 살아나면 다시 보낸다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Net = {
  role:'solo', on:false, base:'', since:0,
  queue:[], pollT:0, failT:0, lastOk:0, sent:0, got:0,

  init(){
    const m=/[?&]role=(paint|stage)/.exec(location.search);
    this.role = m ? m[1] : 'solo';
    this.base = location.origin;
    if(this.role==='solo') return;
    this.probe();
    /* ⚠ 폴링을 렌더 루프(requestAnimationFrame)에 묶었더니 탭이 백그라운드로
       가는 순간 동기화가 **통째로 멈췄다**(실측: 서버에 5장이 있는데 0장 받음).
       전시장에서 큰 화면이 잠깐 가려지거나 화면보호기가 뜨면 그대로 끊긴다.
       네트워크는 자기 타이머로 돈다 — 렌더와 무관하게. */
    this._timer=setInterval(()=>{
      if(this.role==='stage') this.poll(); else this.flush();
      this.syncVit();
      if(!this.on) this.probe();
    }, 2000);
    /* 탭이 다시 보이면 즉시 한 번 — 밀린 걸 빨리 따라잡는다 */
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){ if(this.role==='stage') this.poll(); else this.flush(); }
    });
  },
  probe(){
    fetch(this.base+'/api/health',{cache:'no-store'})
      .then(r=>r.json())
      .then(d=>{ this.on=true; this.lastOk=Date.now();
        if(this.role==='stage') this.since=0;   // 큰 화면은 오늘치를 처음부터
      })
      .catch(()=>{ this.on=false; });
  },

  /* 색칠 태블릿 — 새 그림을 보낸다 */
  /* 함께 키우는 수조 — 서버의 값과 맞춘다.
     ⚠ 큰 쪽을 따른다. 방금 켠 기기가 0 을 보내 되돌리면 안 된다. */
  syncVit(){
    if(this.role==='solo') return;
    if(typeof Grow==='undefined' || typeof Save==='undefined') return;
    const mine=Grow.vit();
    fetch('api/vit', {method:'POST', headers:{'Content-Type':'application/json'},
                      body:JSON.stringify({vit:mine})})
      .then(r=>r.json())
      .then(j=>{
        if(j && j.vit>mine){
          const before=Grow.level();
          Save.data.vit=j.vit;
          if(Grow.level()>before){
            try{ const W=Game.W; if(W&&W.init) W.init(); }catch(_){}
          }
        }
      }).catch(()=>{});
  },
  push(rec){
    if(this.role==='solo') return;
    this.queue.push(rec);
    this.flush();
  },
  flush(){
    if(!this.queue.length || this._busy) return;
    this._busy=true;
    const rec=this.queue[0];
    fetch(this.base+'/api/creatures',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rec)
    }).then(r=>r.json())
      .then(()=>{ this.queue.shift(); this.sent++; this.on=true; this.lastOk=Date.now();
        this._busy=false; if(this.queue.length) this.flush(); })
      .catch(()=>{ this.on=false; this._busy=false; });   // 큐에 남겨 둔다
  },

  /* 큰 화면 — 새 그림을 받아 온다 */
  poll(){
    if(this.role!=='stage' || this._polling) return;
    this._polling=true;
    fetch(this.base+'/api/creatures?since='+this.since,{cache:'no-store'})
      .then(r=>r.json())
      .then(d=>{
        this.on=true; this.lastOk=Date.now(); this._polling=false;
        if(!d.creatures || !d.creatures.length) return;
        for(const rec of d.creatures){
          if(rec.id>this.since) this.since=rec.id;
          Game.adopt(rec);
          this.got++;
        }
      })
      .catch(()=>{ this.on=false; this._polling=false; });
  },
  /* 운영자 조작도 서버에 반영 */
  remove(id){ if(this.role==='solo'||!id) return;
    fetch(this.base+'/api/creatures/'+id,{method:'DELETE'}).catch(()=>{}); },
  clear(){ if(this.role==='solo') return;
    fetch(this.base+'/api/clear',{method:'POST'}).catch(()=>{}); },

  /* 프레임에서는 아무것도 안 한다 — 타이머가 대신 돈다(위 init 참고) */
  update(){ this.pollT++; },
  /* 화면 구석에 상태 — 운영자가 연결을 알아야 한다 */
  draw(c){
    if(this.role==='solo') return;
    const ok=this.on;
    c.save();
    c.globalAlpha=0.75;
    c.fillStyle = ok ? PAL.green : PAL.red;
    c.beginPath(); c.arc(VW-22, 22, 7, 0, TAU); c.fill();
    c.font='600 13px Galmuri11, sans-serif'; c.textAlign='right';
    c.fillStyle = ok ? 'rgba(255,255,255,.55)' : PAL.red;
    const label = this.role==='stage' ? ('받음 '+this.got) :
                  (this.queue.length ? ('보낼 것 '+this.queue.length) : ('보냄 '+this.sent));
    c.fillText(ok?label:'연결 끊김', VW-38, 15);
    c.restore();
  }
};

</script>
<script>
/* ===== js/10_template.js ===== */
/* ══════════════════════════════════════════════════════════════════
   도안 — ink(선) + mask(칠할 면)

   ⚠ 어셋이 오기 전에도 게임이 돌아야 한다. 그래서 도안을 **코드로 생성**한다.
     실물 PNG 가 assets/sea/<id>-ink.png 로 오면 자동으로 그쪽을 쓴다.
     발주서 규격(720x480, 머리 오른쪽, 중심선 y=240)을 그대로 지킨다 —
     생성본과 실물이 같은 규격이라야 바꿔 끼워도 안 깨진다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const TW=720, TH=480, TCX=360, TCY=240;

/* 종 정의 — motion 이 이 생물의 '움직이는 방식'이다(다양성의 핵심) */
const SPECIES = [
  /* id, 이름, 움직임, 몸 형태, 크기 */
  {id:'clownfish', ko:'흰동가리', motion:'swim',     shape:'fish',    size:1.0, zone:[1,2]},
  {id:'goldfish',  ko:'금붕어',   motion:'swim',     shape:'fantail', size:1.0, zone:[1,2]},
  {id:'angelfish', ko:'엔젤피시', motion:'swim',     shape:'tall',    size:1.0, zone:[1,2]},
  {id:'pufferfish',ko:'복어',     motion:'bob',      shape:'round',   size:0.95,zone:[2,3]},
  {id:'seahorse',  ko:'해마',     motion:'seahorse', shape:'seahorse',size:0.8, zone:[2,4]},
  {id:'starfish',  ko:'불가사리', motion:'crawl',    shape:'star',    size:0.85,zone:[3,4]},
  {id:'jellyfish', ko:'해파리',   motion:'pulse',    shape:'jelly',   size:0.9, zone:[0,1,5]},
  {id:'turtle',    ko:'바다거북', motion:'glide',    shape:'turtle',  size:1.15,zone:[1,2,3]},

/* ── 몸 형태 그리기 — 여기가 도안의 실체 ────────────────── */
const Shapes = {

/* ── 도안 생성기 ─────────────────────────────────────────
   같은 붓질을 ink(선) 과 mask(면) 두 캔버스에 각각 적용한다.
   이 이중 기록이 발주서 규격 그대로다. */
function makeTemplate(sp){
  const inkC=document.createElement('canvas'); inkC.width=TW; inkC.height=TH;
  const mskC=document.createElement('canvas'); mskC.width=TW; mskC.height=TH;
  const I=inkC.getContext('2d'), M=mskC.getContext('2d');
  for(const c of [I,M]){ c.translate(TCX,TCY); c.lineJoin='round'; c.lineCap='round'; }
  I.strokeStyle=PAL.ink; I.lineWidth=12;
  M.fillStyle='#fff';

  const S=(sp.size||1)*0.62;      // 720x480 안에 들어오게
  for(const c of [I,M]) c.scale(S,S);

  const both=(fn)=>{ fn(I,true); fn(M,false); };
  const P={
    body(pts){ both((c,isInk)=>{ c.beginPath();
      c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++){
        const a=pts[i-1], b=pts[i];
        c.quadraticCurveTo((a[0]+b[0])/2*1.15,(a[1]+b[1])/2*1.15,b[0],b[1]);
      }
      c.closePath(); isInk?c.stroke():c.fill(); }); },
    circle(x,y,r){ both((c,i)=>{ c.beginPath(); c.arc(x,y,r,0,TAU); i?c.stroke():c.fill(); }); },
    roundBody(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.ellipse(x,y,w,h,0,0,TAU); i?c.stroke():c.fill(); }); },
    egg(x,y,w,h){ this.roundBody(x,y,w,h); },
    belly(x,y,w,h){ both((c,i)=>{ if(!i) return; c.beginPath(); c.ellipse(x,y,w,h,0,0,TAU); c.stroke(); }); },
    cone(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x+w,y); c.quadraticCurveTo(x,y-h,x-w,y);
      c.quadraticCurveTo(x,y+h,x+w,y); c.closePath(); i?c.stroke():c.fill(); }); },
    diamond(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x+w,y); c.lineTo(x,y-h);
      c.lineTo(x-w,y); c.lineTo(x,y+h); c.closePath(); i?c.stroke():c.fill(); }); },
    wings(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x+w*0.6,y);
      c.quadraticCurveTo(x,y-h*1.5,x-w,y-h*0.2);
      c.quadraticCurveTo(x-w*0.4,y,x-w,y+h*0.2);
      c.quadraticCurveTo(x,y+h*1.5,x+w*0.6,y); c.closePath(); i?c.stroke():c.fill(); }); },
    longBody(x1,x2,r){ both((c,i)=>{ c.beginPath(); c.moveTo(x1,0);
      c.quadraticCurveTo((x1+x2)/2,-r,x2,0); c.quadraticCurveTo((x1+x2)/2,r,x1,0);
      c.closePath(); i?c.stroke():c.fill(); }); },
    segBody(n,x,r){ for(let k=0;k<n;k++){ const px=x-k*(2*r*0.62);
      both((c,i)=>{ c.beginPath(); c.ellipse(px,0,r*0.72,r,0,0,TAU); i?c.stroke():c.fill(); }); } },
    tail(bx,by,x1,y1,mx,my,x2,y2){ both((c,i)=>{ c.beginPath(); c.moveTo(bx,by);
      c.lineTo(x1,y1); c.quadraticCurveTo(mx,my,x2,y2); c.closePath(); i?c.stroke():c.fill(); }); },
    fin(x1,y1,x2,y2,x3,y3){ both((c,i)=>{ c.beginPath(); c.moveTo(x1,y1);
      c.quadraticCurveTo((x1+x2)/2,(y1+y2)/2,x2,y2); c.lineTo(x3,y3); c.closePath();
      i?c.stroke():c.fill(); }); },
    ray(x1,y1,x2,y2){ both((c,i)=>{ if(i){ c.lineWidth=8; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.lineWidth=12; }
      else { c.beginPath(); c.moveTo(x1,y1-14); c.lineTo(x2,y2); c.lineTo(x1,y1+14); c.closePath(); c.fill(); } }); },
    star(x,y,R,r,n){ both((c,i)=>{ c.beginPath();
      for(let k=0;k<n*2;k++){ const a=-Math.PI/2+k*Math.PI/n, rr=k%2?r:R;
        c.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
      c.closePath(); i?c.stroke():c.fill(); }); },
    bell(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x-w,y+h*0.5);
      c.quadraticCurveTo(x-w,y-h, x,y-h); c.quadraticCurveTo(x+w,y-h, x+w,y+h*0.5);
      c.quadraticCurveTo(x,y+h*0.9, x-w,y+h*0.5); c.closePath(); i?c.stroke():c.fill(); }); },
    tentacles(x,y,n,len,fwd){ for(let k=0;k<n;k++){ const t=(k/(n-1)-0.5);
      const ex=x+(fwd?len:t*len*0.8), ey=y+(fwd?t*len*0.5:len*(0.7+Math.abs(t)*0.4));
      both((c,i)=>{ if(i){ c.lineWidth=9; c.beginPath(); c.moveTo(x+t*90,y);
          c.quadraticCurveTo(x+t*150,(y+ey)/2, ex,ey); c.stroke(); c.lineWidth=12; }
        else { c.beginPath(); c.moveTo(x+t*90-13,y); c.quadraticCurveTo(x+t*150,(y+ey)/2, ex,ey);
          c.lineTo(ex,ey); c.quadraticCurveTo(x+t*150,(y+ey)/2, x+t*90+13,y); c.closePath(); c.fill(); } }); } },
    shell(x,y,w,h){ this.roundBody(x,y,w,h);
      both((c,i)=>{ if(!i) return; for(let k=-1;k<=1;k++){ c.beginPath();
        c.moveTo(x-w*0.7, y+k*h*0.45); c.lineTo(x+w*0.7, y+k*h*0.45); c.stroke(); }
        c.beginPath(); c.moveTo(x,y-h*0.9); c.lineTo(x,y+h*0.9); c.stroke(); }); },
    spiral(x,y,r,turns){ both((c,i)=>{ c.beginPath();
      for(let a=0;a<turns*TAU;a+=0.12){ const rr=r*(1-a/(turns*TAU)*0.82);
        const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; a?c.lineTo(px,py):c.moveTo(px,py); }
      if(i){ c.stroke(); } else { c.closePath(); c.fill();
        c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); } }); },
    foot(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.ellipse(x+w/2,y,w/2,h/2,0,0,TAU); i?c.stroke():c.fill(); }); },
    claw(x,y,ang){ both((c,i)=>{ c.save(); c.translate(x,y); c.rotate(ang*Math.PI/180);
      c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(-70,-30,-120,0);
      c.quadraticCurveTo(-70,40,0,0); c.closePath(); i?c.stroke():c.fill(); c.restore(); }); },
    legs(x,y,n){ for(let k=0;k<n;k++){ const t=k/(n-1)-0.5;
      both((c,i)=>{ if(!i) return; c.lineWidth=8;
        c.beginPath(); c.moveTo(x+t*150,y+60); c.quadraticCurveTo(x+t*180,y+150,x+t*220,y+170);
        c.stroke(); c.lineWidth=12; }); } },
    flipper(x1,y1,x2,y2){ both((c,i)=>{ c.beginPath(); c.moveTo(x1,y1);
      c.quadraticCurveTo((x1+x2)/2+30,(y1+y2)/2, x2,y2);
      c.quadraticCurveTo((x1+x2)/2-20,(y1+y2)/2+40, x1,y1); c.closePath(); i?c.stroke():c.fill(); }); },
    headBump(x,y,r){ this.circle(x,y,r); },
    beak(x,y,l){ both((c,i)=>{ c.beginPath(); c.moveTo(x,y-16); c.lineTo(x+l,y);
      c.lineTo(x,y+16); c.closePath(); i?c.stroke():c.fill(); }); },
    antenna(x1,y1,x2,y2){ both((c,i)=>{ if(!i) return; c.lineWidth=7;
      c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo((x1+x2)/2,(y1+y2)/2-40,x2,y2);
      c.stroke(); c.lineWidth=12; }); },
    spikes(x,y,r,n){ for(let k=0;k<n;k++){ const a=k/n*TAU;
      both((c,i)=>{ if(!i) return; c.lineWidth=8; c.beginPath();
        c.moveTo(x+Math.cos(a)*r*0.95, y+Math.sin(a)*r*0.95);
        c.lineTo(x+Math.cos(a)*(r+42), y+Math.sin(a)*(r+42)); c.stroke(); c.lineWidth=12; }); } },
    spout(x,y){ both((c,i)=>{ if(!i) return; c.lineWidth=8; c.beginPath();
      c.moveTo(x,y); c.quadraticCurveTo(x+10,y-60,x-10,y-100); c.stroke(); c.lineWidth=12; }); },
    seahorseBody(){ both((c,i)=>{ c.beginPath();
      c.moveTo(180,-170); c.quadraticCurveTo(250,-120,190,-60);
      c.quadraticCurveTo(120,-20,110,60); c.quadraticCurveTo(100,170,10,190);
      c.quadraticCurveTo(-60,200,-40,130); c.quadraticCurveTo(-10,150,20,120);
      c.quadraticCurveTo(40,60,40,-20); c.quadraticCurveTo(50,-120,120,-190);
      c.closePath(); i?c.stroke():c.fill(); }); },
    /* 눈은 ink 에만 — mask 에서 비워야 칠해지지 않는다 (발주서 규칙) */
    eye(x,y){ I.save(); I.fillStyle=PAL.ink; I.beginPath(); I.arc(x,y,26,0,TAU); I.fill();
      I.fillStyle='#fff'; I.beginPath(); I.arc(x+8,y-8,10,0,TAU); I.fill(); I.restore();
      M.save(); M.globalCompositeOperation='destination-out';
      M.beginPath(); M.arc(x,y,30,0,TAU); M.fill(); M.restore(); },
  };
  (Shapes[sp.shape]||Shapes.fish)(P);
  return {ink:inkC, mask:mskC};
}

/* 캐시 + 실물 어셋 우선 */
const Templates = {
  cache:{}, real:{},
  get(id){
    if(this.cache[id]) return this.cache[id];
    const sp=SP_BY_ID[id];
    const t=makeTemplate(sp);
    this.cache[id]=t;
    /* 실물이 있으면 조용히 갈아 끼운다 */
    this.tryReal(id,t);
    return t;
  },
  tryReal(id,t){
    if(this.real[id]!==undefined) return;
    this.real[id]=false;
    let got=0;
    const load=(kind)=>{
      const img=new Image();
      img.onload=()=>{ t[kind+'Real']=img; if(++got===2){ t.ink=t.inkReal; t.mask=t.maskReal;
        this.real[id]=true; } };
      img.onerror=()=>{ (Templates.failed||(Templates.failed={}))[id]=true; };
      img.src=`assets/${(typeof SEA_LIKE_JUNGLE!=='undefined'&&SEA_LIKE_JUNGLE[id])?'jungle':'sea'}/${id}-${kind}.png?v=${AREV}`;
    };
    load('ink'); load('mask');
  }
};
