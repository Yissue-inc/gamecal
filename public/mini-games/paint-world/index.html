    const v={x0,y0,x1,y1,w:x1-x0,h:y1-y0};
    this.cache[id]=v; return v;
  },
  /* 부위 자신의 그림 범위도 잰다 — 여백이 종마다 달라서 이걸 모르면 뜬다 */
  part(id, part, maskImg){
    const k=id+':'+part;
    if(this.cache[k]) return this.cache[k];
    const c=document.createElement('canvas'); c.width=256; c.height=256;
    const x=c.getContext('2d'); x.drawImage(maskImg,0,0,256,256);
    const d=x.getImageData(0,0,256,256).data;
    let x0=256,y0=256,x1=-1,y1=-1;
    for(let yy=0;yy<256;yy+=2) for(let xx=0;xx<256;xx+=2)
      if(d[((yy*256+xx)*4)+3]>128){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; }
    if(x1<0){ x0=40;y0=40;x1=216;y1=216; }
    const v={x0,y0,x1,y1,w:x1-x0,h:y1-y0};
    this.cache[k]=v; return v;
  },
  /* 부위별 붙는 자리 — 몸 범위 대비 비율.
     ⚠ 그냥 몸 가장자리에 두면 '닿기만 하고 안 겹쳐' 떠 보인다(실측).
        몸 안쪽으로 확실히 밀어 넣는다. */
  /* 부위를 '몸에 비해 얼마나 크게' 그릴지 — 보이는 크기 기준.
     ⚠ 캔버스 비율(256 vs 512)로 그렸더니 머리가 너무 작았다. 그림이 캔버스를
        얼마나 채우는지는 부위마다 다르다. 보이는 폭/높이로 맞춘다. */
  relSize(part, id){
    const T={ head:0.46, legF:0.20, legB:0.20, ear:0.26, tail:0.30 };
    const S={ giraffe:{head:0.34}, monkey:{head:0.42,tail:0.44},
              hippo:{head:0.54}, elephant:{head:0.50,ear:0.34},
              lion:{head:0.52}, sloth:{head:0.44} };
    return (S[id]&&S[id][part]) || T[part] || 0.4;
  },
  anchor(b, part, id){
    switch(part){
      case 'head': return [b.x1-b.w*0.20, b.y0+b.h*(id==='giraffe'?0.06:0.32)];
      case 'legF': return [b.x0+b.w*0.72, b.y1-b.h*0.12];
      case 'legB': return [b.x0+b.w*0.22, b.y1-b.h*0.12];
      case 'ear' : return [b.x1-b.w*0.26, b.y0+b.h*0.10];
      case 'tail': return [b.x0+b.w*0.08, b.y0+b.h*0.36];
    }
    return [b.x0+b.w/2, b.y0+b.h/2];
  }
};

/* ── 조립 도안 ─────────────────────────────────────────
   부위를 쉬는 자세로 늘어놓아 720x480 한 장으로 만든다.
   아이는 이 한 장에 칠한다. */
const JTemplate = {
  cache:{},
  get(id){
    if(this.cache[id]) return this.cache[id];
    const D=JUNGLE[id]; if(!D) return null;
    /* ⚠ 무슨 부위로 이루어졌는지는 **어셋이 안다.**
       나비를 재제작하며 다리가 빠지고 wing 이 생겼는데, 코드의 parts 는
       옛 목록(legF/legB)이라 사자 다리를 그대로 붙이고 날개는 무시했다.
       레이아웃 파일이 있으면 그쪽이 정본이다. (같은 실수를 조립 좌표에서
       이미 한 번 했다 — 어셋에 딸려온 파일을 먼저 열어 봤어야 했다) */
    const L0=JLayout.of(id);
    const parts=(L0&&L0.parts) ? Object.keys(L0.parts) : D.parts;
    const imgs={}; let ready=true;
    for(const p of parts){
      for(const k of ['ink','mask']){
        const n=`${id}-${p}-${k}`;
        let im=this._img[n];
        if(!im){
          im=new Image();
          /* 실패를 기록해 둔다 — 점검기가 '느린 것'을 '없는 것'으로 세지 않게 */
          im.onerror=()=>{ (JTemplate.failed||(JTemplate.failed={}))[n]=true; };
          im.src=`assets/jungle/${n}.png?v=${AREV}`;
          this._img[n]=im;
        }
        if(!im.complete || !im.naturalWidth) ready=false;
        imgs[p+'_'+k]=im;
      }
    }
    if(!ready) return null;
    const L=JLayout.of(id);
    /* 조립 — 마스터 좌표가 있으면 그대로, 없으면 비율로 추정 */
    const mk=(kind)=>{
      const c=document.createElement('canvas'); c.width=TW; c.height=TH;
      const x=c.getContext('2d');
      if(L){
        /* 마스터 캔버스를 720x480 에 꽉 맞춘다 */
        const S=Math.min(TW/L.canvas[0], TH/L.canvas[1])*0.98;
        const ox=(TW-L.canvas[0]*S)/2, oy=(TH-L.canvas[1]*S)/2;
        for(const p of ['legB','wing','tail','ear','body','legF','head']){
          if(!parts.includes(p)) continue;
          const pos=L.parts[p]; const im=imgs[p+'_'+kind];
          if(!pos||!im) continue;
          /* 마스터의 부위 PNG는 대개 512×512/256×256이지만, 기린·홍학처럼
             세로 비율을 살린 256×512 부위도 있다. 256×256으로 강제하면 긴
             다리가 납작해져 형태 QA를 통과한 에셋도 게임에서 망가진다. */
          const iw=im.naturalWidth || ((p==='body'||p==='head')?512:256);
          const ih=im.naturalHeight || iw;
          x.drawImage(im, ox+pos[0]*S, oy+pos[1]*S, iw*S, ih*S);
        }
        return c;
      }
      /* 512 짜리 body 를 720x480 에 맞춘다 */
      const S=TH/512*0.92, ox=TW/2-512*S/2, oy=TH/2-512*S/2;
      const box=BodyBox.of(id, imgs['body_mask']);
      const put=(p)=>{
        const im=imgs[p+'_'+kind]; if(!im) return;
        if(p==='body'){ x.drawImage(im, ox, oy, 512*S, 512*S); return; }
        const a=BodyBox.anchor(box,p,id);
        const pb=BodyBox.part(id,p,imgs[p+'_mask']);
        /* 보이는 폭이 몸 폭의 relSize 배가 되도록 배율을 역산한다 */
        const sc = (box.w * BodyBox.relSize(p,id)) / Math.max(1, pb.w) * (256/512) * 2;
        /* 이음점 대신 '그림의 붙는 쪽 가장자리'를 anchor 에 맞춘다.
           부위마다 여백이 달라서 이음점 좌표만 믿으면 뜬다. */
        const j=[
          p==='head'||p==='tail' ? pb.x0 : (pb.x0+pb.x1)/2,
          p==='legF'||p==='legB' ? pb.y0 : (p==='ear' ? pb.y1 : (pb.y0+pb.y1)/2)
        ];
        const w=256*S*sc, h=256*S*sc;
        const dx=ox+a[0]*S - j[0]*S*sc;
        const dy=oy+a[1]*S - j[1]*S*sc;
        x.drawImage(im, dx, dy, w, h);
      };
      /* 뒤에 있는 것부터 */
      ['legB','ear','body','legF','head','tail'].forEach(p=>{ if(D.parts.includes(p)) put(p); });
      return c;
    };
    const t={ ink:mk('ink'), mask:mk('mask'), D, imgs, parts, S:TH/512*0.92,
              box:BodyBox.of(id, imgs['body_mask']) };
    this.cache[id]=t;
    return t;
  },
  _img:{},
  prefetch(){ JLayout.load(); Object.keys(JUNGLE).forEach(id=>{
    const D=JUNGLE[id];
    const L=JLayout.of(id);
    const ps=(L&&L.parts) ? Object.keys(L.parts) : D.parts;
    for(const p of ps) for(const k of ['ink','mask']){
      const n=`${id}-${p}-${k}`;
      if(!this._img[n]){
        const im=new Image();
        im.onerror=()=>{ (JTemplate.failed||(JTemplate.failed={}))[n]=true; };
        im.src=`assets/jungle/${n}.png?v=${AREV}`; this._img[n]=im; }
    }
  }); }
};

/* ── 걷는 동물 ─────────────────────────────────────────
   칠한 그림(조립본)에서 부위별 조각을 떼어 각각 회전시킨다. */
/* 조립 텍스처 안에서 동물이 실제로 차지하는 범위 (발 위치용) */
const WalkFit = {
  cache:new WeakMap(),
  of(tex){
    let v=this.cache.get(tex); if(v) return v;
    try{
      const c=document.createElement('canvas'); c.width=TEX_W; c.height=TEX_H;
      const x=c.getContext('2d'); x.drawImage(tex,0,0);
      const d=x.getImageData(0,0,TEX_W,TEX_H).data;
      let y0=TEX_H,y1=-1;
      for(let y=0;y<TEX_H;y++) for(let px=0;px<TEX_W;px+=2)
        if(d[((y*TEX_W+px)*4)+3]>40){ if(y<y0)y0=y; if(y>y1)y1=y; break; }
      if(y1<0){ y0=0; y1=TEX_H-1; }
      v={top:y0, bot:y1, botOff:y1-TEX_H/2};
    }catch(e){ v={top:0,bot:TEX_H-1,botOff:TEX_H/2}; }
    this.cache.set(tex,v); return v;
  }
};


/* ══ 정글도 만지면 반응한다 ══════════════════════════ */
const JUNGLE_REACT = {
  elephant:'trumpet',
  lion:'roar', tiger:'roar', leopard:'roar', cheetah:'roar', wolf:'roar', gorilla:'roar',
  kangaroo:'jump', rabbit:'jump', frog:'jump',
  monkey:'swing', squirrel:'swing', sloth:'swing', koala:'swing', chameleon:'swing',
  parrot:'flap', toucan:'flap', owl:'flap', flamingo:'flap', peacock:'fan',
  butterfly:'flap', dragonfly:'flap',
  giraffe:'stretch', camel:'stretch', llama:'stretch', deer:'stretch',
  bear:'shake', fox:'shake', raccoon:'shake', panda:'shake', zebra:'shake',
  hedgehog:'curlup', landturtle:'curlup', iguana:'curlup', beetle:'curlup',
  hippo:'yawn', crocodile:'yawn', rhino:'yawn', pig:'yawn',
};
const JREACT_LEN = { trumpet:56, roar:50, jump:44, swing:52, flap:46,
                     fan:60, stretch:54, shake:42, curlup:50, yawn:56, nod:38 };

/* 층 이름 → 번호 */
const JLAYER_IDX={ canopy:0, branch:1, ground:2, water:3 };

class Walker {
  constructor(paintedTex, id, name, opt){
    opt=opt||{};
    this.id=id; this.D=JUNGLE[id]; this.name=name||'';
    this.tex=paintedTex;            // 조립 상태로 칠해진 텍스처 (TEX_W x TEX_H)
    /* layer 는 이제 '어디 사는가'가 아니라 **그리는 순서**일 뿐이다.
       높이(h)에서 파생시킨다 — 위에 사는 것이 뒤에 그려진다. */
    const hh = (this.D&&this.D.h!==undefined) ? this.D.h : 0.82;
    this.layer = hh<0.16 ? 0 : hh<0.62 ? 1 : hh<0.87 ? 2 : 3;
    this.x=opt.x!==undefined?opt.x:rnd()*VW;
    /* ⚠ 층을 넷으로 나눠 두니 **화면이 상하로 잘려** 보였다(CK 지적).
       실측: 나무 위 2종·가지 8종·땅 25종이라 위쪽이 비어 층 사이에 123px,
       62px 짜리 빈 띠가 남았다. 층 경계를 없애고 **종마다 사는 높이**를
       0(꼭대기)~1(바닥) 연속값으로 준다. 이제 정글은 하나의 공간이다.
       ⚠ 땅에 사는 동물은 배경의 땅 위에 있어야 한다 — 위로 올릴 수 없다.
         그래서 위쪽은 나는 것·나무에 사는 것이 **넓게 오르내려** 채운다. */
    const h = (this.D.h!==undefined) ? this.D.h : 0.86;
    this.depth = rnd();                      // 0 = 뒤(작게) · 1 = 앞(크게)
    /* ⚠ 처음 쓴 공식(0.16+h*0.66)은 **땅 동물을 배경의 땅보다 위로 띄웠다**
       (코끼리 486, 땅 그림은 561부터). 두 끝을 지나는 직선으로 다시 맞춘다:
         나비 h0.03 → 0.285   ·   개구리 h0.99 → 0.815 */
    const band = 0.2684 + h*0.5521;
    /* 위에 사는 것은 넓게 오르내려 위아래를 잇고, 땅에 사는 것은 땅에 붙어 있는다 */
    const wob  = (h<0.60 ? 0.16 : 0.035);
    this.baseY = VH*(band + (this.depth-0.5)*2*wob);
    this.y=opt.y!==undefined?opt.y:this.baseY;
    this.dir=rnd()<0.5?-1:1;
    /* ⚠ 0.7~1.1 로 뒀더니 화면에서 101x81px 였다 — 아이 그림이 안 보인다.
       조립 텍스처를 동물이 66%x79% 만 채우므로 배율을 더 키워야 한다. */
    /* 높이 그대로 크기에 반영 — 위에 있을수록 작다(멀어 보인다).
       층 계단이 아니라 **연속**이라 크기도 매끄럽게 변한다. */
    const LS = 0.58 + h*0.52;                       // 꼭대기 0.58 → 바닥 1.10
    const near = 0.80 + this.depth*0.40;
    this.s=(1.5+rnd()*0.7)*LS*near;
    this.spd=(0.4+rnd()*0.5)*this.D.gait.speed;
    this.t=rnd()*300; this.ph=rnd()*TAU;
    this.mine=!!opt.mine; this.joinT=opt.join?70:0;
    this.scared=0; this.reactT=0; this.reactKind=null;
    this.born = opt.born || Date.now();   // 시간이 지나면 자란다
    this.item = opt.item || null;   // 보물상자에서 받은 꾸미기
  }
  /* 만졌다 — 종에 맞는 반응 */
  react(){
    const kind = JUNGLE_REACT[this.id] || 'nod';
    this.reactKind = kind;
    this.reactT = this.reactMax = JREACT_LEN[kind] || 40;
    const x=this.x, y=this.y;
    if(kind==='roar' || kind==='trumpet') FX.note(x, y-this.h*0.5);
    else if(kind==='jump')   FX.dust(x, y+8, 12);
    else if(kind==='fan')    FX.sparkle(x, y-this.h*0.3, 14);
    else if(kind==='yawn')   FX.ring(x, y-this.h*0.2);
    else if(kind==='shake')  FX.dust(x, y+6, 8);
    else                     FX.heart(x, y-this.h*0.45);
    if(typeof Sfx!=='undefined' && Sfx.creature) Sfx.creature(kind);
    return kind;
  }
  get w(){ return TEX_W*this.s; }
  get h(){ return TEX_H*this.s; }
  update(dt, world){
    this.t+=dt*60;
    if(this.joinT>0) this.joinT--;
    if(this.scared>0) this.scared--;
    if(this.reactT>0) this.reactT--;
    const sp=this.spd*(this.scared>0?2.8:1);
    /* ⚠ 모든 종이 똑같이 걸었다 — 캥거루가 안 뛰고 나비가 안 날았다(실측:
       전 종 세로 흔들림 0px). 속도만 다르면 40종이 한 종처럼 보인다. */
    /* 나뭇가지 층은 가지 위를 딛는다 — 가지가 없는 구간에서는 제 층 높이로.
       급히 바뀌면 순간이동처럼 보이므로 천천히 따라간다. */
    let G0=this.baseY!==undefined?this.baseY:JWorld.groundY();
    if(this.layer===1 && world && world.perchYAt){
      const py=world.perchYAt(this.x);
      this.perchY = (this.perchY===undefined) ? (py!==null?py:G0) : this.perchY;
      const want = (py!==null) ? py : G0;
      this.perchY += (want-this.perchY)*0.06;
      G0=this.perchY;
    }
    switch(this.D.move){
      case 'hop': {                       // 캥거루·토끼·개구리 — 진짜로 뛴다
        this.hopT=(this.hopT||0)+1;
        const period = 46 + (this.D.gait.bob||10);
        const k=(this.hopT%period)/period;
        const air = k<0.62 ? Math.sin(k/0.62*Math.PI) : 0;
        this.y = G0 - air*(52+this.D.gait.bob*2.2);
        this.airborne = air>0.15;
        break; }
      case 'fly': {                       // 나비·잠자리 — 땅에 안 붙는다
        /* ⚠ 위쪽은 나는 것 두 종뿐이라 가만히 두면 화면 윗부분이 휑하다.
           땅에 사는 25종을 위로 올릴 수는 없으니(배경의 땅 위에 있어야 한다),
           **나는 것이 넓게 오르내려** 위아래를 잇는다. */
        this.flyPh=(this.flyPh||rnd()*TAU)+0.022;
        this.y = G0 + Math.sin(this.flyPh)*VH*0.15
                    + Math.sin(this.flyPh*0.37)*VH*0.07;
        break; }
      case 'bounce':                      // 원숭이·다람쥐 — 가지 사이를 오르내린다
        this.y = G0 - Math.abs(Math.sin(this.t*0.14+this.ph))*22
                    - Math.sin(this.t*0.011+this.ph)*VH*0.05;
        break;
      case 'creep':                       // 나무늘보 — 아주 천천히 오르내린다
        this.y = G0 - Math.sin(this.t*0.02+this.ph)*3
                    - Math.sin(this.t*0.006+this.ph)*VH*0.035;
        break;
      case 'strut':                       // 새 — 까딱이며 걷다가 가끔 자리를 옮긴다
        this.y = G0 - Math.abs(Math.sin(this.t*0.09+this.ph))*7
                    - (this.D.h<0.6 ? Math.sin(this.t*0.009+this.ph)*VH*0.055 : 0);
        break;
      default:
        this.y = G0;
    }
    if(this.mine && world && world.callAt && this.scared<=0){
      const cx=world.callAt.x, d=cx-this.x;
      if(Math.abs(d)>80){
        this.dir=d>0?1:-1; this.x += sp*2.8*this.dir;
        if(Game.t%9===0) FX.sparkle(this.x, this.y-40, 1);
        return;
      }
    }
    /* 손가락을 대고 있으면 다가온다 — 층은 유지하고 x 로만 */
    if(world.touchAt && !(this.scared>0) && !(this.reactT>0)){
      const T=world.touchAt, dx=T.x-this.x, ax=Math.abs(dx);
      if(T.swirl && ax<260){                 // 휘저으면 밀린다
        this.x += (T.vx||0)*(1-ax/260)*0.45;
        if(Math.abs(T.vx||0)>2) this.dir=(T.vx>0)?1:-1;
        return;
      }
      const eager=Math.min(1,(T.hold-20)/70);
      if(eager>0 && !T.swirl && ax<820){
        if(ax>110){ this.x+=Math.sign(dx)*sp*1.6*eager; this.dir=dx>0?1:-1; }
        else { this.x+=Math.sign(dx)*sp*0.25; }   // 도착하면 서성인다
        return;                                    // 제 갈 길은 접는다
      }
    }
    /* 무리 — 같은 종끼리 느슨하게 모인다(바다와 같은 격자를 쓴다)
       ⚠ 밀어내기 반경이 70px 이었는데 동물 폭은 300~400px 이다.
         8마리 중 7쌍이 겹쳤다(실측) — 아이 그림이 서로를 가린다.
         몸 크기로 벌리고, 6프레임마다는 너무 드물어 3프레임마다 본다. */
    if(world.flock && (Game.t + this.ph*97|0) % 3 === 0){
      const near=world.neighbors(this.x, this.y, this);
      let cx=0,n=0,px=0;
      for(const o of near){
        const dx=o.x-this.x, ax=Math.abs(dx);
        if(ax>340) continue;
        if((o.id||o.spId)===this.id){ cx+=o.x; n++; }
        const sep=(this.w+o.w)*0.30;
        if(ax<sep && ax>1) px -= dx/ax*(sep-ax)/sep;
      }
      if(n) this.x += ((cx/n)-this.x)*0.003;
      this.x += px*1.6;
    }
    this.x += sp*this.dir;
    if(this.x<-this.w) this.x=VW+this.w;
    if(this.x>VW+this.w) this.x=-this.w;
    if(rnd()<0.0012) this.dir*=-1;
  }
  /* 정글 동물은 발이 기준점이다 — 텍스처 한가운데는 y 보다 위에 있다 */
  itemFrame(){
    const g=(typeof growth==='function')?growth(this.born):1;
    const s=this.s*g;
    const fit=WalkFit.of(this.tex);
    return { x:this.x, y:this.y - fit.botOff*s, w:TEX_W*s, h:TEX_H*s,
             dir:this.dir, tex:this.tex, t:this.t };
  }
  draw(c, world){
    if(!this.tex) return;
    let s=this.s*(typeof growth==='function'?growth(this.born):1), alpha=1;
    if(this.joinT>0){ const k=1-this.joinT/70; s*=0.4+0.6*k; alpha=k; }
    const g=this.D.gait;
    /* 몸이 위아래로 까딱 — 걷는 리듬 */
    const bob=Math.sin(this.t*0.16+this.ph)*g.bob*0.1;
    /* 발이 땅에 닿게 — 조립본마다 동물 위치가 달라 자동으로 맞춘다 */
    const fit=WalkFit.of(this.tex);
    /* 만졌을 때의 몸짓 — 걷는 리듬 위에 얹는다 */
    let rsx=1, rsy=1, rrot=0, rdy=0, rdx=0;
    if(this.reactT>0){
      const k=1-this.reactT/this.reactMax;
      const bump=Math.sin(k*Math.PI);
      switch(this.reactKind){
        case 'trumpet': rrot=Math.sin(k*Math.PI*4)*0.10; rsx=1+bump*0.10; break;
        case 'roar':    rsx=1+bump*0.22; rsy=1+bump*0.26; rrot=Math.sin(k*Math.PI*6)*0.05; break;
        case 'jump':    rdy=-bump*70; rsy=1+bump*0.12; break;
        case 'swing':   rrot=Math.sin(k*Math.PI*3)*0.34; break;
        case 'flap':    rsy=1+Math.sin(k*Math.PI*8)*0.16; rdy=-bump*26; break;
        case 'fan':     rsx=1+bump*0.42; rsy=1+bump*0.16; break;
        case 'stretch': rsy=1+bump*0.30; rdy=-bump*14; break;
        case 'shake':   rrot=Math.sin(k*Math.PI*9)*0.13;                 // 몸 털기
                        rdx=Math.sin(k*Math.PI*11)*this.w*0.06; break;
        case 'curlup':  rsx=1-bump*0.26; rsy=1-bump*0.30; break;
        case 'yawn':    rsx=1+bump*0.20; rsy=1-bump*0.06; break;
        default:        rdy=-bump*16; rrot=Math.sin(k*Math.PI*4)*0.09;
      }
    }
    c.save();
    c.globalAlpha=alpha;
    c.translate(this.x+rdx, this.y+bob*s - fit.botOff*s + rdy);
    if(this.dir<0) c.scale(-1,1);
    if(rrot) c.rotate(rrot);
    c.scale(s*rsx, s*rsy);
    /* ⚠ 부위를 따로 회전시키려면 조각을 떼야 한다.
       칠한 텍스처는 조립본이므로, 각 부위의 화면 영역을 알아야 한다.
       그 영역은 JTemplate 의 배치와 같은 식으로 계산한다. */
    const T=JTemplate.get(this.id);
    if(!T){ c.drawImage(this.tex, -TEX_W/2, -TEX_H/2); c.restore(); return; }
    const k=TEX_W/TW;                  // 조립도안(720) → 텍스처(180)
    const D=this.D;
    const L=JLayout.of(this.id);
    let S, ox, oy, useMaster=false;
    if(L){
      useMaster=true;
      S=Math.min(TW/L.canvas[0], TH/L.canvas[1])*0.98*k;
      ox=(TEX_W-L.canvas[0]*S)/2; oy=(TEX_H-L.canvas[1]*S)/2;
    } else { S=T.S*k; ox=TEX_W/2-512*S/2; oy=TEX_H/2-512*S/2; }
    const legAng=(which)=>{
      /* 날개형(나비·잠자리)은 좌우가 **같이** 펄럭인다. 다리처럼 교대하면 어색하다 */
      const off = g && this.D.flyer ? 0 : (which==='legF'?0:Math.PI);
      const rate = this.D.flyer ? 0.42 : 0.16;
      return Math.sin(this.t*rate+this.ph+off)*g.swing;
    };
    const PARTS=(T&&T.parts)||D.parts;
    const part=(p)=>{
      if(!PARTS.includes(p)) return;
      if(useMaster){
        const pos=L.parts[p]; if(!pos) return;
        /* ⚠ 조립(JTemplate.mk)은 PNG 실제 크기로 그리는데 여기서만 정사각형을
           가정하면, 세로형 부위(기린·홍학 다리 256x512, 캥거루·토끼 귀)를
           **절반만 잘라 회전**한다. 다리 위쪽만 흔들리고 아래는 붙박이가 된다.
           조립과 같은 크기를 써야 한다. */
        const src=T && T.imgs && T.imgs[p+'_ink'];
        const iw=(src&&src.naturalWidth) || ((p==='body'||p==='head')?512:256);
        const ih=(src&&src.naturalHeight) || iw;
        const w=iw*S, h=ih*S;
        const sx=ox+pos[0]*S, sy=oy+pos[1]*S;
        /* 회전축 — 다리는 위쪽 가운데, 귀는 아래쪽 가운데 */
        /* 날개는 **몸에 붙은 쪽**을 축으로 돈다. 가운데를 축으로 하면
           날개가 몸에서 떨어져 허공에서 빙빙 돈다. */
        const px = sx + w*(p==='wing' ? 0.86 : 0.5);
        const py = (p==='legF'||p==='legB') ? sy + h*0.12 : sy + h*0.5;
        let ang=0;
        if(p==='legF'||p==='legB') ang=legAng(p);
        if(p==='ear') ang=Math.sin(this.t*0.11+this.ph)*0.18;
        if(p==='wing') ang=Math.sin(this.t*0.42+this.ph)*0.30;
        c.save();
        c.translate(px-TEX_W/2, py-TEX_H/2);
        if(ang) c.rotate(ang);
        c.drawImage(this.tex, sx,sy,w,h, -(px-sx), -(py-sy), w,h);
        c.restore();
        return;
      }
      const a=BodyBox.anchor(T.box,p,this.id);
      const pb=BodyBox.part(this.id,p,T.imgs[p+'_mask']);
      const sc = (T.box.w * BodyBox.relSize(p,this.id)) / Math.max(1, pb.w) * (256/512) * 2;
      const j=[
        p==='head'||p==='tail' ? pb.x0 : (pb.x0+pb.x1)/2,
        p==='legF'||p==='legB' ? pb.y0 : (p==='ear' ? pb.y1 : (pb.y0+pb.y1)/2)
      ];
      const w=256*S*sc, h=256*S*sc;
      const px=ox+a[0]*S, py=oy+a[1]*S;      // 이음점의 텍스처 좌표
      const sx=px-j[0]*S*sc, sy=py-j[1]*S*sc; // 조각의 좌상단
      let ang=0;
      if(p==='legF'||p==='legB') ang=legAng(p);
      if(p==='ear') ang=Math.sin(this.t*0.11+this.ph)*0.22;
      c.save();
      c.translate(px-TEX_W/2, py-TEX_H/2);
      if(ang) c.rotate(ang);
      c.drawImage(this.tex, sx,sy,w,h, -(px-sx), -(py-sy), w,h);
      c.restore();
    };
    /* body 는 통째로, 나머지는 조각내어 */
    if(useMaster){
      ['legB','wing','tail','ear'].forEach(part);
      const bp=L.parts['body'];
      if(bp) c.drawImage(this.tex, ox+bp[0]*S, oy+bp[1]*S, 512*S, 512*S,
        ox+bp[0]*S-TEX_W/2, oy+bp[1]*S-TEX_H/2, 512*S, 512*S);
      ['legF','head'].forEach(part);
    } else {
      ['legB','ear'].forEach(part);
      c.drawImage(this.tex, ox, oy, 512*S, 512*S,
        ox-TEX_W/2, oy-TEX_H/2, 512*S, 512*S);
      ['legF','head'].forEach(part);
    }
    c.restore();
    c.globalAlpha=1;

    /* 내 것 표시 — ⚠ 바다에만 있고 **정글엔 없었다.**
       찾기를 누르면 동물이 모이기는 하는데 표시가 안 떠서
       아이가 어느 게 자기 것인지 알 수 없었다. 이 게임의 핵심 기능이다. */
    if(this.mine && world && world.findT>0){
      c.save();
      c.globalAlpha=Math.min(1, world.findT/40);
      const r=this.w*0.42+10+Math.sin(this.t*0.1)*5;
      c.strokeStyle=PAL.gold; c.lineWidth=5;
      c.beginPath(); c.ellipse(this.x, this.y-this.h*0.14, r, this.h*0.52, 0, 0, TAU); c.stroke();
      const ay=this.y-this.h*0.66, asz=Math.max(64, this.w*0.32);
      if(!(typeof FXA!=='undefined' &&
           FXA.draw(c,'fx-arrow-point', this.x, ay-asz*0.55, asz, 0))){
        c.fillStyle=PAL.gold;
        c.beginPath(); c.moveTo(this.x, ay); c.lineTo(this.x-14, ay-22);
        c.lineTo(this.x+14, ay-22); c.closePath(); c.fill();
      }
      c.restore();
    }

    if(this.name && this.w>110){
      c.save(); c.globalAlpha=0.9;
      c.font='600 15px Galmuri11, sans-serif'; c.textAlign='center';
      const tw=c.measureText(this.name).width+16;
      c.fillStyle='rgba(20,40,20,.62)';
      c.fillRect(this.x-tw/2, this.y+this.h*0.30, tw, 21);
      c.fillStyle=PAL.white; c.fillText(this.name, this.x, this.y+this.h*0.30+16);
      c.restore();
    }
  }
}

/* 색칠 결과 → 텍스처. 바다와 같은 방식이되 조립 도안을 쓴다. */
function bakeWalker(fillCanvas, id){
  const t=JTemplate.get(id);
  const big=document.createElement('canvas'); big.width=TW; big.height=TH;
  const b=big.getContext('2d');
  b.drawImage(fillCanvas,0,0);
  if(t){
    b.globalCompositeOperation='destination-in'; b.drawImage(t.mask,0,0);
    b.globalCompositeOperation='source-over';    b.drawImage(t.ink,0,0);
  }
  const small=document.createElement('canvas'); small.width=TEX_W; small.height=TEX_H;
  const sx=small.getContext('2d');
  sx.imageSmoothingEnabled=true; sx.imageSmoothingQuality='high';
  sx.drawImage(big,0,0,TW,TH,0,0,TEX_W,TEX_H);
  return small;
}

<script>
/* ===== js/37_modeworld.js ===== */
/* ══════════════════════════════════════════════════════════════════
   새 모드 공통 — 공룡시대 · 로봇도시 · 풀숲

   ⚠ 바다는 통짜(슬라이스 워프), 정글은 완전 부위 조립이다.
     새 모드는 그 사이다 — **몸통 한 장 + 움직이는 부위 1~2장**.
     실측: 통짜로만 두면 다리 짧은 종이 안 움직인다
       물고기 헤엄 13% · 기린 걷기 16% · 코끼리 5% · 악어 2%
       (한 프레임에 바뀌는 픽셀 비율)
   ⚠ 어셋(P20·P21·P22)이 오기 전에도 게임은 돌아야 한다.
     도안이 없는 종은 목록에 안 뜬다 — 오는 대로 늘어난다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

/* 모드 정의 — realm 이 이 키가 된다 */
const MODES = {
  dino:  { ko:'공룡시대', folder:'dino',  list:()=>DINO_LIST,  by:()=>DINO_SPECIES,
           bg:'dino',  ground:0.80, amb:'jungle' },
  robot: { ko:'로봇도시', folder:'robot', list:()=>ROBOT_LIST, by:()=>ROBOT_SPECIES,
           bg:'city',  ground:0.82, amb:'jungle', rev:'p24r1' },
  bug:   { ko:'풀숲',     folder:'bug',   list:()=>BUG_LIST,   by:()=>BUG_SPECIES,
           bg:'bug',   ground:0.78, amb:'jungle' },
};

/* 도안 — 몸통 + (있으면) 부위 한 장 */
const MTemplate = {
  cache:{}, _img:{}, failed:{},        // failed — 실제로 못 받은 파일. '느린 것'과 구별한다
  key(mode,id){ return mode+'/'+id; },
  get(mode,id){
    const k=this.key(mode,id);
    if(this.cache[k]) return this.cache[k];
    const M=MODES[mode]; if(!M) return null;
    const D=M.by()[id.replace(/-/g,'_')] || M.by()[id]; if(!D) return null;
    const need=[['','ink'],['','mask']];
    if(D.part) need.push([D.part,'ink'],[D.part,'mask']);
    const imgs={}; let ready=true;
    for(const [p,kind] of need){
      const n = p ? `${id}-${p}-${kind}` : `${id}-${kind}`;
      let im=this._img[n];
      /* P24 replaces same-name PNGs: avoid retaining an earlier robot mask in cache. */
      if(!im){
        im=new Image();
        /* ⚠ 라이브에서 '아직 오는 중'을 '없다'로 판정해 멀쩡한 배포를 실패로 셌다.
           시간으로 재지 말고 **실제 실패**를 기록해 둔다. */
        im.onerror=()=>{ MTemplate.failed[mode]=(MTemplate.failed[mode]||new Set()).add(n); };
        im.src=`assets/${M.folder}/${n}.png?v=${M.rev||'1'}`;
        this._img[n]=im;
      }
      if(!im.complete || !im.naturalWidth) ready=false;
      imgs[(p||'body')+'_'+kind]=im;
    }
    if(!ready) return null;
    const t={ ink:imgs.body_ink, mask:imgs.body_mask, D, imgs, part:D.part };
    this.cache[k]=t; return t;
  },
  prefetch(mode){
    const M=MODES[mode]; if(!M) return;
    MAnchor.load(mode);
    for(const D of M.list()) this.get(mode, D.id);
  },
  /* 어셋이 실제로 도착한 종만 — 없는 것을 목록에 띄우면 아이가 골랐을 때 빈 화면이 된다 */
  ready(mode){ return MODES[mode] ? MODES[mode].list().filter(D=>this.get(mode,D.id)) : []; },
};

/* 몸통에 아이 그림을 입히고, 부위는 따로 남겨 회전시킨다 */
function bakeMode(fillCanvas, mode, id){
  const t=MTemplate.get(mode,id); if(!t) return null;
  const big=document.createElement('canvas'); big.width=TW; big.height=TH;
  const b=big.getContext('2d');
  b.drawImage(fillCanvas,0,0);
  b.globalCompositeOperation='destination-in';
  b.drawImage(t.mask,0,0);
  b.globalCompositeOperation='source-over';
  b.drawImage(t.ink,0,0);
  const small=document.createElement('canvas'); small.width=TEX_W; small.height=TEX_H;
  const s=small.getContext('2d');
  s.imageSmoothingEnabled=true; s.imageSmoothingQuality='high';
  s.drawImage(big,0,0,TW,TH,0,0,TEX_W,TEX_H);
  /* 부위도 같은 색으로 — 아이가 칠한 색이 다리에도 이어져야 한 몸으로 보인다 */
  if(t.part){
    const pc=document.createElement('canvas'); pc.width=256; pc.height=256;
    const p=pc.getContext('2d');
    /* 아이 그림에서 부위 자리의 색을 가져온다(대표색 한 가지) */
    p.drawImage(fillCanvas, TW*0.30, TH*0.55, TW*0.28, TH*0.30, 0,0,256,256);
    p.globalCompositeOperation='destination-in';
    p.drawImage(t.imgs[t.part+'_mask'],0,0,256,256);
    p.globalCompositeOperation='source-over';
    p.drawImage(t.imgs[t.part+'_ink'],0,0,256,256);
    small.partTex=pc;
  }
  small.modeId=id; small.modeName=mode;
  return small;
}

/* 부위가 몸통 어디에 붙는지 — 어셋이 알려 주는 것이 정본이다.
   ⚠ 몸통 그림만 보고는 '다리가 어디 달렸는지' 알 수 없다. 추정하면 종마다 어긋난다.
     assets/<mode>/_anchor.json 에  {"tyrannosaurus":{"leg":[352,300]}}  (몸통 720x480 기준)
     없으면 아래 PartFit 으로 대략 잡는다 — 어셋이 오면 저절로 정확해진다. */
const MAnchor = {
  data:{}, asked:{},
  load(mode){
    if(this.asked[mode]) return;
    this.asked[mode]=true;
    const dir='assets/'+((MODES[mode]||{}).folder||mode);
    /* ⚠ 어셋이 준 자리 그대로 두면 **부위가 몸통 안에 묻혀 안 보이는** 종이 나온다
       (실측: bot-ball 바퀴 1.00 = 완전히 가림 · 로봇 평균 0.69, 곤충 0.38).
       _anchor_fix.json 은 우리가 재서 만든 보정치다 — 어셋 파일은 손대지 않는다.
       어셋이 다시 오면 tools/fix_anchor.py 를 돌려 보정치를 새로 뽑는다. */
    Promise.all([
      fetch(dir+'/_anchor.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(dir+'/_anchor_fix.json').then(r=>r.ok?r.json():null).catch(()=>null),
    ]).then(([j,fx])=>{
      if(!j) return;
      if(fx) for(const sp in fx) j[sp]=Object.assign({}, j[sp], fx[sp]);
      this.data[mode]=j;
    });
  },
  of(mode,id,part){
    const m=this.data[mode]; if(!m) return null;
    const e=m[id]; if(!e) return null;
    const a=e[part]; return (a && a.length===2) ? a : null;
  }
};

/* 몸통 텍스처에서 그림이 실제로 차지하는 네모 — anchor 가 없을 때 쓴다 */
const PartFit = {
  cache:new WeakMap(),
  of(tex){
    let v=this.cache.get(tex); if(v) return v;
    try{
      const c=document.createElement('canvas'); c.width=TEX_W; c.height=TEX_H;
      const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(tex,0,0);
      const d=x.getImageData(0,0,TEX_W,TEX_H).data;
      let x0=TEX_W,y0=TEX_H,x1=-1,y1=-1;
      for(let y=0;y<TEX_H;y+=2) for(let px=0;px<TEX_W;px+=2){
        if(d[((y*TEX_W+px)*4)+3]>40){
          if(px<x0)x0=px; if(px>x1)x1=px; if(y<y0)y0=y; if(y>y1)y1=y; } }
      if(x1<0){ x0=0;y0=0;x1=TEX_W;y1=TEX_H; }
      v={x0,y0,x1,y1};
    }catch(e){ v={x0:0,y0:0,x1:TEX_W,y1:TEX_H}; }
    this.cache.set(tex,v); return v;
  }
};

/* ══ 새 모드의 생물 ══════════════════════════════════════
   몸통은 Creature 와 같은 슬라이스 워프로, 부위는 그 위에서 회전한다.
   ⚠ Creature 를 상속하면 draw 를 통째로 덮어야 해서, 필요한 것만 빌려 쓴다. */
class ModeBeing extends Creature {
  constructor(tex, mode, id, name, opt){
    super(tex, 'clownfish', name, opt||{});      // 바다 종을 빌리되 쓰지 않는다
    this.mode=mode; this.mid=id;
    const D=(MODES[mode] && (MODES[mode].by()[id.replace(/-/g,'_')] || MODES[mode].by()[id])) || {};
    this.D=D;
    this.partTex = tex && tex.partTex || null;
    this.partKind = D.part || null;
    /* 부위가 없는 종은 몸통만 흔든다 */
    this.motion = D.move==='step' ? 'stride'
                : D.move==='paddle' ? 'swim'
                : D.move==='flap' ? 'flap' : 'stride';
    /* ⚠ Creature 를 상속하니 **물고기처럼 떠다녔다**(CK 지적: 티라노가 뜬다).
       걷는 것은 땅에 발이 붙어야 한다 — 사는 방식을 셋으로 가른다. */
    this.gait = (D.move==='flap') ? 'air'
              : (D.move==='paddle') ? 'water' : 'ground';
    this.groundY = (MODES[mode]||{}).ground || 0.80;
    this.lane = (rnd()-0.5)*0.06;                 // 앞뒤로 조금씩 어긋나게
    this.y = this.gait==='ground' ? VH*(this.groundY+this.lane)   /* update 에서 발끝만큼 올린다 */
           : this.gait==='air'    ? VH*(0.22+rnd()*0.24)
           :                        VH*(0.45+rnd()*0.25);
    this.spd = (0.5+rnd()*0.5)*(this.gait==='ground'?0.9:1.2);
    this.dir = rnd()<0.5?-1:1;
    this.ph  = rnd()*TAU;
  }
  /* 발끝이 몸 중심에서 얼마나 아래인가 — **부위까지 포함해** 실제로 그려 재본다.
     ⚠ BodyFit 은 몸통만 잰다. 다리를 붙이면 발끝이 그보다 아래라
       그 값으로 땅에 맞추면 공룡이 땅에 파묻히거나 뜬다(실측 121px 어긋남). */
  footOff(){
    if(this._foot!==undefined) return this._foot;
    this._foot=0;
    try{
      const W2=TEX_W*4, H2=TEX_H*4;
      const c=document.createElement('canvas'); c.width=W2; c.height=H2;
      const x=c.getContext('2d',{willReadFrequently:true});
      const kx=this.x, ky=this.y, ks=this.s, kd=this.dir, kt=this.t, kr=this.reactT;
      this.x=W2/2; this.y=H2/2; this.s=1; this.dir=1; this.t=0; this.reactT=0;
      this._measuring=true;
      this.draw(x, null);
      this._measuring=false;
      this.x=kx; this.y=ky; this.s=ks; this.dir=kd; this.t=kt; this.reactT=kr;
      const d=x.getImageData(0,0,W2,H2).data;
      let y1=-1;
      for(let i=3;i<d.length;i+=4) if(d[i]>50){ const py=(((i-3)/4)/W2)|0; if(py>y1)y1=py; }
      if(y1>0) this._foot = y1 - H2/2;
    }catch(e){}
    return this._foot;
  }
  /* ⚠ 물고기 이동(Creature.update)을 쓰면 공룡이 물에 뜬다.
     걷는 것은 x 로만 가고, y 는 걸음 리듬으로만 오르내린다. */
  /* 무리 — 같은 종끼리 모이고, 서로 겹치지 않게 벌린다.
     ⚠ 땅 짐승을 물고기처럼 y 로 끌어당기면 **땅에서 떠오른다.**
       땅에서는 '가는 방향'과 '앞뒤 간격'만 맞춘다. 층(lane)은 아주 천천히. */
  herd(world){
    const near=world.neighbors(this.x, this.y, this);
    if(!near.length) return;
    let same=0, dirSum=0, laneSum=0, pullX=0, push=0;
    const air = this.gait!=='ground';
    for(const o of near){
      const dx=o.x-this.x, dy=o.y-this.y;
      const d2=dx*dx+dy*dy;
      if(d2 > 300*300) continue;
      if(o.mid===this.mid){ same++; dirSum+=o.dir; laneSum+=o.lane; pullX+=dx; }
      const sepR=Math.min(170,(this.w+o.w)*0.24);
      if(d2 < sepR*sepR && d2>1){
        const d=Math.sqrt(d2);
        push -= dx/d*(sepR-d)/sepR;
        if(air) this.y -= dy/d*(sepR-d)/sepR*0.5;
      }
    }
    this.x += push*0.9;
    if(same>=2){
      /* 여럿이 같은 쪽으로 가고 있으면 따라 돈다 — 갑자기 홱 돌지는 않게 */
      const want = dirSum>0 ? 1 : -1;
      if(want!==this.dir && rnd()<0.05) this.dir=want;
      if(!air) this.lane += (laneSum/same - this.lane)*0.006;
      /* ⚠ 방향만 맞추면 **나란히 걷기만 하고 뭉치지는 않는다**(실측: 8마리가
         화면 1505px 에 흩어진 채 같은 쪽으로 감). 무리는 모여야 무리다.
         화면 좌표 평균은 가장자리에서 되감기 때문에 못 쓴다 — 이웃까지의
         **상대 거리**로 당긴다. 이웃 탐색이 ±220px 이라 이음매를 안 넘는다. */
      this.x += Math.max(-1.1, Math.min(1.1, pullX/same*0.012));
    }
  }
  update(dt, world){
    this.t += dt*60;
    /* 매 프레임 다 재면 개체가 늘수록 무거워진다 — 흩어서 6프레임에 한 번 */
    if(world && world.neighbors && (Game.t + this.ph*97|0) % 6 === 0) this.herd(world);
    if(this.joinT>0) this.joinT--;
    if(this.reactT>0) this.reactT--;
    if(this.fedCd>0) this.fedCd--;
    const sp=this.spd*(this.reactT>0?0.3:1);
    /* 먹이 — ⚠ 여기가 없어서 새 모드는 **먹이를 뿌려도 아무도 안 먹었다.**
       Creature 의 update 를 통째로 덮으면서 먹이 추적까지 같이 덮였다.
       땅 짐승은 먹이 쪽으로 '걸어간다'(하늘로 날아가면 안 된다). */
    const food = this.scared>0 ? null : world.nearestFood(this.x, this.y);
    if(food){
      const dx=food.x-this.x, dy=food.y-this.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<820){
        this.dir = dx>0 ? 1 : -1;
        if(this.gait==='ground'){
          this.x += Math.sign(dx)*Math.min(sp*2.1, Math.abs(dx));
          this.y = VH*(this.groundY+this.lane) - this.footOff()*this.s
                 - Math.abs(Math.sin(this.t*0.12+this.ph))*7;      // 서두르는 걸음
        } else {
          const a=Math.atan2(dy,dx);
          this.x += Math.cos(a)*sp*2.1; this.y += Math.sin(a)*sp*2.1;
        }
        /* 땅에서는 먹이가 바닥에 있고 몸은 그 위라 세로 거리가 늘 남는다 —
           입이 닿는지는 **가로 거리**로 본다. */
        const reach = this.gait==='ground' ? Math.abs(dx) : d;
        if(reach<40 && !(this.fedCd>0)){ world.eatFood(food, this); this.fedCd=90; }
        const w0=this.w;
        if(this.x<-w0) this.x=VW+w0;
        if(this.x>VW+w0) this.x=-w0;
        return;
      }
    }
    if(this.gait==='ground'){
      this.x += sp*this.dir;
      const base=VH*(this.groundY+this.lane) - this.footOff()*this.s;
      /* 걸을 때 몸이 조금 오르내린다 — 가만히 있으면 미끄러지는 것처럼 보인다 */
      this.y = base - Math.abs(Math.sin(this.t*0.075+this.ph))*7;
      if(rnd()<0.0010) this.dir*=-1;
    } else if(this.gait==='air'){
      this.x += sp*1.3*this.dir;
      this.y += Math.sin(this.t*0.03+this.ph)*1.1;
      const top=VH*0.14, bot=VH*0.50;
      if(this.y<top) this.y=top; if(this.y>bot) this.y=bot;
      if(rnd()<0.0008) this.dir*=-1;
    } else {
      this.x += sp*this.dir;
      this.y += Math.sin(this.t*0.025+this.ph)*0.9;
      const top=VH*0.34, bot=VH*(this.groundY-0.04);
      if(this.y<top) this.y=top; if(this.y>bot) this.y=bot;
      if(rnd()<0.0009) this.dir*=-1;
    }
    const w=this.w;
    if(this.x<-w) this.x=VW+w;
    if(this.x>VW+w) this.x=-w;
  }
  kindKo(){ return this.D.ko || '친구'; }
  /* 만지면 종마다 다르게 — 부위가 하는 일에서 나온다 */
  react(){
    if(this.reactT>0) return null;
    const k=this.D.react || 'wiggle';
    this.reactKind=k; this.reactMax=this.reactT= (k==='chomp'?38: k==='whirl'?46: 42);
    return k;
  }
  draw(c, world){
    super.draw(c, world);
    /* 발끝을 재는 중에는 부위까지만 그린다(이름표·표시는 빼야 정확하다) */
    if(!this.partTex) return;
    /* 부위 — 몸통 위에서 회전한다. 회전축은 그림 위쪽 가운데(발주 규격) */
    const s=this.s*(typeof growth==='function'?growth(this.born):1);
    const t=this.t, ph=this.ph;
    let ang=0, spin=0;
    switch(this.D.move){
      case 'step':   ang=Math.sin(t*0.15+ph)*0.42; break;
      case 'flap':   ang=Math.sin(t*0.34+ph)*0.62; break;
      case 'paddle': ang=Math.sin(t*0.12+ph)*0.30; break;
      case 'swing':  ang=Math.sin(t*0.10+ph)*0.36; break;
      case 'spin':   spin=t*0.22; break;
      case 'snap':   ang=Math.abs(Math.sin(t*0.09+ph))*0.50; break;
      case 'wave':   ang=Math.sin(t*0.18+ph)*0.28; break;
    }
    /* 만졌을 때는 크게 움직인다 */
    if(this.reactT>0){
      const k=1-this.reactT/this.reactMax, bump=Math.sin(k*Math.PI);
      if(this.D.move==='spin') spin += k*TAU*2;
      else ang += Math.sin(k*Math.PI*6)*0.55*bump;
    }
    /* ⚠ 부위를 몸 한가운데 붙였더니 다리가 배 위에 떠 있었다.
       어셋에는 '어디에 붙는지'가 없다 — **몸통 그림의 실제 범위**를 재서 정한다.
       다리는 배 밑, 날개는 등 위, 지느러미는 뒤쪽 아래. */
    const box=PartFit.of(this.tex);
    const P = 256/TW*TEX_W;
    const w = P*s, h = P*s;
    const bw=(box.x1-box.x0)*s, bh=(box.y1-box.y0)*s;
    const cx=((box.x0+box.x1)/2 - TEX_W/2)*s;      // 몸 중심(텍스처 기준)
    const cy=((box.y0+box.y1)/2 - TEX_H/2)*s;
    let ax, ay;
    /* 어셋이 붙는 자리를 알려 줬으면 그대로 쓴다 */
    const an=MAnchor.of(this.mode, this.mid, this.partKind);
    if(an){
      ax=(an[0]/TW*TEX_W - TEX_W/2)*s;
      ay=(an[1]/TH*TEX_H - TEX_H/2)*s;
    } else
    switch(this.partKind){
      case 'wing':  ax=cx-bw*0.06; ay=cy-bh*0.30; break;   // 등 위
      case 'fin':   ax=cx-bw*0.22; ay=cy+bh*0.28; break;   // 뒤쪽 아래
      case 'arm':
      case 'claw':
      case 'jaw':   ax=cx+bw*0.26; ay=cy-bh*0.02; break;   // 앞쪽
      case 'wheel':
      case 'blade':
      case 'drum':  ax=cx-bw*0.10; ay=cy+bh*0.34; break;   // 아래
      case 'antenna': ax=cx+bw*0.28; ay=cy-bh*0.34; break; // 머리 위
      default:      ax=cx-bw*0.08; ay=cy+bh*0.34; break;   // 다리 — 배 밑
    }
    c.save();
    c.translate(this.x, this.y);
    if(this.dir<0) c.scale(-1,1);
    c.translate(ax, ay);
    /* 회전축은 부위 그림의 위쪽 가운데(발주 규격 128,30) */
    const pivotY = -h*0.5 + h*(30/256);
    c.translate(0, pivotY);
    c.rotate(ang + spin);
    c.translate(0, -pivotY);
    c.drawImage(this.partTex, -w/2, -h/2, w, h);
    c.restore();
  }
}

/* ══ 새 모드의 무대 ══════════════════════════════════════
   배경 어셋(P20·P21·P22)이 오기 전에도 서야 한다.
   있으면 쓰고, 없으면 하늘·땅을 색으로 칠한다. */
const ModeWorld = {
  mode:'dino', t:0, scroll:0, timeIdx:1, foods:[], scareAt:null, findT:0, callAt:null,
  /* 배경 층 — 발주서의 이름 그대로. 뒤에서 앞으로 그린다.
     ⚠ 'far/mid' 같은 일반 이름으로 찾다가 실제 어셋(bug-stem-far…)을 못 만나
       코드 폴백만 나왔다. 이름은 발주서가 정본이다. */
  LAYERS:{
    dino:  [['dino-sky',0,1.0,0.2],['dino-volcano',0.10,0.68,0.7],
            ['dino-mountain',0.26,0.46,1.1],['dino-mist',0.34,0.38,1.5],
            ['dino-fern-far',0.40,0.44,1.9],['dino-fern-mid',0.46,0.50,2.5],
            ['dino-river',0.72,0.18,2.8]],
    robot: [['city-sky',0,1.0,0.2],['city-far',0.12,0.64,0.7],
            ['city-mid',0.28,0.50,1.2],['city-neon',0.36,0.38,1.6],
            ['city-pipe',0.44,0.42,2.1],['city-belt',0.74,0.18,2.8]],
    bug:   [['bug-sky',0,1.0,0.2],['bug-canopy',0,0.46,0.6],
            ['bug-stem-far',0.10,0.64,1.1],['bug-stem-mid',0.20,0.58,1.7],
            ['bug-flower',0.34,0.44,2.2],['bug-water',0.70,0.18,2.7]],
  },
  FRONT:{
    dino:  [['dino-tree-near',0.02,0.64,3.6],['dino-rock-near',0.66,0.24,3.2],
            ['dino-grass-front',0.90,0.10,4.4]],
    robot: [['city-factory',0.02,0.64,3.6],['city-crate',0.66,0.24,3.2],
            ['city-front',0.90,0.10,4.4]],
    bug:   [['bug-leaf-near',0.02,0.64,3.6],['bug-stone-near',0.66,0.24,3.2],
            ['bug-grass-front',0.90,0.10,4.4]],
  },
  DUST:{ dino:'dino-ash', robot:'city-spark', bug:'bug-pollen' },
  PAL:{
    dino:  { sky0:'#3a2418', sky1:'#7a4b2e', far:'#4a3526', mid:'#3a2a1e', ground:'#2e2118' },
    robot: { sky0:'#0d1430', sky1:'#1d2a5c', far:'#243060', mid:'#1a2447', ground:'#141a33' },
    bug:   { sky0:'#2b4a1e', sky1:'#7fae4a', far:'#4c7a34', mid:'#3a6028', ground:'#2c4620' },
  },
  /* ⚠ Game.W 는 **읽을 때마다** 이 함수를 부른다(getter).
     그래서 여기서 무조건 비우면, 먹이를 뿌린 다음 프레임에 먹이가 사라지고
     '내 것 찾기'도 켜지자마자 꺼진다 — 새 모드에선 둘 다 죽어 있었다.
     실측: dropFood 직후 foods 0개 · findT=200 대입 직후 다음 읽기에서 0.
     세계가 **바뀔 때만** 비운다. */
  set(mode){
    if(this.mode===mode) return;
    this.mode=mode; this.foods=[]; this.findT=0; this.callAt=null; this.scareAt=null;
  },
  groundY(){ return VH*((MODES[this.mode]||{}).ground||0.80); },
  band(){ const g=this.groundY(); return [g-VH*0.10, g]; },
  init(){
    this.t=0; this.scroll=0;
    /* 단계가 오르면 앞쪽 소품이 늘어 세계가 빽빽해진다 */
    const G=(typeof Grow!=='undefined') ? Grow : null;
    this.lush = G ? G.kelpBoost() : 0;
  },
  update(dt){
    this.t+=dt*60; this.scroll+=0.30;
    if(this.findT>0) this.findT--;
    if(this.callAt && --this.callAt.life<=0) this.callAt=null;
    for(let i=this.foods.length-1;i>=0;i--){
      const f=this.foods[i];
      const rest=f.rest||this.groundY();
      if(f.y<rest){ f.vy=Math.min(2.0,(f.vy||0.3)+0.05); f.y+=f.vy; if(f.y>rest) f.y=rest; }
      if(--f.life<=0) this.foods.splice(i,1);
    }
  },
  draw(c){
    const P=this.PAL[this.mode]||this.PAL.dino;
    const g=c.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,P.sky0); g.addColorStop(1,P.sky1);
    c.fillStyle=g; c.fillRect(0,0,VW,VH);
    const L=this.LAYERS[this.mode]||[];
    let got=0;
    for(const [name,y,h,sp] of L)
      if(BG.tile(c, name, VH*y, VH*h, this.scroll*sp)) got++;
    if(got<2){                       // 어셋이 아직이면 언덕을 코드로
      this.hills(c, P.far, VH*0.52, 150);
      this.hills(c, P.mid, VH*0.64, 110);
    }
    const gy=this.groundY();
    const pre=(MODES[this.mode]||{}).bg||'dino';
    if(!BG.tile(c, pre+'-ground', gy, VH-gy, this.scroll*3.0)){
      c.fillStyle=P.ground; c.fillRect(0, gy, VW, VH-gy);
    }
    const dust=this.DUST[this.mode];
    if(dust) BG.tile(c, dust, 0, VH, this.scroll*0.6);
    for(const f of this.foods){
      if(!Props.draw(c,'fruit',f.x,f.y+8,18)){
        c.fillStyle=PAL.gold; c.beginPath(); c.arc(f.x,f.y,6,0,TAU); c.fill(); }
    }
  },
  hills(c,col,y,h){
    c.fillStyle=col; c.beginPath(); c.moveTo(0,VH);
    for(let x=0;x<=VW;x+=40)
      c.lineTo(x, y - Math.sin((x+this.scroll*0.6)*0.004)*h*0.35 - h*0.2);
    c.lineTo(VW,VH); c.closePath(); c.fill();
  },
  drawFront(c){
    /* ⚠ 앞 층을 아이 그림 위에 겹겹이 깔면 밝기를 잡아먹는다(정글에서 46% 손실).
       위쪽 절반은 건드리지 않는다. */
    for(const [name,y,h,sp] of (this.FRONT[this.mode]||[]))
      BG.tile(c, name, VH*y, VH*h, this.scroll*sp);
  },
  /* 바다·정글과 같은 약속들 — 없으면 게임이 터진다 */
  dropFood(x){ for(let i=0;i<14;i++)
      this.foods.push({x:x+(rnd()-0.5)*220, y:VH*0.2, vy:0.12+rnd()*0.1,
                       life:1400, rest:this.groundY()-rnd()*20}); Sfx.plop(); },
  nearestFood(x,y){ let b=null,bd=1e9;
    for(const f of this.foods){ const d=dist(x,y,f.x,f.y); if(d<bd){bd=d;b=f;} } return b; },
  eatFood(f,c){ f.bites=(f.bites||0)+1; FX.heart(c.x,c.y-20); Sfx.eat();
    if(f.bites>=3){ const i=this.foods.indexOf(f); if(i>=0) this.foods.splice(i,1); } },
  scare(x,y){ this.scareAt={x,y}; for(const b of Game.beings) b.scared=40; },
  callMine(x,y){ this.findT=720; this.callAt={x,y,life:720}; },
  /* 이웃 찾기 — 세로로는 층이 갈리므로 가로 격자만 쓴다(정글과 같은 이유).
     ⚠ 여기가 빈 배열을 돌려주는 동안 공룡·로봇·곤충은 서로를 못 봤다.
       50종이 각자 혼자 걸어다니면 세계가 아니라 목록이다. */
  CELL:220, grid:{}, gridT:-1,
  rebuildGrid(arr){
    if(this.gridT===Game.t) return;
    this.gridT=Game.t;
    const g={};
    for(const o of arr){ const k=(o.x/this.CELL)|0; (g[k]=g[k]||[]).push(o); }
    this.grid=g;
  },
  neighbors(x,y,self){
    this.rebuildGrid(Game.modeBeings[this.mode]||[]);
    const gx=(x/this.CELL)|0, out=[];
    for(let i=-1;i<=1;i++){
      const cell=this.grid[gx+i]; if(!cell) continue;
      for(const o of cell){
        if(o===self) continue;
        out.push(o); if(out.length>12) return out;
      }
    }
    return out;
  },
  prefetch(){
    const pre=(MODES[this.mode]||{}).bg||'dino';
    [...(this.LAYERS[this.mode]||[]), ...(this.FRONT[this.mode]||[])]
      .forEach(([n])=>BG.get(n));
    BG.get(pre+'-ground');
    if(this.DUST[this.mode]) BG.get(this.DUST[this.mode]);
  },
};

</script>
<script>
/* ===== js/40_world.js ===== */
/* ══════════════════════════════════════════════════════════════════
   수조 — 깊이 6구역 · 시간대 4단계 · 패럴랙스

   ⚠ 배경이 한 장이면 40종을 넣어도 한 화면처럼 보인다.
     깊이에 따라 색·소품·빛이 바뀌고, 시간대가 그 위에 물든다.
     전부 코드로 그린다(어셋 0). 실물이 오면 층별로 갈아 끼운다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

/* 구역: 0 수면 · 1 산호 · 2 중층 · 3 모래 · 4 바닥 · 5 심해 */
const ZONE_N=6;

/* 시간대 — 하늘빛이 물 전체를 물들인다 */
const TIMES=[
  {id:'dawn',  ko:'새벽', top:'#2a4a72', bot:'#0a1c30', tint:'rgba(255,180,140,.10)'},
  {id:'day',   ko:'낮',   top:'#2fa3d8', bot:'#08243c', tint:'rgba(255,255,255,.04)'},
  {id:'dusk',  ko:'저녁', top:'#c2643f', bot:'#0d1e34', tint:'rgba(255,120,60,.12)'},
  {id:'night', ko:'밤',   top:'#12294a', bot:'#050d18', tint:'rgba(80,120,255,.10)'},
];

/* ── 배경 실물 로더 ─────────────────────────────────────
   ⚠ 어셋이 없으면 지금까지의 코드 그림으로 폴백한다.
     한 장씩 오는 대로 갈아 끼워지므로 중간에 멈춰도 화면이 안 깨진다. */
const BG = {
  cache:{}, tried:{},
  get(n){
    if(this.cache[n]) return this.cache[n];
    if(this.tried[n]) return null;
    this.tried[n]=true;
    /* ⚠ webp 만 찾다가 png 로 온 배경 4종(vignette·paper·frame-wood·caustics)을
       통째로 놓쳤다. 확장자는 납품하는 쪽 사정이다 — 둘 다 본다. */
    const img=new Image();
    img.onload=()=>{ this.cache[n]=img; };
    img.onerror=()=>{
      const p2=new Image();
      p2.onload=()=>{ this.cache[n]=p2; };
      p2.src='assets/bg/'+n+'.png?v='+AREV;
    };
    img.src='assets/bg/'+n+'.webp?v='+AREV;
    return null;
  },
  /* 가로로 이어 붙여 그린다. off 만큼 흘린다. */
  tile(c,n,y,h,off){
    const img=this.get(n); if(!img) return false;
    const w=h*(img.width/img.height);
    let x=-(((off||0)%w)+w)%w;
    for(; x<VW; x+=w) c.drawImage(img,x,y,w,h);
    return true;
  },
  fill(c,n,y,h){
    const img=this.get(n); if(!img) return false;
    c.drawImage(img,0,y,VW,h); return true;
  },
  prefetch(){ ['caustics','vignette','water-deep','lightrays','surface','sand-floor','rock-far','rock-near',
    'coral-far','coral-near','kelp','bubbles','dust','cave'].forEach(n=>this.get(n)); }
};

/* ── 소품 — 바닥에 놓이는 것들 ─────────────────────────── */
const Props = {
  cache:{}, tried:{},
  get(n){
    if(this.cache[n]) return this.cache[n];
    if(this.tried[n]) return null;
    this.tried[n]=true;
    const img=new Image(); img.onload=()=>{ this.cache[n]=img; };
    img.src='assets/prop/'+n+'.png?v='+AREV;
    return null;
  },
  /* 바닥에 세워 놓는다 — 밑면이 y 에 닿는다 */
  draw(c,n,x,y,h){
    const img=this.get(n); if(!img) return false;
    const w=h*(img.width/img.height);
    c.drawImage(img, Math.round(x-w/2), Math.round(y-h), w, h);
    return true;
  },
  prefetch(){ ['anemone','clam','urchin','coral-branch','coral-brain','seagrass',
    'treasure-chest-open','treasure-chest-closed','anchor','shipwreck','bottle','pearl',
    'feed-pellet','sign-wood','lantern','flag','basket','bucket','easel'].forEach(n=>this.get(n)); }
};

const World = {
  zone:1, timeIdx:1, t:0, scroll:0,
  foods:[], bubbles:[], motes:[], kelp:[], corals:[], rocks:[],
  scareAt:null, findT:0, whale:null, whaleCd:1400, touchAt:null,

  zoneY(z){ return VH*(0.16+z*0.13); },
  zoneBand(z){ const c=World.zoneY(z); return [c-110, c+110]; },

  init(){
    /* 소품을 구역별로 흩뿌린다 — 구역마다 다른 풍경이 되도록.
       ⚠ 아이들이 만질수록 수조가 자란다(Grow) — 산호·수초가 단계에 따라 늘어난다.
         '자란다'고 말만 하고 화면이 그대로면 아무 일도 안 일어난 것이다. */
    const G=(typeof Grow!=='undefined') ? Grow : null;
    const kelpN  = 26 + (G?G.kelpBoost():0)*9;
    const coralN = 22 + (G?G.coralBoost():0)*8;
    this.kelp=[]; this.corals=[]; this.rocks=[];
    for(let i=0;i<kelpN;i++) this.kelp.push({x:rnd()*VW*1.4, h:120+rnd()*260, w:14+rnd()*16,
      ph:rnd()*TAU, depth:0.3+rnd()*0.5});
    for(let i=0;i<coralN;i++) this.corals.push({x:rnd()*VW*1.4, y:VH*0.62+rnd()*VH*0.26,
      r:26+rnd()*46, n:rndi(3,6), hue:rndi(0,360), depth:0.5+rnd()*0.5});
    for(let i=0;i<22;i++) this.rocks.push({x:rnd()*VW*1.4, y:VH*0.78+rnd()*VH*0.16,
      w:60+rnd()*140, h:30+rnd()*70, depth:0.25+rnd()*0.4});
    for(let i=0;i<70;i++) this.motes.push({x:rnd()*VW, y:rnd()*VH, r:0.8+rnd()*1.8, sp:0.1+rnd()*0.3});
    /* 바닥 소품 — 실물 어셋이 있으면 놓는다. 자리는 한 번만 정한다. */
    const KINDS=[['anemone',96],['clam',64],['urchin',54],['coral-branch',120],
                 ['coral-brain',76],['seagrass',110],['anchor',96],['bottle',58],
                 ['treasure-chest-closed',78],['pearl',30]];
    this.props=[];
    for(let i=0;i<22;i++){
      const k=KINDS[i%KINDS.length];
      this.props.push({n:k[0], h:k[1]*(0.8+rnd()*0.5),
        x:rnd()*VW*1.4, depth:0.5+rnd()*0.5, y:VH-VH*0.12-rnd()*VH*0.05});
    }
    /* 난파선 — 큰 장식 하나 */
    this.wreck={ x:VW*0.62, y:VH-VH*0.14, h:200 };
  },
  update(dt){
    this.t+=dt*60;
    this.scroll+=dt*8;
    if(this.findT>0) this.findT--;
    if(this.scareAt && --this.scareAt.life<=0) this.scareAt=null;
    if(this.callAt && --this.callAt.life<=0) this.callAt=null;
    /* 공기방울 */
    if(this.t%7<1) this.bubbles.push({x:rnd()*VW, y:VH+10, r:2+rnd()*6, sp:0.6+rnd()*1.4, ph:rnd()*TAU});
    for(let i=this.bubbles.length-1;i>=0;i--){
      const b=this.bubbles[i]; b.y-=b.sp; b.x+=Math.sin(this.t*0.02+b.ph)*0.4;
      if(b.y<-20) this.bubbles.splice(i,1);
    }
    for(const m of this.motes){ m.y-=m.sp*0.3; m.x+=Math.sin(this.t*0.006+m.y)*0.12;
      if(m.y<-4){ m.y=VH+4; m.x=rnd()*VW; } }
    /* 먹이 */
    for(let i=this.foods.length-1;i>=0;i--){
      const f=this.foods[i];
      f.y+=f.vy; f.vy=Math.min(0.62,f.vy+0.006); f.x+=Math.sin(this.t*0.03+f.ph)*0.4;
      if(--f.life<=0 || f.y>VH) this.foods.splice(i,1);
    }
    /* 가끔 고래가 지나간다 — 큰 사건 */
    if(!this.whale && --this.whaleCd<=0){
      this.whaleCd=2400+rndi(0,1800);
      this.whale={x:-400, y:VH*0.32+rnd()*VH*0.2, s:1.5, t:0};
    }
    if(this.whale){ this.whale.x+=0.9; this.whale.t++; if(this.whale.x>VW+500) this.whale=null; }
  },
  /* ⚠ 5알을 좁게 뿌렸더니 **1초 만에 전부 먹혔다**(실측: 60프레임에 0개).
     반경 안에 18마리가 있으니 즉시 소진된다 — 아이가 반응을 볼 시간이 없다.
     먹이는 이 게임에서 몇 안 되는 '내가 일으킨 사건'이다. 몇 초는 가야 한다.
     16알을 넓게 뿌리고 천천히 가라앉힌다. */
  dropFood(x,y){
    for(let i=0;i<22;i++)
      this.foods.push({
        x: x+(rnd()-0.5)*260,
        y: y+(rnd()-0.5)*90 - i*4,          // 조금씩 시차를 두고 내려온다
        vy: 0.10+rnd()*0.10, life:1500, ph:rnd()*TAU});
    Sfx.plop();
  },
  nearestFood(x,y){
    let best=null,bd=1e9;
    for(const f of this.foods){ const d=dist(x,y,f.x,f.y); if(d<bd){bd=d;best=f;} }
    return best;
  },
  /* ⚠ 한 입에 알이 통째로 사라져 16알이 1초 만에 없어졌다(실측).
     아이는 먹이를 **보고 싶어 한다** — 세 번 쪼아야 없어지게 하면
     한 알에 여러 마리가 모여드는 그림이 나오고, 화면에도 3배 오래 남는다. */
  eatFood(f,c){
    f.bites=(f.bites||0)+1;
    FX.heart(c.x, c.y-20);
    Sfx.eat();
    if(f.bites>=3){
      const i=this.foods.indexOf(f); if(i>=0) this.foods.splice(i,1);
    } else {
      /* 쪼일 때마다 조금 튕겨 나간다 — 물고기끼리 겹치지 않게 */
      f.x += (f.x-c.x)*0.10 + (rnd()-0.5)*14;
      f.y += (f.y-c.y)*0.10 - 6;
      f.vy = -0.25;
    }
  },
  /* ── 이웃 격자 ────────────────────────────────────
     ⚠ 전부와 거리 비교하면 300마리에 45,000번이다. 한 프레임에 못 한다.
     화면을 220px 칸으로 나눠 같은 칸 + 이웃 칸만 본다. */
  grid:null, gridT:-1, CELL:220,
  rebuildGrid(list){
    if(this.gridT===Game.t) return;
    this.gridT=Game.t;
    const g={};
    for(const c of list){
      const k=((c.x/this.CELL)|0)+','+((c.y/this.CELL)|0);
      (g[k]=g[k]||[]).push(c);
    }
    this.grid=g;
  },
  neighbors(x,y,self){
    this.rebuildGrid(Game.beings);
    const gx=(x/this.CELL)|0, gy=(y/this.CELL)|0, out=[];
    for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
      const cell=this.grid[(gx+i)+','+(gy+j)];
      if(!cell) continue;
      for(const o of cell){ if(o!==self && !o.dead) out.push(o); if(out.length>14) return out; }
    }
    return out;
  },
  flock:true,
  /* ── 내 것을 부른다 ────────────────────────────────
     ⚠ '찾기'가 금색 고리만 띄우면 아이는 여전히 눈으로 훑어야 한다.
       **내 물고기가 아이 앞으로 헤엄쳐 와야** '나를 알아본다'가 된다. */
  callMine(x,y){
    /* ⚠ 300프레임(5초)으로 뒀더니 화면 반대편 개체가 도착 전에 부름이 끝났다
       (실측: 셋 중 하나가 276px 지점에서 멈춤). 12초로 늘린다. */
    this.findT=720; this.callAt={x,y,life:720};
  },
  scare(x,y){ this.scareAt={x,y,life:50};
    for(const c of Game.creatures){ if(dist(c.x,c.y,x,y)<260) c.scared=64; }
    FX.ring(x,y);
  },

  /* ── 배경 그리기 ─────────────────────────────────── */
  draw(c){
    const T=TIMES[this.timeIdx];
    if(!BG.fill(c,'water-deep',0,VH)){
      const g=c.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,T.top); g.addColorStop(0.55,PAL.deep1); g.addColorStop(1,T.bot);
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
    }

    /* 빛기둥 — 수면에서 내려온다 */
    c.save(); c.globalCompositeOperation='lighter';
    if(BG.tile(c,'lightrays',0,VH,this.scroll*6)){ c.restore(); }
    else {
    for(let i=0;i<7;i++){
      const x=((i*230 + this.scroll*6)%(VW+400))-200;
      const w=70+Math.sin(this.t*0.006+i)*26;
      const lg=c.createLinearGradient(0,0,0,VH*0.8);
      lg.addColorStop(0,'rgba(255,240,190,.10)'); lg.addColorStop(1,'rgba(255,240,190,0)');
      c.fillStyle=lg;
      c.beginPath(); c.moveTo(x,0); c.lineTo(x+w,0); c.lineTo(x+w*2.4,VH*0.8); c.lineTo(x-w*0.6,VH*0.8);
      c.closePath(); c.fill();
    }
    c.restore(); }

    /* 수면 물결 */
    if(BG.tile(c,'surface',0,VH*0.09,this.scroll*3)){}
    else { c.save(); c.fillStyle='rgba(255,255,255,.10)';
    c.beginPath(); c.moveTo(0,0);
    for(let x=0;x<=VW;x+=16) c.lineTo(x, 26+Math.sin(x*0.018+this.t*0.03)*10);
    c.lineTo(VW,0); c.closePath(); c.fill(); c.restore(); }

    /* 먼 바위 (느리게) */
    if(!BG.tile(c,'rock-far',VH*0.52,VH*0.30,this.scroll*0.9)){
      this.layer(c, this.rocks, 0.35, (o,px)=>{
        c.fillStyle='rgba(8,28,46,.85)';
        c.beginPath(); c.ellipse(px,o.y,o.w,o.h,0,Math.PI,0); c.fill();
      });
    }
    BG.tile(c,'rock-near',VH*0.60,VH*0.34,this.scroll*1.5);
    /* 산호 */
    const coralHD = BG.tile(c,'coral-far',VH*0.58,VH*0.24,this.scroll*1.8)
                  | BG.tile(c,'coral-near',VH*0.66,VH*0.28,this.scroll*2.6);
    if(!coralHD) this.layer(c, this.corals, 0.6, (o,px)=>{
      c.strokeStyle=`hsla(${o.hue},55%,42%,.9)`; c.lineWidth=7; c.lineCap='round';
      for(let k=0;k<o.n;k++){
        const a=-Math.PI/2+(k/(o.n-1)-0.5)*1.5;
        const sway=Math.sin(this.t*0.012+k+o.x)*7;
        c.beginPath(); c.moveTo(px,o.y);
        c.quadraticCurveTo(px+Math.cos(a)*o.r*0.6+sway, o.y+Math.sin(a)*o.r*0.7,
                           px+Math.cos(a)*o.r+sway*1.6, o.y+Math.sin(a)*o.r);
        c.stroke();
      }
    });
    /* 미역 */
    if(!BG.tile(c,'kelp',VH-VH*0.50,VH*0.50,this.scroll*3.2))
    this.layer(c, this.kelp, 0.8, (o,px)=>{
      c.strokeStyle='rgba(38,110,78,.85)'; c.lineWidth=o.w; c.lineCap='round';
      c.beginPath(); c.moveTo(px, VH);
      const sway=Math.sin(this.t*0.014+o.ph)*26;
      c.quadraticCurveTo(px+sway, VH-o.h*0.55, px+sway*1.7, VH-o.h);
      c.stroke();
    });
    /* 난파선 — 가장 뒤 장식 */
    if(this.wreck) Props.draw(c,'shipwreck',
      ((this.wreck.x-this.scroll*1.2)%(VW*1.6)+VW*1.6)%(VW*1.6)-VW*0.3,
      this.wreck.y, this.wreck.h);

    /* 바닥 모래 */
    if(BG.tile(c,'sand-floor',VH-VH*0.18,VH*0.18,this.scroll*3.6)){}
    else {
    const sg=c.createLinearGradient(0,VH-120,0,VH);
    sg.addColorStop(0,'rgba(232,212,168,0)'); sg.addColorStop(1,'rgba(232,212,168,.55)');
    c.fillStyle=sg;
    c.beginPath(); c.moveTo(0,VH);
    for(let x=0;x<=VW;x+=24) c.lineTo(x, VH-56-Math.sin(x*0.01+this.t*0.002)*14);
    c.lineTo(VW,VH); c.closePath(); c.fill(); }

    /* 물빛 무늬 — 수면이 바닥에 만드는 그물. 천천히 흐른다 */
    const ca=BG.get('caustics');
    if(ca){
      c.save(); c.globalAlpha=0.16; c.globalCompositeOperation='lighter';
      const sz=340, ox=-(this.t*0.28)%sz, oy=-(this.t*0.12)%sz;
      for(let x=ox-sz;x<VW+sz;x+=sz)
        for(let y=VH*0.42+oy-sz;y<VH+sz;y+=sz) c.drawImage(ca,x,y,sz,sz);
      c.restore();
    }
    /* 바닥 소품 — 모래 위에 */
    if(this.props) for(const p of this.props){
      const px=((p.x - this.scroll*3.0*p.depth)%(VW*1.4)+VW*1.4)%(VW*1.4)-VW*0.2;
      if(px<-160||px>VW+160) continue;
      Props.draw(c,p.n,px,p.y,p.h);
    }

    /* 먼지 */
    if(!BG.tile(c,'dust',0,VH,this.scroll*0.6)){
      c.fillStyle='rgba(255,255,255,.13)';
      for(const m of this.motes){ c.beginPath(); c.arc(m.x,m.y,m.r,0,TAU); c.fill(); }
    }
  },
  layer(c, arr, depth, fn){
    for(const o of arr){
      const px=((o.x - this.scroll*depth*o.depth)%(VW*1.4)+VW*1.4)%(VW*1.4)-VW*0.2;
      if(px<-260||px>VW+260) continue;
      fn(o,px);
    }
  },
  drawFront(c){
    /* 공기방울 — 생물 앞 */
    c.save();
    for(const b of this.bubbles){
      c.strokeStyle='rgba(255,255,255,.42)'; c.lineWidth=1.4;
      c.beginPath(); c.arc(b.x,b.y,b.r,0,TAU); c.stroke();
      c.fillStyle='rgba(255,255,255,.14)'; c.fill();
    }
    /* 먹이 */
    for(const f of this.foods){
      /* 쪼일수록 작아진다 — 남은 양이 눈에 보여야 아이가 '먹고 있구나' 안다 */
      const k=1-(f.bites||0)*0.28;
      if(!Props.draw(c,'feed-pellet',f.x,f.y+7*k,14*k)){
        c.fillStyle=PAL.gold;
        c.beginPath(); c.arc(f.x,f.y,4*k,0,TAU); c.fill();
        c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=1; c.stroke();
      }
    }
    c.restore();
    /* 시간대 물들이기 */
    c.fillStyle=TIMES[this.timeIdx].tint; c.fillRect(0,0,VW,VH);
    this.drawGlass(c);
    /* 가장자리 어둠 — 어셋이 있으면 그림으로 */
    const vg=BG.get('vignette');
    if(vg){ c.globalAlpha=0.8; c.drawImage(vg,0,0,VW,VH); c.globalAlpha=1; }
    else {
      const v=c.createRadialGradient(VW/2,VH/2,VH*0.44,VW/2,VH/2,VH*1.10);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.26)');
      c.fillStyle=v; c.fillRect(0,0,VW,VH);
    }
  },

  /* ── 유리 ────────────────────────────────────────────
     ⚠ 지금까지는 '물속'이었지 '수조'가 아니었다. 아이는 물 안에 있는 게 아니라
       **유리 앞에 서서 들여다본다.** 그 한 겹이 수족관을 수족관으로 만든다.
     비스듬한 반사광 두 줄 + 위쪽 밝은 띠 + 모서리 이음매.
     전부 아주 옅게 — 아이 그림보다 튀면 안 된다. */
  drawGlass(c){
    c.save();
    /* 비스듬히 흐르는 반사광 */
    c.globalCompositeOperation='lighter';
    const t=this.t*0.0016;
    for(let i=0;i<2;i++){
      const off=((t*0.6+i*0.5)%1.6-0.3)*VW;
      const g=c.createLinearGradient(off, 0, off+VW*0.30, VH);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.5,'rgba(200,235,255,'+(0.05+i*0.015)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
    }
    /* 수면에 가까운 위쪽이 더 밝다 */
    const top=c.createLinearGradient(0,0,0,VH*0.34);
    top.addColorStop(0,'rgba(190,240,255,.10)');
    top.addColorStop(1,'rgba(190,240,255,0)');
    c.fillStyle=top; c.fillRect(0,0,VW,VH*0.34);
    c.globalCompositeOperation='source-over';
    /* 유리 모서리 — 아주 얇게. 수조 안을 들여다본다는 신호다 */
    c.strokeStyle='rgba(255,255,255,.10)'; c.lineWidth=3;
    c.strokeRect(1.5,1.5,VW-3,VH-3);
    const edge=26;
    c.fillStyle='rgba(255,255,255,.045)';
    c.fillRect(0,0,edge,VH); c.fillRect(VW-edge,0,edge,VH);
    c.restore();
  },
  drawWhale(c){
    if(!this.whale) return;
    const w=this.whale;
    c.save(); c.globalAlpha=0.32;
    c.translate(w.x,w.y); c.scale(w.s,w.s);
    c.fillStyle='#0a2a44';
    c.beginPath();
    c.moveTo(220,0); c.quadraticCurveTo(120,-90,-40,-70);
    c.quadraticCurveTo(-150,-50,-190,0);
    c.quadraticCurveTo(-150,60,-40,78);
    c.quadraticCurveTo(120,92,220,0); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-190,0); c.lineTo(-280,-70+Math.sin(w.t*0.03)*18);
    c.lineTo(-240,0); c.lineTo(-280,70+Math.sin(w.t*0.03)*18); c.closePath(); c.fill();
    c.restore();
  }
};

</script>
<script>
/* ===== js/45_jungleworld.js ===== */
/* ══════════════════════════════════════════════════════════════════
   정글 무대 — 바다와 같은 구조, 다른 층 구성.

   ⚠ 바다는 '깊이'로 층을 나눴지만 정글은 '거리'로 나눈다.
     동물은 땅 위를 걸으므로 세로 자유도가 거의 없다 — 대신 앞뒤로 겹친다.
     맨 앞 풀(grass-front)이 동물을 가려야 '숲 속에 있다'가 된다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const JTIMES=[
  {id:'morning', ko:'아침', tint:'rgba(255,214,150,.14)'},
  {id:'day',     ko:'낮',   tint:'rgba(255,255,255,.03)'},
  {id:'evening', ko:'저녁', tint:'rgba(255,140,70,.16)'},
  {id:'night',   ko:'밤',   tint:'rgba(40,70,160,.22)'},
];

const JWorld = {
  t:0, scroll:0, timeIdx:1, foods:[], scareAt:null, findT:0, touchAt:null, props:[], leaves:[],
  /* 큰 이벤트 — 바다에 고래가 지나가듯, 정글엔 새 떼가 하늘을 가른다 */
  flock2:null, flockCd:1500,
  /* ── 높이 층 ──────────────────────────────────────────
     ⚠ 바다는 깊이 6구역에 생물이 층층이 있는데 정글은 **땅 한 줄**이었다.
       나비도 개구리도 코끼리도 같은 높이에 서서 화면이 납작했다.
     배경이 덮는 구간(측정값)에 맞춰 층을 나눈다:
       나뭇잎지붕 0~144 · 덩굴 0~302 · 나무 158~561 · 강 518~590 · 땅 561~720
     0 나무 위  — 나비·잠자리·새 (지붕과 나무 사이)
     1 나뭇가지 — 원숭이·다람쥐·나무늘보·앵무 (나무 중간)
     2 땅       — 네발동물 대부분
     3 물가     — 개구리·악어·하마 (강 근처, 가장 앞) */
  /* ⚠ 층이 서로 **닿아야** 한다. 예전 값(0.255/0.480/…)은 층마다 좁은 띠를
     만들어 화면 세로의 24% 가 빈 채로 남았고, 정글이 층층이 끊겨 보였다.
     층은 '어디를 좋아하는가'이지 '어디까지만 갈 수 있는가'가 아니다. */
  LAYERS:[
    { id:'canopy', y:0.285, name:'나무 위' },
    { id:'branch', y:0.500, name:'나뭇가지' },
    { id:'ground', y:0.755, name:'땅' },
    { id:'water',  y:0.815, name:'물가' },
  ],
  layerY(i){ return VH*this.LAYERS[Math.max(0,Math.min(3,i|0))].y; },

  /* 이 x 에 가지가 있으면 그 **윗면** y 를, 없으면 null.
     ⚠ 층만 나눠 놓으면 원숭이가 가지 옆 허공에 서 있다. 층을 나눈 뜻이
       "나무 위에 산다"인데, 앉을 자리가 없으면 그냥 높이 뜬 땅일 뿐이다.
     가지는 스크롤하므로 화면 좌표로 옮겨 비교한다. */
  perchYAt(x){
    let best=null, bd=1e9;
    for(const p of this.perches){
      if(p.n==='liana-loop'||p.n==='tree-hole'||p.n==='leaf-cluster'||p.n==='moss-patch') continue;
      const px=((p.x - this.scroll*1.9*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      const halfW=(p.h*2.4)/2;                              // 가지 폭의 절반(대략)
      const d=Math.abs(px-x);
      if(d<halfW && d<bd){ bd=d; best=p.y; }
    }
    return best;
  },
  groundY(){ return VH*0.755; },
  band(){ return [VH*0.66, VH*0.80]; },

  init(){
    this.props=[];
    const K=[['fruit-tree',260],['bush',110],['log',96],['stump',86],
             ['flower-patch',56],['mushroom',60],['rock-perch',82],['pond',90],['nest',48]];
    /* 아이들이 만질수록 정글도 우거진다 — 바다만 자라면 반쪽이다 */
    const G=(typeof Grow!=='undefined') ? Grow : null;
    const propN = 18 + (G?G.kelpBoost():0)*6;
    for(let i=0;i<propN;i++){
      const k=K[i%K.length];
      this.props.push({n:k[0], h:k[1]*(0.8+rnd()*0.5),
        x:rnd()*VW*1.5, depth:0.4+rnd()*0.6,
        y:this.groundY()+ (k[0]==='fruit-tree'? 10 : rnd()*26)});
    }
    /* 나뭇가지 층 — 동물이 앉을 자리.
       ⚠ 층을 나눴더니 원숭이·앵무가 **허공에 떠** 있었다. 가지가 없어서다.
       어셋(P15 branch-*)이 오면 Props.draw 가 실물로 대체한다. */
    this.perches=[];
    const B=[['branch-thick',300],['branch-fork',270],['branch-thin',240],
             ['liana-loop',150],['tree-hole',130],['leaf-cluster',210],['moss-patch',180]];
    for(let i=0;i<9+(G?G.coralBoost():0)*3;i++){
      const b=B[i%B.length];
      this.perches.push({n:b[0], w:b[1]*(0.85+rnd()*0.4),
        h:(b[0]==='liana-loop'?150:b[0]==='tree-hole'?96:b[0]==='leaf-cluster'?72:b[0]==='moss-patch'?46:104)*(0.82+rnd()*0.42),
        x:rnd()*VW*1.5, depth:0.5+rnd()*0.5,
        y:this.layerY(1)+(rnd()-0.45)*150});   // 가지가 한 높이에 모이면 그것도 띠가 된다
    }
    /* 나무 위 장식 — 위에서 늘어진다. 아이 그림을 가리지 않게 화면 위쪽만 */
    this.hangers=[];
    /* P17 canopy-gap: 중앙은 완전 투명, 바깥 잎만 불투명이다.
       이전 파일은 가운데가 흰색이어서 제외했지만, 재작업본은 하늘과 날아다니는
       나비가 보이는 빈틈 역할을 한다. */
    /* ⚠ canopy-gap 은 여기 넣지 않는다. 가장자리까지 잎이 찬 '틀' 그림이라
       여러 장을 흩뿌리면 **네모난 잘림 자국**이 드러난다(실측: 상단에 직선 3개).
       화면 위에 한 장만 폭을 맞춰 깐다 — 아래 drawFront 를 보라. */
    const H=[['hanging-leaf',150],['flower-vine',210]];
    for(let i=0;i<7;i++){
      const h=H[i%H.length];
      this.hangers.push({n:h[0], h:h[1]*(0.8+rnd()*0.5),
        x:rnd()*VW*1.5, depth:0.35+rnd()*0.4,
        y:-14+rnd()*40});
    }
    /* 물가 층 — 수련잎·돌 */
    this.bankProps=[];
    const R=[['lilypad',110],['river-stone',120],['reeds',150],['mud-bank',210]];
    for(let i=0;i<7;i++){
      const r=R[i%R.length];
      this.bankProps.push({n:r[0], w:r[1]*(0.85+rnd()*0.4),
        x:rnd()*VW*1.5, depth:0.6+rnd()*0.4,
        y:this.layerY(3)+(rnd()-0.3)*18});
    }
    for(let i=0;i<22;i++) this.leaves.push({x:rnd()*VW, y:rnd()*VH, r:rnd()*TAU,
      sp:0.25+rnd()*0.5, sw:rnd()*TAU, sz:10+rnd()*10});
  },

  /* 소품이 아직 없을 때 코드로 그리는 임시 가지.
     어셋이 도착하면 이 함수는 호출되지 않는다. */
  fallbackPerch(c,n,x,y,w){
    c.save(); c.strokeStyle='#4a3a28'; c.lineCap='round';
    if(n==='liana-loop'){
      c.strokeStyle='#4f7a3a'; c.lineWidth=9;
      c.beginPath(); c.moveTo(x,y-70); c.quadraticCurveTo(x+18,y+30,x-14,y+64);
      c.stroke();
      c.beginPath(); c.ellipse(x-14,y+78,17,13,0,0,TAU); c.stroke();
    } else if(n==='tree-hole'){
      c.fillStyle='#3a2b1e'; c.beginPath(); c.ellipse(x,y,w*0.22,w*0.28,0,0,TAU); c.fill();
      c.lineWidth=8; c.stroke();
    } else {
      c.lineWidth = n==='branch-thin' ? 11 : 19;
      c.beginPath(); c.moveTo(x-w/2,y+8); c.quadraticCurveTo(x,y-6,x+w/2,y+2); c.stroke();
      if(n==='branch-fork'){
        c.lineWidth=13; c.beginPath();
        c.moveTo(x+w*0.10,y+1); c.quadraticCurveTo(x+w*0.30,y-34,x+w*0.52,y-46); c.stroke();
      }
      /* 잎 몇 장 */
      c.fillStyle='#4b7a3c';
      for(let i=0;i<4;i++){
        const lx=x-w/2+w*(0.18+i*0.22), ly=y-4-((i%2)*9);
        c.beginPath(); c.ellipse(lx,ly,15,7,-0.5+i*0.35,0,TAU); c.fill();
      }
    }
    c.restore();
  },
  update(dt){
    this.t+=dt*60; this.scroll+=dt*7;
    if(this.findT>0) this.findT--;
    if(this.scareAt && --this.scareAt.life<=0) this.scareAt=null;
    if(this.callAt && --this.callAt.life<=0) this.callAt=null;
    for(const l of this.leaves){
      l.y+=l.sp; l.x+=Math.sin(this.t*0.01+l.sw)*0.5; l.r+=0.012;
      if(l.y>VH+20){ l.y=-20; l.x=rnd()*VW; }
    }
    for(let i=this.foods.length-1;i>=0;i--){
      const f=this.foods[i];
      const rest=f.rest||this.groundY();
      if(f.y<rest){ f.vy=Math.min(2.4,(f.vy||0.3)+0.09); f.y+=f.vy; if(f.y>rest) f.y=rest; }
      if(--f.life<=0) this.foods.splice(i,1);
    }
    /* 새 떼 */
    if(!this.flock2 && --this.flockCd<=0){
      this.flockCd=2200+rndi(0,1600);
      const n=7+rndi(0,6), y0=VH*0.14+rnd()*VH*0.14;
      this.flock2={ t:0, birds:Array.from({length:n},(_,i)=>({
        x:-120-i*38-rnd()*30, y:y0+((i%3)-1)*22+rnd()*10, ph:rnd()*TAU, sp:1.5+rnd()*0.5 })) };
    }
    if(this.flock2){
      this.flock2.t++;
      let gone=true;
      for(const b of this.flock2.birds){
        b.x+=b.sp; b.y+=Math.sin(this.t*0.04+b.ph)*0.35;
        if(b.x<VW+140) gone=false;
      }
      if(gone) this.flock2=null;
    }
  },
  /* 열매는 나무에서 떨어져 땅에 쌓인다 — 층마다 다른 동물이 먹는다 */
  dropFood(x){
    for(let i=0;i<4;i++)
      this.foods.push({x:x+(rnd()-0.5)*80, y:VH*0.25, vy:0.3, life:900,
                       rest:this.layerY(2)+rnd()*20});
    Sfx.plop();
  },
  nearestFood(x,y){ let b=null,bd=1e9;
    for(const f of this.foods){ const d=Math.abs(x-f.x); if(d<bd){bd=d;b=f;} } return b; },
  eatFood(f,c){ const i=this.foods.indexOf(f); if(i>=0) this.foods.splice(i,1);
    FX.heart(c.x,c.y-30); Sfx.eat(); },
  /* ⚠ 정글은 무리가 꺼져 있어 동물이 서로를 전혀 의식하지 않았다.
     초식동물은 무리를 짓는다 — 바다와 같은 격자를 쓴다. */
  grid:null, gridT:-1, CELL:240, flock:true,
  rebuildGrid(list){
    if(this.gridT===Game.t) return;
    this.gridT=Game.t;
    const g={};
    for(const c of list){ const k=(c.x/this.CELL)|0; (g[k]=g[k]||[]).push(c); }
    this.grid=g;
  },
  neighbors(x,y,self){
    this.rebuildGrid(Game.animals);
    const gx=(x/this.CELL)|0, out=[];
    for(let i=-1;i<=1;i++){
      const cell=this.grid[gx+i]; if(!cell) continue;
      for(const o of cell){
        if(o===self) continue;
        if(self && (o.layer|0)!==(self.layer|0)) continue;   // 다른 층은 안 본다
        out.push(o); if(out.length>12) return out;
      }
    }
    return out;
  },
  callMine(x,y){ /* ⚠ 300프레임(5초)으로 뒀더니 화면 반대편 개체가 도착 전에 부름이 끝났다
       (실측: 셋 중 하나가 276px 지점에서 멈춤). 12초로 늘린다. */
    this.findT=720; this.callAt={x,y,life:720}; },
  scare(x,y){ this.scareAt={x,y,life:50}; FX.ring(x,y);
    for(const a of Game.animals) if(Math.abs(a.x-x)<300) a.scared=70; },

  draw(c){
    /* 하늘 */
    if(!BG.fill(c,'jungle-sky',0,VH)){
      const g=c.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,'#8fd3f4'); g.addColorStop(1,'#3a7d44');
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
    }
    BG.tile(c,'jungle-mountain', VH*0.34, VH*0.22, this.scroll*0.5);
    BG.tile(c,'jungle-mist',     VH*0.40, VH*0.16, this.scroll*0.8);
    BG.tile(c,'jungle-tree-far', VH*0.26, VH*0.44, this.scroll*1.1);
    BG.tile(c,'jungle-tree-mid', VH*0.22, VH*0.56, this.scroll*1.9);
    BG.tile(c,'jungle-river',    VH*0.72, VH*0.10, this.scroll*2.4);
    BG.tile(c,'jungle-ground',   VH*0.78, VH*0.22, this.scroll*3.0);
    BG.tile(c,'jungle-rock-near',VH*0.66, VH*0.20, this.scroll*2.6);
    /* 나뭇가지 — 동물보다 **뒤**에 그려 앉은 것처럼 보이게 */
    for(const p of this.perches){
      const px=((p.x - this.scroll*1.9*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-320||px>VW+320) continue;
      /* ⚠ 높이를 폭의 0.6 배로 줬더니 가지가 **화면 절반을 덮는 판자**가 됐다
         (512x200 짜리를 높이 220 으로 그리면 폭이 563px = 화면의 44%).
         가지 높이는 100 안팎이면 폭 256 으로 자연스럽다.
         Props.draw 는 밑면을 y 에 맞추므로, 발주 규격대로 윗면(위에서 40%)이
         동물 발높이에 오도록 밑면을 내려 잡는다. */
      const ph=p.h;
      if(!Props.draw(c,p.n,px,p.y+ph*0.60,ph)) this.fallbackPerch(c,p.n,px,p.y,p.w);
    }
    /* 바닥 소품 */
    for(const p of this.props){
      const px=((p.x - this.scroll*3.0*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-260||px>VW+260) continue;
      Props.draw(c,p.n,px,p.y,p.h);
    }
    /* 물가 동물 발치의 잔물결 — 물에 서 있다는 신호 */
    const rip=Props.get('water-ripple');
    if(rip && Game.animals){
      c.save(); c.globalAlpha=0.5;
      for(const a of Game.animals){
        if((a.layer|0)!==3) continue;
        const w=Math.max(70, a.w*0.5);
        c.drawImage(rip, a.x-w/2, a.y-6, w, w*0.28);
      }
      c.restore();
    }
    /* 물가 소품 */
    for(const p of this.bankProps){
      const px=((p.x - this.scroll*3.2*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-260||px>VW+260) continue;
      Props.draw(c,p.n,px,p.y+8,p.w*0.42);
    }
    /* 새 떼 — 나무보다 뒤, 하늘 앞 */
    if(this.flock2){
      c.save(); c.globalAlpha=0.55; c.fillStyle='#2b3a2c';
      for(const b of this.flock2.birds){
        const f=Math.sin(this.t*0.22+b.ph)*5;
        c.beginPath();
        c.moveTo(b.x-8, b.y);
        c.quadraticCurveTo(b.x-4, b.y-6-f, b.x, b.y-1);
        c.quadraticCurveTo(b.x+4, b.y-6-f, b.x+8, b.y);
        c.quadraticCurveTo(b.x+4, b.y-2-f*0.4, b.x, b.y+1);
        c.quadraticCurveTo(b.x-4, b.y-2-f*0.4, b.x-8, b.y);
        c.fill();
      }
      c.restore();
    }
    BG.tile(c,'jungle-tree-near',VH*0.06, VH*0.70, this.scroll*3.6);
    /* 나뭇잎 사이로 내리는 빛 — 바다의 lightrays 에 해당한다.
       아주 옅게. 아이 그림 위를 지나므로 진하면 색이 죽는다. */
    const sb=Props.get('sunbeam-jungle');
    if(sb){
      c.save(); c.globalAlpha=0.16; c.globalCompositeOperation='lighter';
      for(let i=0;i<3;i++){
        const bx=((i*470 - this.scroll*1.2)%(VW+520)+VW+520)%(VW+520)-260;
        c.drawImage(sb, bx, -40, 300, VH*0.92);
      }
      c.restore();
    }
  },
  /* 동물 뒤가 아니라 '앞'에 오는 것들 */
  drawFront(c){
    /* 먹이 */
    for(const f of this.foods){
      if(!Props.draw(c,'fruit',f.x,f.y+8,18)){
        c.fillStyle='#ff5a6e'; c.beginPath(); c.arc(f.x,f.y,7,0,TAU); c.fill();
      }
    }
    /* ⚠ 앞 층을 동물 위에 겹겹이 깔았더니 밝기가 46% 손실됐다(실측).
       아이 그림이 주인공인데 숲에 파묻힌다.
       덩굴·나뭇잎지붕은 동물이 없는 '위쪽'에만 그리고, 앞 풀만 발치에 남긴다. */
    /* ⚠ canopy-gap 을 화면 폭 한 줄로 깔아 봤는데 **화면을 가로로 잘랐다.**
       위쪽은 잎, 아래쪽은 숲 — 두 장면이 수평선으로 나뉜 것처럼 보인다.
       정글은 하나의 공간이어야 한다. 지붕은 원래 배경(jungle-canopy)에 있다. */
    /* 위에서 늘어진 잎·꽃덩굴 — 화면 위쪽에만 */
    for(const p of (this.hangers||[])){
      const px=((p.x - this.scroll*2.0*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-260||px>VW+260) continue;
      Props.draw(c,p.n,px,p.y+p.h,p.h);
    }
    BG.tile(c,'jungle-grass-front', VH-VH*0.13, VH*0.13, this.scroll*4.4);
    c.save(); c.beginPath(); c.rect(0,0,VW,VH*0.42); c.clip();
    BG.tile(c,'jungle-vines',  0, VH*0.42, this.scroll*2.2);
    BG.tile(c,'jungle-canopy', 0, VH*0.20, this.scroll*1.6);
    c.restore();
    /* 떨어지는 잎 */
    for(const l of this.leaves){
      c.save(); c.translate(l.x,l.y); c.rotate(l.r);
      if(!FXA.draw(c,'fx-leaf-fall',0,0,l.sz,0)){
        c.fillStyle='rgba(120,190,90,.75)';
        c.beginPath(); c.ellipse(0,0,l.sz*0.5,l.sz*0.22,0,0,TAU); c.fill();
      }
      c.restore();
    }
  },
  /* ⚠ 시각(時刻) 색조와 가장자리 어둠은 **맨 마지막**에 따로 칠한다.
     drawFront 안에 두면 나무 위 층(나비·잠자리)이 잎보다 앞에 그려지느라
     혼자만 색조를 안 받아 밤에도 대낮처럼 밝았다. */
  drawTint(c){
    c.fillStyle=JTIMES[this.timeIdx].tint; c.fillRect(0,0,VW,VH);
    /* 가장자리 어둠 — 어셋이 있으면 그림으로, 없으면 코드로 */
    const vg=BG.get('vignette');
    if(vg){ c.globalAlpha=0.75; c.drawImage(vg,0,0,VW,VH); c.globalAlpha=1; }
    else {

<script>
/* ===== js/60_ui.js ===== */
/* UI — 아이가 쓰는 버튼. 크고, 글자 없이 그림으로. */
'use strict';
/* ── 실물 아이콘 ────────────────────────────────────────
   ⚠ 어셋이 오기 전에도 돌아야 하므로 코드 그림을 남겨 둔다.
     assets/ui/<이름>.png 이 있으면 그쪽을 쓰고, 없으면 코드로 그린다.
     '-on'(누른 상태)이 따로 오므로 상태별로 다른 파일을 쓴다. */
const Icons = {
  cache:{}, missing:{},
  get(name){
    if(this.cache[name]) return this.cache[name];
    if(this.missing[name]) return null;
    this.missing[name]=true;
    const img=new Image();
    img.onload=()=>{ this.cache[name]=img; this.missing[name]=false; };
    img.onerror=()=>{};
    img.src='assets/ui/'+name+'.png?v='+AREV;
    return null;
  },
  /* 그렸으면 true. 버튼 중앙 기준. */
  draw(c, name, size, on){
    const img = (on && this.get(name+'-on')) || this.get(name);
    if(!img) return false;
    const w=size, h=size*(img.height/img.width);
    c.drawImage(img, -w/2, -h/2, w, h);
    return true;
  },
  prefetch(){
    ['brush-fat','brush-thin','bucket','eraser','stamp-star','stamp-heart','stamp-dot',
     'stamp-stripe','undo','redo','clear','color-swatch',
     'btn-submit','btn-back','btn-home','btn-find','btn-feed','btn-book',
     'btn-sound','btn-sound-off','btn-next','panel','tab',
     'btn-time','btn-realm-sea','btn-realm-jungle','card-free','hint-rotate']
      .forEach(n=>{ this.get(n); this.get(n+'-on'); });
  }
};

const UI = {
  btns:[],
  begin(){ this.btns=[]; },
  /* 버튼 등록 + 그리기. tap 판정은 hit() 로 */
  btn(c,id,x,y,w,h,draw,on){
    this.btns.push({id,x,y,w,h});
    c.save();
    c.fillStyle= on? 'rgba(255,201,74,.28)' : 'rgba(255,255,255,.10)';
    this.round(c,x,y,w,h,14); c.fill();
    c.strokeStyle= on? PAL.gold : 'rgba(255,255,255,.35)'; c.lineWidth=3;
    this.round(c,x,y,w,h,14); c.stroke();
    c.translate(x+w/2,y+h/2);
    draw(c, Math.min(w,h)*0.34);
    c.restore();
  },
  round(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); },
  hit(p){ if(!p) return null;
    for(const b of this.btns) if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h) return b.id;
    return null; },
  /* 아이콘 — 전부 코드로 */
  icon:{
    brush(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.3; c.lineCap='round';
      c.beginPath(); c.moveTo(-r*0.7,r*0.7); c.lineTo(r*0.3,-r*0.5); c.stroke();
      c.fillStyle=PAL.gold; c.beginPath(); c.arc(r*0.45,-r*0.7,r*0.4,0,TAU); c.fill(); },
    thin(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.14; c.lineCap='round';
      c.beginPath(); c.moveTo(-r*0.7,r*0.7); c.lineTo(r*0.4,-r*0.6); c.stroke();
      c.fillStyle=PAL.gold; c.beginPath(); c.arc(r*0.5,-r*0.72,r*0.22,0,TAU); c.fill(); },
    bucket(c,r){ c.fillStyle=PAL.white;
      c.beginPath(); c.moveTo(-r*0.6,-r*0.2); c.lineTo(r*0.6,-r*0.2);
      c.lineTo(r*0.4,r*0.7); c.lineTo(-r*0.4,r*0.7); c.closePath(); c.fill();
      c.fillStyle=PAL.gold; c.beginPath(); c.arc(r*0.75,r*0.2,r*0.22,0,TAU); c.fill(); },
    eraser(c,r){ c.save(); c.rotate(-0.4); c.fillStyle=PAL.white;
      c.fillRect(-r*0.6,-r*0.4,r*1.2,r*0.8);
      c.fillStyle=PAL.dim; c.fillRect(-r*0.6,0,r*1.2,r*0.4); c.restore(); },
    star(c,r){ c.fillStyle=PAL.gold; c.beginPath();
      for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r*0.95;
        c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } c.closePath(); c.fill(); },
    heart(c,r){ c.fillStyle=PAL.red; c.beginPath(); c.moveTo(0,r*0.7);
      c.bezierCurveTo(-r*1.3,-r*0.3,-r*0.5,-r*1.1,0,-r*0.35);
      c.bezierCurveTo(r*0.5,-r*1.1,r*1.3,-r*0.3,0,r*0.7); c.fill(); },
    dot(c,r){ c.fillStyle=PAL.white; c.beginPath(); c.arc(0,0,r*0.75,0,TAU); c.fill(); },
    undo(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.28; c.lineCap='round';
      c.beginPath(); c.arc(0,r*0.1,r*0.7,Math.PI*0.9,Math.PI*2.1); c.stroke();
      c.fillStyle=PAL.white; c.beginPath(); c.moveTo(-r*0.7,r*0.1);
      c.lineTo(-r*1.0,-r*0.35); c.lineTo(-r*0.3,-r*0.3); c.closePath(); c.fill(); },
    trash(c,r){ c.fillStyle=PAL.white; c.fillRect(-r*0.55,-r*0.4,r*1.1,r*1.05);
      c.fillRect(-r*0.75,-r*0.62,r*1.5,r*0.22);
      c.fillStyle='#173a52'; for(let k=-1;k<=1;k++) c.fillRect(k*r*0.28-r*0.05,-r*0.2,r*0.1,r*0.7); },
    submit(c,r){ c.fillStyle=PAL.white; c.beginPath();
      c.moveTo(-r*0.8,-r*0.45); c.lineTo(r*0.2,-r*0.45); c.lineTo(r*0.2,-r*0.8);
      c.lineTo(r*1.0,0); c.lineTo(r*0.2,r*0.8); c.lineTo(r*0.2,r*0.45);
      c.lineTo(-r*0.8,r*0.45); c.closePath(); c.fill(); },
    back(c,r){ c.fillStyle=PAL.white; c.beginPath();
      c.moveTo(r*0.7,-r*0.6); c.lineTo(-r*0.4,0); c.lineTo(r*0.7,r*0.6); c.closePath(); c.fill(); },
    find(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.26;
      c.beginPath(); c.arc(-r*0.15,-r*0.15,r*0.55,0,TAU); c.stroke();
      c.lineCap='round'; c.beginPath(); c.moveTo(r*0.28,r*0.28); c.lineTo(r*0.8,r*0.8); c.stroke(); },
    feed(c,r){ c.fillStyle=PAL.gold;
      [[0,-r*0.5],[-r*0.4,0],[r*0.4,r*0.1],[0,r*0.6],[-r*0.2,r*0.3]].forEach(p=>{
        c.beginPath(); c.arc(p[0],p[1],r*0.2,0,TAU); c.fill(); }); },
    book(c,r){ c.fillStyle=PAL.white;
      c.fillRect(-r*0.75,-r*0.6,r*0.7,r*1.2); c.fillRect(r*0.05,-r*0.6,r*0.7,r*1.2);
      c.fillStyle='#173a52'; c.fillRect(-r*0.06,-r*0.62,r*0.12,r*1.24); },
    sound(c,r,on){ c.fillStyle=PAL.white;
      c.beginPath(); c.moveTo(-r*0.7,-r*0.25); c.lineTo(-r*0.3,-r*0.25);
      c.lineTo(r*0.1,-r*0.7); c.lineTo(r*0.1,r*0.7); c.lineTo(-r*0.3,r*0.25);
      c.lineTo(-r*0.7,r*0.25); c.closePath(); c.fill();
      c.strokeStyle=PAL.white; c.lineWidth=r*0.16; c.lineCap='round';
      if(Sfx.on){ c.beginPath(); c.arc(r*0.2,0,r*0.45,-0.9,0.9); c.stroke();
        c.beginPath(); c.arc(r*0.2,0,r*0.75,-0.9,0.9); c.stroke(); }
      else { c.beginPath(); c.moveTo(r*0.4,-r*0.35); c.lineTo(r*0.95,r*0.35); c.stroke();
        c.beginPath(); c.moveTo(r*0.95,-r*0.35); c.lineTo(r*0.4,r*0.35); c.stroke(); } },
    time(c,r){ c.fillStyle=PAL.gold; c.beginPath(); c.arc(0,0,r*0.55,0,TAU); c.fill();
      c.strokeStyle=PAL.gold; c.lineWidth=r*0.14; c.lineCap='round';
      for(let k=0;k<8;k++){ const a=k/8*TAU;
        c.beginPath(); c.moveTo(Math.cos(a)*r*0.75,Math.sin(a)*r*0.75);
        c.lineTo(Math.cos(a)*r,Math.sin(a)*r); c.stroke(); } },
  }
};
