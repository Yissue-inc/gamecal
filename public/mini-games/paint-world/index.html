  /* ⚠ 다른 기기에서 온 그림을 합류시킨다(큰 화면 전용).
     내 것(mine)이 아니라 '누군가의 것'이다 — 이름표는 보이되
     '내 것 찾기'에는 안 걸린다. */
  adopt(rec){
    const img=new Image();
    /* ⚠ 이미지가 안 열리면 조용히 넘긴다. 큰 화면이 멈추면 안 된다. */
    img.onerror=()=>{};
    img.onload=()=>{
      /* ⚠ 알파 없는 PNG 가 오면 검은 사각형으로 뜬다(실측).
         정상 경로에서는 캔버스가 투명 PNG 를 만들지만, 다른 기기가
         잘못 보낼 수 있다. 투명 화소가 거의 없으면 버린다. */
      try{
        const t=document.createElement('canvas'); t.width=TEX_W; t.height=TEX_H;
        const x=t.getContext('2d'); x.drawImage(img,0,0,TEX_W,TEX_H);
        const d=x.getImageData(0,0,TEX_W,TEX_H).data;
        let clear=0;
        for(let i=3;i<d.length;i+=4*13) if(d[i]<20) clear++;
        if(clear < (d.length/(4*13))*0.10){ return; }   // 투명이 10% 미만 = 통짜 사각형
      }catch(e){}
      let c;
      if(typeof JUNGLE!=='undefined' && JUNGLE[rec.sp]){
        c=new Walker(img, rec.sp, rec.n||'', {join:true, y:JWorld.groundY()});
        while(this.animals.length>=200) this.animals.shift();
        this.animals.push(c);
      } else if(SP_BY_ID[rec.sp]){
        c=new Creature(img, rec.sp, rec.n||'', {join:true, x:-140});
        while(this.creatures.length>=250) this.creatures.shift();
        this.creatures.push(c);
      } else return;
      /* 합류 연출 — 큰 화면 앞의 아이들이 '누가 보냈다'를 알아챈다 */
      FX.splash(c.x+120, c.y);
      Sfx.join();
      this.say((rec.n? rec.n+'의 ' : '') + '친구가 왔어요');
      /* 방금 온 그림을 3초쯤 크게 비춘다.
         ⚠ 지금까지는 조용히 합류해서, 그린 아이가 자기 것이 도착한 줄도 몰랐다.
           전시장에서는 그 순간이 이 작품의 보상이다. */
      c.born = Date.now();
      /* ⚠ 그냥 덮어썼더니, 그림이 잇달아 오면 **앞사람 것이 잘렸다** —
         방금 보낸 아이가 자기 것 대신 남의 소개를 보고 끝난다.
         짧은 대기줄로 바꾼다. 밀리면(개관 러시) 하나하나를 짧게 보여 준다.
         3개까지만 들고 있는다 — 더 쌓이면 화면이 몇 분씩 덮인다. */
      this.spotQ = this.spotQ || [];
      this.spotQ.push({ c, t:0, name:rec.n||'' });
      while(this.spotQ.length>3) this.spotQ.shift();
      if(!this.spot) this.spot=this.spotQ.shift();
    };
    img.src=rec.d;
  },

  /* 생물의 종 이름 — 바다·정글 어느 쪽이든 안전하게
     ⚠ Walker 는 spId 가 없고 id 를 쓴다. 확대 화면이 바다로만 가정해서
       정글 동물을 누르면 터졌다(실측: reading 'ko' of undefined). */
  kindName(x){
    if(!x) return '';
    if(x.free) return '내가 그린 것';     // 백지 그림에는 종 이름이 없다
    const id = x.spId || x.id;
    return (SP_BY_ID[id] && SP_BY_ID[id].ko)
        || (typeof JUNGLE!=='undefined' && JUNGLE[id] && JUNGLE[id].ko)
        || '친구';
  },

  /* ── 물고기 크게 보기 ───────────────────────────── */
  /* 크게 보기 = **집에 가져가는 기념 카드**.
     ⚠ QR 로 폰에 보내는 길을 만들려다 접었다(직접 짠 인코더가 안 읽혔다).
       그런데 부모는 이미 폰으로 화면을 찍는다 — 찍기 좋게 만드는 게
       서버·네트워크·QR 없이 같은 목적을 이룬다. 액자·이름·날짜를 넣는다. */
  drawZoom(c){
    const z=this.zoomC; if(!z) return;
    c.fillStyle='rgba(6,20,36,.90)'; c.fillRect(0,0,VW,VH);
    /* 종이 액자 — 사진으로 찍었을 때 '카드'로 보이게 */
    const cw=Math.min(VW*0.72, 760), chh=cw*0.62;
    const cx=VW/2-cw/2, cy=VH*0.36-chh/2;
    c.save();
    c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=30; c.shadowOffsetY=10;
    c.fillStyle=PAL.paper||'#fbf7ee';
    UI.round(c, cx, cy, cw, chh, 18); c.fill();
    c.restore();
    const fr=(typeof BG!=='undefined') && BG.get('frame-wood');
    if(fr) c.drawImage(fr, cx-26, cy-26, cw+52, chh+52);
    const w=Math.min(VW*0.62, 620), h=w*TEX_H/TEX_W;
    /* 크게 볼 때도 헤엄친다 — 정지 이미지면 재미가 없다 */
    const sc=w/TEX_W;
    if(z instanceof Walker){
      /* 정글 동물은 걷는 모습 그대로 크게 */
      c.save();
      const keep={x:z.x, y:z.y, s:z.s};
      z.x=VW/2; z.y=VH*0.36+TEX_H*sc*0.30; z.s=sc*0.82;
      z.draw(c, JWorld);
      z.x=keep.x; z.y=keep.y; z.s=keep.s;
      c.restore();
    } else {
      const SL=44, sw=TEX_W/SL;
      c.save(); c.translate(VW/2, VH*0.36); c.scale(sc*0.82,sc*0.82);
      for(let i=0;i<SL;i++){
        const u=i/SL;
        const off=Math.sin(z.t*0.11+z.ph-u*3.0)*11*Math.pow(1-u,1.7);
        c.drawImage(z.tex, i*sw,0,sw+1,TEX_H, i*sw-TEX_W/2, off-TEX_H/2, sw+1, TEX_H);
      }
      c.restore();
    }
    /* 받은 꾸미기도 함께 — 기념품에 남아야 한다 */
    if(z.item && typeof Items!=='undefined'){
      /* ⚠ 액자 폭(760)으로 자리를 잡고 있었는데 그림은 620×0.82=508 로 그린다 —
         22% 어긋나 **모자가 거북이 머리가 아니라 허공에** 떠 있었다.
         기념 카드는 부모가 사진으로 찍어 가는 화면이다. 같은 값을 쓴다. */
      const proxy={ x:VW/2, y:VH*0.36, w:w*0.82, h:h*0.82,
                    dir:1, t:z.t, item:z.item, tex:z.tex };
      Items.draw(c, proxy);
    }
    const kn=this.kindName(z);
    c.textAlign='center';
    c.font='700 36px Galmuri11, sans-serif'; c.fillStyle=PAL.white;
    c.fillText(z.name ? z.name+'의 '+kn : kn, VW/2, VH*0.785);
    /* 날짜 — 기념품에는 언제인지가 남아야 한다 */
    const d=new Date();
    const ds=d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate();
    c.font='600 21px Galmuri11, sans-serif'; c.fillStyle=PAL.gold;
    c.fillText('그린바다  ·  '+ds, VW/2, VH*0.845);
    c.font='600 20px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    c.fillText('사진으로 찍어 가져가세요  ·  화면을 만지면 돌아가요', VW/2, VH-52);
  },
  /* ── 도감 — 내가 만든 것 모아 보기 ──────────────── */
  /* 도감 — '내가 만든 목록'이 아니라 **수집표**다.
     ⚠ 예전엔 만든 것만 나열해서 무엇이 남았는지 알 수 없었다.
       안 그린 종을 흐리게 함께 보여 줘야 '다음엔 저거'가 생긴다. */
  drawCodex(c){
    c.fillStyle='#123047'; c.fillRect(0,0,VW,VH);
    const seen=Save.data.seen||{};
    /* ⚠ 세계가 다섯인데 도감이 바다·정글만 보여 주고 있었다 — 수집표가 반쪽이면
       '다음엔 저거'가 절반만 생긴다. 지금 세계의 것을 보여 준다. */
    let list;
    if(typeof MODES!=='undefined' && MODES[this.realm]){
      list = MODES[this.realm].list().map(D=>({id:D.id, ko:D.ko, mode:this.realm}));
    } else if(this.realm==='jungle'){
      list = Object.entries(JUNGLE).map(([id,d])=>({id, ko:d.ko, jungle:true}));
    } else {
      list = SPECIES.filter(sp=>!SEA_LIKE_JUNGLE[sp.id]).map(sp=>({id:sp.id, ko:sp.ko, jungle:false}));
    }
    const got  = list.filter(x=>seen[x.id]).length;

    c.font='700 32px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
    const wname = this.realm==='sea' ? '바다' : this.realm==='jungle' ? '정글'
                : ((typeof MODES!=='undefined' && MODES[this.realm]) ? MODES[this.realm].ko : this.realm);
    c.fillText(wname+` ${list.length}종 중 ${got}종을 그렸어요`, VW/2, 42);
    /* 채워지는 막대 — 숫자보다 먼저 읽힌다 */
    const bw=Math.min(560, VW*0.44), bx=VW/2-bw/2, by=60;
    c.fillStyle='rgba(255,255,255,.12)'; UI.round(c,bx,by,bw,12,6); c.fill();
    if(got){ c.fillStyle=PAL.gold; UI.round(c,bx,by,bw*got/list.length,12,6); c.fill(); }

    const cols=8, cw=150, chh=122, x0=VW/2-cols*cw/2, y0=92, per=cols*4;
    const pages=Math.max(1, Math.ceil(list.length/per));
    if(this.codexPage>=pages) this.codexPage=0;
    const page=this.codexPage;
    /* 내가 그린 그림 중 그 종의 마지막 것 */
    const mineBy={};
    for(const b of [...this.creatures,...this.animals])
      if(b.mine) mineBy[b.spId||b.id]=b;

    list.slice(page*per,(page+1)*per).forEach((sp,i)=>{
      const x=x0+(i%cols)*cw, y=y0+((i/cols)|0)*chh;
      const has=!!seen[sp.id];
      c.fillStyle= has? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.035)';
      UI.round(c,x+5,y+5,cw-10,chh-10,12); c.fill();
      c.strokeStyle= has? 'rgba(255,201,74,.5)' : 'rgba(255,255,255,.10)';
      c.lineWidth=2; c.stroke();
      const mine=mineBy[sp.id];
      const tpl = sp.mode ? MTemplate.get(sp.mode, sp.id)
                : sp.jungle ? JTemplate.get(sp.id) : Templates.get(sp.id);
      c.save();
      if(mine && mine.tex){                       // 내가 칠한 그대로
        const iw=cw-34, ih=iw*TEX_H/TEX_W;
        c.drawImage(mine.tex, x+17, y+14, iw, ih);
      } else if(tpl){                             // 아직 안 그린 종 — 흐린 도안
        c.globalAlpha = has? 0.85 : 0.16;
        const iw=cw-22, ih=iw*TH/TW;
        c.drawImage(tpl.ink, x+11, y+12, iw, ih);
      }
      c.restore();
      c.font='600 15px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle= has? PAL.white : 'rgba(255,255,255,.34)';
      c.fillText(sp.ko, x+cw/2, y+chh-16);
      if(seen[sp.id]>1){                          // 여러 번 그린 종
        c.font='700 13px Galmuri11, sans-serif'; c.fillStyle=PAL.gold;
        c.fillText('×'+seen[sp.id], x+cw-22, y+22);
      }
    });

    UI.btn(c,'back', 24, VH-112, 100,88, (g,r)=>{ if(!Icons.draw(g,'btn-back',76)) UI.icon.back(g,r); });
    /* 바다↔정글 — 도감도 세계를 따라간다 */
    const order=this.realmOrder();
    const nx=order[(order.indexOf(this.realm)+1)%order.length];
    const nxName = nx==='sea'?'바다' : nx==='jungle'?'정글'
                 : ((typeof MODES!=='undefined'&&MODES[nx])?MODES[nx].ko:nx);
    UI.btn(c,'crealm', VW/2-230, VH-108, 200,84, (g,r)=>{
      g.font='700 21px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.gold; g.fillText(nxName+' 도감 →', 0, -8); });
    if(pages>1){
      UI.btn(c,'cpage', VW/2+40, VH-108, 200,84, (g,r)=>{
        g.font='700 21px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('다음 장  '+(page+1)+'/'+pages, 0, -8); });
    }
    this._codexPages=pages;
  },

};

/* ── 이름 입력 — 진짜 HTML input 을 쓴다.
   ⚠ 캔버스에 한글 키보드를 그리는 건 아이에게 너무 어렵다.
     태블릿에서는 OS 키보드가 뜨는 게 가장 자연스럽고 한글 조합도 정확하다. */
const NameBox = {
  el:null, done:undefined,
  open(prev){
    this.done=undefined;
    if(!this.el){
      const w=document.createElement('div');
      w.id='namebox';
      w.innerHTML=`<input id="nb-in" maxlength="8" placeholder="이름" autocomplete="off">
        <div class="nb-row"><button id="nb-ok">이름 달고 보내기</button>
        <button id="nb-skip">이름 없이 보내기</button></div>`;
      document.body.appendChild(w);
      this.el=w;
      w.querySelector('#nb-ok').onclick=()=>{ this.done=w.querySelector('#nb-in').value.trim(); };
      w.querySelector('#nb-skip').onclick=()=>{ this.done=''; };
      w.querySelector('#nb-in').addEventListener('keydown',e=>{
        if(e.key==='Enter') this.done=e.target.value.trim(); });
    }
    const inp=this.el.querySelector('#nb-in');
    inp.value=prev||'';
    this.el.style.display='flex';
    setTimeout(()=>inp.focus(),50);
  },
  poll(){ return this.done===undefined ? null : this.done; },
  close(){ if(this.el) this.el.style.display='none'; this.done=undefined; },
};

</script>
<script>
/* ===== js/80_admin.js ===== */
/* ══════════════════════════════════════════════════════════════════
   운영자 화면 — 전시장에서 하루를 운영하려면 반드시 필요한 것들.

   ⚠ 아이가 절대 못 열어야 한다. 화면 구석을 정해진 순서로 눌러야 열린다.
   ⚠ 지우기는 되돌릴 수 없다 — 반드시 두 번 묻는다.
   운영자가 실제로 하는 일:
     · 부적절한 낙서 하나만 지우기
     · 하루가 끝나면 전부 비우기
     · 오늘 만든 걸 파일로 내보내기 (기록·인쇄용)
     · 지금 몇 장인지, 저장이 얼마나 찼는지 보기
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Admin = {
  open:false, page:0, sel:null, confirm:null, msg:'', msgT:0,
  /* ⚠ 비밀 열기 — 처음엔 네 모서리 순서로 했는데 **왼쪽 아래가 '그리기' 버튼과
     겹쳐서** 버튼이 먼저 먹었다(실측). 아이가 가장 많이 누르는 버튼이다.
     왼쪽 위 모서리를 **3초 길게 누르기**로 바꾼다 — 거기엔 버튼이 없고,
     아이는 길게 누르지 않는다. 키오스크의 표준 방식이기도 하다. */
  holdT:0, HOLD:180, CORNER:120,

  inCorner(){ return Input.down && Input.x<this.CORNER && Input.y<this.CORNER; },
  /* 탱크 화면에서 매 프레임 부른다 */
  watchHold(){
    if(this.open) return;
    if(this.inCorner()){
      this.holdT++;
      if(this.holdT>=this.HOLD){ this.holdT=0; this.enter(); }
    } else this.holdT=0;
  },
  /* 누르는 동안 진행 표시 — 운영자가 되고 있는지 알아야 한다 */
  drawHold(c){
    if(this.open || this.holdT<20) return;
    const k=this.holdT/this.HOLD;
    c.save();
    c.strokeStyle='rgba(255,201,74,.85)'; c.lineWidth=6;
    c.beginPath(); c.arc(this.CORNER/2, this.CORNER/2, 34, -Math.PI/2, -Math.PI/2+TAU*k);
    c.stroke(); c.restore();
  },

  enter(){ this.open=true; this.page=0; this.sel=null; this.confirm=null; Sfx.join(); },
  close(){ this.open=false; this.confirm=null; Sfx.ui(); },
  say(s){ this.msg=s; this.msgT=140; },

  /* 지금 화면의 내 그림 목록 (바다+정글 합쳐서) */
  all(){ return Game.creatures.concat(Game.animals).filter(b=>b.mine); },

  /* ── 동작 ────────────────────────────────────────── */
  deleteOne(b){
    let i=Game.creatures.indexOf(b);
    if(i>=0) Game.creatures.splice(i,1);
    else { i=Game.animals.indexOf(b); if(i>=0) Game.animals.splice(i,1); }
    Game.dropOrder();
    /* 저장에서도 지운다 — 화면에서만 지우면 다시 켤 때 살아난다 */
    const list=Save.data.creatures||[];
    const idx=list.findIndex(r=>r.n===b.name && r.sp===(b.spId||b.id));
    if(idx>=0){ if(typeof Net!=='undefined') Net.remove(list[idx].id); list.splice(idx,1); }
    Save.write();
    this.sel=null;
    this.say('한 마리를 지웠어요');
  },
  clearAll(){
    Game.creatures=Game.creatures.filter(c=>!c.mine);
    Game.animals=Game.animals.filter(a=>!a.mine);
    Save.data.creatures=[]; Save.data.made=0; Save.write();
    Game.dropOrder();
    if(typeof Net!=='undefined') Net.clear();
    this.say('전부 비웠어요');
  },
  /* 오늘 만든 것을 한 장의 시트로 — 인쇄·기록용 */
  exportSheet(){
    const list=Save.data.creatures||[];
    if(!list.length){ this.say('내보낼 게 없어요'); return; }
    const cols=6, cw=200, ch=150, pad=16;
    const rows=Math.ceil(list.length/cols);
    const c=document.createElement('canvas');
    c.width=cols*cw+pad*2; c.height=rows*ch+pad*2+56;
    const x=c.getContext('2d');
    x.fillStyle='#fdfaf3'; x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#12212e'; x.font='700 30px Galmuri11, sans-serif'; x.textAlign='left';
    const d=new Date();
    x.fillText(`그린바다 · ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} · ${list.length}마리`, pad, pad+30);
    let done=0;
    list.forEach((rec,i)=>{
      const img=new Image();
      img.onload=()=>{
        const px=pad+(i%cols)*cw, py=pad+56+((i/cols)|0)*ch;
        x.drawImage(img, px+8, py+6, cw-16, (cw-16)*TEX_H/TEX_W);
        x.fillStyle='#12212e'; x.font='600 15px Galmuri11, sans-serif'; x.textAlign='center';
        x.fillText(rec.n||'', px+cw/2, py+ch-10);
        if(++done===list.length) this.download(c);
      };
      img.onerror=()=>{ if(++done===list.length) this.download(c); };
      img.src=rec.d;
    });
  },
  download(canvas){
    try{
      const a=document.createElement('a');
      const d=new Date();
      a.download=`greensea-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.png`;
      a.href=canvas.toDataURL('image/png');
      document.body.appendChild(a); a.click(); a.remove();
      this.say('내려받았어요');
    }catch(e){ this.say('내려받기 실패'); }
  },
  usage(){
    let n=0;
    try{ n=(localStorage.getItem(Save.key)||'').length; }catch(e){}
    return { kb:Math.round(n/1024), pct:Math.min(100, Math.round(n/(5*1024*1024)*100)) };
  },

  /* ── 조작 ────────────────────────────────────────── */
  update(){
    if(!this.open) return;
    if(this.msgT>0) this.msgT--;
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(this.confirm){
      if(id==='yes'){ this.confirm.run(); this.confirm=null; }
      else if(id==='no'){ this.confirm=null; Sfx.ui(); }
      return;
    }
    if(id==='close'){ this.close(); return; }
    if(id==='export'){ this.exportSheet(); Sfx.ui(); return; }
    if(id==='clear'){
      this.confirm={ text:`정말 ${this.all().length}마리를 전부 지울까요?`,
                     run:()=>this.clearAll() };
      Sfx.ui(); return; }
    if(id==='pg'){ this.page++; Sfx.ui(); return; }
    if(id && id.startsWith('d:')){
      const b=this.all()[+id.slice(2)];
      if(b) this.confirm={ text:`「${b.name||'이름 없음'}」을 지울까요?`, run:()=>this.deleteOne(b) };
      Sfx.ui(); return;
    }
  },

  /* ── 그리기 ──────────────────────────────────────── */
  /* 서버에서 LAN 주소를 한 번 받아 둔다 */
  fetchLan(){
    if(this._lanAsked) return;
    this._lanAsked=true;
    fetch('api/health').then(r=>r.json()).then(j=>{
      this.lan=j.lan||[]; this.port=j.port;
    }).catch(()=>{ this.lan=[]; });
  },
  draw(c){
    if(!this.open) return;
    this.fetchLan();
    c.fillStyle='rgba(8,14,24,.94)'; c.fillRect(0,0,VW,VH);
    const u=this.usage();
    c.font='700 30px Galmuri11, sans-serif'; c.textAlign='left'; c.fillStyle=PAL.gold;
    c.fillText('운영자', 32, 26);
    c.font='600 18px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    const list=this.all();
    c.fillText(`화면 ${list.length}마리 · 저장 ${Save.data.creatures.length}장 · ${u.kb}KB (${u.pct}%)`, 32, 62);

    /* 여러 기기로 쓰는 법 — ⚠ 전시장에서 제일 먼저 막히는 게 '주소를 모르는 것'이다.
       localhost 는 다른 기기에서 안 열리므로 서버가 알려준 LAN 주소를 띄운다. */
    const net=(typeof Net!=='undefined')?Net:null;
    const role=net?net.role:'solo';
    const host=(this.lan&&this.lan[0]) ? this.lan[0]+':'+(this.port||location.port) : null;
    c.textAlign='right';
    c.font='700 19px Galmuri11, sans-serif';
    c.fillStyle = role==='solo' ? PAL.dim : PAL.green;
    c.fillText('이 기기: '+(role==='paint'?'색칠용':role==='stage'?'큰 화면':'혼자 쓰기')
               + (net&&net.on?' · 서버 연결됨':''), VW-32, 26);
    c.font='600 16px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    if(host){
      c.fillText('색칠 태블릿 →  '+host+'/?role=paint', VW-32, 50);
      c.fillText('큰 화면 →  '+host+'/?role=stage', VW-32, 72);
    } else {
      c.fillText('주소를 받는 중…  (서버가 꺼져 있으면 혼자 쓰기)', VW-32, 50);
    }
    c.textAlign='left';

    /* 격자 */
    const cols=8, cw=142, chh=118, x0=32, y0=104, per=cols*3;
    const page=this.page % Math.max(1, Math.ceil(list.length/per));
    list.slice(page*per,(page+1)*per).forEach((b,i)=>{
      const x=x0+(i%cols)*cw, y=y0+((i/cols)|0)*chh;
      const gi=page*per+i;
      UI.btn(c,'d:'+gi, x, y, cw-10, chh-10, (g,r)=>{
        if(b.tex) g.drawImage(b.tex, -(cw-30)/2, -(chh-46)/2, cw-30, (cw-30)*TEX_H/TEX_W);
        g.font='600 14px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText(b.name||'-', 0, chh/2-22);
        /* 지우기 표시 */
        g.fillStyle=PAL.red; g.font='700 16px Galmuri11, sans-serif';
        g.fillText('✕', (cw-10)/2-14, -(chh-10)/2+4);
      });
    });
    if(!list.length){
      c.font='600 22px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.dim;
      c.fillText('아직 만들어진 그림이 없어요', VW/2, VH*0.42);
    }

    /* 버튼 */
    const S=86, y=VH-S-22;
    UI.btn(c,'export', 32, y, 220, S, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('내보내기', 0, -8);
      g.font='600 13px Galmuri11, sans-serif'; g.fillStyle=PAL.dim;
      g.fillText('오늘 그림 한 장으로', 0, 14);
    });
    UI.btn(c,'clear', 268, y, 220, S, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.red; g.fillText('전부 비우기', 0, -8);
      g.font='600 13px Galmuri11, sans-serif'; g.fillStyle=PAL.dim;
      g.fillText('되돌릴 수 없어요', 0, 14);
    });
    if(list.length>per) UI.btn(c,'pg', 504, y, 120, S, (g,r)=>{
      g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('다음 장', 0, -4); });
    UI.btn(c,'close', VW-172, y, 140, S, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('닫기', 0, -4); });

    /* 확인 — 지우기는 반드시 두 번 묻는다 */
    if(this.confirm){
      c.fillStyle='rgba(8,14,24,.9)'; c.fillRect(0,0,VW,VH);
      c.font='700 30px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
      c.fillText(this.confirm.text, VW/2, VH*0.38);
      UI.btn(c,'no', VW/2-250, VH*0.52, 220, 96, (g,r)=>{
        g.font='700 26px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('아니요', 0, -6); });
      UI.btn(c,'yes', VW/2+30, VH*0.52, 220, 96, (g,r)=>{
        g.font='700 26px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.red; g.fillText('네, 지울게요', 0, -6); });
    }
    if(this.msgT>0){
      c.globalAlpha=Math.min(1,this.msgT/25);
      c.font='700 24px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.green;
      c.fillText(this.msg, VW/2, VH-140);
      c.globalAlpha=1;
    }
  }
};

</script>
<script>
/* ===== js/85_selftest.js ===== */
/* 자체 점검 — 주소 끝에 ?selftest=1 을 붙이면 돈다.
   ⚠ 왜 있나: 2026-08-28 하루에 잡은 결함 2개가 전부 "눌러보지 않아서"였다.
      · 바다↔정글 버튼이 찾기 버튼 안에 완전히 들어가 영영 안 눌렸다
      · 종 고르기 40칸 중 22칸이 화면 밖이라 절반을 고를 수 없었다
      둘 다 화면은 멀쩡해 보였다. 눈으로는 안 잡힌다 — 좌표로 잡아야 한다.
   운영 전에 1분이면 끝난다. */
const SelfTest = {
  on:false, lines:[], t:0,

  boot(){
    if(!/[?&]selftest=1/.test(location.search)) return;
    this.on=true;
    setTimeout(()=>this.run(), 3500);      // 어셋 로딩을 기다린다
  },

  /* 한 화면을 그려 보고 버튼 배치를 검사한다 */
  probe(label, setup){
    const bad=[];
    try{ setup(); }catch(e){ return [label+' — 진입 실패: '+e.message]; }
    try{ Game.draw(); }catch(e){ return [label+' — 그리기 실패: '+e.message]; }
    const bs=UI.btns.slice();
    if(!bs.length) return [];
    const S=Screen;
    /* ⚠ 화면이 아직 안 잡혔으면(창 크기 0, 배율 0) 화면 좌표 검사는 건너뛴다.
       그 상태로 재면 모든 버튼이 '0px — 아이 손가락에 작다'로 나온다.
       멀쩡한 것을 결함으로 보고하는 검사기는 검사기가 아니다(실측 144건 오탐). */
    const screenReady = S && S.scale > 0.05 && S.cssW > 50 && S.cssH > 50;
    for(let i=0;i<bs.length;i++){
      const a=bs[i];
      if(a.x<-1||a.y<-1||a.x+a.w>VW+1||a.y+a.h>VH+1)
        bad.push(`${label}: '${a.id}' 가 화면 밖 (${Math.round(a.x)},${Math.round(a.y)})`);
      /* ⚠ 게임 좌표로만 보면 못 잡는다 — 화면 맞춤이 cover 였을 때
         좌표상으론 멀쩡한데 실제로는 25% 가 잘려 나갔다.
         실제 화면 픽셀로 환산해서 다시 본다. */
      if(screenReady){
        const ax=S.ox+a.x*S.scale, ay=S.oy+a.y*S.scale;
        const zx=ax+a.w*S.scale,  zy=ay+a.h*S.scale;
        if(ax<-1||ay<-1||zx>S.cssW+1||zy>S.cssH+1)
          bad.push(`${label}: '${a.id}' 가 실제 화면 밖으로 잘린다`);
        if(Math.min(a.w,a.h)*S.scale < 38)
          bad.push(`${label}: '${a.id}' 가 ${Math.round(Math.min(a.w,a.h)*S.scale)}px — 아이 손가락에 작다`);
      }
      /* 가운데를 눌렀을 때 자기가 잡히는가 — 겹침보다 이게 본질이다 */
      const hit=UI.hit({x:a.x+a.w/2, y:a.y+a.h/2});
      if(hit!==a.id) bad.push(`${label}: '${a.id}' 를 눌러도 '${hit}' 가 잡힌다`);
    }
    return bad;
  },

  async run(){
    const L=[]; const keep={state:Game.state, realm:Game.realm, page:Game.pickPage};
    /* ⚠ 건너뛰기는 가드가 아니라 구멍이었다 — 첫 화면 맞춤(Screen.fit)이
       점검보다 늦게 끝나서, 화면이 멀쩡한데도 매번 '건너뛰었다'만 찍혔다.
       거짓 실패를 막으려던 것이 검사 자체를 영영 안 돌게 만들었다.
       건너뛰지 말고 **기다린다**. 그래도 안 잡히면 그건 진짜 결함이다. */
    for(let tries=0; tries<20 && !(Screen && Screen.scale>0.05 && Screen.cssW>50); tries++)
      await new Promise(r=>setTimeout(r,150));
    if(!(Screen && Screen.scale>0.05 && Screen.cssW>50))
      L.push('✗ 3초를 기다려도 화면 크기가 안 잡힌다 — 버튼 검사를 못 했다');

    const push=a=>{ for(const x of a) L.push('✗ '+x); };

    /* 신규 세계도 바다·정글과 같은 화면/손가락 기준을 통과해야 한다.
       목록이 JS에는 있어도 이미지·anchor가 덜 오면 여기서 바로 보인다. */
    const realms=Game.realmOrder();
    for(const realm of realms){
      push(this.probe(realm+' 수족관', ()=>{ Game.realm=realm; Game.state=ST.TANK; }));
      /* 고르기는 페이지를 끝까지 넘겨 본다 — 마지막 페이지에서 깨지는 일이 많다 */
      for(let p=0;p<6;p++){
        const n=Game._pickPages||1;
        if(p>=n && p>0) break;
        push(this.probe(`${realm} 고르기 ${p+1}쪽`, ()=>{ Game.realm=realm; Game.state=ST.PICK; Game.pickPage=p; }));
      }
      if(typeof MODES!=='undefined' && MODES[realm]){
        const first=MTemplate.ready(realm)[0];
        if(first) push(this.probe(realm+' 색칠', ()=>{ Paint.open(first.id,realm); Game.state=ST.PAINT; }));
      }
    }
    push(this.probe('색칠', ()=>{ Paint.open('clownfish'); Game.state=ST.PAINT; }));
    push(this.probe('도감', ()=>{ Game.state=ST.CODEX; }));

    /* 도안이 실제로 준비됐는가 — 없으면 아이가 고를 수 없다.
       ⚠ 아직 받는 중인 것을 '없다'고 세면 멀쩡한 어셋을 결함으로 보고한다.
         못 채운 게 있으면 조금 더 기다렸다 다시 센다. */
    const seaAll=SPECIES.filter(s=>!SEA_LIKE_JUNGLE[s.id]);
    const junAll=Object.keys(JUNGLE);
    /* ⚠ 6번×0.7초는 **로컬 기준**이었다. 라이브(gamerclock)에서 같은 검사를 돌리니
       멀쩡한 배포를 '정글 0/39 · 공룡 0/50' 으로 4건 실패 처리했다 — 1,200장을
       네트워크로 받는 중이었을 뿐이다(정글이 다 차는 데 8초).
       멀쩡한 것을 결함으로 세는 검사기는 검사기가 아니다.
       숫자가 **더 이상 늘지 않을 때까지** 기다린다 — 로컬은 그대로 빠르다. */
    let seaN=0, junN=0;
    for(let tries=0; tries<50; tries++){
      seaN=seaAll.filter(s=>Templates.get(s.id)).length;
      junN=junAll.filter(id=>JTemplate.get(id)).length;
      if(seaN===seaAll.length && junN===junAll.length) break;
      await new Promise(r=>setTimeout(r,700));
    }
    L.push(`· 도안 준비 — 바다 ${seaN}/${seaAll.length} · 정글 ${junN}/${junAll.length}`);
    /* ⚠ 못 받은 것과 아직 오는 것은 다르다. 라이브에서 '고릴라 없음' 이라 보고했는데
       파일은 200 이었고 35초 뒤에 도착했다. **404 가 났을 때만** 결함이다. */
    const seaFail=Object.keys(Templates.failed||{}).length;
    const junFail=Object.keys(JTemplate.failed||{}).length;
    if(seaN<seaAll.length){
      const miss=seaAll.filter(s=>!Templates.get(s.id)).map(s=>s.ko).join(' ');
      L.push((seaFail?'✗ 바다 도안 못 받음(404) — ':'· 바다 도안이 아직 오는 중 — ')+miss);
    }
    if(junN<junAll.length){
      const miss=junAll.filter(id=>!JTemplate.get(id)).map(id=>JUNGLE[id].ko).join(' ');
      L.push((junFail?'✗ 정글 도안 못 받음(404) — ':'· 정글 도안이 아직 오는 중 — ')+miss);
    }

    /* 새 세 모드는 실물 파일과 부위 anchor가 모두 있어야만 고르기·제출이 성립한다. */
    if(typeof MODES!=='undefined') for(const mode of ['dino','robot','bug']){
      /* ⚠ '3초간 안 늘면 없는 것' 으로 끊었더니 라이브에서 또 오판했다 —
         네트워크는 뭉텅이로 온다(정글 4/39 로 보고했는데 잠시 뒤 다 찼다).
         시간이 아니라 **실제 로딩 실패**로 끝낸다. 최대 35초까지 기다리되,
         한 장이라도 404 가 나면 그 즉시 진짜 결함이다. */
      const all=MODES[mode].list(); let loaded=0, anchored=0;
      for(let tries=0;tries<50;tries++){
        MTemplate.prefetch(mode);
        loaded=all.filter(s=>MTemplate.get(mode,s.id)).length;
        anchored=all.filter(s=>!s.part || !!MAnchor.of(mode,s.id,s.part)).length;
        if(loaded===all.length && anchored===all.length) break;
        if((MTemplate.failed[mode]||{size:0}).size) break;
        await new Promise(r=>setTimeout(r,700));
      }
      const fail=(MTemplate.failed[mode]||{size:0}).size;
      if(fail) L.push(`✗ ${MODES[mode].ko} 어셋 ${fail}장을 못 받았다 (404) — assets/${MODES[mode].folder}/`);
      L.push(`· ${MODES[mode].ko} 준비 — 도안 ${loaded}/${all.length} · 부위 anchor ${anchored}/${all.length}`);
      if(loaded<all.length && !fail) L.push(`· ${MODES[mode].ko} 도안 ${all.length-loaded}종이 아직 오는 중 (404 는 없다)`);
      if(anchored<all.length) L.push(`✗ ${MODES[mode].ko} 움직이는 부위 anchor 일부가 없다`);
    }

    /* 만졌을 때 — **종마다 다른 소리와 말**이 붙어 있는가.
       ⚠ 새 모드 150종이 반응 8가지를 쓰는데 소리도 말도 없어서, 전부 같은 '삐' 와
         '안녕!' 이었다. 종이 다른 걸 귀로도 글로도 알 수 없었다.
         새 반응을 만들면 여기서 걸린다. */
    {
      const kinds=new Set();
      try{
        if(typeof SEA_REACT!=='undefined') Object.values(SEA_REACT).forEach(k=>kinds.add(k));
        if(typeof JUNGLE_REACT!=='undefined') Object.values(JUNGLE_REACT).forEach(k=>kinds.add(k));
        if(typeof MODES!=='undefined') for(const m of ['dino','robot','bug'])
          if(MODES[m]) MODES[m].list().forEach(D=>kinds.add(D.react||'wiggle'));
        const src=Sfx.creature.toString();
        const noSfx=[...kinds].filter(k=>!src.includes("case '"+k+"'"));
        const noSay=[...kinds].filter(k=>!REACT_SAY[k]);
        if(noSfx.length) L.push('✗ 소리 없는 반응 — '+noSfx.join(' '));
        if(noSay.length) L.push('✗ 말 없는 반응 — '+noSay.join(' '));
        if(!noSfx.length && !noSay.length)
          L.push(`· 만졌을 때 반응 ${kinds.size}가지 — 소리·말 모두 있음`);
      }catch(e){ L.push('✗ 반응 검사 중 오류 — '+e.message); }
    }

    /* 세계마다 먹이·찾기가 **다음 프레임까지 살아 있는가.**
       ⚠ Game.W 는 getter 라 읽을 때마다 세계를 다시 '설정'했다. 그 설정이
         foods 와 findT 를 비워서, 새 모드에선 먹이를 뿌려도 그 프레임에 사라지고
         '내 것 찾기'가 켜지자마자 꺼졌다(실측: 뿌린 직후 0알).
         화면은 멀쩡했다 — 아무 일도 안 일어날 뿐이었다. 그래서 여기서 잰다. */
    {
      const keepR=Game.realm;
      for(const realm of ['sea','jungle','dino','robot','bug']){
        if(realm!=='sea' && realm!=='jungle' && !(typeof MODES!=='undefined' && MODES[realm])) continue;
        Game.realm=realm;
        try{
          realm==='sea' ? Game.W.dropFood(VW/2, VH*0.3) : Game.W.dropFood(VW/2);
          const n=Game.W.foods.length;                 // 두 번째 읽기
          Game.W.findT=200;
          const t=Game.W.findT;                        // 세 번째 읽기
          if(!n) L.push(`✗ ${realm}: 먹이를 뿌렸는데 다음 읽기에 사라진다`);
          if(t!==200) L.push(`✗ ${realm}: '내 것 찾기'가 켜지자마자 꺼진다`);
          Game.W.foods.length=0; Game.W.findT=0;
        }catch(e){ L.push(`✗ ${realm}: 먹이·찾기 검사 중 오류 — ${e.message}`); }
      }
      Game.realm=keepR;
    }

    /* P19 보물상자 꾸미기도 도안만큼 실제 파일이 중요하다. 빈 상자는 보여도
       아이가 받는 장식이 코드 임시 그림으로 보이면 출시 품질이 아니다. */
    if(typeof Items!=='undefined'){
      let itemN=0, chestBurst=false;
      for(let tries=0; tries<6; tries++){
        itemN=ITEMS.filter(([id])=>!!Items.get(id)).length;
        chestBurst=typeof FXA!=='undefined' && !!FXA.get('fx-chest-burst');
        if(itemN===ITEMS.length && chestBurst) break;
        await new Promise(r=>setTimeout(r,700));
      }
      L.push(`· 보물 장식 준비 — ${itemN}/${ITEMS.length}종 · 상자 빛 ${chestBurst?'준비':'없음'}`);
      if(itemN<ITEMS.length) L.push('✗ 보물 장식 PNG 일부가 없다 — assets/item/을 확인');
      if(!chestBurst) L.push('✗ 보물상자 빛 PNG가 없다 — assets/ui/fx-chest-burst.png을 확인');
    }

    /* 저장 용량 */
    try{
      const kb=((localStorage[Save.key]||'').length/1024);
      L.push(`· 저장 ${(Save.data.creatures||[]).length}마리 ${kb.toFixed(0)}KB`);
      if(kb>4000) L.push('✗ 저장 용량이 4MB 를 넘었다 — 오래된 것부터 지워질 수 있다');
    }catch(e){}

    /* 자라는 세계 */
    if(typeof Grow!=='undefined'){
      const n=Grow.next();
      L.push(`· 수조 "${Grow.STEPS[Grow.level()].ko}" · 생명력 ${Grow.vit()}`
             + (n? ` (다음 ${n.at})` : ' (다 자랐다)'));
    }
    /* 세계 차례 — 어셋이 준비된 모드만 돈다 */
    if(typeof Game!=='undefined' && Game.realmOrder){
      const order=Game.realmOrder();
      const names=order.map(r=> r==='sea'?'바다' : r==='jungle'?'정글'
                              : ((typeof MODES!=='undefined'&&MODES[r])?MODES[r].ko:r));
      L.push('· 세계 '+order.length+'개 — '+names.join(' → '));
      if(typeof MTemplate!=='undefined')
        for(const m of ['dino','robot','bug'])
          if(typeof MODES!=='undefined' && MODES[m]){
            const rd=MTemplate.ready(m).length, all=MODES[m].list().length;
            if(rd<all) L.push(`  · ${MODES[m].ko} 도안 ${rd}/${all}`);
          }
    }
    /* 서버 */
    try{
      const r=await fetch('api/health'); const j=await r.json();
      L.push(`· 서버 정상 (${j.n}마리 보관)`);
    }catch(e){ L.push('· 서버 없음 — 혼자 쓰는 모드'); }

    Game.state=keep.state; Game.realm=keep.realm; Game.pickPage=keep.page;
    const fails=L.filter(x=>x[0]==='✗').length;
    L.unshift(fails ? `✗ 문제 ${fails}건` : '✓ 이상 없음');
    this.lines=L; this.t=0;
    console.log('[자체 점검]\n'+L.join('\n'));
  },

  draw(c){
    if(!this.on || !this.lines.length) return;
    /* 결과를 읽었으면 아무 데나 눌러 닫는다 — 안 그러면 화면을 계속 가린다 */
    if(this.t>30 && Input.tapped){ this.lines=[]; Input.tapped=null; return; }
    this.t++;
    const H=Math.min(VH-40, 44+this.lines.length*26);
    c.save();
    c.fillStyle='rgba(8,20,34,.92)';
    UI.round(c, 20, 20, VW-40, H, 16); c.fill();
    c.strokeStyle=this.lines[0][0]==='✓' ? '#7ddf7d' : '#ff8a8a';
    c.lineWidth=3; c.stroke();
    c.textAlign='left';
    this.lines.forEach((s,i)=>{
      c.font=(i===0?'700 24px':'600 19px')+' Galmuri11, sans-serif';
      c.fillStyle = s[0]==='✗' ? '#ff9a9a' : (s[0]==='✓' ? '#9de89d' : 'rgba(255,255,255,.82)');
      c.fillText(s, 40, 54+i*26);
    });
    c.restore();
  },
};

</script>
<script>
/* ===== js/99_main.js ===== */
'use strict';
let _last=0;
function frameStep(now){
  let dt=(now-_last)/1000; if(!(dt>0)) dt=0.016; dt=Math.min(0.05,dt); _last=now;
  Game.update(dt); Game.draw();
}
function loop(now){ frameStep(now); requestAnimationFrame(loop); }
addEventListener('DOMContentLoaded',()=>{
  Screen.init(); Input.init(); Save.load();
  if(typeof Net!=='undefined') Net.init();
  Sfx.on = Save.data.sound!==false;
  Game.init(); Icons.prefetch(); BG.prefetch(); if(typeof Items!=='undefined') Items.prefetch(); Props.prefetch(); FX.prefetch(); JWorld.prefetch(); JTemplate.prefetch();
  const gate=document.getElementById('gate');
  const start=()=>{
    Sfx.unlock();
    /* ⚠ 앰비언스는 사용자 제스처 뒤에만 시작할 수 있다(브라우저 정책) */
    if(typeof Amb!=='undefined'){ Amb.init(Sfx); Amb.set(Game.realm); }
    gate.remove();
  };
  document.getElementById('go').onclick=start;
  /* ⚠ 큰 화면(프로젝터·TV)에는 **누를 사람이 없다.** 그런데 '시작하기' 버튼이
     떠서 직원이 와서 눌러 줄 때까지 제목 화면이 걸려 있었다.
     역할이 stage 면 스스로 들어간다. 소리는 브라우저 정책상 제스처가 필요하므로
     아무 클릭이나 들어오면 그때 켠다(큰 화면은 대개 소리 없이 쓴다). */
  if(typeof Net!=='undefined' && Net.role==='stage'){
    setTimeout(()=>{ if(gate.isConnected) gate.remove(); }, 1200);
    addEventListener('pointerdown', ()=>{
      Sfx.unlock();
      if(typeof Amb!=='undefined'){ Amb.init(Sfx); Amb.set(Game.realm); }
    }, {once:true});
  }
  if(typeof SelfTest!=='undefined') SelfTest.boot();
  _last=performance.now(); requestAnimationFrame(loop);
});

</script>
