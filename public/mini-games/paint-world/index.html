<script>
/* ===== js/65_onboard.js ===== */
/* ══════════════════════════════════════════════════════════════════
   온보딩 — 전시장에서 처음 온 아이를 위한 안내.

   ⚠ 아이는 설명을 안 읽는다. **손이 하는 걸 보고 따라 한다.**
     그래서 글자보다 '움직이는 손가락'이 먼저다.
   ⚠ 아무도 안 만지면 다시 유인해야 한다 — 전시장은 사람이 계속 바뀐다.
     20초 놀고 있으면 스스로 안내가 다시 뜬다(어트랙트 모드).
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Onboard = {
  /* 상태: 언제 무엇을 안내하나 */
  idle:0,               // 아무 입력 없이 흐른 프레임
  step:null,            // 지금 안내 중인 것
  t:0, shown:{},
  IDLE_ATTRACT: 60*20,  // 20초 놀면 다시 유인
  LIFE: 60*7,           // 안내는 7초만 떠 있다 — 그 뒤엔 스스로 물러난다
  FADE: 60*1.2,         // 마지막 1.2초는 서서히 사라진다

  /* 안내 종류 — 화면 상태에 따라 다르다 */
  pick(game){
    if(game.state===ST.TANK){
      if(!this.shown.draw) return 'draw';        // 처음: 그리기 버튼을 눌러라
      return 'attract';                          // 이후: 다시 유인
    }
    if(game.state===ST.PICK && !this.shown.pickOne) return 'pickOne';
    if(game.state===ST.PAINT){
      if(!this.shown.paint) return 'paint';      // 도안을 문질러라
      if(!this.shown.submit && this.painted(game)) return 'submit';
    }
    return null;
  },
  painted(){ /* 조금이라도 칠했나 */
    try{
      const d=Paint.fctx.getImageData(0,0,TW,TH).data;
      for(let i=3;i<d.length;i+=4*97) if(d[i]>20) return true;
    }catch(e){}
    return false;
  },
  /* 사람이 만지면 안내를 끈다 */
  touched(){
    this.idle=0;
    if(this.step){ this.shown[this.step]=true; this.step=null; this.t=0; }
  },
  update(game){
    /* 큰 화면은 아무도 안 만진다 — 안내가 계속 떠 있으면 방해만 된다 */
    if(typeof Net!=='undefined' && Net.role==='stage'){ this.step=null; return; }
    if(Input.down || Input.tapped) this.touched();
    else this.idle++;

    /* ⚠ 안내에 수명이 없어 아이가 안 만지면 **영영 떠 있었다.**
       수족관은 아이 그림이 주인공인데 말풍선이 계속 가린다.
       할 말은 한 번 하고 물러난다 — 필요하면 다시 부른다(attract). */
    if(this.step){
      this.t++;
      if(this.t > this.LIFE){
        /* attract 는 '다시 부르는' 것이라 본 것으로 치지 않는다.
           나머지는 봤다고 표시해 같은 말을 반복하지 않는다. */
        if(this.step!=='attract') this.shown[this.step]=true;
        this.step=null; this.t=0; this.idle=0;
      }
      return;
    }
    /* 처음 안내는 바로, 재유인은 놀고 있을 때만 */
    const want=this.pick(game);
    if(!want) return;
    if(want==='attract' && this.idle < this.IDLE_ATTRACT) return;
    if(want!=='attract' && this.idle < 50) return;   // 화면 바뀌고 잠깐 뒤
    this.step=want; this.t=0;
    if(want==='attract') this.idle=0;
  },

  /* ── 그리기 ─────────────────────────────────────── */
  draw(c, game){
    if(!this.step) return;
    const S=this.step;
    const pulse=(Math.sin(this.t*0.06)+1)/2;
    /* 끝날 때 툭 끊기면 아이 눈에 '사라졌다'가 아니라 '깜빡였다'로 보인다 */
    const left=this.LIFE-this.t;
    const fade=left<this.FADE ? Math.max(0,left/this.FADE) : 1;
    c.save(); c.globalAlpha=fade;

    if(S==='draw' || S==='attract'){
      /* 그리기 버튼을 가리킨다 */
      const bx=24+96*1.05, by=VH-96-24+48;
      this.spot(c, bx, by, 92+pulse*10);
      this.hand(c, bx+40+pulse*10, by+36, pulse);
      this.bubble(c, bx+30, by-104,
        S==='attract' ? '나도 그려 볼까?' : '여기를 눌러 그려요');
    }
    else if(S==='pickOne'){
      const b=UI.btns.find(x=>x.id && x.id.startsWith('sp:'));
      if(b){
        this.spot(c, b.x+b.w/2, b.y+b.h/2, Math.max(b.w,b.h)*0.72+pulse*8);
        this.hand(c, b.x+b.w/2+30+pulse*8, b.y+b.h/2+34, pulse);
        this.bubble(c, b.x+b.w/2, b.y-56, '마음에 드는 걸 고르세요');
      }
    }
    else if(S==='paint'){
      /* 손가락이 도안 위를 문지른다 */
      const bx=Paint.box();
      const k=(this.t%110)/110;
      const px=bx.x+bx.w*(0.28+0.44*k);
      const py=bx.y+bx.h*(0.5+Math.sin(k*Math.PI*2)*0.14);
      c.save();
      c.strokeStyle='rgba(255,201,74,.55)'; c.lineWidth=26; c.lineCap='round';
      c.beginPath();
      for(let i=0;i<=20;i++){
        const t=i/20*k;
        const x=bx.x+bx.w*(0.28+0.44*t), y=bx.y+bx.h*(0.5+Math.sin(t*Math.PI*2)*0.14);
        i?c.lineTo(x,y):c.moveTo(x,y);
      }
      c.stroke(); c.restore();
      this.hand(c, px, py, pulse);
      this.bubble(c, VW/2, bx.y-64,
        Paint.free ? '마음대로 그려 보세요' : '손가락으로 문질러 색칠해요');
    }
    else if(S==='submit'){
      const b=UI.btns.find(x=>x.id==='submit');
      if(b){
        this.spot(c, b.x+b.w/2, b.y+b.h/2, Math.max(b.w,b.h)*0.66+pulse*10);
        this.hand(c, b.x+b.w/2+40+pulse*10, b.y+b.h/2+38, pulse);
        this.bubble(c, b.x+b.w/2, b.y-70, '다 그렸으면 여기!');
      }
    }
    c.restore();
  },
  /* 가리키는 원 — 어두운 막에 구멍을 뚫는다 */
  spot(c,x,y,r){
    c.save();
    c.fillStyle='rgba(6,20,36,.42)';
    c.beginPath(); c.rect(0,0,VW,VH);
    c.arc(x,y,r,0,TAU,true);
    c.fill('evenodd');
    c.strokeStyle='rgba(255,201,74,.85)'; c.lineWidth=4;
    c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke();
    c.restore();
  },
  /* 손가락 — 코드로 그린다 */
  hand(c,x,y,k){
    c.save();
    c.translate(x, y+k*4);
    c.rotate(-0.32);
    c.fillStyle='#fff6e8'; c.strokeStyle='#12212e'; c.lineWidth=3;
    c.beginPath();
    c.moveTo(0,-30); c.quadraticCurveTo(9,-30, 9,-16);
    c.lineTo(9,-4);
    c.quadraticCurveTo(20,-6, 22,2);
    c.quadraticCurveTo(24,22, 12,32);
    c.quadraticCurveTo(-4,40, -14,28);
    c.quadraticCurveTo(-22,14, -18,0);
    c.quadraticCurveTo(-12,-8, -8,-2);
    c.lineTo(-8,-16);
    c.quadraticCurveTo(-8,-30, 0,-30);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  },
  /* 말풍선 */
  bubble(c,x,y,s){
    c.save();
    c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
    const w=c.measureText(s).width+44, h=54;
    c.fillStyle='rgba(255,201,74,.96)';
    UI.round(c, x-w/2, y-h/2, w, h, 16); c.fill();
    c.beginPath();
    c.moveTo(x-12, y+h/2-2); c.lineTo(x+12, y+h/2-2); c.lineTo(x, y+h/2+16);
    c.closePath(); c.fill();
    c.fillStyle='#12212e'; c.textBaseline='middle';
    c.fillText(s, x, y+1);
    c.restore();
  },
  reset(){ this.shown={}; this.step=null; this.idle=0; }
};

</script>
<script>
/* ===== js/70_game.js ===== */
/* ══════════════════════════════════════════════════════════════════
   게임 루프 — 고르기 → 색칠 → 제출 → 수조
   ══════════════════════════════════════════════════════════════════ */
'use strict';
const ST={ TANK:0, PICK:1, PAINT:2, JOIN:3, NAME:4, CHEER:5, CODEX:6, ZOOM:7 };

/* 만졌을 때 한마디 — 아이가 무슨 일이 일어났는지 알아야 또 누른다 */
const REACT_SAY = {
  puff:'복어가 빵빵!', ink:'먹물을 뿜었어요', glow:'반짝반짝 빛나요',
  pinch:'집게를 흔들어요', hide:'쏙 숨었어요', spin:'빙글 돌았어요',
  dash:'쌩 하고 달려요', blow:'물을 뿜어요', curl:'몸을 말았어요',
  wiggle:'꼬리를 흔들어요',
  trumpet:'코를 흔들어요', roar:'크게 울어요', jump:'폴짝 뛰었어요',
  swing:'대롱대롱 매달려요', flap:'날개를 퍼덕여요', fan:'꼬리를 활짝 폈어요',
  stretch:'목을 쭉 늘여요', shake:'몸을 털어요', curlup:'동그랗게 웅크려요',
  yawn:'입을 크게 벌려요', nod:'고개를 끄덕여요',
  /* 새 모드 — ⚠ 없어서 150종이 전부 '안녕!' 이었다 */
  stomp:'쿵쿵 발을 굴러요', chomp:'입을 앙 다물어요', whirl:'빙그르르 돌아요',
  snap:'딱 하고 부딪쳐요', flutter:'날개를 파르르 떨어요', roll:'데굴데굴 굴러가요',
  splash:'첨벙 튀겼어요', wave:'인사를 해요',
};

const Game = {
  state:ST.TANK, creatures:[], t:0, joinC:null, joinT:0,
  pickPage:0, mineIds:[], toast:'', toastT:0,
  pendingTex:null, myName:'', cheerT:0, zoomC:null, codexPage:0,
  /* ⚠ 바다와 정글은 무대·생물·움직임이 전부 다르다.
     한 화면에 섞지 않고 세계를 통째로 갈아 끼운다. */
  realm:'sea',            // 'sea' | 'jungle' | 'dino' | 'robot' | 'bug'
  animals:[],             // 정글 동물 (Walker)
  modeBeings:{dino:[], robot:[], bug:[]},   // 새 모드 — 몸통+부위
  /* 처음 온 아이를 위한 안내 — 손가락이 도안을 문지르는 시늉 */
  onboard:0, onboardShown:false,

  init(){
    World.init(); JWorld.init();
    /* 저장된 그림 복원 */
    /* ⚠ 정글 동물도 같은 목록에 저장되는데 전부 Creature 로 되살렸다.
       다시 켜면 코끼리가 물고기처럼 헤엄쳤다(실측). 종으로 갈라 되살린다. */
    for(const rec of (Save.data.creatures||[])){
      const img=new Image(); img.src=rec.d;
      if(rec.md && typeof MODES!=='undefined' && MODES[rec.md]){
        const mb=new ModeBeing(img, rec.md, rec.sp, rec.n, {mine:rec.m, born:rec.b, item:rec.it});
        (this.modeBeings[rec.md] || (this.modeBeings[rec.md]=[])).push(mb);
      } else if(rec.sp==='__free__'){
        /* 백지 그림 — 종이 없다. 움직임은 되살린 그림의 비율에서 다시 정한다 */
        const fc=new Creature(img, 'clownfish', rec.n, {mine:rec.m, born:rec.b, item:rec.it});
        fc.free=true;
        img.onload=()=>{ fc.motion=freeMotion(img.naturalWidth/Math.max(1,img.naturalHeight)); };
        this.creatures.push(fc);
      } else if(typeof JUNGLE!=='undefined' && JUNGLE[rec.sp]){
        this.animals.push(new Walker(img, rec.sp, rec.n, {mine:rec.m, born:rec.b, item:rec.it}));
      } else if(SP_BY_ID[rec.sp]){
        this.creatures.push(new Creature(img, rec.sp, rec.n, {mine:rec.m, born:rec.b, item:rec.it}));
      }
    }
    /* 처음이면 견본 몇 마리를 넣어 빈 수조를 피한다 */
    if(this.creatures.length<18) this.seed(24-this.creatures.length);
  },
  seed(n){
    for(let i=0;i<n;i++){
      const sp=pick(SPECIES);
      const f=document.createElement('canvas'); f.width=TW; f.height=TH;
      const fx=f.getContext('2d');
      const g=fx.createLinearGradient(0,0,TW,TH);
      const h=rndi(0,360);
      g.addColorStop(0,`hsl(${h},80%,62%)`); g.addColorStop(1,`hsl(${(h+70)%360},80%,55%)`);
      fx.fillStyle=g; fx.fillRect(0,0,TW,TH);
      for(let k=0;k<14;k++){ fx.fillStyle=`hsla(${(h+k*37)%360},90%,64%,.8)`;
        fx.beginPath(); fx.arc(rnd()*TW,rnd()*TH,10+rnd()*26,0,TAU); fx.fill(); }
      this.creatures.push(new Creature(bakeCreature(f,sp.id), sp.id, ''));
    }
  },
  say(s){ this.toast=s; this.toastT=150; },

  /* ── 가끔 거대한 친구가 지나간다 ──────────────────
     ⚠ 아이 그림은 늘 비슷한 크기라 화면이 평평하다.
       가끔 아주 큰 것이 지나가면 수조가 깊어 보이고, 무엇보다
       그게 **아이가 그린 그림**이라 "내 물고기가 저렇게 커졌다"가 된다. */
  giant:null, giantCd: 60*80,
  updGiant(){
    if(this.state!==ST.TANK && this.state!==ST.JOIN) return;
    if(this.giant){
      const g=this.giant; g.t++;
      g.x += g.spd*g.dir;
      g.y += Math.sin(g.t*0.012+g.ph)*0.5;
      if(g.x < -g.w*0.8 || g.x > VW+g.w*0.8) this.giant=null;
      return;
    }
    if(--this.giantCd>0) return;
    this.giantCd = 60*(90+rndi(0,80));
    const pool=this.beings.filter(b=>b.tex);
    if(pool.length<3) return;                       // 너무 휑할 때는 안 띄운다
    const mine=pool.filter(b=>b.mine);
    const src=pick(mine.length?mine:pool);
    const s=src.s*3.2;
    this.giant={ tex:src.tex, name:src.name||'', s,
                 w:TEX_W*s, h:TEX_H*s, t:0, ph:rnd()*TAU,
                 dir: rnd()<0.5?-1:1, spd:0.55+rnd()*0.35,
                 y: VH*(0.30+rnd()*0.24) };
    this.giant.x = this.giant.dir>0 ? -this.giant.w*0.7 : VW+this.giant.w*0.7;
    this.say((src.name? src.name+'의 ':'') + '큰 친구가 지나가요');
    Sfx.join();
  },
  drawGiant(c){
    const g=this.giant; if(!g) return;
    /* 멀리 있는 것처럼 살짝 흐리게 — 앞의 아이 그림을 잡아먹으면 안 된다 */
    c.save();
    c.globalAlpha=0.88;
    c.translate(g.x, g.y);
    if(g.dir<0) c.scale(-1,1);
    c.scale(g.s, g.s);
    c.drawImage(g.tex, -TEX_W/2, -TEX_H/2);
    c.restore();
    if(g.name){
      c.save();
      c.globalAlpha=0.9;
      c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
      const tw=c.measureText(g.name).width+30;
      c.fillStyle='rgba(10,32,54,.55)';
      UI.round(c, g.x-tw/2, g.y+g.h*0.34, tw, 38, 12); c.fill();
      c.fillStyle=PAL.white; c.fillText(g.name, g.x, g.y+g.h*0.34+26);
      c.restore();
    }
  },

  /* ── 보물상자 ─────────────────────────────────────
     가끔 나타나고, 누르면 열려 꾸미기 아이템이 하나 나온다.
     ⚠ 아이가 그린 게 없으면 줄 데가 없다 — 그때는 상자를 안 띄운다. */
  chest:null, chestCd: 60*35,
  updChest(){
    if(this.state!==ST.TANK) return;
    if(this.chest){
      this.chest.t++;
      if(this.chest.open){
        if(this.chest.t > this.chest.openAt + 150) this.chest=null;
      } else if(this.chest.t > 60*40) this.chest=null;   // 아무도 안 누르면 사라진다
      return;
    }
    if(--this.chestCd > 0) return;
    this.chestCd = 60*(50+rndi(0,40));
    if(!this.beings.some(b=>b.mine)) return;             // 줄 그림이 없다
    this.chest={ x: VW*(0.25+rnd()*0.5), y: VH*(this.realm==='sea'?0.72:0.80),
                 t:0, open:false, openAt:0, item:null, bob:rnd()*TAU };
  },
  openChest(){
    const ch=this.chest; if(!ch || ch.open) return;
    const mine=this.beings.filter(b=>b.mine);
    if(!mine.length){ this.chest=null; return; }
    ch.open=true; ch.openAt=ch.t;
    ch.item = Items.pick();
    /* 가장 최근에 그린 내 그림에게 준다 — 방금 만든 것이 제 것이라는 느낌이 가장 세다 */
    const target = mine[mine.length-1];
    ch.target = target;
    if(ch.item.startsWith('fx:')){
      /* 10초짜리 효과 — 몸이 잠깐 변한다 */
      const kind=ch.item.slice(3);
      applyEffect(target, kind);
      const e=EFFECTS[kind]||{ko:'신기한 일'};
      this.say(e.ko + ' ' + (e.sec||10) + '초!');
      if(typeof Grow!=='undefined') Grow.add('chest', ch.x, ch.y-30);
      FX.sparkle(target.x, target.y, 16);
    } else {
      target.item = ch.item;
      const def = ITEM_BY_ID[ch.item] || {ko:'선물'};
      this.say(def.ko + ' 을(를) 찾았어요!');
      if(typeof Grow!=='undefined') Grow.add('chest', ch.x, ch.y-30);
    }
    FX.confetti(ch.x, ch.y-40);
    FX.sparkle(ch.x, ch.y-30, 14);
    Sfx.join();
    /* 저장 — 다음에 와도 붙어 있다 */
    try{
      if(!ch.item.startsWith('fx:')){          // 효과는 10초짜리라 저장하지 않는다
        const recs=Save.data.creatures||[];
        for(let i=recs.length-1;i>=0;i--){
          if(recs[i].m){ recs[i].it=ch.item; break; }
        }
        Save.write();
      }
    }catch(_){}
  },
  drawChest(c){
    const ch=this.chest; if(!ch) return;
    const bob=Math.sin(ch.t*0.05+ch.bob)*5;
    const name = ch.open ? 'treasure-chest-open' : 'treasure-chest-closed';
    /* 열리는 순간의 빛 */
    if(ch.open){
      const k=(ch.t-ch.openAt)/40;
      if(k<1 && typeof FXA!=='undefined')
        FXA.draw(c,'fx-chest-burst', ch.x, ch.y-30, 240*(0.6+k*0.8), 0);
    }
    if(!Props.draw(c, name, ch.x, ch.y+bob, 92)){
      /* 어셋이 없을 때 — 궤짝을 코드로 */
      c.save(); c.translate(ch.x, ch.y+bob);
      c.fillStyle='#8b5e34'; c.strokeStyle='#12212e'; c.lineWidth=5;
      c.beginPath(); UI.round(c,-46,-40,92,40,6); c.fill(); c.stroke();
      c.fillStyle=ch.open?'#ffd23f':'#6b4526';
      c.beginPath(); UI.round(c,-46,-64,92,26,8); c.fill(); c.stroke();
      c.fillStyle='#ffd23f'; c.beginPath(); c.arc(0,-38,7,0,TAU); c.fill(); c.stroke();
      c.restore();
    }
    if(!ch.open){                       // 눌러 달라는 신호
      const p=(Math.sin(ch.t*0.09)+1)/2;
      c.save(); c.globalAlpha=0.35+p*0.4;
      c.strokeStyle=PAL.gold; c.lineWidth=4;
      c.beginPath(); c.arc(ch.x, ch.y-24+bob, 62+p*8, 0, TAU); c.stroke();
      c.restore();
    }
  },
  /* 그리기 순서 캐시를 버린다 — 생물을 지웠는데 캐시가 붙들고 있으면
     지워진 것이 몇 프레임 더 그려진다 */
  dropOrder(){ this._order=null; },
  get W(){
    if(this.realm==='sea') return World;
    if(this.realm==='jungle') return JWorld;
    ModeWorld.set(this.realm); return ModeWorld;
  },
  get beings(){
    if(this.realm==='sea') return this.creatures;
    if(this.realm==='jungle') return this.animals;
    return this.modeBeings[this.realm] || (this.modeBeings[this.realm]=[]);
  },
  /* 세계 차례 — 어셋이 준비된 모드만 돈다.
     ⚠ 도안이 하나도 없는 모드로 넘어가면 빈 화면이 된다. */
  /* 세계 차례. ⚠ '도안이 하나라도 온 세계' 만 넣었더니, 처음 10초 동안
     세계가 둘만 보였다 — 아이는 공룡이 아예 없는 줄 안다.
     선언된 세계는 늘 보여 주고, 아직 안 온 세계는 눌렀을 때 기다리게 한다.
     (어셋이 진짜 없으면 readyRealm 이 false 로 남아 흐리게 표시된다) */
  realmOrder(){
    const out=['sea','jungle'];
    for(const m of ['dino','robot','bug'])
      if(typeof MODES!=='undefined' && MODES[m] && MODES[m].list().length) out.push(m);
    return out;
  },
  readyRealm(r){
    if(r==='sea'||r==='jungle') return true;
    return !!(typeof MTemplate!=='undefined' && MTemplate.ready(r).length);
  },
  /* 특정 세계로 곧장 — 순환(switchRealm)이 아니라 지목해서 간다 */
  goRealm(r, quiet){
    if(!this.realmOrder().includes(r) || !this.readyRealm(r)) return;
    this.realm=r;
    if(typeof ModeWorld!=='undefined' && MODES[r]){
      ModeWorld.set(r); ModeWorld.init(); ModeWorld.prefetch(); MTemplate.prefetch(r);
    }
    if(r==='jungle') JTemplate.prefetch();
    if(typeof Amb!=='undefined') Amb.set(r);
    if(!quiet) this.say(this.worldName(r));
    Sfx.ui();
  },
  switchRealm(){
    const order=this.realmOrder();
    const i=order.indexOf(this.realm);
    this.realm = order[(i+1)%order.length];
    if(typeof ModeWorld!=='undefined' && MODES[this.realm]){
      ModeWorld.set(this.realm); ModeWorld.init(); ModeWorld.prefetch();
      MTemplate.prefetch(this.realm);
    }
    if(typeof Amb!=='undefined') Amb.set(this.realm);
    this.say(this.realm==='sea' ? '바다' : this.realm==='jungle' ? '정글'
             : ((MODES[this.realm]||{}).ko || this.realm));
    Sfx.ui();
    if(this.realm==='jungle') JTemplate.prefetch();
  },

  /* 1단계 — 이름을 묻는다. 이름이 있어야 아이가 자기 물고기를 찾을 수 있다 */
  askName(){
    this.pendingTex = Paint.free
      ? bakeFree(Paint.fill)
      : Paint.mode ? bakeMode(Paint.fill, Paint.mode, Paint.spId)
      : (JUNGLE[Paint.spId] ? bakeWalker(Paint.fill, Paint.spId)
                            : bakeCreature(Paint.fill, Paint.spId));
    this.pendingSp=Paint.spId; this.pendingMode=Paint.mode||null;
    this.state=ST.NAME; this.nameIdle=0;
    NameBox.open(this.myName);
  },
  submit(name){
    const tex=this.pendingTex || (JUNGLE[Paint.spId]
      ? bakeWalker(Paint.fill, Paint.spId) : bakeCreature(Paint.fill, Paint.spId));
    const spId=this.pendingSp || Paint.spId;
    this.myName = (name||'').slice(0,8);
    let c;
    const mode = this.pendingMode;
    if(mode && MODES[mode]){
      c=new ModeBeing(tex, mode, spId, this.myName, {mine:true, join:true, x:-160});
      const arr=this.modeBeings[mode] || (this.modeBeings[mode]=[]);
      while(arr.length>=200) arr.shift();
      arr.push(c);
      this.realm=mode;
      if(typeof Amb!=='undefined') Amb.set((MODES[mode]||{}).amb||'jungle');
      this.joinC=c; this.joinT=110;
      /* ⚠ 상자는 50~90초마다 나온다. 그런데 아이는 그림을 넣고 곧 자리를 뜬다 —
         정작 자기 그림을 꾸며 줄 상자를 못 보고 가는 일이 생긴다.
         **막 합류한 직후**에는 곧 나오게 당긴다(이미 떠 있으면 그대로 둔다). */
      if(!this.chest) this.chestCd = Math.min(this.chestCd, 60*12);
      this.state=ST.CHEER; this.cheerT=0;
      FX.splash(VW*0.2, c.y); FX.confetti(VW/2, VH*0.4);
      this.splashAt={x:VW*0.2, y:c.y, t:0};
      Sfx.join();
      try{
        const rec={d:Save.encode(tex), sp:spId, md:mode, n:this.myName, m:true, b:Date.now()};
        Save.data.creatures.push(rec);
        if(!Save.data.seen) Save.data.seen={};
        Save.data.seen[spId]=(Save.data.seen[spId]||0)+1;
        Save.data.made=(Save.data.made||0)+1; Save.write();
        if(typeof Net!=='undefined') Net.push({d:rec.d, sp:spId, md:mode, n:this.myName});
      }catch(_){}
      this.W.findT=200;
      this.pendingMode=null;
      return;
    }
    const isFree = (spId==='__free__');
    const snakeLike = !isFree && typeof SEA_LIKE_JUNGLE!=='undefined' && SEA_LIKE_JUNGLE[spId];
    if(isFree){
      /* 백지 그림 — 종이 없으니 깊이도 움직임도 **그린 모양**에서 정한다 */
      c=new Creature(tex, 'clownfish', this.myName, {mine:true, join:true,
        x:-140, y:VH*(0.26+rnd()*0.42)});
      c.motion = freeMotion(tex && tex.freeAR ? tex.freeAR : 1);
      c.free = true;
      while(this.creatures.length>=250) this.creatures.shift();
      this.creatures.push(c);
      this.realm='sea';
      if(typeof Amb!=='undefined') Amb.set('sea');
    } else if(snakeLike){
      c=new Creature(tex, spId, this.myName, {mine:true, join:true,
        x:-140, y:JWorld.groundY()-70});
      while(this.animals.length>=140) this.animals.shift();
      this.animals.push(c);
      this.realm='jungle';
      if(typeof Amb!=='undefined') Amb.set('jungle');
    } else if(JUNGLE[spId]){
      c=new Walker(tex, spId, this.myName, {mine:true, join:true,
        x:-160, y:JWorld.groundY()});
      while(this.animals.length>=140) this.animals.shift();
      this.animals.push(c);
      this.realm='jungle';
      if(typeof Amb!=='undefined') Amb.set('jungle');
    } else {
      c=new Creature(tex, spId, this.myName, {mine:true, join:true,
        x:-140, y:World.zoneY(pick(SP_BY_ID[spId].zone))});
      this.realm='sea';
      if(typeof Amb!=='undefined') Amb.set('sea');
    }
    /* 오래된 것부터 내보내 상한 유지 (실측: 200~300 이 60fps 상한) */
    if(!isFree && !JUNGLE[spId]){
      /* 실측: 실제 게임에서 300마리 65fps · 200마리 119fps. 250 에서 내보낸다. */
      while(this.creatures.length>=250) this.creatures.shift();
      this.creatures.push(c);
    }
    this.joinC=c; this.joinT=110;
    /* 새 모드와 같은 이유 — 방금 그림을 넣은 아이가 상자를 보고 가게 한다 */
    if(!this.chest) this.chestCd = Math.min(this.chestCd, 60*12);
    /* 2단계 — 축하 화면. 이 순간이 이 작품의 보상이다 */
    this.state=ST.CHEER; this.cheerT=0;
    FX.splash(VW*0.2, c.y); FX.confetti(VW/2, VH*0.4);
    this.splashAt={x:VW*0.2, y:c.y, t:0};
    Sfx.join();
    /* 저장 */
    try{
      const rec={d:Save.encode(tex), sp:spId, n:this.myName, m:true, b:Date.now()};
      Save.data.creatures.push(rec);
      /* 도감 — 그림은 밀려나도 '그려 봤다'는 남는다 */
      if(!Save.data.seen) Save.data.seen={};
      Save.data.seen[spId]=(Save.data.seen[spId]||0)+1;
      Save.data.made=(Save.data.made||0)+1; Save.write();
      /* 여러 대 운영 — 큰 화면으로 보낸다. 서버가 없으면 조용히 넘어간다 */
      if(typeof Net!=='undefined') Net.push({d:rec.d, sp:spId, n:this.myName});
    }catch(_){}
    this.W.findT=200;      // ⚠ World 로 박아 두면 정글에서 안 켜진다
    if(typeof Grow!=='undefined') Grow.add('draw', VW/2, VH*0.4);
    /* 같은 종이 셋 모이면 무리가 된다.
       아이들이 "우리 같이 흰동가리 그리자" 하게 만드는 게 목적이다.
       — 이미 같은 종끼리 끌리는 무리 짓기가 있으니 알려 주기만 하면 된다. */
    if(!isFree){
      const same=this.beings.filter(b=>(b.spId||b.id)===spId).length;
      if(same===3 || same===6 || same===10){
        const nm=this.kindName(c);
        this.say(nm+' 무리가 생겼어요! ('+same+'마리)');
        if(typeof Grow!=='undefined') Grow.add('herd', c.x, c.y);
        FX.confetti(c.x||VW/2, (c.y||VH*0.4)-40);
        Sfx.join();
        this.herdT=200; this.herdSp=spId;
      }
    }
  },

  update(dt){
    this.t+=dt*60;
    if(this.toastT>0) this.toastT--;
    /* 운영자 화면이 열려 있으면 게임 입력을 가로챈다 */
    if(typeof Admin!=='undefined' && Admin.open){
      this.W.update(dt);
      for(const c of this.beings) c.update(dt,this.W);
      Admin.update();
      Input.tapped=null;
      return;
    }
    if(typeof Net!=='undefined') Net.update();
    /* 온보딩 — 전시장은 사람이 계속 바뀐다. 항상 살아 있어야 한다. */
    if(typeof Onboard!=='undefined') Onboard.update(this);
    /* 소리도 상태다 — 아이가 많이 만들수록 풍성해진다 (3초에 한 번만 조정) */
    if(typeof Amb!=='undefined'){
      if(this.t%180<1) Amb.setLevel(this.beings.length);
      /* 색칠·이름 화면에서는 배경을 낮춘다 */
      const quiet = (this.state===ST.PAINT || this.state===ST.NAME);
      if(Amb._ducked !== quiet) Amb.duck(quiet);
    }
    FX.update();
    switch(this.state){
      case ST.TANK: this.updTank(dt); break;
      case ST.PICK: this.updPick(); break;
      case ST.PAINT: Paint.update(dt); this.updPaintUI(); this.updPaintIdle(); break;
      case ST.JOIN:
        this.W.update(dt);
        for(const c of this.beings) c.update(dt,this.W);
        if(--this.joinT<=0){ this.state=ST.TANK; }
        break;
      case ST.NAME: this.updName(); break;
      case ST.CHEER:
        if(this.splashAt) this.splashAt.t++;
        this.W.update(dt);
        for(const c of this.beings) c.update(dt,this.W);
        this.cheerT++;
        if(this.cheerT%22===0) FX.sparkle(VW/2+(rnd()-0.5)*420, VH*0.36+(rnd()-0.5)*160, 6);
        /* ⚠ 탭해야만 나가는 화면이었다. 전시장에서 아이가 그리고 자리를 뜨면
           축하 화면이 그대로 남아 **다음 아이가 못 쓴다.**
           충분히 보여 준 뒤에는 스스로 돌아간다. */
        if(this.cheerT>40 && (Input.takeTap()||Input.keys['Space']||this.cheerT>8*60)){
          this.pendingTex=null; this.state=ST.TANK; this.W.findT=260;
        }
        break;
      case ST.CODEX: this.updCodex(); break;
      case ST.ZOOM:
        this.W.update(dt);
        for(const c of this.beings) c.update(dt,this.W);
        this.zoomT=(this.zoomT||0)+1;
        if(Input.takeTap() || this.zoomT>12*60){ this.zoomC=null; this.state=ST.TANK; }
        break;
    }
  },
  updTank(dt){
    /* 운영자 열기 — 왼쪽 위 길게 누르기 */
    if(typeof Admin!=='undefined') Admin.watchHold();
    this.updChest();
    this.updGiant();
    const W=this.W;
    /* 손가락을 대고 있는 동안 — 생물이 궁금해서 모여든다.
       ⚠ 버튼 위에서는 안 된다. 아이가 버튼을 누르려다 물고기를 부른다. */
    if(Input.down && !UI.hit({x:Input.x, y:Input.y})){
      if(!W.touchAt) W.touchAt={x:Input.x, y:Input.y, px:Input.x, py:Input.y, hold:0, sw:0};
      const T=W.touchAt;
      /* 손을 얼마나 빨리 휘젓고 있나 — 빠르면 물살이 되어 생물을 민다.
         가만히 있으면 끌어당기고, 휘저으면 밀어낸다. 둘 다 있어야 손맛이 난다. */
      const mv=Math.hypot(Input.x-T.x, Input.y-T.y);
      T.sw = T.sw*0.82 + mv*0.18;
      T.px=T.x; T.py=T.y;
      T.x=Input.x; T.y=Input.y; T.hold++;
      T.swirl = T.sw>7;                       // 휘젓는 중
      if(T.swirl){
        T.vx=Input.x-T.px; T.vy=Input.y-T.py;
        if(this.t%4===0){
          if(this.realm==='sea') FX.bubbles(Input.x, Input.y, 1);
          else FX.dust(Input.x, Input.y+10, 2);
        }
      } else if(T.hold>20 && T.hold%7===0){
        /* 손끝에서 물이 인다 — 뭔가 일어나고 있다는 신호 */
        if(this.realm==='sea') FX.bubbles(Input.x, Input.y, 1);
        else FX.sparkle(Input.x, Input.y, 2);
      }
    } else if(W.touchAt){
      W.touchAt=null;
    }
    W.update(dt);
    for(const c of this.beings) c.update(dt,W);
    const p=Input.takeTap();
    if(!p) return;
    const id=UI.hit(p);
    if(id==='new'){ this.state=ST.PICK; this.pickPage=0; Sfx.ui(); return; }
    if(id==='feed'){ this.W.dropFood(VW/2+(rnd()-0.5)*400, VH*0.25); this.say('먹이를 뿌렸어요'); return; }
    if(id==='find'){
      const mine=this.beings.filter(b=>b.mine).length;
      if(!mine){ this.say('아직 만든 게 없어요'); Sfx.ui(); return; }
      /* 화면 가운데 아래로 부른다 — 아이가 서 있는 쪽 */
      this.W.callMine(VW/2, this.realm==='sea' ? VH*0.55 : this.W.groundY());
      this.say('내 친구를 불렀어요'); Sfx.join(); return; }
    if(id==='realm'){ this.switchRealm(); return; }
    if(id==='sound'){ Sfx.toggle(); Sfx.ui(); return; }
    if(id==='codex'){ this.state=ST.CODEX; this.codexPage=0; Sfx.ui(); return; }
    /* ⚠ 예전엔 콕 누르면 **곧장 확대 화면**으로 넘어갔다. 그건 반응이 아니라
       화면 전환이라 수조를 만졌다는 느낌이 없었다.
       한 번 누르면 **그 자리에서 종마다 다르게 반응**하고,
       반응 중에 한 번 더 누르면 크게 본다. 아이는 눌러 보면서 알게 된다. */
    /* 상자를 먼저 본다 — 생물보다 작아서 뒤에 두면 놓친다 */
    if(this.chest && !this.chest.open &&
       dist(p.x,p.y,this.chest.x,this.chest.y-24) < 78){ this.openChest(); return; }
    let hit=null, hd=1e9;
    for(const c of this.beings){
      const d=dist(p.x,p.y,c.x,c.y);
      if(d < Math.max(52, c.w*0.44) && d<hd){ hd=d; hit=c; }
    }
    if(hit){
      if(hit.reactT>0){                       // 두 번째 — 크게 본다
        this.zoomC=hit; this.state=ST.ZOOM; this.zoomT=0; Sfx.pop();
        FX.sparkle(hit.x,hit.y,10); return;
      }
      const kind=hit.react();
      if(typeof Grow!=='undefined') Grow.add('touch', hit.x, hit.y-hit.h*0.3);
      this.say(REACT_SAY[kind] || '안녕!');
      /* 옆에 있는 것들도 조금 놀란다 — 수조가 살아 있다는 느낌 */
      for(const o of this.beings){
        if(o===hit) continue;
        const d=dist(hit.x,hit.y,o.x,o.y);
        if(d<230 && o.reactT<=0 && rnd()<0.35) o.scared=Math.max(o.scared||0, 26);
      }
      if(this.W.scareAt!==undefined) this.W.scareAt={x:hit.x,y:hit.y};
      return;
    }
    if(id==='time'){
      const W=this.W, L=(this.realm==='sea'?TIMES:JTIMES);
      W.timeIdx=(W.timeIdx+1)%L.length; this.say(L[W.timeIdx].ko); Sfx.ui(); return; }
    /* 빈 곳을 만지면 물고기가 흩어진다 */
    /* ⚠ World 로 박아 두면 정글에서 빈 곳을 눌러도 아무 일이 없다 */
    this.W.scare(p.x,p.y);
  },
  /* 고르기 화면에서 아이가 그냥 가 버리면 다음 아이가 수족관을 못 본다.
     만지면 초기화된다 — 고민하는 아이를 쫓아내지는 않는다. */
  pickIdle:0,
  updPick(){
    if(Input.tapped) this.pickIdle=0; else this.pickIdle++;
    if(this.pickIdle>70*60){ this.pickIdle=0; this.state=ST.TANK; return; }
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(id==='back'){ this.state=ST.TANK; Sfx.ui(); return; }
    if(id==='realm'){ this.switchRealm(); this.pickPage=0; return; }
    if(id && id.startsWith('world:')){
      const r=id.slice(6);
      if(r===this.realm){ Sfx.ui(); return; }
      if(!this.readyRealm(r)){          // 아직 오는 중 — 재촉하고 기다리게 한다
        if(typeof MTemplate!=='undefined') MTemplate.prefetch(r);
        this.say(this.worldName(r)+' 친구들이 오고 있어요'); Sfx.ui(); return;
      }
      this.goRealm(r, true);            // 말풍선 없이 — 탭이 이미 어디인지 보여 준다
      this.pickPage=0;
      return;
    }
    if(id==='ppage+'){ this.pickPage=(this.pickPage+1)%(this._pickPages||1); Sfx.ui(); return; }
    if(id==='ppage-'){ const n=this._pickPages||1;
      this.pickPage=(this.pickPage-1+n)%n; Sfx.ui(); return; }
    if(id && id.startsWith('sp:')){
      Paint.open(id.slice(3), MODES[this.realm]?this.realm:null); this.state=ST.PAINT;
      this.blankWarned=false; this.backWarned=false;
      this.paintIdle=0; this.idleAsked=false;      // 새 아이가 시작한다 — 시계를 0 으로
      Sfx.ui();
    }
  },
  updPaintUI(){
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(!id) return;
    if(id==='back'){
      /* ⚠ 다 칠한 그림이 뒤로가기 **한 번**에 사라진다(실측: 0.987 → 0.000).
         Paint.open 이 새 캔버스를 만들기 때문에 같은 종을 다시 골라도 못 돌린다.
         많이 칠했을 때만 한 번 잡아 준다 — 조금 칠했으면 종을 잘못 고른 것이다. */
      const r = Paint.inkedRatio ? Paint.inkedRatio() : 0;
      if(r > 0.05 && !this.backWarned){
        this.backWarned = true;
        this.say('한 번 더 누르면 처음부터예요');
        Sfx.ui();
        return;
      }
      this.state=ST.PICK; Sfx.ui();
    }
    else if(id==='submit'){
      /* ⚠ 아무것도 안 칠하고 제출하면 **윤곽선만** 수족관에 떠다닌다(실측: 칠 0px,
         구운 결과 2376px = 전부 선). 아이가 실수로 눌렀을 가능성이 높다.
         막지는 않는다 — 한 번만 권하고, 다시 누르면 그대로 보낸다.
         5살에게 '안 됩니다'는 스트레스고, 제 그림을 제가 정한다는 게 이 게임이다. */
      const r = Paint.inkedRatio ? Paint.inkedRatio() : 1;
      if(r < 0.05 && !this.blankWarned){
        this.blankWarned = true;
        this.say(Paint.free ? '조금만 더 그려 볼까요?' : '색을 조금만 더 칠해 볼까요?');
        Sfx.ui();
        return;
      }
      this.askName();
    }
    else if(id==='undo'){ Paint.doUndo(); }
    else if(id==='clear'){ Paint.clear(); }
    else if(id==='size'){ Paint.sizeIdx=(Paint.sizeIdx+1)%Paint.sizes.length;
      Paint.size=Paint.sizes[Paint.sizeIdx]; Sfx.ui(); }
    else if(id==='t:mirror'){
      Paint.mirror=!Paint.mirror; Sfx.ui();
      this.say(Paint.mirror ? '반쪽만 그리면 반대쪽도 그려져요' : '대칭을 껐어요');
    }
    else if(id.startsWith('t:')){ Paint.tool=id.slice(2); Sfx.ui();
      if(Paint.tool==='bucket'){ Paint.bucket(); Paint.tool='brush'; } }
    else if(id.startsWith('c:')){
      Paint.color=id.slice(2);
      Sfx.swatch(CRAYONS.indexOf(Paint.color));   // 색마다 다른 음
    }
  },

  /* 전시장 — 아이가 색칠하다 그냥 가 버리면 태블릿이 거기서 멈춘다.
     다음 아이는 남의 반쯤 칠한 그림을 물려받는다(고르기·이름 칸에는 이미 시간 제한이
     있었는데 **색칠에만 없었다**).
     ⚠ 그림을 버리지는 않는다 — 칠한 게 있으면 이름 없이 보내 수조에 살려 둔다.
       빈 도안이면 그냥 수조로 돌아간다(윤곽선만 떠다니면 안 된다). */
  paintIdle:0,
  updPaintIdle(){
    if(Input.down || Input.tapped || Paint.drawing){ this.paintIdle=0; this.idleAsked=false; return; }
    this.paintIdle++;
    if(this.paintIdle===90*60 && !this.idleAsked){      // 90초 — 먼저 말을 건다
      this.idleAsked=true;
      this.say('아직 그리는 중이에요?'); Sfx.ui();
    }
    if(this.paintIdle>135*60){                           // 그 뒤로도 45초 — 정리한다
      this.paintIdle=0; this.idleAsked=false;
      const r = Paint.inkedRatio ? Paint.inkedRatio() : 0;
      if(r>=0.05){ this.askName(); }                     // 칠한 건 살린다
      else { this.state=ST.TANK; }
    }
  },
  updName(){
    const r=NameBox.poll();
    if(r===null){
      /* ⚠ 이름 칸이 뜬 채로 아이가 가 버리면 화면이 거기서 멈춘다.
         한참 기다린 뒤에는 이름 없이 보낸다 — **그림은 반드시 살린다.** */
      this.nameIdle=(this.nameIdle||0)+1;
      if(this.nameIdle>50*60){ this.nameIdle=0; NameBox.close(); this.submit(''); }
      return;
    }
    this.nameIdle=0;
    NameBox.close();
    this.submit(r);
  },
  updCodex(){
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(id==='back'){ this.state=ST.TANK; Sfx.ui(); }
    else if(id==='cpage'){ this.codexPage=(this.codexPage+1)%(this._codexPages||1); Sfx.ui(); }
    else if(id==='crealm'){ this.switchRealm(); this.codexPage=0; }
  },

  /* ── 그리기 ────────────────────────────────────── */
  draw(){
    const c=Screen.ctx;
    c.setTransform(Screen.dpr,0,0,Screen.dpr,0,0);
    /* 화면 전체 바탕 — 게임 영역 밖(레터박스)까지 덮는다.
       ⚠ contain 으로 맞추므로 4:3 태블릿에서는 위아래에 여백이 생긴다.
         세계에 맞는 색이라야 띠가 아니라 '배경'으로 읽힌다. */
    c.fillStyle = this.realm==='sea' ? '#0a1f33' : '#16281b';
    c.fillRect(0,0,Screen.cssW,Screen.cssH);
    Screen.begin();
    UI.begin();
    /* ⚠ 운영자 화면이 열려 있으면 게임 화면을 아예 그리지 않는다.
       UI.btn 은 그리면서 판정도 등록한다 — 탱크를 먼저 그리면 그 버튼이
       운영자 버튼보다 앞에 등록돼 '내보내기'가 '그리기'에 가려진다(실측). */
    if(typeof Admin!=='undefined' && Admin.open){
      Admin.draw(c); Screen.end(); return;
    }
    if(this.state===ST.PAINT) this.drawPaint(c);
    else if(this.state===ST.PICK) this.drawPick(c);
    else if(this.state===ST.CODEX) this.drawCodex(c);
    else { this.drawTank(c);
      if(this.state===ST.CHEER) this.drawCheer(c);
      if(this.state===ST.ZOOM) this.drawZoom(c);
      if(this.state===ST.NAME) this.drawNameBack(c); }
    /* 안내는 가장 위에. 단, 축하·이름·확대 중에는 방해하지 않는다 */
    if(typeof Onboard!=='undefined' &&
       (this.state===ST.TANK||this.state===ST.PICK||this.state===ST.PAINT))
      Onboard.draw(c, this);

    /* 방금 도착한 그림을 크게 비춘다 (큰 화면 전용) */
    if(this.spot){
      const S=this.spot; S.t++;
      const waiting=(this.spotQ||[]).length;
      const IN=26, HOLD=(waiting?70:150), OUT=34;      // 밀리면 짧게
      const k = S.t<IN ? S.t/IN : S.t<IN+HOLD ? 1 : Math.max(0,1-(S.t-IN-HOLD)/OUT);
      if(k<=0 || S.t>IN+HOLD+OUT){
        this.spot = (this.spotQ && this.spotQ.length) ? this.spotQ.shift() : null;
      }
      else if(S.c && S.c.tex){
        c.save();
        c.globalAlpha=k*0.66; c.fillStyle='#06182a'; c.fillRect(0,0,VW,VH);
        c.globalAlpha=k;
        /* ⚠ 텍스처(180x120) 를 그대로 키우면 여백까지 커져 그림이 작아 보인다.
           실제 그림이 차지하는 범위를 재서 그만큼을 화면에 꽉 채운다. */
        const fit=BodyFit.of(S.c.tex);
        const th=Math.max(20, (fit.bot-fit.top)+8);
        const sc=Math.min(VW*0.58/TEX_W, VH*0.52/th);
        const w=TEX_W*sc, h=TEX_H*sc;
        const cy=VH*0.40;
        const y=cy - ((fit.top+fit.bot)/2)*sc;      // 그림의 한가운데를 화면 가운데로
        c.drawImage(S.c.tex, VW/2-w/2, y, w, h);
        c.font='700 46px Galmuri11, sans-serif'; c.textAlign='center';
        c.fillStyle=PAL.gold;
        c.fillText(S.name ? S.name+'의 그림이 왔어요' : '새 친구가 왔어요', VW/2, VH*0.80);
        c.restore();
      }
    }
    /* 효과가 걸린 그림 — 남은 시간을 띠로. 조용히 변하면 버그로 보인다 */
    for(const b of this.beings){
      if(!b.fx || b.fx.t<=0) continue;
      const e=(typeof EFFECTS!=='undefined' && EFFECTS[b.fx.kind]) || {col:PAL.gold, ko:''};
      const k=b.fx.t/b.fx.max;
      const w=Math.max(56, b.w*0.5), y=b.y - b.h*0.52 - 16;
      c.save(); c.globalAlpha=0.85;
      c.fillStyle='rgba(10,32,54,.5)'; UI.round(c, b.x-w/2, y, w, 7, 4); c.fill();
      c.fillStyle=e.col; UI.round(c, b.x-w/2, y, w*k, 7, 4); c.fill();
      c.restore();
    }
    /* 방금 생긴 무리를 잠깐 표시 — 말로만 하면 어느 것들인지 모른다 */
    if(this.herdT>0){
      this.herdT--;
      const a=Math.min(1,this.herdT/40);
      c.save(); c.globalAlpha=a*0.9;
      c.strokeStyle=PAL.gold; c.lineWidth=4;
      for(const b of this.beings){
        if((b.spId||b.id)!==this.herdSp) continue;
        c.beginPath(); c.ellipse(b.x, b.y, b.w*0.46+8, b.h*0.52+8, 0, 0, TAU); c.stroke();
      }
      c.restore();
    }
    if(typeof Grow!=='undefined' && (this.state===ST.TANK||this.state===ST.JOIN)) Grow.draw(c);
    if(typeof Admin!=='undefined' && this.state===ST.TANK) Admin.drawHold(c);
    /* ⚠ 세로 화면에서는 게임이 화면의 21% 로 쪼그라들어 버튼이 29px 이 된다
       (실측 아이폰 세로). 아이 손가락에는 너무 작다. 가로로 돌리면 해결된다. */
    if(Screen.cssH > Screen.cssW*1.15) this.drawRotateHint(c);
    /* 자체 점검 결과는 가장 위에 — 가려지면 보는 의미가 없다 */
    if(typeof SelfTest!=='undefined') SelfTest.draw(c);
    if(typeof Net!=='undefined') Net.draw(c);

    /* ⚠ 토스트가 도감 하단 버튼('다음 장')을 덮었다.
       화면마다 비어 있는 자리가 다르다 — 도감은 안 띄우고,
       색칠 화면은 위쪽(도안 위)에 띄운다. */
    if(this.toastT>0 && this.state!==ST.CODEX && !this.spot){
      const ty = (this.state===ST.PAINT) ? 96 : VH-62;
      c.globalAlpha=Math.min(1,this.toastT/25);
      c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle='rgba(10,32,54,.7)';
      const w=c.measureText(this.toast).width+40;
      UI.round(c,VW/2-w/2,ty-30,w,44,12); c.fill();
      c.fillStyle=PAL.white; c.fillText(this.toast, VW/2, ty);
      c.globalAlpha=1;
    }
    Screen.end();
  },
  /* 가로로 돌려 달라는 안내 — 글자를 못 읽는 아이도 알 수 있게 그림으로 */
  drawRotateHint(c){
    c.save();
    c.setTransform(Screen.dpr,0,0,Screen.dpr,0,0);
    const W=Screen.cssW, H=Screen.cssH;
    c.fillStyle='rgba(8,20,34,.86)'; c.fillRect(0,0,W,H);
    c.translate(W/2, H/2);
    const s=Math.min(W,H)/360;
    c.scale(s,s);
    if(Icons.draw(c,'hint-rotate', 300)){
      c.font='700 30px Galmuri11, sans-serif'; c.textAlign='center';

      c.restore(); return;
    }
    /* 기울어진 태블릿 그림 */
    c.save(); c.rotate(-0.42);
    c.strokeStyle='#ffd166'; c.lineWidth=7; c.lineJoin='round';
    UI.round(c,-70,-100,140,200,14); c.stroke();
    c.restore();
    /* 회전 화살표 */
    c.strokeStyle='#ffd166'; c.lineWidth=7; c.lineCap='round';
    c.beginPath(); c.arc(0,0,124,-0.35,1.15); c.stroke();
    c.beginPath(); c.moveTo(52,112); c.lineTo(64,132); c.lineTo(38,138); c.closePath();
    c.fillStyle='#ffd166'; c.fill();
    c.font='700 30px Galmuri11, sans-serif'; c.textAlign='center';
    c.fillStyle='#fff'; c.fillText('가로로 돌려 주세요', 0, 190);
    c.restore();
  },
  drawTank(c){
    const W=this.W;
    W.draw(c);
    if(this.realm==='sea') World.drawWhale(c);
    /* ⚠ 깊이 순서 — 바다는 크기로, 정글은 **층**으로 정한다.
       정글에서 크기로 정렬하면 나무 위 나비가 땅 코끼리 앞에 그려진다.
       ⚠ 매 프레임 200개 배열을 만들어 정렬하니 평상시에도 최악 23ms 가 나왔다
         (중앙은 6.4ms). 정렬 기준은 크기·층뿐이라 **거의 변하지 않는다** —
         8프레임마다 다시 세우고 그 사이에는 같은 배열을 쓴다. */
    const jungle=(this.realm==='jungle');
    if(!this._order || this._orderT===undefined || this.t-this._orderT>=8
       || this._orderN!==this.beings.length || this._orderR!==this.realm){
      this._order=this.beings.slice().sort((a,b)=>
        jungle ? (((a.layer|0)-(b.layer|0)) || ((a.depth||0)-(b.depth||0)) || (a.s-b.s))
               : (a.s-b.s));
      this._orderT=this.t; this._orderN=this.beings.length; this._orderR=this.realm;
    }
    const list=this._order;
    /* ⚠ 나무 위 층은 전경 잎보다 **앞**에 그린다.
       전경 덩굴·지붕이 y 0~302 를 덮는데 나무 위 층이 정확히 그 안이라,
       뒤에 그리면 나비·잠자리가 잎에 파묻혀 아이 그림이 안 보인다. */
    this.drawGiant(c);                 // 멀리 있는 것 — 아이 그림보다 뒤에
    const canopyFirst = (this.realm==='jungle');
    for(const cr of list) if(!canopyFirst || (cr.layer|0)!==0) cr.draw(c, W);
    W.drawFront(c);
    if(canopyFirst) for(const cr of list) if((cr.layer|0)===0) cr.draw(c, W);
    if(typeof Items!=='undefined') for(const cr of list) Items.draw(c, cr);
    this.drawChest(c);
    if(W.drawTint) W.drawTint(c);
    FX.draw(c);
    /* 버튼 — ⚠ 축하·확대·이름 화면에서는 그리지 않는다.
       UI.btn 은 그리면서 동시에 판정도 등록하므로, 안 그리면 눌리지도 않는다.
       예전엔 축하 화면 위로 버튼이 그대로 보여 아이가 잘못 눌렀다. */
    if(this.state!==ST.TANK && this.state!==ST.JOIN) return;
    /* ⚠ 큰 화면에는 **버튼 줄 전체가 필요 없다.** 그리기 버튼만 숨기고 나머지
       여섯 개(먹이·찾기·도감·시간·소리·세계)를 그대로 뒀더니, 만질 수 없는
       화면에 만질 것처럼 생긴 것들이 늘어서 있었다. 관람객은 아이 그림을 보러 온다. */
    const stage = (typeof Net!=='undefined' && Net.role==='stage');
    if(stage) return;
    const S=96, y=VH-S-24;
    /* ⚠ 주 행동이 화면에서 가장 흐렸다. 아이는 여기서 시작하는데,
       가장 밝은 것은 옆의 아이콘 줄이었다. 금색으로 채워 먼저 보이게 한다. */
    {
      const bw=S*2.1;
      c.save();
      c.fillStyle=PAL.gold;
      UI.round(c, 24, y, bw, S, 16); c.fill();
      c.fillStyle='rgba(0,0,0,.14)';
      UI.round(c, 24, y+S-10, bw, 10, 6); c.fill();
      c.restore();
      UI.btn(c,'new', 24, y, bw, S, (g,r)=>{
        g.save(); g.globalAlpha=0;             // 기본 테두리는 안 보이게(금색 판이 이미 있다)
        g.restore();
        /* 붓은 왼쪽, 글자는 오른쪽 — 가운데에 겹쳐 놓으면 둘 다 안 읽힌다 */
        g.save(); g.translate(-r*1.05, 0);
        if(!Icons.draw(g,'brush-fat',S*0.72)) UI.icon.brush(g,r*0.9);
        g.restore();
        g.font='700 24px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle='#2b1d05'; g.fillText('그리기', r*0.95, r*0.32);
      });
    }
    /* ⚠ 좌표를 하나씩 손으로 빼다가 **realm 이 find 안에 완전히 들어갔다**(실측
       find 804.8~939.2 · realm 833.6~929.6). UI.hit 은 먼저 등록된 것을 돌려주므로
       바다↔정글 전환이 **영영 안 눌렸다** — 정글로 갈 방법이 없었다.
       오른쪽에서 왼쪽으로 순서대로 쌓아 겹칠 수 없게 만든다. */
    const W2=S*1.4, GAP=12;
    const right=[
      ['sound', S,  (g,r)=>{ if(!Icons.draw(g, Sfx.on?'btn-sound':'btn-sound-off', S*0.78)) UI.icon.sound(g,r); }],
      ['time',  S,  (g,r)=>{ if(!Icons.draw(g,'btn-time',S*0.78)) UI.icon.time(g,r); }],
      ['codex', S,  (g,r)=>{ if(!Icons.draw(g,'btn-book',S*0.78)) UI.icon.book(g,r); }],
      ['realm', S,  (g,r)=>{
        /* ⚠ 세계가 다섯인데 바다↔정글 아이콘만 보여 주고 있었다 —
           공룡시대에서 '바다' 아이콘이 뜨는데 실제로 가는 곳은 로봇도시였다.
           **다음에 갈 세계**의 표식을 그린다. */
        const ord=Game.realmOrder();
        const nx=ord[(ord.indexOf(Game.realm)+1)%ord.length];
        if(nx==='sea'   && Icons.draw(g,'btn-realm-sea', S*0.78)) return;
        if(nx==='jungle'&& Icons.draw(g,'btn-realm-jungle', S*0.78)) return;
        if(nx!=='sea' && nx!=='jungle'){ Game.worldMark(g, nx, false); return; }
        if(Icons.draw(g, Game.realm==='sea'?'btn-realm-jungle':'btn-realm-sea', S*0.78)) return;
        g.strokeStyle=PAL.white; g.lineWidth=r*0.2; g.lineCap='round';
        if(Game.realm==='sea'){
          g.beginPath();
          for(let i=0;i<3;i++){ g.moveTo(-r*0.7, -r*0.4+i*r*0.42);
            g.quadraticCurveTo(0,-r*0.7+i*r*0.42, r*0.7,-r*0.4+i*r*0.42); }
          g.stroke();
        } else {
          g.fillStyle=PAL.white;
          g.beginPath(); g.ellipse(0,0,r*0.4,r*0.72,0.6,0,TAU); g.fill();
          g.beginPath(); g.moveTo(-r*0.5,r*0.5); g.lineTo(r*0.5,-r*0.5); g.stroke();
        }
      }],
      ['find',  W2, (g,r)=>{ if(!Icons.draw(g,'btn-find',W2*0.86)) UI.icon.find(g,r); }],
      ['feed',  W2, (g,r)=>{ if(!Icons.draw(g,'btn-feed',W2*0.86)) UI.icon.feed(g,r); }],
    ];
    let bx = VW-24;
    for(const [id,w,dr] of right){ bx-=w; UI.btn(c,id,bx,y,w,S,dr); bx-=GAP; }
    /* 마릿수 */
    c.font='600 20px Galmuri11, sans-serif'; c.textAlign='left';
    c.fillStyle='rgba(255,255,255,.75)';
    /* ⚠ 바다·정글만 세다가 새 모드에서 늘 0 이 떴다. 지금 세계의 것을 센다. */
    const n=this.beings.length;
    const verb = this.realm==='sea' ? '헤엄치고'
               : this.realm==='bug' ? '기어다니고'
               : this.realm==='robot' ? '움직이고' : '걷고';
    c.fillText(`${n}마리가 ${verb} 있어요`, 28, 44);
  },
  drawPick(c){
    c.fillStyle='#123047'; c.fillRect(0,0,VW,VH);
    c.font='700 34px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
    c.fillText('무엇을 그릴까요?', VW/2, 62);
    /* ⚠ 처음엔 8열 142px 로 뒀는데 도안이 너무 작아 뭔지 알아볼 수 없었다.
       아이가 고르는 화면이다 — 안 보이면 못 고른다. 6열로 키운다. */
    /* ⚠ pickPage 변수는 있는데 **쓰이지 않았다.** 40종을 한 화면에 다 그려
       22칸이 화면 밖으로 나갔다(실측) — 아이가 고를 수 있는 종이 절반도 안 됐다.
       하단 버튼이 y=612 부터라 그리드는 600 까지다. 5열×3행 = 15칸씩 넘긴다.
       열을 6→5 로 줄인 만큼 도안은 오히려 커진다(196→232). */
    const cols=5, rows=3, cw=232, ch=168, x0=VW/2-cols*cw/2, y0=96;
    const per=cols*rows;
    /* 세계에 맞는 목록을 고른다. 이전에는 정글로 전환해도 바다 목록만 보여
       실제로 정글 동물을 만들 수 없었다. 실물 template은 여기서 즉시 요청한다. */
    /* ⚠ 어셋이 안 온 종을 띄우면 아이가 골랐을 때 빈 화면이 된다.
       도안이 실제로 준비된 것만 보여준다 — 새 어셋이 오면 자동으로 늘어난다.
       (정글 39종 등록 · 도착 12종 상태에서 27칸이 빈 채로 떴다) */
    const inJungle=(id)=> typeof SEA_LIKE_JUNGLE!=='undefined' && SEA_LIKE_JUNGLE[id];
    let choices;
    if(MODES[this.realm]){
      /* 새 모드 — 도안이 도착한 종만. 없는 것을 띄우면 골랐을 때 빈 화면이 된다 */
      choices = MTemplate.ready(this.realm).map(D=>({id:D.id, ko:D.ko, mode:this.realm}));
    } else {
      choices=(this.realm==='sea'
        ? SPECIES.filter(sp=>!inJungle(sp.id)).map(sp=>({id:sp.id, ko:sp.ko, jungle:false}))
        : Object.entries(JUNGLE).map(([id,d])=>({id, ko:d.ko, jungle:true}))
            .concat(SPECIES.filter(sp=>inJungle(sp.id))
                           .map(sp=>({id:sp.id, ko:sp.ko, jungle:false})))
      ).filter(sp => sp.jungle ? !!JTemplate.get(sp.id) : !!Templates.get(sp.id));
    }
    /* 아직 오는 중이면 그렇다고 말한다.
       ⚠ 도안은 네트워크로 1,200장을 받는다(라이브 실측: 정글이 다 차는 데 8초).
         그 사이 목록은 **조용히 짧다** — 아이는 자기가 찾는 동물이 없다고 생각하고
         떠난다. 막지는 않되(팝업은 CK 가 싫어한다) 오고 있다는 것은 보여 준다. */
    {
      const tot = MODES[this.realm] ? MODES[this.realm].list().length
                : this.realm==='jungle' ? Object.keys(JUNGLE).length
                : SPECIES.filter(sp=>!inJungle(sp.id)).length;
      if(choices.length < tot){
        c.font='700 20px Galmuri11, sans-serif'; c.textAlign='center';
        c.fillStyle='rgba(255,255,255,.62)';
        c.fillText(`친구들이 더 오고 있어요 · ${choices.length}/${tot}`, VW/2, 86);
      }
    }
    /* 첫 칸은 언제나 '백지' — 도안 없이 제 마음대로 그린다.
       도안 색칠만 있으면 아이는 '주어진 것을 채우는 일'만 하게 된다. */
    choices=[{id:'__free__', ko:'내 마음대로', free:true}].concat(choices);
    const pages=Math.max(1, Math.ceil(choices.length/per));
    if(this.pickPage>=pages) this.pickPage=0;
    const page=choices.slice(this.pickPage*per, this.pickPage*per+per);
    page.forEach((sp,i)=>{
      const x=x0+(i%cols)*cw, y=y0+((i/cols)|0)*ch;
      UI.btn(c,'sp:'+sp.id, x+8,y+8, cw-16, ch-16, (g,r)=>{
        if(sp.free){                       // 빈 종이 한 장과 크레용
          if(Icons.draw(g,'card-free', cw*0.86)){
            g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
            g.fillStyle=PAL.white; g.fillText(sp.ko, 0, ch*0.30);
            return;
          }
          g.fillStyle='#fbf7ee';
          UI.round(g,-cw*0.30,-ch*0.34,cw*0.60,ch*0.50,10); g.fill();
          g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2; g.stroke();
          g.strokeStyle=PAL.gold; g.lineWidth=7; g.lineCap='round';
          g.beginPath(); g.moveTo(-cw*0.16,-ch*0.02);
          g.quadraticCurveTo(-cw*0.02,-ch*0.22, cw*0.10,-ch*0.06);
          g.quadraticCurveTo(cw*0.18,ch*0.04, cw*0.04,ch*0.10); g.stroke();
          g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
          g.fillStyle=PAL.white; g.fillText(sp.ko, 0, ch*0.30);
          return;
        }
        const t=sp.mode ? MTemplate.get(sp.mode, sp.id)
              : sp.jungle ? JTemplate.get(sp.id) : Templates.get(sp.id);
        const iw=cw*1.02, ih=iw*TH/TW;
        if(t) g.drawImage(t.ink, -iw/2, -ih/2-ch*0.06, iw, ih);
        g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText(sp.ko, 0, ch*0.30);
      });
    });
    UI.btn(c,'back', 24, VH-108, 96,84, (g,r)=>{ if(!Icons.draw(g,'btn-back',72)) UI.icon.back(g,r); });
    /* 페이지 — 1장뿐이면 아예 안 그린다(안 그리면 눌리지도 않는다) */
    if(pages>1){
      UI.btn(c,'ppage-', 136, VH-108, 84,84, (g,r)=>{
        g.font='700 30px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('←', 0, 10); });
      UI.btn(c,'ppage+', 316, VH-108, 84,84, (g,r)=>{
        g.font='700 30px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('→', 0, 10); });
      c.font='700 24px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle='rgba(255,255,255,.8)';
      c.fillText((this.pickPage+1)+' / '+pages, 268, VH-56);
    }
    /* 세계 고르기 — ⚠ 예전엔 '정글로 →' 글자 버튼 하나로 다섯 세계를 **순환**했다.
       ① 라벨이 거짓말을 했다(정글에서 '← 바다로' 인데 다음은 공룡시대다)
       ② 다섯 살은 글자를 못 읽는다 — 공룡을 그리고 싶어도 가는 길이 안 보였다
       ③ 순환이라 원하는 세계까지 여러 번 눌러야 했다
       다섯 개를 한 줄에 늘어놓고 그림으로 보여 준다. 한 번에 간다. */
    this.drawWorldStrip(c, 430, VH-108, VW-430-24, 84);
    this._pickPages=pages;
  },
  /* 세계 다섯 개를 한 줄로. 글자를 못 읽어도 알아볼 수 있게 표식을 그린다. */
  drawWorldStrip(c, x, y, w, h){
    const order=this.realmOrder();
    const gap=10, bw=(w-gap*(order.length-1))/order.length;
    order.forEach((r,i)=>{
      const bx=x+i*(bw+gap), on=(r===this.realm), rd=this.readyRealm(r);
      UI.btn(c,'world:'+r, bx, y, bw, h, (g)=>{
        g.save();
        g.globalAlpha = rd ? 1 : 0.45;          // 아직 오는 중이면 흐리게
        g.fillStyle = on ? 'rgba(255,201,74,.16)' : 'rgba(255,255,255,.05)';
        g.strokeStyle = on ? PAL.gold : 'rgba(255,255,255,.22)';
        g.lineWidth = on ? 4 : 2;
        const rr=14, W=bw-6, H=h-6;
        g.beginPath(); g.roundRect(-W/2,-H/2,W,H,rr); g.fill(); g.stroke();
        g.translate(0,-8); this.worldMark(g, r, on);
        g.restore();
        g.save(); g.globalAlpha = rd ? 1 : 0.45;
        g.font='700 17px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle = on ? PAL.gold : 'rgba(255,255,255,.62)';
        g.fillText(this.worldName(r), 0, h/2-14);
        g.restore();
      });
    });
  },
  worldName(r){
    return r==='sea' ? '바다' : r==='jungle' ? '정글'
         : ((typeof MODES!=='undefined' && MODES[r]) ? MODES[r].ko : r);
  },
  /* 세계 표식 — 어셋(btn-realm-*)이 있으면 쓰고, 없는 세 세계는 코드로 그린다.
     ⚠ 아이콘 어셋은 바다·정글 둘뿐이다(P26 으로 발주). 그때까지 이 그림이 대신한다. */
  worldMark(g, r, on){
    const col = on ? PAL.gold : 'rgba(255,255,255,.72)';
    if(r==='sea'  && Icons.draw(g,'btn-realm-sea', 34, on)) return;
    if(r==='jungle' && Icons.draw(g,'btn-realm-jungle', 34, on)) return;
    g.save(); g.strokeStyle=col; g.fillStyle=col;
    g.lineWidth=3; g.lineCap='round'; g.lineJoin='round';
    if(r==='sea'){                                   // 물결 셋
      for(let i=0;i<3;i++){ g.beginPath();
        g.moveTo(-16, -6+i*7); g.quadraticCurveTo(-5,-13+i*7, 2,-6+i*7);
        g.quadraticCurveTo(9,1+i*7, 16,-6+i*7); g.stroke(); }
    } else if(r==='jungle'){                         // 잎
      g.beginPath(); g.moveTo(0,10); g.quadraticCurveTo(-15,0,-3,-12);
      g.quadraticCurveTo(12,-4,0,10); g.fill();
      g.beginPath(); g.moveTo(-2,8); g.lineTo(2,-8); g.stroke();
    } else if(r==='dino'){                           // 발자국 — 발가락 셋
      g.beginPath(); g.ellipse(0,5,7,8,0,0,TAU); g.fill();
      [[-11,-6],[0,-11],[11,-6]].forEach(([tx,ty])=>{
        g.beginPath(); g.ellipse(tx,ty,3.6,6,tx/22,0,TAU); g.fill(); });
    } else if(r==='robot'){                          // 톱니
      g.beginPath();
      for(let i=0;i<8;i++){ const a=i/8*TAU, R=i%2?8:13;
        const px=Math.cos(a)*R, py=Math.sin(a)*R;
        i?g.lineTo(px,py):g.moveTo(px,py); }
      g.closePath(); g.stroke();
      g.beginPath(); g.arc(0,0,4,0,TAU); g.fill();
    } else {                                         // 풀숲 — 딱정벌레
      g.beginPath(); g.ellipse(0,3,9,11,0,0,TAU); g.stroke();
      g.beginPath(); g.moveTo(0,-8); g.lineTo(0,13); g.stroke();
      g.beginPath(); g.arc(0,-11,4,0,TAU); g.fill();
      g.beginPath(); g.moveTo(-3,-14); g.lineTo(-9,-20);
      g.moveTo(3,-14); g.lineTo(9,-20); g.stroke();
    }
    g.restore();
  },
  drawPaint(c){
    Paint.draw(c);
    /* 색 12개
       ⚠ 가운데 정렬했더니 마지막 2개가 제출 버튼(VW-330~)에 가렸다(실측 118px 겹침).
          제출 버튼 왼쪽 공간 안에서 가운데를 잡는다. */
    /* 세로 화면에서는 한 줄 60px 이 실제 36px 로 줄어 아이 손가락에 작았다.
       그때만 두 줄 6개씩으로 나누고 크게 잡는다(76×0.6 = 실제 46px). */
    const tight=Paint.tight();
    const cs=tight?76:60, gap=tight?8:7, per=tight?6:CRAYONS.length;
    const zoneR=VW-346;                       // 제출 버튼 왼쪽 한계
    const zoneL=20+78+16;                     // 뒤로 버튼 오른쪽
    const rows=Math.ceil(CRAYONS.length/per);
    const total=per*(cs+gap)-gap;
    const cx0=Math.max(zoneL, (zoneL+zoneR)/2-total/2);
    CRAYONS.forEach((col,i)=>{
      const r=(i/per)|0, k=i%per;
      const x=cx0+k*(cs+gap), y=VH-92-(rows-1-r)*(cs+gap);
      UI.btns.push({id:'c:'+col, x, y, w:cs, h:cs});

      c.fillStyle=col; c.fill();

      c.translate(x+cs/2, y+cs/2);

        c.strokeStyle= Paint.color===col? PAL.gold : 'rgba(255,255,255,.5)';
        c.lineWidth= Paint.color===col? 5:2;
        c.beginPath(); c.arc(0,0,cs/2-3,0,TAU); c.stroke();
      } else if(Paint.color===col){

        c.beginPath(); c.arc(0,0,cs/2+2,0,TAU); c.stroke();

    });
    /* 도구 */

    /* ⚠ 도구가 7개로 늘면서 한 열에 다 안 들어갔다(실측):
         7번(줄무늬)이 뒤로 버튼과 **완전히 같은 자리**에 겹쳤고
         8번(붓 굵기)은 화면 밖 710~788 로 나갔다.
       아이가 스탬프를 누르면 나가 버린다. 2열로 바꾼다.

    const tools=[['brush','brush','brush-fat'],['bucket','bucket','bucket'],

                 ['heart','heart','stamp-heart'],['dot','dot','stamp-dot'],
                 ['stripe','dot','stamp-stripe']]
      /* ⚠ 백지에서는 채우기를 뺀다. 도안이 없으면 종이 전체가 색으로 덮여
         잘라낼 것이 없어지고, 결국 **네모난 색종이**가 헤엄친다. */
      .filter(t=> !(Paint.free && t[0]==='bucket'))
      .concat([['mirror','mirror',null]]);   // 좌우 대칭 — 켜고 끈다
    const TC=2, TG=8, tTop=104;
    tools.forEach((t,i)=>{
      const on = t[0]==='mirror' ? !!Paint.mirror : Paint.tool===t[0];
      const col=i%TC, row=(i/TC)|0;
      UI.btn(c,'t:'+t[0], 20+col*(S+TG), tTop+row*(S+TG), S, S,
        (g,r)=>{
          if(t[0]==='mirror'){                 // 나비처럼 좌우가 마주 본 그림
            g.strokeStyle=on?PAL.gold:PAL.white; g.lineWidth=r*0.16; g.lineCap='round';
            g.setLineDash([r*0.22,r*0.22]);
            g.beginPath(); g.moveTo(0,-r*0.9); g.lineTo(0,r*0.9); g.stroke();
            g.setLineDash([]);
            g.fillStyle=on?PAL.gold:PAL.white;
            for(const sgn of [-1,1]){
              g.beginPath();
              g.moveTo(sgn*r*0.16,0);
              g.quadraticCurveTo(sgn*r*1.0,-r*0.75, sgn*r*0.86, r*0.10);
              g.quadraticCurveTo(sgn*r*0.72, r*0.72, sgn*r*0.16, r*0.16);
              g.closePath(); g.fill();

          if(!Icons.draw(g, t[2], S*0.78, on)) UI.icon[t[1]](g,r);
        }, on);
    });
    /* 붓 굵기 — 지금 굵기가 원으로 보인다. 도구 다음 칸에 */
    const nRow=Math.ceil(tools.length/TC);
    const szCol=tools.length%TC, szRow=(tools.length/TC)|0;
    UI.btn(c,'size', 20+szCol*(S+TG), tTop+szRow*(S+TG), S, S, (g,r)=>{
      const rr=[0.28,0.5,0.82][Paint.sizeIdx]*r;
      g.fillStyle=Paint.color;
      g.beginPath(); g.arc(0,0,rr,0,TAU); g.fill();
      g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=3; g.stroke();
    });
    UI.btn(c,'undo', VW-S-20, 116, S,S,
      (g,r)=>{ if(!Icons.draw(g,'undo',S*0.72)) UI.icon.undo(g,r); });
    UI.btn(c,'clear',VW-S-20, 116+S+10, S,S,
      (g,r)=>{ if(!Icons.draw(g,'clear',S*0.72)) UI.icon.trash(g,r); });
    UI.btn(c,'back', 20, VH-96, S,S, (g,r)=>{ if(!Icons.draw(g,'btn-back',S*0.72)) UI.icon.back(g,r); });
    /* 제출 — 가장 크게 */
    /* ⚠ 라벨이 '정글이냐 바다냐' 둘 뿐이었다 — 티라노를 칠한 아이도 '바다로!' 를 봤다.
       그리고 버튼 그림 **가운데에 화살표**가 있는데 글자도 가운데에 찍어 겹쳤다.
       글자는 왼쪽, 화살표는 오른쪽. */
    const dest = Paint.mode ? Game.worldName(Paint.mode)
               : JUNGLE[Paint.spId] ? '정글' : '바다';
    UI.btn(c,'submit', VW-330, VH-112, 300, 96, (g,r)=>{
      const label = dest+'로!';
      if(Icons.draw(g,'btn-submit',280,true)){
        /* 그림의 화살표는 가운데에 박혀 있다 — 글자를 왼쪽으로 비켜 놓는다 */
        g.font='700 28px Galmuri11, sans-serif'; g.textAlign='center';

  /* ── 축하 — 이 작품의 보상 순간 ─────────────────── */
  drawCheer(c){
    const k=Math.min(1,this.cheerT/18);
    c.fillStyle=`rgba(6,20,36,${0.86*k})`; c.fillRect(0,0,VW,VH);
    /* 합류 물보라 — 실물 시트 */
    if(this.splashAt && this.splashAt.t<40)
      FXA.draw(c,'fx-splash-in', VW/2, VH*0.30, 620, this.splashAt.t/40);
    const pop=1+Math.sin(Math.min(this.cheerT,30)/30*Math.PI)*0.12;
    c.save(); c.translate(VW/2, VH*0.16); c.scale(pop*k, pop*k);
    c.font='700 62px Galmuri11, sans-serif'; c.textAlign='center';
    c.fillStyle=PAL.gold;
    /* ⚠ '정글이냐 바다냐' 만 물어보고 있었다 — 공룡·로봇·곤충 150종을 만든 아이도
       '바다로 갔어요!' 라는 말을 들었다. 지금 세계의 이름을 쓴다. */
    const wn=this.worldName(this.realm);
    c.fillText(wn+'로 갔어요!', 0, 0);
    c.restore();
    if(this.joinC && this.joinC.tex){
      /* ⚠ 460px 로 못박아 그렸더니 **여백까지 460 이라 그림은 작았다.**
         실제로 그림이 차지하는 범위를 재서 그만큼을 화면에 채운다(큰 화면 연출과 같은 방식). */
      const t=this.joinC.tex;
      const fit=(typeof BodyFit!=='undefined') ? BodyFit.of(t) : null;
      const th=fit ? Math.max(20,(fit.bot-fit.top)+8) : TEX_H;
      const sc=Math.min(VW*0.52/TEX_W, VH*0.34/th);
      const w=TEX_W*sc, h=TEX_H*sc;
      const cy=VH*0.47;
      const y=cy - (fit ? ((fit.top+fit.bot)/2)*sc : h/2);
      c.save(); c.globalAlpha=k;
      const g=c.createRadialGradient(VW/2,cy,10, VW/2,cy, w*0.7);
      g.addColorStop(0,'rgba(255,201,74,.26)'); g.addColorStop(1,'rgba(255,201,74,0)');
      c.fillStyle=g; c.beginPath(); c.arc(VW/2,cy,w*0.7,0,TAU); c.fill();
      c.drawImage(t, VW/2-w/2, y, w, h);
      c.restore();
    }
    if(this.myName){
      c.font='700 32px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle=PAL.white; c.fillText(this.myName+'의 친구', VW/2, VH*0.78);
    }
    if(this.cheerT>40){
      c.globalAlpha=0.6+0.4*Math.sin(this.cheerT*0.08);
      c.font='600 24px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle=PAL.white; c.fillText('화면을 만져 주세요', VW/2, VH-64);
      c.globalAlpha=1;
    }
  },
  /* ⚠ 방금 칠한 그림이 **화면에 없었다.** 아이가 색칠을 끝낸 바로 그 순간에
     본 것은 빈 입력칸이었다 — 가장 신나는 장면을 폼이 끊고 있었다.
     그림을 크게 보여 주고, 이름은 그 아래에서 묻는다. */
  drawNameBack(c){

      const sc=Math.min(VW*0.40/TEX_W, VH*0.30/th);

      g.addColorStop(0,'rgba(255,201,74,.30)'); g.addColorStop(1,'rgba(255,201,74,0)');
      c.fillStyle=g; c.beginPath(); c.arc(VW/2,cy,w*0.75,0,TAU); c.fill();
      c.translate(VW/2, cy);

    c.font='600 21px Galmuri11, sans-serif'; c.fillStyle='rgba(255,255,255,.82)';
    c.fillText('이름을 적으면 이름표를 달아 줄게요', VW/2, VH*0.455+34);
