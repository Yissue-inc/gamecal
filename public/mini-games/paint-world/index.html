function bakeWalker(fillCanvas, id){
  const t=JTemplate.get(id);
  const big=document.createElement('canvas'); big.width=TW; big.height=TH;
  const b=big.getContext('2d');
  b.drawImage(fillCanvas,0,0);
  if(t){
    b.globalCompositeOperation='destination-in'; b.drawImage(t.mask,0,0);
    b.globalCompositeOperation='source-over';    b.drawImage(t.ink,0,0);
  }
  const small=document.createElement('canvas'); small.width=TEX_W; small.height=TEX_H;
  const sx=small.getContext('2d');
  sx.imageSmoothingEnabled=true; sx.imageSmoothingQuality='high';
  sx.drawImage(big,0,0,TW,TH,0,0,TEX_W,TEX_H);
  return small;
}

</script>
<script>
/* ===== js/40_world.js ===== */
/* ══════════════════════════════════════════════════════════════════
   수조 — 깊이 6구역 · 시간대 4단계 · 패럴랙스

   ⚠ 배경이 한 장이면 40종을 넣어도 한 화면처럼 보인다.
     깊이에 따라 색·소품·빛이 바뀌고, 시간대가 그 위에 물든다.
     전부 코드로 그린다(어셋 0). 실물이 오면 층별로 갈아 끼운다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

/* 구역: 0 수면 · 1 산호 · 2 중층 · 3 모래 · 4 바닥 · 5 심해 */
const ZONE_N=6;

/* 시간대 — 하늘빛이 물 전체를 물들인다 */
const TIMES=[
  {id:'dawn',  ko:'새벽', top:'#2a4a72', bot:'#0a1c30', tint:'rgba(255,180,140,.10)'},
  {id:'day',   ko:'낮',   top:'#2fa3d8', bot:'#08243c', tint:'rgba(255,255,255,.04)'},
  {id:'dusk',  ko:'저녁', top:'#c2643f', bot:'#0d1e34', tint:'rgba(255,120,60,.12)'},
  {id:'night', ko:'밤',   top:'#12294a', bot:'#050d18', tint:'rgba(80,120,255,.10)'},
];

/* ── 배경 실물 로더 ─────────────────────────────────────
   ⚠ 어셋이 없으면 지금까지의 코드 그림으로 폴백한다.
     한 장씩 오는 대로 갈아 끼워지므로 중간에 멈춰도 화면이 안 깨진다. */
const BG = {
  cache:{}, tried:{},
  get(n){
    if(this.cache[n]) return this.cache[n];
    if(this.tried[n]) return null;
    this.tried[n]=true;
    /* ⚠ webp 만 찾다가 png 로 온 배경 4종(vignette·paper·frame-wood·caustics)을
       통째로 놓쳤다. 확장자는 납품하는 쪽 사정이다 — 둘 다 본다. */
    const img=new Image();
    img.onload=()=>{ this.cache[n]=img; };
    img.onerror=()=>{
      const p2=new Image();
      p2.onload=()=>{ this.cache[n]=p2; };
      p2.src='assets/bg/'+n+'.png';
    };
    img.src='assets/bg/'+n+'.webp';
    return null;
  },
  /* 가로로 이어 붙여 그린다. off 만큼 흘린다. */
  tile(c,n,y,h,off){
    const img=this.get(n); if(!img) return false;
    const w=h*(img.width/img.height);
    let x=-(((off||0)%w)+w)%w;
    for(; x<VW; x+=w) c.drawImage(img,x,y,w,h);
    return true;
  },
  fill(c,n,y,h){
    const img=this.get(n); if(!img) return false;
    c.drawImage(img,0,y,VW,h); return true;
  },
  prefetch(){ ['caustics','vignette','water-deep','lightrays','surface','sand-floor','rock-far','rock-near',
    'coral-far','coral-near','kelp','bubbles','dust','cave'].forEach(n=>this.get(n)); }
};

/* ── 소품 — 바닥에 놓이는 것들 ─────────────────────────── */
const Props = {
  cache:{}, tried:{},
  get(n){
    if(this.cache[n]) return this.cache[n];
    if(this.tried[n]) return null;
    this.tried[n]=true;
    const img=new Image(); img.onload=()=>{ this.cache[n]=img; };
    img.src='assets/prop/'+n+'.png';
    return null;
  },
  /* 바닥에 세워 놓는다 — 밑면이 y 에 닿는다 */
  draw(c,n,x,y,h){
    const img=this.get(n); if(!img) return false;
    const w=h*(img.width/img.height);
    c.drawImage(img, Math.round(x-w/2), Math.round(y-h), w, h);
    return true;
  },
  prefetch(){ ['anemone','clam','urchin','coral-branch','coral-brain','seagrass',
    'treasure-chest-open','treasure-chest-closed','anchor','shipwreck','bottle','pearl',
    'feed-pellet','sign-wood','lantern','flag','basket','bucket','easel'].forEach(n=>this.get(n)); }
};

const World = {
  zone:1, timeIdx:1, t:0, scroll:0,
  foods:[], bubbles:[], motes:[], kelp:[], corals:[], rocks:[],
  scareAt:null, findT:0, whale:null, whaleCd:1400, touchAt:null,

  zoneY(z){ return VH*(0.16+z*0.13); },
  zoneBand(z){ const c=World.zoneY(z); return [c-110, c+110]; },

  init(){
    /* 소품을 구역별로 흩뿌린다 — 구역마다 다른 풍경이 되도록 */
    this.kelp=[]; this.corals=[]; this.rocks=[];
    for(let i=0;i<26;i++) this.kelp.push({x:rnd()*VW*1.4, h:120+rnd()*260, w:14+rnd()*16,
      ph:rnd()*TAU, depth:0.3+rnd()*0.5});
    for(let i=0;i<22;i++) this.corals.push({x:rnd()*VW*1.4, y:VH*0.62+rnd()*VH*0.26,
      r:26+rnd()*46, n:rndi(3,6), hue:rndi(0,360), depth:0.5+rnd()*0.5});
    for(let i=0;i<22;i++) this.rocks.push({x:rnd()*VW*1.4, y:VH*0.78+rnd()*VH*0.16,
      w:60+rnd()*140, h:30+rnd()*70, depth:0.25+rnd()*0.4});
    for(let i=0;i<70;i++) this.motes.push({x:rnd()*VW, y:rnd()*VH, r:0.8+rnd()*1.8, sp:0.1+rnd()*0.3});
    /* 바닥 소품 — 실물 어셋이 있으면 놓는다. 자리는 한 번만 정한다. */
    const KINDS=[['anemone',96],['clam',64],['urchin',54],['coral-branch',120],
                 ['coral-brain',76],['seagrass',110],['anchor',96],['bottle',58],
                 ['treasure-chest-closed',78],['pearl',30]];
    this.props=[];
    for(let i=0;i<22;i++){
      const k=KINDS[i%KINDS.length];
      this.props.push({n:k[0], h:k[1]*(0.8+rnd()*0.5),
        x:rnd()*VW*1.4, depth:0.5+rnd()*0.5, y:VH-VH*0.12-rnd()*VH*0.05});
    }
    /* 난파선 — 큰 장식 하나 */
    this.wreck={ x:VW*0.62, y:VH-VH*0.14, h:200 };
  },
  update(dt){
    this.t+=dt*60;
    this.scroll+=dt*8;
    if(this.findT>0) this.findT--;
    if(this.scareAt && --this.scareAt.life<=0) this.scareAt=null;
    if(this.callAt && --this.callAt.life<=0) this.callAt=null;
    /* 공기방울 */
    if(this.t%7<1) this.bubbles.push({x:rnd()*VW, y:VH+10, r:2+rnd()*6, sp:0.6+rnd()*1.4, ph:rnd()*TAU});
    for(let i=this.bubbles.length-1;i>=0;i--){
      const b=this.bubbles[i]; b.y-=b.sp; b.x+=Math.sin(this.t*0.02+b.ph)*0.4;
      if(b.y<-20) this.bubbles.splice(i,1);
    }
    for(const m of this.motes){ m.y-=m.sp*0.3; m.x+=Math.sin(this.t*0.006+m.y)*0.12;
      if(m.y<-4){ m.y=VH+4; m.x=rnd()*VW; } }
    /* 먹이 */
    for(let i=this.foods.length-1;i>=0;i--){
      const f=this.foods[i];
      f.y+=f.vy; f.vy=Math.min(0.62,f.vy+0.006); f.x+=Math.sin(this.t*0.03+f.ph)*0.4;
      if(--f.life<=0 || f.y>VH) this.foods.splice(i,1);
    }
    /* 가끔 고래가 지나간다 — 큰 사건 */
    if(!this.whale && --this.whaleCd<=0){
      this.whaleCd=2400+rndi(0,1800);
      this.whale={x:-400, y:VH*0.32+rnd()*VH*0.2, s:1.5, t:0};
    }
    if(this.whale){ this.whale.x+=0.9; this.whale.t++; if(this.whale.x>VW+500) this.whale=null; }
  },
  /* ⚠ 5알을 좁게 뿌렸더니 **1초 만에 전부 먹혔다**(실측: 60프레임에 0개).
     반경 안에 18마리가 있으니 즉시 소진된다 — 아이가 반응을 볼 시간이 없다.
     먹이는 이 게임에서 몇 안 되는 '내가 일으킨 사건'이다. 몇 초는 가야 한다.
     16알을 넓게 뿌리고 천천히 가라앉힌다. */
  dropFood(x,y){
    for(let i=0;i<22;i++)
      this.foods.push({
        x: x+(rnd()-0.5)*260,
        y: y+(rnd()-0.5)*90 - i*4,          // 조금씩 시차를 두고 내려온다
        vy: 0.10+rnd()*0.10, life:1500, ph:rnd()*TAU});
    Sfx.plop();
  },
  nearestFood(x,y){
    let best=null,bd=1e9;
    for(const f of this.foods){ const d=dist(x,y,f.x,f.y); if(d<bd){bd=d;best=f;} }
    return best;
  },
  /* ⚠ 한 입에 알이 통째로 사라져 16알이 1초 만에 없어졌다(실측).
     아이는 먹이를 **보고 싶어 한다** — 세 번 쪼아야 없어지게 하면
     한 알에 여러 마리가 모여드는 그림이 나오고, 화면에도 3배 오래 남는다. */
  eatFood(f,c){
    f.bites=(f.bites||0)+1;
    FX.heart(c.x, c.y-20);
    Sfx.eat();
    if(f.bites>=3){
      const i=this.foods.indexOf(f); if(i>=0) this.foods.splice(i,1);
    } else {
      /* 쪼일 때마다 조금 튕겨 나간다 — 물고기끼리 겹치지 않게 */
      f.x += (f.x-c.x)*0.10 + (rnd()-0.5)*14;
      f.y += (f.y-c.y)*0.10 - 6;
      f.vy = -0.25;
    }
  },
  /* ── 이웃 격자 ────────────────────────────────────
     ⚠ 전부와 거리 비교하면 300마리에 45,000번이다. 한 프레임에 못 한다.
     화면을 220px 칸으로 나눠 같은 칸 + 이웃 칸만 본다. */
  grid:null, gridT:-1, CELL:220,
  rebuildGrid(list){
    if(this.gridT===Game.t) return;
    this.gridT=Game.t;
    const g={};
    for(const c of list){
      const k=((c.x/this.CELL)|0)+','+((c.y/this.CELL)|0);
      (g[k]=g[k]||[]).push(c);
    }
    this.grid=g;
  },
  neighbors(x,y,self){
    this.rebuildGrid(Game.beings);
    const gx=(x/this.CELL)|0, gy=(y/this.CELL)|0, out=[];
    for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
      const cell=this.grid[(gx+i)+','+(gy+j)];
      if(!cell) continue;
      for(const o of cell){ if(o!==self && !o.dead) out.push(o); if(out.length>14) return out; }
    }
    return out;
  },
  flock:true,
  /* ── 내 것을 부른다 ────────────────────────────────
     ⚠ '찾기'가 금색 고리만 띄우면 아이는 여전히 눈으로 훑어야 한다.
       **내 물고기가 아이 앞으로 헤엄쳐 와야** '나를 알아본다'가 된다. */
  callMine(x,y){
    /* ⚠ 300프레임(5초)으로 뒀더니 화면 반대편 개체가 도착 전에 부름이 끝났다
       (실측: 셋 중 하나가 276px 지점에서 멈춤). 12초로 늘린다. */
    this.findT=720; this.callAt={x,y,life:720};
  },
  scare(x,y){ this.scareAt={x,y,life:50};
    for(const c of Game.creatures){ if(dist(c.x,c.y,x,y)<260) c.scared=64; }
    FX.ring(x,y);
  },

  /* ── 배경 그리기 ─────────────────────────────────── */
  draw(c){
    const T=TIMES[this.timeIdx];
    if(!BG.fill(c,'water-deep',0,VH)){
      const g=c.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,T.top); g.addColorStop(0.55,PAL.deep1); g.addColorStop(1,T.bot);
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
    }

    /* 빛기둥 — 수면에서 내려온다 */
    c.save(); c.globalCompositeOperation='lighter';
    if(BG.tile(c,'lightrays',0,VH,this.scroll*6)){ c.restore(); }
    else {
    for(let i=0;i<7;i++){
      const x=((i*230 + this.scroll*6)%(VW+400))-200;
      const w=70+Math.sin(this.t*0.006+i)*26;
      const lg=c.createLinearGradient(0,0,0,VH*0.8);
      lg.addColorStop(0,'rgba(255,240,190,.10)'); lg.addColorStop(1,'rgba(255,240,190,0)');
      c.fillStyle=lg;
      c.beginPath(); c.moveTo(x,0); c.lineTo(x+w,0); c.lineTo(x+w*2.4,VH*0.8); c.lineTo(x-w*0.6,VH*0.8);
      c.closePath(); c.fill();
    }
    c.restore(); }

    /* 수면 물결 */
    if(BG.tile(c,'surface',0,VH*0.09,this.scroll*3)){}
    else { c.save(); c.fillStyle='rgba(255,255,255,.10)';
    c.beginPath(); c.moveTo(0,0);
    for(let x=0;x<=VW;x+=16) c.lineTo(x, 26+Math.sin(x*0.018+this.t*0.03)*10);
    c.lineTo(VW,0); c.closePath(); c.fill(); c.restore(); }

    /* 먼 바위 (느리게) */
    if(!BG.tile(c,'rock-far',VH*0.52,VH*0.30,this.scroll*0.9)){
      this.layer(c, this.rocks, 0.35, (o,px)=>{
        c.fillStyle='rgba(8,28,46,.85)';
        c.beginPath(); c.ellipse(px,o.y,o.w,o.h,0,Math.PI,0); c.fill();
      });
    }
    BG.tile(c,'rock-near',VH*0.60,VH*0.34,this.scroll*1.5);
    /* 산호 */
    const coralHD = BG.tile(c,'coral-far',VH*0.58,VH*0.24,this.scroll*1.8)
                  | BG.tile(c,'coral-near',VH*0.66,VH*0.28,this.scroll*2.6);
    if(!coralHD) this.layer(c, this.corals, 0.6, (o,px)=>{
      c.strokeStyle=`hsla(${o.hue},55%,42%,.9)`; c.lineWidth=7; c.lineCap='round';
      for(let k=0;k<o.n;k++){
        const a=-Math.PI/2+(k/(o.n-1)-0.5)*1.5;
        const sway=Math.sin(this.t*0.012+k+o.x)*7;
        c.beginPath(); c.moveTo(px,o.y);
        c.quadraticCurveTo(px+Math.cos(a)*o.r*0.6+sway, o.y+Math.sin(a)*o.r*0.7,
                           px+Math.cos(a)*o.r+sway*1.6, o.y+Math.sin(a)*o.r);
        c.stroke();
      }
    });
    /* 미역 */
    if(!BG.tile(c,'kelp',VH-VH*0.50,VH*0.50,this.scroll*3.2))
    this.layer(c, this.kelp, 0.8, (o,px)=>{
      c.strokeStyle='rgba(38,110,78,.85)'; c.lineWidth=o.w; c.lineCap='round';
      c.beginPath(); c.moveTo(px, VH);
      const sway=Math.sin(this.t*0.014+o.ph)*26;
      c.quadraticCurveTo(px+sway, VH-o.h*0.55, px+sway*1.7, VH-o.h);
      c.stroke();
    });
    /* 난파선 — 가장 뒤 장식 */
    if(this.wreck) Props.draw(c,'shipwreck',
      ((this.wreck.x-this.scroll*1.2)%(VW*1.6)+VW*1.6)%(VW*1.6)-VW*0.3,
      this.wreck.y, this.wreck.h);

    /* 바닥 모래 */
    if(BG.tile(c,'sand-floor',VH-VH*0.18,VH*0.18,this.scroll*3.6)){}
    else {
    const sg=c.createLinearGradient(0,VH-120,0,VH);
    sg.addColorStop(0,'rgba(232,212,168,0)'); sg.addColorStop(1,'rgba(232,212,168,.55)');
    c.fillStyle=sg;
    c.beginPath(); c.moveTo(0,VH);
    for(let x=0;x<=VW;x+=24) c.lineTo(x, VH-56-Math.sin(x*0.01+this.t*0.002)*14);
    c.lineTo(VW,VH); c.closePath(); c.fill(); }

    /* 물빛 무늬 — 수면이 바닥에 만드는 그물. 천천히 흐른다 */
    const ca=BG.get('caustics');
    if(ca){
      c.save(); c.globalAlpha=0.16; c.globalCompositeOperation='lighter';
      const sz=340, ox=-(this.t*0.28)%sz, oy=-(this.t*0.12)%sz;
      for(let x=ox-sz;x<VW+sz;x+=sz)
        for(let y=VH*0.42+oy-sz;y<VH+sz;y+=sz) c.drawImage(ca,x,y,sz,sz);
      c.restore();
    }
    /* 바닥 소품 — 모래 위에 */
    if(this.props) for(const p of this.props){
      const px=((p.x - this.scroll*3.0*p.depth)%(VW*1.4)+VW*1.4)%(VW*1.4)-VW*0.2;
      if(px<-160||px>VW+160) continue;
      Props.draw(c,p.n,px,p.y,p.h);
    }

    /* 먼지 */
    if(!BG.tile(c,'dust',0,VH,this.scroll*0.6)){
      c.fillStyle='rgba(255,255,255,.13)';
      for(const m of this.motes){ c.beginPath(); c.arc(m.x,m.y,m.r,0,TAU); c.fill(); }
    }
  },
  layer(c, arr, depth, fn){
    for(const o of arr){
      const px=((o.x - this.scroll*depth*o.depth)%(VW*1.4)+VW*1.4)%(VW*1.4)-VW*0.2;
      if(px<-260||px>VW+260) continue;
      fn(o,px);
    }
  },
  drawFront(c){
    /* 공기방울 — 생물 앞 */
    c.save();
    for(const b of this.bubbles){
      c.strokeStyle='rgba(255,255,255,.42)'; c.lineWidth=1.4;
      c.beginPath(); c.arc(b.x,b.y,b.r,0,TAU); c.stroke();
      c.fillStyle='rgba(255,255,255,.14)'; c.fill();
    }
    /* 먹이 */
    for(const f of this.foods){
      /* 쪼일수록 작아진다 — 남은 양이 눈에 보여야 아이가 '먹고 있구나' 안다 */
      const k=1-(f.bites||0)*0.28;
      if(!Props.draw(c,'feed-pellet',f.x,f.y+7*k,14*k)){
        c.fillStyle=PAL.gold;
        c.beginPath(); c.arc(f.x,f.y,4*k,0,TAU); c.fill();
        c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=1; c.stroke();
      }
    }
    c.restore();
    /* 시간대 물들이기 */
    c.fillStyle=TIMES[this.timeIdx].tint; c.fillRect(0,0,VW,VH);
    this.drawGlass(c);
    /* 가장자리 어둠 — 어셋이 있으면 그림으로 */
    const vg=BG.get('vignette');
    if(vg){ c.globalAlpha=0.8; c.drawImage(vg,0,0,VW,VH); c.globalAlpha=1; }
    else {
      const v=c.createRadialGradient(VW/2,VH/2,VH*0.44,VW/2,VH/2,VH*1.10);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.26)');
      c.fillStyle=v; c.fillRect(0,0,VW,VH);
    }
  },

  /* ── 유리 ────────────────────────────────────────────
     ⚠ 지금까지는 '물속'이었지 '수조'가 아니었다. 아이는 물 안에 있는 게 아니라
       **유리 앞에 서서 들여다본다.** 그 한 겹이 수족관을 수족관으로 만든다.
     비스듬한 반사광 두 줄 + 위쪽 밝은 띠 + 모서리 이음매.
     전부 아주 옅게 — 아이 그림보다 튀면 안 된다. */
  drawGlass(c){
    c.save();
    /* 비스듬히 흐르는 반사광 */
    c.globalCompositeOperation='lighter';
    const t=this.t*0.0016;
    for(let i=0;i<2;i++){
      const off=((t*0.6+i*0.5)%1.6-0.3)*VW;
      const g=c.createLinearGradient(off, 0, off+VW*0.30, VH);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.5,'rgba(200,235,255,'+(0.05+i*0.015)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
    }
    /* 수면에 가까운 위쪽이 더 밝다 */
    const top=c.createLinearGradient(0,0,0,VH*0.34);
    top.addColorStop(0,'rgba(190,240,255,.10)');
    top.addColorStop(1,'rgba(190,240,255,0)');
    c.fillStyle=top; c.fillRect(0,0,VW,VH*0.34);
    c.globalCompositeOperation='source-over';
    /* 유리 모서리 — 아주 얇게. 수조 안을 들여다본다는 신호다 */
    c.strokeStyle='rgba(255,255,255,.10)'; c.lineWidth=3;
    c.strokeRect(1.5,1.5,VW-3,VH-3);
    const edge=26;
    c.fillStyle='rgba(255,255,255,.045)';
    c.fillRect(0,0,edge,VH); c.fillRect(VW-edge,0,edge,VH);
    c.restore();
  },
  drawWhale(c){
    if(!this.whale) return;
    const w=this.whale;
    c.save(); c.globalAlpha=0.32;
    c.translate(w.x,w.y); c.scale(w.s,w.s);
    c.fillStyle='#0a2a44';
    c.beginPath();
    c.moveTo(220,0); c.quadraticCurveTo(120,-90,-40,-70);
    c.quadraticCurveTo(-150,-50,-190,0);
    c.quadraticCurveTo(-150,60,-40,78);
    c.quadraticCurveTo(120,92,220,0); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-190,0); c.lineTo(-280,-70+Math.sin(w.t*0.03)*18);
    c.lineTo(-240,0); c.lineTo(-280,70+Math.sin(w.t*0.03)*18); c.closePath(); c.fill();
    c.restore();
  }
};

</script>
<script>
/* ===== js/45_jungleworld.js ===== */
/* ══════════════════════════════════════════════════════════════════
   정글 무대 — 바다와 같은 구조, 다른 층 구성.

   ⚠ 바다는 '깊이'로 층을 나눴지만 정글은 '거리'로 나눈다.
     동물은 땅 위를 걸으므로 세로 자유도가 거의 없다 — 대신 앞뒤로 겹친다.
     맨 앞 풀(grass-front)이 동물을 가려야 '숲 속에 있다'가 된다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const JTIMES=[
  {id:'morning', ko:'아침', tint:'rgba(255,214,150,.14)'},
  {id:'day',     ko:'낮',   tint:'rgba(255,255,255,.03)'},
  {id:'evening', ko:'저녁', tint:'rgba(255,140,70,.16)'},
  {id:'night',   ko:'밤',   tint:'rgba(40,70,160,.22)'},
];

const JWorld = {
  t:0, scroll:0, timeIdx:1, foods:[], scareAt:null, findT:0, touchAt:null, props:[], leaves:[],
  /* 큰 이벤트 — 바다에 고래가 지나가듯, 정글엔 새 떼가 하늘을 가른다 */
  flock2:null, flockCd:1500,
  /* ── 높이 층 ──────────────────────────────────────────
     ⚠ 바다는 깊이 6구역에 생물이 층층이 있는데 정글은 **땅 한 줄**이었다.
       나비도 개구리도 코끼리도 같은 높이에 서서 화면이 납작했다.
     배경이 덮는 구간(측정값)에 맞춰 층을 나눈다:
       나뭇잎지붕 0~144 · 덩굴 0~302 · 나무 158~561 · 강 518~590 · 땅 561~720
     0 나무 위  — 나비·잠자리·새 (지붕과 나무 사이)
     1 나뭇가지 — 원숭이·다람쥐·나무늘보·앵무 (나무 중간)
     2 땅       — 네발동물 대부분
     3 물가     — 개구리·악어·하마 (강 근처, 가장 앞) */
  LAYERS:[
    { id:'canopy', y:0.255, name:'나무 위' },
    { id:'branch', y:0.480, name:'나뭇가지' },
    { id:'ground', y:0.755, name:'땅' },
    { id:'water',  y:0.815, name:'물가' },
  ],
  layerY(i){ return VH*this.LAYERS[Math.max(0,Math.min(3,i|0))].y; },

  /* 이 x 에 가지가 있으면 그 **윗면** y 를, 없으면 null.
     ⚠ 층만 나눠 놓으면 원숭이가 가지 옆 허공에 서 있다. 층을 나눈 뜻이
       "나무 위에 산다"인데, 앉을 자리가 없으면 그냥 높이 뜬 땅일 뿐이다.
     가지는 스크롤하므로 화면 좌표로 옮겨 비교한다. */
  perchYAt(x){
    let best=null, bd=1e9;
    for(const p of this.perches){
      if(p.n==='liana-loop'||p.n==='tree-hole'||p.n==='leaf-cluster'||p.n==='moss-patch') continue;
      const px=((p.x - this.scroll*1.9*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      const halfW=(p.h*2.4)/2;                              // 가지 폭의 절반(대략)
      const d=Math.abs(px-x);
      if(d<halfW && d<bd){ bd=d; best=p.y; }
    }
    return best;
  },
  groundY(){ return VH*0.755; },
  band(){ return [VH*0.66, VH*0.80]; },

  init(){
    this.props=[];
    const K=[['fruit-tree',260],['bush',110],['log',96],['stump',86],
             ['flower-patch',56],['mushroom',60],['rock-perch',82],['pond',90],['nest',48]];
    for(let i=0;i<18;i++){
      const k=K[i%K.length];
      this.props.push({n:k[0], h:k[1]*(0.8+rnd()*0.5),
        x:rnd()*VW*1.5, depth:0.4+rnd()*0.6,
        y:this.groundY()+ (k[0]==='fruit-tree'? 10 : rnd()*26)});
    }
    /* 나뭇가지 층 — 동물이 앉을 자리.
       ⚠ 층을 나눴더니 원숭이·앵무가 **허공에 떠** 있었다. 가지가 없어서다.
       어셋(P15 branch-*)이 오면 Props.draw 가 실물로 대체한다. */
    this.perches=[];
    const B=[['branch-thick',300],['branch-fork',270],['branch-thin',240],
             ['liana-loop',150],['tree-hole',130],['leaf-cluster',210],['moss-patch',180]];
    for(let i=0;i<9;i++){
      const b=B[i%B.length];
      this.perches.push({n:b[0], w:b[1]*(0.85+rnd()*0.4),
        h:(b[0]==='liana-loop'?150:b[0]==='tree-hole'?96:b[0]==='leaf-cluster'?72:b[0]==='moss-patch'?46:104)*(0.82+rnd()*0.42),
        x:rnd()*VW*1.5, depth:0.5+rnd()*0.5,
        y:this.layerY(1)+(rnd()-0.4)*46});
    }
    /* 나무 위 장식 — 위에서 늘어진다. 아이 그림을 가리지 않게 화면 위쪽만 */
    this.hangers=[];
    /* ⚠ canopy-gap 은 뺐다 — 발주는 '가운데가 뚫려 하늘이 보인다'였는데
       실제 어셋은 **가운데가 흰 불투명**이고 투명 영역이 19% 뿐이다.
       화면 위쪽을 흰 사각형 세 개가 덮었다. 어셋이 고쳐지면 되살린다. */
    const H=[['hanging-leaf',150],['flower-vine',210]];
    for(let i=0;i<7;i++){
      const h=H[i%H.length];
      this.hangers.push({n:h[0], h:h[1]*(0.8+rnd()*0.5),
        x:rnd()*VW*1.5, depth:0.35+rnd()*0.4,
        y:-14+rnd()*40});
    }
    /* 물가 층 — 수련잎·돌 */
    this.bankProps=[];
    const R=[['lilypad',110],['river-stone',120],['reeds',150],['mud-bank',210]];
    for(let i=0;i<7;i++){
      const r=R[i%R.length];
      this.bankProps.push({n:r[0], w:r[1]*(0.85+rnd()*0.4),
        x:rnd()*VW*1.5, depth:0.6+rnd()*0.4,
        y:this.layerY(3)+(rnd()-0.3)*18});
    }
    for(let i=0;i<22;i++) this.leaves.push({x:rnd()*VW, y:rnd()*VH, r:rnd()*TAU,
      sp:0.25+rnd()*0.5, sw:rnd()*TAU, sz:10+rnd()*10});
  },

  /* 소품이 아직 없을 때 코드로 그리는 임시 가지.
     어셋이 도착하면 이 함수는 호출되지 않는다. */
  fallbackPerch(c,n,x,y,w){
    c.save(); c.strokeStyle='#4a3a28'; c.lineCap='round';
    if(n==='liana-loop'){
      c.strokeStyle='#4f7a3a'; c.lineWidth=9;
      c.beginPath(); c.moveTo(x,y-70); c.quadraticCurveTo(x+18,y+30,x-14,y+64);
      c.stroke();
      c.beginPath(); c.ellipse(x-14,y+78,17,13,0,0,TAU); c.stroke();
    } else if(n==='tree-hole'){
      c.fillStyle='#3a2b1e'; c.beginPath(); c.ellipse(x,y,w*0.22,w*0.28,0,0,TAU); c.fill();
      c.lineWidth=8; c.stroke();
    } else {
      c.lineWidth = n==='branch-thin' ? 11 : 19;
      c.beginPath(); c.moveTo(x-w/2,y+8); c.quadraticCurveTo(x,y-6,x+w/2,y+2); c.stroke();
      if(n==='branch-fork'){
        c.lineWidth=13; c.beginPath();
        c.moveTo(x+w*0.10,y+1); c.quadraticCurveTo(x+w*0.30,y-34,x+w*0.52,y-46); c.stroke();
      }
      /* 잎 몇 장 */
      c.fillStyle='#4b7a3c';
      for(let i=0;i<4;i++){
        const lx=x-w/2+w*(0.18+i*0.22), ly=y-4-((i%2)*9);
        c.beginPath(); c.ellipse(lx,ly,15,7,-0.5+i*0.35,0,TAU); c.fill();
      }
    }
    c.restore();
  },
  update(dt){
    this.t+=dt*60; this.scroll+=dt*7;
    if(this.findT>0) this.findT--;
    if(this.scareAt && --this.scareAt.life<=0) this.scareAt=null;
    if(this.callAt && --this.callAt.life<=0) this.callAt=null;
    for(const l of this.leaves){
      l.y+=l.sp; l.x+=Math.sin(this.t*0.01+l.sw)*0.5; l.r+=0.012;
      if(l.y>VH+20){ l.y=-20; l.x=rnd()*VW; }
    }
    for(let i=this.foods.length-1;i>=0;i--){
      const f=this.foods[i];
      const rest=f.rest||this.groundY();
      if(f.y<rest){ f.vy=Math.min(2.4,(f.vy||0.3)+0.09); f.y+=f.vy; if(f.y>rest) f.y=rest; }
      if(--f.life<=0) this.foods.splice(i,1);
    }
    /* 새 떼 */
    if(!this.flock2 && --this.flockCd<=0){
      this.flockCd=2200+rndi(0,1600);
      const n=7+rndi(0,6), y0=VH*0.14+rnd()*VH*0.14;
      this.flock2={ t:0, birds:Array.from({length:n},(_,i)=>({
        x:-120-i*38-rnd()*30, y:y0+((i%3)-1)*22+rnd()*10, ph:rnd()*TAU, sp:1.5+rnd()*0.5 })) };
    }
    if(this.flock2){
      this.flock2.t++;
      let gone=true;
      for(const b of this.flock2.birds){
        b.x+=b.sp; b.y+=Math.sin(this.t*0.04+b.ph)*0.35;
        if(b.x<VW+140) gone=false;
      }
      if(gone) this.flock2=null;
    }
  },
  /* 열매는 나무에서 떨어져 땅에 쌓인다 — 층마다 다른 동물이 먹는다 */
  dropFood(x){
    for(let i=0;i<4;i++)
      this.foods.push({x:x+(rnd()-0.5)*80, y:VH*0.25, vy:0.3, life:900,
                       rest:this.layerY(2)+rnd()*20});
    Sfx.plop();
  },
  nearestFood(x,y){ let b=null,bd=1e9;
    for(const f of this.foods){ const d=Math.abs(x-f.x); if(d<bd){bd=d;b=f;} } return b; },
  eatFood(f,c){ const i=this.foods.indexOf(f); if(i>=0) this.foods.splice(i,1);
    FX.heart(c.x,c.y-30); Sfx.eat(); },
  /* ⚠ 정글은 무리가 꺼져 있어 동물이 서로를 전혀 의식하지 않았다.
     초식동물은 무리를 짓는다 — 바다와 같은 격자를 쓴다. */
  grid:null, gridT:-1, CELL:240, flock:true,
  rebuildGrid(list){
    if(this.gridT===Game.t) return;
    this.gridT=Game.t;
    const g={};
    for(const c of list){ const k=(c.x/this.CELL)|0; (g[k]=g[k]||[]).push(c); }
    this.grid=g;
  },
  neighbors(x,y,self){
    this.rebuildGrid(Game.animals);
    const gx=(x/this.CELL)|0, out=[];
    for(let i=-1;i<=1;i++){
      const cell=this.grid[gx+i]; if(!cell) continue;
      for(const o of cell){
        if(o===self) continue;
        if(self && (o.layer|0)!==(self.layer|0)) continue;   // 다른 층은 안 본다
        out.push(o); if(out.length>12) return out;
      }
    }
    return out;
  },
  callMine(x,y){ /* ⚠ 300프레임(5초)으로 뒀더니 화면 반대편 개체가 도착 전에 부름이 끝났다
       (실측: 셋 중 하나가 276px 지점에서 멈춤). 12초로 늘린다. */
    this.findT=720; this.callAt={x,y,life:720}; },
  scare(x,y){ this.scareAt={x,y,life:50}; FX.ring(x,y);
    for(const a of Game.animals) if(Math.abs(a.x-x)<300) a.scared=70; },

  draw(c){
    /* 하늘 */
    if(!BG.fill(c,'jungle-sky',0,VH)){
      const g=c.createLinearGradient(0,0,0,VH);
      g.addColorStop(0,'#8fd3f4'); g.addColorStop(1,'#3a7d44');
      c.fillStyle=g; c.fillRect(0,0,VW,VH);
    }
    BG.tile(c,'jungle-mountain', VH*0.34, VH*0.22, this.scroll*0.5);
    BG.tile(c,'jungle-mist',     VH*0.40, VH*0.16, this.scroll*0.8);
    BG.tile(c,'jungle-tree-far', VH*0.26, VH*0.44, this.scroll*1.1);
    BG.tile(c,'jungle-tree-mid', VH*0.22, VH*0.56, this.scroll*1.9);
    BG.tile(c,'jungle-river',    VH*0.72, VH*0.10, this.scroll*2.4);
    BG.tile(c,'jungle-ground',   VH*0.78, VH*0.22, this.scroll*3.0);
    BG.tile(c,'jungle-rock-near',VH*0.66, VH*0.20, this.scroll*2.6);
    /* 나뭇가지 — 동물보다 **뒤**에 그려 앉은 것처럼 보이게 */
    for(const p of this.perches){
      const px=((p.x - this.scroll*1.9*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-320||px>VW+320) continue;
      /* ⚠ 높이를 폭의 0.6 배로 줬더니 가지가 **화면 절반을 덮는 판자**가 됐다
         (512x200 짜리를 높이 220 으로 그리면 폭이 563px = 화면의 44%).
         가지 높이는 100 안팎이면 폭 256 으로 자연스럽다.
         Props.draw 는 밑면을 y 에 맞추므로, 발주 규격대로 윗면(위에서 40%)이
         동물 발높이에 오도록 밑면을 내려 잡는다. */
      const ph=p.h;
      if(!Props.draw(c,p.n,px,p.y+ph*0.60,ph)) this.fallbackPerch(c,p.n,px,p.y,p.w);
    }
    /* 바닥 소품 */
    for(const p of this.props){
      const px=((p.x - this.scroll*3.0*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-260||px>VW+260) continue;
      Props.draw(c,p.n,px,p.y,p.h);
    }
    /* 물가 동물 발치의 잔물결 — 물에 서 있다는 신호 */
    const rip=Props.get('water-ripple');
    if(rip && Game.animals){
      c.save(); c.globalAlpha=0.5;
      for(const a of Game.animals){
        if((a.layer|0)!==3) continue;
        const w=Math.max(70, a.w*0.5);
        c.drawImage(rip, a.x-w/2, a.y-6, w, w*0.28);
      }
      c.restore();
    }
    /* 물가 소품 */
    for(const p of this.bankProps){
      const px=((p.x - this.scroll*3.2*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-260||px>VW+260) continue;
      Props.draw(c,p.n,px,p.y+8,p.w*0.42);
    }
    /* 새 떼 — 나무보다 뒤, 하늘 앞 */
    if(this.flock2){
      c.save(); c.globalAlpha=0.55; c.fillStyle='#2b3a2c';
      for(const b of this.flock2.birds){
        const f=Math.sin(this.t*0.22+b.ph)*5;
        c.beginPath();
        c.moveTo(b.x-8, b.y);
        c.quadraticCurveTo(b.x-4, b.y-6-f, b.x, b.y-1);
        c.quadraticCurveTo(b.x+4, b.y-6-f, b.x+8, b.y);
        c.quadraticCurveTo(b.x+4, b.y-2-f*0.4, b.x, b.y+1);
        c.quadraticCurveTo(b.x-4, b.y-2-f*0.4, b.x-8, b.y);
        c.fill();
      }
      c.restore();
    }
    BG.tile(c,'jungle-tree-near',VH*0.06, VH*0.70, this.scroll*3.6);
    /* 나뭇잎 사이로 내리는 빛 — 바다의 lightrays 에 해당한다.
       아주 옅게. 아이 그림 위를 지나므로 진하면 색이 죽는다. */
    const sb=Props.get('sunbeam-jungle');
    if(sb){
      c.save(); c.globalAlpha=0.16; c.globalCompositeOperation='lighter';
      for(let i=0;i<3;i++){
        const bx=((i*470 - this.scroll*1.2)%(VW+520)+VW+520)%(VW+520)-260;
        c.drawImage(sb, bx, -40, 300, VH*0.92);
      }
      c.restore();
    }
  },
  /* 동물 뒤가 아니라 '앞'에 오는 것들 */
  drawFront(c){
    /* 먹이 */
    for(const f of this.foods){
      if(!Props.draw(c,'fruit',f.x,f.y+8,18)){
        c.fillStyle='#ff5a6e'; c.beginPath(); c.arc(f.x,f.y,7,0,TAU); c.fill();
      }
    }
    /* ⚠ 앞 층을 동물 위에 겹겹이 깔았더니 밝기가 46% 손실됐다(실측).
       아이 그림이 주인공인데 숲에 파묻힌다.
       덩굴·나뭇잎지붕은 동물이 없는 '위쪽'에만 그리고, 앞 풀만 발치에 남긴다. */
    /* 위에서 늘어진 잎·꽃덩굴 — 화면 위쪽에만 */
    for(const p of (this.hangers||[])){
      const px=((p.x - this.scroll*2.0*p.depth)%(VW*1.5)+VW*1.5)%(VW*1.5)-VW*0.25;
      if(px<-260||px>VW+260) continue;
      Props.draw(c,p.n,px,p.y+p.h,p.h);
    }
    BG.tile(c,'jungle-grass-front', VH-VH*0.13, VH*0.13, this.scroll*4.4);
    c.save(); c.beginPath(); c.rect(0,0,VW,VH*0.42); c.clip();
    BG.tile(c,'jungle-vines',  0, VH*0.42, this.scroll*2.2);
    BG.tile(c,'jungle-canopy', 0, VH*0.20, this.scroll*1.6);
    c.restore();
    /* 떨어지는 잎 */
    for(const l of this.leaves){
      c.save(); c.translate(l.x,l.y); c.rotate(l.r);
      if(!FXA.draw(c,'fx-leaf-fall',0,0,l.sz,0)){
        c.fillStyle='rgba(120,190,90,.75)';
        c.beginPath(); c.ellipse(0,0,l.sz*0.5,l.sz*0.22,0,0,TAU); c.fill();
      }
      c.restore();
    }
  },
  /* ⚠ 시각(時刻) 색조와 가장자리 어둠은 **맨 마지막**에 따로 칠한다.
     drawFront 안에 두면 나무 위 층(나비·잠자리)이 잎보다 앞에 그려지느라
     혼자만 색조를 안 받아 밤에도 대낮처럼 밝았다. */
  drawTint(c){
    c.fillStyle=JTIMES[this.timeIdx].tint; c.fillRect(0,0,VW,VH);
    /* 가장자리 어둠 — 어셋이 있으면 그림으로, 없으면 코드로 */
    const vg=BG.get('vignette');
    if(vg){ c.globalAlpha=0.75; c.drawImage(vg,0,0,VW,VH); c.globalAlpha=1; }
    else {
      const v=c.createRadialGradient(VW/2,VH*0.44,VH*0.46,VW/2,VH*0.44,VH*1.15);
      v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.24)');
      c.fillStyle=v; c.fillRect(0,0,VW,VH);
    }
  },
  prefetch(){ ['jungle-sky','jungle-mountain','jungle-mist','jungle-tree-far',
    'jungle-tree-mid','jungle-tree-near','jungle-ground','jungle-grass-front',
    'jungle-canopy','jungle-vines','jungle-river','jungle-rock-near','vignette'].forEach(n=>BG.get(n));
    ['fruit-tree','bush','log','stump','flower-patch','mushroom','rock-perch','pond','nest','fruit',
     'branch-thick','branch-thin','branch-fork','liana-loop','leaf-cluster','tree-hole','moss-patch',
     'lilypad','reeds','river-stone','mud-bank','water-ripple',
     'canopy-gap','flower-vine','hanging-leaf','sunbeam-jungle']
      .forEach(n=>Props.get(n)); }
};

</script>
<script>
/* ===== js/60_ui.js ===== */
/* UI — 아이가 쓰는 버튼. 크고, 글자 없이 그림으로. */
'use strict';
/* ── 실물 아이콘 ────────────────────────────────────────
   ⚠ 어셋이 오기 전에도 돌아야 하므로 코드 그림을 남겨 둔다.
     assets/ui/<이름>.png 이 있으면 그쪽을 쓰고, 없으면 코드로 그린다.
     '-on'(누른 상태)이 따로 오므로 상태별로 다른 파일을 쓴다. */
const Icons = {
  cache:{}, missing:{},
  get(name){
    if(this.cache[name]) return this.cache[name];
    if(this.missing[name]) return null;
    this.missing[name]=true;
    const img=new Image();
    img.onload=()=>{ this.cache[name]=img; this.missing[name]=false; };
    img.onerror=()=>{};
    img.src='assets/ui/'+name+'.png';
    return null;
  },
  /* 그렸으면 true. 버튼 중앙 기준. */
  draw(c, name, size, on){
    const img = (on && this.get(name+'-on')) || this.get(name);
    if(!img) return false;
    const w=size, h=size*(img.height/img.width);
    c.drawImage(img, -w/2, -h/2, w, h);
    return true;
  },
  prefetch(){
    ['brush-fat','brush-thin','bucket','eraser','stamp-star','stamp-heart','stamp-dot',
     'stamp-stripe','undo','redo','clear','color-swatch',
     'btn-submit','btn-back','btn-home','btn-find','btn-feed','btn-book',
     'btn-sound','btn-sound-off','btn-next','panel','tab']
      .forEach(n=>{ this.get(n); this.get(n+'-on'); });
  }
};

const UI = {
  btns:[],
  begin(){ this.btns=[]; },
  /* 버튼 등록 + 그리기. tap 판정은 hit() 로 */
  btn(c,id,x,y,w,h,draw,on){
    this.btns.push({id,x,y,w,h});
    c.save();
    c.fillStyle= on? 'rgba(255,201,74,.28)' : 'rgba(255,255,255,.10)';
    this.round(c,x,y,w,h,14); c.fill();
    c.strokeStyle= on? PAL.gold : 'rgba(255,255,255,.35)'; c.lineWidth=3;
    this.round(c,x,y,w,h,14); c.stroke();
    c.translate(x+w/2,y+h/2);
    draw(c, Math.min(w,h)*0.34);
    c.restore();
  },
  round(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); },
  hit(p){ if(!p) return null;
    for(const b of this.btns) if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h) return b.id;
    return null; },
  /* 아이콘 — 전부 코드로 */
  icon:{
    brush(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.3; c.lineCap='round';
      c.beginPath(); c.moveTo(-r*0.7,r*0.7); c.lineTo(r*0.3,-r*0.5); c.stroke();
      c.fillStyle=PAL.gold; c.beginPath(); c.arc(r*0.45,-r*0.7,r*0.4,0,TAU); c.fill(); },
    thin(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.14; c.lineCap='round';
      c.beginPath(); c.moveTo(-r*0.7,r*0.7); c.lineTo(r*0.4,-r*0.6); c.stroke();
      c.fillStyle=PAL.gold; c.beginPath(); c.arc(r*0.5,-r*0.72,r*0.22,0,TAU); c.fill(); },
    bucket(c,r){ c.fillStyle=PAL.white;
      c.beginPath(); c.moveTo(-r*0.6,-r*0.2); c.lineTo(r*0.6,-r*0.2);
      c.lineTo(r*0.4,r*0.7); c.lineTo(-r*0.4,r*0.7); c.closePath(); c.fill();
      c.fillStyle=PAL.gold; c.beginPath(); c.arc(r*0.75,r*0.2,r*0.22,0,TAU); c.fill(); },
    eraser(c,r){ c.save(); c.rotate(-0.4); c.fillStyle=PAL.white;
      c.fillRect(-r*0.6,-r*0.4,r*1.2,r*0.8);
      c.fillStyle=PAL.dim; c.fillRect(-r*0.6,0,r*1.2,r*0.4); c.restore(); },
    star(c,r){ c.fillStyle=PAL.gold; c.beginPath();
      for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r*0.95;
        c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } c.closePath(); c.fill(); },
    heart(c,r){ c.fillStyle=PAL.red; c.beginPath(); c.moveTo(0,r*0.7);
      c.bezierCurveTo(-r*1.3,-r*0.3,-r*0.5,-r*1.1,0,-r*0.35);
      c.bezierCurveTo(r*0.5,-r*1.1,r*1.3,-r*0.3,0,r*0.7); c.fill(); },
    dot(c,r){ c.fillStyle=PAL.white; c.beginPath(); c.arc(0,0,r*0.75,0,TAU); c.fill(); },
    undo(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.28; c.lineCap='round';
      c.beginPath(); c.arc(0,r*0.1,r*0.7,Math.PI*0.9,Math.PI*2.1); c.stroke();
      c.fillStyle=PAL.white; c.beginPath(); c.moveTo(-r*0.7,r*0.1);
      c.lineTo(-r*1.0,-r*0.35); c.lineTo(-r*0.3,-r*0.3); c.closePath(); c.fill(); },
    trash(c,r){ c.fillStyle=PAL.white; c.fillRect(-r*0.55,-r*0.4,r*1.1,r*1.05);
      c.fillRect(-r*0.75,-r*0.62,r*1.5,r*0.22);
      c.fillStyle='#173a52'; for(let k=-1;k<=1;k++) c.fillRect(k*r*0.28-r*0.05,-r*0.2,r*0.1,r*0.7); },
    submit(c,r){ c.fillStyle=PAL.white; c.beginPath();
      c.moveTo(-r*0.8,-r*0.45); c.lineTo(r*0.2,-r*0.45); c.lineTo(r*0.2,-r*0.8);
      c.lineTo(r*1.0,0); c.lineTo(r*0.2,r*0.8); c.lineTo(r*0.2,r*0.45);
      c.lineTo(-r*0.8,r*0.45); c.closePath(); c.fill(); },
    back(c,r){ c.fillStyle=PAL.white; c.beginPath();
      c.moveTo(r*0.7,-r*0.6); c.lineTo(-r*0.4,0); c.lineTo(r*0.7,r*0.6); c.closePath(); c.fill(); },
    find(c,r){ c.strokeStyle=PAL.white; c.lineWidth=r*0.26;
      c.beginPath(); c.arc(-r*0.15,-r*0.15,r*0.55,0,TAU); c.stroke();
      c.lineCap='round'; c.beginPath(); c.moveTo(r*0.28,r*0.28); c.lineTo(r*0.8,r*0.8); c.stroke(); },
    feed(c,r){ c.fillStyle=PAL.gold;
      [[0,-r*0.5],[-r*0.4,0],[r*0.4,r*0.1],[0,r*0.6],[-r*0.2,r*0.3]].forEach(p=>{
        c.beginPath(); c.arc(p[0],p[1],r*0.2,0,TAU); c.fill(); }); },
    book(c,r){ c.fillStyle=PAL.white;
      c.fillRect(-r*0.75,-r*0.6,r*0.7,r*1.2); c.fillRect(r*0.05,-r*0.6,r*0.7,r*1.2);
      c.fillStyle='#173a52'; c.fillRect(-r*0.06,-r*0.62,r*0.12,r*1.24); },
    sound(c,r,on){ c.fillStyle=PAL.white;
      c.beginPath(); c.moveTo(-r*0.7,-r*0.25); c.lineTo(-r*0.3,-r*0.25);
      c.lineTo(r*0.1,-r*0.7); c.lineTo(r*0.1,r*0.7); c.lineTo(-r*0.3,r*0.25);
      c.lineTo(-r*0.7,r*0.25); c.closePath(); c.fill();
      c.strokeStyle=PAL.white; c.lineWidth=r*0.16; c.lineCap='round';
      if(Sfx.on){ c.beginPath(); c.arc(r*0.2,0,r*0.45,-0.9,0.9); c.stroke();
        c.beginPath(); c.arc(r*0.2,0,r*0.75,-0.9,0.9); c.stroke(); }
      else { c.beginPath(); c.moveTo(r*0.4,-r*0.35); c.lineTo(r*0.95,r*0.35); c.stroke();
        c.beginPath(); c.moveTo(r*0.95,-r*0.35); c.lineTo(r*0.4,r*0.35); c.stroke(); } },
    time(c,r){ c.fillStyle=PAL.gold; c.beginPath(); c.arc(0,0,r*0.55,0,TAU); c.fill();
      c.strokeStyle=PAL.gold; c.lineWidth=r*0.14; c.lineCap='round';
      for(let k=0;k<8;k++){ const a=k/8*TAU;
        c.beginPath(); c.moveTo(Math.cos(a)*r*0.75,Math.sin(a)*r*0.75);
        c.lineTo(Math.cos(a)*r,Math.sin(a)*r); c.stroke(); } },
  }
};

</script>
<script>
/* ===== js/65_onboard.js ===== */
/* ══════════════════════════════════════════════════════════════════
   온보딩 — 전시장에서 처음 온 아이를 위한 안내.

   ⚠ 아이는 설명을 안 읽는다. **손이 하는 걸 보고 따라 한다.**
     그래서 글자보다 '움직이는 손가락'이 먼저다.
   ⚠ 아무도 안 만지면 다시 유인해야 한다 — 전시장은 사람이 계속 바뀐다.
     20초 놀고 있으면 스스로 안내가 다시 뜬다(어트랙트 모드).
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Onboard = {
  /* 상태: 언제 무엇을 안내하나 */
  idle:0,               // 아무 입력 없이 흐른 프레임
  step:null,            // 지금 안내 중인 것
  t:0, shown:{},
  IDLE_ATTRACT: 60*20,  // 20초 놀면 다시 유인

  /* 안내 종류 — 화면 상태에 따라 다르다 */
  pick(game){
    if(game.state===ST.TANK){
      if(!this.shown.draw) return 'draw';        // 처음: 그리기 버튼을 눌러라
      return 'attract';                          // 이후: 다시 유인
    }
    if(game.state===ST.PICK && !this.shown.pickOne) return 'pickOne';
    if(game.state===ST.PAINT){
      if(!this.shown.paint) return 'paint';      // 도안을 문질러라
      if(!this.shown.submit && this.painted(game)) return 'submit';
    }
    return null;
  },
  painted(){ /* 조금이라도 칠했나 */
    try{
      const d=Paint.fctx.getImageData(0,0,TW,TH).data;
      for(let i=3;i<d.length;i+=4*97) if(d[i]>20) return true;
    }catch(e){}
    return false;
  },
  /* 사람이 만지면 안내를 끈다 */
  touched(){
    this.idle=0;
    if(this.step){ this.shown[this.step]=true; this.step=null; this.t=0; }
  },
  update(game){
    /* 큰 화면은 아무도 안 만진다 — 안내가 계속 떠 있으면 방해만 된다 */
    if(typeof Net!=='undefined' && Net.role==='stage'){ this.step=null; return; }
    if(Input.down || Input.tapped) this.touched();
    else this.idle++;

    if(this.step){ this.t++; return; }
    /* 처음 안내는 바로, 재유인은 놀고 있을 때만 */
    const want=this.pick(game);
    if(!want) return;
    if(want==='attract' && this.idle < this.IDLE_ATTRACT) return;
    if(want!=='attract' && this.idle < 50) return;   // 화면 바뀌고 잠깐 뒤
    this.step=want; this.t=0;
    if(want==='attract') this.idle=0;
  },

  /* ── 그리기 ─────────────────────────────────────── */
  draw(c, game){
    if(!this.step) return;
    const S=this.step;
    const pulse=(Math.sin(this.t*0.06)+1)/2;

    if(S==='draw' || S==='attract'){
      /* 그리기 버튼을 가리킨다 */
      const bx=24+96*1.05, by=VH-96-24+48;
      this.spot(c, bx, by, 92+pulse*10);
      this.hand(c, bx+40+pulse*10, by+36, pulse);
      this.bubble(c, bx+30, by-104,
        S==='attract' ? '나도 그려 볼까?' : '여기를 눌러 그려요');
    }
    else if(S==='pickOne'){
      const b=UI.btns.find(x=>x.id && x.id.startsWith('sp:'));
      if(b){
        this.spot(c, b.x+b.w/2, b.y+b.h/2, Math.max(b.w,b.h)*0.72+pulse*8);
        this.hand(c, b.x+b.w/2+30+pulse*8, b.y+b.h/2+34, pulse);
        this.bubble(c, b.x+b.w/2, b.y-56, '마음에 드는 걸 고르세요');
      }
    }
    else if(S==='paint'){
      /* 손가락이 도안 위를 문지른다 */
      const bx=Paint.box();
      const k=(this.t%110)/110;
      const px=bx.x+bx.w*(0.28+0.44*k);
      const py=bx.y+bx.h*(0.5+Math.sin(k*Math.PI*2)*0.14);
      c.save();
      c.strokeStyle='rgba(255,201,74,.55)'; c.lineWidth=26; c.lineCap='round';
      c.beginPath();
      for(let i=0;i<=20;i++){
        const t=i/20*k;
        const x=bx.x+bx.w*(0.28+0.44*t), y=bx.y+bx.h*(0.5+Math.sin(t*Math.PI*2)*0.14);
        i?c.lineTo(x,y):c.moveTo(x,y);
      }
      c.stroke(); c.restore();
      this.hand(c, px, py, pulse);
      this.bubble(c, VW/2, bx.y-64, '손가락으로 문질러 색칠해요');
    }
    else if(S==='submit'){
      const b=UI.btns.find(x=>x.id==='submit');
      if(b){
        this.spot(c, b.x+b.w/2, b.y+b.h/2, Math.max(b.w,b.h)*0.66+pulse*10);
        this.hand(c, b.x+b.w/2+40+pulse*10, b.y+b.h/2+38, pulse);
        this.bubble(c, b.x+b.w/2, b.y-70, '다 그렸으면 여기!');
      }
    }
  },
  /* 가리키는 원 — 어두운 막에 구멍을 뚫는다 */
  spot(c,x,y,r){
    c.save();
    c.fillStyle='rgba(6,20,36,.42)';
    c.beginPath(); c.rect(0,0,VW,VH);
    c.arc(x,y,r,0,TAU,true);
    c.fill('evenodd');
    c.strokeStyle='rgba(255,201,74,.85)'; c.lineWidth=4;
    c.beginPath(); c.arc(x,y,r,0,TAU); c.stroke();
    c.restore();
  },
  /* 손가락 — 코드로 그린다 */
  hand(c,x,y,k){
    c.save();
    c.translate(x, y+k*4);
    c.rotate(-0.32);
    c.fillStyle='#fff6e8'; c.strokeStyle='#12212e'; c.lineWidth=3;
    c.beginPath();
    c.moveTo(0,-30); c.quadraticCurveTo(9,-30, 9,-16);
    c.lineTo(9,-4);
    c.quadraticCurveTo(20,-6, 22,2);
    c.quadraticCurveTo(24,22, 12,32);
    c.quadraticCurveTo(-4,40, -14,28);
    c.quadraticCurveTo(-22,14, -18,0);
    c.quadraticCurveTo(-12,-8, -8,-2);
    c.lineTo(-8,-16);
    c.quadraticCurveTo(-8,-30, 0,-30);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  },
  /* 말풍선 */
  bubble(c,x,y,s){
    c.save();
    c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
    const w=c.measureText(s).width+44, h=54;
    c.fillStyle='rgba(255,201,74,.96)';
    UI.round(c, x-w/2, y-h/2, w, h, 16); c.fill();
    c.beginPath();
    c.moveTo(x-12, y+h/2-2); c.lineTo(x+12, y+h/2-2); c.lineTo(x, y+h/2+16);
    c.closePath(); c.fill();
    c.fillStyle='#12212e'; c.textBaseline='middle';
    c.fillText(s, x, y+1);
    c.restore();
  },
  reset(){ this.shown={}; this.step=null; this.idle=0; }
};

</script>
<script>
/* ===== js/70_game.js ===== */
/* ══════════════════════════════════════════════════════════════════
   게임 루프 — 고르기 → 색칠 → 제출 → 수조
   ══════════════════════════════════════════════════════════════════ */
'use strict';
const ST={ TANK:0, PICK:1, PAINT:2, JOIN:3, NAME:4, CHEER:5, CODEX:6, ZOOM:7 };

/* 만졌을 때 한마디 — 아이가 무슨 일이 일어났는지 알아야 또 누른다 */
const REACT_SAY = {
  puff:'복어가 빵빵!', ink:'먹물을 뿜었어요', glow:'반짝반짝 빛나요',
  pinch:'집게를 흔들어요', hide:'쏙 숨었어요', spin:'빙글 돌았어요',
  dash:'쌩 하고 달려요', blow:'물을 뿜어요', curl:'몸을 말았어요',
  wiggle:'꼬리를 흔들어요',
  trumpet:'코를 흔들어요', roar:'크게 울어요', jump:'폴짝 뛰었어요',
  swing:'대롱대롱 매달려요', flap:'날개를 퍼덕여요', fan:'꼬리를 활짝 폈어요',
  stretch:'목을 쭉 늘여요', shake:'몸을 털어요', curlup:'동그랗게 웅크려요',
  yawn:'입을 크게 벌려요', nod:'고개를 끄덕여요',
};

const Game = {
  state:ST.TANK, creatures:[], t:0, joinC:null, joinT:0,
  pickPage:0, mineIds:[], toast:'', toastT:0,
  pendingTex:null, myName:'', cheerT:0, zoomC:null, codexPage:0,
  /* ⚠ 바다와 정글은 무대·생물·움직임이 전부 다르다.
     한 화면에 섞지 않고 세계를 통째로 갈아 끼운다. */
  realm:'sea',            // 'sea' | 'jungle'
  animals:[],             // 정글 동물 (Walker)
  /* 처음 온 아이를 위한 안내 — 손가락이 도안을 문지르는 시늉 */
  onboard:0, onboardShown:false,

  init(){
    World.init(); JWorld.init();
    /* 저장된 그림 복원 */
    /* ⚠ 정글 동물도 같은 목록에 저장되는데 전부 Creature 로 되살렸다.
       다시 켜면 코끼리가 물고기처럼 헤엄쳤다(실측). 종으로 갈라 되살린다. */
    for(const rec of (Save.data.creatures||[])){
      const img=new Image(); img.src=rec.d;
      if(typeof JUNGLE!=='undefined' && JUNGLE[rec.sp]){
        this.animals.push(new Walker(img, rec.sp, rec.n, {mine:rec.m}));  // y 는 종의 층이 정한다
      } else if(SP_BY_ID[rec.sp]){
        this.creatures.push(new Creature(img, rec.sp, rec.n, {mine:rec.m}));
      }
    }
    /* 처음이면 견본 몇 마리를 넣어 빈 수조를 피한다 */
    if(this.creatures.length<18) this.seed(24-this.creatures.length);
  },
  seed(n){
    for(let i=0;i<n;i++){
      const sp=pick(SPECIES);
      const f=document.createElement('canvas'); f.width=TW; f.height=TH;
      const fx=f.getContext('2d');
      const g=fx.createLinearGradient(0,0,TW,TH);
      const h=rndi(0,360);
      g.addColorStop(0,`hsl(${h},80%,62%)`); g.addColorStop(1,`hsl(${(h+70)%360},80%,55%)`);
      fx.fillStyle=g; fx.fillRect(0,0,TW,TH);
      for(let k=0;k<14;k++){ fx.fillStyle=`hsla(${(h+k*37)%360},90%,64%,.8)`;
        fx.beginPath(); fx.arc(rnd()*TW,rnd()*TH,10+rnd()*26,0,TAU); fx.fill(); }
      this.creatures.push(new Creature(bakeCreature(f,sp.id), sp.id, ''));
    }
  },
  say(s){ this.toast=s; this.toastT=150; },
  /* 그리기 순서 캐시를 버린다 — 생물을 지웠는데 캐시가 붙들고 있으면
     지워진 것이 몇 프레임 더 그려진다 */
  dropOrder(){ this._order=null; },
  get W(){ return this.realm==='sea' ? World : JWorld; },
  get beings(){ return this.realm==='sea' ? this.creatures : this.animals; },
  switchRealm(){
    this.realm = this.realm==='sea' ? 'jungle' : 'sea';
    if(typeof Amb!=='undefined') Amb.set(this.realm);
    this.say(this.realm==='sea' ? '바다' : '정글');
    Sfx.ui();
    if(this.realm==='jungle') JTemplate.prefetch();
  },

  /* 1단계 — 이름을 묻는다. 이름이 있어야 아이가 자기 물고기를 찾을 수 있다 */
  askName(){
    this.pendingTex = JUNGLE[Paint.spId]
      ? bakeWalker(Paint.fill, Paint.spId)
      : bakeCreature(Paint.fill, Paint.spId);
    this.pendingSp=Paint.spId;
    this.state=ST.NAME; this.nameIdle=0;
    NameBox.open(this.myName);
  },
  submit(name){
    const tex=this.pendingTex || (JUNGLE[Paint.spId]
      ? bakeWalker(Paint.fill, Paint.spId) : bakeCreature(Paint.fill, Paint.spId));
    const spId=this.pendingSp || Paint.spId;
    this.myName = (name||'').slice(0,8);
    let c;
    const snakeLike = typeof SEA_LIKE_JUNGLE!=='undefined' && SEA_LIKE_JUNGLE[spId];
    if(snakeLike){
      c=new Creature(tex, spId, this.myName, {mine:true, join:true,
        x:-140, y:JWorld.groundY()-70});
      while(this.animals.length>=140) this.animals.shift();
      this.animals.push(c);
      this.realm='jungle';
      if(typeof Amb!=='undefined') Amb.set('jungle');
    } else if(JUNGLE[spId]){
      c=new Walker(tex, spId, this.myName, {mine:true, join:true,
        x:-160, y:JWorld.groundY()});
      while(this.animals.length>=140) this.animals.shift();
      this.animals.push(c);
      this.realm='jungle';
      if(typeof Amb!=='undefined') Amb.set('jungle');
    } else {
      c=new Creature(tex, spId, this.myName, {mine:true, join:true,
        x:-140, y:World.zoneY(pick(SP_BY_ID[spId].zone))});
      this.realm='sea';
      if(typeof Amb!=='undefined') Amb.set('sea');
    }
    /* 오래된 것부터 내보내 상한 유지 (실측: 200~300 이 60fps 상한) */
    if(!JUNGLE[spId]){
      /* 실측: 실제 게임에서 300마리 65fps · 200마리 119fps. 250 에서 내보낸다. */
      while(this.creatures.length>=250) this.creatures.shift();
      this.creatures.push(c);
    }
    this.joinC=c; this.joinT=110;
    /* 2단계 — 축하 화면. 이 순간이 이 작품의 보상이다 */
    this.state=ST.CHEER; this.cheerT=0;
    FX.splash(VW*0.2, c.y); FX.confetti(VW/2, VH*0.4);
    this.splashAt={x:VW*0.2, y:c.y, t:0};
    Sfx.join();
    /* 저장 */
    try{
      const rec={d:Save.encode(tex), sp:spId, n:this.myName, m:true};
      Save.data.creatures.push(rec);
      Save.data.made=(Save.data.made||0)+1; Save.write();
      /* 여러 대 운영 — 큰 화면으로 보낸다. 서버가 없으면 조용히 넘어간다 */
      if(typeof Net!=='undefined') Net.push({d:rec.d, sp:spId, n:this.myName});
    }catch(_){}
    this.W.findT=200;      // ⚠ World 로 박아 두면 정글에서 안 켜진다
  },

  update(dt){
    this.t+=dt*60;
    if(this.toastT>0) this.toastT--;
    /* 운영자 화면이 열려 있으면 게임 입력을 가로챈다 */
    if(typeof Admin!=='undefined' && Admin.open){
      this.W.update(dt);
      for(const c of this.beings) c.update(dt,this.W);
      Admin.update();
      Input.tapped=null;
      return;
    }
    if(typeof Net!=='undefined') Net.update();
    /* 온보딩 — 전시장은 사람이 계속 바뀐다. 항상 살아 있어야 한다. */
    if(typeof Onboard!=='undefined') Onboard.update(this);
    /* 소리도 상태다 — 아이가 많이 만들수록 풍성해진다 (3초에 한 번만 조정) */
    if(typeof Amb!=='undefined'){
      if(this.t%180<1) Amb.setLevel(this.beings.length);
      /* 색칠·이름 화면에서는 배경을 낮춘다 */
      const quiet = (this.state===ST.PAINT || this.state===ST.NAME);
      if(Amb._ducked !== quiet) Amb.duck(quiet);
    }
    FX.update();
    switch(this.state){
      case ST.TANK: this.updTank(dt); break;
      case ST.PICK: this.updPick(); break;
      case ST.PAINT: Paint.update(dt); this.updPaintUI(); break;
      case ST.JOIN:
        this.W.update(dt);
        for(const c of this.beings) c.update(dt,this.W);
        if(--this.joinT<=0){ this.state=ST.TANK; }
        break;
      case ST.NAME: this.updName(); break;
      case ST.CHEER:
        if(this.splashAt) this.splashAt.t++;
        this.W.update(dt);
        for(const c of this.beings) c.update(dt,this.W);
        this.cheerT++;
        if(this.cheerT%22===0) FX.sparkle(VW/2+(rnd()-0.5)*420, VH*0.36+(rnd()-0.5)*160, 6);
        /* ⚠ 탭해야만 나가는 화면이었다. 전시장에서 아이가 그리고 자리를 뜨면
           축하 화면이 그대로 남아 **다음 아이가 못 쓴다.**
           충분히 보여 준 뒤에는 스스로 돌아간다. */
        if(this.cheerT>40 && (Input.takeTap()||Input.keys['Space']||this.cheerT>8*60)){
          this.pendingTex=null; this.state=ST.TANK; this.W.findT=260;
        }
        break;
      case ST.CODEX: this.updCodex(); break;
      case ST.ZOOM:
        this.W.update(dt);
        for(const c of this.beings) c.update(dt,this.W);
        this.zoomT=(this.zoomT||0)+1;
        if(Input.takeTap() || this.zoomT>12*60){ this.zoomC=null; this.state=ST.TANK; }
        break;
    }
  },
  updTank(dt){
    /* 운영자 열기 — 왼쪽 위 길게 누르기 */
    if(typeof Admin!=='undefined') Admin.watchHold();
    const W=this.W;
    /* 손가락을 대고 있는 동안 — 생물이 궁금해서 모여든다.
       ⚠ 버튼 위에서는 안 된다. 아이가 버튼을 누르려다 물고기를 부른다. */
    if(Input.down && !UI.hit({x:Input.x, y:Input.y})){
      if(!W.touchAt) W.touchAt={x:Input.x, y:Input.y, px:Input.x, py:Input.y, hold:0, sw:0};
      const T=W.touchAt;
      /* 손을 얼마나 빨리 휘젓고 있나 — 빠르면 물살이 되어 생물을 민다.
         가만히 있으면 끌어당기고, 휘저으면 밀어낸다. 둘 다 있어야 손맛이 난다. */
      const mv=Math.hypot(Input.x-T.x, Input.y-T.y);
      T.sw = T.sw*0.82 + mv*0.18;
      T.px=T.x; T.py=T.y;
      T.x=Input.x; T.y=Input.y; T.hold++;
      T.swirl = T.sw>7;                       // 휘젓는 중
      if(T.swirl){
        T.vx=Input.x-T.px; T.vy=Input.y-T.py;
        if(this.t%4===0){
          if(this.realm==='sea') FX.bubbles(Input.x, Input.y, 1);
          else FX.dust(Input.x, Input.y+10, 2);
        }
      } else if(T.hold>20 && T.hold%7===0){
        /* 손끝에서 물이 인다 — 뭔가 일어나고 있다는 신호 */
        if(this.realm==='sea') FX.bubbles(Input.x, Input.y, 1);
        else FX.sparkle(Input.x, Input.y, 2);
      }
    } else if(W.touchAt){
      W.touchAt=null;
    }
    W.update(dt);
    for(const c of this.beings) c.update(dt,W);
    const p=Input.takeTap();
    if(!p) return;
    const id=UI.hit(p);
    if(id==='new'){ this.state=ST.PICK; this.pickPage=0; Sfx.ui(); return; }
    if(id==='feed'){ this.W.dropFood(VW/2+(rnd()-0.5)*400, VH*0.25); this.say('먹이를 뿌렸어요'); return; }
    if(id==='find'){
      const mine=this.beings.filter(b=>b.mine).length;
      if(!mine){ this.say('아직 만든 게 없어요'); Sfx.ui(); return; }
      /* 화면 가운데 아래로 부른다 — 아이가 서 있는 쪽 */
      this.W.callMine(VW/2, this.realm==='sea' ? VH*0.55 : this.W.groundY());
      this.say('내 친구를 불렀어요'); Sfx.join(); return; }
    if(id==='realm'){ this.switchRealm(); return; }
    if(id==='sound'){ Sfx.toggle(); Sfx.ui(); return; }
    if(id==='codex'){ this.state=ST.CODEX; this.codexPage=0; Sfx.ui(); return; }
    /* ⚠ 예전엔 콕 누르면 **곧장 확대 화면**으로 넘어갔다. 그건 반응이 아니라
       화면 전환이라 수조를 만졌다는 느낌이 없었다.
       한 번 누르면 **그 자리에서 종마다 다르게 반응**하고,
       반응 중에 한 번 더 누르면 크게 본다. 아이는 눌러 보면서 알게 된다. */
    let hit=null, hd=1e9;
    for(const c of this.beings){
      const d=dist(p.x,p.y,c.x,c.y);
      if(d < Math.max(52, c.w*0.44) && d<hd){ hd=d; hit=c; }
    }
    if(hit){
      if(hit.reactT>0){                       // 두 번째 — 크게 본다
        this.zoomC=hit; this.state=ST.ZOOM; this.zoomT=0; Sfx.pop();
        FX.sparkle(hit.x,hit.y,10); return;
      }
      const kind=hit.react();
      this.say(REACT_SAY[kind] || '안녕!');
      /* 옆에 있는 것들도 조금 놀란다 — 수조가 살아 있다는 느낌 */
      for(const o of this.beings){
        if(o===hit) continue;
        const d=dist(hit.x,hit.y,o.x,o.y);
        if(d<230 && o.reactT<=0 && rnd()<0.35) o.scared=Math.max(o.scared||0, 26);
      }
      if(this.W.scareAt!==undefined) this.W.scareAt={x:hit.x,y:hit.y};
      return;
    }
    if(id==='time'){
      const W=this.W, L=(this.realm==='sea'?TIMES:JTIMES);
      W.timeIdx=(W.timeIdx+1)%L.length; this.say(L[W.timeIdx].ko); Sfx.ui(); return; }
    /* 빈 곳을 만지면 물고기가 흩어진다 */
    /* ⚠ World 로 박아 두면 정글에서 빈 곳을 눌러도 아무 일이 없다 */
    this.W.scare(p.x,p.y);
  },
  /* 고르기 화면에서 아이가 그냥 가 버리면 다음 아이가 수족관을 못 본다.
     만지면 초기화된다 — 고민하는 아이를 쫓아내지는 않는다. */
  pickIdle:0,
  updPick(){
    if(Input.tapped) this.pickIdle=0; else this.pickIdle++;
    if(this.pickIdle>70*60){ this.pickIdle=0; this.state=ST.TANK; return; }
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(id==='back'){ this.state=ST.TANK; Sfx.ui(); return; }
    if(id==='realm'){ this.switchRealm(); this.pickPage=0; return; }
    if(id==='ppage+'){ this.pickPage=(this.pickPage+1)%(this._pickPages||1); Sfx.ui(); return; }
    if(id==='ppage-'){ const n=this._pickPages||1;
      this.pickPage=(this.pickPage-1+n)%n; Sfx.ui(); return; }
    if(id && id.startsWith('sp:')){
      Paint.open(id.slice(3)); this.state=ST.PAINT; this.blankWarned=false; this.backWarned=false; Sfx.ui();
    }
  },
  updPaintUI(){
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(!id) return;
    if(id==='back'){
      /* ⚠ 다 칠한 그림이 뒤로가기 **한 번**에 사라진다(실측: 0.987 → 0.000).
         Paint.open 이 새 캔버스를 만들기 때문에 같은 종을 다시 골라도 못 돌린다.
         많이 칠했을 때만 한 번 잡아 준다 — 조금 칠했으면 종을 잘못 고른 것이다. */
      const r = Paint.inkedRatio ? Paint.inkedRatio() : 0;
      if(r > 0.05 && !this.backWarned){
        this.backWarned = true;
        this.say('한 번 더 누르면 처음부터예요');
        Sfx.ui();
        return;
      }
      this.state=ST.PICK; Sfx.ui();
    }
    else if(id==='submit'){
      /* ⚠ 아무것도 안 칠하고 제출하면 **윤곽선만** 수족관에 떠다닌다(실측: 칠 0px,
         구운 결과 2376px = 전부 선). 아이가 실수로 눌렀을 가능성이 높다.
         막지는 않는다 — 한 번만 권하고, 다시 누르면 그대로 보낸다.
         5살에게 '안 됩니다'는 스트레스고, 제 그림을 제가 정한다는 게 이 게임이다. */
      const r = Paint.inkedRatio ? Paint.inkedRatio() : 1;
      if(r < 0.05 && !this.blankWarned){
        this.blankWarned = true;
        this.say('색을 조금만 더 칠해 볼까요?');
        Sfx.ui();
        return;
      }
      this.askName();
    }
    else if(id==='undo'){ Paint.doUndo(); }
    else if(id==='clear'){ Paint.clear(); }
    else if(id==='size'){ Paint.sizeIdx=(Paint.sizeIdx+1)%Paint.sizes.length;
      Paint.size=Paint.sizes[Paint.sizeIdx]; Sfx.ui(); }
    else if(id.startsWith('t:')){ Paint.tool=id.slice(2); Sfx.ui();
      if(Paint.tool==='bucket'){ Paint.bucket(); Paint.tool='brush'; } }
    else if(id.startsWith('c:')){
      Paint.color=id.slice(2);
      Sfx.swatch(CRAYONS.indexOf(Paint.color));   // 색마다 다른 음
    }
  },

  updName(){
    const r=NameBox.poll();
    if(r===null){
      /* ⚠ 이름 칸이 뜬 채로 아이가 가 버리면 화면이 거기서 멈춘다.
         한참 기다린 뒤에는 이름 없이 보낸다 — **그림은 반드시 살린다.** */
      this.nameIdle=(this.nameIdle||0)+1;
      if(this.nameIdle>50*60){ this.nameIdle=0; NameBox.close(); this.submit(''); }
      return;
    }
    this.nameIdle=0;
    NameBox.close();
    this.submit(r);
  },
  updCodex(){
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(id==='back'){ this.state=ST.TANK; Sfx.ui(); }
    else if(id==='cpage'){ this.codexPage++; Sfx.ui(); }
  },

  /* ── 그리기 ────────────────────────────────────── */
  draw(){
    const c=Screen.ctx;
    c.setTransform(Screen.dpr,0,0,Screen.dpr,0,0);
    /* 화면 전체 바탕 — 게임 영역 밖(레터박스)까지 덮는다.
       ⚠ contain 으로 맞추므로 4:3 태블릿에서는 위아래에 여백이 생긴다.
         세계에 맞는 색이라야 띠가 아니라 '배경'으로 읽힌다. */
    c.fillStyle = this.realm==='sea' ? '#0a1f33' : '#16281b';
    c.fillRect(0,0,Screen.cssW,Screen.cssH);
    Screen.begin();
    UI.begin();
    /* ⚠ 운영자 화면이 열려 있으면 게임 화면을 아예 그리지 않는다.
       UI.btn 은 그리면서 판정도 등록한다 — 탱크를 먼저 그리면 그 버튼이
       운영자 버튼보다 앞에 등록돼 '내보내기'가 '그리기'에 가려진다(실측). */
    if(typeof Admin!=='undefined' && Admin.open){
      Admin.draw(c); Screen.end(); return;
    }
    if(this.state===ST.PAINT) this.drawPaint(c);
    else if(this.state===ST.PICK) this.drawPick(c);
    else if(this.state===ST.CODEX) this.drawCodex(c);
    else { this.drawTank(c);
      if(this.state===ST.CHEER) this.drawCheer(c);
      if(this.state===ST.ZOOM) this.drawZoom(c);
      if(this.state===ST.NAME) this.drawNameBack(c); }
    /* 안내는 가장 위에. 단, 축하·이름·확대 중에는 방해하지 않는다 */
    if(typeof Onboard!=='undefined' &&
       (this.state===ST.TANK||this.state===ST.PICK||this.state===ST.PAINT))
      Onboard.draw(c, this);

    if(typeof Admin!=='undefined' && this.state===ST.TANK) Admin.drawHold(c);
    /* ⚠ 세로 화면에서는 게임이 화면의 21% 로 쪼그라들어 버튼이 29px 이 된다
       (실측 아이폰 세로). 아이 손가락에는 너무 작다. 가로로 돌리면 해결된다. */
    if(Screen.cssH > Screen.cssW*1.15) this.drawRotateHint(c);
    /* 자체 점검 결과는 가장 위에 — 가려지면 보는 의미가 없다 */
    if(typeof SelfTest!=='undefined') SelfTest.draw(c);
    if(typeof Net!=='undefined') Net.draw(c);

    if(this.toastT>0){
      c.globalAlpha=Math.min(1,this.toastT/25);
      c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle='rgba(10,32,54,.7)';
      const w=c.measureText(this.toast).width+40;
      UI.round(c,VW/2-w/2,VH-92,w,44,12); c.fill();
      c.fillStyle=PAL.white; c.fillText(this.toast, VW/2, VH-62);
      c.globalAlpha=1;
    }
    Screen.end();
  },
  /* 가로로 돌려 달라는 안내 — 글자를 못 읽는 아이도 알 수 있게 그림으로 */
  drawRotateHint(c){
    c.save();
    c.setTransform(Screen.dpr,0,0,Screen.dpr,0,0);
    const W=Screen.cssW, H=Screen.cssH;
    c.fillStyle='rgba(8,20,34,.86)'; c.fillRect(0,0,W,H);
    c.translate(W/2, H/2);
    const s=Math.min(W,H)/360;
    c.scale(s,s);
    /* 기울어진 태블릿 그림 */
    c.save(); c.rotate(-0.42);
    c.strokeStyle='#ffd166'; c.lineWidth=7; c.lineJoin='round';
    UI.round(c,-70,-100,140,200,14); c.stroke();
    c.restore();
    /* 회전 화살표 */
    c.strokeStyle='#ffd166'; c.lineWidth=7; c.lineCap='round';
    c.beginPath(); c.arc(0,0,124,-0.35,1.15); c.stroke();
    c.beginPath(); c.moveTo(52,112); c.lineTo(64,132); c.lineTo(38,138); c.closePath();
    c.fillStyle='#ffd166'; c.fill();
    c.font='700 30px Galmuri11, sans-serif'; c.textAlign='center';
    c.fillStyle='#fff'; c.fillText('가로로 돌려 주세요', 0, 190);
    c.restore();
  },
  drawTank(c){
    const W=this.W;
    W.draw(c);
    if(this.realm==='sea') World.drawWhale(c);
    /* ⚠ 깊이 순서 — 바다는 크기로, 정글은 **층**으로 정한다.
       정글에서 크기로 정렬하면 나무 위 나비가 땅 코끼리 앞에 그려진다.
       ⚠ 매 프레임 200개 배열을 만들어 정렬하니 평상시에도 최악 23ms 가 나왔다
         (중앙은 6.4ms). 정렬 기준은 크기·층뿐이라 **거의 변하지 않는다** —
         8프레임마다 다시 세우고 그 사이에는 같은 배열을 쓴다. */
    const jungle=(this.realm==='jungle');
    if(!this._order || this._orderT===undefined || this.t-this._orderT>=8
       || this._orderN!==this.beings.length || this._orderR!==this.realm){
      this._order=this.beings.slice().sort((a,b)=>
        jungle ? (((a.layer|0)-(b.layer|0)) || ((a.depth||0)-(b.depth||0)) || (a.s-b.s))
               : (a.s-b.s));
      this._orderT=this.t; this._orderN=this.beings.length; this._orderR=this.realm;
    }
    const list=this._order;
    /* ⚠ 나무 위 층은 전경 잎보다 **앞**에 그린다.
       전경 덩굴·지붕이 y 0~302 를 덮는데 나무 위 층이 정확히 그 안이라,
       뒤에 그리면 나비·잠자리가 잎에 파묻혀 아이 그림이 안 보인다. */
    const canopyFirst = (this.realm==='jungle');
    for(const cr of list) if(!canopyFirst || (cr.layer|0)!==0) cr.draw(c, W);
    W.drawFront(c);
    if(canopyFirst) for(const cr of list) if((cr.layer|0)===0) cr.draw(c, W);
    if(W.drawTint) W.drawTint(c);
    FX.draw(c);
    /* 버튼 — ⚠ 축하·확대·이름 화면에서는 그리지 않는다.
       UI.btn 은 그리면서 동시에 판정도 등록하므로, 안 그리면 눌리지도 않는다.
       예전엔 축하 화면 위로 버튼이 그대로 보여 아이가 잘못 눌렀다. */
    if(this.state!==ST.TANK && this.state!==ST.JOIN) return;
    const S=96, y=VH-S-24;
    /* 큰 화면(stage)은 아이가 만지지 않는다 — 그리기 버튼을 안 띄운다 */
    if(typeof Net==='undefined' || Net.role!=='stage')
    UI.btn(c,'new', 24, y, S*2.1, S, (g,r)=>{
      if(!Icons.draw(g,'brush-fat',S*0.8)) UI.icon.brush(g,r*0.9);
      g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.white; g.fillText('그리기', r*1.5, r*0.35);
    });
    /* ⚠ 좌표를 하나씩 손으로 빼다가 **realm 이 find 안에 완전히 들어갔다**(실측
       find 804.8~939.2 · realm 833.6~929.6). UI.hit 은 먼저 등록된 것을 돌려주므로
       바다↔정글 전환이 **영영 안 눌렸다** — 정글로 갈 방법이 없었다.
       오른쪽에서 왼쪽으로 순서대로 쌓아 겹칠 수 없게 만든다. */
    const W2=S*1.4, GAP=12;
    const right=[
      ['sound', S,  (g,r)=>{ if(!Icons.draw(g, Sfx.on?'btn-sound':'btn-sound-off', S*0.78)) UI.icon.sound(g,r); }],
      ['time',  S,  (g,r)=>UI.icon.time(g,r)],
      ['codex', S,  (g,r)=>{ if(!Icons.draw(g,'btn-book',S*0.78)) UI.icon.book(g,r); }],
      ['realm', S,  (g,r)=>{
        /* 바다↔정글 — 물결과 나뭇잎으로 구분 */
        g.strokeStyle=PAL.white; g.lineWidth=r*0.2; g.lineCap='round';
        if(Game.realm==='sea'){
          g.beginPath();
          for(let i=0;i<3;i++){ g.moveTo(-r*0.7, -r*0.4+i*r*0.42);
            g.quadraticCurveTo(0,-r*0.7+i*r*0.42, r*0.7,-r*0.4+i*r*0.42); }
          g.stroke();
        } else {
          g.fillStyle=PAL.white;
          g.beginPath(); g.ellipse(0,0,r*0.4,r*0.72,0.6,0,TAU); g.fill();
          g.beginPath(); g.moveTo(-r*0.5,r*0.5); g.lineTo(r*0.5,-r*0.5); g.stroke();
        }
      }],
      ['find',  W2, (g,r)=>{ if(!Icons.draw(g,'btn-find',W2*0.86)) UI.icon.find(g,r); }],
      ['feed',  W2, (g,r)=>{ if(!Icons.draw(g,'btn-feed',W2*0.86)) UI.icon.feed(g,r); }],
    ];
    let bx = VW-24;
    for(const [id,w,dr] of right){ bx-=w; UI.btn(c,id,bx,y,w,S,dr); bx-=GAP; }
    /* 마릿수 */
    c.font='600 20px Galmuri11, sans-serif'; c.textAlign='left';
    c.fillStyle='rgba(255,255,255,.75)';
    c.fillText(this.realm==='sea'
      ? `${this.creatures.length}마리가 헤엄치고 있어요`
      : `${this.animals.length}마리가 걷고 있어요`, 28, 44);
  },
  drawPick(c){
    c.fillStyle='#123047'; c.fillRect(0,0,VW,VH);
    c.font='700 34px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
    c.fillText('무엇을 그릴까요?', VW/2, 62);
    /* ⚠ 처음엔 8열 142px 로 뒀는데 도안이 너무 작아 뭔지 알아볼 수 없었다.
       아이가 고르는 화면이다 — 안 보이면 못 고른다. 6열로 키운다. */
    /* ⚠ pickPage 변수는 있는데 **쓰이지 않았다.** 40종을 한 화면에 다 그려
       22칸이 화면 밖으로 나갔다(실측) — 아이가 고를 수 있는 종이 절반도 안 됐다.
       하단 버튼이 y=612 부터라 그리드는 600 까지다. 5열×3행 = 15칸씩 넘긴다.
       열을 6→5 로 줄인 만큼 도안은 오히려 커진다(196→232). */
    const cols=5, rows=3, cw=232, ch=168, x0=VW/2-cols*cw/2, y0=96;
    const per=cols*rows;
    /* 세계에 맞는 목록을 고른다. 이전에는 정글로 전환해도 바다 목록만 보여
       실제로 정글 동물을 만들 수 없었다. 실물 template은 여기서 즉시 요청한다. */
    /* ⚠ 어셋이 안 온 종을 띄우면 아이가 골랐을 때 빈 화면이 된다.
       도안이 실제로 준비된 것만 보여준다 — 새 어셋이 오면 자동으로 늘어난다.
       (정글 39종 등록 · 도착 12종 상태에서 27칸이 빈 채로 떴다) */
    const inJungle=(id)=> typeof SEA_LIKE_JUNGLE!=='undefined' && SEA_LIKE_JUNGLE[id];
    const choices=(this.realm==='sea'
      ? SPECIES.filter(sp=>!inJungle(sp.id)).map(sp=>({id:sp.id, ko:sp.ko, jungle:false}))
      : Object.entries(JUNGLE).map(([id,d])=>({id, ko:d.ko, jungle:true}))
          .concat(SPECIES.filter(sp=>inJungle(sp.id))
                         .map(sp=>({id:sp.id, ko:sp.ko, jungle:false})))
    ).filter(sp => sp.jungle ? !!JTemplate.get(sp.id) : !!Templates.get(sp.id));
    const pages=Math.max(1, Math.ceil(choices.length/per));
    if(this.pickPage>=pages) this.pickPage=0;
    const page=choices.slice(this.pickPage*per, this.pickPage*per+per);
    page.forEach((sp,i)=>{
      const x=x0+(i%cols)*cw, y=y0+((i/cols)|0)*ch;
      UI.btn(c,'sp:'+sp.id, x+8,y+8, cw-16, ch-16, (g,r)=>{
        const t=sp.jungle ? JTemplate.get(sp.id) : Templates.get(sp.id);
        const iw=cw*1.02, ih=iw*TH/TW;
        if(t) g.drawImage(t.ink, -iw/2, -ih/2-ch*0.06, iw, ih);
        g.font='700 20px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText(sp.ko, 0, ch*0.30);
      });
    });
    UI.btn(c,'back', 24, VH-108, 96,84, (g,r)=>{ if(!Icons.draw(g,'btn-back',72)) UI.icon.back(g,r); });
    /* 페이지 — 1장뿐이면 아예 안 그린다(안 그리면 눌리지도 않는다) */
    if(pages>1){
      UI.btn(c,'ppage-', VW/2-190, VH-108, 96,84, (g,r)=>{
        g.font='700 30px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('←', 0, 10); });
      UI.btn(c,'ppage+', VW/2+94, VH-108, 96,84, (g,r)=>{
        g.font='700 30px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText('→', 0, 10); });
      c.font='700 24px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle='rgba(255,255,255,.8)';
      c.fillText((this.pickPage+1)+' / '+pages, VW/2, VH-58);
    }
    UI.btn(c,'realm', VW-220, VH-108, 196,84, (g,r)=>{
      g.font='700 22px Galmuri11, sans-serif'; g.textAlign='center';
      g.fillStyle=PAL.gold; g.fillText(Game.realm==='sea'?'정글로 →':'← 바다로', 0, -10);
    });
    this._pickPages=pages;
  },
  drawPaint(c){
    Paint.draw(c);
    /* 색 12개
       ⚠ 가운데 정렬했더니 마지막 2개가 제출 버튼(VW-330~)에 가렸다(실측 118px 겹침).
          제출 버튼 왼쪽 공간 안에서 가운데를 잡는다. */
    const cs=60, gap=7;
    const zoneR=VW-346;                       // 제출 버튼 왼쪽 한계
    const zoneL=20+78+16;                     // 뒤로 버튼 오른쪽
    const total=CRAYONS.length*(cs+gap)-gap;
    const cx0=Math.max(zoneL, (zoneL+zoneR)/2-total/2);
    CRAYONS.forEach((col,i)=>{
      const x=cx0+i*(cs+gap), y=VH-92;
      UI.btns.push({id:'c:'+col, x, y, w:cs, h:cs});
      c.save();
      c.beginPath(); c.arc(x+cs/2,y+cs/2,cs/2-6,0,TAU);
      c.fillStyle=col; c.fill();
      /* 실물 테두리가 있으면 그걸 얹는다 (가운데가 비어 있어 색이 보인다) */
      c.translate(x+cs/2, y+cs/2);
      if(!Icons.draw(c,'color-swatch', cs, Paint.color===col)){
        c.strokeStyle= Paint.color===col? PAL.gold : 'rgba(255,255,255,.5)';
        c.lineWidth= Paint.color===col? 5:2;
        c.beginPath(); c.arc(0,0,cs/2-3,0,TAU); c.stroke();
      } else if(Paint.color===col){
        c.strokeStyle=PAL.gold; c.lineWidth=4;
        c.beginPath(); c.arc(0,0,cs/2+2,0,TAU); c.stroke();
      }
      c.restore();
    });
    /* 도구 */
    const S=78;
    /* ⚠ 도구가 7개로 늘면서 한 열에 다 안 들어갔다(실측):
         7번(줄무늬)이 뒤로 버튼과 **완전히 같은 자리**에 겹쳤고
         8번(붓 굵기)은 화면 밖 710~788 로 나갔다.
       아이가 스탬프를 누르면 나가 버린다. 2열로 바꾼다.
       [도구키, 코드아이콘, 실물어셋이름] */
    const tools=[['brush','brush','brush-fat'],['bucket','bucket','bucket'],
                 ['eraser','eraser','eraser'],['star','star','stamp-star'],
                 ['heart','heart','stamp-heart'],['dot','dot','stamp-dot'],
                 ['stripe','dot','stamp-stripe']];
    const TC=2, TG=8, tTop=104;
    tools.forEach((t,i)=>{
      const on=Paint.tool===t[0];
      const col=i%TC, row=(i/TC)|0;
      UI.btn(c,'t:'+t[0], 20+col*(S+TG), tTop+row*(S+TG), S, S,
        (g,r)=>{ if(!Icons.draw(g, t[2], S*0.78, on)) UI.icon[t[1]](g,r); }, on);
    });
    /* 붓 굵기 — 지금 굵기가 원으로 보인다. 도구 다음 칸에 */
    const nRow=Math.ceil(tools.length/TC);
    const szCol=tools.length%TC, szRow=(tools.length/TC)|0;
    UI.btn(c,'size', 20+szCol*(S+TG), tTop+szRow*(S+TG), S, S, (g,r)=>{
      const rr=[0.28,0.5,0.82][Paint.sizeIdx]*r;
      g.fillStyle=Paint.color;
      g.beginPath(); g.arc(0,0,rr,0,TAU); g.fill();
      g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=3; g.stroke();
    });
    UI.btn(c,'undo', VW-S-20, 116, S,S,
      (g,r)=>{ if(!Icons.draw(g,'undo',S*0.72)) UI.icon.undo(g,r); });
    UI.btn(c,'clear',VW-S-20, 116+S+10, S,S,
      (g,r)=>{ if(!Icons.draw(g,'clear',S*0.72)) UI.icon.trash(g,r); });
    UI.btn(c,'back', 20, VH-96, S,S, (g,r)=>{ if(!Icons.draw(g,'btn-back',S*0.72)) UI.icon.back(g,r); });
    /* 제출 — 가장 크게 */
    UI.btn(c,'submit', VW-330, VH-112, 300, 96, (g,r)=>{
      if(Icons.draw(g,'btn-submit',280,true)){
        g.font='700 28px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText(JUNGLE[Paint.spId]?'정글로!':'바다로!', 0, 12);
      } else {
        UI.icon.submit(g,r*0.8);
        g.font='700 26px Galmuri11, sans-serif'; g.textAlign='center';
        g.fillStyle=PAL.white; g.fillText(JUNGLE[Paint.spId]?'정글로!':'바다로!', r*1.6, r*0.4);
      }
    }, true);
  },

  /* ── 축하 — 이 작품의 보상 순간 ─────────────────── */
  drawCheer(c){
    const k=Math.min(1,this.cheerT/18);
    c.fillStyle=`rgba(6,20,36,${0.86*k})`; c.fillRect(0,0,VW,VH);
    /* 합류 물보라 — 실물 시트 */
    if(this.splashAt && this.splashAt.t<40)
      FXA.draw(c,'fx-splash-in', VW/2, VH*0.30, 620, this.splashAt.t/40);
    const pop=1+Math.sin(Math.min(this.cheerT,30)/30*Math.PI)*0.12;
    c.save(); c.translate(VW/2, VH*0.16); c.scale(pop*k, pop*k);
    c.font='700 62px Galmuri11, sans-serif'; c.textAlign='center';
    c.fillStyle=PAL.gold;
    c.fillText(this.joinC && JUNGLE[this.joinC.id] ? '정글로 왔어요!' : '바다로 갔어요!', 0, 0);
    c.restore();
    if(this.joinC){
      const t=this.joinC.tex;
      const w=460, h=w*TEX_H/TEX_W;
      c.globalAlpha=k;
      c.drawImage(t, VW/2-w/2, VH*0.40, w, h);
      c.globalAlpha=1;
    }
    if(this.myName){
      c.font='700 30px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle=PAL.white; c.fillText(this.myName+'의 물고기', VW/2, VH*0.74);
    }
    if(this.cheerT>40){
      c.globalAlpha=0.6+0.4*Math.sin(this.cheerT*0.08);
      c.font='600 24px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle=PAL.white; c.fillText('화면을 만져 주세요', VW/2, VH-64);
      c.globalAlpha=1;
    }
  },
  drawNameBack(c){
    c.fillStyle='rgba(10,32,54,.72)'; c.fillRect(0,0,VW,VH);
    c.font='700 40px Galmuri11, sans-serif'; c.textAlign='center';
    c.fillStyle=PAL.gold; c.fillText('이름을 적어 주세요', VW/2, VH*0.30);
    c.font='600 20px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    c.fillText('안 적어도 괜찮아요', VW/2, VH*0.30+38);
  },
  /* ⚠ 다른 기기에서 온 그림을 합류시킨다(큰 화면 전용).
     내 것(mine)이 아니라 '누군가의 것'이다 — 이름표는 보이되
     '내 것 찾기'에는 안 걸린다. */
  adopt(rec){
    const img=new Image();
    /* ⚠ 이미지가 안 열리면 조용히 넘긴다. 큰 화면이 멈추면 안 된다. */
    img.onerror=()=>{};
    img.onload=()=>{
      /* ⚠ 알파 없는 PNG 가 오면 검은 사각형으로 뜬다(실측).
         정상 경로에서는 캔버스가 투명 PNG 를 만들지만, 다른 기기가
         잘못 보낼 수 있다. 투명 화소가 거의 없으면 버린다. */
      try{
        const t=document.createElement('canvas'); t.width=TEX_W; t.height=TEX_H;
        const x=t.getContext('2d'); x.drawImage(img,0,0,TEX_W,TEX_H);
        const d=x.getImageData(0,0,TEX_W,TEX_H).data;
        let clear=0;
        for(let i=3;i<d.length;i+=4*13) if(d[i]<20) clear++;
        if(clear < (d.length/(4*13))*0.10){ return; }   // 투명이 10% 미만 = 통짜 사각형
      }catch(e){}
      let c;
      if(typeof JUNGLE!=='undefined' && JUNGLE[rec.sp]){
        c=new Walker(img, rec.sp, rec.n||'', {join:true, y:JWorld.groundY()});
        while(this.animals.length>=200) this.animals.shift();
        this.animals.push(c);
      } else if(SP_BY_ID[rec.sp]){
        c=new Creature(img, rec.sp, rec.n||'', {join:true, x:-140});
        while(this.creatures.length>=250) this.creatures.shift();
        this.creatures.push(c);
      } else return;
      /* 합류 연출 — 큰 화면 앞의 아이들이 '누가 보냈다'를 알아챈다 */
      FX.splash(c.x+120, c.y);
      Sfx.join();
      this.say((rec.n? rec.n+'의 ' : '') + '친구가 왔어요');
    };
    img.src=rec.d;
  },

  /* 생물의 종 이름 — 바다·정글 어느 쪽이든 안전하게
     ⚠ Walker 는 spId 가 없고 id 를 쓴다. 확대 화면이 바다로만 가정해서
       정글 동물을 누르면 터졌다(실측: reading 'ko' of undefined). */
  kindName(x){
    if(!x) return '';
    const id = x.spId || x.id;
    return (SP_BY_ID[id] && SP_BY_ID[id].ko)
        || (typeof JUNGLE!=='undefined' && JUNGLE[id] && JUNGLE[id].ko)
        || '친구';
  },

  /* ── 물고기 크게 보기 ───────────────────────────── */
  drawZoom(c){
    const z=this.zoomC; if(!z) return;
    c.fillStyle='rgba(6,20,36,.88)'; c.fillRect(0,0,VW,VH);
    const w=Math.min(VW*0.62, 620), h=w*TEX_H/TEX_W;
    /* 크게 볼 때도 헤엄친다 — 정지 이미지면 재미가 없다 */
    const sc=w/TEX_W;
    if(z instanceof Walker){
      /* 정글 동물은 걷는 모습 그대로 크게 */
      c.save();
      const keep={x:z.x, y:z.y, s:z.s};
      z.x=VW/2; z.y=VH*0.44+TEX_H*sc*0.4; z.s=sc;
      z.draw(c, JWorld);
      z.x=keep.x; z.y=keep.y; z.s=keep.s;
      c.restore();
    } else {
      const SL=44, sw=TEX_W/SL;
      c.save(); c.translate(VW/2, VH*0.44); c.scale(sc,sc);
      for(let i=0;i<SL;i++){
        const u=i/SL;
        const off=Math.sin(z.t*0.11+z.ph-u*3.0)*11*Math.pow(1-u,1.7);
        c.drawImage(z.tex, i*sw,0,sw+1,TEX_H, i*sw-TEX_W/2, off-TEX_H/2, sw+1, TEX_H);
      }
      c.restore();
    }
    c.font='700 34px Galmuri11, sans-serif'; c.textAlign='center';
    c.fillStyle=PAL.white;
    const kn=this.kindName(z);
    c.fillText(z.name ? z.name+'의 '+kn : kn, VW/2, VH*0.74);
    c.font='600 20px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    c.fillText('화면을 만지면 돌아가요', VW/2, VH-56);
  },
  /* ── 도감 — 내가 만든 것 모아 보기 ──────────────── */
  drawCodex(c){
    c.fillStyle='#123047'; c.fillRect(0,0,VW,VH);
    const mine=[...this.creatures,...this.animals].filter(x=>x.mine);
    c.font='700 34px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
    c.fillText(mine.length? `내가 만든 ${mine.length}마리` : '아직 만든 것이 없어요', VW/2, 44);
    const cols=5, cw=210, chh=150, x0=VW/2-cols*cw/2, y0=110;
    const per=cols*3, page=this.codexPage%Math.max(1,Math.ceil(mine.length/per));
    mine.slice(page*per,(page+1)*per).forEach((m,i)=>{
      const x=x0+(i%cols)*cw, y=y0+((i/cols)|0)*chh;
      c.fillStyle='rgba(255,255,255,.07)'; UI.round(c,x+6,y+6,cw-12,chh-12,14); c.fill();
      c.strokeStyle='rgba(255,255,255,.22)'; c.lineWidth=2; c.stroke();
      const iw=cw-40, ih=iw*TEX_H/TEX_W;
      c.drawImage(m.tex, x+20, y+16, iw, ih);
      c.font='600 17px Galmuri11, sans-serif'; c.textAlign='center'; c.fillStyle=PAL.white;
      c.fillText(m.name||this.kindName(m), x+cw/2, y+chh-22);
    });
    UI.btn(c,'back', 24, VH-112, 100,88, (g,r)=>{ if(!Icons.draw(g,'btn-back',76)) UI.icon.back(g,r); });
    if(mine.length>per) UI.btn(c,'cpage', VW-124, VH-112, 100,88,
      (g,r)=>{ if(Icons.draw(g,'btn-next',76)) return;
        g.fillStyle=PAL.white; g.beginPath();
        g.moveTo(-r*0.5,-r*0.6); g.lineTo(r*0.6,0); g.lineTo(-r*0.5,r*0.6); g.closePath(); g.fill(); });
  },
};

/* ── 이름 입력 — 진짜 HTML input 을 쓴다.
   ⚠ 캔버스에 한글 키보드를 그리는 건 아이에게 너무 어렵다.
     태블릿에서는 OS 키보드가 뜨는 게 가장 자연스럽고 한글 조합도 정확하다. */
const NameBox = {
  el:null, done:undefined,
  open(prev){
    this.done=undefined;
    if(!this.el){
      const w=document.createElement('div');
      w.id='namebox';
      w.innerHTML=`<input id="nb-in" maxlength="8" placeholder="이름" autocomplete="off">
        <div class="nb-row"><button id="nb-ok">보내기</button>
        <button id="nb-skip">그냥 보내기</button></div>`;
      document.body.appendChild(w);
      this.el=w;
      w.querySelector('#nb-ok').onclick=()=>{ this.done=w.querySelector('#nb-in').value.trim(); };
      w.querySelector('#nb-skip').onclick=()=>{ this.done=''; };
      w.querySelector('#nb-in').addEventListener('keydown',e=>{
        if(e.key==='Enter') this.done=e.target.value.trim(); });
    }
    const inp=this.el.querySelector('#nb-in');
    inp.value=prev||'';
    this.el.style.display='flex';
    setTimeout(()=>inp.focus(),50);
  },
  poll(){ return this.done===undefined ? null : this.done; },
  close(){ if(this.el) this.el.style.display='none'; this.done=undefined; },
};

</script>
<script>
/* ===== js/80_admin.js ===== */
/* ══════════════════════════════════════════════════════════════════
   운영자 화면 — 전시장에서 하루를 운영하려면 반드시 필요한 것들.

   ⚠ 아이가 절대 못 열어야 한다. 화면 구석을 정해진 순서로 눌러야 열린다.
   ⚠ 지우기는 되돌릴 수 없다 — 반드시 두 번 묻는다.
   운영자가 실제로 하는 일:
     · 부적절한 낙서 하나만 지우기
     · 하루가 끝나면 전부 비우기
     · 오늘 만든 걸 파일로 내보내기 (기록·인쇄용)
     · 지금 몇 장인지, 저장이 얼마나 찼는지 보기
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Admin = {
  open:false, page:0, sel:null, confirm:null, msg:'', msgT:0,
  /* ⚠ 비밀 열기 — 처음엔 네 모서리 순서로 했는데 **왼쪽 아래가 '그리기' 버튼과
     겹쳐서** 버튼이 먼저 먹었다(실측). 아이가 가장 많이 누르는 버튼이다.
     왼쪽 위 모서리를 **3초 길게 누르기**로 바꾼다 — 거기엔 버튼이 없고,
     아이는 길게 누르지 않는다. 키오스크의 표준 방식이기도 하다. */
  holdT:0, HOLD:180, CORNER:120,

  inCorner(){ return Input.down && Input.x<this.CORNER && Input.y<this.CORNER; },
  /* 탱크 화면에서 매 프레임 부른다 */
  watchHold(){
    if(this.open) return;
    if(this.inCorner()){
      this.holdT++;
      if(this.holdT>=this.HOLD){ this.holdT=0; this.enter(); }
    } else this.holdT=0;
  },
  /* 누르는 동안 진행 표시 — 운영자가 되고 있는지 알아야 한다 */
  drawHold(c){
    if(this.open || this.holdT<20) return;
    const k=this.holdT/this.HOLD;
    c.save();
    c.strokeStyle='rgba(255,201,74,.85)'; c.lineWidth=6;
    c.beginPath(); c.arc(this.CORNER/2, this.CORNER/2, 34, -Math.PI/2, -Math.PI/2+TAU*k);
    c.stroke(); c.restore();
  },

  enter(){ this.open=true; this.page=0; this.sel=null; this.confirm=null; Sfx.join(); },
  close(){ this.open=false; this.confirm=null; Sfx.ui(); },
  say(s){ this.msg=s; this.msgT=140; },

  /* 지금 화면의 내 그림 목록 (바다+정글 합쳐서) */
  all(){ return Game.creatures.concat(Game.animals).filter(b=>b.mine); },

  /* ── 동작 ────────────────────────────────────────── */
  deleteOne(b){
    let i=Game.creatures.indexOf(b);
    if(i>=0) Game.creatures.splice(i,1);
    else { i=Game.animals.indexOf(b); if(i>=0) Game.animals.splice(i,1); }
    Game.dropOrder();
    /* 저장에서도 지운다 — 화면에서만 지우면 다시 켤 때 살아난다 */
    const list=Save.data.creatures||[];
    const idx=list.findIndex(r=>r.n===b.name && r.sp===(b.spId||b.id));
    if(idx>=0){ if(typeof Net!=='undefined') Net.remove(list[idx].id); list.splice(idx,1); }
    Save.write();
    this.sel=null;
    this.say('한 마리를 지웠어요');
  },
  clearAll(){
    Game.creatures=Game.creatures.filter(c=>!c.mine);
    Game.animals=Game.animals.filter(a=>!a.mine);
    Save.data.creatures=[]; Save.data.made=0; Save.write();
    Game.dropOrder();
    if(typeof Net!=='undefined') Net.clear();
    this.say('전부 비웠어요');
  },
  /* 오늘 만든 것을 한 장의 시트로 — 인쇄·기록용 */
  exportSheet(){
    const list=Save.data.creatures||[];
    if(!list.length){ this.say('내보낼 게 없어요'); return; }
    const cols=6, cw=200, ch=150, pad=16;
    const rows=Math.ceil(list.length/cols);
    const c=document.createElement('canvas');
    c.width=cols*cw+pad*2; c.height=rows*ch+pad*2+56;
    const x=c.getContext('2d');
    x.fillStyle='#fdfaf3'; x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#12212e'; x.font='700 30px Galmuri11, sans-serif'; x.textAlign='left';
    const d=new Date();
    x.fillText(`그린바다 · ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} · ${list.length}마리`, pad, pad+30);
    let done=0;
    list.forEach((rec,i)=>{
      const img=new Image();
      img.onload=()=>{
        const px=pad+(i%cols)*cw, py=pad+56+((i/cols)|0)*ch;
        x.drawImage(img, px+8, py+6, cw-16, (cw-16)*TEX_H/TEX_W);
        x.fillStyle='#12212e'; x.font='600 15px Galmuri11, sans-serif'; x.textAlign='center';
        x.fillText(rec.n||'', px+cw/2, py+ch-10);
        if(++done===list.length) this.download(c);
      };
      img.onerror=()=>{ if(++done===list.length) this.download(c); };
      img.src=rec.d;
    });
  },
  download(canvas){
    try{
      const a=document.createElement('a');
      const d=new Date();
      a.download=`greensea-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.png`;
      a.href=canvas.toDataURL('image/png');
      document.body.appendChild(a); a.click(); a.remove();
      this.say('내려받았어요');
    }catch(e){ this.say('내려받기 실패'); }
  },
  usage(){
    let n=0;
    try{ n=(localStorage.getItem(Save.key)||'').length; }catch(e){}
    return { kb:Math.round(n/1024), pct:Math.min(100, Math.round(n/(5*1024*1024)*100)) };
  },

  /* ── 조작 ────────────────────────────────────────── */
  update(){
    if(!this.open) return;
    if(this.msgT>0) this.msgT--;
    const p=Input.takeTap(); if(!p) return;
    const id=UI.hit(p);
    if(this.confirm){
      if(id==='yes'){ this.confirm.run(); this.confirm=null; }
      else if(id==='no'){ this.confirm=null; Sfx.ui(); }
      return;
    }
    if(id==='close'){ this.close(); return; }
    if(id==='export'){ this.exportSheet(); Sfx.ui(); return; }
    if(id==='clear'){
      this.confirm={ text:`정말 ${this.all().length}마리를 전부 지울까요?`,
                     run:()=>this.clearAll() };
      Sfx.ui(); return; }
    if(id==='pg'){ this.page++; Sfx.ui(); return; }
    if(id && id.startsWith('d:')){
      const b=this.all()[+id.slice(2)];
      if(b) this.confirm={ text:`「${b.name||'이름 없음'}」을 지울까요?`, run:()=>this.deleteOne(b) };
      Sfx.ui(); return;
    }
  },

  /* ── 그리기 ──────────────────────────────────────── */
  /* 서버에서 LAN 주소를 한 번 받아 둔다 */
  fetchLan(){
    if(this._lanAsked) return;
    this._lanAsked=true;
    fetch('api/health').then(r=>r.json()).then(j=>{
      this.lan=j.lan||[]; this.port=j.port;
    }).catch(()=>{ this.lan=[]; });
  },
  draw(c){
    if(!this.open) return;
    this.fetchLan();
    c.fillStyle='rgba(8,14,24,.94)'; c.fillRect(0,0,VW,VH);
    const u=this.usage();
    c.font='700 30px Galmuri11, sans-serif'; c.textAlign='left'; c.fillStyle=PAL.gold;
    c.fillText('운영자', 32, 26);
    c.font='600 18px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    const list=this.all();
    c.fillText(`화면 ${list.length}마리 · 저장 ${Save.data.creatures.length}장 · ${u.kb}KB (${u.pct}%)`, 32, 62);

    /* 여러 기기로 쓰는 법 — ⚠ 전시장에서 제일 먼저 막히는 게 '주소를 모르는 것'이다.
       localhost 는 다른 기기에서 안 열리므로 서버가 알려준 LAN 주소를 띄운다. */
    const net=(typeof Net!=='undefined')?Net:null;
    const role=net?net.role:'solo';
    const host=(this.lan&&this.lan[0]) ? this.lan[0]+':'+(this.port||location.port) : null;
    c.textAlign='right';
    c.font='700 19px Galmuri11, sans-serif';
    c.fillStyle = role==='solo' ? PAL.dim : PAL.green;
    c.fillText('이 기기: '+(role==='paint'?'색칠용':role==='stage'?'큰 화면':'혼자 쓰기')
               + (net&&net.on?' · 서버 연결됨':''), VW-32, 26);
    c.font='600 16px Galmuri11, sans-serif'; c.fillStyle=PAL.dim;
    if(host){
      c.fillText('색칠 태블릿 →  '+host+'/?role=paint', VW-32, 50);
