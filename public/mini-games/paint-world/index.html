<script>
/* ===== js/00_core.js ===== */
/* ══════════════════════════════════════════════════════════════════
   뼈대 — 화면 · 입력 · 저장

   해상도는 픽셀 게임과 다르다. 만화체라 **고해상도 그대로** 그린다.
   기준 1280x720, 화면에 맞춰 통째로 스케일.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const VW = 1280, VH = 720;

const PAL = {
  ink:'#12212e',
  paper:'#fdfaf3', paperDark:'#efe7d6',
  deep0:'#0a2036', deep1:'#0e3a5a', deep2:'#14567f', deep3:'#1d7ba6',
  sun:'#ffd75e', coral:'#ff7a6b', kelp:'#2f7d5a', sand:'#e8d4a8', sandDark:'#c9b184',
  white:'#ffffff', dim:'#8fa3b8', gold:'#ffc94a', red:'#ff5a6e', green:'#4ddc8f',
};

/* 아이가 쓰는 12색 — 원색으로 시원하게 */
const CRAYONS = ['#ff4757','#ff8c42','#ffd23f','#8ac926','#2ec4b6','#4aa8ff',
                 '#5f6bff','#b06bff','#ff6bb0','#8b5e34','#ffffff','#2b2b3a'];

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const rnd=()=>Math.random();
const rndi=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

const Screen = {
  cv:null, ctx:null, scale:1, ox:0, oy:0,
  init(){
    this.cv=document.getElementById('game');
    this.ctx=this.cv.getContext('2d');
    addEventListener('resize',()=>this.fit());
    this.fit();
  },
  fit(){
    const dpr=Math.min(devicePixelRatio||1,2);
    const w=innerWidth, h=innerHeight;
    this.cv.width=Math.round(w*dpr); this.cv.height=Math.round(h*dpr);
    this.cv.style.width=w+'px'; this.cv.style.height=h+'px';
    /* ⚠ 예전엔 꽉 채우고(cover) '잘리는 쪽은 배경이라 괜찮다'고 적어 뒀는데
       **버튼이 잘린다.** 실측 잘림 비율:
         아이패드 가로 25% · 아이패드 세로 58% · 아이폰 세로 74%
         (16:9 화면에서만 0% 라 그동안 안 보였다)
       전시장 태블릿은 대개 4:3 이다 — 아이가 그리기 버튼을 못 누른다.
       전체가 보이게 맞추고(contain) 남는 자리는 배경색으로 채운다. */
    this.scale=Math.min(w/VW, h/VH);
    this.ox=(w-VW*this.scale)/2; this.oy=(h-VH*this.scale)/2;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.dpr=dpr; this.cssW=w; this.cssH=h;
  },
  /* 화면 좌표 → 게임 좌표 */
  toGame(x,y){ return { x:(x-this.ox)/this.scale, y:(y-this.oy)/this.scale }; },
  begin(){ const c=this.ctx; c.save(); c.translate(this.ox,this.oy); c.scale(this.scale,this.scale); },
  end(){ this.ctx.restore(); },
};

/* ── 입력 — 아이가 쓰므로 터치 우선 ─────────────────────── */
const Input = {
  down:false, x:0, y:0, px:0, py:0, tapped:null, moved:false, keys:{},
  init(){
    const cv=document.getElementById('game');
    const at=e=>{ const t=e.touches?e.touches[0]:e; return Screen.toGame(t.clientX,t.clientY); };
    const dn=e=>{ const p=at(e); this.down=true; this.moved=false;
      this.x=this.px=p.x; this.y=this.py=p.y; this.tapped={x:p.x,y:p.y}; e.preventDefault(); };
    const mv=e=>{ const p=at(e); this.px=this.x; this.py=this.y; this.x=p.x; this.y=p.y;
      if(this.down && dist(p.x,p.y,this.tapped?this.tapped.x:p.x,this.tapped?this.tapped.y:p.y)>6) this.moved=true;
      e.preventDefault(); };
    const up=e=>{ this.down=false; };
    cv.addEventListener('touchstart',dn,{passive:false});
    cv.addEventListener('touchmove',mv,{passive:false});
    cv.addEventListener('touchend',up,{passive:false});
    cv.addEventListener('mousedown',dn);
    cv.addEventListener('mousemove',mv);
    addEventListener('mouseup',up);
    addEventListener('keydown',e=>{ this.keys[e.code]=true; });
    addEventListener('keyup',e=>{ this.keys[e.code]=false; });
  },
  takeTap(){ const t=this.tapped; this.tapped=null; return t; },
};

/* ── 저장 — 아이들 그림은 하루치 유지 ────────────────────── */
const Save = {
  key:'paintworld_v1',
  data:{ creatures:[], made:0, sound:true },
  load(){ try{ const s=localStorage.getItem(this.key); if(s) Object.assign(this.data, JSON.parse(s)); }catch(_){} },
  /* ⚠ 상한 60장은 근거 없이 잡은 값이었다. 실측: 한 장 5KB,
     localStorage 는 10MB 이상 → 1,994장이 들어간다.
     전시장은 하루 수백 장이라 60장이면 오전에 다 밀린다.
     600장으로 올리되, 넘치면 오래된 것부터 버리고 그래도 안 되면 더 줄인다. */
  MAX:600,
  /* 그림 한 장을 문자열로 — ⚠ PNG 는 한 장 19.9KB 라 600장이면 11.7MB 다.
     아이패드 Safari 의 localStorage 는 보통 5MB 라 오후에 터진다.
     webp 0.8 이면 5.2KB(1/4)이고 투명도도 그대로다(실측 58% 동일).
     webp 를 못 만드는 브라우저는 toDataURL 이 png 를 돌려주므로 저절로 폴백된다. */
  encode(canvas){
    try{
      const d=canvas.toDataURL('image/webp',0.8);
      if(d && d.startsWith('data:image/webp')) return d;
    }catch(_){}
    return canvas.toDataURL('image/png');
  },
  write(){
    let keep=this.data.creatures.slice(-this.MAX);
    for(let tries=0; tries<6; tries++){
      try{
        localStorage.setItem(this.key, JSON.stringify({...this.data, creatures:keep}));
        return true;
      }catch(_){
        /* 용량 초과 — 절반씩 줄여 재시도. 게임은 계속돼야 한다 */
        keep=keep.slice(Math.ceil(keep.length/2));
        if(!keep.length) break;
      }
    }
    return false;
  },
};

</script>
<script>
/* ===== js/05_net.js ===== */
/* ══════════════════════════════════════════════════════════════════
   동기화 — 여러 대 동시 운영.

   역할은 주소로 정한다:
     ?role=paint  색칠 태블릿 — 그리고 보낸다. 수조는 자기 것만 보여도 된다
     ?role=stage  큰 화면    — 안 그리고 받기만 한다. 모두의 그림이 모인다
     (없으면)      혼자 쓰기  — 지금까지처럼 한 대로 다 한다

   ⚠ 서버가 없거나 죽어도 게임은 그대로 돌아가야 한다.
     전시 중에 와이파이가 끊겼다고 아이가 못 그리면 안 된다.
     보내기 실패는 큐에 쌓아 두고 살아나면 다시 보낸다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Net = {
  role:'solo', on:false, base:'', since:0,
  queue:[], pollT:0, failT:0, lastOk:0, sent:0, got:0,

  init(){
    const m=/[?&]role=(paint|stage)/.exec(location.search);
    this.role = m ? m[1] : 'solo';
    this.base = location.origin;
    if(this.role==='solo') return;
    this.probe();
    /* ⚠ 폴링을 렌더 루프(requestAnimationFrame)에 묶었더니 탭이 백그라운드로
       가는 순간 동기화가 **통째로 멈췄다**(실측: 서버에 5장이 있는데 0장 받음).
       전시장에서 큰 화면이 잠깐 가려지거나 화면보호기가 뜨면 그대로 끊긴다.
       네트워크는 자기 타이머로 돈다 — 렌더와 무관하게. */
    this._timer=setInterval(()=>{
      if(this.role==='stage') this.poll(); else this.flush();
      if(!this.on) this.probe();
    }, 2000);
    /* 탭이 다시 보이면 즉시 한 번 — 밀린 걸 빨리 따라잡는다 */
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){ if(this.role==='stage') this.poll(); else this.flush(); }
    });
  },
  probe(){
    fetch(this.base+'/api/health',{cache:'no-store'})
      .then(r=>r.json())
      .then(d=>{ this.on=true; this.lastOk=Date.now();
        if(this.role==='stage') this.since=0;   // 큰 화면은 오늘치를 처음부터
      })
      .catch(()=>{ this.on=false; });
  },

  /* 색칠 태블릿 — 새 그림을 보낸다 */
  push(rec){
    if(this.role==='solo') return;
    this.queue.push(rec);
    this.flush();
  },
  flush(){
    if(!this.queue.length || this._busy) return;
    this._busy=true;
    const rec=this.queue[0];
    fetch(this.base+'/api/creatures',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(rec)
    }).then(r=>r.json())
      .then(()=>{ this.queue.shift(); this.sent++; this.on=true; this.lastOk=Date.now();
        this._busy=false; if(this.queue.length) this.flush(); })
      .catch(()=>{ this.on=false; this._busy=false; });   // 큐에 남겨 둔다
  },

  /* 큰 화면 — 새 그림을 받아 온다 */
  poll(){
    if(this.role!=='stage' || this._polling) return;
    this._polling=true;
    fetch(this.base+'/api/creatures?since='+this.since,{cache:'no-store'})
      .then(r=>r.json())
      .then(d=>{
        this.on=true; this.lastOk=Date.now(); this._polling=false;
        if(!d.creatures || !d.creatures.length) return;
        for(const rec of d.creatures){
          if(rec.id>this.since) this.since=rec.id;
          Game.adopt(rec);
          this.got++;
        }
      })
      .catch(()=>{ this.on=false; this._polling=false; });
  },
  /* 운영자 조작도 서버에 반영 */
  remove(id){ if(this.role==='solo'||!id) return;
    fetch(this.base+'/api/creatures/'+id,{method:'DELETE'}).catch(()=>{}); },
  clear(){ if(this.role==='solo') return;
    fetch(this.base+'/api/clear',{method:'POST'}).catch(()=>{}); },

  /* 프레임에서는 아무것도 안 한다 — 타이머가 대신 돈다(위 init 참고) */
  update(){ this.pollT++; },
  /* 화면 구석에 상태 — 운영자가 연결을 알아야 한다 */
  draw(c){
    if(this.role==='solo') return;
    const ok=this.on;
    c.save();
    c.globalAlpha=0.75;
    c.fillStyle = ok ? PAL.green : PAL.red;
    c.beginPath(); c.arc(VW-22, 22, 7, 0, TAU); c.fill();
    c.font='600 13px Galmuri11, sans-serif'; c.textAlign='right';
    c.fillStyle = ok ? 'rgba(255,255,255,.55)' : PAL.red;
    const label = this.role==='stage' ? ('받음 '+this.got) :
                  (this.queue.length ? ('보낼 것 '+this.queue.length) : ('보냄 '+this.sent));
    c.fillText(ok?label:'연결 끊김', VW-38, 15);
    c.restore();
  }
};

</script>
<script>
/* ===== js/10_template.js ===== */
/* ══════════════════════════════════════════════════════════════════
   도안 — ink(선) + mask(칠할 면)

   ⚠ 어셋이 오기 전에도 게임이 돌아야 한다. 그래서 도안을 **코드로 생성**한다.
     실물 PNG 가 assets/sea/<id>-ink.png 로 오면 자동으로 그쪽을 쓴다.
     발주서 규격(720x480, 머리 오른쪽, 중심선 y=240)을 그대로 지킨다 —
     생성본과 실물이 같은 규격이라야 바꿔 끼워도 안 깨진다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const TW=720, TH=480, TCX=360, TCY=240;

/* 종 정의 — motion 이 이 생물의 '움직이는 방식'이다(다양성의 핵심) */
const SPECIES = [

  {id:'stingray',  ko:'가오리',   motion:'flap',     shape:'ray',     size:1.2, zone:[3,4]},

  /* ⚠ 도안이 40종 발주인데 코드가 24종만 알아서, 도착한 어셋을 못 썼다.
     40종 전부 등록한다. shape 는 코드 생성본용이라 비슷한 것을 재사용하고,

  {id:'orca',      ko:'범고래',   motion:'swim',     shape:'dolphin', size:1.6, zone:[1,2]},

  {id:'narwhal',   ko:'일각고래', motion:'swim',     shape:'whale',   size:1.6, zone:[0,1]},
  {id:'coelacanth',ko:'실러캔스', motion:'glide',    shape:'fish',    size:1.2, zone:[4,5]},
  /* ⚠ 뱀은 정글 동물이지만 다리가 없어 부위로 못 나눈다.
     도안이 assets/jungle/ 에 720x480 한 장으로 오고, 움직임은 바다의 undulate 다.
     SPECIES 에 넣되 목록에서는 정글 쪽에 보인다(SEA_LIKE_JUNGLE). */
  {id:'snake',     ko:'뱀',        motion:'undulate', shape:'eel',     size:1.15,zone:[0,1]},
];
const SP_BY_ID={}; SPECIES.forEach(s=>SP_BY_ID[s.id]=s);
/* SPECIES 에 있지만 정글 목록에 보여야 하는 종 */
const SEA_LIKE_JUNGLE = { snake:1 };

/* ── 몸 형태 그리기 — 여기가 도안의 실체 ────────────────── */
const Shapes = {
  fish(p){ p.body([[300,0],[180,-70],[40,-40],[-40,0],[40,40],[180,70]]);
           p.tail(-40,0,-150,-90,-110,0,-150,90); p.fin(60,-40,110,-110,170,-40); p.eye(240,-16); },
  fantail(p){ p.body([[290,0],[170,-72],[30,-44],[-50,0],[30,44],[170,72]]);
           p.tail(-50,0,-190,-130,-90,0,-190,130); p.fin(40,-44,90,-120,150,-44); p.eye(230,-16); },
  tall(p){ p.body([[280,0],[150,-60],[20,-30],[-40,0],[20,30],[150,60]]);
           p.tail(-40,0,-150,-60,-110,0,-150,60);
           p.fin(80,-30,60,-190,190,-46); p.fin(80,30,60,190,190,46); p.eye(226,-14); },
  round(p){ p.circle(60,0,150); p.tail(-90,0,-190,-80,-150,0,-190,80);
           p.spikes(60,0,150,10); p.eye(150,-40); },
  seahorse(p){ p.seahorseBody(); p.eye(210,-120); },
  star(p){ p.star(0,0,180,80,5); p.eye(0,-40); },
  jelly(p){ p.bell(0,-60,190,120); p.tentacles(0,50,8,180); p.eye(-40,-70); p.eye(40,-70); },
  turtle(p){ p.shell(0,0,190,140); p.flipper(-60,-110,-160,-190); p.flipper(-60,110,-160,190);
           p.headBump(200,0,60); p.eye(235,-18); },
  crab(p){ p.roundBody(0,0,190,130); p.claw(-150,-120,-60); p.claw(-150,120,60);
           p.legs(0,0,4); p.eye(60,-60); p.eye(-20,-60); },
  shrimp(p){ p.segBody(6,150,70); p.tail(-190,0,-260,-70,-230,0,-260,70);
           p.antenna(160,-20,300,-140); p.antenna(160,10,300,120); p.eye(140,-30); },
  octopus(p){ p.circle(40,-40,140); p.tentacles(20,60,8,230); p.eye(90,-70); p.eye(0,-70); },
  squid(p){ p.cone(60,0,190,110); p.fin(-100,-100,-190,-40,-100,10);
           p.fin(-100,100,-190,40,-100,-10); p.tentacles(150,20,6,180,true); p.eye(60,-50); },
  snail(p){ p.spiral(-30,-30,160,3); p.foot(-160,80,220,70); p.antenna(140,20,210,-70);
           p.antenna(150,40,230,-20); p.eye(160,10); },
  tadpole(p){ p.circle(120,0,110); p.tail(20,0,-220,-70,-140,0,-220,70); p.eye(160,-30); },
  dolphin(p){ p.body([[320,-10],[190,-80],[30,-60],[-90,-20],[-90,30],[40,70],[200,60]]);
           p.tail(-90,0,-200,-80,-150,0,-200,80); p.fin(70,-60,120,-160,190,-64); p.eye(265,-24); },
  whale(p){ p.body([[330,0],[190,-110],[10,-100],[-120,-40],[-120,50],[20,110],[200,90]]);
           p.tail(-120,0,-230,-110,-170,0,-230,110); p.fin(60,-100,110,-190,180,-102);
           p.spout(240,-100); p.eye(270,-30); },
  shark(p){ p.body([[330,0],[200,-64],[40,-70],[-80,-24],[-80,24],[50,74],[210,60]]);
           p.tail(-80,0,-200,-140,-140,0,-190,80); p.fin(40,-70,60,-200,180,-72);
           p.fin(-10,60,-30,150,90,64); p.eye(272,-22); },
  manta(p){ p.wings(0,0,340,150); p.tail(-140,0,-330,-14,-280,0,-330,14); p.eye(210,-46); p.eye(210,46); },
  ray(p){ p.diamond(0,0,270,170); p.tail(-160,0,-320,-12,-270,0,-320,12); p.eye(150,-40); p.eye(150,40); },
  eel(p){ p.longBody(300,-300,70); p.tail(-300,0,-370,-50,-340,0,-370,50); p.eye(250,-24); },
  penguin(p){ p.egg(0,0,150,210); p.belly(30,0,100,170); p.flipper(-40,-150,-120,-70);
           p.beak(150,-40,70); p.eye(120,-80); },
  seal(p){ p.body([[300,0],[170,-90],[10,-80],[-140,-40],[-140,40],[20,90],[190,80]]);
           p.tail(-140,0,-240,-90,-200,0,-240,90); p.flipper(0,80,-90,180); p.eye(250,-26); },
  lionfish(p){ p.body([[240,0],[130,-70],[10,-50],[-70,0],[10,50],[130,70]]);
           p.tail(-70,0,-170,-80,-130,0,-170,80);
           for(let i=0;i<5;i++){ const a=-0.9+i*0.42; p.ray(60,-50, 60+Math.cos(a)*230, -50+Math.sin(a)*230-60); }
           for(let i=0;i<5;i++){ const a=0.9-i*0.42; p.ray(60,50, 60+Math.cos(a)*230, 50+Math.sin(a)*230+60); }
           p.eye(190,-16); },

           p.tail(-70,0,-200,-110,-140,0,-200,110);
           p.fin(70,-50,110,-150,180,-54); p.fin(70,50,110,150,180,54);

/* ── 도안 생성기 ─────────────────────────────────────────
   같은 붓질을 ink(선) 과 mask(면) 두 캔버스에 각각 적용한다.
   이 이중 기록이 발주서 규격 그대로다. */
function makeTemplate(sp){
  const inkC=document.createElement('canvas'); inkC.width=TW; inkC.height=TH;
  const mskC=document.createElement('canvas'); mskC.width=TW; mskC.height=TH;
  const I=inkC.getContext('2d'), M=mskC.getContext('2d');
  for(const c of [I,M]){ c.translate(TCX,TCY); c.lineJoin='round'; c.lineCap='round'; }
  I.strokeStyle=PAL.ink; I.lineWidth=12;
  M.fillStyle='#fff';

  const S=(sp.size||1)*0.62;      // 720x480 안에 들어오게
  for(const c of [I,M]) c.scale(S,S);

  const both=(fn)=>{ fn(I,true); fn(M,false); };
  const P={
    body(pts){ both((c,isInk)=>{ c.beginPath();
      c.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++){
        const a=pts[i-1], b=pts[i];
        c.quadraticCurveTo((a[0]+b[0])/2*1.15,(a[1]+b[1])/2*1.15,b[0],b[1]);
      }
      c.closePath(); isInk?c.stroke():c.fill(); }); },
    circle(x,y,r){ both((c,i)=>{ c.beginPath(); c.arc(x,y,r,0,TAU); i?c.stroke():c.fill(); }); },
    roundBody(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.ellipse(x,y,w,h,0,0,TAU); i?c.stroke():c.fill(); }); },
    egg(x,y,w,h){ this.roundBody(x,y,w,h); },
    belly(x,y,w,h){ both((c,i)=>{ if(!i) return; c.beginPath(); c.ellipse(x,y,w,h,0,0,TAU); c.stroke(); }); },
    cone(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x+w,y); c.quadraticCurveTo(x,y-h,x-w,y);
      c.quadraticCurveTo(x,y+h,x+w,y); c.closePath(); i?c.stroke():c.fill(); }); },
    diamond(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x+w,y); c.lineTo(x,y-h);
      c.lineTo(x-w,y); c.lineTo(x,y+h); c.closePath(); i?c.stroke():c.fill(); }); },
    wings(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x+w*0.6,y);
      c.quadraticCurveTo(x,y-h*1.5,x-w,y-h*0.2);
      c.quadraticCurveTo(x-w*0.4,y,x-w,y+h*0.2);
      c.quadraticCurveTo(x,y+h*1.5,x+w*0.6,y); c.closePath(); i?c.stroke():c.fill(); }); },
    longBody(x1,x2,r){ both((c,i)=>{ c.beginPath(); c.moveTo(x1,0);
      c.quadraticCurveTo((x1+x2)/2,-r,x2,0); c.quadraticCurveTo((x1+x2)/2,r,x1,0);
      c.closePath(); i?c.stroke():c.fill(); }); },
    segBody(n,x,r){ for(let k=0;k<n;k++){ const px=x-k*(2*r*0.62);
      both((c,i)=>{ c.beginPath(); c.ellipse(px,0,r*0.72,r,0,0,TAU); i?c.stroke():c.fill(); }); } },
    tail(bx,by,x1,y1,mx,my,x2,y2){ both((c,i)=>{ c.beginPath(); c.moveTo(bx,by);
      c.lineTo(x1,y1); c.quadraticCurveTo(mx,my,x2,y2); c.closePath(); i?c.stroke():c.fill(); }); },
    fin(x1,y1,x2,y2,x3,y3){ both((c,i)=>{ c.beginPath(); c.moveTo(x1,y1);
      c.quadraticCurveTo((x1+x2)/2,(y1+y2)/2,x2,y2); c.lineTo(x3,y3); c.closePath();
      i?c.stroke():c.fill(); }); },
    ray(x1,y1,x2,y2){ both((c,i)=>{ if(i){ c.lineWidth=8; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.lineWidth=12; }
      else { c.beginPath(); c.moveTo(x1,y1-14); c.lineTo(x2,y2); c.lineTo(x1,y1+14); c.closePath(); c.fill(); } }); },
    star(x,y,R,r,n){ both((c,i)=>{ c.beginPath();
      for(let k=0;k<n*2;k++){ const a=-Math.PI/2+k*Math.PI/n, rr=k%2?r:R;
        c.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
      c.closePath(); i?c.stroke():c.fill(); }); },
    bell(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.moveTo(x-w,y+h*0.5);
      c.quadraticCurveTo(x-w,y-h, x,y-h); c.quadraticCurveTo(x+w,y-h, x+w,y+h*0.5);
      c.quadraticCurveTo(x,y+h*0.9, x-w,y+h*0.5); c.closePath(); i?c.stroke():c.fill(); }); },
    tentacles(x,y,n,len,fwd){ for(let k=0;k<n;k++){ const t=(k/(n-1)-0.5);
      const ex=x+(fwd?len:t*len*0.8), ey=y+(fwd?t*len*0.5:len*(0.7+Math.abs(t)*0.4));
      both((c,i)=>{ if(i){ c.lineWidth=9; c.beginPath(); c.moveTo(x+t*90,y);
          c.quadraticCurveTo(x+t*150,(y+ey)/2, ex,ey); c.stroke(); c.lineWidth=12; }
        else { c.beginPath(); c.moveTo(x+t*90-13,y); c.quadraticCurveTo(x+t*150,(y+ey)/2, ex,ey);
          c.lineTo(ex,ey); c.quadraticCurveTo(x+t*150,(y+ey)/2, x+t*90+13,y); c.closePath(); c.fill(); } }); } },
    shell(x,y,w,h){ this.roundBody(x,y,w,h);
      both((c,i)=>{ if(!i) return; for(let k=-1;k<=1;k++){ c.beginPath();
        c.moveTo(x-w*0.7, y+k*h*0.45); c.lineTo(x+w*0.7, y+k*h*0.45); c.stroke(); }
        c.beginPath(); c.moveTo(x,y-h*0.9); c.lineTo(x,y+h*0.9); c.stroke(); }); },
    spiral(x,y,r,turns){ both((c,i)=>{ c.beginPath();
      for(let a=0;a<turns*TAU;a+=0.12){ const rr=r*(1-a/(turns*TAU)*0.82);
        const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; a?c.lineTo(px,py):c.moveTo(px,py); }
      if(i){ c.stroke(); } else { c.closePath(); c.fill();
        c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); } }); },
    foot(x,y,w,h){ both((c,i)=>{ c.beginPath(); c.ellipse(x+w/2,y,w/2,h/2,0,0,TAU); i?c.stroke():c.fill(); }); },
    claw(x,y,ang){ both((c,i)=>{ c.save(); c.translate(x,y); c.rotate(ang*Math.PI/180);
      c.beginPath(); c.moveTo(0,0); c.quadraticCurveTo(-70,-30,-120,0);
      c.quadraticCurveTo(-70,40,0,0); c.closePath(); i?c.stroke():c.fill(); c.restore(); }); },
    legs(x,y,n){ for(let k=0;k<n;k++){ const t=k/(n-1)-0.5;
      both((c,i)=>{ if(!i) return; c.lineWidth=8;
        c.beginPath(); c.moveTo(x+t*150,y+60); c.quadraticCurveTo(x+t*180,y+150,x+t*220,y+170);
        c.stroke(); c.lineWidth=12; }); } },
    flipper(x1,y1,x2,y2){ both((c,i)=>{ c.beginPath(); c.moveTo(x1,y1);
      c.quadraticCurveTo((x1+x2)/2+30,(y1+y2)/2, x2,y2);
      c.quadraticCurveTo((x1+x2)/2-20,(y1+y2)/2+40, x1,y1); c.closePath(); i?c.stroke():c.fill(); }); },
    headBump(x,y,r){ this.circle(x,y,r); },
    beak(x,y,l){ both((c,i)=>{ c.beginPath(); c.moveTo(x,y-16); c.lineTo(x+l,y);
      c.lineTo(x,y+16); c.closePath(); i?c.stroke():c.fill(); }); },
    antenna(x1,y1,x2,y2){ both((c,i)=>{ if(!i) return; c.lineWidth=7;
      c.beginPath(); c.moveTo(x1,y1); c.quadraticCurveTo((x1+x2)/2,(y1+y2)/2-40,x2,y2);
      c.stroke(); c.lineWidth=12; }); },
    spikes(x,y,r,n){ for(let k=0;k<n;k++){ const a=k/n*TAU;
      both((c,i)=>{ if(!i) return; c.lineWidth=8; c.beginPath();
        c.moveTo(x+Math.cos(a)*r*0.95, y+Math.sin(a)*r*0.95);
        c.lineTo(x+Math.cos(a)*(r+42), y+Math.sin(a)*(r+42)); c.stroke(); c.lineWidth=12; }); } },
    spout(x,y){ both((c,i)=>{ if(!i) return; c.lineWidth=8; c.beginPath();
      c.moveTo(x,y); c.quadraticCurveTo(x+10,y-60,x-10,y-100); c.stroke(); c.lineWidth=12; }); },
    seahorseBody(){ both((c,i)=>{ c.beginPath();
      c.moveTo(180,-170); c.quadraticCurveTo(250,-120,190,-60);
      c.quadraticCurveTo(120,-20,110,60); c.quadraticCurveTo(100,170,10,190);
      c.quadraticCurveTo(-60,200,-40,130); c.quadraticCurveTo(-10,150,20,120);
      c.quadraticCurveTo(40,60,40,-20); c.quadraticCurveTo(50,-120,120,-190);
      c.closePath(); i?c.stroke():c.fill(); }); },
    /* 눈은 ink 에만 — mask 에서 비워야 칠해지지 않는다 (발주서 규칙) */
    eye(x,y){ I.save(); I.fillStyle=PAL.ink; I.beginPath(); I.arc(x,y,26,0,TAU); I.fill();
      I.fillStyle='#fff'; I.beginPath(); I.arc(x+8,y-8,10,0,TAU); I.fill(); I.restore();
      M.save(); M.globalCompositeOperation='destination-out';
      M.beginPath(); M.arc(x,y,30,0,TAU); M.fill(); M.restore(); },
  };
  (Shapes[sp.shape]||Shapes.fish)(P);
  return {ink:inkC, mask:mskC};
}

/* 캐시 + 실물 어셋 우선 */
const Templates = {
  cache:{}, real:{},
  get(id){
    if(this.cache[id]) return this.cache[id];
    const sp=SP_BY_ID[id];
    const t=makeTemplate(sp);
    this.cache[id]=t;
    /* 실물이 있으면 조용히 갈아 끼운다 */
    this.tryReal(id,t);
    return t;
  },
  tryReal(id,t){
    if(this.real[id]!==undefined) return;
    this.real[id]=false;
    let got=0;
    const load=(kind)=>{
      const img=new Image();
      img.onload=()=>{ t[kind+'Real']=img; if(++got===2){ t.ink=t.inkReal; t.mask=t.maskReal;
        this.real[id]=true; } };
      img.onerror=()=>{};
      img.src=`assets/${(typeof SEA_LIKE_JUNGLE!=='undefined'&&SEA_LIKE_JUNGLE[id])?'jungle':'sea'}/${id}-${kind}.png`;
    };
    load('ink'); load('mask');
  }
};

</script>
<script>
/* ===== js/50_fx.js ===== */
/* 이펙트 · 소리 — 손맛 */
'use strict';
/* ── 연출 스프라이트 ────────────────────────────────────
   ⚠ 프레임 시트다. 가로로 N칸이 이어져 있고 왼쪽부터 시간 순서.
     어셋이 없으면 지금까지의 코드 그림으로 폴백한다. */
const FXA = {
  cache:{}, tried:{},
  /* 이름 → [프레임수] */
  FRAMES:{ 'fx-splash-in':4, 'fx-sparkle':4, 'fx-ring-pulse':4, 'fx-bubble-pop':4,
           'fx-leaf-fall':1, 'fx-dust-puff':4, 'fx-heart-pop':3, 'fx-spotlight':1,
           'fx-confetti':4, 'fx-name-tag':1, 'fx-arrow-point':1, 'fx-water-ripple':4 },
  get(n){
    if(this.cache[n]) return this.cache[n];
    if(this.tried[n]) return null;
    this.tried[n]=true;
    const img=new Image(); img.onload=()=>{ this.cache[n]=img; };
    img.src='assets/ui/'+n+'.png';
    return null;
  },
  /* k = 0~1 진행도. 중앙 기준. */
  draw(c,n,x,y,size,k){
    const img=this.get(n); if(!img) return false;
    const N=this.FRAMES[n]||1;
    const fw=img.width/N, fh=img.height;
    const f=Math.min(N-1, Math.floor(k*N));
    const w=size, h=size*(fh/fw);
    c.drawImage(img, f*fw,0,fw,fh, x-w/2, y-h/2, w, h);
    return true;
  },
  prefetch(){ Object.keys(this.FRAMES).forEach(n=>this.get(n)); }
};

const FX = {
  list:[],
  /* ⚠ 상한이 없으면 여럿이 동시에 반응할 때 프레임이 무너진다
     (실측: 200마리 중 100이 반응 → 파티클 214개 → 최악 28.3ms, 예산 16.7).
     오래된 것부터 버린다 — 새로 생긴 반응이 더 중요하다. */
  MAX:190,
  push(p){
    if(this.list.length>=this.MAX) this.list.splice(0, this.list.length-this.MAX+1);
    this.list.push(p);
  },
  prefetch(){ FXA.prefetch(); },
  clear(){ this.list.length=0; },
  ring(x,y){ this.push({k:'ring',x,y,t:0,max:34}); },
  heart(x,y){ this.push({k:'heart',x,y,t:0,max:44,vy:-1.2}); },
  splash(x,y){ for(let i=0;i<26;i++){ const a=rnd()*TAU, s=2+rnd()*5;
    this.push({k:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,t:0,max:40,
      c:pick(['#ffffff','#bfe9ff','#8fd4ff'])}); } },
  confetti(x,y){ for(let i=0;i<40;i++){ const a=rnd()*TAU, s=2+rnd()*6;
    this.push({k:'conf',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,t:0,max:70,
      c:pick(CRAYONS), rot:rnd()*TAU, vr:(rnd()-0.5)*0.4}); } },
  /* ── 만졌을 때 쓰는 것들 ─────────────────────────── */
  ink(x,y,dir){                    // 문어·오징어 먹물
    for(let i=0;i<18;i++){ const a=rnd()*TAU, sp=0.6+rnd()*2.2;
      this.push({k:'ink', x:x-dir*20, y, vx:Math.cos(a)*sp-dir*1.4,
        vy:Math.sin(a)*sp*0.6-0.3, t:0, max:64, r:10+rnd()*22}); }
  },
  bubbles(x,y,n){                  // 고래 물 뿜기
    for(let i=0;i<(n||12);i++)
      this.push({k:'bub', x:x+(rnd()-0.5)*40, y, vx:(rnd()-0.5)*1.0,
        vy:-1.2-rnd()*1.6, t:0, max:70, r:3+rnd()*7});
  },
  glow(x,y,col){                   // 해파리·아귀 빛
    this.push({k:'glow', x, y, t:0, max:46, c:col||'#9ff'});
  },
  note(x,y){                       // 소리내는 동물 — 음표
    for(let i=0;i<3;i++)
      this.push({k:'note', x:x+(rnd()-0.5)*30, y, vx:(rnd()-0.5)*0.8,
        vy:-1.1-rnd()*0.7, t:0, max:56, rot:(rnd()-0.5)*0.5, vr:0});
  },
  dust(x,y,n){                     // 땅을 구르거나 뛸 때
    for(let i=0;i<(n||10);i++){ const a=-rnd()*Math.PI;
      this.push({k:'dot', x, y, vx:Math.cos(a)*(1+rnd()*3),
        vy:Math.sin(a)*(0.6+rnd()*1.4), t:0, max:34, c:'rgba(230,215,180,.9)'}); }
  },
  sparkle(x,y,n){ for(let i=0;i<(n||8);i++){ const a=rnd()*TAU, s=1+rnd()*3;
    this.push({k:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,max:30,c:PAL.gold}); } },
  update(){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i]; p.t++;
      if(p.vx!==undefined){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy=p.vy*0.95+0.12; }
      if(p.k==='heart') p.y+=p.vy;
      if(p.k==='bub'){ p.vy*=0.99; p.x+=Math.sin(p.t*0.12)*0.6; }
      if(p.rot!==undefined) p.rot+=p.vr;
      if(p.t>p.max) this.list.splice(i,1);
    }
  },
  draw(c){
    for(const p of this.list){
      const k=1-p.t/p.max;
      c.globalAlpha=k;
      if(p.k==='ring'){
        if(!FXA.draw(c,'fx-ring-pulse',p.x,p.y,180,1-k)){
          c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=3;
          c.beginPath(); c.arc(p.x,p.y,(1-k)*90,0,TAU); c.stroke();
        }
      } else if(p.k==='heart'){
        if(FXA.draw(c,'fx-heart-pop',p.x,p.y,44,1-k)){ c.globalAlpha=1; continue; }
        c.fillStyle=PAL.red; const r=9;
        c.beginPath(); c.moveTo(p.x,p.y+r*0.7);
        c.bezierCurveTo(p.x-r*1.3,p.y-r*0.3,p.x-r*0.5,p.y-r*1.1,p.x,p.y-r*0.35);
        c.bezierCurveTo(p.x+r*0.5,p.y-r*1.1,p.x+r*1.3,p.y-r*0.3,p.x,p.y+r*0.7);
        c.fill();
      } else if(p.k==='ink'){
        c.globalAlpha=k*0.55;
        c.fillStyle='#101a26';
        c.beginPath(); c.arc(p.x,p.y,p.r*(1.4-k*0.5),0,TAU); c.fill();
      } else if(p.k==='bub'){
        c.globalAlpha=k*0.85;
        c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=2;
        c.beginPath(); c.arc(p.x,p.y,p.r,0,TAU); c.stroke();
      } else if(p.k==='glow'){
        const g=c.createRadialGradient(p.x,p.y,2,p.x,p.y,90*(1.2-k*0.4));
        g.addColorStop(0,p.c); g.addColorStop(1,'rgba(255,255,255,0)');
        c.globalAlpha=k*0.7; c.fillStyle=g;
        c.beginPath(); c.arc(p.x,p.y,90*(1.2-k*0.4),0,TAU); c.fill();
      } else if(p.k==='note'){
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillStyle=PAL.white; c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
        c.fillText('♪',0,0); c.restore();
      } else if(p.k==='conf'){
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillStyle=p.c; c.fillRect(-5,-3,10,6); c.restore();
      } else {
        c.fillStyle=p.c||'#fff';
        c.beginPath(); c.arc(p.x,p.y,3*k+1,0,TAU); c.fill();
      }
    }
    c.globalAlpha=1;
  }
};

const Sfx = {
  ac:null, master:null, on:true,
  unlock(){ if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ac=new AC(); this.master=this.ac.createGain();
    this.master.gain.value=this.on?0.5:0; this.master.connect(this.ac.destination); },
  toggle(){ this.on=!this.on; if(this.master) this.master.gain.value=this.on?0.5:0;
    Save.data.sound=this.on; Save.write(); return this.on; },
  tone(f,d,type,g,slide){ if(!this.ac) return;
    const t=this.ac.currentTime, o=this.ac.createOscillator(), gg=this.ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    gg.gain.setValueAtTime(0,t); gg.gain.linearRampToValueAtTime(g||0.12,t+0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gg); gg.connect(this.master); o.start(t); o.stop(t+d+0.02); },
  ui(){ this.tone(720,0.06,'sine',0.09,900); },
  /* ⚠ 색칠은 이 작품에서 아이가 가장 오래 하는 행동인데 **아무 소리도 없었다.**
     손끝이 들려야 '내가 칠하고 있다'가 된다.
     다만 매 프레임 내면 소음이 된다 — 호출부에서 간격을 둔다. */
  brush(pitch){
    if(!this.ac) return;
    const t=this.ac.currentTime, len=Math.floor(this.ac.sampleRate*0.05);
    const b=this.ac.createBuffer(1,len,this.ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ac.createBufferSource(); src.buffer=b;
    /* ⚠ Q=1.4 대역필터가 에너지를 크게 깎아 배경 대비 1.2배밖에 안 됐다(실측).
       Q 를 넓히고 이득을 올린다. 목표는 배경의 2.5배 이상. */
    const f=this.ac.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=900+(pitch||0)*600; f.Q.value=0.8;
    const g=this.ac.createGain(); g.gain.value=0.55;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  /* 색을 고를 때 — 색마다 음이 다르면 아이가 색을 '듣는다' */
  swatch(i){ this.tone(440*Math.pow(2, i/12), 0.09, 'triangle', 0.08); },
  pop(){ this.tone(420,0.09,'sine',0.11,700); },
  plop(){ this.tone(300,0.12,'sine',0.11,120); },
  eat(){ this.tone(880,0.06,'triangle',0.08,1200); },
  /* 만졌을 때 — 반응마다 다른 소리. 같은 소리면 종이 다른 걸 모른다 */
  creature(kind){
    if(!this.on) return;
    const T=(f,d,ty,g,sl,delay)=>setTimeout(()=>this.tone(f,d,ty,g,sl), delay||0);
    switch(kind){
      case 'puff':    T(180,0.22,'sine',0.13,520); break;                    // 부풀
      case 'ink':     T(140,0.34,'sawtooth',0.07,60); break;                 // 퍼짐
      case 'glow':    [660,880,1180].forEach((f,i)=>T(f,0.20,'sine',0.07,f*1.1,i*70)); break;
      case 'pinch':   [0,90,180].forEach((d,i)=>T(1100,0.05,'square',0.05,900,d)); break;
      case 'hide':    T(520,0.20,'sine',0.10,180); break;                    // 쏙
      case 'spin':    T(500,0.26,'triangle',0.10,1100); break;
      case 'dash':    T(300,0.16,'sawtooth',0.08,1400); break;
      case 'blow':    T(220,0.40,'sine',0.11,90); break;                     // 물 뿜기
      case 'curl':    T(400,0.24,'sine',0.09,240); break;
      case 'trumpet': T(210,0.34,'sawtooth',0.11,330); break;                // 코끼리
      case 'roar':    T(120,0.42,'sawtooth',0.13,80); break;                 // 포효
      case 'jump':    T(420,0.13,'sine',0.10,900); T(300,0.10,'sine',0.07,180,150); break;
      case 'swing':   [640,540,700].forEach((f,i)=>T(f,0.12,'sine',0.07,f*0.9,i*90)); break;
      case 'flap':    [0,80,160].forEach(d=>T(240,0.06,'triangle',0.06,180,d)); break;
      case 'fan':     [520,660,820,980].forEach((f,i)=>T(f,0.16,'sine',0.07,f*1.2,i*60)); break;
      case 'stretch': T(340,0.30,'sine',0.09,620); break;
      case 'shake':   [0,60,120,180].forEach(d=>T(300,0.05,'square',0.05,240,d)); break;
      case 'curlup':  T(600,0.22,'sine',0.09,220); break;
      case 'yawn':    T(160,0.38,'sine',0.11,300); break;
      default:        T(560,0.12,'sine',0.09,760);
    }
  },
  splash(){ [400,600,900].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,'sine',0.1,f*1.5),i*60)); },
  join(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.28,'triangle',0.12),i*95)); },
};

</script>
<script>
/* ===== js/55_ambience.js ===== */
/* ══════════════════════════════════════════════════════════════════
   소리 풍경 — 세계마다 다르게, 전부 Web Audio 합성 (오디오 파일 0개).

   ⚠ 효과음만 있으면 '조용한 화면에 가끔 삑 소리'다.
     전시장은 소리가 계속 나야 살아 있는 공간이 된다.
   ⚠ 다만 아이들이 몇 시간씩 듣는다. **거슬리면 안 된다.**
     - 반복 주기가 뚜렷하면 귀에 박힌다 → 주기를 어긋나게 겹친다
     - 고음이 계속되면 피로하다 → 저역 위주, 고역은 짧게만
     - 소리가 곧 상태다: 아이가 많이 만들수록 풍성해진다
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Amb = {
  ac:null, bus:null, nodes:[], realm:null, started:false, level:0,

  init(sfx){
    if(this.started || !sfx.ac) return;
    this.ac=sfx.ac;
    this.bus=this.ac.createGain();
    this.bus.gain.value=0;                 // 조용히 시작해 서서히 올린다
    this.bus.connect(sfx.master);
    this.started=true;
  },
  /* 세계가 바뀌면 갈아 끼운다 */
  set(realm){
    if(!this.started || this.realm===realm) return;
    this.stopAll();
    this.realm=realm;
    if(realm==='sea') this.buildSea(); else this.buildJungle();
    this.fade(0.55, 1.6);
  },
  fade(to, sec){
    if(!this.bus) return;
    const t=this.ac.currentTime;
    this.bus.gain.cancelScheduledValues(t);
    this.bus.gain.setValueAtTime(this.bus.gain.value, t);
    this.bus.gain.linearRampToValueAtTime(to, t+sec);
  },
  stopAll(){
    for(const n of this.nodes){ try{ n.stop ? n.stop() : n.disconnect(); }catch(e){} }
    this.nodes=[];
    if(this._timer){ clearInterval(this._timer); this._timer=null; }
  },
  /* 흰소음 버퍼 — 물소리·바람의 재료 */
  noiseBuf(sec){
    const len=Math.floor(this.ac.sampleRate*sec);
    const b=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=b.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){
      /* 갈색 잡음 — 흰소음보다 저역이라 귀에 편하다 */
      last=(last+(Math.random()*2-1)*0.06); last=Math.max(-1,Math.min(1,last*0.997));
      d[i]=last*3;
    }
    return b;
  },
  loopNoise(freq, q, gain, type){
    const src=this.ac.createBufferSource();
    src.buffer=this.noiseBuf(4); src.loop=true;
    const f=this.ac.createBiquadFilter();
    f.type=type||'lowpass'; f.frequency.value=freq; f.Q.value=q||0.6;
    const g=this.ac.createGain(); g.gain.value=gain;
    src.connect(f); f.connect(g); g.connect(this.bus);
    src.start();
    this.nodes.push(src);
    return {src,f,g};
  },
  /* 아주 느린 흔들림 — 기계적으로 안 들리게 */
  wobble(param, base, depth, sec){
    const lfo=this.ac.createOscillator();
    lfo.type='sine'; lfo.frequency.value=1/sec;
    const amp=this.ac.createGain(); amp.gain.value=depth;
    param.value=base;
    lfo.connect(amp); amp.connect(param); lfo.start();
    this.nodes.push(lfo);
  },

  /* ── 바다 ─────────────────────────────────────────
     깊은 물 울림 + 아주 옅은 물결 + 이따금 공기방울 */
  buildSea(){
    const deep=this.loopNoise(220, 0.5, 0.16);
    this.wobble(deep.f.frequency, 220, 70, 17);      // 17초 주기
    const surf=this.loopNoise(700, 0.8, 0.05);
    this.wobble(surf.g.gain, 0.05, 0.03, 23);        // 23초 — 서로 안 겹친다
    /* 공기방울 — 불규칙하게 */
    this._timer=setInterval(()=>{
      if(!this.ac || Math.random()>0.55) return;
      this.bubble();
    }, 1400);
  },
  bubble(){
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='sine';
    const f0=380+Math.random()*520;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*2.2, t+0.09);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.035+Math.random()*0.02, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+0.18);
  },

  /* ── 정글 ─────────────────────────────────────────
     바람에 흔들리는 잎 + 새소리 + 이따금 먼 울음 */
  buildJungle(){
    const wind=this.loopNoise(420, 0.7, 0.10);
    this.wobble(wind.g.gain, 0.10, 0.06, 13);
    const leaves=this.loopNoise(2400, 1.2, 0.022, 'bandpass');
    this.wobble(leaves.g.gain, 0.022, 0.016, 9);
    this._timer=setInterval(()=>{
      if(!this.ac) return;
      const r=Math.random();
      if(r<0.42) this.bird();
      else if(r<0.5) this.hoot();
    }, 1700);
  },
  bird(){
    const t=this.ac.currentTime;
    const n=2+((Math.random()*3)|0);
    const base=1500+Math.random()*900;
    for(let i=0;i<n;i++){
      const o=this.ac.createOscillator(), g=this.ac.createGain();
      const st=t+i*0.085;
      o.type='sine';
      o.frequency.setValueAtTime(base*(1+i*0.06), st);
      o.frequency.exponentialRampToValueAtTime(base*(1.25+i*0.06), st+0.05);
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.028, st+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.07);
      o.connect(g); g.connect(this.bus); o.start(st); o.stop(st+0.1);
    }
  },
  hoot(){
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(230,t);
    o.frequency.linearRampToValueAtTime(200, t+0.4);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.05, t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+0.55);
  },

  /* ⚠ 색칠 화면에서는 앰비언스를 낮춘다.
     아이가 집중하는 순간이고, 붓 소리가 배경에 묻히면 '내가 칠하고 있다'가 안 들린다.
     실측: 앰비언스 0.14 에 붓 0.05 를 얹으니 구별이 안 됐다. */
  duck(on){
    if(!this.bus) return;
    this._ducked=on;
    this.fade(on ? 0.14 : (0.42+this.level*0.30), 0.5);
  },

  /* ⚠ 소리가 곧 상태다 — 아이가 많이 만들수록 풍성해진다.
     빈 수조와 200마리 수조가 같은 소리면 '내가 채웠다'가 안 느껴진다. */
  setLevel(n){
    if(!this.bus) return;
    const k=Math.min(1, n/120);
    this.level=k;
    if(!this._ducked) this.fade(0.42+k*0.30, 2.2);
  }
};

</script>
<script>
/* ===== js/20_paint.js ===== */
/* ══════════════════════════════════════════════════════════════════
   색칠 화면 — 아이가 실제로 만지는 곳.

   ⚠ 아이가 아무리 문질러도 선 밖으로 안 나가야 한다.
     칠한 것을 mask 로 잘라내는 방식(destination-in)이 그걸 보장한다.
   ⚠ 되돌리기가 없으면 아이는 망쳤다고 생각하고 포기한다. 반드시 있어야 한다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Paint = {
  spId:'clownfish', color:CRAYONS[0], tool:'brush', size:44,
  /* ⚠ 붓이 하나뿐이면 큰 면과 작은 면을 같은 붓으로 칠해야 한다.
     아이는 굵기를 바꿀 줄 안다 — 3단계면 충분하고, 4단계부터는 헷갈린다. */
  sizes:[22,44,78], sizeIdx:1,
  fill:null, fctx:null, undo:[], drawing:false, lastX:0, lastY:0,
  /* 도안 배치 — 화면 가운데 크게 */
  /* 바다면 Templates, 정글이면 JTemplate — 한 곳에서 고른다 */
  tpl(){ return (typeof JUNGLE!=='undefined' && JUNGLE[this.spId])
    ? JTemplate.get(this.spId) : Templates.get(this.spId); },
  box(){ const w=TW*0.95, h=TH*0.95; return {x:VW/2-w/2, y:150, w, h}; },
  toTpl(x,y){ const b=this.box(); return {x:(x-b.x)/b.w*TW, y:(y-b.y)/b.h*TH}; },

  open(spId){
    if(typeof BG!=='undefined'){ BG.get('paper'); BG.get('frame-wood'); }
    this.spId=spId||this.spId;
    this._maskArea=undefined;          // 종이 바뀌면 분모도 바뀐다
    this.fill=document.createElement('canvas'); this.fill.width=TW; this.fill.height=TH;
    this.fctx=this.fill.getContext('2d');
    this.undo=[]; this.pushUndo();
    this.color=CRAYONS[0]; this.tool='brush'; this.drawing=false;
    this.sizeIdx=1; this.size=this.sizes[1];
  },
  pushUndo(){
    const c=document.createElement('canvas'); c.width=TW; c.height=TH;
    c.getContext('2d').drawImage(this.fill,0,0);
    this.undo.push(c); if(this.undo.length>14) this.undo.shift();
  },
  doUndo(){
    if(this.undo.length<2) return;
    this.undo.pop();
    const prev=this.undo[this.undo.length-1];
    this.fctx.clearRect(0,0,TW,TH); this.fctx.drawImage(prev,0,0);
    Sfx.ui();
  },
  clear(){ this.pushUndo(); this.fctx.clearRect(0,0,TW,TH); Sfx.ui(); },

  /* 도안 안쪽에서 실제로 칠해진 비율.
     ⚠ 전체 캔버스 대비로 재면 안 된다 — 새우는 꽉 칠해도 화면의 8%다.
        분모는 **칠할 수 있는 영역(mask)** 이어야 종끼리 비교가 된다. */
  inkedRatio(){
    const w=180, h=Math.round(w*TH/TW);
    const s=document.createElement('canvas'); s.width=w; s.height=h;
    const sc=s.getContext('2d', {willReadFrequently:true});
    sc.drawImage(this.fill,0,0,w,h);
    let painted=0;
    try{
      const d=sc.getImageData(0,0,w,h).data;
      for(let i=3;i<d.length;i+=4) if(d[i]>24) painted++;
    }catch(e){ return 1; }               // 못 읽으면 통과시킨다 — 막는 게 목적이 아니다
    if(this._maskArea===undefined){
      const T=this.tpl();
      let a=0;
      if(T && T.mask){
        const m=document.createElement('canvas'); m.width=w; m.height=h;
        const mc=m.getContext('2d', {willReadFrequently:true});
        mc.drawImage(T.mask,0,0,w,h);
        try{ const md=mc.getImageData(0,0,w,h).data;
             for(let i=3;i<md.length;i+=4) if(md[i]>24) a++; }catch(e){ a=0; }
      }
      this._maskArea = a>0 ? a : w*h*0.28;   // mask 를 못 구하면 대략치
    }
    return Math.min(1, painted/this._maskArea);
  },

  _brushT:0,
  stroke(x,y,fromX,fromY){
    /* 붓질 소리 — 5프레임에 한 번만. 매번 내면 소음이 된다 */
    if(++this._brushT % 5 === 0 && this.tool!=='bucket')
      Sfx.brush((this.sizeIdx||0)/2);
    const f=this.fctx;
    f.save();
    f.strokeStyle=this.color; f.fillStyle=this.color;
    f.lineCap='round'; f.lineJoin='round';
    if(this.tool==='brush'){
      f.lineWidth=this.size;
      f.beginPath();
      if(fromX!==undefined){ f.moveTo(fromX,fromY); f.lineTo(x,y); } else { f.moveTo(x,y); f.lineTo(x+0.1,y); }
      f.stroke();
    } else if(this.tool==='eraser'){
      f.globalCompositeOperation='destination-out';
      f.lineWidth=this.size*1.3;
      f.beginPath();
      if(fromX!==undefined){ f.moveTo(fromX,fromY); f.lineTo(x,y); } else { f.moveTo(x,y); f.lineTo(x+0.1,y); }
      f.stroke();
    } else if(this.tool==='star'||this.tool==='heart'||this.tool==='dot'||this.tool==='stripe'){
      this.stamp(f,x,y);
    }
    f.restore();
    /* ⚠ 여기가 핵심 — 마스크 밖은 잘라낸다 */
    const T=this.tpl();
    if(T){ f.save(); f.globalCompositeOperation='destination-in';
      f.drawImage(T.mask,0,0); f.restore(); }
  },
  stamp(f,x,y){
    const r=this.size*0.8;
    f.beginPath();
    if(this.tool==='stripe'){ f.rect(x-r*0.35, y-r*1.6, r*0.7, r*3.2); }
    else if(this.tool==='dot'){ f.arc(x,y,r,0,TAU); }
    else if(this.tool==='star'){
      for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r;
        f.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); } f.closePath();
    } else {
      f.moveTo(x,y+r*0.7);
      f.bezierCurveTo(x-r*1.3,y-r*0.3, x-r*0.5,y-r*1.1, x,y-r*0.35);
      f.bezierCurveTo(x+r*0.5,y-r*1.1, x+r*1.3,y-r*0.3, x,y+r*0.7);
    }
    f.fill();
  },
  /* 페인트통 — 면 하나를 통째로. 마스크 안에서만 */
  bucket(x,y){
    this.pushUndo();
    const f=this.fctx;
    const T2=this.tpl();
    f.save(); f.fillStyle=this.color; f.fillRect(0,0,TW,TH);
    f.globalCompositeOperation='destination-in';
    if(T2) f.drawImage(T2.mask,0,0);
    f.restore();
    /* 이미 칠한 것 위에 덮이지 않도록 이전 것을 다시 얹는다 */
    const prev=this.undo[this.undo.length-1];
    f.drawImage(prev,0,0);
    Sfx.pop();
  },

  update(dt){
    const b=this.box();
    if(Input.down){
      const inBox = Input.x>b.x&&Input.x<b.x+b.w&&Input.y>b.y&&Input.y<b.y+b.h;
      if(inBox){
        const p=this.toTpl(Input.x,Input.y);
        if(!this.drawing){ this.drawing=true; this.pushUndo(); this.stroke(p.x,p.y); }
        else { const q=this.toTpl(Input.px,Input.py); this.stroke(p.x,p.y,q.x,q.y); }
        this.lastX=p.x; this.lastY=p.y;
      }
    } else this.drawing=false;
  },
  draw(c){
    /* 배경 — 종이 */
    c.fillStyle='#173a52'; c.fillRect(0,0,VW,VH);
    const b=this.box();
    c.save();
    c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=24; c.shadowOffsetY=8;
    c.fillStyle=PAL.paper; c.fillRect(b.x-16,b.y-16,b.w+32,b.h+32);
    c.restore();
    /* 종이 결 — 어셋이 있으면 살짝 얹는다. 없으면 단색 그대로 */
    const pp=(typeof BG!=='undefined') && BG.get('paper');
    if(pp){
      c.save(); c.globalAlpha=0.5;
      c.beginPath(); c.rect(b.x-16,b.y-16,b.w+32,b.h+32); c.clip();
      for(let x=b.x-16;x<b.x+b.w+32;x+=256)
        for(let y=b.y-16;y<b.y+b.h+32;y+=256) c.drawImage(pp,x,y,256,256);
      c.restore();
    }
    const t=this.tpl();
    c.drawImage(this.fill, b.x,b.y,b.w,b.h);
    if(t) c.drawImage(t.ink, b.x,b.y,b.w,b.h);
    /* 나무 액자 — 아이 그림을 감싼다. 가운데가 뚫린 그림이라 도안을 안 가린다 */
    const fr=(typeof BG!=='undefined') && BG.get('frame-wood');
    if(fr) c.drawImage(fr, b.x-46, b.y-46, b.w+92, b.h+92);
    else { c.font='700 22px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle='#8fa3b8'; c.fillText('도안을 불러오는 중…', VW/2, b.y+b.h/2); }
  }
};

</script>
<script>
/* ===== js/30_creature.js ===== */
/* ══════════════════════════════════════════════════════════════════
   생물 — 아이가 칠한 그림 한 장이 살아 움직인다.

   ⚠ 움직임이 전부 같으면 40종을 만들어도 한 종처럼 보인다.
     그래서 **9가지 움직이는 방식**을 따로 만들었다.
     swim 헤엄 · undulate 구불 · pulse 맥동 · flap 날갯짓 · glide 활공
     scuttle 옆걸음 · jet 분사 · crawl 기어감 · bob 까딱 · seahorse 곧추서기
   ⚠ 텍스처는 180x120 으로 줄여서 보관한다(실측: 6.5배 빠르고 메모리 1/4).
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const TEX_W=180, TEX_H=120;

/* ── 몸 위치 자동 측정 ──────────────────────────────────
   ⚠ 도안마다 몸이 텍스처 한가운데에 있지 않다. 발주서에 중심선 y=240 을
     못박았지만 종에 따라 40px 이상 어긋나 온다(실측: snail 282).
     매번 반려하는 대신 **코드가 실제 몸 위치를 재서 맞춘다.**
     40종이 더 올 것이고, 어셋을 사람이 완벽히 맞추길 기대하면 안 된다. */
const BodyFit = {
  cache:new WeakMap(),
  of(tex){
    let v=this.cache.get(tex); if(v) return v;
    try{
      const c=tex.getContext ? tex : null;
      const cv=document.createElement('canvas'); cv.width=TEX_W; cv.height=TEX_H;
      const x=cv.getContext('2d'); x.drawImage(tex,0,0);
      const d=x.getImageData(0,0,TEX_W,TEX_H).data;
      let y0=TEX_H, y1=-1;
      for(let y=0;y<TEX_H;y++){
        for(let px=0;px<TEX_W;px+=2){
          if(d[((y*TEX_W+px)*4)+3]>40){ if(y<y0)y0=y; if(y>y1)y1=y; break; }
        }
      }
      if(y1<0){ y0=0; y1=TEX_H-1; }
      v={ top:y0, bot:y1, mid:(y0+y1)/2,
          /* 텍스처 중심(60)에서 몸 중심이 얼마나 벗어났나 */
          midOff:(y0+y1)/2 - TEX_H/2,
          botOff:y1 - TEX_H/2 };
    }catch(e){ v={top:0,bot:TEX_H-1,mid:TEX_H/2,midOff:0,botOff:TEX_H/2}; }
    this.cache.set(tex,v); return v;
  }
};


/* ══ 만지면 반응한다 ══════════════════════════════════
   ⚠ 예전엔 탭하면 곧장 확대 화면으로 넘어갔다. 그건 '반응'이 아니라
     '화면 전환'이라, 아이는 수조를 만졌다는 느낌을 못 받는다.
   종마다 다르게 반응해야 아이가 **여러 마리를 눌러 본다** —
     복어는 부풀고, 문어는 먹물을 뿜고, 게는 집게를 흔든다.
   그게 이 화면을 수족관으로 만든다. */
const SEA_REACT = {
  pufferfish:'puff',
  octopus:'ink', squid:'ink', nautilus:'ink',
  jellyfish:'glow', anglerfish:'glow', seadragon:'glow', lionfish:'glow',
  crab:'pinch', lobster:'pinch', shrimp:'pinch',
  turtle:'hide', snail:'hide', starfish:'hide', flounder:'hide',
  dolphin:'spin', orca:'spin', seal:'spin', otter:'spin', penguin:'spin',
  shark:'dash', swordfish:'dash', tuna:'dash', hammerhead:'dash', manta:'dash',
  whale:'blow', narwhal:'blow',
  seahorse:'curl', eel:'curl', snake:'curl', coelacanth:'curl',
};
const REACT_LEN = { puff:52, ink:46, glow:56, pinch:44, hide:50,
                    spin:46, dash:40, blow:64, curl:48, wiggle:38 };

class Creature {
  /* tex: 색칠 완료된 캔버스(또는 이미지) · spId: 종 · name: 아이 이름 */
  constructor(tex, spId, name, opt){
    opt=opt||{};
    this.tex=tex; this.spId=spId; this.name=name||'';
    const sp=SP_BY_ID[spId]||SPECIES[0];
    this.sp=sp; this.motion=sp.motion;
    this.zone=opt.zone!==undefined?opt.zone:pick(sp.zone);
    this.x=opt.x!==undefined?opt.x:rnd()*VW;
    this.y=opt.y!==undefined?opt.y:World.zoneY(this.zone)+rnd()*80-40;
    this.dir=rnd()<0.5?-1:1;
    /* ⚠ 처음엔 0.30~0.52 로 뒀는데 화면에서 54~94px 이라 아이 그림이 안 보였다.
       이 작품의 주인공은 아이가 칠한 그림이다. 배경보다 커야 한다. */
    this.baseS=(0.62+rnd()*0.40)*(sp.size||1);
    this.s=this.baseS;
    this.ph=rnd()*TAU;
    this.spd=(0.5+rnd()*0.7)*(1.25-(sp.size||1)*0.25);
    this.t=rnd()*300;
    this.vy=0; this.state='idle'; this.stateT=0;
    this.reactT=0; this.reactKind=null; this.fedCd=0;
    this.mine=!!opt.mine;
    this.joinT=opt.join?70:0;      // 합류 연출
    this.scared=0; this.target=null;
    this.wob=rnd()*TAU;
  }
  /* 만졌다 — 종에 맞는 반응을 시작한다 */
  react(){
    const kind = SEA_REACT[this.spId] || 'wiggle';
    this.reactKind = kind;
    this.reactT = this.reactMax = REACT_LEN[kind] || 40;
    const x=this.x, y=this.y;
    if(kind==='ink')       FX.ink(x, y, this.dir);
    else if(kind==='glow') FX.glow(x, y, '#a8f2ff');
    else if(kind==='blow') FX.bubbles(x, y-this.h*0.34, 14);
    else if(kind==='puff') FX.ring(x, y);
    else if(kind==='dash') FX.sparkle(x, y, 10);
    else                   FX.heart(x, y-this.h*0.3);
    if(typeof Sfx!=='undefined' && Sfx.creature) Sfx.creature(kind);
    return kind;
  }
  get w(){ return TEX_W*this.s; }
  get h(){ return TEX_H*this.s; }

  update(dt, world){
    this.t+=dt*60;
    /* ⚠ 서로를 전혀 의식하지 않으면 '어항 스크린세이버'다.
       같은 종끼리 느슨하게 모이고, 겹치면 살짝 비킨다.
       ⚠ 전부와 비교하면 O(n²) 이다 — 300마리면 45,000번.
       매 프레임이 아니라 6프레임에 한 번, 이웃 몇 마리만 본다. */
    if(world.flock && (Game.t + this.ph*97|0) % 6 === 0) this.flock(world);
    if(this.joinT>0) this.joinT--;
    if(this.scared>0) this.scared--;
    if(this.fedCd>0) this.fedCd--;
    if(this.reactT>0) this.reactT--;

    let sp=this.spd*(this.scared>0?3.2:1);
    /* 내 것이면 부르는 자리로 모여든다 — 이게 '나를 알아본다'의 정체다 */
    if(this.mine && world.callAt && this.scared<=0){
      const cx=world.callAt.x, cy=world.callAt.y;
      const d=dist(this.x,this.y,cx,cy);
      if(d>70){
        const a=Math.atan2(cy-this.y, cx-this.x);
        this.x+=Math.cos(a)*sp*3.0; this.y+=Math.sin(a)*sp*2.2;
        this.dir=Math.cos(a)>0?1:-1;
        if(Game.t%9===0) Game.fx.sparkle(this.x,this.y,1);
        return;
      }
    }
    /* 먹이가 있으면 몰려간다 */
    const food=world.nearestFood(this.x,this.y);
    if(food && this.scared<=0){
      const d=dist(this.x,this.y,food.x,food.y);
      /* ⚠ 420 은 화면의 1/3 이라 멀리 있는 물고기는 아예 반응하지 않았다.
         먹이는 다같이 몰려드는 맛이다 — 화면 전체가 반응하게 넓힌다. */
      if(d<820){
        const a=Math.atan2(food.y-this.y, food.x-this.x);
        this.x+=Math.cos(a)*sp*2.1; this.y+=Math.sin(a)*sp*2.1;
        this.dir=Math.cos(a)>0?1:-1;
        /* ⚠ 쿨다운이 없어 한 마리가 매 프레임 쪼았다 — 3번 쪼기로 바꿔도
           16알이 1초에 사라졌다(실측). 한 입 먹었으면 잠시 물러난다. */
        if(d<26 && !(this.fedCd>0)){ world.eatFood(food, this); this.fedCd=90; }
        this.wob+=0.12;
        /* ⚠ 먹이를 쫓을 때 곧장 return 해서 **밀어내기를 건너뛰었다**.
           그래서 22마리가 한 점에 겹쳐 아이 그림이 서로를 가렸다.
           몰려드는 건 좋지만 포개지면 누구 그림인지 알 수 없다. */
        this.spread(world);
        return;
      }
    }
    /* 손가락을 가만히 대고 있으면 궁금해서 다가온다.
       ⚠ 빈 곳을 톡 치면 흩어지는데(scare), 그것만 있으면 아이는 수조를
         '건드리면 도망가는 것'으로만 배운다. 가만히 대고 기다리면
         모여든다는 걸 알면 아이가 화면 앞에 오래 머문다. */
    /* ⚠ 처음엔 끌림만 더하고 아래 motion 을 그대로 뒀더니 생물이 손가락을
       **지나쳐 갔다**(실측: 6초 뒤 오히려 멀어짐). 먹이와 같은 구조로,
       다가오는 동안에는 제 갈 길을 접는다. 가까우면 주위를 맴돈다. */
    if(world.touchAt && !(this.scared>0) && !(this.reactT>0)){
      const T=world.touchAt;
      const d=dist(this.x,this.y,T.x,T.y);
      /* 휘저으면 물살에 밀린다 — 손 뒤로 물이 흐른다 */
      if(T.swirl && d<300){
        const k=(1-d/300)*0.5;
        this.x += (T.vx||0)*k; this.y += (T.vy||0)*k*0.7;
        this.wob += 0.14;
        if(Math.abs(T.vx||0)>2) this.dir = (T.vx>0)?1:-1;
        return;
      }
      const eager=Math.min(1,(T.hold-20)/70);
      if(eager>0 && !T.swirl && d<780){
        const a=Math.atan2(T.y-this.y, T.x-this.x);
        if(d>150){                                  // 다가온다
          this.x+=Math.cos(a)*sp*1.5*eager;
          this.y+=Math.sin(a)*sp*1.0*eager;
          this.dir=Math.cos(a)>0?1:-1;
        } else {                                     // 손끝을 맴돈다
          const orb=a+Math.PI/2;
          this.x+=Math.cos(orb)*sp*0.9;
          this.y+=Math.sin(orb)*sp*0.5;
          this.dir=Math.cos(orb)>0?1:-1;
        }
        this.wob+=0.09;
        return;
      }
    }
    /* 놀랐으면 도망 */
    if(this.scared>0 && world.scareAt){
      const a=Math.atan2(this.y-world.scareAt.y, this.x-world.scareAt.x);
      this.x+=Math.cos(a)*sp*2.4; this.y+=Math.sin(a)*sp*1.4;
      this.dir=Math.cos(a)>0?1:-1;
    } else {
      this[this.motion] ? this[this.motion](sp) : this.swim(sp);
    }
    /* 벽 */
    if(this.x<-this.w) { this.x=VW+this.w; }
    if(this.x>VW+this.w){ this.x=-this.w; }
    const band=World.zoneBand(this.zone);
    if(this.y<band[0]){ this.y=band[0]; this.vy=Math.abs(this.vy); }
    if(this.y>band[1]){ this.y=band[1]; this.vy=-Math.abs(this.vy); }
  }

  /* 밀어내기만 — 먹이를 쫓는 중에도 서로 포개지지 않게 */
  spread(world){
    const near=world.neighbors(this.x, this.y, this);
    let px=0, py=0;
    for(const o of near){
      const dx=o.x-this.x, dy=o.y-this.y, d2=dx*dx+dy*dy;
      const sepR=Math.min(150,(this.w+o.w)*0.22);
      if(d2<sepR*sepR && d2>1){
        const d=Math.sqrt(d2);
        px -= dx/d*(sepR-d)/sepR; py -= dy/d*(sepR-d)/sepR;
      }
    }
    this.x += px*1.1; this.y += py*0.9;
  }

  /* 무리 짓기 — 가벼운 근사. 격자에서 이웃만 꺼낸다 */
  flock(world){
    const near=world.neighbors(this.x, this.y, this);
    if(!near.length) return;
    let cx=0, cy=0, n=0, px=0, py=0;
    for(const o of near){
      const dx=o.x-this.x, dy=o.y-this.y;
      const d2=dx*dx+dy*dy;
      if(d2 > 190*190) continue;
      if(o.spId===this.spId){ cx+=o.x; cy+=o.y; n++; }   // 같은 종에 끌린다
      /* ⚠ 46px 은 몸 폭(270~400px)의 1/6 이라 사실상 겹쳐도 안 비켰다.
         몸 크기에 맞춰 벌린다 — 상한을 둬서 무리가 흩어지지는 않게. */
      const sepR=Math.min(150,(this.w+o.w)*0.22);
      if(d2 < sepR*sepR && d2>1){
        const d=Math.sqrt(d2);
        px -= dx/d*(sepR-d)/sepR; py -= dy/d*(sepR-d)/sepR;
      }
    }
    if(n){ this.x += ((cx/n)-this.x)*0.004; this.y += ((cy/n)-this.y)*0.004; }
    this.x += px*0.9; this.y += py*0.6;
  }

  /* ── 9가지 움직임 ─────────────────────────────────── */
  swim(sp){                       // 물고기 — 앞으로 나아가며 몸을 흔든다
    this.x += sp*this.dir;
    this.y += Math.sin(this.t*0.018+this.ph)*0.5;
    if(rnd()<0.0016) this.dir*=-1;
  }
  undulate(sp){                   // 뱀장어 — 온몸이 크게 구불거린다
    this.x += sp*0.85*this.dir;
    this.y += Math.sin(this.t*0.03+this.ph)*1.1;
    if(rnd()<0.0012) this.dir*=-1;
  }
  pulse(sp){                      // 해파리 — 오므렸다 펴며 떴다 가라앉는다
    const k=(this.t*0.022+this.ph)%TAU;
    const push = k<1.1 ? 1.6 : -0.14;
    this.vy = lerp(this.vy, -push*sp*1.3, 0.08);
    this.y += this.vy;
    this.x += sp*0.28*this.dir + Math.sin(this.t*0.008)*0.2;
    if(rnd()<0.0009) this.dir*=-1;
  }
  flap(sp){                       // 가오리 — 날개를 젓는다
    this.x += sp*0.9*this.dir;
    this.y += Math.sin(this.t*0.02+this.ph)*0.9;
    if(rnd()<0.0011) this.dir*=-1;
  }
  glide(sp){                      // 거북·물범 — 느리고 미끄러진다
    this.x += sp*0.6*this.dir;
    this.y += Math.sin(this.t*0.01+this.ph)*0.35;
    if(rnd()<0.0008) this.dir*=-1;
  }
  scuttle(sp){                    // 게 — 옆으로 종종
    this.x += sp*1.1*this.dir;
    this.y = World.zoneBand(this.zone)[1]-10 + Math.abs(Math.sin(this.t*0.16))*5;
    if(rnd()<0.006) this.dir*=-1;
  }
  jet(sp){                        // 문어·오징어 — 확 쏘고 미끄러진다
    this.stateT++;
    if(this.stateT>90){ this.stateT=0; this.burst=26; if(rnd()<0.4) this.dir*=-1; }
    if(this.burst>0){ this.burst--; this.x += sp*2.6*this.dir; }
    else this.x += sp*0.22*this.dir;
    this.y += Math.sin(this.t*0.012+this.ph)*0.4;
  }
  crawl(sp){                      // 불가사리·달팽이 — 바닥을 아주 느리게
    this.x += sp*0.22*this.dir;
    this.y = World.zoneBand(this.zone)[1]-8;
    if(rnd()<0.003) this.dir*=-1;
  }
  bob(sp){                        // 복어·쏠배감펭 — 제자리에서 까딱
    this.x += sp*0.4*this.dir;
    this.y += Math.sin(this.t*0.035+this.ph)*0.9;
    if(rnd()<0.002) this.dir*=-1;
  }
  dart(sp){                       // 새우·펭귄 — 짧게 툭툭
    this.stateT++;
    if(this.stateT>rndi(40,90)){ this.stateT=0; this.burst=14; if(rnd()<0.3) this.dir*=-1; }
    if(this.burst>0){ this.burst--; this.x += sp*2.2*this.dir; this.y += Math.sin(this.t*0.3)*0.8; }
  }
  seahorse(sp){                   // 해마 — 곧추서서 위아래로
    this.x += sp*0.3*this.dir;
    this.y += Math.sin(this.t*0.02+this.ph)*0.8;
    if(rnd()<0.0015) this.dir*=-1;
  }

  /* ── 그리기 ────────────────────────────────────────
     세로 띠로 잘라 띠마다 밀어 그린다. 움직임마다 미는 방식이 다르다. */
  draw(c, world){
    const tex=this.tex; if(!tex) return;
    const onW=this.w;
    /* LOD — 작게 보이면 띠를 줄인다(실측 2.3배) */
    const SL = onW<70?8 : onW<130?16 : onW<220?28 : 44;
    let s=this.s;
    let alpha=1, extraY=0, sx=1, sy=1, rot=0;

    if(this.joinT>0){               // 합류 연출 — 커지며 나타난다
      const k=1-this.joinT/70;
      s*=0.4+0.6*k; alpha=k;
    }
    /* 만졌을 때의 몸짓 — 기존 움직임 위에 얹는다 */
    if(this.reactT>0){
      const k=1-this.reactT/this.reactMax;      // 0 → 1
      const bump=Math.sin(k*Math.PI);           // 가운데서 최대
      switch(this.reactKind){
        case 'puff':  sx*=1+bump*0.55; sy*=1+bump*0.62; break;
        case 'hide':  sx*=1-bump*0.34; sy*=1-bump*0.34; break;
        case 'spin':  rot+=k*TAU; break;
        case 'dash':  extraY-=bump*6; s*=1+bump*0.10; break;
        case 'pinch': rot+=Math.sin(k*Math.PI*7)*0.30;                 // 집게 흔들기
                      sx*=1+Math.sin(k*Math.PI*7)*0.14; break;
        case 'curl':  rot+=Math.sin(k*Math.PI*3)*0.30; sx*=1-bump*0.12; break;
        case 'glow':  sx*=1+bump*0.12; sy*=1+bump*0.12; break;
        case 'blow':  extraY-=bump*18; sy*=1+bump*0.10; break;          // 물 뿜으며 솟구침
        case 'ink':   extraY-=bump*4; sx*=1-bump*0.10; break;
        default:      rot+=Math.sin(k*Math.PI*5)*0.26; extraY-=bump*12;  // 꼬리 흔들기
                      sx*=1+bump*0.10;
      }
    }
    const m=this.motion;
    if(m==='pulse'){                // 해파리 — 종이 오므라든다
      const k=Math.sin(this.t*0.022+this.ph);
      sx=1+k*0.16; sy=1-k*0.20;
    } else if(m==='seahorse'){ rot=-Math.PI/2*0.86; }
      else if(m==='crawl' && this.sp.shape==='star'){ rot=this.t*0.004; }

    /* 몸 중심을 this.y 에 맞춘다. 바닥에 붙는 종은 아래끝을 바닥에 맞춘다. */
    const fit=BodyFit.of(tex);
    const floorish = (m==='crawl'||m==='scuttle');
    const adj = floorish ? -fit.botOff*s : -fit.midOff*s;
    c.save();
    c.globalAlpha=alpha;
    c.translate(this.x, this.y+extraY+adj);
    if(this.dir<0) c.scale(-1,1);
    if(rot) c.rotate(rot);
    c.scale(s*sx, s*sy);

    const sw=TEX_W/SL;
    for(let i=0;i<SL;i++){
      const u=i/SL;                 // 0=꼬리 1=머리
      let off=0, vscale=1;
      switch(m){
        case 'swim':     off=Math.sin(this.t*0.11+this.ph-u*3.0)*11*Math.pow(1-u,1.7); break;
        case 'undulate': off=Math.sin(this.t*0.10+this.ph-u*5.4)*17*(0.35+0.65*(1-u)); break;
        case 'flap':     off=0; vscale=1+Math.sin(this.t*0.075+this.ph)*0.30*Math.pow(Math.abs(u-0.5)*2,1.5); break;
        case 'glide':    off=Math.sin(this.t*0.05+this.ph-u*2.0)*5*Math.pow(1-u,1.6); break;
        case 'jet':      off=Math.sin(this.t*0.09+this.ph-u*2.4)*(this.burst>0?15:5)*Math.pow(1-u,1.4); break;
        case 'scuttle':  off=Math.sin(this.t*0.30+u*7)*2.4; break;
        case 'dart':     off=Math.sin(this.t*0.24+this.ph-u*3)*(this.burst>0?12:3)*Math.pow(1-u,1.5); break;
        case 'bob':      off=Math.sin(this.t*0.07+this.ph-u*1.6)*5; break;
        case 'crawl':    off=Math.sin(this.t*0.05+u*5)*2; break;
        case 'pulse':    off=0; break;
        case 'seahorse': off=Math.sin(this.t*0.08+this.ph-u*4)*7*Math.pow(1-u,2); break;
      }
      c.save();
      if(vscale!==1) c.scale(1,vscale);
      c.drawImage(tex, i*sw,0,sw+1,TEX_H,
                  i*sw-TEX_W/2, off/ (vscale||1) - TEX_H/2, sw+1, TEX_H);
      c.restore();
    }
    c.restore();
    c.globalAlpha=1;

    /* 내 것 표시 */
    if(this.mine && world && world.findT>0){
      c.save();
      const a=Math.min(1, world.findT/40);
      c.globalAlpha=a;
      /* ⚠ 화살표 어셋이 있으면 **원을 건너뛰었다.** 수십 마리 중에서
         46px 화살표 하나로는 못 찾는다. 원은 늘 그리고 화살표는 얹는다. */
      c.strokeStyle=PAL.gold; c.lineWidth=5;
      c.beginPath(); c.arc(this.x, this.y, onW*0.72+10+Math.sin(this.t*0.1)*5, 0, TAU); c.stroke();
      const arrowSz=Math.max(64, onW*0.55);
      if(!(typeof FXA!=='undefined' &&
           FXA.draw(c,'fx-arrow-point', this.x, this.y-onW*0.72-arrowSz*0.55, arrowSz, 0))){
        c.fillStyle=PAL.gold;
        c.beginPath(); c.moveTo(this.x, this.y-onW*0.72-16);
        c.lineTo(this.x-10, this.y-onW*0.72-34); c.lineTo(this.x+10, this.y-onW*0.72-34);
        c.closePath(); c.fill();
      } else {
        c.strokeStyle=PAL.gold; c.lineWidth=3; c.globalAlpha=a*0.7;
        c.beginPath(); c.arc(this.x, this.y, onW*0.72+8+Math.sin(this.t*0.1)*4, 0, TAU); c.stroke();
      }
      c.restore();
    }
    /* 이름표 — 가까이 있는 것만 */
    if(this.name && onW>110){
      c.save();
      c.globalAlpha=0.9;
      c.font='600 15px Galmuri11, sans-serif'; c.textAlign='center';
      const tw=c.measureText(this.name).width+16;
      c.fillStyle='rgba(10,32,54,.62)';
      c.fillRect(this.x-tw/2, this.y+this.h*0.42, tw, 21);
      c.fillStyle=PAL.white;
      c.fillText(this.name, this.x, this.y+this.h*0.42+16);
      c.restore();
    }
  }
}

/* 색칠 결과 → 180x120 텍스처 (합성: 칠한 것 → 마스크로 자르기 → 잉크 덮기) */
function bakeCreature(fillCanvas, spId){
  const t=Templates.get(spId);
  const big=document.createElement('canvas'); big.width=TW; big.height=TH;
  const b=big.getContext('2d');
  b.drawImage(fillCanvas,0,0);
  b.globalCompositeOperation='destination-in';
  b.drawImage(t.mask,0,0);
  b.globalCompositeOperation='source-over';
  b.drawImage(t.ink,0,0);
  const small=document.createElement('canvas'); small.width=TEX_W; small.height=TEX_H;
  const s=small.getContext('2d');
  s.imageSmoothingEnabled=true; s.imageSmoothingQuality='high';
  s.drawImage(big,0,0,TW,TH,0,0,TEX_W,TEX_H);
  return small;
}

};

/* ── 몸에서 이음 자리를 자동으로 뽑는다 (마스터가 없을 때만) ──
   ⚠ anchor 를 눈대중으로 찍었더니 머리가 몸에서 떨어져 떠 있었다(실측).
     종마다 몸 그림이 다르니 **몸 마스크의 실제 범위**에서 비율로 계산한다.
     12종이 왔고 40종이 더 올 수도 있다 — 손으로 찍을 일이 아니다. */
const BodyBox = {
  cache:{},
  of(id, maskImg){
    if(this.cache[id]) return this.cache[id];
    const c=document.createElement('canvas'); c.width=512; c.height=512;
    const x=c.getContext('2d'); x.drawImage(maskImg,0,0,512,512);
    const d=x.getImageData(0,0,512,512).data;
    let x0=512,y0=512,x1=-1,y1=-1;
    for(let yy=0;yy<512;yy+=2) for(let xx=0;xx<512;xx+=2)
      if(d[((yy*512+xx)*4)+3]>128){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; }
    if(x1<0){ x0=100;y0=150;x1=400;y1=380; }
    const v={x0,y0,x1,y1,w:x1-x0,h:y1-y0};
    this.cache[id]=v; return v;
  },
  /* 부위 자신의 그림 범위도 잰다 — 여백이 종마다 달라서 이걸 모르면 뜬다 */
  part(id, part, maskImg){
    const k=id+':'+part;
    if(this.cache[k]) return this.cache[k];
    const c=document.createElement('canvas'); c.width=256; c.height=256;
    const x=c.getContext('2d'); x.drawImage(maskImg,0,0,256,256);
    const d=x.getImageData(0,0,256,256).data;
    let x0=256,y0=256,x1=-1,y1=-1;
    for(let yy=0;yy<256;yy+=2) for(let xx=0;xx<256;xx+=2)
      if(d[((yy*256+xx)*4)+3]>128){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; }
    if(x1<0){ x0=40;y0=40;x1=216;y1=216; }
    const v={x0,y0,x1,y1,w:x1-x0,h:y1-y0};
    this.cache[k]=v; return v;
  },
  /* 부위별 붙는 자리 — 몸 범위 대비 비율.
     ⚠ 그냥 몸 가장자리에 두면 '닿기만 하고 안 겹쳐' 떠 보인다(실측).
        몸 안쪽으로 확실히 밀어 넣는다. */
  /* 부위를 '몸에 비해 얼마나 크게' 그릴지 — 보이는 크기 기준.
     ⚠ 캔버스 비율(256 vs 512)로 그렸더니 머리가 너무 작았다. 그림이 캔버스를
        얼마나 채우는지는 부위마다 다르다. 보이는 폭/높이로 맞춘다. */
  relSize(part, id){
    const T={ head:0.46, legF:0.20, legB:0.20, ear:0.26, tail:0.30 };
    const S={ giraffe:{head:0.34}, monkey:{head:0.42,tail:0.44},
              hippo:{head:0.54}, elephant:{head:0.50,ear:0.34},
              lion:{head:0.52}, sloth:{head:0.44} };
    return (S[id]&&S[id][part]) || T[part] || 0.4;
  },
  anchor(b, part, id){
    switch(part){
      case 'head': return [b.x1-b.w*0.20, b.y0+b.h*(id==='giraffe'?0.06:0.32)];
      case 'legF': return [b.x0+b.w*0.72, b.y1-b.h*0.12];
      case 'legB': return [b.x0+b.w*0.22, b.y1-b.h*0.12];
      case 'ear' : return [b.x1-b.w*0.26, b.y0+b.h*0.10];
      case 'tail': return [b.x0+b.w*0.08, b.y0+b.h*0.36];
    }
    return [b.x0+b.w/2, b.y0+b.h/2];
  }
};

/* ── 조립 도안 ─────────────────────────────────────────
   부위를 쉬는 자세로 늘어놓아 720x480 한 장으로 만든다.
   아이는 이 한 장에 칠한다. */
const JTemplate = {
  cache:{},
  get(id){
    if(this.cache[id]) return this.cache[id];
    const D=JUNGLE[id]; if(!D) return null;
    /* ⚠ 무슨 부위로 이루어졌는지는 **어셋이 안다.**
       나비를 재제작하며 다리가 빠지고 wing 이 생겼는데, 코드의 parts 는
       옛 목록(legF/legB)이라 사자 다리를 그대로 붙이고 날개는 무시했다.
       레이아웃 파일이 있으면 그쪽이 정본이다. (같은 실수를 조립 좌표에서
       이미 한 번 했다 — 어셋에 딸려온 파일을 먼저 열어 봤어야 했다) */
    const L0=JLayout.of(id);
    const parts=(L0&&L0.parts) ? Object.keys(L0.parts) : D.parts;
    const imgs={}; let ready=true;
    for(const p of parts){
      for(const k of ['ink','mask']){
        const n=`${id}-${p}-${k}`;
        let im=this._img[n];
        if(!im){
          im=new Image(); im.src=`assets/jungle/${n}.png`;
          this._img[n]=im;
        }
        if(!im.complete || !im.naturalWidth) ready=false;
        imgs[p+'_'+k]=im;
      }
    }
    if(!ready) return null;
    const L=JLayout.of(id);
    /* 조립 — 마스터 좌표가 있으면 그대로, 없으면 비율로 추정 */
    const mk=(kind)=>{
      const c=document.createElement('canvas'); c.width=TW; c.height=TH;
      const x=c.getContext('2d');
      if(L){
        /* 마스터 캔버스를 720x480 에 꽉 맞춘다 */
        const S=Math.min(TW/L.canvas[0], TH/L.canvas[1])*0.98;
        const ox=(TW-L.canvas[0]*S)/2, oy=(TH-L.canvas[1]*S)/2;
        for(const p of ['legB','wing','tail','ear','body','legF','head']){
          if(!parts.includes(p)) continue;
          const pos=L.parts[p]; const im=imgs[p+'_'+kind];
          if(!pos||!im) continue;
          /* 마스터의 부위 PNG는 대개 512×512/256×256이지만, 기린·홍학처럼
             세로 비율을 살린 256×512 부위도 있다. 256×256으로 강제하면 긴
             다리가 납작해져 형태 QA를 통과한 에셋도 게임에서 망가진다. */
          const iw=im.naturalWidth || ((p==='body'||p==='head')?512:256);
          const ih=im.naturalHeight || iw;
          x.drawImage(im, ox+pos[0]*S, oy+pos[1]*S, iw*S, ih*S);
        }
        return c;
      }
      /* 512 짜리 body 를 720x480 에 맞춘다 */
      const S=TH/512*0.92, ox=TW/2-512*S/2, oy=TH/2-512*S/2;
      const box=BodyBox.of(id, imgs['body_mask']);
      const put=(p)=>{
        const im=imgs[p+'_'+kind]; if(!im) return;
        if(p==='body'){ x.drawImage(im, ox, oy, 512*S, 512*S); return; }
        const a=BodyBox.anchor(box,p,id);
        const pb=BodyBox.part(id,p,imgs[p+'_mask']);
        /* 보이는 폭이 몸 폭의 relSize 배가 되도록 배율을 역산한다 */
        const sc = (box.w * BodyBox.relSize(p,id)) / Math.max(1, pb.w) * (256/512) * 2;
        /* 이음점 대신 '그림의 붙는 쪽 가장자리'를 anchor 에 맞춘다.
           부위마다 여백이 달라서 이음점 좌표만 믿으면 뜬다. */
        const j=[
          p==='head'||p==='tail' ? pb.x0 : (pb.x0+pb.x1)/2,
          p==='legF'||p==='legB' ? pb.y0 : (p==='ear' ? pb.y1 : (pb.y0+pb.y1)/2)
        ];
        const w=256*S*sc, h=256*S*sc;
        const dx=ox+a[0]*S - j[0]*S*sc;
        const dy=oy+a[1]*S - j[1]*S*sc;
        x.drawImage(im, dx, dy, w, h);
      };
      /* 뒤에 있는 것부터 */
      ['legB','ear','body','legF','head','tail'].forEach(p=>{ if(D.parts.includes(p)) put(p); });
      return c;
    };
    const t={ ink:mk('ink'), mask:mk('mask'), D, imgs, parts, S:TH/512*0.92,
              box:BodyBox.of(id, imgs['body_mask']) };
    this.cache[id]=t;
    return t;
  },
  _img:{},
  prefetch(){ JLayout.load(); Object.keys(JUNGLE).forEach(id=>{
    const D=JUNGLE[id];
    const L=JLayout.of(id);
    const ps=(L&&L.parts) ? Object.keys(L.parts) : D.parts;
    for(const p of ps) for(const k of ['ink','mask']){
      const n=`${id}-${p}-${k}`;
      if(!this._img[n]){ const im=new Image(); im.src=`assets/jungle/${n}.png`; this._img[n]=im; }
    }
  }); }
};

/* ── 걷는 동물 ─────────────────────────────────────────
   칠한 그림(조립본)에서 부위별 조각을 떼어 각각 회전시킨다. */
/* 조립 텍스처 안에서 동물이 실제로 차지하는 범위 (발 위치용) */
const WalkFit = {
  cache:new WeakMap(),
  of(tex){
    let v=this.cache.get(tex); if(v) return v;
    try{
      const c=document.createElement('canvas'); c.width=TEX_W; c.height=TEX_H;
      const x=c.getContext('2d'); x.drawImage(tex,0,0);
      const d=x.getImageData(0,0,TEX_W,TEX_H).data;
      let y0=TEX_H,y1=-1;
      for(let y=0;y<TEX_H;y++) for(let px=0;px<TEX_W;px+=2)
        if(d[((y*TEX_W+px)*4)+3]>40){ if(y<y0)y0=y; if(y>y1)y1=y; break; }
      if(y1<0){ y0=0; y1=TEX_H-1; }
      v={top:y0, bot:y1, botOff:y1-TEX_H/2};
    }catch(e){ v={top:0,bot:TEX_H-1,botOff:TEX_H/2}; }
    this.cache.set(tex,v); return v;
  }
};


/* ══ 정글도 만지면 반응한다 ══════════════════════════ */
const JUNGLE_REACT = {
  elephant:'trumpet',
  lion:'roar', tiger:'roar', leopard:'roar', cheetah:'roar', wolf:'roar', gorilla:'roar',
  kangaroo:'jump', rabbit:'jump', frog:'jump',
  monkey:'swing', squirrel:'swing', sloth:'swing', koala:'swing', chameleon:'swing',
  parrot:'flap', toucan:'flap', owl:'flap', flamingo:'flap', peacock:'fan',
  butterfly:'flap', dragonfly:'flap',
  giraffe:'stretch', camel:'stretch', llama:'stretch', deer:'stretch',
  bear:'shake', fox:'shake', raccoon:'shake', panda:'shake', zebra:'shake',
  hedgehog:'curlup', landturtle:'curlup', iguana:'curlup', beetle:'curlup',
  hippo:'yawn', crocodile:'yawn', rhino:'yawn', pig:'yawn',
};
const JREACT_LEN = { trumpet:56, roar:50, jump:44, swing:52, flap:46,
                     fan:60, stretch:54, shake:42, curlup:50, yawn:56, nod:38 };

/* 층 이름 → 번호 */
const JLAYER_IDX={ canopy:0, branch:1, ground:2, water:3 };

class Walker {
  constructor(paintedTex, id, name, opt){
    opt=opt||{};
    this.id=id; this.D=JUNGLE[id]; this.name=name||'';
    this.tex=paintedTex;            // 조립 상태로 칠해진 텍스처 (TEX_W x TEX_H)
    /* 높이 층 — 종마다 사는 높이가 다르다 */
    this.layer = JLAYER_IDX[(this.D&&this.D.layer)||'ground'];
    this.x=opt.x!==undefined?opt.x:rnd()*VW;
    /* 층 안에서도 흩어놓는다 — 같은 층이 한 줄로 서면 층을 나눈 의미가 없다.
       위 층일수록 폭이 넓다(가지·허공은 자유롭고 물가는 강을 벗어나면 안 된다) */
    const SPREAD=[54,44,46,20][this.layer];
    this.depth=rnd();                       // 0 = 뒤(위·작게) · 1 = 앞(아래·크게)
    this.baseY=JWorld.layerY(this.layer)+(this.depth-0.5)*2*SPREAD;
    this.y=opt.y!==undefined?opt.y:this.baseY;
    this.dir=rnd()<0.5?-1:1;
    /* ⚠ 0.7~1.1 로 뒀더니 화면에서 101x81px 였다 — 아이 그림이 안 보인다.
       조립 텍스처를 동물이 66%x79% 만 채우므로 배율을 더 키워야 한다. */
    /* 위 층일수록 작게 — 멀리 있는 느낌.
       ⚠ 층 안에서 크기가 균일하면 20마리가 한 줄로 겹쳐 벽이 된다.
         같은 층에서도 뒤(위)에 선 것은 작게 — 겹쳐도 앞뒤로 읽힌다. */
    const LS=[0.62,0.78,1.0,1.06][this.layer!==undefined?this.layer:2];
    const near=0.78+(this.depth!==undefined?this.depth:0.5)*0.44;   // 0.78 ~ 1.22
    this.s=(1.5+rnd()*0.7)*LS*near;
    this.spd=(0.4+rnd()*0.5)*this.D.gait.speed;
    this.t=rnd()*300; this.ph=rnd()*TAU;
    this.mine=!!opt.mine; this.joinT=opt.join?70:0;
    this.scared=0; this.reactT=0; this.reactKind=null;
  }
  /* 만졌다 — 종에 맞는 반응 */
  react(){
    const kind = JUNGLE_REACT[this.id] || 'nod';
    this.reactKind = kind;
    this.reactT = this.reactMax = JREACT_LEN[kind] || 40;
    const x=this.x, y=this.y;
    if(kind==='roar' || kind==='trumpet') FX.note(x, y-this.h*0.5);
    else if(kind==='jump')   FX.dust(x, y+8, 12);
    else if(kind==='fan')    FX.sparkle(x, y-this.h*0.3, 14);
    else if(kind==='yawn')   FX.ring(x, y-this.h*0.2);
    else if(kind==='shake')  FX.dust(x, y+6, 8);
    else                     FX.heart(x, y-this.h*0.45);
    if(typeof Sfx!=='undefined' && Sfx.creature) Sfx.creature(kind);
    return kind;
  }
  get w(){ return TEX_W*this.s; }
  get h(){ return TEX_H*this.s; }
  update(dt, world){
    this.t+=dt*60;
    if(this.joinT>0) this.joinT--;
    if(this.scared>0) this.scared--;
    if(this.reactT>0) this.reactT--;
    const sp=this.spd*(this.scared>0?2.8:1);
    /* ⚠ 모든 종이 똑같이 걸었다 — 캥거루가 안 뛰고 나비가 안 날았다(실측:
       전 종 세로 흔들림 0px). 속도만 다르면 40종이 한 종처럼 보인다. */
    /* 나뭇가지 층은 가지 위를 딛는다 — 가지가 없는 구간에서는 제 층 높이로.
       급히 바뀌면 순간이동처럼 보이므로 천천히 따라간다. */
    let G0=this.baseY!==undefined?this.baseY:JWorld.groundY();
    if(this.layer===1 && world && world.perchYAt){
      const py=world.perchYAt(this.x);
      this.perchY = (this.perchY===undefined) ? (py!==null?py:G0) : this.perchY;
      const want = (py!==null) ? py : G0;
      this.perchY += (want-this.perchY)*0.06;
      G0=this.perchY;
    }
    switch(this.D.move){
      case 'hop': {                       // 캥거루·토끼·개구리 — 진짜로 뛴다
        this.hopT=(this.hopT||0)+1;
        const period = 46 + (this.D.gait.bob||10);
        const k=(this.hopT%period)/period;
        const air = k<0.62 ? Math.sin(k/0.62*Math.PI) : 0;
        this.y = G0 - air*(52+this.D.gait.bob*2.2);
        this.airborne = air>0.15;
        break; }
      case 'fly': {                       // 나비·잠자리 — 땅에 안 붙는다
        /* ⚠ 층을 넣기 전엔 땅에서 150px 띄웠는데, 이제 기준선 자체가 나무 위라
           그대로 두면 **화면 밖으로 나갔다**(실측 y=-32).
           층 기준선 둘레에서만 떠다닌다. */
        this.flyPh=(this.flyPh||rnd()*TAU)+0.03;
        this.y = G0 + Math.sin(this.flyPh)*44 + Math.sin(this.flyPh*0.37)*22;
        break; }
      case 'bounce':                      // 원숭이·다람쥐 — 통통
        this.y = G0 - Math.abs(Math.sin(this.t*0.14+this.ph))*22; break;
      case 'creep':                       // 나무늘보 — 거의 안 움직인다
        this.y = G0 - Math.sin(this.t*0.02+this.ph)*3; break;
      case 'strut':                       // 새 — 목을 까딱이며 걷는다
        this.y = G0 - Math.abs(Math.sin(this.t*0.09+this.ph))*7; break;
      default:
        this.y = G0;
    }
    if(this.mine && world && world.callAt && this.scared<=0){
      const cx=world.callAt.x, d=cx-this.x;
      if(Math.abs(d)>80){
        this.dir=d>0?1:-1; this.x += sp*2.8*this.dir;
        if(Game.t%9===0) FX.sparkle(this.x, this.y-40, 1);
        return;
      }
    }
    /* 손가락을 대고 있으면 다가온다 — 층은 유지하고 x 로만 */
    if(world.touchAt && !(this.scared>0) && !(this.reactT>0)){
      const T=world.touchAt, dx=T.x-this.x, ax=Math.abs(dx);
      if(T.swirl && ax<260){                 // 휘저으면 밀린다
        this.x += (T.vx||0)*(1-ax/260)*0.45;
        if(Math.abs(T.vx||0)>2) this.dir=(T.vx>0)?1:-1;
        return;
      }
      const eager=Math.min(1,(T.hold-20)/70);
      if(eager>0 && !T.swirl && ax<820){
        if(ax>110){ this.x+=Math.sign(dx)*sp*1.6*eager; this.dir=dx>0?1:-1; }
        else { this.x+=Math.sign(dx)*sp*0.25; }   // 도착하면 서성인다
        return;                                    // 제 갈 길은 접는다
      }
    }
    /* 무리 — 같은 종끼리 느슨하게 모인다(바다와 같은 격자를 쓴다)
       ⚠ 밀어내기 반경이 70px 이었는데 동물 폭은 300~400px 이다.
         8마리 중 7쌍이 겹쳤다(실측) — 아이 그림이 서로를 가린다.
         몸 크기로 벌리고, 6프레임마다는 너무 드물어 3프레임마다 본다. */
    if(world.flock && (Game.t + this.ph*97|0) % 3 === 0){
      const near=world.neighbors(this.x, this.y, this);
      let cx=0,n=0,px=0;
      for(const o of near){
        const dx=o.x-this.x, ax=Math.abs(dx);
        if(ax>340) continue;
        if((o.id||o.spId)===this.id){ cx+=o.x; n++; }
        const sep=(this.w+o.w)*0.30;
        if(ax<sep && ax>1) px -= dx/ax*(sep-ax)/sep;
      }
      if(n) this.x += ((cx/n)-this.x)*0.003;
      this.x += px*1.6;
    }
    this.x += sp*this.dir;
    if(this.x<-this.w) this.x=VW+this.w;
    if(this.x>VW+this.w) this.x=-this.w;
    if(rnd()<0.0012) this.dir*=-1;
  }
  draw(c, world){
    if(!this.tex) return;
    let s=this.s, alpha=1;
    if(this.joinT>0){ const k=1-this.joinT/70; s*=0.4+0.6*k; alpha=k; }
    const g=this.D.gait;
    /* 몸이 위아래로 까딱 — 걷는 리듬 */
    const bob=Math.sin(this.t*0.16+this.ph)*g.bob*0.1;
    /* 발이 땅에 닿게 — 조립본마다 동물 위치가 달라 자동으로 맞춘다 */
    const fit=WalkFit.of(this.tex);
    /* 만졌을 때의 몸짓 — 걷는 리듬 위에 얹는다 */
    let rsx=1, rsy=1, rrot=0, rdy=0, rdx=0;
    if(this.reactT>0){
      const k=1-this.reactT/this.reactMax;
      const bump=Math.sin(k*Math.PI);
      switch(this.reactKind){
        case 'trumpet': rrot=Math.sin(k*Math.PI*4)*0.10; rsx=1+bump*0.10; break;
        case 'roar':    rsx=1+bump*0.22; rsy=1+bump*0.26; rrot=Math.sin(k*Math.PI*6)*0.05; break;
        case 'jump':    rdy=-bump*70; rsy=1+bump*0.12; break;
        case 'swing':   rrot=Math.sin(k*Math.PI*3)*0.34; break;
        case 'flap':    rsy=1+Math.sin(k*Math.PI*8)*0.16; rdy=-bump*26; break;
        case 'fan':     rsx=1+bump*0.42; rsy=1+bump*0.16; break;
        case 'stretch': rsy=1+bump*0.30; rdy=-bump*14; break;
        case 'shake':   rrot=Math.sin(k*Math.PI*9)*0.13;                 // 몸 털기
                        rdx=Math.sin(k*Math.PI*11)*this.w*0.06; break;
        case 'curlup':  rsx=1-bump*0.26; rsy=1-bump*0.30; break;
        case 'yawn':    rsx=1+bump*0.20; rsy=1-bump*0.06; break;
        default:        rdy=-bump*16; rrot=Math.sin(k*Math.PI*4)*0.09;
      }
    }
    c.save();
    c.globalAlpha=alpha;
    c.translate(this.x+rdx, this.y+bob*s - fit.botOff*s + rdy);
    if(this.dir<0) c.scale(-1,1);
    if(rrot) c.rotate(rrot);
    c.scale(s*rsx, s*rsy);
    /* ⚠ 부위를 따로 회전시키려면 조각을 떼야 한다.
       칠한 텍스처는 조립본이므로, 각 부위의 화면 영역을 알아야 한다.
       그 영역은 JTemplate 의 배치와 같은 식으로 계산한다. */
    const T=JTemplate.get(this.id);
    if(!T){ c.drawImage(this.tex, -TEX_W/2, -TEX_H/2); c.restore(); return; }
    const k=TEX_W/TW;                  // 조립도안(720) → 텍스처(180)
    const D=this.D;
    const L=JLayout.of(this.id);
    let S, ox, oy, useMaster=false;
    if(L){
      useMaster=true;
      S=Math.min(TW/L.canvas[0], TH/L.canvas[1])*0.98*k;
      ox=(TEX_W-L.canvas[0]*S)/2; oy=(TEX_H-L.canvas[1]*S)/2;
    } else { S=T.S*k; ox=TEX_W/2-512*S/2; oy=TEX_H/2-512*S/2; }
    const legAng=(which)=>{
      /* 날개형(나비·잠자리)은 좌우가 **같이** 펄럭인다. 다리처럼 교대하면 어색하다 */
      const off = g && this.D.flyer ? 0 : (which==='legF'?0:Math.PI);
      const rate = this.D.flyer ? 0.42 : 0.16;
      return Math.sin(this.t*rate+this.ph+off)*g.swing;
    };
    const PARTS=(T&&T.parts)||D.parts;
    const part=(p)=>{
      if(!PARTS.includes(p)) return;
      if(useMaster){
        const pos=L.parts[p]; if(!pos) return;
        /* ⚠ 조립(JTemplate.mk)은 PNG 실제 크기로 그리는데 여기서만 정사각형을
           가정하면, 세로형 부위(기린·홍학 다리 256x512, 캥거루·토끼 귀)를
           **절반만 잘라 회전**한다. 다리 위쪽만 흔들리고 아래는 붙박이가 된다.
           조립과 같은 크기를 써야 한다. */
        const src=T && T.imgs && T.imgs[p+'_ink'];
        const iw=(src&&src.naturalWidth) || ((p==='body'||p==='head')?512:256);
        const ih=(src&&src.naturalHeight) || iw;
        const w=iw*S, h=ih*S;
        const sx=ox+pos[0]*S, sy=oy+pos[1]*S;
        /* 회전축 — 다리는 위쪽 가운데, 귀는 아래쪽 가운데 */
        /* 날개는 **몸에 붙은 쪽**을 축으로 돈다. 가운데를 축으로 하면
           날개가 몸에서 떨어져 허공에서 빙빙 돈다. */
        const px = sx + w*(p==='wing' ? 0.86 : 0.5);
        const py = (p==='legF'||p==='legB') ? sy + h*0.12 : sy + h*0.5;
        let ang=0;
        if(p==='legF'||p==='legB') ang=legAng(p);
        if(p==='ear') ang=Math.sin(this.t*0.11+this.ph)*0.18;
        if(p==='wing') ang=Math.sin(this.t*0.42+this.ph)*0.30;
        c.save();
        c.translate(px-TEX_W/2, py-TEX_H/2);
        if(ang) c.rotate(ang);
        c.drawImage(this.tex, sx,sy,w,h, -(px-sx), -(py-sy), w,h);
        c.restore();
        return;
      }
      const a=BodyBox.anchor(T.box,p,this.id);
      const pb=BodyBox.part(this.id,p,T.imgs[p+'_mask']);
      const sc = (T.box.w * BodyBox.relSize(p,this.id)) / Math.max(1, pb.w) * (256/512) * 2;
      const j=[
        p==='head'||p==='tail' ? pb.x0 : (pb.x0+pb.x1)/2,
        p==='legF'||p==='legB' ? pb.y0 : (p==='ear' ? pb.y1 : (pb.y0+pb.y1)/2)
      ];
      const w=256*S*sc, h=256*S*sc;
      const px=ox+a[0]*S, py=oy+a[1]*S;      // 이음점의 텍스처 좌표
      const sx=px-j[0]*S*sc, sy=py-j[1]*S*sc; // 조각의 좌상단
      let ang=0;
      if(p==='legF'||p==='legB') ang=legAng(p);
      if(p==='ear') ang=Math.sin(this.t*0.11+this.ph)*0.22;
      c.save();
      c.translate(px-TEX_W/2, py-TEX_H/2);
      if(ang) c.rotate(ang);
      c.drawImage(this.tex, sx,sy,w,h, -(px-sx), -(py-sy), w,h);
      c.restore();
    };
    /* body 는 통째로, 나머지는 조각내어 */
    if(useMaster){
      ['legB','wing','tail','ear'].forEach(part);
      const bp=L.parts['body'];
      if(bp) c.drawImage(this.tex, ox+bp[0]*S, oy+bp[1]*S, 512*S, 512*S,
        ox+bp[0]*S-TEX_W/2, oy+bp[1]*S-TEX_H/2, 512*S, 512*S);
      ['legF','head'].forEach(part);
    } else {
      ['legB','ear'].forEach(part);
      c.drawImage(this.tex, ox, oy, 512*S, 512*S,
        ox-TEX_W/2, oy-TEX_H/2, 512*S, 512*S);
      ['legF','head'].forEach(part);
    }
    c.restore();
    c.globalAlpha=1;

    /* 내 것 표시 — ⚠ 바다에만 있고 **정글엔 없었다.**
       찾기를 누르면 동물이 모이기는 하는데 표시가 안 떠서
       아이가 어느 게 자기 것인지 알 수 없었다. 이 게임의 핵심 기능이다. */
    if(this.mine && world && world.findT>0){
      c.save();
      c.globalAlpha=Math.min(1, world.findT/40);
      const r=this.w*0.42+10+Math.sin(this.t*0.1)*5;
      c.strokeStyle=PAL.gold; c.lineWidth=5;
      c.beginPath(); c.ellipse(this.x, this.y-this.h*0.14, r, this.h*0.52, 0, 0, TAU); c.stroke();
      const ay=this.y-this.h*0.66, asz=Math.max(64, this.w*0.32);
      if(!(typeof FXA!=='undefined' &&
           FXA.draw(c,'fx-arrow-point', this.x, ay-asz*0.55, asz, 0))){
        c.fillStyle=PAL.gold;
        c.beginPath(); c.moveTo(this.x, ay); c.lineTo(this.x-14, ay-22);
        c.lineTo(this.x+14, ay-22); c.closePath(); c.fill();
      }
      c.restore();
    }

    if(this.name && this.w>110){
      c.save(); c.globalAlpha=0.9;
      c.font='600 15px Galmuri11, sans-serif'; c.textAlign='center';
      const tw=c.measureText(this.name).width+16;
      c.fillStyle='rgba(20,40,20,.62)';
      c.fillRect(this.x-tw/2, this.y+this.h*0.30, tw, 21);
      c.fillStyle=PAL.white; c.fillText(this.name, this.x, this.y+this.h*0.30+16);
      c.restore();
    }
  }
}

/* 색칠 결과 → 텍스처. 바다와 같은 방식이되 조립 도안을 쓴다. */
