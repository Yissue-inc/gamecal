'use strict';
/* ── 연출 스프라이트 ────────────────────────────────────
   ⚠ 프레임 시트다. 가로로 N칸이 이어져 있고 왼쪽부터 시간 순서.
     어셋이 없으면 지금까지의 코드 그림으로 폴백한다. */
const FXA = {
  cache:{}, tried:{},
  /* 이름 → [프레임수] */
  FRAMES:{ 'fx-splash-in':4, 'fx-sparkle':4, 'fx-ring-pulse':4, 'fx-bubble-pop':4,
           'fx-leaf-fall':1, 'fx-dust-puff':4, 'fx-heart-pop':3, 'fx-spotlight':1,
           'fx-confetti':4, 'fx-name-tag':1, 'fx-arrow-point':1, 'fx-water-ripple':4,
           'fx-chest-burst':1 },
  get(n){
    if(this.cache[n]) return this.cache[n];
    if(this.tried[n]) return null;
    this.tried[n]=true;
    const img=new Image(); img.onload=()=>{ this.cache[n]=img; };
    img.src='assets/ui/'+n+'.png?v='+AREV;
    return null;
  },
  /* k = 0~1 진행도. 중앙 기준. */
  draw(c,n,x,y,size,k){
    const img=this.get(n); if(!img) return false;
    const N=this.FRAMES[n]||1;
    const fw=img.width/N, fh=img.height;
    const f=Math.min(N-1, Math.floor(k*N));
    const w=size, h=size*(fh/fw);
    c.drawImage(img, f*fw,0,fw,fh, x-w/2, y-h/2, w, h);
    return true;
  },
  prefetch(){ Object.keys(this.FRAMES).forEach(n=>this.get(n)); }
};

const FX = {
  list:[],
  /* ⚠ 상한이 없으면 여럿이 동시에 반응할 때 프레임이 무너진다
     (실측: 200마리 중 100이 반응 → 파티클 214개 → 최악 28.3ms, 예산 16.7).
     오래된 것부터 버린다 — 새로 생긴 반응이 더 중요하다. */
  MAX:190,
  push(p){
    if(this.list.length>=this.MAX) this.list.splice(0, this.list.length-this.MAX+1);
    this.list.push(p);
  },
  prefetch(){ FXA.prefetch(); },
  clear(){ this.list.length=0; },
  ring(x,y){ this.push({k:'ring',x,y,t:0,max:34}); },
  heart(x,y){ this.push({k:'heart',x,y,t:0,max:44,vy:-1.2}); },
  splash(x,y){ for(let i=0;i<26;i++){ const a=rnd()*TAU, s=2+rnd()*5;
    this.push({k:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,t:0,max:40,
      c:pick(['#ffffff','#bfe9ff','#8fd4ff'])}); } },
  confetti(x,y){ for(let i=0;i<40;i++){ const a=rnd()*TAU, s=2+rnd()*6;
    this.push({k:'conf',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,t:0,max:70,
      c:pick(CRAYONS), rot:rnd()*TAU, vr:(rnd()-0.5)*0.4}); } },
  /* ── 만졌을 때 쓰는 것들 ─────────────────────────── */
  ink(x,y,dir){                    // 문어·오징어 먹물
    for(let i=0;i<18;i++){ const a=rnd()*TAU, sp=0.6+rnd()*2.2;
      this.push({k:'ink', x:x-dir*20, y, vx:Math.cos(a)*sp-dir*1.4,
        vy:Math.sin(a)*sp*0.6-0.3, t:0, max:64, r:10+rnd()*22}); }
  },
  bubbles(x,y,n){                  // 고래 물 뿜기
    for(let i=0;i<(n||12);i++)
      this.push({k:'bub', x:x+(rnd()-0.5)*40, y, vx:(rnd()-0.5)*1.0,
        vy:-1.2-rnd()*1.6, t:0, max:70, r:3+rnd()*7});
  },
  glow(x,y,col){                   // 해파리·아귀 빛
    this.push({k:'glow', x, y, t:0, max:46, c:col||'#9ff'});
  },
  note(x,y){                       // 소리내는 동물 — 음표
    for(let i=0;i<3;i++)
      this.push({k:'note', x:x+(rnd()-0.5)*30, y, vx:(rnd()-0.5)*0.8,
        vy:-1.1-rnd()*0.7, t:0, max:56, rot:(rnd()-0.5)*0.5, vr:0});
  },
  dust(x,y,n){                     // 땅을 구르거나 뛸 때
    for(let i=0;i<(n||10);i++){ const a=-rnd()*Math.PI;
      this.push({k:'dot', x, y, vx:Math.cos(a)*(1+rnd()*3),
        vy:Math.sin(a)*(0.6+rnd()*1.4), t:0, max:34, c:'rgba(230,215,180,.9)'}); }
  },
  sparkle(x,y,n){ for(let i=0;i<(n||8);i++){ const a=rnd()*TAU, s=1+rnd()*3;
    this.push({k:'dot',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,max:30,c:PAL.gold}); } },
  update(){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i]; p.t++;
      if(p.vx!==undefined){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy=p.vy*0.95+0.12; }
      if(p.k==='heart') p.y+=p.vy;
      if(p.k==='bub'){ p.vy*=0.99; p.x+=Math.sin(p.t*0.12)*0.6; }
      if(p.rot!==undefined) p.rot+=p.vr;
      if(p.t>p.max) this.list.splice(i,1);
    }
  },
  draw(c){
    for(const p of this.list){
      const k=1-p.t/p.max;
      c.globalAlpha=k;
      if(p.k==='ring'){
        if(!FXA.draw(c,'fx-ring-pulse',p.x,p.y,180,1-k)){
          c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=3;
          c.beginPath(); c.arc(p.x,p.y,(1-k)*90,0,TAU); c.stroke();
        }
      } else if(p.k==='heart'){
        if(FXA.draw(c,'fx-heart-pop',p.x,p.y,44,1-k)){ c.globalAlpha=1; continue; }
        c.fillStyle=PAL.red; const r=9;
        c.beginPath(); c.moveTo(p.x,p.y+r*0.7);
        c.bezierCurveTo(p.x-r*1.3,p.y-r*0.3,p.x-r*0.5,p.y-r*1.1,p.x,p.y-r*0.35);
        c.bezierCurveTo(p.x+r*0.5,p.y-r*1.1,p.x+r*1.3,p.y-r*0.3,p.x,p.y+r*0.7);
        c.fill();
      } else if(p.k==='ink'){
        c.globalAlpha=k*0.55;
        c.fillStyle='#101a26';
        c.beginPath(); c.arc(p.x,p.y,p.r*(1.4-k*0.5),0,TAU); c.fill();
      } else if(p.k==='bub'){
        c.globalAlpha=k*0.85;
        c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=2;
        c.beginPath(); c.arc(p.x,p.y,p.r,0,TAU); c.stroke();
      } else if(p.k==='glow'){
        const g=c.createRadialGradient(p.x,p.y,2,p.x,p.y,90*(1.2-k*0.4));
        g.addColorStop(0,p.c); g.addColorStop(1,'rgba(255,255,255,0)');
        c.globalAlpha=k*0.7; c.fillStyle=g;
        c.beginPath(); c.arc(p.x,p.y,90*(1.2-k*0.4),0,TAU); c.fill();
      } else if(p.k==='note'){
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillStyle=PAL.white; c.font='700 26px Galmuri11, sans-serif'; c.textAlign='center';
        c.fillText('♪',0,0); c.restore();
      } else if(p.k==='conf'){
        c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
        c.fillStyle=p.c; c.fillRect(-5,-3,10,6); c.restore();
      } else {
        c.fillStyle=p.c||'#fff';
        c.beginPath(); c.arc(p.x,p.y,3*k+1,0,TAU); c.fill();
      }
    }
    c.globalAlpha=1;
  }
};

const Sfx = {
  ac:null, master:null, on:true,
  unlock(){ if(this.ac){ if(this.ac.state==='suspended') this.ac.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    this.ac=new AC(); this.master=this.ac.createGain();
    this.master.gain.value=this.on?0.5:0; this.master.connect(this.ac.destination); },
  toggle(){ this.on=!this.on; if(this.master) this.master.gain.value=this.on?0.5:0;
    Save.data.sound=this.on; Save.write(); return this.on; },
  tone(f,d,type,g,slide){ if(!this.ac) return;
    const t=this.ac.currentTime, o=this.ac.createOscillator(), gg=this.ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    gg.gain.setValueAtTime(0,t); gg.gain.linearRampToValueAtTime(g||0.12,t+0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(gg); gg.connect(this.master); o.start(t); o.stop(t+d+0.02); },
  ui(){ this.tone(720,0.06,'sine',0.09,900); },
  /* ⚠ 색칠은 이 작품에서 아이가 가장 오래 하는 행동인데 **아무 소리도 없었다.**
     손끝이 들려야 '내가 칠하고 있다'가 된다.
     다만 매 프레임 내면 소음이 된다 — 호출부에서 간격을 둔다. */
  brush(pitch){
    if(!this.ac) return;
    const t=this.ac.currentTime, len=Math.floor(this.ac.sampleRate*0.05);
    const b=this.ac.createBuffer(1,len,this.ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ac.createBufferSource(); src.buffer=b;
    /* ⚠ Q=1.4 대역필터가 에너지를 크게 깎아 배경 대비 1.2배밖에 안 됐다(실측).
       Q 를 넓히고 이득을 올린다. 목표는 배경의 2.5배 이상. */
    const f=this.ac.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=900+(pitch||0)*600; f.Q.value=0.8;
    const g=this.ac.createGain(); g.gain.value=0.55;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  /* 색을 고를 때 — 색마다 음이 다르면 아이가 색을 '듣는다' */
  swatch(i){ this.tone(440*Math.pow(2, i/12), 0.09, 'triangle', 0.08); },
  pop(){ this.tone(420,0.09,'sine',0.11,700); },
  plop(){ this.tone(300,0.12,'sine',0.11,120); },
  eat(){ this.tone(880,0.06,'triangle',0.08,1200); },
  /* 만졌을 때 — 반응마다 다른 소리. 같은 소리면 종이 다른 걸 모른다 */
  creature(kind){
    if(!this.on) return;
    const T=(f,d,ty,g,sl,delay)=>setTimeout(()=>this.tone(f,d,ty,g,sl), delay||0);
    switch(kind){
      case 'puff':    T(180,0.22,'sine',0.13,520); break;                    // 부풀
      case 'ink':     T(140,0.34,'sawtooth',0.07,60); break;                 // 퍼짐
      case 'glow':    [660,880,1180].forEach((f,i)=>T(f,0.20,'sine',0.07,f*1.1,i*70)); break;
      case 'pinch':   [0,90,180].forEach((d,i)=>T(1100,0.05,'square',0.05,900,d)); break;
      case 'hide':    T(520,0.20,'sine',0.10,180); break;                    // 쏙
      case 'spin':    T(500,0.26,'triangle',0.10,1100); break;
      case 'dash':    T(300,0.16,'sawtooth',0.08,1400); break;
      case 'blow':    T(220,0.40,'sine',0.11,90); break;                     // 물 뿜기
      case 'curl':    T(400,0.24,'sine',0.09,240); break;
      case 'trumpet': T(210,0.34,'sawtooth',0.11,330); break;                // 코끼리
      case 'roar':    T(120,0.42,'sawtooth',0.13,80); break;                 // 포효
      case 'jump':    T(420,0.13,'sine',0.10,900); T(300,0.10,'sine',0.07,180,150); break;
      case 'swing':   [640,540,700].forEach((f,i)=>T(f,0.12,'sine',0.07,f*0.9,i*90)); break;
      case 'flap':    [0,80,160].forEach(d=>T(240,0.06,'triangle',0.06,180,d)); break;
      case 'fan':     [520,660,820,980].forEach((f,i)=>T(f,0.16,'sine',0.07,f*1.2,i*60)); break;
      case 'stretch': T(340,0.30,'sine',0.09,620); break;
      case 'shake':   [0,60,120,180].forEach(d=>T(300,0.05,'square',0.05,240,d)); break;
      case 'curlup':  T(600,0.22,'sine',0.09,220); break;
      case 'yawn':    T(160,0.38,'sine',0.11,300); break;
      /* 새 모드(공룡·로봇·곤충) — ⚠ 여기가 비어 있어 150종이 전부 같은 '삐' 소리였다.
         종이 다른 걸 귀로는 알 수 없었다. */
      case 'stomp':   T(90,0.26,'sine',0.15,52); T(70,0.20,'sine',0.10,45,140); break;   // 쿵
      case 'chomp':   T(240,0.05,'square',0.10,140); T(200,0.05,'square',0.09,120,110); break;
      case 'whirl':   T(300,0.34,'triangle',0.10,1200); break;                            // 빙그르르
      case 'snap':    T(1400,0.04,'square',0.08,700); break;                              // 딱
      case 'flutter': [0,55,110,165].forEach(d=>T(300,0.05,'triangle',0.05,250,d)); break;
      case 'roll':    T(120,0.40,'sawtooth',0.09,420); break;                             // 데굴데굴
      case 'splash':  [420,620,880].forEach((f,i)=>T(f,0.16,'sine',0.09,f*1.4,i*55)); break;
      case 'wave':    [520,640,760].forEach((f,i)=>T(f,0.14,'sine',0.08,f*1.1,i*80)); break;
      case 'wiggle':  T(620,0.10,'sine',0.08,780); T(700,0.08,'sine',0.06,860,90); break;
      case 'nod':     T(380,0.10,'sine',0.09,320); T(340,0.09,'sine',0.07,300,110); break;
      default:        T(560,0.12,'sine',0.09,760);
    }
  },
  splash(){ [400,600,900].forEach((f,i)=>setTimeout(()=>this.tone(f,0.2,'sine',0.1,f*1.5),i*60)); },
  join(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,0.28,'triangle',0.12),i*95)); },
};

</script>
<script>
/* ===== js/55_ambience.js ===== */
/* ══════════════════════════════════════════════════════════════════
   소리 풍경 — 세계마다 다르게, 전부 Web Audio 합성 (오디오 파일 0개).

   ⚠ 효과음만 있으면 '조용한 화면에 가끔 삑 소리'다.
     전시장은 소리가 계속 나야 살아 있는 공간이 된다.
   ⚠ 다만 아이들이 몇 시간씩 듣는다. **거슬리면 안 된다.**
     - 반복 주기가 뚜렷하면 귀에 박힌다 → 주기를 어긋나게 겹친다
     - 고음이 계속되면 피로하다 → 저역 위주, 고역은 짧게만
     - 소리가 곧 상태다: 아이가 많이 만들수록 풍성해진다
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Amb = {
  ac:null, bus:null, nodes:[], realm:null, started:false, level:0,

  init(sfx){
    if(this.started || !sfx.ac) return;
    this.ac=sfx.ac;
    this.bus=this.ac.createGain();
    this.bus.gain.value=0;                 // 조용히 시작해 서서히 올린다
    this.bus.connect(sfx.master);
    this.started=true;
  },
  /* 세계가 바뀌면 갈아 끼운다 */
  set(realm){
    if(!this.started || this.realm===realm) return;
    this.stopAll();
    this.realm=realm;
    if(realm==='sea') this.buildSea(); else this.buildJungle();
    this.fade(0.55, 1.6);
  },
  fade(to, sec){
    if(!this.bus) return;
    const t=this.ac.currentTime;
    this.bus.gain.cancelScheduledValues(t);
    this.bus.gain.setValueAtTime(this.bus.gain.value, t);
    this.bus.gain.linearRampToValueAtTime(to, t+sec);
  },
  stopAll(){
    for(const n of this.nodes){ try{ n.stop ? n.stop() : n.disconnect(); }catch(e){} }
    this.nodes=[];
    if(this._timer){ clearInterval(this._timer); this._timer=null; }
  },
  /* 흰소음 버퍼 — 물소리·바람의 재료 */
  noiseBuf(sec){
    const len=Math.floor(this.ac.sampleRate*sec);
    const b=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=b.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){
      /* 갈색 잡음 — 흰소음보다 저역이라 귀에 편하다 */
      last=(last+(Math.random()*2-1)*0.06); last=Math.max(-1,Math.min(1,last*0.997));
      d[i]=last*3;
    }
    return b;
  },
  loopNoise(freq, q, gain, type){
    const src=this.ac.createBufferSource();
    src.buffer=this.noiseBuf(4); src.loop=true;
    const f=this.ac.createBiquadFilter();
    f.type=type||'lowpass'; f.frequency.value=freq; f.Q.value=q||0.6;
    const g=this.ac.createGain(); g.gain.value=gain;
    src.connect(f); f.connect(g); g.connect(this.bus);
    src.start();
    this.nodes.push(src);
    return {src,f,g};
  },
  /* 아주 느린 흔들림 — 기계적으로 안 들리게 */
  wobble(param, base, depth, sec){
    const lfo=this.ac.createOscillator();
    lfo.type='sine'; lfo.frequency.value=1/sec;
    const amp=this.ac.createGain(); amp.gain.value=depth;
    param.value=base;
    lfo.connect(amp); amp.connect(param); lfo.start();
    this.nodes.push(lfo);
  },

  /* ── 바다 ─────────────────────────────────────────
     깊은 물 울림 + 아주 옅은 물결 + 이따금 공기방울 */
  buildSea(){
    const deep=this.loopNoise(220, 0.5, 0.16);
    this.wobble(deep.f.frequency, 220, 70, 17);      // 17초 주기
    const surf=this.loopNoise(700, 0.8, 0.05);
    this.wobble(surf.g.gain, 0.05, 0.03, 23);        // 23초 — 서로 안 겹친다
    /* 공기방울 — 불규칙하게 */
    this._timer=setInterval(()=>{
      if(!this.ac || Math.random()>0.55) return;
      this.bubble();
    }, 1400);
  },
  bubble(){
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='sine';
    const f0=380+Math.random()*520;
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*2.2, t+0.09);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.035+Math.random()*0.02, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+0.18);
  },

  /* ── 정글 ─────────────────────────────────────────
     바람에 흔들리는 잎 + 새소리 + 이따금 먼 울음 */
  buildJungle(){
    const wind=this.loopNoise(420, 0.7, 0.10);
    this.wobble(wind.g.gain, 0.10, 0.06, 13);
    const leaves=this.loopNoise(2400, 1.2, 0.022, 'bandpass');
    this.wobble(leaves.g.gain, 0.022, 0.016, 9);
    this._timer=setInterval(()=>{
      if(!this.ac) return;
      const r=Math.random();
      if(r<0.42) this.bird();
      else if(r<0.5) this.hoot();
    }, 1700);
  },
  bird(){
    const t=this.ac.currentTime;
    const n=2+((Math.random()*3)|0);
    const base=1500+Math.random()*900;
    for(let i=0;i<n;i++){
      const o=this.ac.createOscillator(), g=this.ac.createGain();
      const st=t+i*0.085;
      o.type='sine';
      o.frequency.setValueAtTime(base*(1+i*0.06), st);
      o.frequency.exponentialRampToValueAtTime(base*(1.25+i*0.06), st+0.05);
      g.gain.setValueAtTime(0,st);
      g.gain.linearRampToValueAtTime(0.028, st+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.07);
      o.connect(g); g.connect(this.bus); o.start(st); o.stop(st+0.1);
    }
  },
  hoot(){
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(230,t);
    o.frequency.linearRampToValueAtTime(200, t+0.4);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(0.05, t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+0.55);
  },

  /* ⚠ 색칠 화면에서는 앰비언스를 낮춘다.
     아이가 집중하는 순간이고, 붓 소리가 배경에 묻히면 '내가 칠하고 있다'가 안 들린다.
     실측: 앰비언스 0.14 에 붓 0.05 를 얹으니 구별이 안 됐다. */
  duck(on){
    if(!this.bus) return;
    this._ducked=on;
    this.fade(on ? 0.14 : (0.42+this.level*0.30), 0.5);
  },

  /* ⚠ 소리가 곧 상태다 — 아이가 많이 만들수록 풍성해진다.
     빈 수조와 200마리 수조가 같은 소리면 '내가 채웠다'가 안 느껴진다. */
  setLevel(n){
    if(!this.bus) return;
    const k=Math.min(1, n/120);
    this.level=k;
    if(!this._ducked) this.fade(0.42+k*0.30, 2.2);
  }
};

</script>
<script>
/* ===== js/20_paint.js ===== */
/* ══════════════════════════════════════════════════════════════════
   색칠 화면 — 아이가 실제로 만지는 곳.

   ⚠ 아이가 아무리 문질러도 선 밖으로 안 나가야 한다.
     칠한 것을 mask 로 잘라내는 방식(destination-in)이 그걸 보장한다.
   ⚠ 되돌리기가 없으면 아이는 망쳤다고 생각하고 포기한다. 반드시 있어야 한다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Paint = {
  spId:'clownfish', color:CRAYONS[0], tool:'brush', size:44,
  /* ⚠ 붓이 하나뿐이면 큰 면과 작은 면을 같은 붓으로 칠해야 한다.
     아이는 굵기를 바꿀 줄 안다 — 3단계면 충분하고, 4단계부터는 헷갈린다. */
  sizes:[22,44,78], sizeIdx:1,
  fill:null, fctx:null, undo:[], drawing:false, lastX:0, lastY:0,
  /* 도안 배치 — 화면 가운데 크게 */
  /* 바다면 Templates, 정글이면 JTemplate — 한 곳에서 고른다 */
  /* 자유화(백지)면 도안이 없다 */
  get free(){ return this.spId==='__free__'; },
  mode:null,                      // 새 모드에서 고른 종이면 그 모드 이름
  tpl(){ if(this.free) return null;
    if(this.mode && typeof MTemplate!=='undefined') return MTemplate.get(this.mode, this.spId);
    return (typeof JUNGLE!=='undefined' && JUNGLE[this.spId])
    ? JTemplate.get(this.spId) : Templates.get(this.spId); },
  /* ⚠ 화면이 세로면(태블릿을 세워 두면) 16:9 무대가 화면 폭에 맞춰 0.6배로 줄어든다.
     그래서 색칸 60px 이 **실제 36px** 이 됐다 — 다섯 살 손가락에 작다(기준 38, 애플 권고 44).
     세로에서는 그림판을 조금 줄이고 그 자리를 색칸에 준다. 비율은 그대로 유지한다
     (가로세로를 따로 줄이면 아이 그림이 찌그러진다). */
  tight(){ return (typeof Screen!=='undefined' && Screen.scale>0 && Screen.scale<0.72); },
  box(){
    const k=this.tight()? 0.80 : 0.95;
    const w=TW*k, h=TH*k;
    return {x:VW/2-w/2, y:this.tight()?136:150, w, h};
  },
  toTpl(x,y){ const b=this.box(); return {x:(x-b.x)/b.w*TW, y:(y-b.y)/b.h*TH}; },

  open(spId, mode){
    this.mode = mode || null;
    if(typeof BG!=='undefined'){ BG.get('paper'); BG.get('frame-wood'); }
    this.spId=spId||this.spId;
    this._maskArea=undefined;          // 종이 바뀌면 분모도 바뀐다
    this.fill=document.createElement('canvas'); this.fill.width=TW; this.fill.height=TH;
    this.fctx=this.fill.getContext('2d');
    this.undo=[]; this.pushUndo();
    this.color=CRAYONS[0]; this.tool='brush'; this.drawing=false; this.mirror=false;
    this.sizeIdx=1; this.size=this.sizes[1];
  },
  pushUndo(){
    const c=document.createElement('canvas'); c.width=TW; c.height=TH;
    c.getContext('2d').drawImage(this.fill,0,0);
    this.undo.push(c); if(this.undo.length>14) this.undo.shift();
  },
  doUndo(){
    if(this.undo.length<2) return;
    this.undo.pop();
    const prev=this.undo[this.undo.length-1];
    this.fctx.clearRect(0,0,TW,TH); this.fctx.drawImage(prev,0,0);
    Sfx.ui();
  },
  clear(){ this.pushUndo(); this.fctx.clearRect(0,0,TW,TH); Sfx.ui(); },

  /* 도안 안쪽에서 실제로 칠해진 비율.
     ⚠ 전체 캔버스 대비로 재면 안 된다 — 새우는 꽉 칠해도 화면의 8%다.
        분모는 **칠할 수 있는 영역(mask)** 이어야 종끼리 비교가 된다. */
  inkedRatio(){
    const w=180, h=Math.round(w*TH/TW);
    const s=document.createElement('canvas'); s.width=w; s.height=h;
    const sc=s.getContext('2d', {willReadFrequently:true});
    sc.drawImage(this.fill,0,0,w,h);
    let painted=0;
    try{
      const d=sc.getImageData(0,0,w,h).data;
      for(let i=3;i<d.length;i+=4) if(d[i]>24) painted++;
    }catch(e){ return 1; }               // 못 읽으면 통과시킨다 — 막는 게 목적이 아니다
    if(this._maskArea===undefined){
      /* 백지에는 분모로 삼을 mask 가 없다 — 종이의 일부만 채워도 그림이다 */
      if(this.free){ this._maskArea = w*h*0.16; return Math.min(1, painted/this._maskArea); }
      const T=this.tpl();
      let a=0;
      if(T && T.mask){
        const m=document.createElement('canvas'); m.width=w; m.height=h;
        const mc=m.getContext('2d', {willReadFrequently:true});
        mc.drawImage(T.mask,0,0,w,h);
        try{ const md=mc.getImageData(0,0,w,h).data;
             for(let i=3;i<md.length;i+=4) if(md[i]>24) a++; }catch(e){ a=0; }
      }
      this._maskArea = a>0 ? a : w*h*0.28;   // mask 를 못 구하면 대략치
    }
    return Math.min(1, painted/this._maskArea);
  },

  _brushT:0,
  /* 좌우 대칭 — 반쪽만 그리면 반대편이 저절로 그려진다.
     ⚠ 손이 서툰 아이도 결과가 예뻐야 한다. 나비·얼굴처럼 좌우가 같은 것을
       혼자 맞춰 그리기는 어렵다 — 그리기 자체가 놀이가 되게 하는 장치다.
     ⚠ 지우개도 함께 비쳐야 한다. 안 그러면 지운 자리에 반대쪽이 남는다. */
  mirror:false,
  stroke(x,y,fromX,fromY){
    /* 붓질 소리 — 5프레임에 한 번만. 매번 내면 소음이 된다 */
    if(++this._brushT % 5 === 0 && this.tool!=='bucket')
      Sfx.brush((this.sizeIdx||0)/2);
    this._stroke(x,y,fromX,fromY);
    if(this.mirror){
      const m=(v)=>TW-v;
      this._stroke(m(x), y, fromX===undefined?undefined:m(fromX), fromY);
    }
  },
  _stroke(x,y,fromX,fromY){
    const f=this.fctx;
    f.save();
    f.strokeStyle=this.color; f.fillStyle=this.color;
    f.lineCap='round'; f.lineJoin='round';
    if(this.tool==='brush'){
      f.lineWidth=this.size;
      f.beginPath();
      if(fromX!==undefined){ f.moveTo(fromX,fromY); f.lineTo(x,y); } else { f.moveTo(x,y); f.lineTo(x+0.1,y); }
      f.stroke();
    } else if(this.tool==='eraser'){
      f.globalCompositeOperation='destination-out';
      f.lineWidth=this.size*1.3;
      f.beginPath();
      if(fromX!==undefined){ f.moveTo(fromX,fromY); f.lineTo(x,y); } else { f.moveTo(x,y); f.lineTo(x+0.1,y); }
      f.stroke();
    } else if(this.tool==='star'||this.tool==='heart'||this.tool==='dot'||this.tool==='stripe'){
      this.stamp(f,x,y);
    }
    f.restore();
    /* ⚠ 여기가 핵심 — 마스크 밖은 잘라낸다 */
    const T=this.tpl();
    if(T){ f.save(); f.globalCompositeOperation='destination-in';
      f.drawImage(T.mask,0,0); f.restore(); }
  },
  stamp(f,x,y){
    const r=this.size*0.8;
    f.beginPath();
    if(this.tool==='stripe'){ f.rect(x-r*0.35, y-r*1.6, r*0.7, r*3.2); }
    else if(this.tool==='dot'){ f.arc(x,y,r,0,TAU); }
    else if(this.tool==='star'){
      for(let k=0;k<10;k++){ const a=-Math.PI/2+k*Math.PI/5, rr=k%2?r*0.45:r;
        f.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); } f.closePath();
    } else {
      f.moveTo(x,y+r*0.7);
      f.bezierCurveTo(x-r*1.3,y-r*0.3, x-r*0.5,y-r*1.1, x,y-r*0.35);
      f.bezierCurveTo(x+r*0.5,y-r*1.1, x+r*1.3,y-r*0.3, x,y+r*0.7);
    }
    f.fill();
  },
  /* 페인트통 — 면 하나를 통째로. 마스크 안에서만 */
  bucket(x,y){
    this.pushUndo();
    const f=this.fctx;
    const T2=this.tpl();
    f.save(); f.fillStyle=this.color; f.fillRect(0,0,TW,TH);
    f.globalCompositeOperation='destination-in';
    if(T2) f.drawImage(T2.mask,0,0);
    f.restore();
    /* 이미 칠한 것 위에 덮이지 않도록 이전 것을 다시 얹는다 */
    const prev=this.undo[this.undo.length-1];
    f.drawImage(prev,0,0);
    Sfx.pop();
  },

  update(dt){
    const b=this.box();
    if(Input.down){
      const inBox = Input.x>b.x&&Input.x<b.x+b.w&&Input.y>b.y&&Input.y<b.y+b.h;
      if(inBox){
        const p=this.toTpl(Input.x,Input.y);
        if(!this.drawing){ this.drawing=true; this.pushUndo(); this.stroke(p.x,p.y); }
        else { const q=this.toTpl(Input.px,Input.py); this.stroke(p.x,p.y,q.x,q.y); }
        this.lastX=p.x; this.lastY=p.y;
      }
    } else this.drawing=false;
  },
  draw(c){
    /* 배경 — 종이 */
    c.fillStyle='#173a52'; c.fillRect(0,0,VW,VH);
    const b=this.box();
    c.save();
    c.shadowColor='rgba(0,0,0,.35)'; c.shadowBlur=24; c.shadowOffsetY=8;
    c.fillStyle=PAL.paper; c.fillRect(b.x-16,b.y-16,b.w+32,b.h+32);
    c.restore();
    /* 종이 결 — 어셋이 있으면 살짝 얹는다. 없으면 단색 그대로 */
    const pp=(typeof BG!=='undefined') && BG.get('paper');
    if(pp){
      c.save(); c.globalAlpha=0.5;
      c.beginPath(); c.rect(b.x-16,b.y-16,b.w+32,b.h+32); c.clip();
      for(let x=b.x-16;x<b.x+b.w+32;x+=256)
        for(let y=b.y-16;y<b.y+b.h+32;y+=256) c.drawImage(pp,x,y,256,256);
      c.restore();
    }
    const t=this.tpl();
    c.drawImage(this.fill, b.x,b.y,b.w,b.h);
    if(t) c.drawImage(t.ink, b.x,b.y,b.w,b.h);
    if(this.mirror){                       // 대칭 축 — 여기를 기준으로 비친다
      c.save(); c.globalAlpha=0.5;
      c.strokeStyle=PAL.gold; c.lineWidth=2; c.setLineDash([9,9]);
      c.beginPath(); c.moveTo(b.x+b.w/2, b.y+6); c.lineTo(b.x+b.w/2, b.y+b.h-6); c.stroke();
      c.restore();
    }
    /* 나무 액자 — 아이 그림을 감싼다. 가운데가 뚫린 그림이라 도안을 안 가린다 */
    const fr=(typeof BG!=='undefined') && BG.get('frame-wood');
    if(fr) c.drawImage(fr, b.x-46, b.y-46, b.w+92, b.h+92);
    else { c.font='700 22px Galmuri11, sans-serif'; c.textAlign='center';
      c.fillStyle='#8fa3b8'; c.fillText('도안을 불러오는 중…', VW/2, b.y+b.h/2); }
  }
};

</script>
<script>
/* ===== js/25_items.js ===== */
/* ══════════════════════════════════════════════════════════════════
   꾸미기 아이템 — 보물상자에서 나와 내 그림에 붙는다.

   ⚠ 왜 있나: 지금까지 '다시 올 이유'가 도감 하나뿐이었다.
     아이템은 두 번째 이유다 — 오늘 온 아이는 오늘 것을 얻는다.
   ⚠ 어셋(P19)이 아직 없다. 없으면 **코드로 그린 것**이 나온다.
     어셋이 오는 대로 조용히 대체된다 — 게임은 지금도 돈다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

/* 붙는 자리 — 그림 안에서 어디에 얹히나 */
const ITEM_SLOT = { head:'head', face:'face', body:'body', hold:'hold', pet:'pet' };

/* id, 이름, 붙는 자리. 어셋 파일은 assets/item/<id>.png */
const ITEMS = [
  ['hat-party','고깔모자','head'],   ['hat-crown','왕관','head'],
  ['hat-cap','야구모자','head'],     ['hat-straw','밀짚모자','head'],
  ['hat-chef','요리사모자','head'],  ['hat-pirate','해적모자','head'],
  ['hat-flower','꽃','head'],        ['hat-leaf','나뭇잎','head'],
  ['hat-bow','리본','head'],         ['hat-horn','뿔','head'],
  ['hat-halo','천사 고리','head'],   ['hat-antenna','더듬이','head'],
  ['face-glasses','안경','face'],    ['face-sunglass','선글라스','face'],
  ['face-goggle','물안경','face'],   ['face-mustache','콧수염','face'],
  ['face-mask','마스크','face'],     ['face-blush','볼터치','face'],
  ['face-star','별 눈','face'],      ['face-heart','하트 눈','face'],
  ['body-scarf','목도리','body'],    ['body-cape','망토','body'],
  ['body-bowtie','나비넥타이','body'],['body-necklace','목걸이','body'],
  ['body-backpack','가방','body'],   ['body-vest','조끼','body'],
  ['body-belt','허리띠','body'],     ['body-badge','배지','body'],
  ['hold-balloon','풍선','hold'],    ['hold-flag','깃발','hold'],
  ['hold-star','별 지팡이','hold'],  ['hold-umbrella','우산','hold'],
  ['hold-fish','작은 물고기','hold'],['hold-flower','꽃다발','hold'],
  ['pet-bubble','비눗방울','pet'],   ['pet-sparkle','반짝이','pet'],
  ['pet-butterfly','작은 나비','pet'],['pet-bird','작은 새','pet'],
  ['pet-star','작은 별','pet'],      ['pet-heart','하트','pet'],
];
const ITEM_BY_ID = {};
ITEMS.forEach(([id,ko,slot])=>{ ITEM_BY_ID[id]={id,ko,slot}; });

/* ══ 10초짜리 효과 ═══════════════════════════════════════
   꾸미기(영구)와 달리 잠깐 몸이 변한다. 상자에서 반반쯤 나온다.
   ⚠ 아이가 "무슨 일이 났는지" 바로 알아야 한다 — 이름을 크게 알리고
     남은 시간을 띠로 보여 준다. 조용히 변하면 버그로 보인다. */
const EFFECTS = {
  grow:   { ko:'커지기',   sec:10, col:'#ffd23f' },
  shrink: { ko:'작아지기', sec:10, col:'#4aa8ff' },
  fast:   { ko:'빨라지기', sec:10, col:'#ff6bb0' },
  slow:   { ko:'느려지기', sec:10, col:'#8ac926' },
  ghost:  { ko:'투명해지기', sec:10, col:'#b06bff' },
  glow:   { ko:'반짝이기', sec:10, col:'#ffe08a' },
  rainbow:{ ko:'무지개',   sec:10, col:'#ff8a3d' },
};
const EFFECT_IDS = Object.keys(EFFECTS);

/* 생물에 효과를 건다 — 어느 세계든 똑같이 */
function applyEffect(being, kind){
  const e=EFFECTS[kind]; if(!e || !being) return;
  being.fx = { kind, t: e.sec*60, max: e.sec*60 };
}

const Items = {
  cache:{}, tried:{},
  get(id){
    if(this.cache[id]) return this.cache[id];
    if(this.tried[id]) return null;
    this.tried[id]=true;
    const img=new Image();
    img.onload=()=>{ this.cache[id]=img; };
    img.src='assets/item/'+id+'.png?v='+AREV;
    return null;
  },
  /* 지금 뽑을 수 있는 것 — 꾸미기(영구)와 효과(10초)를 섞는다.
     ⚠ 효과만 나오면 남는 게 없고, 꾸미기만 나오면 놀랄 일이 없다. */
  pick(){
    if(rnd()<0.45) return 'fx:'+EFFECT_IDS[(rnd()*EFFECT_IDS.length)|0];
    const real = ITEMS.filter(([id])=>this.cache[id]).map(([id])=>id);
    const pool = real.length ? real : Object.keys(FALLBACK);
    return pool[(rnd()*pool.length)|0];
  },
  prefetch(){ ITEMS.forEach(([id])=>this.get(id)); },

  /* 그림 위에 얹는다. 자리마다 위치가 다르다.
     ⚠ 생물마다 크기가 달라 절대 좌표를 쓰면 큰 것에서 떠 버린다 — 몸 크기에 비례시킨다. */
  /* 머리 쪽 꼭대기 — ⚠ 그림 전체의 맨 위(top)에 모자를 얹었더니, 등이 높고
     머리가 가운데 있는 종(바다거북·게·복어)은 **모자가 허공에 떴다.**
     머리가 있는 띠(오른쪽 0.10~0.36폭)만 훑어 그 꼭대기를 찾는다. */
  headCache:new WeakMap(),
  headTop(tex){
    let v=this.headCache.get(tex); if(v!==undefined) return v;
    v=null;
    try{
      const cv=document.createElement('canvas'); cv.width=TEX_W; cv.height=TEX_H;
      const x=cv.getContext('2d',{willReadFrequently:true}); x.drawImage(tex,0,0);
      const d=x.getImageData(0,0,TEX_W,TEX_H).data;
      /* ⚠ 텍스처 폭의 0.60~0.88 을 훑었더니 바다거북은 **등껍질**이 그 띠에
         걸려 등 꼭대기를 머리로 착각했다. 그림이 실제로 차지하는 범위를 먼저
         찾고, 그 **오른쪽 끝 20%** 만 본다 — 도안 규격상 머리는 오른쪽이다. */
      let L=TEX_W, R=-1;
      for(let px=0;px<TEX_W;px++)
        for(let y=0;y<TEX_H;y+=2)
          if(d[((y*TEX_W+px)*4)+3]>40){ if(px<L)L=px; if(px>R)R=px; break; }
      if(R<0){ this.headCache.set(tex,null); return null; }
      const x0=Math.max(L, Math.floor(R-(R-L)*0.20)), x1=R+1;
      outer: for(let y=0;y<TEX_H;y++)
        for(let px=x0;px<x1;px++)
          if(d[((y*TEX_W+px)*4)+3]>40){ v=y; break outer; }
    }catch(e){}
    this.headCache.set(tex,v); return v;
  },
  draw(c, being){
    const id=being.item; if(!id) return;
    const def=ITEM_BY_ID[id] || {slot:(FALLBACK[id]?FALLBACK[id].slot:'head')};
    /* 생물이 자기 틀을 알려 주면 그걸 쓴다 — 종류마다 기준점이 다르다 */
    const F = (typeof being.itemFrame==='function') ? being.itemFrame() : being;
    const w=F.w, h=F.h;
    const dir=F.dir||1;
    /* ⚠ 텍스처 높이(h)로 위치를 잡으면 **여백까지 세어** 모자가 머리 위 허공에 뜬다.
       그림이 실제로 차지하는 범위를 재서 그 가장자리에 붙인다. */
    let top=-h*0.5, bot=h*0.5, mid=0;
    try{
      const f=(typeof BodyFit!=='undefined' && F.tex) ? BodyFit.of(F.tex) : null;
      if(f){
        const sc=h/TEX_H;
        top=(f.top-TEX_H/2)*sc; bot=(f.bot-TEX_H/2)*sc; mid=(top+bot)/2;
      }
    }catch(e){}
    const bh=Math.max(20, bot-top);
    /* ⚠ 머리는 **진행 방향 쪽**이다(도안 규격: 머리가 오른쪽).
       0.16 으로 뒀더니 왕관이 꼬리 쪽에 앉았다. */
    /* 머리 쪽 꼭대기를 알면 그걸 쓴다(없으면 전체 꼭대기) */
    let headY=top;
    try{
      const hy=(F.tex) ? this.headTop(F.tex) : null;
      if(hy!==null && hy!==undefined) headY=(hy-TEX_H/2)*(h/TEX_H);
    }catch(e){}
    const P={
      head:[ w*0.30*dir, headY - bh*0.10, w*0.30 ],  // 머리 바로 위
      face:[ w*0.32*dir, headY + bh*0.16, w*0.22 ],  // 눈 언저리 — 머리 기준
      body:[ w*0.02*dir, mid + bh*0.12, w*0.34 ],
      hold:[-w*0.30*dir, mid + bh*0.20, w*0.26 ],   // 꼬리 쪽에 들고
      pet: [-w*0.44*dir, top - bh*0.06, w*0.20 ],
    }[def.slot] || [w*0.30*dir, top-bh*0.14, w*0.28];
    const [ox,oy,size]=P;
    c.save();
    c.translate(F.x+ox, F.y+oy);
    if(def.slot==='pet'){                    // 따라다니는 것은 살랑인다
      c.translate(Math.sin(F.t*0.06)*w*0.05, Math.cos(F.t*0.05)*h*0.05);
    }
    const img=this.get(id);
    if(img){
      const iw=size, ih=size*(img.naturalHeight/Math.max(1,img.naturalWidth));
      c.drawImage(img, -iw/2, -ih/2, iw, ih);
    } else {
      const f=FALLBACK[id]; if(f) f.draw(c, size*0.5);
    }
    c.restore();
  },
};

/* 어셋이 오기 전까지 코드로 그리는 것들 — 여섯 가지면 아이는 충분히 다르다고 느낀다 */
const FALLBACK = {
  'hat-crown': { slot:'head', ko:'왕관', draw(c,r){
    c.fillStyle='#ffd23f'; c.strokeStyle='#12212e'; c.lineWidth=r*0.16;
    c.beginPath();
    c.moveTo(-r,r*0.5); c.lineTo(-r,-r*0.2); c.lineTo(-r*0.5,r*0.15);
    c.lineTo(0,-r*0.6); c.lineTo(r*0.5,r*0.15); c.lineTo(r,-r*0.2); c.lineTo(r,r*0.5);
    c.closePath(); c.fill(); c.stroke(); } },
  'hat-bow': { slot:'head', ko:'리본', draw(c,r){
    c.fillStyle='#ff6bb0'; c.strokeStyle='#12212e'; c.lineWidth=r*0.16;
    for(const s of [-1,1]){
      c.beginPath();
      c.moveTo(0,0); c.quadraticCurveTo(s*r*1.2,-r*0.8, s*r*1.1,r*0.1);
      c.quadraticCurveTo(s*r*0.9,r*0.7, 0,0); c.closePath(); c.fill(); c.stroke(); }
    c.beginPath(); c.arc(0,0,r*0.26,0,TAU); c.fill(); c.stroke(); } },
  'face-glasses': { slot:'face', ko:'안경', draw(c,r){
    c.strokeStyle='#12212e'; c.lineWidth=r*0.18; c.fillStyle='rgba(200,235,255,.5)';
    for(const s of [-1,1]){
      c.beginPath(); c.arc(s*r*0.62,0,r*0.52,0,TAU); c.fill(); c.stroke(); }
    c.beginPath(); c.moveTo(-r*0.12,0); c.lineTo(r*0.12,0); c.stroke(); } },
  'hold-balloon': { slot:'hold', ko:'풍선', draw(c,r){
    c.strokeStyle='#12212e'; c.lineWidth=r*0.10;
    c.beginPath(); c.moveTo(0,r*1.6); c.quadraticCurveTo(r*0.3,r*0.6, 0,r*0.1); c.stroke();
    c.fillStyle='#ff4757';
    c.beginPath(); c.ellipse(0,-r*0.5,r*0.8,r*0.95,0,0,TAU); c.fill(); c.stroke(); } },
  'pet-sparkle': { slot:'pet', ko:'반짝이', draw(c,r){
    c.fillStyle='#ffd23f';
    for(const [dx,dy,k] of [[0,0,1],[r*1.2,r*0.6,0.6],[-r*1.0,r*0.9,0.5]]){
      c.save(); c.translate(dx,dy); c.scale(k,k);
      c.beginPath();
      for(let i=0;i<8;i++){ const a=i/8*TAU, rr=i%2?r*0.3:r*0.85;
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr; i?c.lineTo(px,py):c.moveTo(px,py); }
      c.closePath(); c.fill(); c.restore(); } } },
  'body-scarf': { slot:'body', ko:'목도리', draw(c,r){
    c.fillStyle='#4aa8ff'; c.strokeStyle='#12212e'; c.lineWidth=r*0.14;
    c.beginPath(); c.ellipse(0,0,r*1.05,r*0.42,0,0,TAU); c.fill(); c.stroke();
    c.beginPath(); c.rect(r*0.35,r*0.1,r*0.42,r*1.1); c.fill(); c.stroke(); } },
};
Object.entries(FALLBACK).forEach(([id,f])=>{ if(!ITEM_BY_ID[id]) ITEM_BY_ID[id]={id,ko:f.ko,slot:f.slot}; });

</script>
<script>
/* ===== js/27_grow.js ===== */
/* ══════════════════════════════════════════════════════════════════
   자라는 세계 — Tap Tap Fish(AbyssRium) 의 뼈대를 전시장에 맞게 옮긴 것.

   원작: 탭 → 생명력 → 산호를 키움 → 새 물고기가 나타남 (혼자 하는 방치형)
   여기: 아이들이 **함께** 만질수록 수조가 자란다.

   ⚠ 화폐·상점·방치 보상은 가져오지 않는다. 전시장 아이는 몇 분 놀고 간다 —
     "무엇을 살까"를 고르게 하면 그 몇 분을 메뉴에서 보낸다.
     대신 만지는 행동이 곧바로 세계를 키운다. 다음 아이가 그걸 이어받는다.
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const Grow = {
  /* 단계 — 넘을 때마다 수조가 눈에 띄게 달라진다 */
  STEPS:[
    { at:0,    ko:'작은 웅덩이' },
    { at:40,   ko:'산호가 자랐어요' },
    { at:110,  ko:'수초가 우거졌어요' },
    { at:220,  ko:'빛이 들어왔어요' },
    { at:380,  ko:'친구들이 모여요' },
    { at:600,  ko:'큰 바다가 됐어요' },
  ],
  /* 무엇을 하면 얼마나 자라나 — 만지는 행동이 곧 성장이다 */
  GAIN:{ touch:1, feed:3, chest:5, draw:12, herd:8 },

  vit(){ return (Save.data && Save.data.vit) || 0; },
  level(){
    const v=this.vit(); let lv=0;
    for(let i=0;i<this.STEPS.length;i++) if(v>=this.STEPS[i].at) lv=i;
    return lv;
  },
  next(){ return this.STEPS[this.level()+1] || null; },
  /* 다음 단계까지 얼마나 왔나 (0~1) */
  progress(){
    const n=this.next(); if(!n) return 1;
    const cur=this.STEPS[this.level()].at;
    return Math.max(0, Math.min(1, (this.vit()-cur)/(n.at-cur)));
  },

  add(kind, x, y){
    const g=this.GAIN[kind]||1;
    const before=this.level();
    if(!Save.data.vit) Save.data.vit=0;
    Save.data.vit += g;
    /* 만진 자리에서 생명력이 피어오른다 — 무엇 때문에 자랐는지 보여야 한다 */
    if(x!==undefined && typeof FX!=='undefined') FX.sparkle(x, y, Math.min(6, g));
    const after=this.level();
    if(after>before){
      const st=this.STEPS[after];
      Game.say(st.ko);
      if(typeof FX!=='undefined') FX.confetti(VW/2, VH*0.42);
      if(typeof Sfx!=='undefined') Sfx.join();
      this.flash=90;
      /* 세계를 다시 지어 늘어난 산호·수초가 실제로 보이게 한다.
         ⚠ 아이 그림은 그대로 둔다 — 다시 짓는 건 배경뿐이다. */
      try{
        /* 지금 보고 있는 세계를 다시 짓는다 — 바다만 짓다가 정글에서는
           단계가 올라도 아무 일도 안 일어났다. */
        const W = (typeof Game!=='undefined') ? Game.W : null;
        if(W && W.init) W.init();
      }catch(_){}
    }
    /* 저장은 가끔만 — 탭마다 쓰면 11MB 를 매번 직렬화한다 */
    if((Save.data.vit % 10)===0){ try{ Save.write(); }catch(_){} }
  },

  /* 단계에 따라 세계가 달라진다 — World 가 물어본다 */
  coralBoost(){ return [0, 1, 1, 2, 2, 3][this.level()] || 0; },
  kelpBoost(){  return [0, 0, 1, 2, 3, 4][this.level()] || 0; },
  rayBoost(){   return [0, 0, 0, 1, 1, 2][this.level()] || 0; },
  chestFaster(){ return this.level()>=4; },

  flash:0,
  draw(c){
    if(this.flash>0) this.flash--;
    const lv=this.level(), st=this.STEPS[lv], n=this.next();
    /* ⚠ 연결 상태 표시(오른쪽 위 y=15)와 겹쳐 글자 두 줄이 포개져 있었다.
       큰 화면에서는 멀리서 보는 글자라 더 눈에 띈다. 한 줄 내려 비킨다. */
    const x=VW-232, y=48, w=200;
    c.save();
    /* 단계가 오른 직후엔 잠깐 빛난다 */
    if(this.flash>0){ c.shadowColor=PAL.gold; c.shadowBlur=18*(this.flash/90); }
    c.font='600 17px Galmuri11, sans-serif'; c.textAlign='right';
    c.fillStyle='rgba(255,255,255,.82)';
    c.fillText(st.ko, VW-28, y+4);
    c.restore();
    if(!n) return;
    c.fillStyle='rgba(255,255,255,.14)'; UI.round(c, x, y+14, w, 8, 4); c.fill();
    c.fillStyle=PAL.gold;
    UI.round(c, x, y+14, Math.max(3, w*this.progress()), 8, 4); c.fill();
  },
};

</script>
<script>
/* ===== js/30_creature.js ===== */
/* ══════════════════════════════════════════════════════════════════
   생물 — 아이가 칠한 그림 한 장이 살아 움직인다.

   ⚠ 움직임이 전부 같으면 40종을 만들어도 한 종처럼 보인다.
     그래서 **9가지 움직이는 방식**을 따로 만들었다.
     swim 헤엄 · undulate 구불 · pulse 맥동 · flap 날갯짓 · glide 활공
     scuttle 옆걸음 · jet 분사 · crawl 기어감 · bob 까딱 · seahorse 곧추서기
   ⚠ 텍스처는 180x120 으로 줄여서 보관한다(실측: 6.5배 빠르고 메모리 1/4).
   ══════════════════════════════════════════════════════════════════ */
'use strict';

const TEX_W=180, TEX_H=120;

/* ── 몸 위치 자동 측정 ──────────────────────────────────
   ⚠ 도안마다 몸이 텍스처 한가운데에 있지 않다. 발주서에 중심선 y=240 을
     못박았지만 종에 따라 40px 이상 어긋나 온다(실측: snail 282).
     매번 반려하는 대신 **코드가 실제 몸 위치를 재서 맞춘다.**
     40종이 더 올 것이고, 어셋을 사람이 완벽히 맞추길 기대하면 안 된다. */
const BodyFit = {
  cache:new WeakMap(),
  of(tex){
    let v=this.cache.get(tex); if(v) return v;
    try{
      const c=tex.getContext ? tex : null;
      const cv=document.createElement('canvas'); cv.width=TEX_W; cv.height=TEX_H;
      const x=cv.getContext('2d'); x.drawImage(tex,0,0);
      const d=x.getImageData(0,0,TEX_W,TEX_H).data;
      let y0=TEX_H, y1=-1;
      for(let y=0;y<TEX_H;y++){
        for(let px=0;px<TEX_W;px+=2){
          if(d[((y*TEX_W+px)*4)+3]>40){ if(y<y0)y0=y; if(y>y1)y1=y; break; }
        }
      }
      if(y1<0){ y0=0; y1=TEX_H-1; }
      v={ top:y0, bot:y1, mid:(y0+y1)/2,
          /* 텍스처 중심(60)에서 몸 중심이 얼마나 벗어났나 */
          midOff:(y0+y1)/2 - TEX_H/2,
          botOff:y1 - TEX_H/2 };
    }catch(e){ v={top:0,bot:TEX_H-1,mid:TEX_H/2,midOff:0,botOff:TEX_H/2}; }
    this.cache.set(tex,v); return v;
  }
};


/* ══ 만지면 반응한다 ══════════════════════════════════
   ⚠ 예전엔 탭하면 곧장 확대 화면으로 넘어갔다. 그건 '반응'이 아니라
     '화면 전환'이라, 아이는 수조를 만졌다는 느낌을 못 받는다.
   종마다 다르게 반응해야 아이가 **여러 마리를 눌러 본다** —
     복어는 부풀고, 문어는 먹물을 뿜고, 게는 집게를 흔든다.
   그게 이 화면을 수족관으로 만든다. */
const SEA_REACT = {
  pufferfish:'puff',
  octopus:'ink', squid:'ink', nautilus:'ink',
  jellyfish:'glow', anglerfish:'glow', seadragon:'glow', lionfish:'glow',
  crab:'pinch', lobster:'pinch', shrimp:'pinch',
  turtle:'hide', snail:'hide', starfish:'hide', flounder:'hide',
  dolphin:'spin', orca:'spin', seal:'spin', otter:'spin', penguin:'spin',
  shark:'dash', swordfish:'dash', tuna:'dash', hammerhead:'dash', manta:'dash',
  whale:'blow', narwhal:'blow',
  seahorse:'curl', eel:'curl', snake:'curl', coelacanth:'curl',
};
const REACT_LEN = { puff:52, ink:46, glow:56, pinch:44, hide:50,
                    spin:46, dash:40, blow:64, curl:48, wiggle:38 };

class Creature {
  /* tex: 색칠 완료된 캔버스(또는 이미지) · spId: 종 · name: 아이 이름 */
  constructor(tex, spId, name, opt){
    opt=opt||{};
    this.tex=tex; this.spId=spId; this.name=name||'';
    const sp=SP_BY_ID[spId]||SPECIES[0];
    this.sp=sp; this.motion=sp.motion;
    this.zone=opt.zone!==undefined?opt.zone:pick(sp.zone);
    this.x=opt.x!==undefined?opt.x:rnd()*VW;
    this.y=opt.y!==undefined?opt.y:World.zoneY(this.zone)+rnd()*80-40;
    this.dir=rnd()<0.5?-1:1;
    /* ⚠ 처음엔 0.30~0.52 로 뒀는데 화면에서 54~94px 이라 아이 그림이 안 보였다.
       이 작품의 주인공은 아이가 칠한 그림이다. 배경보다 커야 한다. */
    this.baseS=(0.62+rnd()*0.40)*(sp.size||1);
    this.s=this.baseS;
    this.ph=rnd()*TAU;
    this.spd=(0.5+rnd()*0.7)*(1.25-(sp.size||1)*0.25);
    this.t=rnd()*300;
    this.vy=0; this.state='idle'; this.stateT=0;
    this.reactT=0; this.reactKind=null; this.fedCd=0;
    /* 태어난 때 — 시간이 지나면 조금씩 자란다. 다음 날 오면 더 커져 있다.
       ⚠ 무한히 크면 화면을 잡아먹는다. 이틀이면 다 자란다(1.0 → 1.35). */
    this.born = opt.born || Date.now();
    this.item = opt.item || null;   // 보물상자에서 받은 꾸미기
    this.mine=!!opt.mine;
    this.joinT=opt.join?70:0;      // 합류 연출
    this.scared=0; this.target=null;
    this.wob=rnd()*TAU;
  }
  /* 만졌다 — 종에 맞는 반응을 시작한다 */
  react(){
    const kind = SEA_REACT[this.spId] || 'wiggle';
    this.reactKind = kind;
    this.reactT = this.reactMax = REACT_LEN[kind] || 40;
    const x=this.x, y=this.y;
    if(kind==='ink')       FX.ink(x, y, this.dir);
    else if(kind==='glow') FX.glow(x, y, '#a8f2ff');
    else if(kind==='blow') FX.bubbles(x, y-this.h*0.34, 14);
    else if(kind==='puff') FX.ring(x, y);
    else if(kind==='dash') FX.sparkle(x, y, 10);
    else                   FX.heart(x, y-this.h*0.3);
    if(typeof Sfx!=='undefined' && Sfx.creature) Sfx.creature(kind);
    return kind;
  }
  get w(){ return TEX_W*this.s; }
  get h(){ return TEX_H*this.s; }

  update(dt, world){
    /* 효과 시간 — 다 되면 원래대로 돌아간다 */
    if(this.fx){ if(--this.fx.t<=0) this.fx=null; }
    this.t+=dt*60;
    /* ⚠ 서로를 전혀 의식하지 않으면 '어항 스크린세이버'다.
       같은 종끼리 느슨하게 모이고, 겹치면 살짝 비킨다.
       ⚠ 전부와 비교하면 O(n²) 이다 — 300마리면 45,000번.
       매 프레임이 아니라 6프레임에 한 번, 이웃 몇 마리만 본다. */
    if(world.flock && (Game.t + this.ph*97|0) % 6 === 0) this.flock(world);
    if(this.joinT>0) this.joinT--;
    if(this.scared>0) this.scared--;
    if(this.fedCd>0) this.fedCd--;
    if(this.reactT>0) this.reactT--;

    let sp=this.spd*(this.scared>0?3.2:1);
    if(this.fx && this.fx.t>0){
      if(this.fx.kind==='fast') sp*=2.6;
      else if(this.fx.kind==='slow') sp*=0.32;
    }
    /* 내 것이면 부르는 자리로 모여든다 — 이게 '나를 알아본다'의 정체다 */
    if(this.mine && world.callAt && this.scared<=0){
      const cx=world.callAt.x, cy=world.callAt.y;
      const d=dist(this.x,this.y,cx,cy);
      if(d>70){
        const a=Math.atan2(cy-this.y, cx-this.x);
        this.x+=Math.cos(a)*sp*3.0; this.y+=Math.sin(a)*sp*2.2;
        this.dir=Math.cos(a)>0?1:-1;
        if(Game.t%9===0) Game.fx.sparkle(this.x,this.y,1);
        return;
      }
    }
    /* 먹이가 있으면 몰려간다 */
    const food=world.nearestFood(this.x,this.y);
    if(food && this.scared<=0){
      const d=dist(this.x,this.y,food.x,food.y);
      /* ⚠ 420 은 화면의 1/3 이라 멀리 있는 물고기는 아예 반응하지 않았다.
         먹이는 다같이 몰려드는 맛이다 — 화면 전체가 반응하게 넓힌다. */
      if(d<820){
        const a=Math.atan2(food.y-this.y, food.x-this.x);
        this.x+=Math.cos(a)*sp*2.1; this.y+=Math.sin(a)*sp*2.1;
        this.dir=Math.cos(a)>0?1:-1;
        /* ⚠ 쿨다운이 없어 한 마리가 매 프레임 쪼았다 — 3번 쪼기로 바꿔도
           16알이 1초에 사라졌다(실측). 한 입 먹었으면 잠시 물러난다. */
        if(d<26 && !(this.fedCd>0)){ world.eatFood(food, this); this.fedCd=90; }
        this.wob+=0.12;
        /* ⚠ 먹이를 쫓을 때 곧장 return 해서 **밀어내기를 건너뛰었다**.
           그래서 22마리가 한 점에 겹쳐 아이 그림이 서로를 가렸다.
           몰려드는 건 좋지만 포개지면 누구 그림인지 알 수 없다. */
        this.spread(world);
        return;
      }
    }
    /* 손가락을 가만히 대고 있으면 궁금해서 다가온다.
       ⚠ 빈 곳을 톡 치면 흩어지는데(scare), 그것만 있으면 아이는 수조를
         '건드리면 도망가는 것'으로만 배운다. 가만히 대고 기다리면
         모여든다는 걸 알면 아이가 화면 앞에 오래 머문다. */
    /* ⚠ 처음엔 끌림만 더하고 아래 motion 을 그대로 뒀더니 생물이 손가락을
       **지나쳐 갔다**(실측: 6초 뒤 오히려 멀어짐). 먹이와 같은 구조로,
       다가오는 동안에는 제 갈 길을 접는다. 가까우면 주위를 맴돈다. */
    if(world.touchAt && !(this.scared>0) && !(this.reactT>0)){
      const T=world.touchAt;
      const d=dist(this.x,this.y,T.x,T.y);
      /* 휘저으면 물살에 밀린다 — 손 뒤로 물이 흐른다 */
      if(T.swirl && d<300){
        const k=(1-d/300)*0.5;
        this.x += (T.vx||0)*k; this.y += (T.vy||0)*k*0.7;
        this.wob += 0.14;
        if(Math.abs(T.vx||0)>2) this.dir = (T.vx>0)?1:-1;
        return;
      }
      const eager=Math.min(1,(T.hold-20)/70);
      if(eager>0 && !T.swirl && d<780){
        const a=Math.atan2(T.y-this.y, T.x-this.x);
        if(d>150){                                  // 다가온다
          this.x+=Math.cos(a)*sp*1.5*eager;
          this.y+=Math.sin(a)*sp*1.0*eager;
          this.dir=Math.cos(a)>0?1:-1;
        } else {                                     // 손끝을 맴돈다
          const orb=a+Math.PI/2;
          this.x+=Math.cos(orb)*sp*0.9;
          this.y+=Math.sin(orb)*sp*0.5;
          this.dir=Math.cos(orb)>0?1:-1;
        }
        this.wob+=0.09;
        return;
      }
    }
    /* 놀랐으면 도망 */
    if(this.scared>0 && world.scareAt){
      const a=Math.atan2(this.y-world.scareAt.y, this.x-world.scareAt.x);
      this.x+=Math.cos(a)*sp*2.4; this.y+=Math.sin(a)*sp*1.4;
      this.dir=Math.cos(a)>0?1:-1;
    } else {
      this[this.motion] ? this[this.motion](sp) : this.swim(sp);
    }
    /* 벽 */
    if(this.x<-this.w) { this.x=VW+this.w; }
    if(this.x>VW+this.w){ this.x=-this.w; }
    const band=World.zoneBand(this.zone);
    if(this.y<band[0]){ this.y=band[0]; this.vy=Math.abs(this.vy); }
    if(this.y>band[1]){ this.y=band[1]; this.vy=-Math.abs(this.vy); }
  }

  /* 밀어내기만 — 먹이를 쫓는 중에도 서로 포개지지 않게 */
  spread(world){
    const near=world.neighbors(this.x, this.y, this);
    let px=0, py=0;
    for(const o of near){
      const dx=o.x-this.x, dy=o.y-this.y, d2=dx*dx+dy*dy;
      const sepR=Math.min(150,(this.w+o.w)*0.22);
      if(d2<sepR*sepR && d2>1){
        const d=Math.sqrt(d2);
        px -= dx/d*(sepR-d)/sepR; py -= dy/d*(sepR-d)/sepR;
      }
    }
    this.x += px*1.1; this.y += py*0.9;
  }

  /* 무리 짓기 — 가벼운 근사. 격자에서 이웃만 꺼낸다 */
  /* 꾸미기를 어디에 얹을지 — 그린 몸의 화면상 위치·크기.
     ⚠ Items 가 '텍스처 한가운데가 곧 (x,y)' 라고 가정하고 있었다. 물고기는 맞지만
       Walker(정글)는 **발이 기준점**이라 몸이 y 위로 올라가 있다 —
       모자가 배 한가운데에 붙었다(실측: 그려진 범위 y 192~366, 기준점 360).
       각자가 자기 틀을 알려 준다. */
  itemFrame(){
    const g=(typeof growth==='function')?growth(this.born):1;
    return { x:this.x, y:this.y, w:this.w*g, h:this.h*g, dir:this.dir, tex:this.tex, t:this.t };
  }
  flock(world){
    const near=world.neighbors(this.x, this.y, this);
    if(!near.length) return;
    let cx=0, cy=0, n=0, px=0, py=0;
    for(const o of near){
      const dx=o.x-this.x, dy=o.y-this.y;
      const d2=dx*dx+dy*dy;
      if(d2 > 190*190) continue;
      if(o.spId===this.spId){ cx+=o.x; cy+=o.y; n++; }   // 같은 종에 끌린다
      /* ⚠ 46px 은 몸 폭(270~400px)의 1/6 이라 사실상 겹쳐도 안 비켰다.
         몸 크기에 맞춰 벌린다 — 상한을 둬서 무리가 흩어지지는 않게. */
      const sepR=Math.min(150,(this.w+o.w)*0.22);
      if(d2 < sepR*sepR && d2>1){
        const d=Math.sqrt(d2);
        px -= dx/d*(sepR-d)/sepR; py -= dy/d*(sepR-d)/sepR;
      }
    }
    if(n){ this.x += ((cx/n)-this.x)*0.004; this.y += ((cy/n)-this.y)*0.004; }
    this.x += px*0.9; this.y += py*0.6;
  }

  /* ── 9가지 움직임 ─────────────────────────────────── */
  swim(sp){                       // 물고기 — 앞으로 나아가며 몸을 흔든다
    this.x += sp*this.dir;
    this.y += Math.sin(this.t*0.018+this.ph)*0.5;
    if(rnd()<0.0016) this.dir*=-1;
  }
  undulate(sp){                   // 뱀장어 — 온몸이 크게 구불거린다
    this.x += sp*0.85*this.dir;
    this.y += Math.sin(this.t*0.03+this.ph)*1.1;
    if(rnd()<0.0012) this.dir*=-1;
  }
  pulse(sp){                      // 해파리 — 오므렸다 펴며 떴다 가라앉는다
    const k=(this.t*0.022+this.ph)%TAU;
    const push = k<1.1 ? 1.6 : -0.14;
    this.vy = lerp(this.vy, -push*sp*1.3, 0.08);
    this.y += this.vy;
    this.x += sp*0.28*this.dir + Math.sin(this.t*0.008)*0.2;
    if(rnd()<0.0009) this.dir*=-1;
  }
  flap(sp){                       // 가오리 — 날개를 젓는다
    this.x += sp*0.9*this.dir;
    this.y += Math.sin(this.t*0.02+this.ph)*0.9;
    if(rnd()<0.0011) this.dir*=-1;
  }
  glide(sp){                      // 거북·물범 — 느리고 미끄러진다
    this.x += sp*0.6*this.dir;
    this.y += Math.sin(this.t*0.01+this.ph)*0.35;
    if(rnd()<0.0008) this.dir*=-1;
  }
  scuttle(sp){                    // 게 — 옆으로 종종
    this.x += sp*1.1*this.dir;
    this.y = World.zoneBand(this.zone)[1]-10 + Math.abs(Math.sin(this.t*0.16))*5;
    if(rnd()<0.006) this.dir*=-1;
  }
  jet(sp){                        // 문어·오징어 — 확 쏘고 미끄러진다
    this.stateT++;
    if(this.stateT>90){ this.stateT=0; this.burst=26; if(rnd()<0.4) this.dir*=-1; }
    if(this.burst>0){ this.burst--; this.x += sp*2.6*this.dir; }
    else this.x += sp*0.22*this.dir;
    this.y += Math.sin(this.t*0.012+this.ph)*0.4;
  }
  crawl(sp){                      // 불가사리·달팽이 — 바닥을 아주 느리게
    this.x += sp*0.22*this.dir;
    this.y = World.zoneBand(this.zone)[1]-8;
    if(rnd()<0.003) this.dir*=-1;
  }
  bob(sp){                        // 복어·쏠배감펭 — 제자리에서 까딱
    this.x += sp*0.4*this.dir;
    this.y += Math.sin(this.t*0.035+this.ph)*0.9;
    if(rnd()<0.002) this.dir*=-1;
  }
  dart(sp){                       // 새우·펭귄 — 짧게 툭툭
    this.stateT++;
    if(this.stateT>rndi(40,90)){ this.stateT=0; this.burst=14; if(rnd()<0.3) this.dir*=-1; }
    if(this.burst>0){ this.burst--; this.x += sp*2.2*this.dir; this.y += Math.sin(this.t*0.3)*0.8; }
  }
  seahorse(sp){                   // 해마 — 곧추서서 위아래로
    this.x += sp*0.3*this.dir;
    this.y += Math.sin(this.t*0.02+this.ph)*0.8;
    if(rnd()<0.0015) this.dir*=-1;
  }

  /* ── 그리기 ────────────────────────────────────────
     세로 띠로 잘라 띠마다 밀어 그린다. 움직임마다 미는 방식이 다르다. */
  draw(c, world){
    const tex=this.tex; if(!tex) return;
    /* 화면 밖은 그리지 않는다.
       ⚠ 한 마리에 8~44번씩 잘라 그린다(LOD). 하루가 쌓여 200마리가 되면
         프레임당 4천 번이 넘고, 그중 일부는 **화면 밖에서** 그려지고 있었다.
         이름표·표시까지 통째로 건너뛴다. (실측 배경: 200마리 draw 8.2ms) */
    const half=this.w*0.75+60;
    if(this.x+half < 0 || this.x-half > VW) return;
    const onW=this.w;
    /* LOD — 작게 보이면 띠를 줄인다(실측 2.3배) */
    /* LOD — 띠 수는 크기가 아니라 **움직임**이 정한다.
       실측(같은 그림을 띠 수만 바꿔 그려 픽셀 비교, 폭 130~180):
         undulate 28띠 16.2% · 16띠 25.6%  ← 파도가 많아 띠가 진짜 필요하다
         bob      28띠  4.2% · 16띠  6.1%
         swim·glide·jet·flap·pulse·seahorse — 10띠에서도 3% 이하
       크기만 보고 28~44 를 주고 있었다. 200마리면 프레임당 5,372번을 그린다.
       움직임별 상한을 두면 보이는 건 그대로고 그리는 횟수만 준다. */
    const SLCAP = { undulate:44, bob:28, swim:20, dart:20, jet:20,
                    glide:16, flap:16, seahorse:16, pulse:12, crawl:12, scuttle:12 };
    const cap = SLCAP[this.motion] || 20;
    const SL = (typeof window!=='undefined' && window.__SL) ? window.__SL
             : Math.max(6, Math.min(cap, onW<70?8 : onW<130?16 : onW<220?28 : 44));
    let s=this.s*growth(this.born);
    let alpha=1, extraY=0, sx=1, sy=1, rot=0;
    /* 보물상자의 10초짜리 효과 — 몸이 잠깐 변한다 */
    let glowK=0, hueShift=0;
    if(this.fx && this.fx.t>0){
      const k=this.fx.t/this.fx.max;               // 1 → 0
      const ease=Math.min(1, k*6) * Math.min(1, (1-k)*6 + 0.35);  // 시작·끝을 부드럽게
      switch(this.fx.kind){
        case 'grow':   s*= 1 + 1.15*ease; break;
        case 'shrink': s*= 1 - 0.55*ease; break;
        case 'ghost':  alpha*= 1 - 0.62*ease; break;
        case 'glow':   glowK = ease; break;
        case 'rainbow':hueShift = (this.t*4)%360; break;
      }
    }

    if(this.joinT>0){               // 합류 연출 — 커지며 나타난다
      const k=1-this.joinT/70;
      s*=0.4+0.6*k; alpha=k;
    }
    /* 만졌을 때의 몸짓 — 기존 움직임 위에 얹는다 */
    if(this.reactT>0){
      const k=1-this.reactT/this.reactMax;      // 0 → 1
      const bump=Math.sin(k*Math.PI);           // 가운데서 최대
      switch(this.reactKind){
        case 'puff':  sx*=1+bump*0.55; sy*=1+bump*0.62; break;
        case 'hide':  sx*=1-bump*0.34; sy*=1-bump*0.34; break;
        case 'spin':  rot+=k*TAU; break;
        case 'dash':  extraY-=bump*6; s*=1+bump*0.10; break;
        case 'pinch': rot+=Math.sin(k*Math.PI*7)*0.30;                 // 집게 흔들기
                      sx*=1+Math.sin(k*Math.PI*7)*0.14; break;
        case 'curl':  rot+=Math.sin(k*Math.PI*3)*0.30; sx*=1-bump*0.12; break;
        case 'glow':  sx*=1+bump*0.12; sy*=1+bump*0.12; break;
        case 'blow':  extraY-=bump*18; sy*=1+bump*0.10; break;          // 물 뿜으며 솟구침
        /* ── 새 모드(공룡·로봇·곤충) ── 부위가 하는 일에서 나온 몸짓 */
        case 'stomp':   extraY+=bump*10; sy*=1-bump*0.10; sx*=1+bump*0.08; break;  // 쿵
        case 'flutter': sy*=1+Math.sin(k*Math.PI*8)*0.16; extraY-=bump*10; break;  // 파닥
        case 'splash':  rot+=Math.sin(k*Math.PI*4)*0.16; extraY-=bump*8; break;
        case 'wave':    rot+=Math.sin(k*Math.PI*5)*0.22; break;                    // 팔 흔들기
        case 'roll':    rot+=k*TAU; extraY-=bump*6; break;                         // 굴러간다
        case 'whirl':   rot+=k*TAU*2; break;                                       // 팽이처럼
        case 'snap':    sx*=1+Math.sin(k*Math.PI*7)*0.16; break;
        case 'chomp':   sy*=1+Math.sin(k*Math.PI*6)*0.20; sx*=1-Math.sin(k*Math.PI*6)*0.10; break;
        case 'wiggle':  rot+=Math.sin(k*Math.PI*6)*0.14; break;
        case 'ink':   extraY-=bump*4; sx*=1-bump*0.10; break;
        default:      rot+=Math.sin(k*Math.PI*5)*0.26; extraY-=bump*12;  // 꼬리 흔들기
                      sx*=1+bump*0.10;
      }
    }
    const m=this.motion;
    if(m==='pulse'){                // 해파리 — 종이 오므라든다
      const k=Math.sin(this.t*0.022+this.ph);
      sx=1+k*0.16; sy=1-k*0.20;
    } else if(m==='seahorse'){ rot=-Math.PI/2*0.86; }
      else if(m==='crawl' && this.sp.shape==='star'){ rot=this.t*0.004; }

    /* 몸 중심을 this.y 에 맞춘다. 바닥에 붙는 종은 아래끝을 바닥에 맞춘다. */
    const fit=BodyFit.of(tex);
    /* 바닥을 딛는 것들 — 몸 한가운데가 아니라 **발끝**이 y 에 오게 맞춘다.
       ⚠ 안 그러면 공룡이 땅 위에 떠 있다(CK 지적: 티라노가 뜬다). */
    const floorish = (m==='crawl'||m==='scuttle'||m==='stride');
    const adj = floorish ? -fit.botOff*s : -fit.midOff*s;
    c.save();
    c.globalAlpha=alpha;
    if(hueShift) c.filter='hue-rotate('+hueShift+'deg) saturate(1.35)';
    if(glowK){ c.shadowColor='rgba(255,224,138,'+(0.85*glowK)+')'; c.shadowBlur=26*glowK; }
    c.translate(this.x, this.y+extraY+adj);
    if(this.dir<0) c.scale(-1,1);
    if(rot) c.rotate(rot);
    c.scale(s*sx, s*sy);

    const sw=TEX_W/SL;
    /* 걷기 — ⚠ 위의 세로 띠 방식은 띠를 **y 로만** 밀어서 다리가 앞뒤로
       움직이지 못한다(실측: 통짜 crawl 은 폭 변화 0, 높이 2~3px).
       걷는 것은 가로로 잘라 **아래쪽(다리)을 앞뒤로** 민다.
       앞다리와 뒷다리를 반대로 밀면 교대로 내딛는 것처럼 보인다. */
    if(m==='stride'){
      const ROWS=16, rh=TEX_H/ROWS;
      const ph=this.t*0.15+this.ph;
      for(let r=0;r<ROWS;r++){
        const v=(r+0.5)/ROWS;                    // 0=등 1=발
        /* ⚠ 아래 절반을 통째로 밀었더니 몸통까지 흔들려 **헤엄치는 것처럼** 보였다.
           걷는 몸은 등이 거의 안 흔들린다 — 아래 30% 만, 발끝으로 갈수록 세게. */
        const k=Math.max(0,(v-0.70)/0.30);
        if(k<=0){
          c.drawImage(tex, 0,r*rh,TEX_W,rh+1, -TEX_W/2, r*rh-TEX_H/2, TEX_W, rh+1);
          continue;
        }
        const amp=13*k*k;
        /* 몸을 앞뒤로 갈라 반대 위상 — 다리가 교대한다 */
        const half=TEX_W/2;
        c.drawImage(tex, 0,r*rh,half,rh+1,
                    -TEX_W/2 + Math.sin(ph)*amp,        r*rh-TEX_H/2, half, rh+1);
        c.drawImage(tex, half,r*rh,half,rh+1,
                    -TEX_W/2+half - Math.sin(ph)*amp,   r*rh-TEX_H/2, half, rh+1);
      }
    }
    else for(let i=0;i<SL;i++){
      const u=i/SL;                 // 0=꼬리 1=머리
      let off=0, vscale=1;
      switch(m){
        case 'swim':     off=Math.sin(this.t*0.11+this.ph-u*3.0)*11*Math.pow(1-u,1.7); break;
        case 'undulate': off=Math.sin(this.t*0.10+this.ph-u*5.4)*17*(0.35+0.65*(1-u)); break;
        case 'flap':     off=0; vscale=1+Math.sin(this.t*0.075+this.ph)*0.30*Math.pow(Math.abs(u-0.5)*2,1.5); break;
        case 'glide':    off=Math.sin(this.t*0.05+this.ph-u*2.0)*5*Math.pow(1-u,1.6); break;
        case 'jet':      off=Math.sin(this.t*0.09+this.ph-u*2.4)*(this.burst>0?15:5)*Math.pow(1-u,1.4); break;
        case 'scuttle':  off=Math.sin(this.t*0.30+u*7)*2.4; break;
        case 'dart':     off=Math.sin(this.t*0.24+this.ph-u*3)*(this.burst>0?12:3)*Math.pow(1-u,1.5); break;
        case 'bob':      off=Math.sin(this.t*0.07+this.ph-u*1.6)*5; break;
        case 'crawl':    off=Math.sin(this.t*0.05+u*5)*2; break;
        case 'pulse':    off=0; break;
        case 'seahorse': off=Math.sin(this.t*0.08+this.ph-u*4)*7*Math.pow(1-u,2); break;
      }
      c.save();
      if(vscale!==1) c.scale(1,vscale);
      c.drawImage(tex, i*sw,0,sw+1,TEX_H,
                  i*sw-TEX_W/2, off/ (vscale||1) - TEX_H/2, sw+1, TEX_H);
      c.restore();
    }
    c.restore();
    c.globalAlpha=1;

    /* 내 것 표시 */
    if(this.mine && world && world.findT>0){
      c.save();
      const a=Math.min(1, world.findT/40);
      c.globalAlpha=a;
      /* ⚠ 화살표 어셋이 있으면 **원을 건너뛰었다.** 수십 마리 중에서
         46px 화살표 하나로는 못 찾는다. 원은 늘 그리고 화살표는 얹는다. */
      c.strokeStyle=PAL.gold; c.lineWidth=5;
      c.beginPath(); c.arc(this.x, this.y, onW*0.72+10+Math.sin(this.t*0.1)*5, 0, TAU); c.stroke();
      const arrowSz=Math.max(64, onW*0.55);
      if(!(typeof FXA!=='undefined' &&
           FXA.draw(c,'fx-arrow-point', this.x, this.y-onW*0.72-arrowSz*0.55, arrowSz, 0))){
        c.fillStyle=PAL.gold;
        c.beginPath(); c.moveTo(this.x, this.y-onW*0.72-16);
        c.lineTo(this.x-10, this.y-onW*0.72-34); c.lineTo(this.x+10, this.y-onW*0.72-34);
        c.closePath(); c.fill();
      } else {
        c.strokeStyle=PAL.gold; c.lineWidth=3; c.globalAlpha=a*0.7;
        c.beginPath(); c.arc(this.x, this.y, onW*0.72+8+Math.sin(this.t*0.1)*4, 0, TAU); c.stroke();
      }
      c.restore();
    }
    /* 이름표 — 가까이 있는 것만 */
    if(this.name && onW>110){
      c.save();
      c.globalAlpha=0.9;
      c.font='600 15px Galmuri11, sans-serif'; c.textAlign='center';
      const tw=c.measureText(this.name).width+16;
      c.fillStyle='rgba(10,32,54,.62)';
      c.fillRect(this.x-tw/2, this.y+this.h*0.42, tw, 21);
      c.fillStyle=PAL.white;
      c.fillText(this.name, this.x, this.y+this.h*0.42+16);
      c.restore();
    }
  }
}

/* 색칠 결과 → 180x120 텍스처 (합성: 칠한 것 → 마스크로 자르기 → 잉크 덮기) */
/* 백지에 그린 그림을 그대로 텍스처로 만든다.
   ⚠ 도안이 없으니 mask 클리핑도 ink 도 없다 — **아이가 그린 것이 곧 실루엣**이다.
     그린 영역만 잘라내 텍스처에 꽉 채워야 한다. 안 그러면 여백까지 크기로 쳐서
     작게 그린 아이의 그림이 점처럼 보인다. */
/* 태어난 지 얼마나 됐나 → 크기 배수. 이틀에 걸쳐 1.0 → 1.35 로 자란다.
   ⚠ 아이가 다시 왔을 때 '내 물고기가 컸네' 하는 게 목적이다.
     그 이상 키우면 수조가 큰 것들로만 찬다. */
function growth(born){
  if(!born) return 1;
  const days = (Date.now() - born) / 86400000;
  return 1 + Math.min(0.35, Math.max(0, days) * 0.175);
}

function bakeFree(fillCanvas){
  let px;
  try{
    px = fillCanvas.getContext('2d', {willReadFrequently:true})
                   .getImageData(0,0,TW,TH).data;
  }catch(e){ return null; }
  let x0=TW, y0=TH, x1=-1, y1=-1;
  for(let y=0; y<TH; y+=2) for(let x=0; x<TW; x+=2){
    if(px[((y*TW+x)*4)+3] > 30){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(x1 < 0) return null;                      // 아무것도 안 그렸다
  const pad=10;
  x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad);
  x1=Math.min(TW,x1+pad); y1=Math.min(TH,y1+pad);
  const w=x1-x0, h=y1-y0;
  const out=document.createElement('canvas'); out.width=TEX_W; out.height=TEX_H;
  const o=out.getContext('2d');
  o.imageSmoothingEnabled=true; o.imageSmoothingQuality='high';
  const sc=Math.min(TEX_W/w, TEX_H/h)*0.94;    // 비율은 지킨다 — 아이 그림을 늘이지 않는다
  o.drawImage(fillCanvas, x0,y0,w,h,
              (TEX_W-w*sc)/2, (TEX_H-h*sc)/2, w*sc, h*sc);
  out.freeAR = w/h;                            // 형태 → 움직임 고르기에 쓴다
  return out;
}

/* 그린 모양에 어울리는 움직임. 길쭉하면 헤엄치고, 둥글면 둥둥 뜬다. */
function freeMotion(ar){
  if(ar > 1.7) return 'swim';
  if(ar < 0.7) return 'bob';
  return 'glide';
}

function bakeCreature(fillCanvas, spId){
  const t=Templates.get(spId);
  const big=document.createElement('canvas'); big.width=TW; big.height=TH;
  const b=big.getContext('2d');
  b.drawImage(fillCanvas,0,0);
  b.globalCompositeOperation='destination-in';
  b.drawImage(t.mask,0,0);
  b.globalCompositeOperation='source-over';
  b.drawImage(t.ink,0,0);
  const small=document.createElement('canvas'); small.width=TEX_W; small.height=TEX_H;
  const s=small.getContext('2d');
  s.imageSmoothingEnabled=true; s.imageSmoothingQuality='high';
  s.drawImage(big,0,0,TW,TH,0,0,TEX_W,TEX_H);
  return small;
}

const JLayout = {
  data:null, loading:false,
  load(){
    if(this.data||this.loading) return;
    this.loading=true;
    fetch('assets/jungle/_layout.json').then(r=>r.json())
      .then(d=>{ this.data=d; JTemplate.cache={}; })
      .catch(()=>{ this.data={}; });
  },
  of(id){ return this.data && this.data[id]; }
};

/* ── 몸에서 이음 자리를 자동으로 뽑는다 (마스터가 없을 때만) ──
   ⚠ anchor 를 눈대중으로 찍었더니 머리가 몸에서 떨어져 떠 있었다(실측).
     종마다 몸 그림이 다르니 **몸 마스크의 실제 범위**에서 비율로 계산한다.
     12종이 왔고 40종이 더 올 수도 있다 — 손으로 찍을 일이 아니다. */
const BodyBox = {
  cache:{},
  of(id, maskImg){
    if(this.cache[id]) return this.cache[id];
    const c=document.createElement('canvas'); c.width=512; c.height=512;
    const x=c.getContext('2d'); x.drawImage(maskImg,0,0,512,512);
    const d=x.getImageData(0,0,512,512).data;
    let x0=512,y0=512,x1=-1,y1=-1;
    for(let yy=0;yy<512;yy+=2) for(let xx=0;xx<512;xx+=2)
      if(d[((yy*512+xx)*4)+3]>128){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(yy<y0)y0=yy; if(yy>y1)y1=yy; }
