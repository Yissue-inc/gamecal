<!-- ⛔ 예전 요청(family=Galmuri11)은 HTTP 400 이었다 — Google Fonts 에 없는 글꼴.
     글꼴 스타일시트는 여기 두지 않는다 — 부팅·첫 화면 그림을 늦췄다(js/00_rules.js UI_FONT_CSS 주석). 99_main 이 붙인다 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060a;
    font-family:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #stack{position:relative;line-height:0;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  /* ⛔ 폰에서 **연타하면 화면이 커졌다**(CK 2026-09-15 모바일 플레이). iOS 는 `user-scalable=no` 를 무시한다 —
     빠른 두 번 누름이 더블탭 확대로 먹힌다. 요소마다 touch-action 을 못 박고(캔버스는 none), 확대 제스처도 막는다. */
  html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;}
  #bg,#game,#ui,#stack{touch-action:none;}
  #bg{position:absolute;left:0;top:0;z-index:0;image-rendering:auto;}
  #game{position:relative;z-index:1;}
  #ui{position:absolute;left:0;top:0;z-index:2;pointer-events:none;}

  /* ── 화면 조작 패드 ─────────────────────────────────────── */
  /* ⚠ 패드 틀은 화면 바닥 전폭(가로 폰 y 236~390)을 덮는다 — 버튼 사이 빈 가운데가 **아래쪽 목록 줄 탭을 삼켰다**(9/15). 틀은 통과, 버튼만 받는다 */
  #pad{display:none;position:fixed;inset:auto 0 0 0;z-index:5;pointer-events:none;
    padding:0 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    grid-template-columns:auto 1fr auto;gap:10px;align-items:end;justify-content:space-between;}
  .pgroup{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .prow{display:flex;gap:6px;}
  .pbtn{pointer-events:auto;}
  .pbtn.sm{height:44px;min-width:52px;font-size:15px;padding:0 12px;}
  /* ── 방송 중계형 버튼 (2026-09-13 CK 결정) — 유리 패널 · 위 1px 반사광 · 누르면 금색으로 찬다 ──
     ⚠ 크기·위치 규칙(아래 play·가로 폰 미디어 쿼리)은 그대로다 — 여기는 **겉모습만** 바꾼다. */
  .pbtn{display:flex;align-items:center;justify-content:center;
    height:56px;min-width:78px;border-radius:16px;cursor:pointer;padding:0 14px;
    background:linear-gradient(180deg,rgba(38,50,78,.88),rgba(12,17,30,.88));
    border:1px solid rgba(150,180,235,.30);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.38);
    color:#eef3fb;font-family:inherit;font-size:19px;font-weight:700;letter-spacing:.02em;
    transition:transform .06s,background .06s,box-shadow .06s;backdrop-filter:blur(3px);}
  .pbtn.on{background:linear-gradient(180deg,#ffe07a,#f0b429);color:#11151f;border-color:#ffe9a8;
    transform:scale(.94);box-shadow:0 0 0 3px rgba(255,215,94,.28),0 2px 6px rgba(0,0,0,.45);}
  #p-act{color:#ffd75e;border-color:rgba(255,215,94,.55);}
  #p-act.on{color:#11151f;}
  .pbtn.wide{grid-column:span 1;}
  #p-pause{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;
    height:34px;width:46px;min-width:46px;padding:0;font-size:13px;z-index:6;}
  /* ⛔ width:46px 인데 .pbtn 의 min-width:78px 가 이겨 **78px** 로 그려졌다 — 캔버스 오른쪽 위 x 436~475 를 덮어
     감독 화면 머리말 오른쪽('1년차 · 1/24')과 훈련 화면 '직접 지도 0/3' 이 잘렸다(2026-09-13 캡처).
     HUD 쪽 비킴 값(SB.RX 462 · 05_hud 'RX = VW - 30')은 **46px 기준**으로 잰 것이다. */
  /* ⛔ 34px 는 손가락 최소(44px)보다 작다(tools/mobile_audit.mjs 실측 2026-09-13). 그림은 키우지 않는다 —
     키우면 오른쪽 위 HUD 를 더 덮는다(05_hud 'RX = VW - 30' 주석). **누르는 범위만** 투명하게 넓힌다. */
  /* ⚠ absolute 의 기준은 **테두리 안쪽(패딩 상자)** 이다 — -6px 은 테두리 2px 를 빼면 4px 만 넓혀 42px 였다(실측) */
  #p-pause::before{content:'';position:absolute;left:-2px;right:-2px;top:-8px;bottom:-8px;}
  @media (min-height:620px){ .pbtn{height:64px;} .pbtn.sm{height:50px;} }
  /* 경기 중 — 좌·우를 빠르게 번갈아 두드리는 게 이 게임의 조작이다.
     ⚠ 메뉴용 십자 배치 그대로 두면 44px 버튼을 연타하다 ▲▼ 를 잘못 누른다.
        경기 중에는 좌우를 크게 키우고, 위아래를 쓰지 않는 종목에서는 아예 숨긴다. */
  #pad.play .prow .pbtn{height:74px;min-width:96px;font-size:26px;}
  @media (min-height:620px){ #pad.play .prow .pbtn{height:88px;min-width:110px;} }
  #pad.play #p-back{display:none;}
  /* ⛔ **두 손 배치** (CK 피드백 2026-08-31: "모바일에서 하는 게 상당히 불편하다")
     실측(375×812 세로): ◀ 가운데 **67** · ▶ 가운데 **183** — 리듬 버튼 둘이 왼쪽 절반에 몰려
     있었고, 오른손 엄지가 자연히 놓이는 **301** 에는 액션이 있었다.
     초당 4번 좌·우를 번갈아 치는 게임인데 두 버튼이 한 손 거리에 붙어 있으면
     한 엄지로 왕복하거나 두 손을 왼쪽에 모아야 한다 — 그래서 불편했다.
     경기 중에만 ◀ 를 왼쪽 끝, ▶ 를 오른쪽 끝으로 보낸다(엄지가 쉬는 자리).
     ⚠ 메뉴 배치는 건드리지 않는다 — 거기선 십자 배치가 맞다. */
  #pad.play #p-left, #pad.play #p-right{
    position:fixed; bottom:calc(10px + env(safe-area-inset-bottom));
    height:88px; min-width:118px; font-size:28px; z-index:6;}
  #pad.play #p-left{ left:12px; }
  #pad.play #p-right{ right:12px; }
  /* 가운데에는 액션(과 쓰는 종목만 ▲▼) — 양 끝 버튼과 겹치지 않게 폭을 줄인다 */
  #pad.play{ grid-template-columns:1fr; justify-content:center; }
  #pad.play #pad-dir, #pad.play #pad-act{ justify-self:center; }
  #pad.play #pad-act #p-act{ min-width:96px; }
  #pad.play #p-up, #pad.play #p-down{ min-width:56px; }
  @media (max-width:400px){
    #pad.play #p-left, #pad.play #p-right{ min-width:104px; }
    #pad.play #pad-act #p-act{ min-width:84px; }
  }
  #pad.play.noud #p-up, #pad.play.noud #p-down{display:none;}
  /* 가로로 눕힌 폰 — 화면이 낮으면 버튼이 경기 화면을 덮는다.
     ⚠ 캔버스를 줄이면 게임이 작아지므로, 대신 버튼을 **반투명으로 모서리에** 붙인다.
        경기 중에만 그렇게 하고, 메뉴에서는 원래대로 또렷하게 둔다. */
  @media (max-height:460px) and (orientation:landscape){
    #pad.play{padding-bottom:calc(4px + env(safe-area-inset-bottom));}
    #pad.play .pbtn{background:linear-gradient(180deg,rgba(38,50,78,.46),rgba(12,17,30,.46));border-color:rgba(150,180,235,.34);}
    #pad.play .pbtn.on{background:linear-gradient(180deg,rgba(255,224,122,.9),rgba(240,180,41,.9));border-color:#ffe9a8;}
    #pad.play #p-act{border-color:rgba(255,215,94,.5);}
    #pad.play .prow .pbtn{height:64px;min-width:76px;}
    /* 844×390 에서 캔버스 옆 여백이 122px 인데 ◀▶(12+118px)가 **8px 캔버스를 덮었다**(출발선 선수 발) — 폭만 줄인다 */
    #pad.play #p-left, #pad.play #p-right{ min-width:104px; }
    #pad.play .pgroup{gap:3px;}
    /* ⛔ 가운데 무리가 **세로 3층**이었다(▲ / ▼ / 액션) — 812×375 가로 폰에서
       화면 높이의 **40%** 를 덮어 결과 문구가 'retry ▼use: event list' 로 읽혔다
       (2026-08-31 실측 캡처). ▲▼ 를 쓰는 종목(중거리·사이클·승마 등)에서만 나는데,
       그건 화면을 켜 봐야 보인다 — 코드로는 '버튼이 있다'까지만 보인다.
       낮은 화면에서는 **한 층으로 눕힌다**: [▲ ▼] [액션]. */
    #pad.play{ grid-auto-flow:column; grid-template-columns:auto auto;
               justify-content:center; align-items:end; gap:10px; }
    #pad.play #pad-dir{ flex-direction:row; align-items:end; }
    /* ⛔⛔ 여기 `#pad.play #pad-dir .prow{display:none}` 가 있었다('좌·우는 이미 양 끝으로 빠져 있다').
       그런데 ◀▶ 는 **그 .prow 의 자식**이다 — position:fixed 여도 부모가 display:none 이면 같이 사라진다.
       2026-08-31 부터 **가로 폰(높이 460 이하)에서 경기 중 ◀▶ 가 0×0** 이었다 — 이 게임의 핵심 조작을 누를 수가 없었다.
       tools/mobile_audit.mjs 는 0×0 버튼을 '안 보이는 버튼' 으로 걸러 **말없이 건너뛰었다**(2026-09-13 화면 순회 캡처로 발견).
       .prow 는 그대로 두면 된다 — 자식이 전부 fixed 라 흐름에서 자리를 차지하지 않는다. */
  }

  /* ⛔ 가로 폰 **메뉴**에서 [확인][취소] 무리가 가운데 바닥에 앉아 **언어 칩과 바닥 안내 글자를 덮었다**
     (2026-09-13 화면 순회 캡처 — 폰 점검은 경기 순간만 봐서 못 잡았다). 캔버스 옆 여백(가로 844 에서 122px)으로 뺀다:
     십자는 왼쪽 여백, 확인·취소는 오른쪽 여백. 경기(.play)는 위 규칙 그대로. */
  @media (max-height:460px) and (orientation:landscape){
    #pad:not(.play){ grid-template-columns:auto 1fr auto; }
    #pad:not(.play) #pad-act{ grid-column:3; justify-self:end; }
    #pad:not(.play) #pad-act .pbtn{ min-width:92px; }
  }

  /* ── 시작 화면 ─────────────────────────────────────────── */
  #gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(ellipse 80% 60% at 50% 28%,#16264a 0%,#0a1020 55%,#04050a 100%);
    color:#e6edf7;text-align:center;padding:20px;}
  /* 제목 — 중계 그래픽의 굵은 기울임 대문자 + 아래 두 색 띠 */
  #gate h1{font-size:clamp(28px,6vw,46px);font-weight:800;font-style:italic;letter-spacing:.04em;line-height:1;
    background:linear-gradient(180deg,#ffffff 0%,#ffe7a3 55%,#ffc53d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(0,0,0,.5));}
  #gate h1::after{content:'';display:block;width:84px;height:4px;margin:10px auto 0;border-radius:2px;
    background:linear-gradient(90deg,#ffc53d 0 55%,#3fc8ff 55% 100%);}
  /* 첫 화면 마크 — 어셋이 없으면 onerror 로 스스로 사라진다(깨진 아이콘 금지) */
  #gate #g-mark{width:min(34vw,150px);height:auto;image-rendering:auto;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));margin-bottom:2px;}
  #gate .sub{font-size:14px;font-weight:500;color:#9aa7bf;letter-spacing:.02em;}
  #gate .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px;}
  .cbtn{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:176px;
    padding:16px 22px;cursor:pointer;
    background:linear-gradient(180deg,rgba(38,50,78,.9),rgba(12,17,30,.9));
    border:1px solid rgba(150,180,235,.30);border-radius:16px;color:#eef3fb;font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 24px rgba(0,0,0,.4);
    transition:transform .08s,border-color .08s,box-shadow .08s;}
  .cbtn b{font-size:20px;font-weight:700;letter-spacing:.02em;}
  .cbtn i{font-style:normal;font-size:12px;font-weight:500;color:#8d9ab3;}
  .cbtn:hover,.cbtn.sel{border-color:#ffd75e;transform:translateY(-1px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px rgba(255,215,94,.22),0 12px 28px rgba(0,0,0,.45);}
  .cbtn:focus-visible{outline:2px solid #3fc8ff;outline-offset:3px;}
</style>
</head>
<body>
<div id="wrap"><div id="stack">
  <canvas id="bg"></canvas>
  <canvas id="game"></canvas>
  <canvas id="ui"></canvas>
</div></div>

<div id="pad">
  <div class="pgroup" id="pad-dir">
    <div class="pbtn sm" id="p-up">▲</div>
    <div class="prow">
      <div class="pbtn sm" id="p-left">◀</div>
      <div class="pbtn sm" id="p-right">▶</div>
    </div>
    <div class="pbtn sm" id="p-down">▼</div>
  </div>
  <div class="pgroup" id="pad-act">
    <div class="pbtn" id="p-act">확인</div>
    <div class="pbtn sm" id="p-back">취소</div>
  </div>
</div>
<div class="pbtn" id="p-pause">II</div>

<div id="gate">
  <img id="g-mark" src="assets/splash-mark.webp" alt=""
       onerror="this.style.display='none'">
  <h1>WORLD SPRINT CIRCUIT</h1>
  <div class="sub">좌·우를 번갈아 — 빠를수록 빠르다</div>
  <div class="sub" id="g-pick">어떻게 조작할까요?</div>
  <div class="row">
    <button class="cbtn" id="g-key"><b>키보드로</b><i>A / D · Space</i></button>
    <button class="cbtn" id="g-touch"><b>화면 버튼으로</b><i>손가락이나 마우스로</i></button>
  </div>
</div>
